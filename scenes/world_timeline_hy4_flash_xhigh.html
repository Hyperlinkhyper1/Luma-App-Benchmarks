<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Timeline of the World</title>
<style>
  body, html {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #000;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    user-select: none;
  }
  #stage {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
  }
  svg {
    display: block; width: 100%; height: 100%;
  }
  #ui {
    position: absolute; bottom: 0; left: 0; width: 100%; height: 170px;
    background: linear-gradient(to top, rgba(0,0,0,0.95), rgba(0,0,0,0.7));
    color: #fff; display: flex; flex-direction: column;
    padding: 15px 30px; box-sizing: border-box; z-index: 10;
    border-top: 1px solid #444;
  }
  #info {
    flex: 1; display: flex; flex-direction: column; justify-content: center;
    position: relative;
  }
  #title {
    margin: 0 0 5px 0; font-size: 26px; color: #ffcc00;
    text-shadow: 0 2px 4px rgba(0,0,0,0.8);
  }
  #chapter-date {
    margin: 0 0 8px 0; font-size: 16px; color: #aaa; font-weight: bold;
    text-transform: uppercase; letter-spacing: 1px;
  }
  #caption {
    margin: 0; font-size: 15px; line-height: 1.5; max-width: 850px; color: #ddd;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }
  #date-readout {
    position: absolute; right: 0; top: 10px; font-size: 22px; color: #0ff;
    font-family: monospace; font-weight: bold;
    text-shadow: 0 0 10px rgba(0,255,255,0.5);
  }
  #controls {
    display: flex; gap: 12px; margin-bottom: 12px; align-items: center;
  }
  button {
    background: rgba(50,50,60,0.8); color: #fff; border: 1px solid #666;
    padding: 6px 14px; cursor: pointer; border-radius: 4px; font-size: 13px;
    transition: background 0.2s;
  }
  button:hover { background: rgba(100,100,120,0.9); }
  button.active { background: #ffcc00; color: #000; border-color: #ffcc00; font-weight: bold; }
  
  #timeline-bar {
    position: relative; height: 34px; width: 100%;
    display: flex; border: 1px solid #555; cursor: pointer; background: #111;
    border-radius: 3px; overflow: hidden;
  }
  .segment {
    height: 100%; display: flex; align-items: center; justify-content: center;
    font-size: 11px; color: rgba(255,255,255,0.6); border-right: 1px solid #000;
    pointer-events: none; text-align: center; white-space: nowrap;
  }
  .tick {
    position: absolute; width: 2px; height: 12px; background: rgba(255,255,255,0.5);
    bottom: 0; cursor: pointer; z-index: 4;
  }
  .tick:hover { background: #fff; height: 20px; }
  #playhead {
    position: absolute; width: 2px; height: 44px; background: #ffcc00;
    top: -10px; left: 0%; pointer-events: none; z-index: 5;
    box-shadow: 0 0 6px #ffcc00;
  }
  #playhead::before {
    content: ''; position: absolute; top: -6px; left: -5px;
    border-left: 6px solid transparent; border-right: 6px solid transparent;
    border-top: 7px solid #ffcc00;
  }
</style>
</head>
<body>

<svg id="stage" viewBox="0 0 1000 600" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop id="skyGradStop1" offset="0%" stop-color="#000" />
      <stop id="skyGradStop2" offset="100%" stop-color="#111" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="blur">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect id="sky" width="1000" height="600" fill="url(#skyGrad)" />
  
  <g id="stars" opacity="0"></g>
  <g id="snowGroup" opacity="0"></g>
  <g id="embersGroup" opacity="0"></g>

  <g id="earthGroup">

    <circle id="oceans" cx="500" cy="300" r="248" fill="rgba(30,100,200,0.85)" opacity="0" />
    
    <g id="continents">
      <path id="blob0" fill="#463" />
      <path id="blob1" fill="#463" />
      <path id="blob2" fill="#463" />
    </g>

    <g id="lifeGlobe">

<div id="ui">

// --- LOGIC ---

function lerp(v1, v2, t) { return v1 + (v2 - v1) * t; }

function getKeyframeValue(keyframes, t, prop) {
  let k1 = keyframes[0], k2 = keyframes[keyframes.length-1];
  for(let i=0; i<keyframes.length-1; i++) {
    if(t >= keyframes[i].t && t <= keyframes[i+1].t) {
      k1 = keyframes[i]; k2 = keyframes[i+1]; break;
    }
  }
  let range = k2.t - k1.t;
  let ratio = range === 0 ? 0 : (t - k1.t) / range;
  if(prop === 'c') {
    return [
      Math.round(lerp(k1.c[0], k2.c[0], ratio)),
      Math.round(lerp(k1.c[1], k2.c[1], ratio)),
      Math.round(lerp(k1.c[2], k2.c[2], ratio))
    ];
  }
  return lerp(k1[prop], k2[prop], ratio);
}

function getColor(keyframes, t) {
  let c = getKeyframeValue(keyframes, t, 'c');
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}

function getOpacity(frames, t) {
  let k1 = frames[0], k2 = frames[frames.length-1];
  for(let i=0; i<frames.length-1; i++) {
    if(t >= frames[i].t && t <= frames[i+1].t) {
      k1 = frames[i]; k2 = frames[i+1]; break;
    }
  }
  let range = k2.t - k1.t;
  let ratio = range === 0 ? 0 : (t - k1.t) / range;
  return lerp(k1.v, k2.v, ratio);
}

function formatYear(y) {
  if (y <= -1_000_000_000) return (Math.abs(y) / 1_000_000_000).toFixed(2) + " billion years ago";
  if (y <= -1_000_000) return Math.round(Math.abs(y) / 1_000_000) + " million years ago";
  if (y <= -10_000) return Math.round(Math.abs(y) / 1_000) + ",000 years ago";
  if (y < 0) return Math.round(Math.abs(y)) + " BCE";
  return Math.round(y) + " CE";
}

function getBlobPath(cx, cy, r, offsets) {
  let pts = offsets.map((o, i) => {
    let a = i * Math.PI * 2 / offsets.length;
    return {x: cx + Math.cos(a)*r*o, y: cy + Math.sin(a)*r*o};
  });
  let d = `M ${(pts[0].x + pts[pts.length-1].x)/2} ${(pts[0].y + pts[pts.length-1].y)/2} `;
  for(let i=0; i<pts.length; i++) {
    let next = pts[(i+1)%pts.length];
    let mid = {x: (pts[i].x + next.x)/2, y: (pts[i].y + next.y)/2};
    d += `Q ${pts[i].x} ${pts[i].y} ${mid.x} ${mid.y} `;
  }
  return d + "Z";
}

function setArtifactOp(id, t, start, end, fade=2) {
  let op = 0;
  if(t >= start && t <= end) op = Math.min(1, (t - start)/fade, (end - t)/fade);
  document.getElementById(id).style.opacity = Math.max(0, op);
}

function update(t) {

    if(t >= c.start && t < c.end) { activeChap = c; break; }

    document.getElementById('title').innerText = activeChap.title;
    document.getElementById('chapter-date').innerText = activeChap.date;
    document.getElementById('caption').innerText = activeChap.text;
    lastChap = activeChap;
  }
  
  document.getElementById('playhead').style.left = (t / 180 * 100) + '%';
  document.getElementById('date-readout').innerText = formatYear(getKeyframeValue(yearKeyframes, t, 'y'));

  // Sky & Stars
  let skyStr = getColor(skyKeyframes, t);
  document.getElementById('skyGradStop1').setAttribute('stop-color', skyStr);
  let cArr = getKeyframeValue(skyKeyframes, t, 'c').map(c => Math.max(0, c - 40));
  document.getElementById('skyGradStop2').setAttribute('stop-color', `rgb(${cArr[0]},${cArr[1]},${cArr[2]})`);
  
  let brightness = cArr[0] + cArr[1] + cArr[2];
  let starOp = Math.max(0, 1 - brightness/300);
  if (t < 24) starOp = 0.8;
  if (t > 175) starOp = (t - 175) / 5;
  document.getElementById('stars').style.opacity = starOp;

  // Earth Transformation
  let earthScale = 1, earthAlpha = 1;
  if (t > 120) {
    earthScale = 1 + Math.min(1, (t - 120)/10) * 4;
    earthAlpha = 1 - Math.min(1, (t - 125)/5);
  }
  document.getElementById('earthGroup').setAttribute('transform', `translate(500, 300) scale(${earthScale}) translate(-350, -200)`);
  document.getElementById('earthGroup').style.opacity = earthAlpha;

  let r = t < 12 ? lerp(400, 250, t/12) : 250;
  document.getElementById('globeBase').setAttribute('r', r);
  document.getElementById('globeBase').setAttribute('fill', getColor(crustKeyframes, t));

  let oceanOp = 0;
  if(t>24 && t<48) oceanOp = (t-24)/24;
  else if(t>=48 && t<110) oceanOp = 1;
  else if(t>=110 && t<114) oceanOp = 1 - (t-110)/4;
  else if(t>=114 && t<120) oceanOp = (t-114)/6;
  else if(t>=120) oceanOp = 1;
  document.getElementById('oceans').style.opacity = oceanOp;

  let iceOp = 0;
  if(t>=48 && t<60) iceOp = (t-48)/12 * 0.9;
  else if(t>=60 && t<66) iceOp = 0.9;
  else if(t>=66 && t<72) iceOp = 0.9 - (t-66)/6 * 0.9;
  else if(t>=111 && t<114) iceOp = (t-111)/3 * 0.9;
  else if(t>=114 && t<120) iceOp = 0.9 - (t-114)/6 * 0.9;
  document.getElementById('ice') = document.getElementById('ice') || svg('circle', {id:'ice', cx:500, cy:300, r:250, fill:'#fff'}, document.getElementById('earthGroup'));
  document.getElementById('ice').style.opacity = iceOp;

  // Continents
  if(t >= 24) {
    let f1 = continentKeyframes[0], f2 = continentKeyframes[continentKeyframes.length-1];
    for(let i=0; i<continentKeyframes.length-1; i++) {
      if(t >= continentKeyframes[i].t && t <= continentKeyframes[i+1].t) {
        f1 = continentKeyframes[i]; f2 = continentKeyframes[i+1]; break;
      }
    }
    let ratio = (t - f1.t) / (f2.t - f1.t || 1);
    for(let b=0; b<3; b++) {
      let cx = lerp(f1.b[b][0], f2.b[b][0], ratio);
      let cy = lerp(f1.b[b][1], f2.b[b][1], ratio);
      let br = lerp(f1.b[b][2], f2.b[b][2], ratio);
      document.getElementById('blob'+b).setAttribute('d', getBlobPath(cx, cy, br, blobOffsets[b]));
      document.getElementById('blob'+b).style.fill = t >= 72 ? '#463' : '#532';
    }
  }

  // Life on Globe
  for(let [key, frames] of Object.entries(opacityKeyframes)) {
    document.getElementById(key).style.opacity = getOpacity(frames, t);
  }

  // Asteroid & Flash & Dust
  let astOp = 0, flashOp = 0, dustOp = 0;
  if(t>=5 && t<7) { astOp = Math.sin((t-5)*Math.PI/2); flashOp = astOp*0.5; }
  if(t>=110.5 && t<111.5) { astOp = Math.sin((t-110.5)*Math.PI); flashOp = astOp; }
  if(t>=111 && t<114) dustOp = (t-111)/3 * 0.85;
  else if(t>=114 && t<120) dustOp = 0.85 - (t-114)/6 * 0.85;
  
  document.getElementById('asteroid').style.opacity = astOp;
  document.getElementById('flash').style.opacity = flashOp;
  document.getElementById('dustOverlay').style.opacity = dustOp;

  // Landscape
  document.getElementById('landscapeGroup').style.opacity = Math.max(0, Math.min(1, (t - 125)/5));
  setArtifactOp('pyramids', t, 135, 147);
  setArtifactOp('colosseum', t, 141, 153);
  setArtifactOp('castle', t, 147, 159);
  setArtifactOp('ship', t, 153, 165);
  setArtifactOp('factory', t, 159, 174);
  setArtifactOp('plane', t, 165, 174);
  setArtifactOp('city', t, 171, 180);
  setArtifactOp('rocket', t, 175, 180);
  document.getElementById('cityLights').style.opacity = Math.max(0, (t - 177)/3);

  if(t > 153) document.getElementById('ship').setAttribute('transform', `translate(${100 + (t-153)*25}, 540)`);
  if(t > 165) document.getElementById('plane').setAttribute('transform', `translate(${-100 + (t-165)*60}, ${200 + Math.sin(t)*30})`);
  if(t > 175) {
    let rT = t - 175;
    document.getElementById('rocket').setAttribute('transform', `translate(800, ${480 - rT*70})`);
    document.getElementById('rocketTrail').style.strokeDashoffset = Math.max(0, 100 - rT*150);
  }

  // Particles
  let snowVisible = (t>=50 && t<70) || (t>=111 && t<118);
  let embersVisible = (t<24) || (t>=159 && t<174);
  document.getElementById('snowGroup').style.opacity = snowVisible ? 0.9 : 0;
  document.getElementById('embersGroup').style.opacity = embersVisible ? 0.8 : 0;
}

function loop(timestamp) {
  if(!lastTimestamp) lastTimestamp = timestamp;
  let dt = (timestamp - lastTimestamp) / 1000;
  lastTimestamp = timestamp;
  
  if(playing && !dragging) {
    currentTime += dt * speed;
    if(currentTime > 180) currentTime = 0;
  }
  
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy;
    if(p.y > 600) p.y = 0;
    if(p.y < 0) p.y = 600;
    if(p.x > 1000) p.x = 0;
    if(p.x < 0) p.x = 1000;
    p.el.setAttribute('cx', p.x);
    p.el.setAttribute('cy', p.y);
  });

  update(currentTime);
  requestAnimationFrame(loop);
}

// --- CONTROLS ---
const btnPlay = document.getElementById('btn-play');
btnPlay.onclick = () => {
  playing = !playing;
  btnPlay.innerText = playing ? "Pause" : "Play";
};

document.getElementById('btn-restart').onclick = () => { currentTime = 0; playing = true; btnPlay.innerText = "Pause"; };

document.querySelectorAll('.speed-btn').forEach(btn => {
  btn.onclick = () => {
    speed = parseFloat(btn.dataset.speed);
    document.querySelectorAll('.speed-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
});

window.addEventListener('keydown', e => {
  if(e.code === 'Space') {
    e.preventDefault();
    playing = !playing;
    btnPlay.innerText = playing ? "Pause" : "Play";
  }
  if(e.code === 'ArrowRight') {
    let next = chapters.find(c => c.start > currentTime + 0.5);
    if(next) currentTime = next.start;
  }
  if(e.code === 'ArrowLeft') {
    let prev = [...chapters].reverse().find(c => c.end < currentTime - 0.5);
    currentTime = prev ? prev.start : 0;
  }
});

function seek(e) {
  let rect = timelineBar.getBoundingClientRect();
  let x = e.clientX - rect.left;
  currentTime = Math.max(0, Math.min(180, (x / rect.width) * 180));
}

timelineBar.addEventListener('mousedown', e => { dragging = true; seek(e); });
window.addEventListener('mousemove', e => { if(dragging) seek(e); });
window.addEventListener('mouseup', () => { dragging = false; });

// Add ice element dynamically to preserve order
svg('circle', {id:'ice', cx:500, cy:300, r:250, fill:'#fff', opacity:0}, document.getElementById('earthGroup'));

requestAnimationFrame(loop);

</script>
</body>
