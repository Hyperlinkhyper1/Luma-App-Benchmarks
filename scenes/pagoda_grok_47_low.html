<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VOXEL GARDEN</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#c5d8e6;font-family:Georgia,"Times New Roman",serif}
canvas{display:block;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:16px;top:14px;z-index:2;color:#f7f1e6;pointer-events:none;text-shadow:0 1px 2px rgba(0,0,0,.45)}
#hud h1{margin:0 0 4px;font-size:18px;letter-spacing:.22em;font-weight:600}
#stats{font-family:ui-sans-serif,system-ui,sans-serif;font-size:13px;letter-spacing:.04em;opacity:.95}
#hint{font-family:ui-sans-serif,system-ui,sans-serif;font-size:12px;margin-top:2px;opacity:.85}
#controls{margin-top:10px;display:flex;gap:8px;align-items:center;pointer-events:auto}
#controls label{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;letter-spacing:.08em}
#tod{width:140px;accent-color:#C73E1D}
#pause{font-family:ui-sans-serif,system-ui,sans-serif;font-size:11px;letter-spacing:.06em;background:rgba(40,28,20,.55);color:#f7f1e6;border:1px solid rgba(247,241,230,.35);border-radius:4px;padding:4px 8px;cursor:pointer}
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud">
  <h1>VOXEL GARDEN</h1>
  <div id="stats">0k voxels | 0 FPS</div>
  <div id="hint">Click lanterns</div>
  <div id="controls">
    <label for="tod">DAYLIGHT</label>
    <input id="tod" type="range" min="0" max="1000" value="420">
    <button id="pause" type="button">Pause</button>
  </div>
</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const C = 0.5;
const NX = 144, NZ = 128, X0 = -72, Z0 = -64;
const VERM = 0xC73E1D, GOLD = 0xE8B86D, TEAK = 0x4A2C1A;
const JADE = 0x2D6A4F, JADE2 = 0x40916C, MOSS = 0x606C38;
const SAK1 = 0xFFB7C5, SAK2 = 0xFF8FAB, SAK3 = 0xFFE5EC;
const STONE = 0x9AA0A6, STONE2 = 0x7d848c, ROCK = 0x6e675f, ROCK2 = 0x8a8178;
const POND = 0x7ED6DF, FOAM = 0xf4fbff, SAND = 0xd9d0c1, SAND2 = 0xc4bbaa;
const BAM = 0x7fbf6a, BAMD = 0x3f6b45, PINE = 0x1e4d38, MAPLE = 0xb8432f;
const WILLOW = 0x52b788, INTER = 0xffc46b, LAN = 0xffd27a, BIRD = 0x2c333a;

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.18;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#d5e4ef');
scene.fog = new THREE.Fog('#d5e4ef', 70, 195);

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.2, 420);
camera.position.set(3, 6.2, 36);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(1, 8, -4);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI * 0.93;
controls.minDistance = 3;
controls.maxDistance = 150;
controls.autoRotateSpeed = 0.28;
controls.enabled = false;

const hemi = new THREE.HemisphereLight(0xd7e7f4, 0x4d6a45, 0.72);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xfff4e4, 1.45);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.near = 2;
sun.shadow.camera.far = 150;
sun.shadow.camera.left = -48;
sun.shadow.camera.right = 48;
sun.shadow.camera.top = 48;
sun.shadow.camera.bottom = -48;
sun.shadow.bias = -0.00035;
sun.shadow.normalBias = 0.04;
scene.add(sun);
scene.add(sun.target);
sun.target.position.set(0, 8, -2);

const H = new Int16Array(NX * NZ).fill(-1);
const waterSet = new Set();
const pathSet = new Set();
const zenSet = new Set();
const occ = new Set();
const cells = [];
let pagodaVoxelCount = 0;

function I(ix, iz) { return (ix - X0) + (iz - Z0) * NX; }
function inG(ix, iz) { return ix >= X0 && ix < X0 + NX && iz >= Z0 && iz < Z0 + NZ; }
function k3(x, y, z) { return x + ',' + y + ',' + z; }
function addCell(ix, iy, iz, hex, kind) {
  if (cells.length > 64000 && kind !== 1) return false;
  const k = k3(ix, iy, iz);
  if (occ.has(k)) return false;
  occ.add(k);
  cells.push([ix, iy, iz, hex, kind]);
  return true;
}
function has(ix, iy, iz) { return occ.has(k3(ix, iy, iz)); }

function masked(ix, iz) {
  const ax = 67, az = 58;
  let dx = ix / ax, dz = iz / az;
  if (ix < -8 && iz > 8) dx *= 1.04;
  const p = 3.35;
  const n = 0.055 * Math.sin(ix * 0.19) + 0.05 * Math.cos(iz * 0.16) + 0.035 * Math.sin((ix + iz) * 0.07);
  const r = Math.pow(Math.abs(dx), p) + Math.pow(Math.abs(dz), p);
  if (r > 1.015 + n) return false;
  if (Math.hypot(ix + 56, iz - 34) < 11) return false;
  if (Math.hypot(ix - 50, iz + 18) < 8) return false;
  if (Math.hypot(ix - 18, iz - 48) < 7 && ix > 8) return false;
  return true;
}

function ledge(ix, iz, h, rx, rz) {
  for (let x = ix - rx; x <= ix + rx; x++) for (let z = iz - rz; z <= iz + rz; z++) {
    if (!inG(x, z)) continue;
    if (Math.hypot((x - ix) / rx, (z - iz) / rz) <= 1) {
      const i = I(x, z);
      if (H[i] < h) H[i] = h;
    }
  }
}

for (let iz = Z0; iz < Z0 + NZ; iz++) {
  for (let ix = X0; ix < X0 + NX; ix++) {
    if (!masked(ix, iz)) continue;
    let h = 7;
    const edge = Math.hypot(ix / 66, iz / 58);
    if (Math.abs(ix - 2) <= 18 && Math.abs(iz + 30) <= 16) h = 16;
    else if (Math.abs(ix - 2) <= 24 && Math.abs(iz + 30) <= 22) h = 13;
    if (ix <= -20 && ix >= -62 && iz >= -24 && iz <= 22) h = Math.max(h, 11);
    if (ix >= 24 && ix <= 56 && iz >= -12 && iz <= 22) h = Math.max(h, 10);
    if (iz >= 0 && iz <= 8 && ix >= -14 && ix <= 16 && h < 13) h = 9;
    if (iz >= 14 && iz <= 30 && ix >= -16 && ix <= 18 && h < 12) h = 6;
    if (iz >= 32 && iz <= 50 && ix >= -8 && ix <= 24 && h < 12) h = 4;
    if (edge > 0.86) h = Math.min(h, 5);
    if (edge > 0.94) h = Math.min(h, 4);
    if (ix < -42 && iz > 18) h = Math.min(h, 5);
    H[I(ix, iz)] = h;
  }
}
ledge(64, 0, 5, 5, 3);
ledge(-66, 2, 6, 5, 4);
ledge(2, 57, 4, 4, 3);
ledge(-4, -58, 9, 5, 3);
ledge(40, -46, 8, 4, 3);
ledge(-48, 8, 11, 3, 6);

function carvePool(x0, z0, x1, z1, wy) {
  for (let x = x0; x <= x1; x++) for (let z = z0; z <= z1; z++) {
    if (!inG(x, z) || H[I(x, z)] < 0) continue;
    H[I(x, z)] = wy;
    waterSet.add(x + ',' + z);
  }
  for (let x = x0 - 1; x <= x1 + 1; x++) for (let z = z0 - 1; z <= z1 + 1; z++) {
    if (!inG(x, z) || H[I(x, z)] < 0) continue;
    if (waterSet.has(x + ',' + z)) continue;
    if (H[I(x, z)] < wy + 1) H[I(x, z)] = wy + 1;
  }
}
carvePool(-6, -8, 8, 4, 9);
carvePool(-12, 12, 12, 28, 6);
carvePool(0, 34, 16, 46, 3);
for (let z = 5; z <= 11; z++) {
  for (let x = 0; x <= 1; x++) if (inG(x, z) && H[I(x, z)] >= 0) {
    H[I(x, z)] = z < 8 ? 8 : 7;
    waterSet.add(x + ',' + z);
  }
}
for (let z = 29; z <= 33; z++) {
  for (let x = 6; x <= 8; x++) if (inG(x, z) && H[I(x, z)] >= 0) {
    H[I(x, z)] = 5;
    waterSet.add(x + ',' + z);
  }
}
for (let z = 47; z <= 54; z++) {
  for (let x = 7; x <= 10; x++) if (inG(x, z)) {
    if (H[I(x, z)] < 0) H[I(x, z)] = 3;
    H[I(x, z)] = Math.min(H[I(x, z)], 3);
    waterSet.add(x + ',' + z);
  }
}

function stampPath(x0, z0, x1, z1, w = 1) {
  const steps = Math.max(Math.abs(x1 - x0), Math.abs(z1 - z0), 1);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const x = Math.round(x0 + (x1 - x0) * t);
    const z = Math.round(z0 + (z1 - z0) * t);
    for (let dx = -w; dx <= w; dx++) for (let dz = -w; dz <= w; dz++) {
      if (Math.abs(dx) + Math.abs(dz) > w + 1) continue;
      pathSet.add((x + dx) + ',' + (z + dz));
    }
  }
}
function ramp(x0, z0, x1, z1, h0, h1) {
  const steps = Math.max(Math.abs(x1 - x0), Math.abs(z1 - z0), 1);
  for (let i = 0; i <= steps; i++) {
    const t = i / steps;
    const x = Math.round(x0 + (x1 - x0) * t);
    const z = Math.round(z0 + (z1 - z0) * t);
    const h = Math.round(h0 + (h1 - h0) * t);
    for (let dx = -1; dx <= 1; dx++) for (let dz = -1; dz <= 1; dz++) {
      const xx = x + dx, zz = z + dz;
      if (!inG(xx, zz) || H[I(xx, zz)] < 0) continue;
      if (waterSet.has(xx + ',' + zz)) continue;
      H[I(xx, zz)] = h;
      pathSet.add(xx + ',' + zz);
    }
  }
}
stampPath(0, 54, 0, 44, 2);
ramp(0, 44, 0, 36, 5, 5);
ramp(0, 36, -2, 30, 5, 7);
stampPath(-2, 30, -2, 11, 1);
ramp(-2, 11, -6, 4, 7, 9);
ramp(-6, 4, 4, -4, 9, 11);
ramp(4, -4, -2, -14, 11, 13);
ramp(-2, -14, 2, -24, 13, 16);
stampPath(2, -24, 2, -34, 2);
ramp(-6, 2, -22, 4, 9, 11);
stampPath(-22, 4, -36, 2, 1);
stampPath(-36, 2, -46, -2, 1);
stampPath(-46, -2, -52, 4, 1);
ramp(4, -2, 22, 2, 11, 10);
stampPath(22, 2, 36, 6, 1);
stampPath(36, 6, 50, 12, 1);
stampPath(50, 12, 50, 0, 1);

for (let x = 26; x <= 55; x++) for (let z = -8; z <= 15; z++) {
  if (!inG(x, z) || H[I(x, z)] < 0 || waterSet.has(x + ',' + z)) continue;
  zenSet.add(x + ',' + z);
  H[I(x, z)] = 10;
}

const rocks = [[34, 2], [44, 8], [38, -2]];
function zenHex(ix, iz) {
  let best = 1e9, bx = 0, bz = 0;
  for (const r of rocks) {
    const d = Math.hypot(ix - r[0], iz - r[1]);
    if (d < best) { best = d; bx = r[0]; bz = r[1]; }
  }
  if (best < 6.5) return (Math.floor(best + 0.15) % 2 === 0) ? SAND : SAND2;
  return ((iz + Math.floor(Math.sin(ix * 0.7) * 0.8)) & 1) ? SAND : SAND2;
}

function bottomY(ix, iz, top) {
  const r = Math.hypot(ix / 66, iz / 58);
  const n = Math.sin(ix * 0.17) * 0.6 + Math.cos(iz * 0.13) * 0.5;
  return Math.max(0, Math.min(top - 2, Math.floor(1 + r * 5 + n)));
}
function nearEdge(ix, iz) {
  if (!inG(ix, iz)) return true;
  for (const [dx, dz] of [[1, 0], [-1, 0], [0, 1], [0, -1]]) {
    const x = ix + dx, z = iz + dz;
    if (!inG(x, z) || H[I(x, z)] < 0) return true;
  }
  return false;
}

const N4 = [[1, 0], [-1, 0], [0, 1], [0, -1]];
for (let iz = Z0; iz < Z0 + NZ; iz++) {
  for (let ix = X0; ix < X0 + NX; ix++) {
    const t = H[I(ix, iz)];
    if (t < 0) continue;
    const b = bottomY(ix, iz, t);
    const water = waterSet.has(ix + ',' + iz);
    for (let y = b; y <= t; y++) {
      let exposed = y === t || y === b;
      if (!exposed) {
        for (const [dx, dz] of N4) {
          const x = ix + dx, z = iz + dz;
          if (!inG(x, z) || H[I(x, z)] < 0) { exposed = true; break; }
          const nt = H[I(x, z)];
          const nb = bottomY(x, z, nt);
          if (y > nt || y < nb) { exposed = true; break; }
        }
      }
      if (!exposed) continue;
      if (y === t && water) {
        addCell(ix, y, iz, POND, 3);
        continue;
      }
      let hex = ROCK;
      if (y === t) {
        const pk = ix + ',' + iz;
        if (pathSet.has(pk)) hex = ((ix + iz) & 1) ? STONE : STONE2;
        else if (zenSet.has(pk)) hex = zenHex(ix, iz);
        else {
          const n = Math.sin(ix * 0.41) * Math.cos(iz * 0.33);
          hex = n > 0.35 ? MOSS : n > -0.2 ? JADE2 : JADE;
          if ((ix * 3 + iz) % 17 === 0) hex = MOSS;
        }
      } else {
        const band = y % 5;
        hex = band === 0 ? 0x5c534c : band === 1 ? ROCK2 : band === 2 ? 0x7a726a : ROCK;
        if (nearEdge(ix, iz) && (ix + y) % 9 === 0) hex = MOSS;
        if (pathSet.has(ix + ',' + iz) || (inG(ix, iz) && pathSet.has((ix + 1) + ',' + iz))) hex = STONE2;
      }
      addCell(ix, y, iz, hex, 0);
    }
    if (nearEdge(ix, iz) && ((ix * 5 + iz * 3) % 11 === 0)) {
      const dir = N4[Math.abs(ix + iz) % 4];
      addCell(ix + dir[0], t - 1, iz + dir[1], TEAK, 0);
      addCell(ix + dir[0] * 2, t - 2, iz + dir[1] * 2, TEAK, 0);
    }
  }
}

function foam(ix, iy, iz) { addCell(ix, iy, iz, FOAM, 1); }
for (let z = 8; z <= 11; z++) for (let x = 0; x <= 1; x++) { foam(x, 8, z); foam(x, 7, z); }
for (let z = 30; z <= 33; z++) for (let x = 6; x <= 8; x++) { foam(x, 6, z); foam(x, 5, z); }
for (let z = 50; z <= 56; z++) {
  for (let x = 7; x <= 10; x++) {
    for (let y = 3; y >= -1; y--) foam(x, y, z + (3 - y));
  }
}
for (let x = -8; x <= 10; x++) for (let z = -10; z <= 6; z++) {
  if (waterSet.has(x + ',' + z)) continue;
  if (Math.hypot(x - 1, z + 2) < 3.2 && inG(x, z) && H[I(x, z)] >= 0) {
    addCell(x, 10, z, ROCK, 1);
    if ((x + z) & 1) addCell(x, 11, z, ROCK2, 1);
  }
}

function buildIsland(cx, cz, base, rx, rz, top, style) {
  for (let x = -rx; x <= rx; x++) for (let z = -rz; z <= rz; z++) {
    const e = Math.hypot(x / rx, z / rz);
    if (e > 1) continue;
    const th = Math.max(1, top - Math.floor(e * 3));
    const b = style === 0 ? -3 - Math.floor((1 - e) * 3) : -2 - Math.floor((1 - e) * 2);
    for (let y = b; y <= th; y++) {
      const edge = e > 0.72 || y === th || y === b;
      let side = false;
      if (!edge) {
        const e2 = Math.hypot((Math.abs(x) + 1) / rx, z / rz);
        if (e2 > 1 || y === b + 1) side = true;
      }
      if (!(edge || side || ((x + z + y) & 3) === 0)) continue;
      const hex = y === th ? (style ? JADE2 : MOSS) : ((y & 1) ? ROCK : ROCK2);
      addCell(cx + x, base + y, cz + z, hex, 0);
    }
    if (e < 0.45 && (x + z) % 5 === 0) {
      for (let y = 1; y <= 4 + (Math.abs(x) % 3); y++) addCell(cx + x, base + top + y, cz + z, BAMD, 2);
    }
  }
}
buildIsland(-78, -18, 8, 12, 8, 3, 0);
buildIsland(76, 16, 14, 8, 12, 2, 1);

const PX = 2, PZ = -30;
const baseY = 16;
let py = baseY + 1;
for (let layer = 0; layer < 3; layer++) {
  const w = 16 - layer;
  for (let x = -w; x <= w; x++) for (let z = -w; z <= w; z++) {
    const edge = Math.abs(x) === w || Math.abs(z) === w;
    if (layer === 2 || edge || Math.abs(x) > w - 2 || Math.abs(z) > w - 2) {
      if (addCell(PX + x, py + layer, PZ + z, layer === 2 ? STONE : STONE2, 1)) pagodaVoxelCount++;
    }
  }
}
for (let s = 0; s < 5; s++) {
  const x0 = PX - (5 - s);
  for (let z = 0; z < 4; z++) if (addCell(x0 + s, baseY + 1 + z, PZ + 17, STONE, 1)) pagodaVoxelCount++;
}
py = baseY + 4;
const stories = [
  { w: 11, body: 7, roof: 3 },
  { w: 9, body: 6, roof: 3 },
  { w: 7, body: 5, roof: 3 },
  { w: 6, body: 5, roof: 2 },
  { w: 4, body: 4, roof: 2 }
];
const floorYs = [];
const doorSpecs = [];
for (let s = 0; s < stories.length; s++) {
  const st = stories[s];
  const w = st.w;
  floorYs.push(py);
  for (let x = -w; x <= w; x++) for (let z = -w; z <= w; z++) {
    if (Math.abs(x) > w - 2 && Math.abs(z) > w - 2) continue;
    if (addCell(PX + x, py, PZ + z, TEAK, 1)) pagodaVoxelCount++;
  }
  for (let y = 1; y <= st.body; y++) {
    for (let x = -w; x <= w; x++) for (let z = -w; z <= w; z++) {
      const edge = Math.abs(x) === w || Math.abs(z) === w;
      if (!edge) {
        if (y > 1 && y < 5 && Math.abs(x) <= 1 && Math.abs(z) <= 1) {
          if (addCell(PX + x, py + y, PZ + z, INTER, 4)) pagodaVoxelCount++;
        }
        continue;
      }
      const door = y >= 1 && y <= 4 && (
        ((z === w || z === -w) && Math.abs(x) <= 1) ||
        ((x === w || x === -w) && Math.abs(z) <= 1)
      );
      if (door) continue;
      const corner = Math.abs(x) === w && Math.abs(z) === w;
      const hex = corner ? VERM : (y === st.body ? GOLD : TEAK);
      if (addCell(PX + x, py + y, PZ + z, hex, 1)) pagodaVoxelCount++;
    }
  }
  doorSpecs.push({ w, y0: py + 1, floor: s });
  const ry = py + st.body;
  for (let x = -w - 1; x <= w + 1; x++) for (let z = -w - 1; z <= w + 1; z++) {
    if (Math.abs(x) === w + 1 || Math.abs(z) === w + 1) {
      if ((x + z) % 2 === 0) {
        if (addCell(PX + x, ry, PZ + z, TEAK, 1)) pagodaVoxelCount++;
      }
    }
  }
  for (let L = 0; L < st.roof; L++) {
    const rw = w + 3 - L;
    for (let x = -rw; x <= rw; x++) for (let z = -rw; z <= rw; z++) {
      const corner = Math.abs(x) >= rw - 1 && Math.abs(z) >= rw - 1;
      if (corner && L < st.roof - 1) continue;
      const ridge = L === st.roof - 1 && (Math.abs(x) <= 1 || Math.abs(z) <= 1);
      const hex = ridge ? GOLD : (L === 0 ? JADE : JADE2);
      if (addCell(PX + x, ry + 1 + L, PZ + z, hex, 1)) pagodaVoxelCount++;
    }
  }
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const rw = w + 3;
    if (addCell(PX + sx * rw, ry + st.roof + 1, PZ + sz * rw, JADE2, 1)) pagodaVoxelCount++;
    if (addCell(PX + sx * rw, ry + st.roof + 2, PZ + sz * rw, GOLD, 1)) pagodaVoxelCount++;
  }
  for (let i = -w; i <= w; i += 2) {
    if (addCell(PX + i, ry, PZ + w + 2, TEAK, 1)) pagodaVoxelCount++;
    if (addCell(PX + i, ry, PZ - w - 2, TEAK, 1)) pagodaVoxelCount++;
    if (addCell(PX + w + 2, ry, PZ + i, TEAK, 1)) pagodaVoxelCount++;
    if (addCell(PX - w - 2, ry, PZ + i, TEAK, 1)) pagodaVoxelCount++;
  }
  py = ry + 1 + st.roof;
}
for (let i = 0; i < 8; i++) {
  const hex = i % 2 ? GOLD : VERM;
  if (addCell(PX, py + i, PZ, hex, 1)) pagodaVoxelCount++;
  if (i === 2 || i === 5) {
    for (let a = -1; a <= 1; a++) for (let b = -1; b <= 1; b++) {
      if (Math.abs(a) + Math.abs(b) === 1) {
        if (addCell(PX + a, py + i, PZ + b, GOLD, 1)) pagodaVoxelCount++;
      }
    }
  }
}
if (addCell(PX, py + 8, PZ, GOLD, 1)) pagodaVoxelCount++;

const doorMat = new THREE.MeshStandardMaterial({ color: VERM, roughness: 0.62, metalness: 0.08 });

  for (let i = 0; i < list.length; i++) {
    dummy.position.set(list[i][0], list[i][1], list[i][2]);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);

  mesh.frustumCulled = false;
  scene.add(mesh);
  return mesh;
}

function sunElev(t) { return Math.sin((t - 0.25) * Math.PI * 2); }
function mixSky(t, out) {
  const e = sunElev(t);
  const day = new THREE.Color('#d7e7f3');
  const warm = new THREE.Color('#f0d7bf');
  const dusk = new THREE.Color('#e08a62');
  const night = new THREE.Color('#151c2c');
  if (e > 0.35) out.copy(day).lerp(warm, 0.28);
  else if (e > 0.05) out.copy(dusk).lerp(day, (e - 0.05) / 0.3);
  else if (e > -0.08) out.copy(night).lerp(dusk, (e + 0.08) / 0.13);
  else out.copy(night);
}

  const az = tod * Math.PI * 2;
  const el = Math.max(-0.15, e) * 0.95;
  sun.position.set(Math.cos(az) * 60, 18 + Math.sin(el) * 50, Math.sin(az) * 60);
  const night = e < 0.1;
  for (let i = 0; i < lanterns.length; i++) {
    const L = lanterns[i];
    if (!L.manual) L.on = night;
    const flick = L.on ? (0.82 + 0.18 * Math.sin(time * 16 + i * 2.2) * (0.65 + 0.35 * Math.sin(time * 27 + i))) : 0;
    L.light.intensity = L.on ? L.base * flick : 0;
    L.head.material.emissiveIntensity = L.on ? 0.45 + flick : 0.12;
  }
  interior.intensity = 0.35 + (night ? 0.45 : 0.15);

  if (matF.userData.shader) matF.userData.shader.uniforms.uTime.value = time;
  if (waterMesh) {
    for (let i = 0; i < waterBase.length; i++) {
      const p = waterBase[i];
      dummy.position.set(p[0], p[1] + Math.sin(time * 1.8 + p[0] * 0.7 + p[2] * 0.5) * 0.035, p[2]);
      dummy.scale.set(1, 1, 1);
      dummy.rotation.set(0, 0, 0);
      dummy.updateMatrix();
      waterMesh.setMatrixAt(i, dummy.matrix);
    }
    waterMesh.instanceMatrix.needsUpdate = true;
  }
  for (let i = 0; i < koi.length; i++) {
    const f = koi[i];
    f.a += dt * f.sp;
    const x = f.cx + Math.cos(f.a) * f.rx;
    const z = f.cz + Math.sin(f.a) * f.rz;
    const y = 6 * C + 0.15 + Math.sin(time * 2 + i) * 0.05;
    const nx = f.cx + Math.cos(f.a + 0.1) * f.rx;
    const nz = f.cz + Math.sin(f.a + 0.1) * f.rz;
    const ang = Math.atan2(nx - x, nz - z);
    const col = new THREE.Color(f.col);
    for (let p = 0; p < 4; p++) {
      const off = (p - 1.5) * 0.28;
      dummy.position.set(x - Math.sin(ang) * off, y + (p === 3 ? 0.08 : 0), z - Math.cos(ang) * off);
      dummy.rotation.set(0, ang, 0);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      const idx = i * 4 + p;
      koiMesh.setMatrixAt(idx, dummy.matrix);
      koiMesh.setColorAt(idx, p === 2 ? new THREE.Color(0xf7f3ea) : col);
    }
  }
  koiMesh.instanceMatrix.needsUpdate = true;
  if (koiMesh.instanceColor) koiMesh.instanceColor.needsUpdate = true;
  for (let i = 0; i < 8; i++) {
    const a = time * 0.7 + i;
    dummy.position.set((-2 + Math.cos(a) * (2.2 + i * 0.15)) * 0.9, 6 * C + 0.22, 20 * C + Math.sin(a) * 2.4);
    dummy.rotation.set(0, a, 0);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    ripMesh.setMatrixAt(i, dummy.matrix);
  }
  ripMesh.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < PETALS; i++) {
    const p = petals[i];
    p.y -= dt * p.sp;
    p.x += Math.sin(time + i) * dt * 0.25;
    p.z += Math.cos(time * 0.8 + i) * dt * 0.2;
    if (p.y < 2.2) { p.y = p.top; p.x = p.ox + (Math.random() - 0.5) * 3; p.z = p.oz + (Math.random() - 0.5) * 3; }
    dummy.position.set(p.x, p.y, p.z);
    dummy.rotation.set(time + i, time * 0.4, 0);
    dummy.scale.set(1, 1, 1);
    dummy.updateMatrix();
    petalMesh.setMatrixAt(i, dummy.matrix);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < BIRDS; i++) {
    const b = birds[i];
    b.a += dt * b.sp;
    const x = Math.cos(b.a) * b.r;
    const z = Math.sin(b.a) * b.r * 0.85;
    const y = b.y + Math.sin(time * 1.4 + i) * 0.6;
    for (let w = 0; w < 3; w++) {
      const flap = Math.sin(time * 8 + i) * 0.35;
      const ox = w === 0 ? 0 : (w === 1 ? 0.32 : -0.32);
      const oy = w === 0 ? 0 : flap;
      dummy.position.set(x + ox, y + oy, z);
      dummy.rotation.set(0, -b.a, w === 0 ? 0 : flap);
      dummy.scale.set(1, 1, 1);
      dummy.updateMatrix();
      birdMesh.setMatrixAt(i * 3 + w, dummy.matrix);
    }
  }
  birdMesh.instanceMatrix.needsUpdate = true;
  for (let i = 0; i < MIST; i++) {
    const y = ((time * 0.45 + i * 0.37) % 3);
    dummy.position.set(4.2 + Math.sin(i * 2.1) * 1.4, 0.2 + y, 27 + (i % 5) * 0.35);
    dummy.scale.set(1 + y * 0.3, 1, 1);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    mistMesh.setMatrixAt(i, dummy.matrix);
  }
  mistMesh.instanceMatrix.needsUpdate = true;
  for (const d of doors) {
    d.userData.open += (d.userData.target - d.userData.open) * Math.min(1, dt * 6);
    d.rotation.y = d.userData.swing * d.userData.open * 1.15;
  }

  if (!introDone) {
    introT += dt;
    const u = Math.min(1, introT / 2.5);
    const t = u < 0.5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
    camera.position.lerpVectors(camFrom, camTo, t);
    controls.target.lerpVectors(lookFrom, lookTo, t);
    if (u >= 1) {
      introDone = true;
      controls.enabled = true;
      camera.position.copy(camTo);
      controls.target.copy(lookTo);
    }
  } else {
    if (performance.now() - lastInteract > 3500) controls.autoRotate = true;
    controls.update();
  }

  fpsAcc += dt; fpsN++;
  if (fpsAcc >= 0.3) {
    fps = fpsN / fpsAcc;
    fpsAcc = 0; fpsN = 0;
    statsEl.textContent = `${Math.round(voxelCount / 1000)}k voxels | ${Math.round(fps)} FPS`;
  }
  renderer.render(scene, camera);
}
addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
});
animate();
</script>
