<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Voxel Garden</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:system-ui,sans-serif;}
  #hud{position:fixed;top:12px;left:12px;color:#fff;z-index:10;text-shadow:0 1px 3px #000;background:rgba(0,0,0,.35);padding:8px 12px;border-radius:8px;font-size:13px;line-height:1.5;}
  #hud h1{margin:0 0 4px;font-size:16px;}
  #controls{position:fixed;bottom:12px;left:12px;color:#fff;z-index:10;background:rgba(0,0,0,.35);padding:8px 12px;border-radius:8px;font-size:13px;}
  #controls input{width:180px;}
  canvas{display:block;}
</style>
</head>
<body>
<div id="hud">
  <h1>VOXEL GARDEN</h1>
  <div id="stats">0 voxels | 0 FPS</div>
  <div>Click lanterns</div>
</div>
<div id="controls">
  <label>Time <input id="timeSlider" type="range" min="0" max="1" step="0.001" value="0.3"></label>
  <button id="pauseBtn">Pause</button>
</div>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(55, innerWidth/innerHeight, 0.1, 200);
camera.position.set(40,35,40);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping=true;
controls.autoRotate=true;
controls.autoRotateSpeed=0.4;

const hemi = new THREE.HemisphereLight(0x87ceeb,0x3a2a1a,0.6);
scene.add(hemi);
const dir = new THREE.DirectionalLight(0xffffff,1.2);
dir.castShadow=true;
dir.shadow.mapSize.set(2048,2048);
dir.shadow.camera.near=1;dir.shadow.camera.far=120;
dir.shadow.camera.left=-40;dir.shadow.camera.right=40;dir.shadow.camera.top=40;dir.shadow.camera.bottom=-40;
scene.add(dir);

const colors = {
  vermillion:0xC73E1D, gold:0xE8B86D, teak:0x4A2C1A, jade:0x2D6A4F, jade2:0x40916C,
  sakura:0xFFB7C5, sakura2:0xFF8FAB, sakura3:0xFFE5EC, stone:0x9AA0A6, pond:0x7ED6DF, moss:0x606C38
};
const groups = {};
function getGroup(c){
  if(!groups[c]){ const m=new THREE.MeshStandardMaterial({color:c,roughness:.7,metalness:.05}); const mesh=new THREE.InstancedMesh(new THREE.BoxGeometry(1,1,1),m,0); mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage); mesh.castShadow=true; mesh.receiveShadow=true; scene.add(mesh); groups[c]=mesh; }
  return groups[c];
}
const instances = {};
function addVoxel(x,y,z,c){
  if(!instances[c]) instances[c]=[];
  instances[c].push(new THREE.Matrix4().makeTranslation(x,y,z));
}
function finalize(){
  let total=0;
  for(const c in instances){
    const arr=instances[c];
    const g=getGroup(parseInt(c));
    g.count=arr.length;
    for(let i=0;i<arr.length;i++) g.setMatrixAt(i,arr[i]);
    g.instanceMatrix.needsUpdate=true;
    total+=arr.length;
  }
  return total;
}

function isIsland(x,z){
  const r=Math.sqrt(x*x+z*z);
  return r<24 + Math.sin(x*0.3)*2 + Math.cos(z*0.4)*2;
}
for(let x=-32;x<=32;x++) for(let z=-32;z<=32;z++){
  if(!isIsland(x,z)) continue;
  const h = Math.floor(3 + Math.sin(x*0.2)*1.5 + Math.cos(z*0.25)*1.2);
  for(let y=0;y<=h;y++){
    const col = (y===h)? (Math.random()<.3?colors.moss:colors.stone) : (Math.random()<.1?colors.stone:colors.teak);
    addVoxel(x,y,z,col);
  }
}
for(let x=-8;x<=8;x++) for(let z=8;z<=20;z++){
  if(Math.sqrt(x*x+(z-14)**2)<7) addVoxel(x,1,z,colors.pond);
}
for(let y=1;y<=6;y++) addVoxel(24,y,-2,colors.pond);

const pagodaFloors=5;
let py=3;
for(let f=0;f<pagodaFloors;f++){
  const size=9-f*1.2;
  for(let x=-size;x<=size;x++) for(let z=-size;z<=size;z++){
    addVoxel(x,py,z,colors.vermillion);
    addVoxel(x,py+1,z,colors.vermillion);
  }
  for(let r=0;r<3;r++){
    const rs=size+1.5-r;
    for(let x=-rs;x<=rs;x++) for(let z=-rs;z<=rs;z++){
      if(Math.abs(x)===Math.floor(rs) || Math.abs(z)===Math.floor(rs) || r===2)
        addVoxel(x,py+2+r,z, (r%2?colors.jade:colors.jade2));
    }
  }
  addVoxel(0,py+6,0,colors.gold);
  py+=4;
}
for(let y=py;y<py+6;y++) addVoxel(0,y,0,colors.gold);

function tree(x,z,type){
  for(let y=0;y<6;y++) addVoxel(x,y,z,colors.teak);
  for(let dx=-2;dx<=2;dx++) for(let dz=-2;dz<=2;dz++) for(let dy=0;dy<2;dy++){
    if(dx*dx+dz*dz+dy*dy<6) addVoxel(x+dx,6+dy,z+dz, type==='sakura'?colors.sakura:(type==='pine'?colors.jade:(type==='maple'?colors.sakura2:colors.jade2)));
  }
}
tree(-20,5,'sakura'); tree(-12,-10,'sakura'); tree(18,12,'sakura');
tree(22,-18,'pine'); tree(-25,-15,'pine');
tree(15,20,'maple'); tree(-5,22,'maple');
tree(8,-22,'willow');

const lanterns=[];
for(const p of [[-15,3,0],[15,3,0],[0,3,-15],[0,3,15]]){
  addVoxel(p[0],p[1],p[2],colors.gold);
  const pl=new THREE.PointLight(0xffaa55,1,12);
  pl.position.set(p[0],p[1]+1,p[2]);
  pl.castShadow=true;
  scene.add(pl);
  lanterns.push(pl);
}

for(let y=0;y<5;y++){addVoxel(-28,y,-28,colors.vermillion);addVoxel(-22,y,-28,colors.vermillion);}
addVoxel(-27,5,-28,colors.vermillion);addVoxel(-26,5,-28,colors.vermillion);addVoxel(-25,5,-28,colors.vermillion);addVoxel(-24,5,-28,colors.vermillion);addVoxel(-23,5,-28,colors.vermillion);

for(let x=-30;x<=30;x+=2) addVoxel(x,1,30,colors.teak);

for(const p of [[-10,1,10],[10,1,-10]]){ addVoxel(p[0],p[1],p[2],colors.stone); addVoxel(p[0],p[1]+1,p[2],colors.stone);}

for(let i=0;i<40;i++){
  const x=Math.floor(Math.random()*50-25), z=Math.floor(Math.random()*50-25);
  addVoxel(x,1,z, Math.random()<.5?colors.sakura:colors.sakura2);
}

const voxelCount = finalize();

const petalGeo=new THREE.PlaneGeometry(.5,.5);
const petalMat=new THREE.MeshStandardMaterial({color:0xFFB7C5,side:THREE.DoubleSide});
const petals=new THREE.InstancedMesh(petalGeo,petalMat,200);
scene.add(petals);
const petalMats=[];
for(let i=0;i<200;i++) petalMats.push({x:Math.random()*60-30,y:Math.random()*20+5,z:Math.random()*60-30,s:Math.random()*.02+.01});

const birdGeo=new THREE.BoxGeometry(.6,.2,.6);
const birdMat=new THREE.MeshStandardMaterial({color:0x333333});
const birds=new THREE.InstancedMesh(birdGeo,birdMat,8);
scene.add(birds);
const birdState=[];
for(let i=0;i<8;i++) birdState.push({a:Math.random()*Math.PI*2,r:20+Math.random()*10,h:15+Math.random()*10});

const koiGeo=new THREE.BoxGeometry(.8,.3,.4);
const koiMat=new THREE.MeshStandardMaterial({color:0xff6600});
const koi=new THREE.InstancedMesh(koiGeo,koiMat,6);
scene.add(koi);
const koiState=[];
for(let i=0;i<6;i++) koiState.push({a:i*Math.PI/3,r:5,h:1.2});

const rippleGeo=new THREE.RingGeometry(.5,1,16);
const rippleMat=new THREE.MeshBasicMaterial({color:0xffffff,transparent:true,opacity:.4,side:THREE.DoubleSide});
const ripples=new THREE.Mesh(rippleGeo,rippleMat);
ripples.rotation.x=-Math.PI/2; ripples.position.set(0,1.3,14); scene.add(ripples);

let timeOfDay=0.3;
let paused=false;
const slider=document.getElementById('timeSlider');
const pauseBtn=document.getElementById('pauseBtn');
slider.addEventListener('input',e=>{timeOfDay=parseFloat(e.target.value);});
pauseBtn.addEventListener('click',()=>{paused=!paused;pauseBtn.textContent=paused?'Resume':'Pause';});

const raycaster=new THREE.Raycaster();
const mouse=new THREE.Vector2();
renderer.domElement.addEventListener('click',e=>{
  mouse.x=(e.clientX/innerWidth)*2-1;
  mouse.y=-(e.clientY/innerHeight)*2+1;
  raycaster.setFromCamera(mouse,camera);
  for(let i=0;i<lanterns.length;i++){
    const d=raycaster.ray.distanceToPoint(lanterns[i].position);
    if(d<1.5){ lanterns[i].intensity = lanterns[i].intensity>0?0:1.2; return;}
  }
});

let introT=0;
const introStart=new THREE.Vector3(-28,8,-28);
const introEnd=new THREE.Vector3(40,35,40);
camera.position.copy(introStart);

let last=performance.now();
let frames=0; let fps=60;
function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();
  const dt=(now-last)/1000; last=now;
  frames++;
  if(frames%10===0) fps=Math.round(1/dt);
  if(introT<1){ introT+=dt/2.5; if(introT>1)introT=1; camera.position.lerpVectors(introStart,introEnd,introT); controls.target.set(0,5,0);}
  if(!paused){ timeOfDay=(timeOfDay+dt/90)%1; slider.value=timeOfDay; }
  const ang=timeOfDay*Math.PI*2;
  dir.position.set(Math.cos(ang)*40, Math.sin(ang)*40+10, Math.sin(ang*0.5)*20);
  dir.intensity=Math.max(0.1, Math.sin(ang)*0.8+0.4);
  scene.background=new THREE.Color().setHSL(0.6,0.5,0.1+0.4*Math.max(0,Math.sin(ang)));
  hemi.intensity=0.3+0.4*Math.max(0,Math.sin(ang));
  const dusk = timeOfDay>0.7||timeOfDay<0.25;
  for(const l of lanterns){ if(l.intensity===0) continue; l.intensity = dusk? (1+Math.sin(now*0.01)*0.15):0.2; }
  const m=new THREE.Matrix4();
  for(let i=0;i<200;i++){
    const p=petalMats[i];
    p.y-=p.s; p.x+=Math.sin(now*0.001+i)*0.01;
    if(p.y<0){p.y=20; p.x=Math.random()*60-30; p.z=Math.random()*60-30;}
    m.makeTranslation(p.x,p.y,p.z);
    petals.setMatrixAt(i,m);
  }
  petals.instanceMatrix.needsUpdate=true;
  for(let i=0;i<8;i++){
    const b=birdState[i];
    b.a+=dt*0.5;
    const x=Math.cos(b.a)*b.r, z=Math.sin(b.a)*b.r;
    const m2=new THREE.Matrix4().makeTranslation(x,b.h,z);
    birds.setMatrixAt(i,m2);
  }
  birds.instanceMatrix.needsUpdate=true;
  for(let i=0;i<6;i++){
    const k=koiState[i];
    k.a+=dt*0.8;
    const x=Math.cos(k.a)*k.r, z=Math.sin(k.a)*k.r;
    const m3=new THREE.Matrix4().makeTranslation(x,k.h,z);
    koi.setMatrixAt(i,m3);
  }
  koi.instanceMatrix.needsUpdate=true;
  ripples.scale.setScalar(1+Math.sin(now*0.003)*0.2);
  ripples.material.opacity=0.3+Math.sin(now*0.003)*0.1;

  controls.update();
  renderer.render(scene,camera);

  document.getElementById('stats').textContent = voxelCount+' voxels | '+fps+' FPS';
  window.__VOXEL__ = { voxelCount, fps, pagodaFloors, timeOfDay };
}
animate();

window.addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
