<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Pagoda Benchmark</title>
    <style>
        body { margin: 0; overflow: hidden; }
        canvas { display: block; }
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            color: #fff;
            font-family: Arial, sans-serif;
            background: rgba(0, 0, 0, 0.5);
            padding: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <div id="hud">
        VOXEL GARDEN<br>
        <span id="voxelCount">0</span> voxels | <span id="fps">0</span> FPS<br>
        Click lanterns
    </div>
    <script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
    <script type="importmap">
        {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
    </script>
    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GUI } from 'three/addons/libs/dat.gui.module.js';

        let scene, camera, renderer, controls;
        let voxelCount = 0;
        let fps = 0;
        let pagodaFloors = 5;
        let timeOfDay = 0;

        window.__VOXEL__ = {
            get voxelCount() { return voxelCount; },
            get fps() { return fps; },
            get pagodaFloors() { return pagodaFloors; },
            get timeOfDay() { return timeOfDay; }
        };

        init();
        animate();

        function init() {
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.set(0, 50, 100);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.autoRotate = true;
            controls.autoRotateSpeed = 0.5;

            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(100, 100, 50);
            directionalLight.castShadow = true;
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 500;
            scene.add(directionalLight);

            const hemisphereLight = new THREE.HemisphereLight(0xffffff, 0x0000ff, 0.6);
            scene.add(hemisphereLight);

            // Add lanterns
            const lanterns = [];
            for (let i = 0; i < 4; i++) {
                const lanternLight = new THREE.PointLight(0xffffff, 1, 5);
                lanternLight.position.set(Math.random() * 100 - 50, 10, Math.random() * 100 - 50);
                lanternLight.castShadow = true;
                scene.add(lanternLight);
                lanterns.push(lanternLight);
            }

            // Add pagoda
            const pagodaGeometry = new THREE.BoxGeometry(10, 30, 10);
            const pagodaMaterial = new THREE.MeshStandardMaterial({ color: 0xC73E1D });
            const pagoda = new THREE.InstancedMesh(pagodaGeometry, pagodaMaterial, pagodaFloors);
            for (let i = 0; i < pagodaFloors; i++) {
                const matrix = new THREE.Matrix4();
                matrix.makeTranslation(0, i * 6, 0);
                pagoda.setMatrixAt(i, matrix);
            }
            scene.add(pagoda);

            // Add terrain
            const terrainGeometry = new THREE.BoxGeometry(1, 1, 1);
            const terrainMaterial = new THREE.MeshStandardMaterial({ color: 0x9AA0A6 });
            const terrain = new THREE.InstancedMesh(terrainGeometry, terrainMaterial, 50000);
            for (let i = 0; i < 50000; i++) {
                const matrix = new THREE.Matrix4();
                matrix.makeTranslation(Math.random() * 144 - 72, 0, Math.random() * 128 - 64);
                terrain.setMatrixAt(i, matrix);
            }
            scene.add(terrain);

            // Add HUD
            const hud = document.getElementById('hud');
            function updateHUD() {
                hud.querySelector('#voxelCount').innerText = voxelCount;
                hud.querySelector('#fps').innerText = fps.toFixed(2);
            }
            updateHUD();

            // Add GUI for time of day control
            const gui = new GUI();
            gui.add(window.__VOXEL__, 'timeOfDay', 0, 24).name('Time of Day');

            window.addEventListener('resize', onWindowResize);
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            timeOfDay += 0.01;
            if (timeOfDay > 24) timeOfDay = 0;

            controls.update();

            fps = 1 / (performance.now() - (performance.now() - 1000) / 1000);
            voxelCount = 50000 + pagodaFloors * 800; // Example calculation

            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
