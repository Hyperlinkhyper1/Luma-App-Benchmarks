<!DOCTYPE html>
<html lang="en">
<head>

<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Voxel Garden — Spring Festival at the Five-Story Pagoda</title>
<style>

  #timeSlider::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;

<body>
<div id="vignette"></div>
<div id="hud">
  <div class="panel">
    <div class="title">VOXEL GARDEN</div>
    <div class="sub">Gojū-no-tō &nbsp;·&nbsp; Spring Festival</div>
    <div class="stats"><b id="voxelCount">— voxels</b> &nbsp;|&nbsp; <b id="fps">60 FPS</b></div>
    <div class="hint">Click lanterns &nbsp;·&nbsp; Click pagoda floors to open doors</div>
    <div class="ctl">
      <button id="pauseBtn" title="pause / resume day cycle">❚❚</button>
      <input id="timeSlider" type="range" min="0" max="1000" value="335"/>
      <span id="clock">08:02</span>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   VOXEL GARDEN — Spring Festival at the Five-Story Pagoda
   ============================================================ */

const TAU = Math.PI * 2;
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a,b,t) => a + (b-a)*t;
const sstep = (a,b,x) => { let t = clamp01((x-a)/(b-a)); return t*t*(3-2*t); };
const hash2 = (x,z) => { const s = Math.sin(x*127.1 + z*311.7) * 43758.5453; return s - Math.floor(s); };
const hash3 = (x,y,z) => { const s = Math.sin(x*127.1 + y*269.5 + z*311.7) * 43758.5453; return s - Math.floor(s); };

/* ---------------- renderer / scene / camera ---------------- */
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0xa8d9e6);
scene.fog = new THREE.Fog(0xa8d9e6, 120, 340);

const camera = new THREE.PerspectiveCamera(55, window.innerWidth/window.innerHeight, 0.1, 900);
const CAM_START = new THREE.Vector3(25.5, 5.4, 47.5);
const CAM_END   = new THREE.Vector3(34, 42, 88);
const TGT_START = new THREE.Vector3(2, 12, -24);
const TGT_END   = new THREE.Vector3(-1, 6.5, -3);
camera.position.copy(CAM_START);

/* ---------------- lights ---------------- */
const dirLight = new THREE.DirectionalLight(0xfff1d8, 2.6);
dirLight.castShadow = true;
dirLight.shadow.mapSize.set(2048, 2048);
dirLight.shadow.camera.left = -95; dirLight.shadow.camera.right = 95;
dirLight.shadow.camera.top = 95;   dirLight.shadow.camera.bottom = -95;
dirLight.shadow.camera.near = 10;  dirLight.shadow.camera.far = 340;
dirLight.shadow.bias = -0.0004;
dirLight.shadow.normalBias = 1.1;
scene.add(dirLight); scene.add(dirLight.target);

const hemi = new THREE.HemisphereLight(0xcfe8ee, 0x6e5940, 0.95);
scene.add(hemi);

/* ---------------- terrain math ---------------- */
function rimN(x, z){
  const base = Math.hypot(x/74, z/63);
  let r = base
    + 0.042*Math.sin(x*0.155 + 1.7)
    + 0.038*Math.sin(z*0.185 + 0.6)
    + 0.030*Math.sin((x+z)*0.105 + 2.9)
    + 0.022*Math.sin(Math.hypot(x,z)*0.23 + 1.1)
    - 0.026;
  r += sstep(0.88, 1.0, base) * 0.5;   // force island edge inside grid
  return r;
}
function smoothNoise(x,z){
  return Math.sin(x*0.16+1.2)*Math.cos(z*0.14+0.5)*0.7 + Math.sin((x*0.7+z)*0.19+2.1)*0.5;
}
function groundH(x,z){
  let h = 2.0;
  h += 4.2*sstep(10,-12, z);
  h += 3.4*sstep(-5,-16, z);
  h += 3.6*sstep(-17,-27, z);
  h -= 2.1*sstep(0.80, 1.0, rimN(x,z));
  h += smoothNoise(x,z);
  return Math.round(h/2.6)*2.6;
}
const gTop = (x,z) => Math.round(groundH(x,z)) + 0.5;   // world y of surface

/* pools */
const POOLS = [
  {cx:-13, cz:-11, hw:6.5, hd:5.0, floor:6, water:7.05},   // spring basin (upper)
  {cx:  2, cz:  4.5, hw:9.5, hd:6.5, floor:1, water:2.15}, // koi pond (middle)
  {cx: -7, cz: 32,  hw:7.5, hd:6.0, floor:0, water:1.35},  // lower pool
];
function sdRoundRect(px,py,bx,by,r){
  const qx = Math.abs(px)-bx+r, qy = Math.abs(py)-by+r;
  const ax = Math.max(qx,0), ay = Math.max(qy,0);
  return Math.hypot(ax,ay) + Math.min(Math.max(qx,qy),0) - r;
}
function poolAt(x,z){
  for (const p of POOLS) if (sdRoundRect(x-p.cx, z-p.cz, p.hw, p.hd, 2.3) < 0) return p;
  return null;
}
const ZEN = {x0:17.5, x1:45.5, z0:-15.5, z1:5.5};
const inZen = (x,z) => x>ZEN.x0 && x<ZEN.x1 && z>ZEN.z0 && z<ZEN.z1;
const inZenBorder = (x,z) => inZen(x,z) && (x<ZEN.x0+1 || x>ZEN.x1-1 || z<ZEN.z0+1 || z>ZEN.z1-1);

/* path polylines (x,z) */
const PATH_MAIN = [[25.5,44],[22,37.5],[17,32.5],[12,25.5],[8,18],[5,13.4],[2.6,12.4],[2.4,-3.6],[-9.5,-2.4],[-11.5,-8.5],[7.5,-9.9],[9.5,-15],[-6.5,-16.3],[-8.5,-21.5],[3.5,-23.2],[2.2,-29]];
const PATH_FOREST = [[-11.5,-8.5],[-19,-5],[-26.5,-8.5],[-34,-4],[-42,-6.5],[-48,-3]];
const PATH_ZEN    = [[7.5,-9.9],[12,-5],[17.5,0.6],[24,3.9],[32,4.9],[40,3.4],[43.5,-1.5]];
const PATH_ALL = [PATH_MAIN, PATH_FOREST, PATH_ZEN];
function distSeg(px,pz,ax,az,bx,bz){
  const dx=bx-ax, dz=bz-az, l2=dx*dx+dz*dz;
  let t = l2 === 0 ? 0 : ((px-ax)*dx + (pz-az)*dz)/l2;
  t = clamp01(t);
  const ex=ax+dx*t-px, ez=az+dz*t-pz;
  return Math.hypot(ex,ez);
}
function distPath(x,z){
  let m = 1e9;
  for (const seg of PATH_ALL) for (let i=0;i<seg.length-1;i++){
    const d = distSeg(x,z,seg[i][0],seg[i][1],seg[i+1][0],seg[i+1][1]);
    if (d<m) m=d;
  }
  return m;
}

/* ============================================================
   VOXEL SYSTEM — BoxGeometry + InstancedMesh, grouped by material
   ============================================================ */
const M = {
  grassA:{c:0x5e7a3a,r:0.95}, grassB:{c:0x50693a,r:0.95}, grassC:{c:0x6d7c40,r:0.95}, moss:{c:0x606c38,r:1.0},
  dirt:{c:0x5b4632,r:1}, dirtD:{c:0x4c3a2b,r:1},
  strata1:{c:0x6e5a44,r:0.95}, strata2:{c:0x7d6b52,r:0.95}, strata3:{c:0x584d40,r:0.95},
  stone:{c:0x9aa0a6,r:0.9}, stoneD:{c:0x7e848c,r:0.9}, stoneL:{c:0xb9bec5,r:0.85},
  gravel:{c:0xd8d2c2,r:0.92}, gravelD:{c:0xb0a996,r:0.95}, sand:{c:0xc9bc96,r:0.95},
  jadeD:{c:0x2d6a4f,r:0.62}, jade:{c:0x40916c,r:0.6}, jadeL:{c:0x57a877,r:0.55},
  teak:{c:0x4a2c1a,r:0.82}, teakD:{c:0x33210f,r:0.85}, trunk:{c:0x4a3320,r:0.9},
  verm:{c:0xc73e1d,r:0.55}, vermD:{c:0xa32f14,r:0.6},
  gold:{c:0xe8b86d,r:0.32,metal:0.6,e:0x6b4a12,ei:0.6},
  plaster:{c:0xede3d0,r:0.88}, plasterS:{c:0xd9cfba,r:0.92},
  pink1:{c:0xffb7c5,r:0.8,e:0xff8fab,ei:0.18}, pink2:{c:0xff8fab,r:0.8,e:0xff6f9c,ei:0.22}, pink3:{c:0xffe5ec,r:0.85,e:0xdba0aa,ei:0.12},
  leafP:{c:0x2e5b3e,r:0.85}, leafP2:{c:0x3f7048,r:0.85},
  mapleA:{c:0xc1543a,r:0.8,e:0x4a1608,ei:0.25}, mapleB:{c:0xd98a4b,r:0.8,e:0x4a2a08,ei:0.22}, mapleD:{c:0x8e3b2c,r:0.85},
  willow:{c:0x7a9250,r:0.85}, willowD:{c:0x5f7a3e,r:0.9},
  leafG:{c:0x3d6b35,r:0.85},
  foam:{c:0xf4fbff,r:0.6,e:0xffffff,ei:0.35},
};

let voxelCount = 0;
const vGroups = new Map();
const _p = new THREE.Vector3(), _q = new THREE.Quaternion(), _s = new THREE.Vector3(), _e = new THREE.Euler();
function V(x,y,z,mat,sx=1,sy=1,sz=1,rx=0,ry=0,rz=0,bucket){
  const g = bucket || vGroups;
  if (!g.has(mat)) g.set(mat, []);
  _p.set(x,y,z); _e.set(rx,ry,rz); _q.setFromEuler(_e); _s.set(sx,sy,sz);
  g.get(mat).push(new THREE.Matrix4().compose(_p,_q,_s));
  voxelCount++;
}
function finalizeVoxels(bucket, parent){
  const geo = new THREE.BoxGeometry(1,1,1);
  for (const [mat, list] of bucket){
    const def = M[mat] || {c:0xff00ff};
    const m = new THREE.MeshStandardMaterial({
      color: def.c, roughness: def.r ?? 0.9, metalness: def.metal ?? 0.0,
      emissive: def.e ?? 0x000000, emissiveIntensity: def.ei ?? 1
    });
    const im = new THREE.InstancedMesh(geo, m, list.length);
    for (let i=0;i<list.length;i++) im.setMatrixAt(i, list[i]);
    im.instanceMatrix.needsUpdate = true;
    im.castShadow = true; im.receiveShadow = true;
    parent.add(im);
  }
}
function fillBox(cx,cy,cz,sx,sy,sz,mat,bucket){
  const nx=Math.max(1,Math.round(sx)), ny=Math.max(1,Math.round(sy)), nz=Math.max(1,Math.round(sz));
  for(let i=0;i<nx;i++)for(let j=0;j<ny;j++)for(let k=0;k<nz;k++)
    V(cx+i-(nx-1)/2, cy+j-(ny-1)/2, cz+k-(nz-1)/2, mat, 1,1,1, 0,0,0, bucket);
}
function blob(cx,cy,cz,rx,ry,rz,mats,density,bucket){
  const x0=Math.floor(cx-rx), x1=Math.ceil(cx+rx), y0=Math.floor(cy-ry), y1=Math.ceil(cy+ry), z0=Math.floor(cz-rz), z1=Math.ceil(cz+rz);
  for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++){
    const d=((x-cx)/rx)**2+((y-cy)/ry)**2+((z-cz)/rz)**2;
    if(d<=1 && hash3(x,y,z)<(density??0.82)){
      const m=mats[Math.floor(hash3(x+9,y+3,z+5)*mats.length)%mats.length];
      V(x,y,z,m,0.96,0.96,0.96,0,0,0,bucket);
    }
  }
}
const strataPick = (x,y,z) => { const h=hash3(x,y,z); return h<0.34?'strata1':(h<0.67?'strata2':'strata3'); };

/* ============================================================
   TERRAIN
   ============================================================ */
const GX0=-72, GX1=71, GZ0=-64, GZ1=63;
const GW = GX1-GX0+1, GD = GZ1-GZ0+1;
const H = new Int16Array(GW*GD).fill(-9999);
const gi = (x,z) => (z-GZ0)*GW + (x-GX0);

for (let x=GX0;x<=GX1;x++){
  for (let z=GZ0;z<=GZ1;z++){
    if (rimN(x,z) >= 1) continue;
    let ty = Math.round(groundH(x,z));
    const p = poolAt(x,z);
    if (p) ty = p.floor;
    H[gi(x,z)] = ty;
    const h1 = hash2(x,z), h2 = hash2(x+31.7, z-17.3);
    let col;
    const dPath = distPath(x,z);
    if (p) col = h1<0.6 ? 'sand' : 'dirt';
    else if (dPath < 1.25) col = h1<0.10 ? 'moss' : (h1<0.56 ? 'stone' : 'stoneD');
    else if (Math.hypot(x-2, z+28.5) < 5.2){
      if (Math.hypot(x-2, z+28.5) > 4.35) col = 'verm';
      else col = ((Math.floor(x/1.6)+Math.floor(z/1.6))&1) ? 'stone' : 'stoneL';
    }
    else if (Math.hypot(x-25.5, z-40) < 4.2){
      if (Math.hypot(x-25.5, z-40) > 3.45) col = 'vermD';
      else col = ((Math.floor(x/1.5)+Math.floor(z/1.5))&1) ? 'stone' : 'stoneD';
    }
    else if (inZen(x,z)) col = inZenBorder(x,z) ? 'stoneL' : (h1<0.78 ? 'gravel' : 'gravelD');
    else col = h1<0.42 ? 'grassA' : (h1<0.78 ? 'grassB' : (h1<0.9 ? 'grassC' : 'moss'));
    V(x, ty, z, col);
    V(x, ty-1, z, h2<0.5 ? 'dirt' : 'dirtD');
    V(x, ty-2, z, strataPick(x,ty,z));
  }
}
/* ledge walls + rim skirt */
for (let x=GX0;x<=GX1;x++){
  for (let z=GZ0;z<=GZ1;z++){
    const ty = H[gi(x,z)]; if (ty < -9000) continue;
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]];
    for (const [dx,dz] of dirs){
      const nx=x+dx, nz=z+dz;
      const nty = (nx>=GX0 && nx<=GX1 && nz>=GZ0 && nz<=GZ1) ? H[gi(nx,nz)] : -9999;
      if (nty === -9999){
        const depth = 6 + Math.floor(hash2(x*3.1+z*0.7, z*1.7-x*0.4)*5);
        for (let y=ty-3; y>=ty-3-depth; y--) V(x,y,z, strataPick(x,y*1.3,z));
      } else if (ty - nty >= 4){
        for (let y=ty-3; y>=nty+1; y--){
          V(x,y,z, (y===ty-3 && hash2(x*7.1,z*3.3)<0.3) ? 'moss' : strataPick(x*1.7,y*2.3,z*1.1));
        }
      }
    }
  }
}
/* tapered underside — stepped strata rings + cap (Monument Valley silhouette) */
const ringSamples = [];
for (let k=0;k<12;k++){
  const y = Math.round(-2 - k*0.95);
  const s = 1 - k*0.078;
  const rx = 71*s, rz = 60.5*s;
  const circ = Math.PI*2*Math.sqrt((rx*rx+rz*rz)*0.5);
  const steps = Math.floor(circ/1.02);
  for (let i=0;i<steps;i++){
    const th = (i/steps)*TAU;
    const wob = 1 + 0.07*Math.sin(th*5+k*1.7) + 0.05*Math.sin(th*9+k*0.8+2.0);
    const px = Math.cos(th)*rx*wob, pz = Math.sin(th)*rz*wob;
    if (hash2(i*7.13+k*3.7, k*9.1+i*0.7) < 0.12) continue;   // broken rock gaps
    const vx=Math.round(px), vz=Math.round(pz);
    V(vx, y, vz, k%3===0?'strata3':(k%3===1?'strata1':'strata2'));
    ringSamples.push([vx,y,vz]);
  }
}
for (let c=0;c<3;c++){
  const r = 9 - c*3.4, y = Math.round(-2 - 12*0.95 - c*0.95);
  for (let x=-r;x<=r;x++) for (let z=-r;z<=r;z++) if (x*x+z*z <= r*r) V(x,y,z, c===1?'strata2':'strata3');
}
/* moss tufts clinging to the cliff + underside roots */
for (let i=0;i<90 && ringSamples.length;i++){
  const s = ringSamples[Math.floor(hash2(i*3.3, 77.7)*ringSamples.length)];
  const a = Math.atan2(s[2], s[0]);
  V(Math.round(s[0]+Math.cos(a)*0.9), s[1], Math.round(s[2]+Math.sin(a)*0.9), 'moss', 0.62,0.62,0.62);
}
for (let i=0;i<16;i++){
  const a = hash2(i*13.7, 5.1)*TAU;
  const rr = 0.62 + hash2(i*7.9, 8.8)*0.3;
  const bx = Math.cos(a)*71*rr, bz = Math.sin(a)*60.5*rr;
  const by = Math.round(-2 - (1-rr)*11);
  const len = 2 + Math.floor(hash2(i*3.3, 9.4)*3);
  for (let j=0;j<len;j++) V(Math.round(bx+Math.cos(a)*j*0.28), by-j, Math.round(bz+Math.sin(a)*j*0.28), 'trunk', 0.3,0.9,0.3);
}

/* grass tufts */
for (let i=0;i<650;i++){
  const x = Math.floor(GZ0*0)+ (GX0 + hash2(i,1.3)*(GW));
  const z = GZ0 + hash2(i,9.7)*(GD);
  if (rimN(x,z) >= 0.97) continue;
  if (poolAt(x,z) || distPath(x,z) < 1.4 || inZen(x,z)) continue;
  const gy = Math.round(groundH(x,z));
  V(x+ (hash2(i,2.2)-0.5)*0.7, gy+1, z+(hash2(i,3.4)-0.5)*0.7, hash2(i,4.4)<0.5?'grassC':'grassA', 0.3, 0.55+hash2(i,5.5)*0.4, 0.3);
}

/* rock scatter on rim + ledge boulders */
function rockCluster(cx,cy,cz,r,mats,density){
  const n = Math.floor(r*10);
  for (let i=0;i<n;i++){
    const a=hash2(i*3.1+cx,cz*1.7+i)*TAU, b=hash2(i*7.7+cz, cx*0.7+i)*Math.PI;
    const rr = r*(0.4+0.6*hash2(i*5.1, i+cx));
    const x = cx + Math.sin(b)*Math.cos(a)*rr, z = cz + Math.sin(b)*Math.sin(a)*rr, y = cy + Math.cos(b)*rr*0.7;
    const s = 0.5 + hash2(i*11.3, cz+i)*0.75;
    V(Math.round(x), Math.round(y), Math.round(z), mats[Math.floor(hash2(i,cx+cz)*mats.length)%mats.length], s,s*0.85,s, 0, hash2(i,9)*3, 0);
  }
}
for (let i=0;i<12;i++){
  const a = hash2(i*17.3, 3.3)*TAU;
  const rr = 0.86 + hash2(i*5.1, 8.8)*0.1;
  const x = Math.cos(a)*70*rr, z = Math.sin(a)*56*rr;
  if (rimN(x,z) < 0.9) continue;
  rockCluster(x, Math.round(groundH(x,z))+0.6, z, 1.5+hash2(i,1.1)*1.3, ['stoneD','strata2','stone'], 0.8);
}

/* ============================================================
   STREAMS + WATERFALLS
   ============================================================ */
const waterMats = [];

const foamPts = [];
function buildStream(pts){
  const samples=[];
  for(let i=0;i<pts.length-1;i++){
    const [ax,az]=pts[i], [bx,bz]=pts[i+1];
    const len=Math.hypot(bx-ax,bz-az), n=Math.max(2,Math.ceil(len/0.9));
    for(let j=(i===0?0:1);j<=n;j++){ const t=j/n; samples.push([lerp(ax,bx,t), lerp(az,bz,t)]); }
  }
  const pos=[], idx=[];
  for(let i=0;i<samples.length;i++){
    const [x,z]=samples[i];
    const [nx,nz]=samples[Math.min(i+1,samples.length-1)], [px,pz]=samples[Math.max(i-1,0)];
    let dx=nx-px, dz=nz-pz; const l=Math.hypot(dx,dz)||1; dx/=l; dz/=l;
    const w=0.72, y=groundH(x,z)+0.62;
    pos.push(x-dz*w, y, z+dx*w, x+dz*w, y, z-dx*w);
    if (i>0){
      const yPrev = groundH(samples[i-1][0], samples[i-1][1])+0.62;
      if (Math.abs(y-yPrev) > 1.2){ // cascade step → foam
        for(let f=0;f<4;f++) V(Math.round(x+(hash2(i,f)-0.5)*1.2), Math.round(Math.min(y,yPrev)+0.4), Math.round(z+(hash2(f,i)-0.5)*1.2), 'foam', 0.5,0.4,0.5);
      }
    }
    if (i<samples.length-1){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx); g.computeVertexNormals();
  const m=new THREE.Mesh(g, streamMat); m.receiveShadow=true; m.renderOrder=2; scene.add(m);
}

    glowMats.push(gm);
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(1.15, 1.75), gm);

    plane.position.set(PX + nx*(half-0.55), y0+0.85, PZ + nz*(half-0.55));
    plane.rotation.y = yaw;
    pagodaGroup.add(plane);
  }
  /* doors: 2 panels per face, hinged */
  for (let f=0; f<4; f++){
    const yaw = f * Math.PI/2;
    const nx = Math.sin(yaw), nz = Math.cos(yaw);
    const tx = Math.cos(yaw), tz = -Math.sin(yaw);
    for (const side of [-1, 1]){
      const pivot = new THREE.Group();
      pivot.position.set(PX + nx*(half+0.08) + tx*side*0.78, y0+0.72, PZ + nz*(half+0.08) + tz*side*0.78);

      panel.userData.floor = i;
      const knob = new THREE.Mesh(knobGeo, matGold);
      knob.position.set(-side*0.72, 0, 0.12);
      panel.add(knob);
      pivot.add(panel);
      pagodaGroup.add(pivot);
      floorHits.push(panel);
      floors[i] = floors[i] || {cur:0, target:0, pivots:[]};
      floors[i].pivots.push({pivot, side, panel});
    }
  }
  /* invisible per-floor hit volume */
  const hit = new THREE.Mesh(
    new THREE.BoxGeometry(W+1.6, 3.6, W+1.6),
    new THREE.MeshBasicMaterial({transparent:true, opacity:0, depthWrite:false})
  );
  hit.position.set(PX, y0+1, PZ);
  hit.userData.floor = i;
  pagodaGroup.add(hit);
  floorHits.push(hit);
  floors[i].cur = 0; floors[i].target = 0;
}

/* bamboo forest — ≥36 stalks, footprint ≥ 32×24 */
(function buildBamboo(){
  let placed = 0;
  const clusters = [];
  for (let i=0;i<17;i++){
    clusters.push([ -50 + hash2(i,11)*32, -15 + hash2(i,23)*24 ]);
  }
  for (const [cx,cz] of clusters){
    if (distPath(cx,cz) < 2.1) continue;                 // canopy break at path entry
    const n = 2 + Math.floor(hash2(cx,cz)*3);
    for (let s=0;s<n;s++){
      const x = cx + (hash2(s,cx)-0.5)*2.6, z = cz + (hash2(s,cz)-0.5)*2.6;
      if (distPath(x,z) < 1.6) continue;
      const gy = Math.round(groundH(x,z))+1;
      const h = 6 + Math.floor(hash2(x*3.1, z*7.7)*5);
      const lean = (hash2(x,z*1.7)-0.5)*0.14;
      for (let j=0;j<h;j++){
        const off = Math.sin(j*0.55)*lean*j*0.28;
        const shade = j%3===2 ? 'leafP2' : (j%3===0 ? 'jade' : 'leafP');
        V(Math.round(x+off), gy+j, Math.round(z+off*0.6), shade, 0.34, 0.96, 0.34);
        if (j%2===1) V(Math.round(x+off), gy+j, Math.round(z+off*0.6), 'jadeD', 0.42, 0.14, 0.42);
      }
      const topY = gy + h;
      for (let L=0;L<4;L++){
        const a = hash2(L,x+z)*TAU;
        V(Math.round(x+Math.cos(a)*1.1), topY - (L%2), Math.round(z+Math.sin(a)*1.1), 'leafP2', 1.5, 0.2, 0.34, 0, a, 0.42);
      }
      placed++;
    }
  }
})();

(function plantFlowers(){

      const nx = -(b[1]-a[1]), nz = (b[0]-a[0]); const nl = Math.hypot(nx,nz)||1;
      x = lerp(a[0],b[0],t) + (nx/nl)*side*(1.7+hash2(guard,13)*1.3);

    placed++;
  }
})();

/* stairs where the path crosses terrace ledges */
(function buildStairs(){
  const pts = PATH_MAIN;
  for (let i=0;i<pts.length-1;i++){
    const [ax,az]=pts[i], [bx,bz]=pts[i+1];
    const len = Math.hypot(bx-ax,bz-az), n = Math.ceil(len/0.8);
    for (let j=0;j<n;j++){
      const t0=j/n, t1=(j+1)/n;
      const h0 = groundH(lerp(ax,bx,t0), lerp(az,bz,t0));
      const h1 = groundH(lerp(ax,bx,t1), lerp(az,bz,t1));
      if (Math.abs(h1-h0) >= 1.5){
        const mx=lerp(ax,bx,(t0+t1)/2), mz=lerp(az,bz,(t0+t1)/2);
        if (poolAt(mx,mz)) continue;
        const top = Math.max(h0,h1), bot = Math.min(h0,h1);
        const steps = Math.max(2, Math.round((top-bot)/0.9)+1);
        for (let s=0;s<steps;s++){
          const sy = bot + (s+0.5)*((top-bot)/steps);
          V(Math.round(mx), Math.round(sy), Math.round(mz), 'stoneL', 2.6, 0.42, 1.0);
        }
      }
    }
  }
})();

/* ============================================================
   SATELLITE FLOATING ISLANDS (two, different heights)
   ============================================================ */
function buildSatellite(R, levels, capSteps, parent){
  const g = new Map();
  const put=(x,y,z,m,sx,sy,sz)=>V(x,y,z,m,sx,sy,sz,0,0,0,g);
  for (let x=-R;x<=R;x++) for (let z=-R;z<=R;z++){
    if (x*x+z*z <= R*R){ put(x,0,z,'grassA',1,1,1); put(x,-1,z,'dirt',1,1,1); }
  }
  for (let k=0;k<levels;k++){
    const y = -2-k, rr = R*(1-(k+1)/(levels+1.4));
    const circ = TAU*rr, steps = Math.max(10, Math.floor(circ/1.05));
    for (let i=0;i<steps;i++){
      if (hash2(i*3.1,k*7.7) < 0.14) continue;
      const a = i/steps*TAU, wob = 1+0.1*Math.sin(a*5+k);
      put(Math.round(Math.cos(a)*rr*wob), Math.round(y*0.95), Math.round(Math.sin(a)*rr*wob), k%2?'strata1':'strata2',1,1,1);
    }
  }
  for (let c=0;c<capSteps;c++){
    const r = R*0.42*(1-c*0.38), y = Math.round(-2-levels-c*0.9);
    for (let x=-r;x<=r;x++) for (let z=-r;z<=r;z++) if (x*x+z*z<=r*r) put(x,y,z,'strata3');
  }
  finalizeVoxels(g, parent);
}

/* birds */
const birds = [];
const birdMat = new THREE.MeshStandardMaterial({color:0x23232c, roughness:0.7, side:THREE.DoubleSide});
for (let i=0;i<4;i++){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.ConeGeometry(0.32, 1.7, 6), birdMat);
  body.rotation.x = Math.PI/2; g.add(body);
  const wgeo = new THREE.PlaneGeometry(1.7, 0.55); wgeo.translate(0.85, 0, 0);
  const wl = new THREE.Mesh(wgeo, birdMat); wl.position.x = -0.12; g.add(wl);
  const wr = new THREE.Mesh(wgeo, birdMat); wr.position.x = 0.12; wr.rotation.y = Math.PI; g.add(wr);
  scene.add(g);
  birds.push({g, wl, wr, r: 46+i*7, rz: 36+i*6, y: 21+i*3.2, speed: 0.055+i*0.012, phase: i*1.9});
}
/* sakura petals */
const PETALS = 80;
const petalGeo = new THREE.PlaneGeometry(0.3, 0.22);
const petalMat = new THREE.MeshStandardMaterial({color:0xffd3de, roughness:0.85, side:THREE.DoubleSide, emissive:0xcc6f88, emissiveIntensity:0.2, transparent:true, opacity:0.95});
const petalMesh = new THREE.InstancedMesh(petalGeo, petalMat, PETALS);
petalMesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
scene.add(petalMesh);
const petals = [];
function resetPetal(p, randomY){
  const s = sakuraSpots[(Math.random()*sakuraSpots.length)|0];
  p.cx = s.x; p.cz = s.z; p.top = s.y + Math.random()*1.5;
  p.r = Math.random()*2.4; p.a = Math.random()*TAU;
  p.y = randomY ? p.top - Math.random()*6 : p.top;
  p.vy = 0.55 + Math.random()*0.5;
  p.spin = Math.random()*TAU; p.spinV = (Math.random()-0.5)*2.4;
  p.drift = 0.4 + Math.random()*0.6;
}
for (let i=0;i<PETALS;i++){ const p = {}; resetPetal(p, true); petals.push(p); }

/* ============================================================
   CLOUDS + STARS + SUN/MOON
   ============================================================ */
const cloudMat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:1, transparent:true, opacity:0.82, emissive:0xffffff, emissiveIntensity:0.25, depthWrite:false});
const clouds = [];
for (let i=0;i<5;i++){
  const g = new THREE.Group();
  const n = 3 + (i%2);
  for (let j=0;j<n;j++){
    const s = new THREE.Mesh(new THREE.SphereGeometry(3.2+((i*7+j*3)%3), 10, 8), cloudMat);
    s.scale.set(1.6, 0.62, 1); s.position.set(j*3.4-4, (j%2)*0.8, (j*1.7)%2); g.add(s);
  }
  g.position.set(-120 + i*52, 44 + (i%3)*6, -60 + (i*47)%110);
  scene.add(g); clouds.push(g);
}
const starGeo = new THREE.BufferGeometry();
{
  const pts = [];
  for (let i=0;i<380;i++){
    const a = Math.random()*TAU, e = Math.random()*Math.PI*0.48 + 0.08, r = 420;
    pts.push(Math.cos(a)*Math.cos(e)*r, Math.sin(e)*r, Math.sin(a)*Math.cos(e)*r);
  }
  starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
}
const starMat = new THREE.PointsMaterial({color:0xcfd8ff, size:1.6, sizeAttenuation:false, transparent:true, opacity:0, fog:false, depthWrite:false});
scene.add(new THREE.Points(starGeo, starMat));
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(10, 16, 12), new THREE.MeshBasicMaterial({color:0xfff6d8, fog:false}));
scene.add(sunMesh);
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(7, 16, 12), new THREE.MeshBasicMaterial({color:0xdfe6f5, fog:false}));
scene.add(moonMesh);

/* ============================================================
   CONTROLS / INTRO / HUD / INTERACTION
   ============================================================ */
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.copy(TGT_START);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 14;
controls.maxDistance = 190;
controls.maxPolarAngle = 1.95;
controls.minPolarAngle = 0.12;
controls.autoRotateSpeed = -0.55;
controls.enabled = false;

const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
const clickTargets = [...floorHits, ...lanterns.map(l => l.hit)];
let downPos = null;
renderer.domElement.addEventListener('pointerdown', e => { downPos = [e.clientX, e.clientY]; });
window.addEventListener('pointerup', e => {
  if (!downPos) return;
  const dx = e.clientX-downPos[0], dy = e.clientY-downPos[1];
  downPos = null;
  if (dx*dx + dy*dy > 36 || e.target !== renderer.domElement) return;
  pointer.x = (e.clientX/window.innerWidth)*2 - 1;
  pointer.y = -(e.clientY/window.innerHeight)*2 + 1;
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects(clickTargets, false);
  if (!hits.length) return;
  const ud = hits[0].object.userData;
  if (ud.lantern){ const L = ud.lantern; L.manual = true; L.on = !L.on; }
  else if (ud.floor !== undefined){
    const f = floors[ud.floor];
    f.target = f.target > 0.5 ? 0 : 1;
  }
});

/* idle auto-rotate */
let idleTimer = null;
controls.addEventListener('start', () => { controls.autoRotate = false; if (idleTimer) clearTimeout(idleTimer); });
controls.addEventListener('end', () => { if (idleTimer) clearTimeout(idleTimer); idleTimer = setTimeout(()=>{ controls.autoRotate = true; }, 5000); });

/* HUD */
const voxEl = document.getElementById('voxelCount');
const fpsEl = document.getElementById('fps');
const slider = document.getElementById('timeSlider');
const clockEl = document.getElementById('clock');
const pauseBtn = document.getElementById('pauseBtn');
let timeOfDay = 0.335, timePaused = false;
let sliderActive = false;
slider.addEventListener('input', () => { timeOfDay = slider.value/1000; });
slider.addEventListener('pointerdown', () => sliderActive = true);
window.addEventListener('pointerup', () => sliderActive = false);
pauseBtn.addEventListener('click', () => { timePaused = !timePaused; pauseBtn.textContent = timePaused ? '►' : '❚❚'; });

voxEl.textContent = voxelCount.toLocaleString() + ' voxels';
window.__VOXEL__ = { voxelCount, fps: 60, pagodaFloors: 5, timeOfDay };

/* ============================================================
   ANIMATION LOOP
   ============================================================ */
const clock = new THREE.Clock();
let introT = 0;
const INTRO_LEN = 2.7;
const easeInOut = t => t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2, 3)/2;
const skyDay = new THREE.Color(0xa8d9e6), skyDusk = new THREE.Color(0xf7b98a), skyNight = new THREE.Color(0x0d1330);
const tmpSky = new THREE.Color(), tmpHemi = new THREE.Color(), sunDir = new THREE.Vector3();
let fpsFrames = 0, fpsTime = 0, fpsValue = 60;
const _m4 = new THREE.Matrix4(), _v = new THREE.Vector3();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  /* time of day */
  if (!timePaused) timeOfDay = (timeOfDay + dt/90) % 1;
  const phi = (timeOfDay - 0.25) * TAU;
  const elev = Math.sin(phi);
  const dayF = THREE.MathUtils.smoothstep(elev, -0.06, 0.42);
  const duskF = Math.max(0, 1 - Math.abs(elev)*3.4) * (elev > -0.18 ? 1 : 0);

  /* sky + fog + sun/moon */
  tmpSky.copy(skyNight).lerp(skyDay, dayF).lerp(skyDusk, duskF*0.55);
  scene.background.copy(tmpSky);
  scene.fog.color.copy(tmpSky);
  sunDir.set(Math.cos(phi), Math.sin(phi)*0.95 + 0.02, 0.45).normalize();
  if (elev >= 0){
    dirLight.position.copy(sunDir).multiplyScalar(160);
    dirLight.color.setHex(0xfff1d8).lerp(new THREE.Color(0xffab66), Math.min(1, duskF));
    dirLight.intensity = 0.3 + 2.45*Math.pow(Math.max(0, elev), 0.75);
  } else {
    dirLight.position.copy(sunDir).multiplyScalar(-160);
    dirLight.color.setHex(0x8fb0e8);
    dirLight.intensity = 0.38;
  }
  dirLight.target.position.set(0, 0, 0);
  hemi.intensity = 0.34 + 0.72*Math.max(0, elev) + duskF*0.12;
  tmpHemi.setHex(0xcfe8ee).lerp(new THREE.Color(0x272f4e), 1-dayF);
  hemi.color.copy(tmpHemi);
  sunMesh.position.copy(sunDir).multiplyScalar(430);
  sunMesh.visible = elev > -0.09;
  sunMesh.material.color.setHex(duskF > 0.4 ? 0xffd9a0 : 0xfff6d8);
  moonMesh.position.copy(sunDir).multiplyScalar(-430);
  moonMesh.visible = elev < 0.14;
  starMat.opacity = clamp01(-elev*1.4)*0.95;

  /* water shimmer */
  const shimmer = 0.72 + 0.1*Math.sin(t*1.7) + 0.05*Math.sin(t*3.9);
  pondMat.opacity = shimmer;
  pondMat.emissiveIntensity = 0.32 + 0.16*Math.sin(t*2.3+1.2);
  streamMat.opacity = 0.72 + 0.1*Math.sin(t*2.6+0.7);
  fallMat.opacity = 0.52 + 0.14*Math.sin(t*9.0);
  fallCore.material.opacity = 0.66 + 0.22*Math.sin(t*11.0+1.4);

  /* ripples */
  for (const r of ripples){
    r.t += dt*0.42; if (r.t > 1) r.t -= 1;
    const s = 0.6 + r.t * r.maxR;
    r.m.scale.set(s, s, s);
    r.m.material.opacity = 0.66*(1 - r.t);
  }
  /* koi */
  for (const k of koi){
    k.a += dt * k.speed;
    const px = POOLS[1].cx + Math.cos(k.a)*k.rx;
    const pz = POOLS[1].cz + Math.sin(k.a)*k.rz;
    const nx = -Math.sin(k.a)*k.rx, nz = Math.cos(k.a)*k.rz;
    k.g.position.set(px, POOLS[1].water - 0.22 + Math.sin(t*2 + k.wob)*0.05, pz);
    k.g.rotation.y = Math.atan2(nx, nz) + Math.PI/2;
    k.tail.rotation.y = Math.sin(t*6 + k.wob)*0.55;
  }
  /* birds */
  for (const b of birds){
    const a = t*b.speed + b.phase;
    const px = Math.cos(a)*b.r, pz = Math.sin(a)*b.rz - 2;
    const py = b.y + Math.sin(t*0.8 + b.phase*2)*1.4;
    b.g.position.set(px, py, pz);
    const tx = -Math.sin(a)*b.r, tz = Math.cos(a)*b.rz;
    b.g.rotation.y = Math.atan2(tx, tz);
    const flap = Math.sin(t*7 + b.phase*3)*0.62 + 0.18;
    b.wl.rotation.z = flap; b.wr.rotation.z = -flap;
  }
  /* petals */
  for (let i=0;i<PETALS;i++){
    const p = petals[i];
    p.y -= p.vy*dt;
    p.a += dt*0.6;
    p.spin += p.spinV*dt;
    const px = p.cx + Math.cos(p.a)*p.r + Math.sin(t*1.3+i)*0.4;
    const pz = p.cz + Math.sin(p.a)*p.r + Math.cos(t*1.1+i*1.7)*0.4;
    if (p.y < Math.round(groundH(px,pz)) + 0.6) resetPetal(p, false);
    _v.set(px, p.y, pz); _e.set(p.spin, p.a, p.spin*0.7); _q.setFromEuler(_e);
    _m4.compose(_v, _q, _s.set(1,1,1));
    petalMesh.setMatrixAt(i, _m4);
  }
  petalMesh.instanceMatrix.needsUpdate = true;
  /* fluttering leaves on canopies */
  for (let i=0;i<flutter.length;i++){
    const f = flutter[i];
    const sway = Math.sin(t*1.8 + f.phase)*f.amp;
    _v.set(f.x + sway, f.y + Math.sin(t*2.4 + f.phase*1.7)*0.14, f.z + Math.cos(t*1.5 + f.phase)*f.amp);
    _e.set(Math.sin(t*2+f.phase)*0.5, f.phase + t*0.35, Math.cos(t*1.7+f.phase)*0.5); _q.setFromEuler(_e);
    _m4.compose(_v, _q, _s.set(1,1,1));
    flutterMesh.setMatrixAt(i, _m4);
  }
  flutterMesh.instanceMatrix.needsUpdate = true;
  /* waterfall particles */
  for (let i=0;i<FALL_N;i++){
    fallVel[i] += 6.5*dt;
    fallPos[i*3+1] -= fallVel[i]*dt;
    fallPos[i*3+2] += dt*1.1;
    if (fallPos[i*3+1] < fallBottom()) resetDrop(i, false);
  }
  function fallBottom(){ return -7.2; }
  fallGeo.attributes.position.needsUpdate = true;
  for (let i=0;i<mistPuffs.length;i++){
    const m = mistPuffs[i];
    m.material.opacity = 0.26 + 0.14*Math.sin(t*1.6 + i*2.1);
    m.position.y = -6.3 + Math.sin(t*0.9 + i*1.3)*0.25;
    const s = 1 + 0.12*Math.sin(t*1.2 + i);
    m.scale.set(1.7*s, 0.75*s, 1.35*s);
  }
  /* satellite islands bob */
  satA.position.y = 13 + Math.sin(t*0.5)*0.32;
  satB.position.y = 21.5 + Math.sin(t*0.38 + 2)*0.3;
  satA.rotation.y = Math.sin(t*0.18)*0.02;
  satB.rotation.y = Math.cos(t*0.15)*0.025;
  /* clouds drift */
  for (const c of clouds){ c.position.x += dt*0.55; if (c.position.x > 150) c.position.x = -150; }

  /* doors */
  for (const f of floors){
    f.cur += (f.target - f.cur) * Math.min(1, dt*3.4);
    if (Math.abs(f.target - f.cur) < 0.001) f.cur = f.target;
    for (const p of f.pivots){
      p.pivot.rotation.y = Math.atan2(Math.sin(p.pivot.rotation.y), Math.cos(p.pivot.rotation.y)); // keep normalized-ish
      p.pivot.rotation.y = p.baseYaw !== undefined ? p.baseYaw + p.side * f.cur * 1.82 : p.pivot.rotation.y;
    }
  }
  /* store base yaws on first frame */
  for (const f of floors) for (const p of f.pivots) if (p.baseYaw === undefined) p.baseYaw = p.pivot.rotation.y;

  /* lanterns: dusk auto + flicker */
  const night = elev < 0.13;
  for (const L of lanterns){
    const desired = L.manual ? L.on : night;
    L.level += ((desired ? 1 : 0) - L.level) * Math.min(1, dt*4);
    const fl = 0.84 + 0.16*Math.sin(t*11 + L.phase*7) * Math.sin(t*5.7 + L.phase*3) + 0.05*Math.sin(t*23 + L.phase);
    L.light.intensity = L.level * 26 * fl;
    L.coreMat.emissiveIntensity = 0.12 + L.level * 1.7 * fl;
  }
  /* interior glow breathes gently */
  for (let i=0;i<glowMats.length;i++) glowMats[i].opacity = 0.82 + 0.14*Math.sin(t*1.4 + i*1.3);

  /* intro camera */
  if (introT < 1){
    introT = Math.min(1, introT + dt/INTRO_LEN);
    const e = easeInOut(introT);
    camera.position.lerpVectors(CAM_START, CAM_END, e);
    controls.target.lerpVectors(TGT_START, TGT_END, e);
    if (introT >= 1){ controls.enabled = true; controls.autoRotate = true; }
  }
  controls.update();

  /* HUD */
  fpsFrames++; fpsTime += dt;
  if (fpsTime >= 0.5){
    fpsValue = Math.round(fpsFrames / fpsTime);
    fpsFrames = 0; fpsTime = 0;
    fpsEl.textContent = fpsValue + ' FPS';
  }
  if (!sliderActive) slider.value = String(Math.round(timeOfDay*1000));
  const hh = Math.floor(timeOfDay*24), mm = Math.floor((timeOfDay*24 - hh)*60);
  clockEl.textContent = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
  window.__VOXEL__.timeOfDay = timeOfDay;
  window.__VOXEL__.fps = fpsValue;

  renderer.render(scene, camera);
}

/* door pivot base yaws (captured before first animation pass usage) */
for (const f of floors) for (const p of f.pivots) p.baseYaw = p.pivot.rotation.y;

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

animate();
</script>
</body>
