<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VOXEL GARDEN</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; }
        #info { position: absolute; top: 10px; width: 100%; text-align: center; color: white; font-family: monospace; z-index: 100; }
        #controls { position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); color: white; font-family: monospace; z-index: 100; }
        .control { display: inline-block; margin: 0 10px; }
    </style>
</head>
<body>
    <div id="info">VOXEL GARDEN</div>
    <div id="controls">
        <span id="voxel-count"></span> | <span id="fps"></span><br>
        <span>Click lanterns</span>
        <div class="control">
            <input type="range" id="time-slider" min="0" max="90" value="30">
            <button id="pause-btn">Pause</button>
        </div>
    </div>

    <script type="importmap">
    {"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';

        // Patch InstancedMesh.setMatrixAt to auto-expand instance matrix buffer
        const _origSetMatrixAt = THREE.InstancedMesh.prototype.setMatrixAt;
        THREE.InstancedMesh.prototype.setMatrixAt = function (index, matrix) {
            const instanceMatrix = this.instanceMatrix;
            const needed = (index + 1) * 16;
            if (instanceMatrix.array.length < needed) {
                const oldArray = instanceMatrix.array;
                const newLength = Math.max(needed, oldArray.length * 2 || 16);
                const newArray = new Float32Array(newLength);
                if (oldArray.length > 0) newArray.set(oldArray);
                this.instanceMatrix = new THREE.InstancedBufferAttribute(newArray, 16);
            }
            _origSetMatrixAt.call(this, index, matrix);
            this.instanceMatrix.needsUpdate = true;
        };
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
        // Scene setup
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x000000);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 10, 50);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.screenSpacePanning = false;
        controls.minDistance = 5;
        controls.maxDistance = 200;
        controls.maxPolarAngle = Math.PI * 0.9;

        // Lighting
        const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
        directionalLight.position.set(100, 100, 50);
        directionalLight.castShadow = true;
        directionalLight.shadow.mapSize.width = 2048;
        directionalLight.shadow.mapSize.height = 2048;
        directionalLight.shadow.camera.near = 0.5;
        directionalLight.shadow.camera.far = 500;
        scene.add(directionalLight);

        const hemisphereLight = new THREE.HemisphereLight(0xffffbb, 0x080820, 0.5);
        scene.add(hemisphereLight);

        // Bloom setup
        const renderScene = new RenderPass(scene, camera);
        const bloomPass = new UnrealBloomPass(
            new THREE.Vector2(window.innerWidth, window.innerHeight),
            1.5, 0.4, 0.85
        );
        bloomPass.threshold = 0;
        bloomPass.strength = 1.5;
        bloomPass.radius = 0.5;

        const composer = new EffectComposer(renderer);
        composer.addPass(renderScene);
        composer.addPass(bloomPass);

        // Time variables
        let time = 30;
        let isPaused = false;
        let lastTime = performance.now();
        let deltaTime = 0;
        let animationFrameId;

        // Voxel materials
        const materials = {
            stone: new THREE.MeshStandardMaterial({ color: 0x9AA0A6, roughness: 0.8, metalness: 0.1 }),
            teak: new THREE.MeshStandardMaterial({ color: 0x4A2C1A, roughness: 0.3, metalness: 0.1 }),
            jade: new THREE.MeshStandardMaterial({ color: 0x40916C, roughness: 0.4, metalness: 0.1 }),
            vermillion: new THREE.MeshStandardMaterial({ color: 0xC73E1D, roughness: 0.2, metalness: 0.1 }),
            gold: new THREE.MeshStandardMaterial({ color: 0xE8B86D, roughness: 0.1, metalness: 0.8 }),
            sakura: new THREE.MeshStandardMaterial({ color: 0xFFB7C5, roughness: 0.7, metalness: 0.1 }),
            moss: new THREE.MeshStandardMaterial({ color: 0x606C38, roughness: 0.6, metalness: 0.1 }),
            pond: new THREE.MeshStandardMaterial({ color: 0x7ED6DF, roughness: 0.2, metalness: 0.1 }),
            bamboo: new THREE.MeshStandardMaterial({ color: 0x2D6A4F, roughness: 0.4, metalness: 0.1 }),
            leaf: new THREE.MeshStandardMaterial({ color: 0x3A7D44, roughness: 0.6, metalness: 0.1 }),
            sakuraPetal: new THREE.MeshStandardMaterial({ color: 0xFFE5EC, roughness: 0.9, metalness: 0.1, transparent: true, opacity: 0.8 })
        };

        // Voxel geometry
        const voxelGeometry = new THREE.BoxGeometry(1, 1, 1);

        // Voxel groups
        const voxelGroups = {
            stone: new THREE.InstancedMesh(voxelGeometry, materials.stone, 0),
            teak: new THREE.InstancedMesh(voxelGeometry, materials.teak, 0),
            jade: new THREE.InstancedMesh(voxelGeometry, materials.jade, 0),
            vermillion: new THREE.InstancedMesh(voxelGeometry, materials.vermillion, 0),
            gold: new THREE.InstancedMesh(voxelGeometry, materials.gold, 0),
            sakura: new THREE.InstancedMesh(voxelGeometry, materials.sakura, 0),
            moss: new THREE.InstancedMesh(voxelGeometry, materials.moss, 0),
            pond: new THREE.InstancedMesh(voxelGeometry, materials.pond, 0),
            bamboo: new THREE.InstancedMesh(voxelGeometry, materials.bamboo, 0),
            leaf: new THREE.InstancedMesh(voxelGeometry, materials.leaf, 0),
            sakuraPetal: new THREE.InstancedMesh(voxelGeometry, materials.sakuraPetal, 0)
        };

        // Add all voxel groups to scene
        Object.values(voxelGroups).forEach(group => scene.add(group));

        // Terrain generator
        function generateTerrain() {
            const width = 144;
            const height = 128;
            const depth = 32;
            const terrain = new THREE.BufferGeometry();

            // Create heightmap
            const heightmap = new Float32Array(width * height);
            for (let i = 0; i < heightmap.length; i++) {
                const x = i % width;
                const y = Math.floor(i / width);
                const dist = Math.sqrt(x*x + y*y);
                const noise = Math.sin(x * 0.1 + y * 0.2 + performance.now() * 0.0001) * 0.5;
                heightmap[i] = Math.max(0, Math.sin(dist * 0.05) * 3 + noise * 2);
            }

            // Create vertices and indices
            const vertices = new Float32Array(width * height * 3);
            const indices = new Uint16Array(width * height * 6);

            for (let y = 0; y < height; y++) {
                for (let x = 0; x < width; x++) {
                    const i = y * width + x;
                    const h = heightmap[i];

                    // Vertex positions
                    vertices[i * 3] = x - width/2;
                    vertices[i * 3 + 1] = h;
                    vertices[i * 3 + 2] = y - height/2;

                    // Indices for triangles
                    const topLeft = y * width + x;
                    const topRight = y * width + Math.min(x + 1, width - 1);
                    const bottomLeft = (y + 1) * width + x;
                    const bottomRight = (y + 1) * width + Math.min(x + 1, width - 1);

                    if (x < width - 1 && y < height - 1) {
                        indices[i * 6] = topLeft;
                        indices[i * 6 + 1] = topRight;
                        indices[i * 6 + 2] = bottomLeft;
                        indices[i * 6 + 3] = topRight;
                        indices[i * 6 + 4] = bottomRight;
                        indices[i * 6 + 5] = bottomLeft;
                    }
                }
            }

            terrain.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
            terrain.setIndex(indices);

            // Create instanced mesh
            const terrainMesh = new THREE.Mesh(terrain, materials.stone);
            scene.add(terrainMesh);

            // Add cliff faces
            const cliffVertices = [];
            const cliffIndices = [];

            // Generate cliff faces
            for (let y = 0; y < height - 1; y++) {
                for (let x = 0; x < width - 1; x++) {
                    const topLeft = y * width + x;
                    const topRight = y * width + x + 1;
                    const bottomLeft = (y + 1) * width + x;
                    const bottomRight = (y + 1) * width + x + 1;

                    const h1 = heightmap[topLeft];
                    const h2 = heightmap[topRight];
                    const h3 = heightmap[bottomLeft];
                    const h4 = heightmap[bottomRight];

                    // Create four triangles for the cliff face
                    const vertices = [
                        x - width/2, h1, y - height/2,
                        x - width/2, h3, y - height/2 + 1,
                        x - width/2 + 1, h2, y - height/2,
                        x - width/2 + 1, h4, y - height/2 + 1
                    ];

                    cliffVertices.push(...vertices);

                    const start = cliffVertices.length / 3;
                    cliffIndices.push(
                        start, start + 1, start + 2,
                        start + 2, start + 1, start + 3
                    );
                }
            }

            const cliffGeometry = new THREE.BufferGeometry();
            cliffGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(cliffVertices), 3));
            cliffGeometry.setIndex(cliffIndices);

            const cliffMesh = new THREE.Mesh(cliffGeometry, materials.stone);
            scene.add(cliffMesh);

            // Add underside
            const undersideVertices = [];
            const undersideIndices = [];

            // Generate underside
            for (let y = 0; y < height - 1; y++) {
                for (let x = 0; x < width - 1; x++) {
                    const topLeft = y * width + x;
                    const topRight = y * width + x + 1;
                    const bottomLeft = (y + 1) * width + x;
                    const bottomRight = (y + 1) * width + x + 1;

                    const h1 = heightmap[topLeft];
                    const h2 = heightmap[topRight];
                    const h3 = heightmap[bottomLeft];
                    const h4 = heightmap[bottomRight];

                    // Create four triangles for the underside
                    const vertices = [
                        x - width/2, -1, y - height/2,
                        x - width/2, -1, y - height/2 + 1,
                        x - width/2 + 1, -1, y - height/2,
                        x - width/2 + 1, -1, y - height/2 + 1
                    ];

                    undersideVertices.push(...vertices);

                    const start = undersideVertices.length / 3;
                    undersideIndices.push(
                        start, start + 1, start + 2,
                        start + 2, start + 1, start + 3
                    );
                }
            }

            const undersideGeometry = new THREE.BufferGeometry();
            undersideGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(undersideVertices), 3));
            undersideGeometry.setIndex(undersideIndices);

            const undersideMesh = new THREE.Mesh(undersideGeometry, materials.stone);
            scene.add(undersideMesh);

            // Add moss to underside
            const mossVertices = [];
            const mossIndices = [];

            // Generate moss patches
            for (let i = 0; i < 100; i++) {
                const x = Math.random() * width - width/2;
                const y = Math.random() * height - height/2;
                const z = -1 + Math.random() * 0.5;

                const size = 0.5 + Math.random() * 1.5;

                // Create a patch of moss
                for (let dy = 0; dy < 3; dy++) {
                    for (let dx = 0; dx < 3; dx++) {
                        const px = x + dx * size - 1.5 * size;
                        const py = z;
                        const py2 = z + size;

                        mossVertices.push(px, py, y);
                        mossVertices.push(px, py2, y);
                        mossVertices.push(px + size, py, y);
                        mossVertices.push(px + size, py, y);
                        mossVertices.push(px + size, py2, y);
                        mossVertices.push(px, py2, y);
                    }
                }

                const start = mossVertices.length / 3;
                mossIndices.push(
                    start, start + 1, start + 2,
                    start + 2, start + 1, start + 3,
                    start + 3, start + 4, start + 5,
                    start + 5, start + 4, start + 6
                );
            }

            const mossGeometry = new THREE.BufferGeometry();
            mossGeometry.setAttribute('position', new THREE.BufferAttribute(new Float32Array(mossVertices), 3));
            mossGeometry.setIndex(mossIndices);

            const mossMesh = new THREE.Mesh(mossGeometry, materials.moss);
            scene.add(mossMesh);

            return { width, height, depth };
        }

        const terrain = generateTerrain();

        // Pagoda generator
        function generatePagoda() {
            const pagoda = {
                floors: 5,
                baseSize: 16,
                height: 28,
                materials: {
                    stone: materials.teak,
                    jade: materials.jade,
                    vermillion: materials.vermillion,
                    gold: materials.gold
                }
            };

            // Base plinth
            const plinth = new THREE.InstancedMesh(voxelGeometry, pagoda.materials.stone, 0);
            scene.add(plinth);

            // Add plinth voxels
            for (let x = -pagoda.baseSize/2; x <= pagoda.baseSize/2; x++) {
                for (let y = -pagoda.baseSize/2; y <= pagoda.baseSize/2; y++) {
                    for (let z = 0; z <= 2; z++) {
                        const position = new THREE.Vector3(x, z, y);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 1, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        plinth.setMatrixAt(plinth.count, matrix);
                        plinth.count++;
                    }
                }
            }

            // Add steps
            for (let x = -pagoda.baseSize/2 + 1; x <= pagoda.baseSize/2 - 1; x++) {
                for (let y = -pagoda.baseSize/2 + 1; y <= pagoda.baseSize/2 - 1; y++) {
                    for (let z = 2; z <= 4; z++) {
                        const position = new THREE.Vector3(x, z, y);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 1, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        plinth.setMatrixAt(plinth.count, matrix);
                        plinth.count++;
                    }
                }
            }

            // Add pillars
            const pillars = new THREE.InstancedMesh(voxelGeometry, pagoda.materials.vermillion, 0);
            scene.add(pillars);

            const pillarCount = pagoda.floors * 4;
            for (let floor = 0; floor < pagoda.floors; floor++) {
                const size = pagoda.baseSize - floor * 4;
                const height = floor * 2 + 2;

                for (let i = 0; i < 4; i++) {
                    const x = (i % 2 == 0 ? -size/2 : size/2) + (i < 2 ? 0 : size/2 - 1);
                    const z = (i % 2 == 0 ? -size/2 : size/2) + (i >= 2 ? 0 : size/2 - 1);

                    for (let y = height; y < height + 4; y++) {
                        const position = new THREE.Vector3(x, y, z);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 1, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        pillars.setMatrixAt(pillars.count, matrix);
                        pillars.count++;
                    }
                }
            }

            // Add roof
            const roof = new THREE.InstancedMesh(voxelGeometry, pagoda.materials.jade, 0);
            scene.add(roof);

            for (let floor = 0; floor < pagoda.floors; floor++) {
                const size = pagoda.baseSize - floor * 4;
                const height = floor * 2 + 6;

                // Roof base
                for (let x = -size/2; x <= size/2; x++) {
                    for (let z = -size/2; z <= size/2; z++) {
                        const position = new THREE.Vector3(x, height, z);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 1, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        roof.setMatrixAt(roof.count, matrix);
                        roof.count++;
                    }
                }

                // Roof overhang
                if (floor < pagoda.floors - 1) {
                    const overhang = size/2 + 1;
                    for (let x = -overhang; x <= overhang; x++) {
                        for (let z = -overhang; z <= overhang; z++) {
                            const position = new THREE.Vector3(x, height + 1, z);
                            const quaternion = new THREE.Quaternion();
                            const scale = new THREE.Vector3(1, 1, 1);

                            const matrix = new THREE.Matrix4();
                            matrix.compose(position, quaternion, scale);

                            roof.setMatrixAt(roof.count, matrix);
                            roof.count++;
                        }
                    }
                }

                // Roof edges
                for (let i = 0; i < 4; i++) {
                    const x = (i % 2 == 0 ? -size/2 : size/2) + (i < 2 ? 0 : size/2 - 1);
                    const z = (i % 2 == 0 ? -size/2 : size/2) + (i >= 2 ? 0 : size/2 - 1);

                    for (let y = height; y < height + 2; y++) {
                        const position = new THREE.Vector3(x, y, z);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 1, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        roof.setMatrixAt(roof.count, matrix);
                        roof.count++;
                    }
                }
            }

            // Add gold accents
            const goldAccents = new THREE.InstancedMesh(voxelGeometry, pagoda.materials.gold, 0);
            scene.add(goldAccents);

            // Add gold accents to roof edges
            for (let floor = 0; floor < pagoda.floors; floor++) {
                const size = pagoda.baseSize - floor * 4;
                const height = floor * 2 + 6;

                // Roof edges
                for (let i = 0; i < 4; i++) {
                    const x = (i % 2 == 0 ? -size/2 : size/2) + (i < 2 ? 0 : size/2 - 1);
                    const z = (i % 2 == 0 ? -size/2 : size/2) + (i >= 2 ? 0 : size/2 - 1);

                    for (let y = height; y < height + 1; y++) {
                        const position = new THREE.Vector3(x, y, z);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 1, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        goldAccents.setMatrixAt(goldAccents.count, matrix);
                        goldAccents.count++;
                    }
                }
            }

            // Add doors
            const doors = new THREE.InstancedMesh(voxelGeometry, pagoda.materials.teak, 0);
            scene.add(doors);

            for (let floor = 0; floor < pagoda.floors; floor++) {
                const size = pagoda.baseSize - floor * 4;
                const height = floor * 2 + 2;

                // Door frame
                for (let x = -size/2 + 1; x <= -size/2; x++) {
                    for (let z = -size/2 + 1; z <= -size/2; z++) {
                        for (let y = height; y < height + 4; y++) {
                            const position = new THREE.Vector3(x, y, z);
                            const quaternion = new THREE.Quaternion();
                            const scale = new THREE.Vector3(1, 1, 1);

                            const matrix = new THREE.Matrix4();
                            matrix.compose(position, quaternion, scale);

                            doors.setMatrixAt(doors.count, matrix);
                            doors.count++;
                        }
                    }
                }

                // Door panels
                for (let y = height + 1; y < height + 3; y++) {
                    for (let z = -size/2 + 1; z <= -size/2; z++) {
                        const position = new THREE.Vector3(-size/2, y, z);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 1, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        doors.setMatrixAt(doors.count, matrix);
                        doors.count++;
                    }
                }
            }

            // Add finial
            const finial = new THREE.InstancedMesh(voxelGeometry, pagoda.materials.gold, 0);
            scene.add(finial);

            const finialHeight = pagoda.height + 2;
            for (let y = finialHeight; y < finialHeight + 4; y++) {
                const position = new THREE.Vector3(0, y, 0);
                const quaternion = new THREE.Quaternion();
                const scale = new THREE.Vector3(1, 1, 1);

                const matrix = new THREE.Matrix4();
                matrix.compose(position, quaternion, scale);

                finial.setMatrixAt(finial.count, matrix);
                finial.count++;
            }

            // Add interior light
            const interiorLight = new THREE.PointLight(0xffffff, 0.5, 10);
            interiorLight.position.set(0, pagoda.height/2, 0);
            scene.add(interiorLight);

            // Add doors to pagoda object
            pagoda.doors = doors;
            pagoda.doorOpen = false;
            pagoda.doorAngle = 0;

            return pagoda;
        }

        const pagoda = generatePagoda();
        window.__VOXEL__ = { pagodaFloors: pagoda.floors };

        // Garden elements
        function generateGarden() {
            // Bamboo forest
            const bambooForest = new THREE.InstancedMesh(voxelGeometry, materials.bamboo, 0);
            scene.add(bambooForest);

            // Add bamboo stalks
            for (let i = 0; i < 36; i++) {
                const x = (Math.random() - 0.5) * 32;
                const z = (Math.random() - 0.5) * 24;
                const height = 8 + Math.random() * 12;

                // Stem
                for (let y = 0; y < height; y++) {
                    const position = new THREE.Vector3(x, y, z);
                    const quaternion = new THREE.Quaternion();
                    const scale = new THREE.Vector3(0.5, 1, 0.5);

                    const matrix = new THREE.Matrix4();
                    matrix.compose(position, quaternion, scale);

                    bambooForest.setMatrixAt(bambooForest.count, matrix);
                    bambooForest.count++;
                }

                // Joints
                for (let y = 1; y < height; y += 2) {
                    const position = new THREE.Vector3(x, y, z);
                    const quaternion = new THREE.Quaternion();
                    const scale = new THREE.Vector3(1, 0.2, 1);

                    const matrix = new THREE.Matrix4();
                    matrix.compose(position, quaternion, scale);

                    bambooForest.setMatrixAt(bambooForest.count, matrix);
                    bambooForest.count++;
                }

                // Leaves
                const leafCount = Math.floor(height / 2);
                for (let i = 0; i < leafCount; i++) {
                    const y = 1 + i * 2;
                    const leafX = x + (Math.random() - 0.5) * 0.5;
                    const leafZ = z + (Math.random() - 0.5) * 0.5;

                    const position = new THREE.Vector3(leafX, y, leafZ);
                    const quaternion = new THREE.Quaternion();
                    const scale = new THREE.Vector3(0.8, 0.2, 0.8);

                    const matrix = new THREE.Matrix4();
                    matrix.compose(position, quaternion, scale);

                    bambooForest.setMatrixAt(bambooForest.count, matrix);
                    bambooForest.count++;
                }
            }

            // Paths
            const paths = new THREE.InstancedMesh(voxelGeometry, materials.stone, 0);
            scene.add(paths);

            // Main path
            for (let x = -10; x <= 10; x++) {
                for (let z = -5; z <= 5; z++) {
                    const position = new THREE.Vector3(x, 0, z);
                    const quaternion = new THREE.Quaternion();
                    const scale = new THREE.Vector3(1, 0.5, 1);

                    const matrix = new THREE.Matrix4();
                    matrix.compose(position, quaternion, scale);

                    paths.setMatrixAt(paths.count, matrix);
                    paths.count++;
                }
            }

            // Zen garden
            const zenGarden = new THREE.InstancedMesh(voxelGeometry, materials.stone, 0);
            scene.add(zenGarden);

            // Gravel
            for (let x = -14; x <= 14; x++) {
                for (let z = -10; z <= 10; z++) {
                    const position = new THREE.Vector3(x, 0, z);
                    const quaternion = new THREE.Quaternion();
                    const scale = new THREE.Vector3(0.8, 0.1, 0.8);

                    const matrix = new THREE.Matrix4();
                    matrix.compose(position, quaternion, scale);

                    zenGarden.setMatrixAt(zenGarden.count, matrix);
                    zenGarden.count++;
                }
            }

            // Rocks
            const rocks = new THREE.InstancedMesh(voxelGeometry, materials.stone, 0);
            scene.add(rocks);

            // Add rocks
            for (let i = 0; i < 10; i++) {
                const x = (Math.random() - 0.5) * 20;
                const z = (Math.random() - 0.5) * 15;
                const size = 1 + Math.random() * 2;

                for (let dx = 0; dx < size; dx++) {
                    for (let dz = 0; dz < size; dz++) {
                        for (let dy = 0; dy < size; dy++) {
                            const position = new THREE.Vector3(x + dx - size/2, dy, z + dz - size/2);
                            const quaternion = new THREE.Quaternion();
                            const scale = new THREE.Vector3(1, 1, 1);

                            const matrix = new THREE.Matrix4();
                            matrix.compose(position, quaternion, scale);

                            rocks.setMatrixAt(rocks.count, matrix);
                            rocks.count++;
                        }
                    }
                }
            }

            // Trees
            const trees = new THREE.InstancedMesh(voxelGeometry, materials.leaf, 0);
            scene.add(trees);

            // Sakura trees
            for (let i = 0; i < 3; i++) {
                const x = (Math.random() - 0.5) * 20;
                const z = (Math.random() - 0.5) * 15;
                const height = 6 + Math.random() * 4;

                // Trunk
                for (let y = 0; y < height; y++) {
                    const position = new THREE.Vector3(x, y, z);
                    const quaternion = new THREE.Quaternion();
                    const scale = new THREE.Vector3(0.5, 1, 0.5);

                    const matrix = new THREE.Matrix4();
                    matrix.compose(position, quaternion, scale);

                    trees.setMatrixAt(trees.count, matrix);
                    trees.count++;
                }

                // Branches
                const branchCount = Math.floor(height / 2);
                for (let i = 0; i < branchCount; i++) {
                    const y = 1 + i * 2;
                    const branchX = x + (Math.random() - 0.5) * 2;
                    const branchZ = z + (Math.random() - 0.5) * 2;
                    const branchLength = 2 + Math.random() * 3;

                    for (let l = 0; l < branchLength; l++) {
                        const position = new THREE.Vector3(
                            branchX + (Math.random() - 0.5) * 0.5,
                            y + l,
                            branchZ + (Math.random() - 0.5) * 0.5
                        );
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(0.3, 0.3, 0.3);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        trees.setMatrixAt(trees.count, matrix);
                        trees.count++;
                    }
                }

                // Leaves
                const leafCount = Math.floor(height / 2);
                for (let i = 0; i < leafCount; i++) {
                    const y = 1 + i * 2;
                    const leafX = x + (Math.random() - 0.5) * 2;
                    const leafZ = z + (Math.random() - 0.5) * 2;

                    const position = new THREE.Vector3(leafX, y, leafZ);
                    const quaternion = new THREE.Quaternion();
                    const scale = new THREE.Vector3(1, 0.2, 1);

                    const matrix = new THREE.Matrix4();
                    matrix.compose(position, quaternion, scale);

                    trees.setMatrixAt(trees.count, matrix);
                    trees.count++;
                }
            }

            // Pools
            const pools = new THREE.InstancedMesh(voxelGeometry, materials.pond, 0);
            scene.add(pools);

            // Top pool
            for (let x = -6; x <= 6; x++) {
                for (let z = -6; z <= 6; z++) {
                    const position = new THREE.Vector3(x, 1, z);
                    const quaternion = new THREE.Quaternion();
                    const scale = new THREE.Vector3(1, 0.1, 1);

                    const matrix = new THREE.Matrix4();
                    matrix.compose(position, quaternion, scale);

                    pools.setMatrixAt(pools.count, matrix);
                    pools.count++;
                }
            }

            // Middle pool
            for (let x = -8; x <= 8; x++) {
                for (let z = -8; z <= 8; z++) {
                    const position = new THREE.Vector3(x, 0, z);
                    const quaternion = new THREE.Quaternion();
                    const scale = new THREE.Vector3(1, 0.1, 1);

                    const matrix = new THREE.Matrix4();
                    matrix.compose(position, quaternion, scale);

                    pools.setMatrixAt(pools.count, matrix);
                    pools.count++;
                }
            }

            // Bottom pool
            for (let x = -5; x <= 5; x++) {
                for (let z = -5; z <= 5; z++) {
                    const position = new THREE.Vector3(x, -1, z);
                    const quaternion = new THREE.Quaternion();
                    const scale = new THREE.Vector3(1, 0.1, 1);

                    const matrix = new THREE.Matrix4();
                    matrix.compose(position, quaternion, scale);

                    pools.setMatrixAt(pools.count, matrix);
                    pools.count++;
                }
            }

            // Waterfall
            const waterfall = new THREE.InstancedMesh(voxelGeometry, materials.pond, 0);
            scene.add(waterfall);

            // Waterfall drops
            for (let x = -2; x <= 2; x++) {
                for (let z = -2; z <= 2; z++) {
                    for (let y = -1; y <= 0; y++) {
                        const position = new THREE.Vector3(x, y, z);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 0.1, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        waterfall.setMatrixAt(waterfall.count, matrix);
                        waterfall.count++;
                    }
                }
            }

            // Lanterns
            const lanterns = [];
            for (let i = 0; i < 4; i++) {
                const lantern = new THREE.InstancedMesh(voxelGeometry, materials.gold, 0);
                scene.add(lantern);

                // Position lanterns
                const positions = [
                    { x: -10, z: 5, height: 1 },
                    { x: 0, z: -10, height: 0 },
                    { x: 10, z: 5, height: 1 },
                    { x: 0, z: 10, height: 0 }
                ];

                const pos = positions[i];
                const x = pos.x;
                const z = pos.z;
                const height = pos.height;

                // Lantern base
                for (let dx = -1; dx <= 1; dx++) {
                    for (let dz = -1; dz <= 1; dz++) {
                        for (let dy = 0; dy <= 1; dy++) {
                            const position = new THREE.Vector3(x + dx, height + dy, z + dz);
                            const quaternion = new THREE.Quaternion();
                            const scale = new THREE.Vector3(1, 1, 1);

                            const matrix = new THREE.Matrix4();
                            matrix.compose(position, quaternion, scale);

                            lantern.setMatrixAt(lantern.count, matrix);
                            lantern.count++;
                        }
                    }
                }

                // Lantern body
                for (let dy = 1; dy <= 3; dy++) {
                    for (let dx = -0.5; dx <= 0.5; dx += 0.5) {
                        for (let dz = -0.5; dz <= 0.5; dz += 0.5) {
                            const position = new THREE.Vector3(x + dx, height + dy, z + dz);
                            const quaternion = new THREE.Quaternion();
                            const scale = new THREE.Vector3(1, 1, 1);

                            const matrix = new THREE.Matrix4();
                            matrix.compose(position, quaternion, scale);

                            lantern.setMatrixAt(lantern.count, matrix);
                            lantern.count++;
                        }
                    }
                }

                // Lantern top
                for (let dx = -0.5; dx <= 0.5; dx += 0.5) {
                    for (let dz = -0.5; dz <= 0.5; dz += 0.5) {
                        const position = new THREE.Vector3(x + dx, height + 3, z + dz);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 0.5, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        lantern.setMatrixAt(lantern.count, matrix);
                        lantern.count++;
                    }
                }

                // Lantern light
                const light = new THREE.PointLight(0xffff00, 2, 10);
                light.position.set(x, height + 3, z);
                scene.add(light);

                lanterns.push({
                    mesh: lantern,
                    light: light,
                    position: { x, z, height },
                    isOn: false,
                    flicker: 0
                });
            }

            // Flowers
            const flowers = new THREE.InstancedMesh(voxelGeometry, materials.sakura, 0);
            scene.add(flowers);

            // Add flowers
            for (let i = 0; i < 40; i++) {
                const x = (Math.random() - 0.5) * 30;
                const z = (Math.random() - 0.5) * 20;
                const height = 0.5 + Math.random() * 1.5;

                for (let dy = 0; dy < 2; dy++) {
                    const position = new THREE.Vector3(x, height + dy, z);
                    const quaternion = new THREE.Quaternion();
                    const scale = new THREE.Vector3(0.8, 0.2, 0.8);

                    const matrix = new THREE.Matrix4();
                    matrix.compose(position, quaternion, scale);

                    flowers.setMatrixAt(flowers.count, matrix);
                    flowers.count++;
                }
            }

            // Torii
            const torii = new THREE.InstancedMesh(voxelGeometry, materials.teak, 0);
            scene.add(torii);

            // Torii base
            for (let x = -2; x <= 2; x++) {
                for (let z = -2; z <= 2; z++) {
                    for (let y = 0; y <= 1; y++) {
                        const position = new THREE.Vector3(x, y, z);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 1, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        torii.setMatrixAt(torii.count, matrix);
                        torii.count++;
                    }
                }
            }

            // Torii pillars
            for (let x = -2; x <= 2; x += 4) {
                for (let z = -2; z <= 2; z += 4) {
                    for (let y = 1; y <= 3; y++) {
                        const position = new THREE.Vector3(x, y, z);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(0.5, 1, 0.5);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        torii.setMatrixAt(torii.count, matrix);
                        torii.count++;
                    }
                }
            }

            // Torii top
            for (let x = -1; x <= 1; x++) {
                for (let z = -1; z <= 1; z++) {
                    for (let y = 3; y <= 4; y++) {
                        const position = new THREE.Vector3(x, y, z);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 0.5, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        torii.setMatrixAt(torii.count, matrix);
                        torii.count++;
                    }
                }
            }

            // Bridge
            const bridge = new THREE.InstancedMesh(voxelGeometry, materials.teak, 0);
            scene.add(bridge);

            // Bridge base
            for (let x = -3; x <= 3; x++) {
                for (let z = -0.5; z <= 0.5; z++) {
                    for (let y = 0; y <= 1; y++) {
                        const position = new THREE.Vector3(x, y, z);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 1, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        bridge.setMatrixAt(bridge.count, matrix);
                        bridge.count++;
                    }
                }
            }

            // Bridge supports
            for (let x = -3; x <= 3; x += 2) {
                for (let z = -0.5; z <= 0.5; z++) {
                    for (let y = 1; y <= 2; y++) {
                        const position = new THREE.Vector3(x, y, z);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(0.5, 1, 0.5);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        bridge.setMatrixAt(bridge.count, matrix);
                        bridge.count++;
                    }
                }
            }

            // Bridge railing
            for (let x = -3; x <= 3; x++) {
                for (let z = -0.5; z <= 0.5; z++) {
                    for (let y = 2; y <= 3; y++) {
                        const position = new THREE.Vector3(x, y, z);
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(1, 0.2, 1);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        bridge.setMatrixAt(bridge.count, matrix);
                        bridge.count++;
                    }
                }
            }

            return {
                bambooForest,
                paths,
                zenGarden,
                rocks,
                trees,
                pools,
                waterfall,
                lanterns,
                flowers,
                torii,
                bridge
            };
        }

        const garden = generateGarden();

        // Koi fish
        const koi = [];
        for (let i = 0; i < 6; i++) {
            const fish = new THREE.InstancedMesh(voxelGeometry, materials.pond, 0);
            scene.add(fish);

            // Fish body
            const x = (Math.random() - 0.5) * 10;
            const z = (Math.random() - 0.5) * 10;
            const y = 0.5;

            for (let dx = 0; dx < 4; dx++) {
                for (let dz = 0; dz < 1; dz++) {
                    for (let dy = 0; dy < 1; dy++) {
                        const position = new THREE.Vector3(
                            x + dx - 1.5,
                            y + dy,
                            z + dz - 0.5
                        );
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(0.8, 0.5, 0.3);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        fish.setMatrixAt(fish.count, matrix);
                        fish.count++;
                    }
                }
            }

            // Fish tail
            for (let dx = 0; dx < 2; dx++) {
                for (let dz = 0; dz < 1; dz++) {
                    for (let dy = 0; dy < 1; dy++) {
                        const position = new THREE.Vector3(
                            x + 2.5 - dx,
                            y + dy,
                            z + dz - 0.5
                        );
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(0.5, 0.5, 0.3);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        fish.setMatrixAt(fish.count, matrix);
                        fish.count++;
                    }
                }
            }

            koi.push({
                mesh: fish,
                position: { x, z },
                angle: 0,
                speed: 0.01 + Math.random() * 0.02
            });
        }

        // Sakura petals
        const petals = new THREE.InstancedMesh(voxelGeometry, materials.sakuraPetal, 0);
        scene.add(petals);

        // Add petals
        for (let i = 0; i < 200; i++) {
            const x = (Math.random() - 0.5) * 30;
            const z = (Math.random() - 0.5) * 20;
            const y = 1 + Math.random() * 5;
            const size = 0.3 + Math.random() * 0.5;

            const position = new THREE.Vector3(x, y, z);
            const quaternion = new THREE.Quaternion();
            const scale = new THREE.Vector3(size, size, size);

            const matrix = new THREE.Matrix4();
            matrix.compose(position, quaternion, scale);

            petals.setMatrixAt(petals.count, matrix);
            petals.count++;
        }

        // Birds
        const birds = [];
        for (let i = 0; i < 10; i++) {
            const bird = new THREE.InstancedMesh(voxelGeometry, materials.leaf, 0);
            scene.add(bird);

            // Bird body
            const x = (Math.random() - 0.5) * 30;
            const z = (Math.random() - 0.5) * 20;
            const y = 2 + Math.random() * 5;

            for (let dx = 0; dx < 2; dx++) {
                for (let dz = 0; dz < 1; dz++) {
                    for (let dy = 0; dy < 1; dy++) {
                        const position = new THREE.Vector3(
                            x + dx - 0.5,
                            y + dy,
                            z + dz - 0.5
                        );
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(0.5, 0.3, 0.5);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        bird.setMatrixAt(bird.count, matrix);
                        bird.count++;
                    }
                }
            }

            // Bird wings
            for (let dx = 0; dx < 3; dx++) {
                for (let dz = 0; dz < 1; dz++) {
                    for (let dy = 0; dy < 1; dy++) {
                        const position = new THREE.Vector3(
                            x + dx - 1,
                            y + dy,
                            z + dz - 0.5
                        );
                        const quaternion = new THREE.Quaternion();
                        const scale = new THREE.Vector3(0.8, 0.2, 0.8);

                        const matrix = new THREE.Matrix4();
                        matrix.compose(position, quaternion, scale);

                        bird.setMatrixAt(bird.count, matrix);
                        bird.count++;
                    }
                }
            }

            birds.push({
                mesh: bird,
                position: { x, z },
                angle: Math.random() * Math.PI * 2,
                speed: 0.005 + Math.random() * 0.01,
                height: y
            });
        }

        // Sky and ground
        const skyGeometry = new THREE.SphereGeometry(1000, 32, 32);
        const skyMaterial = new THREE.MeshBasicMaterial({
            color: 0x000000,
            side: THREE.BackSide
        });
        const sky = new THREE.Mesh(skyGeometry, skyMaterial);
        scene.add(sky);

        // Update sky color based on time
        function updateSky() {
            const skyColor = new THREE.Color();
            const groundColor = new THREE.Color();

            if (time < 15 || time > 75) {
                // Night
                skyColor.setHex(0x000033);
                groundColor.setHex(0x000011);
            } else {
                // Day
                const progress = (time - 15) / 60;
                const hue = Math.sin(progress * Math.PI * 2) * 0.5 + 0.5;
                skyColor.setHSL(hue, 0.7, 0.5);
                groundColor.setHex(0x333333);
            }

            sky.material.color = skyColor;
            directionalLight.color = skyColor.clone().multiplyScalar(1.5);
            hemisphereLight.color.set(skyColor.clone().multiplyScalar(0.7));
        }

        // Animation loop
        let lastFrame = performance.now();
        let voxelCount = 0;
        let frameCount = 0;
        let fps = 0;

        function animate() {
            requestAnimationFrame(animate);

            const now = performance.now();
            deltaTime = (now - lastFrame) / 1000;
            lastFrame = now;

            if (!isPaused) {
                time += deltaTime * 10;
                if (time > 90) time = 0;
            }

            updateSky();

            // Update lanterns
            for (const lantern of garden.lanterns) {
                lantern.flicker += deltaTime * 0.5;
                const intensity = 0.5 + Math.sin(lantern.flicker) * 0.5;
                lantern.light.intensity = lantern.isOn ? intensity : 0;
            }

            // Update pagoda doors
            if (pagoda.doorOpen) {
                pagoda.doorAngle += deltaTime * 0.5;
                if (pagoda.doorAngle > Math.PI/2) {
                    pagoda.doorOpen = false;
                }
            } else {
                pagoda.doorAngle -= deltaTime * 0.5;
                if (pagoda.doorAngle < 0) {
                    pagoda.doorOpen = true;
                }
            }

            // Update koi
            for (const fish of koi) {
                fish.angle += fish.speed;
                const x = fish.position.x + Math.cos(fish.angle) * 0.5;
                const z = fish.position.z + Math.sin(fish.angle) * 0.5;

                // Update fish position
                for (let i = 0; i < fish.mesh.count; i++) {
                    const matrix = new THREE.Matrix4().clone();
                    fish.mesh.getMatrixAt(i, matrix);

                    const position = new THREE.Vector3();
                    matrix.decompose(position, new THREE.Quaternion(), new THREE.Vector3());

                    position.x = x;
                    position.z = z;

                    const newMatrix = new THREE.Matrix4();
                    newMatrix.compose(position, new THREE.Quaternion(), new THREE.Vector3(0.8, 0.5, 0.3));
                    fish.mesh.setMatrixAt(i, newMatrix);
                }
            }

            // Update birds
            for (const bird of birds) {
                bird.angle += bird.speed;
                const x = bird.position.x + Math.cos(bird.angle) * 0.5;
                const z = bird.position.z + Math.sin(bird.angle) * 0.5;
                const y = bird.height + Math.sin(bird.angle * 2) * 0.5;

                // Update bird position
                for (let i = 0; i < bird.mesh.count; i++) {
                    const matrix = new THREE.Matrix4().clone();
                    bird.mesh.getMatrixAt(i, matrix);

                    const position = new THREE.Vector3();
                    matrix.decompose(position, new THREE.Quaternion(), new THREE.Vector3());

                    position.x = x;
                    position.y = y;
                    position.z = z;

                    const newMatrix = new THREE.Matrix4();
                    newMatrix.compose(position, new THREE.Quaternion(), new THREE.Vector3(0.5, 0.3, 0.5));
                    bird.mesh.setMatrixAt(i, newMatrix);
                }
            }

            // Update sakura petals
            for (let i = 0; i < petals.count; i++) {
                const matrix = new THREE.Matrix4().clone();
                petals.getMatrixAt(i, matrix);

                const position = new THREE.Vector3();
                matrix.decompose(position, new THREE.Quaternion(), new THREE.Vector3());

                position.y -= deltaTime * 0.1;

                if (position.y < 0) {
                    position.x = (Math.random() - 0.5) * 30;
                    position.z = (Math.random() - 0.5) * 20;
                    position.y = 1 + Math.random() * 5;
                }

                const newMatrix = new THREE.Matrix4();
                newMatrix.compose(position, new THREE.Quaternion(), new THREE.Vector3(0.3, 0.3, 0.3));
                petals.setMatrixAt(i, newMatrix);
            }

            // Update camera for intro
            if (animationFrameId) {
                cancelAnimationFrame(animationFrameId);
            }

            if (performance.now() < 2500) {
                const progress = (performance.now() - 2000) / 500;
                const targetPosition = new THREE.Vector3(0, 5, 20);
                const targetLookAt = new THREE.Vector3(0, 5, -20);

                camera.position.lerp(targetPosition, progress);
                camera.lookAt(targetLookAt);
            } else {
                // Auto-rotate when idle
                if (controls.enabled) {
                    controls.enableDamping = false;
                    controls.rotateLeft(Math.sin(Date.now() * 0.0005) * 0.005);
                    controls.enableDamping = true;
                }
            }

            // Update voxel count
            let totalVoxels = 0;
            for (const group of Object.values(voxelGroups)) {
                totalVoxels += group.count;
            }
            voxelCount = totalVoxels;

            // Update FPS
            frameCount++;
            if (performance.now() - lastTime >= 1000) {
                fps = Math.round((frameCount * 1000) / (performance.now() - lastTime));
                frameCount = 0;
                lastTime = performance.now();
            }

            // Update UI
            document.getElementById('voxel-count').textContent = `${voxelCount.toLocaleString()} voxels`;
            document.getElementById('fps').textContent = `${fps} FPS`;

            // Render
            composer.render();
        }

        // Event listeners
        document.getElementById('time-slider').addEventListener('input', function() {
            time = parseInt(this.value);
            updateSky();
        });

        document.getElementById('pause-btn').addEventListener('click', function() {
            isPaused = !isPaused;
            this.textContent = isPaused ? 'Play' : 'Pause';
        });

        // Handle lantern clicks
        renderer.domElement.addEventListener('click', (event) => {
            const mouse = new THREE.Vector2();
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            const raycaster = new THREE.Raycaster();
            raycaster.setFromCamera(mouse, camera);

            // Check for lanterns
            for (const lantern of garden.lanterns) {
                const lanternPosition = new THREE.Vector3(lantern.position.x, lantern.position.height + 3, lantern.position.z);
                const lanternDistance = raycaster.ray.distanceToPoint(lanternPosition);

                if (lanternDistance < 2) {
                    lantern.isOn = !lantern.isOn;
                    break;
                }
            }

            // Check for pagoda doors
            const pagodaPosition = new THREE.Vector3(0, 2, 0);
            const pagodaDistance = raycaster.ray.distanceToPoint(pagodaPosition);

            if (pagodaDistance < 5) {
                pagoda.doorOpen = !pagoda.doorOpen;
            }
        });

        // Start animation
        animate();

        // Handle window resize
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
