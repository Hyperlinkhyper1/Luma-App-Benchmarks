<!DOCTYPE html>
<html lang="en">

<title>A Timeline of the World — SVG Documentary</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#0b0d12;font-family:Georgia,'Times New Roman',serif;color:#f5efe0}
#wrap{position:fixed;inset:0}
svg#main{position:absolute;inset:0;width:100%;height:100%;display:block}
#caption{position:absolute;top:18px;left:22px;max-width:560px;background:rgba(8,10,18,.55);border:1px solid rgba(245,239,224,.25);border-radius:12px;padding:14px 18px;backdrop-filter:blur(4px);pointer-events:none;transition:opacity .35s}
#caption h1{margin:0 0 4px;font-size:clamp(17px,2.4vw,26px);letter-spacing:.4px;color:#ffe9a8}
#caption .date{font-size:clamp(11px,1.3vw,14px);letter-spacing:2px;text-transform:uppercase;color:#9fd8ff;margin-bottom:6px}
#caption p{margin:0;font-size:clamp(11px,1.25vw,15px);line-height:1.45;color:#e8e2d2}
#controls{position:absolute;bottom:108px;left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;background:rgba(10,12,20,.6);padding:6px 10px;border-radius:10px;border:1px solid rgba(245,239,224,.18);backdrop-filter:blur(4px)}
#controls button,#controls select{background:#1c2230;color:#f5efe0;border:1px solid #3c465e;border-radius:7px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit}
#controls button:hover{background:#2a3348}
#readout{position:absolute;bottom:112px;left:22px;background:rgba(8,10,18,.55);border:1px solid rgba(245,239,224,.2);border-radius:10px;padding:8px 14px;font-size:clamp(12px,1.5vw,17px);letter-spacing:.5px;color:#ffe9a8;min-width:260px}
#readout small{display:block;font-size:.6em;color:#9fd8ff;letter-spacing:1.5px;text-transform:uppercase;margin-top:2px}
#timeline{position:absolute;left:0;right:0;bottom:0;height:100px;background:linear-gradient(180deg,rgba(8,10,16,0) 0%,rgba(8,10,16,.92) 30%,#0a0c13 100%);border-top:1px solid rgba(245,239,224,.25);padding:26px 18px 8px}
#bar{position:relative;height:34px;background:rgba(255,255,255,.05);border-radius:8px;border:1px solid rgba(255,255,255,.14)}
.band{position:absolute;top:0;height:100%;border-radius:6px;opacity:.28;border-right:1px solid rgba(0,0,0,.4);font-size:9px;letter-spacing:1px;color:#e8e2d2;text-transform:uppercase;display:flex;align-items:center;justify-content:center;overflow:hidden;white-space:nowrap}
.tick{position:absolute;top:-4px;width:10px;height:42px;cursor:pointer;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:3}
.tick::after{content:'';width:3px;height:44px;background:#ffd76a;border-radius:2px;box-shadow:0 0 6px rgba(255,215,106,.7)}
.tick:hover::after{background:#fff;transform:scaleY(1.15)}
.tick span{position:absolute;bottom:-2px;font-size:9px;color:#8f8b7d;transform:translateY(18px)}
#playhead{position:absolute;top:-9px;bottom:-9px;width:4px;background:#ffe9a8;border-radius:2px;box-shadow:0 0 10px rgba(255,233,168,.9);cursor:grab;z-index:4}
#playhead:active{cursor:grabbing}
#scaleLabel{font-size:10px;letter-spacing:2px;color:#8f8b7d;text-transform:uppercase;margin-bottom:6px;display:flex;justify-content:space-between}
#hint{position:absolute;bottom:118px;right:22px;font-size:11px;color:#9a947f;background:rgba(8,10,18,.5);padding:6px 10px;border-radius:8px;letter-spacing:.5px}
@keyframes rise{0%{transform:translateY(0) scale(1);opacity:0}15%{opacity:1}100%{transform:translateY(-90px) scale(.6);opacity:0}}
@keyframes smokeUp{0%{transform:translateY(0) scale(.7);opacity:.75}100%{transform:translateY(-70px) scale(1.7);opacity:0}}
@keyframes snow{0%{transform:translateY(0);opacity:0}20%{opacity:.9}100%{transform:translateY(70px);opacity:0}}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-10px) rotate(2deg)}}
@keyframes twinkle{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes blink{0%,100%{opacity:.2}50%{opacity:1}}
@keyframes drift{0%,100%{transform:translateX(-14px)}50%{transform:translateX(14px)}}
.ember{animation:rise 2.6s linear infinite}
.smoke{animation:smokeUp 3.2s ease-out infinite}
.snow{animation:snow 4s linear infinite}
.bob{animation:bob 4s ease-in-out infinite}
.tw{animation:twinkle 2.4s ease-in-out infinite}
.blink{animation:blink 1.6s steps(2) infinite}
.drift{animation:drift 9s ease-in-out infinite}
</style>
</head>

<script>
const svg=document.getElementById('main');
const LOGM=Math.log10(4.54e9);
const LOGAGE=age=>Math.log10(Math.max(age,1));
const ageToP=age=>1-LOGAGE(age)/LOGM;
const pToAge=p=>Math.pow(10,(1-p)*LOGM)-1;

const CHAPTERS=[
 {t:"Formation of the Earth",d:"≈ 4.54 billion years ago",c:"A swirling disk of dust forms Earth. A Mars-sized world called Theia slams into it, and the debris that flies off builds the Moon.",age:4.54e9,era:"Hadean"},
 {t:"The Hadean",d:"≈ 4.5 – 3.8 billion years ago",c:"The surface is molten rock, bombarded and steaming. As it slowly cools, the first oceans condense — water on a molten world.",age:4.1e9,era:"Hadean"},
 {t:"First Life",d:"≈ 3.7 – 3.5 billion years ago",c:"Life appears as microbial mats in the warm seas. Layered structures — stromatolites — record the time.",age:3.7e9,era:"Archean"},

const NN=CHAPTERS.length;
CHAPTERS.forEach(ch=>ch.p=ageToP(ch.age));

// era bands
const ERAS=[["Hadean",4.54e9,4.0e9,"#5a3a3a"],["Archean",4.0e9,2.5e9,"#4a5a3a"],["Proterozoic",2.5e9,5.4e8,"#3a5a4a"],["Paleozoic",5.4e8,2.5e8,"#3a6a7a"],["Mesozoic",2.5e8,6.6e7,"#5a5a7a"],["Cenozoic",6.6e7,1.2e4,"#7a5a3a"],["Human history",1.2e4,0,"#5a4a6a"]];
const bar=document.getElementById('bar');
ERAS.forEach(e=>{
  const x0=ageToP(e[1]),x1=e[2]===0?1:ageToP(e[2]);
  const d=document.createElement('div');d.className='band';
  d.style.left=(x0*100)+'%';d.style.width=Math.max((x1-x0)*100,2)+'%';d.style.background=e[3];d.innerHTML=`<span>${e[0]}</span>`;
  bar.insertBefore(d,document.getElementById('playhead'));
});
CHAPTERS.forEach((ch,i)=>{
  const t=document.createElement('div');t.className='tick';t.style.left=(ch.p*100)+'%';
  t.title=(i+1)+'. '+ch.t;t.innerHTML='<span>'+(i+1)+'</span>';
  t.addEventListener('click',()=>{p=ch.p;lastCh=-1;});
  bar.insertBefore(t,document.getElementById('playhead'));
});

const stars=document.getElementById('stars');
for(let i=0;i<70;i++){const c=document.createElementNS('http://www.w3.org/2000/svg','circle');c.setAttribute('cx',Math.random()*1600);c.setAttribute('cy',Math.random()*520);c.setAttribute('r',(Math.random()*2+0.6).toFixed(1));c.setAttribute('fill','#fff');c.setAttribute('class','tw');c.style.animationDelay=(Math.random()*2.4)+'s';c.style.opacity=Math.random()*.6+.2;stars.appendChild(c);}

// continents
const CONT=document.getElementById('continents');
const blob=['M726 366 q40 -34 96 -14 q52 22 46 66 q-8 48 -74 56 q-70 10 -96 -34 q-20 -34 28 -74 Z','M838 512 q52 -26 100 -4 q48 22 38 58 q-18 40 -86 40 q-64 0 -74 -38 q-8 -38 22 -56 Z','M700 556 q34 -20 72 -4 q34 16 30 42 q-20 30 -70 30 q-52 -2 -60 -34 q-6 -22 28 -34 Z'];
blob.forEach(d=>{const p=document.createElementNS('http://www.w3.org/2000/svg','path');p.setAttribute('d',d);p.setAttribute('fill','#2e7d46');p.setAttribute('opacity','.92');CONT.appendChild(p);});

const SKY=[
 ['#1a0b2e','#ff6b35','#4a1408','#5a2a1a','#2c2016'], // 1
 ['#2b1620','#d1713a','#5a2410','#7a3a1a','#2a1c14'],
 ['#3b2a33','#e2a468','#2f6f5a','#3f8f6a','#3a3226'],
 ['#0e5a6b','#3aa88f','#1c7a5a','#2aa872','#223324'],
 ['#3a5a8a','#bcd3e8','#8fb3cc','#e8f0f8','#d7e4ef'],
 ['#1d4a6a','#7fc0c9','#1d6a6a','#2a9a7a','#26332a'],
 ['#2a7bb8','#bfe6f2','#1c6a4a','#3aa85a','#2e4a2a'],
 ['#4a9ad1','#f3d9a0','#2e5a3a','#4c9a4c','#4a4a22'],
 ['#3a1010','#c24a2a','#5a2a2a','#6a7a3a','#2a2016'],
 ['#2e5a4a','#9fd6a8','#1c6a3a','#3aa85a','#2a3a24'],
 ['#2e6a8a','#e8caa0','#2a6a3a','#4aa85a','#3a3324'],
 ['#2a5a2a','#a8d08a','#2e6a2e','#5aa83a','#2a3a1e'],
 ['#c2782a','#ffd98a','#8a6a3a','#d9a55a','#a8783a'],
 ['#2a4a6a','#cfe0e8','#1d4a3a','#3aa85a','#3a5a3a'],
 ['#2a3a3a','#7a8a7a','#2a3a3a','#4a6a4a','#3a3a30'],
 ['#1a3a6a','#8fc6e8','#1d5a3a','#3aa86a','#2a3f2a'],
 ['#3a3a44','#b8b0a0','#3a3a44','#6a8a5a','#3a3a3a'],
 ['#1a2a4a','#8ab8d8','#2a2a5a','#3aa85a','#2a324a'],
 ['#070a18','#2a3a5a','#0a1024','#1a2a4a','#0d1020']
];
const GLOBE_TOP=[
 ['#ff8a50','#7a3b1e','#2b1410'],['#ff8a50','#7a3b1e','#2b1410'],['#5acfb0','#1c5a5a','#0d2a2a'],['#5acfb0','#1c7a6a','#0d2a2a'],['#dce8f2','#a8b8cc','#3a4a5a'],['#5acfb0','#1c6a6a','#0d2a2a'],['#6acfa0','#1c6a4a','#0d2a1a'],['#6acfa0','#1c5a3a','#0d2a1a'],['#5a6a6a','#3a3a44','#1a1a22'],['#5acfa0','#1c6a4a','#0d2a1a'],['#5acfa0','#1c6a4a','#0d2a1a'],['#6acfa0','#1c6a4a','#0d2a1a'],['#e8c98a','#8a5a3a','#3a2a1a'],['#5acfa0','#1c6a4a','#0d2a1a'],['#5acfa0','#1c5a4a','#0d2a1a'],['#5acfa0','#1c6a4a','#0d2a1a'],['#6acfa0','#2a5a3a','#0d2a1a'],['#5acfa0','#1c6a4a','#0d2a1a'],['#1a2a4a','#2a3a5a','#0a0f1e']
];
function hexLerp(a,b,f){const A=parseInt(a.slice(1),16),B=parseInt(b.slice(1),16);const r=(A>>16)+(((B>>16)-(A>>16))*f),g=((A>>8)&255)+((((B>>8)&255)-(A>>8))*f),bl=(A&255)+(((B&255)-(A&255))*f);return '#'+((r<<16|g<<8|bl)>>>0).toString(16).padStart(6,'0');}
function lerp3(a,b,f){return [hexLerp(a[0],b[0],f),hexLerp(a[1],b[1],f),hexLerp(a[2],b[2],f)];}

const skyT=document.getElementById('skyT'),skyB=document.getElementById('skyB'),
   glC1=document.getElementById('glC1'),glC2=document.getElementById('glC2'),glC3=document.getElementById('glC3'),
   ground=document.getElementById('ground'),oceanTint=document.getElementById('oceanTint'),
   iceCap=document.getElementById('iceCap'),sun=document.getElementById('sun'),sunCore=document.getElementById('sunCore'),
   globeGlow=document.getElementById('globeGlow'),starsG=document.getElementById('stars'),
   globe=document.getElementById('globe'),CONTG=document.getElementById('continents'),
   sScenes=CHAPTERS.map((_,i)=>document.getElementById('s'+(i+1)));

let p=0,speed=1,playing=true,lastTime=performance.now(),lastCh=-1,duration=170;
const wanted=i=>{const pp=CHAPTERS[i].p;p=pp;lastCh=-1;};

function fmt(age){if(age>=1e9)return(age/1e9).toFixed(2)+' billion years ago';if(age>=1e6)return(age/1e6).toFixed(1)+' million years ago';if(age>=1e3)return(age/1e3).toFixed(1)+' thousand years ago';if(age>=1)return Math.round(age)+' years ago';return'today';}

let cur=-1;
function chapterAt(p){let i=0;for(let j=0;j<NN;j++){const mid=(j<NN-1)?(CHAPTERS[j].p+CHAPTERS[j+1].p)/2:2;if(p<mid)return j;if(j===NN-1)return j;}return NN-1;}

function update(){
 const gi=Math.floor(p*(NN-1)/1); // rough index
 // find bracket
 let i=0;for(let j=0;j<NN-1;j++){if(p<CHAPTERS[j+1].p){i=j;break;}if(j===NN-2)i=NN-1;}
 if(p>=CHAPTERS[NN-1].p)i=NN-1;
 const a=CHAPTERS[i],b=CHAPTERS[Math.min(i+1,NN-1)];
 const f=(b.p===a.p)?0:Math.min(1,Math.max(0,(p-a.p)/((b.p||a.p+0.0001)-a.p||0.0001)));

 const G1=SKY[i],G2=SKY[Math.min(i+1,NN-1)];
 skyT.setAttribute('stop-color',hexLerp(G1[0],G2[0],f));
 skyB.setAttribute('stop-color',hexLerp(G1[1],G2[1],f));
 ground.setAttribute('fill',hexLerp(G1[4],G2[4],f));
 const g1=GLOBE_TOP[i],g2=GLOBE_TOP[Math.min(i+1,NN-1)];
 const lg=lerp3(g1,g2,f);
 glC1.setAttribute('stop-color',lg[0]);glC2.setAttribute('stop-color',lg[1]);glC3.setAttribute('stop-color',lg[2]);
 oceanTint.setAttribute('opacity',Math.min(.55,Math.max(0,(g1[1]&&p<0.6)?.55:0.55)));

 iceCap.setAttribute('opacity',(i===4?0.95:(i===3?0.4:(i===5?0.4:0))));

 // scale stars at night
 const nightF=Math.max(0,Math.min(1,(p-0.82)/0.18));
 starsG.style.opacity=nightF.toFixed(2);
 sun.setAttribute('opacity',(1-nightF*.95).toFixed(2));sunCore.setAttribute('opacity',(1-nightF*.95).toFixed(2));
 sun.setAttribute('cy',150+nightF*250);sunCore.setAttribute('cy',150+nightF*250);

 globeGlow.setAttribute('opacity',(p<0.08?0.55:Math.max(0,0.55-p*1.2)).toFixed(2));
 globeGlow.setAttribute('fill','url(#glowG)');

 // continents: pangaea amount
 const P=[[0,1],[0.1,0.1],[0.22,0.15],[0.34,0.12],[0.45,0.12],[0.52,0.35],[0.6,0.6],[0.68,1],[0.76,0.55],[0.84,0.25],[1,0.15]];
 let pa=0.2;
 for(let j=0;j<P.length-1;j++){if(p>=P[j][0]&&p<P[j+1][0]){const f2=(p-P[j][0])/(P[j+1][0]-P[j][0]);pa=P[j][1]+(P[j+1][1]-P[j][1])*f2;break;}if(p>=P[P.length-1][0])pa=0.15;}
 const spread=1+(1-pa)*0.55;
 CONTG.setAttribute('transform',`translate(800,430) scale(${(1.15-pa*0.55).toFixed(3)}) rotate(${((p*40)%60-30)*(1-pa)*0.6} 0 0) translate(-800,-430)`);
 CONTG.setAttribute('opacity',(Math.min(1,Math.max(0,(p-0.05)/0.18))).toFixed(2));
 globe.setAttribute('r',196);

 // chapter scenes
 for(let j=0;j<NN;j++){
  const d=Math.abs(p-CHAPTERS[j].p);
  const op=Math.max(0,Math.min(1,1-Math.max(0,d-0.012)/0.045));
  sScenes[j].setAttribute('opacity',op.toFixed(2));
 }
 // caption
 const chIdx=chapterAt(p);
 if(chIdx!==lastCh){
  lastCh=chIdx;const ch=CHAPTERS[chIdx];
  document.getElementById('capTitle').textContent=(chIdx+1)+'. '+ch.t;
  document.getElementById('capDate').textContent=ch.d;
  document.getElementById('capBody').textContent=ch.c;
  document.getElementById('readerDate').textContent=fmt(pToAge(p));
  document.getElementById('readerEra').textContent=ch.era;
 }
 // readout continuous
 document.getElementById('readerDate').textContent=fmt(pToAge(p));

 // playhead
 document.getElementById('playhead').style.left=(p*100)+'%';
}

const btnPlay=document.getElementById('btnPlay'),speedSel=document.getElementById('speed');
btnPlay.addEventListener('click',()=>{playing=!playing;btnPlay.textContent=playing?'❚❚ Pause':'▶ Play';});
speedSel.addEventListener('change',()=>speed=parseFloat(speedSel.value));
document.getElementById('btnRestart').addEventListener('click',()=>{p=0;lastCh=-1;});

// drag playhead
const bar2=document.getElementById('bar'),playhead=document.getElementById('playhead');
let dragging=false;
function setPFromEvent(e){const r=bar2.getBoundingClientRect();p=Math.min(1,Math.max(0,(e.clientX-r.left)/r.width));}
playhead.addEventListener('pointerdown',e=>{dragging=true;playhead.setPointerCapture(e.pointerId);e.preventDefault();});
playhead.addEventListener('pointermove',e=>{if(dragging)setPFromEvent(e);});
playhead.addEventListener('pointerup',()=>dragging=false);
bar2.addEventListener('pointerdown',e=>{if(e.target!==playhead){dragging=true;bar2.setPointerCapture(e.pointerId);setPFromEvent(e);}});
bar2.addEventListener('pointermove',e=>{if(dragging&&e.target===bar2)setPFromEvent(e);});
bar2.addEventListener('pointerup',()=>dragging=false);

window.addEventListener('keydown',e=>{
 if(e.code==='Space'){e.preventDefault();playing=!playing;btnPlay.textContent=playing?'❚❚ Pause':'▶ Play';}
 if(e.code==='ArrowRight'){const i=chapterAt(p);const n=Math.min(NN-1,i+1);p=CHAPTERS[n].p;lastCh=-1;}
 if(e.code==='ArrowLeft'){const i=chapterAt(p);const n=Math.max(0,i-1);p=CHAPTERS[n].p;lastCh=-1;}
});

function loop(now){
 const dt=Math.min(0.05,(now-lastTime)/1000);lastTime=now;
 if(playing&&!dragging){p+=dt*speed/duration;if(p>=1){p=0;lastCh=-1;}}
 update();requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
</body>
