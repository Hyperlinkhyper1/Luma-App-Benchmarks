function rackPowerHTML(){
 let tot=0,html='';
 servers.forEach(s=>{tot+=s.kw;html+=`<div class="row"><span class="k">${s.name}</span><span class="mono">${s.kw.toFixed(1)} kW</span></div>`;});
 html+=`<div class="row" style="border-top:1px solid var(--line);margin-top:4px;padding-top:4px"><span>TOTAL</span><span class="mono hl">${tot.toFixed(1)} kW</span></div>`;
 html+=`<div style="color:var(--dim);font-size:10.5px;margin-top:6px">ESTIMATED HEAT OUTPUT ≈ ${tot.toFixed(1)} kW. Nearly all electrical power consumed by servers becomes heat that the datacenter cooling system must remove.</div>`;
 return html;}
function updLeft(){
 let html='<h2>Rack overview</h2><div class="row"><span class="k">Rack</span><span>42U · 0.6 m · 2× PDU</span></div>';
 servers.forEach((s,i)=>{html+=`<div class="srv ${i===state.sel?'sel':''}" data-i="${i}"><span>${s.name}</span><span class="pos">${s.label}</span></div>`;});
 html+='<h2>Camera presets</h2><div class="btns">';
 if(state.mode==='rack')html+='<div class="btn pk" data-p="front">FRONT</div><div class="btn pk" data-p="3/4">3/4</div><div class="btn pk" data-p="side">SIDE</div><div class="btn pk" data-p="rear">REAR</div>';
 else html+='<div class="btn pk" data-p="whole">WHOLE SLICE</div><div class="btn pk" data-p="top">TOP DOWN</div><div class="btn pk" data-p="eng">3/4 ENG</div><div class="btn pk" data-p="front">FRONT INT.</div><div class="btn pk" data-p="rear">REAR INT.</div><div class="btn pk" data-p="cpu">CPU+MEM</div><div class="btn pk" data-p="gpu">GPU AREA</div><div class="btn pk" data-p="stor">STORAGE</div>';
 html+='</div>';
 if(state.mode==='slice'&&sliceServer){const pr=slicePresets();if(!pr.gpu){html+='<div style="color:var(--dim);font-size:10px;margin-top:4px">GPU / storage presets unavailable on this archetype.</div>';}}
 html+='<div style="margin-top:10px" class="btn" id="bCmp">COMPARE ARCHETYPES</div>';
 html+='<h2>Rack power</h2>'+rackPowerHTML();
 $('left').innerHTML=html;
 document.querySelectorAll('#left .srv').forEach(el=>el.onclick=()=>selectServer(+el.dataset.i));
 document.querySelectorAll('#left .pk').forEach(el=>el.onclick=()=>preset(el.dataset.p));
 const bc=$('bCmp');if(bc)bc.onclick=()=>{$('compare').style.display='flex';buildCompare();};}
function preset(p){
 if(state.mode==='rack'){const P={front:[[0,1.06,3.4],[0,1.05,0]],'3/4':[[2.4,1.7,2.6],[0,1.0,0]],side:[[3.3,1.05,0.15],[0,1.05,0]],rear:[[0,1.1,-3.4],[0,1.05,0]]};const v=P[p]||P['3/4'];tweenCam(v[0],v[1]);}
 else{const pr=slicePresets();const v=pr[p]||pr.whole;tweenCam(v[0],v[1]);}}
function updRight(){
 const s=state.mode==='slice'?servers[state.slice]:(state.sel>=0?servers[state.sel]:null);
 let html='';
 if(s){
  html+=`<h2>Selected server</h2><div class="row"><span class="k">Name</span><span>${s.name}</span></div>
  <div class="row"><span class="k">Rack position</span><span class="mono">${s.label}</span></div>
  <div class="row"><span class="k">Form factor</span><span>${s.nU}U</span></div>
  <div class="row"><span class="k">Purpose</span><span style="text-align:right;max-width:170px">${s.purpose}</span></div>
  ${state.mode==='rack'?'<div style="margin-top:6px"><div class="btn acc" id="bInspect">INSPECT SLICE</div></div>':''}`;
  html+=`<h2>Architecture summary</h2>`;
  if(s.specs)for(const[k,v]of Object.entries(s.specs))html+=`<div class="row"><span class="k">${k}</span><span class="mono" style="text-align:right">${v}</span></div>`;
  html+=`<div style="color:var(--dim);font-size:11px;margin-top:8px">${s.why||''}</div>`;
 }
 if(state.mode==='slice'){
  html+=`<div id="sliceNav"><div class="btns"><div class="btn" id="bPrev">◂ PREV</div><div class="btn" id="bNext">NEXT ▸</div></div>
  <div style="margin-top:4px;font-size:11px;color:var(--dim)">SERVER ${String(state.slice+1).padStart(2,'0')} / ${String(servers.length).padStart(2,'0')} — ${s.name}, ${s.nU}U, ${s.label}</div></div>`;}
 html+='<h2>Component</h2><div id="compBox" style="font-size:11px;color:var(--dim)">'+(state.mode==='slice'?'Click any component in the chassis.':'Select a server, then inspect its slice.')+'</div>';
 html+='<h2>Health monitor'+(s?' — '+s.name:'')+'</h2><div id="healthBox"></div>';
 $('right').innerHTML=html;updHealth();
 const bi=$('bInspect');if(bi)bi.onclick=inspectServer;
 if($('bPrev'))$('bPrev').onclick=()=>switchSlice(-1);
 if($('bNext'))$('bNext').onclick=()=>switchSlice(1);}
function switchSlice(dir){
 const i=(state.slice+dir+servers.length)%servers.length;
 state.cover=false;applyCoverSafe(i);
 showSlice(i);updUI();
 const pr=slicePresets().whole;tweenCam(pr[0],pr[1],0.9);
 setTimeout(()=>{state.cover=true;setBtn(bCover,true);applyCover();},900);}
function applyCoverSafe(i){const c=getSlice(servers[i]);tween(c.lid.position,[0,0,0],0.4);}
function showComp(c){const box=$('compBox');if(!box)return;
 box.innerHTML=c?`<b style="color:var(--txt)">${c.name}</b><div style="margin-top:4px">${c.info}</div>`:(state.mode==='slice'?'Click any component in the chassis.':'');}
function updHealth(){const box=$('healthBox');if(!box)return;
 const i=state.mode==='slice'?state.slice:state.sel;const s=i>=0?servers[i]:null;
 if(!s){box.innerHTML='<div style="color:var(--dim);font-size:11px">No server selected.</div>';return;}
 let html='';
 s.health.metrics.forEach(m=>{
  const bad=(m.label.includes('temp')&&m.v>90)||(m.label.includes('GPU')&&m.v>95)||(m.label==='Fan speed'&&state.fail==='FAN FAILURE'&&m.v>15000);
  const cls=bad?'badv':(m.v>0.85*m.hi?'warnc':'');
  html+=`<div class="row"><span class="k">${m.label}</span><span class="mono ${cls}">${fmt(m)}</span></div>`;});
 s.health.warn.forEach(w=>{html+=`<div class="warn">⚠ ${w}</div>`;});
 if(!s.health.warn.length&&state.fail)html+=`<div class="warn" style="color:var(--ok)">✓ Redundancy absorbed the failure — service continues.</div>`;
 box.innerHTML=html;}
function fmt(m){const v=Math.round(m.v*10)/10;return m.unit==='RPM'?Math.round(m.v)+' RPM':(m.unit==='GB'?Math.round(m.v)+' / '+m.hi+' GB':(m.unit===''?Math.round(m.v):v+' '+m.unit));}
/* toolbar wiring */
bRack.onclick=()=>{if(state.mode==='slice'&&!state.busy)returnToRack();};
bSlice.onclick=()=>{if(state.mode==='rack'&&state.sel>=0&&!state.busy)inspectServer();};
bCover.onclick=()=>{if(state.mode!=='slice')return;state.cover=!state.cover;setBtn(bCover,state.cover);applyCover();};
bCut.onclick=()=>{if(state.mode!=='slice')return;state.cut=!state.cut;setBtn(bCut,state.cut);applyCut();};
bExp.onclick=()=>{if(state.mode!=='slice')return;state.explode=!state.explode;setBtn(bExp,state.explode);applyExplode();};
bAir.onclick=()=>{if(state.mode!=='slice')return;state.air=!state.air;setBtn(bAir,state.air);ensureAir();airPts.visible=state.air;if(state.air){airState.length=0;for(let i=0;i<N_P;i++)airState.push({});for(let i=0;i<N_P;i++)resetP(i,true);}};
bPow.onclick=()=>{if(state.mode!=='slice')return;state.pow=!state.pow;setBtn(bPow,state.pow);applyPathGrps();};
bData.onclick=()=>{if(state.mode!=='slice')return;state.data=!state.data;setBtn(bData,state.data);applyPathGrps();};
bFail.onclick=()=>{const f=$('failmenu');f.style.display=f.style.display==='block'?'none':'block';};
bReset.onclick=()=>{
 state.fail=null;state.air=state.pow=state.data=state.explode=state.cut=state.cover=false;
 [bAir,bPow,bData,bExp,bCut,bCover].forEach(b=>setBtn(b,false));
 const c=curSlice();
 if(c){c.fans.forEach(f=>{f.failed=false;f.rpm=f.base;f.led.material=MS.ledG;});c.psus.forEach(u=>{u.offline=false;u.led.material=MS.ledG;u.g.traverse(o=>{if(o.isMesh&&o.material===MS.plastic&&o.parent===u.g)o.material=MS.steelL;});});c.drives.forEach(d=>{d.failed=false;d.led.material=MS.ledG;});}
 servers.forEach(s=>{s.health.warn=[];});
 if(state.mode==='slice'){state.cover=true;setBtn(bCover,true);applyCover();applyCut();applyExplode();}
 preset(state.mode==='rack'?'3/4':'whole');
 updUI();};
FAILS.forEach(f=>{const b=document.createElement('div');b.className='btn';b.textContent=f;b.onclick=()=>applyFailure(f);$('failmenu').appendChild(b);});
/* ============ main loop ============ */
const clock=new THREE.Clock();let fpsA=60,statT=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),0.05);
 updTweens(dt);
 if(camT){camT.t+=dt;const k=ease(Math.min(1,camT.t/camT.dur));
  cam.position.lerpVectors(camT.p0,camT.p1,k);controls.target.lerpVectors(camT.t0,camT.t1,k);
  if(camT.t>=camT.dur)camT=null;}
 controls.update();
 // hover
 ray.setFromCamera(ptr,cam);
 if(state.mode==='rack'){const hits=ray.intersectObjects(serverRoots,true);
  if(hits.length){const s=findServer(hits[0].object);hoverLine=clearLine(hoverLine);if(s&&servers.indexOf(s)!==state.sel){hoverLine=outlineOf(s.rackG,0x59b8d8);scene.add(hoverLine);document.body.style.cursor='pointer';}}
  else{hoverLine=clearLine(hoverLine);document.body.style.cursor='';}}
 else if(sliceModel){const hits=ray.intersectObject(sliceModel.group,true);
  if(hits.length){const o=findComp(hits[0].object);document.body.style.cursor=o?'pointer':'';}
  else document.body.style.cursor='';}
 // fans
 const c=state.mode==='slice'?curSlice():null;
 if(c)c.fans.forEach(f=>{if(!f.failed){f.rpm+=( (state.fail==='GPU OVERHEAT'?f.base*1.4:f.base)-f.rpm)*dt*2;f.sp.rotation.z+=f.rpm*0.0016*dt*60;}});
 // airflow + pulses
 if(state.air&&c)updAir(dt);
 if(state.pow||state.data)updPulses(dt);
 renderer.render(scene,cam);
 fpsA+=(1/Math.max(dt,1e-4)-fpsA)*0.05;statT+=dt;
 if(statT>0.4){statT=0;$('sFps').textContent=Math.round(fpsA);$('sCalls').textContent=renderer.info.render.calls;$('sTris').textContent=(renderer.info.render.triangles/1000).toFixed(0)+'k';}
 updHealthT-=dt;if(updHealthT<=0){updHealthT=0.9;updHealth();}}
let updHealthT=0.5;
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
addEventListener('keydown',e=>{if(e.key==='Escape')$('failmenu').style.display='none';});
updLeft();updRight();updUI();
function updUI(){updLeft();updRight();
 bRack.classList.toggle('acc',state.mode==='rack');bSlice.classList.toggle('acc',state.mode==='slice');
 [bCover,bCut,bExp].forEach(b=>b.disabled=state.mode!=='slice');
 [bAir,bPow,bData].forEach(b=>b.disabled=state.mode!=='slice');}
animate();
</script>
</body>
</html>
