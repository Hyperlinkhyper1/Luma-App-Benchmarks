<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garden Above the Clouds</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#BFD9EA;font-family:Georgia,'Times New Roman',serif}
#app{position:fixed;inset:0}
canvas{display:block}
#title{position:absolute;left:26px;top:20px;color:#fff;text-shadow:0 2px 16px rgba(15,35,55,.7),0 1px 2px rgba(0,0,0,.55);pointer-events:none}
#title h1{font-size:33px;font-weight:400;letter-spacing:.5px}
#title p{font-size:12.5px;opacity:.85;margin-top:7px;font-family:system-ui,-apple-system,sans-serif}
#bar{position:absolute;left:50%;bottom:16px;transform:translateX(-50%);display:flex;gap:7px;align-items:center;justify-content:center;flex-wrap:wrap;padding:8px 11px;border-radius:999px;background:rgba(16,30,46,.42);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.2);box-shadow:0 8px 30px rgba(0,0,0,.28);font-family:system-ui,-apple-system,sans-serif;max-width:97vw}
.pill{color:#eaf2f8;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.17);padding:7px 13px;border-radius:999px;font-size:12.5px;cursor:pointer;transition:.18s;white-space:nowrap;font-family:inherit}
.pill:hover{background:rgba(255,255,255,.22)}
.pill.on{background:rgba(255,255,255,.88);color:#12304a;font-weight:600}
select.pill{appearance:none;-webkit-appearance:none;padding-right:24px}
select.pill option{background:#16283a;color:#eaf2f8}
#more{position:absolute;right:16px;bottom:76px;width:236px;padding:14px 15px;border-radius:16px;background:rgba(14,26,40,.74);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.2);color:#dfeaf3;font-family:system-ui,-apple-system,sans-serif;font-size:12px;display:none;box-shadow:0 12px 36px rgba(0,0,0,.4)}
#more.show{display:block}
#more label{display:block;margin:9px 0 4px;opacity:.82}
#more input[type=range]{width:100%;accent-color:#8fd6c8}
#more .row{display:flex;gap:8px;align-items:center;margin-top:6px}
#stats{margin-top:11px;font-size:11px;opacity:.72;border-top:1px solid rgba(255,255,255,.16);padding-top:9px;letter-spacing:.3px}
#load{position:absolute;inset:0;background:linear-gradient(#9CC6EA,#E6EEF5);display:flex;align-items:center;justify-content:center;color:#33506b;font-size:15px;letter-spacing:3px;transition:opacity .9s;z-index:20}
</style>
</head>
<body>
<div id="app"></div>
<div id="load">loading the garden…</div>
<div id="title"><h1>Garden Above the Clouds</h1><p>Drag to look around, scroll to zoom, right-drag to move</p></div>
<div id="bar">
<select id="vsel" class="pill"><option value="overview">Overview</option><option value="torii">Torii</option><option value="bridge">Bridge</option><option value="pagoda">Pagoda</option><option value="waterfall">Waterfall</option></select>
<button class="pill season" data-s="0">Spring</button><button class="pill season on" data-s="1">Summer</button><button class="pill season" data-s="2">Autumn</button><button class="pill season" data-s="3">Winter</button>
<button class="pill tod" data-t=".25">Dawn</button><button class="pill tod on" data-t=".5">Day</button><button class="pill tod" data-t=".75">Sunset</button><button class="pill tod" data-t="0">Night</button>
<button class="pill" id="moreBtn">More</button>
</div>
<div id="more">
<label>Time of day</label><input type="range" id="tSlider" min="0" max="1000" value="500">
<div class="row"><input type="checkbox" id="pauseCb"><span>Pause day/night cycle</span></div>
<div class="row"><input type="checkbox" id="arCb" checked><span>Auto-rotate when idle</span></div>
<div id="stats">— voxels | — FPS</div>
</div>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ============ renderer / scene ============ */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.shadowMap.autoUpdate=false;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.06;
app.appendChild(renderer.domElement);
const scene=new THREE.Scene();
scene.fog=new THREE.Fog(0xBFD9EA,170,640);
const camera=new THREE.PerspectiveCamera(48,innerWidth/innerHeight,0.5,1900);
camera.position.set(0,-6,340);
const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0,14,0);controls.enableDamping=true;controls.dampingFactor=.07;
controls.minDistance=55;controls.maxDistance=430;controls.maxPolarAngle=1.62;controls.minPolarAngle=.1;
controls.autoRotateSpeed=.4;

const sun=new THREE.DirectionalLight(0xFFF7E6,1.7);sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-118;sc.right=118;sc.top=118;sc.bottom=-118;sc.near=20;sc.far=720;
sun.shadow.bias=-0.0009;sun.shadow.normalBias=.55;
scene.add(sun);scene.add(sun.target);
const hemi=new THREE.HemisphereLight(0xD5EBFA,0xE0D3B6,.8);scene.add(hemi);
const amb=new THREE.AmbientLight(0xffffff,.2);scene.add(amb);

/* sky */
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,depthTest:false,
 uniforms:{c1:{value:new THREE.Color()},c2:{value:new THREE.Color()},c3:{value:new THREE.Color()}},
 vertexShader:'varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
 fragmentShader:'varying vec3 vP;uniform vec3 c1,c2,c3;void main(){float h=normalize(vP).y;vec3 c=mix(c3,c2,smoothstep(-0.08,0.22,h));c=mix(c,c1,smoothstep(0.12,0.72,h));gl_FragColor=vec4(c,1.);}'});
const sky=new THREE.Mesh(new THREE.SphereGeometry(950,24,16),skyMat);sky.renderOrder=-2;scene.add(sky);
function raw(c){const t=new THREE.Color();t.setHex(c,THREE.LinearSRGBColorSpace);return t;}
const sunDisc=new THREE.Mesh(new THREE.SphereGeometry(24,16,12),new THREE.MeshBasicMaterial({color:0xFFF3D0,fog:false}));scene.add(sunDisc);
const moonDisc=new THREE.Mesh(new THREE.SphereGeometry(17,16,12),new THREE.MeshBasicMaterial({color:0xE8EEF8,fog:false}));scene.add(moonDisc);
/* stars */
const starG=new THREE.BufferGeometry(),starP=new Float32Array(700*3);
for(let i=0;i<700;i++){const a=Math.random()*6.283,b=Math.acos(Math.random()*0.9+0.05);const r=880;
 starP[i*3]=Math.sin(b)*Math.cos(a)*r;starP[i*3+1]=Math.abs(Math.cos(b))*r+20;starP[i*3+2]=Math.sin(b)*Math.sin(a)*r;}
starG.setAttribute('position',new THREE.BufferAttribute(starP,3));
const starM=new THREE.PointsMaterial({color:0xFFFFFF,size:3.2,transparent:true,opacity:0,fog:false,depthWrite:false});
scene.add(new THREE.Points(starG,starM));

/* ============ utils ============ */
function h3(a,b,c){const s=Math.sin(a*127.1+b*311.7+c*74.7)*43758.5453;return s-Math.floor(s);}
function nz(x,z,s){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
 const a=h3(xi,zi,s),b=h3(xi+1,zi,s),c=h3(xi,zi+1,s),d=h3(xi+1,zi+1,s),p=a+(b-a)*u,q=c+(d-c)*u;return p+(q-p)*v;}
function fbm(x,z,s){return nz(x,z,s)*.55+nz(x*2.3,z*2.3,s+13)*.3+nz(x*4.7,z*4.7,s+37)*.15;}
function shade(c,f){const r=Math.min(255,Math.max(0,((c>>16)&255)*f))|0,g=Math.min(255,Math.max(0,((c>>8)&255)*f))|0,b=Math.min(255,Math.max(0,(c&255)*f))|0;return(r<<16)|(g<<8)|b;}
const PAL={verm:0xC73E1D,verm2:0xA8321A,jade:0x2E8B7E,jade2:0x3FA796,gold:0xE8B86D,teak:0x4A2C1A,
 g1:0x2D6A4F,g2:0x40916C,g3:0x74C365,pink:0xFFB7C5,pink2:0xFF8FAB,pink3:0xFFE5EC,stone:0x9AA0A6,
 rock:0x7A6E62,water:0x7ED6DF,moss:0x606C38,cloud:0xF4F6FA,haze:0xBFD9EA,sky2:0xE6EEF5};
/* categories: 0 gen 1 broad 2 sakura 3 pine 4 trunk 5 water 6 grass 7 roof 8 wall 9 stone 10 flower 11 snow 12 glow 13 gold */
const K=(x,y,z)=>(x+512)*1048576+(y+512)*1024+(z+512);
const T=new Map();
function P(x,y,z,c,cat){x|=0;y|=0;z|=0;T.set(K(x,y,z),(c<<4)|(cat&15));}
const HAS=(x,y,z)=>T.has(K(x,y,z));
function fill(x0,x1,y0,y1,z0,z1,c,cat){for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)P(x,y,z,c,cat);}
function blob(cx,cy,cz,r,cat,cols,flat){
 flat=flat||1;const rf=Math.ceil(r*flat);
 for(let x=-r-1;x<=r+1;x++)for(let y=-rf-1;y<=rf+1;y++)for(let z=-r-1;z<=r+1;z++){
  const n=h3(cx+x,cy+y,cz+z),R=r-0.4+n*1.5,d=x*x+(y/flat)*(y/flat)+z*z;
  if(d<R*R)P(cx+x,cy+y,cz+z,cols[(n*cols.length)|0],cat);}
}

/* ============ terrain ============ */
const RX=80,RZ=66,PAGP={x:28,z:-12,r:26},TEMP={x:-22,z:-6,r:24},CRG={x:-52,z:6,r:17},POND={x:8,z:30,rx:17,rz:12};
function inIsl(x,z,rx,rz){rx=rx||RX;rz=rz||RZ;const d=(x*x)/(rx*rx)+(z*z)/(rz*rz);return d<0.84+0.34*fbm(x*0.05,z*0.05,7);}
function inPond(x,z){return((x-POND.x)*(x-POND.x))/(POND.rx*POND.rx)+((z-POND.z)*(z-POND.z))/(POND.rz*POND.rz)<1;}
function topAt(x,z){
 if(!inIsl(x,z))return null;
 let h=0;const dp=Math.hypot(x-PAGP.x,z-PAGP.z),dt=Math.hypot(x-TEMP.x,z-TEMP.z);
 if(dp<PAGP.r)h=14;else if(dt<TEMP.r)h=6;
 if(inPond(x,z))h=-4;
 const dc=Math.hypot(x-CRG.x,z-CRG.z);
 if(dc<CRG.r)h=Math.max(h,dc<5?26:Math.round(8+(CRG.r-dc)*1.3+fbm(x*.3,z*.3,5)*3));
 if(h>=0&&h<10&&fbm(x*.16,z*.16,3)>.77)h+=1;
 return h;
}
const TOP=new Map(),BOT=new Map(),ck=(x,z)=>x*1000+z;
for(let x=-RX;x<=RX;x++)for(let z=-RZ;z<=RZ;z++){
 const t=topAt(x,z);if(t===null)continue;
 const d=Math.sqrt((x*x)/(RX*RX)+(z*z)/(RZ*RZ));
 const b=Math.round(-4-50*Math.pow(Math.max(0,1-d*d),.9)-fbm(x*.09,z*.09,11)*7);
 TOP.set(ck(x,z),t);BOT.set(ck(x,z),b);
}
const DX=[1,-1,0,0],DZ=[0,0,1,-1];
for(const k of TOP.keys()){
 const t=TOP.get(k),b=BOT.get(k),fx=Math.floor(k/1000),x=fx,z=k-fx*1000;
 for(let y=b;y<=t;y++){
  let vis=(y===t)||(y===b);
  if(!vis)for(let i=0;i<4&&!vis;i++){
   const nk=ck(x+DX[i],z+DZ[i]),nt=TOP.get(nk);
   if(nt===undefined||y>nt)vis=true;else{const nb=BOT.get(nk);if(nb!==undefined&&y<nb)vis=true;}
  }
  if(!vis)continue;
  let c,cat;
  if(y===t){
   if(inPond(x,z)){c=shade(0x6E6357,.9+h3(x,z,6)*.2);cat=9;}
   else if(Math.hypot(x-CRG.x,z-CRG.z)<CRG.r){c=h3(x,z,4)<.45?PAL.moss:PAL.rock;cat=c===PAL.moss?6:9;}
   else{c=shade(PAL.g2,.82+h3(x,z,6)*.4);cat=6;}
  }else{
   const band=Math.abs(Math.floor(y*.85+fbm(x*.3,z*.3,13)*3))%4;
   c=[0x7A6E62,0x8C7F70,0x9AA0A6,0x6B5F55][band];
   if(t-y<5&&Math.hypot(x,z)>52&&h3(x,y,z)<.55){c=shade(PAL.moss,.85+h3(x,y,z)*.35);cat=6;}else cat=9;
   c=shade(c,.9+h3(x*2,y,z)*.22);
  }
  P(x,y,z,c,cat);
 }
}
/* pond + lily pads */
for(let x=POND.x-POND.rx;x<=POND.x+POND.rx;x++)for(let z=POND.z-POND.rz;z<=POND.z+POND.rz;z++){
 if(!inPond(x,z))continue;const t=topAt(x,z);if(t===null)continue;
 for(let y=t+1;y<=-2;y++)if(!HAS(x,y,z))P(x,y,z,shade(PAL.water,.95+h3(x,y,z)*.15),5);
}
for(let i=0;i<14;i++){const a=Math.random()*6.283,r=Math.sqrt(Math.random());
 const x=Math.round(POND.x+Math.cos(a)*r*POND.rx*.8),z=Math.round(POND.z+Math.sin(a)*r*POND.rz*.8);
 if(inPond(x,z)&&HAS(x,-1,z))P(x,-1,z,PAL.g2,6);}
for(let i=0;i<26;i++){const a=Math.random()*6.283;
 const x=Math.round(POND.x+Math.cos(a)*POND.rx*.92),z=Math.round(POND.z+Math.sin(a)*POND.rz*.92);
 if(!inIsl(x,z))continue;const t=topAt(x,z);if(t===null)continue;
 const L=2+(Math.random()*4|0);for(let j=0;j<=L;j++)P(x,t+j,z,shade(PAL.g1,.9+Math.random()*.3),6);}

/* paths */
const PATH=[[6,58],[6,50],[8,44],[8,16],[2,12],[-10,4],[-18,-2],[-26,-6],[-16,-8],[-6,-9],[4,-9],[14,-11],[26,-12]];
function nearPath(x,z){for(let i=0;i<PATH.length-1;i++){const a=PATH[i],b=PATH[i+1],dx=b[0]-a[0],dz=b[1]-a[1],L=dx*dx+dz*dz;
 let t=((x-a[0])*dx+(z-a[1])*dz)/L;t=Math.max(0,Math.min(1,t));
 if((x-a[0]-dx*t)*(x-a[0]-dx*t)+(z-a[1]-dz*t)*(z-a[1]-dz*t)<9)return true;}return false;}
for(let i=0;i<PATH.length-1;i++){const a=PATH[i],b=PATH[i+1],n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])*2)+1;
 for(let s=0;s<=n;s++){const x=Math.round(a[0]+(b[0]-a[0])*s/n),z=Math.round(a[1]+(b[1]-a[1])*s/n);
  if(!inIsl(x,z)||inPond(x,z))continue;const t=topAt(x,z);if(t===null||t<0)continue;
  if(HAS(x,t,z))T.set(K(x,t,z),(shade(0x9AA0A6,.88+h3(x,z,5)*.3)<<4)|9);}}
/* stream channels */
function channel(pts){for(let i=0;i<pts.length-1;i++){const a=pts[i],b=pts[i+1];
 const n=Math.ceil(Math.hypot(b[0]-a[0],b[1]-a[1])*2)+1;
 for(let s=0;s<=n;s++){const x=Math.round(a[0]+(b[0]-a[0])*s/n),z=Math.round(a[1]+(b[1]-a[1])*s/n);
  if(!inIsl(x,z))continue;const t=topAt(x,z);if(t===null)continue;
  if(HAS(x,t,z))T.set(K(x,t,z),(shade(PAL.water,.95+h3(x,y0:=0,z)*.1)<<4)|5);}}}
channel([[-45,7],[-36,13],[-34,18],[-24,24],[-12,28]]);
channel([[24,30],[40,26],[56,20],[70,14]]);
channel([[4,41],[-1,47],[-7,54],[-9,60]]);
/* crag cascade */
for(let s=0;s<=40;s++){const u=s/40,x=Math.round(-46+12*u),z=Math.round(7+11*u);
 const t=topAt(x,z);if(t===null)continue;if(HAS(x,t,z))T.set(K(x,t,z),(shade(PAL.water,.95+h3(x,s,z)*.12)<<4)|5);}
/* zen garden */
for(let x=-58;x<=-33;x++)for(let z=-47;z<=-29;z++){if(!inIsl(x,z))continue;const t=topAt(x,z);if(t===null||t<0)continue;
 const rk=((z%2)+2)%2;c0=shade(rk?0xD8D2C6:0xC7C0B2,.92+h3(x,z,9)*.16);T.set(K(x,t,z),(c0<<4)|9);}
let c0;
[[-50,-42,3],[-40,-36,2],[-54,-33,2]].forEach(r=>blob(r[0],topAt(r[0],r[1])+r[2]-1,r[1],r[2],9,[0x8C7F70,0x9AA0A6],0.8));

/* ============ structures ============ */
function roof(cx,cz,y0,hw,wallHw,trim){
 const step=Math.max(1.3,hw*.17);
 for(let L=0;L<5;L++){const h=hw-L*step,hn=L<4?hw-(L+1)*step:-1,y=y0+L,R=Math.ceil(hw)+1;
  for(let x=-R;x<=R;x++)for(let z=-R;z<=R;z++){const d=Math.sqrt(x*x+z*z);
   if(d>h+.5)continue;if(L<4&&d<=hn+.5)continue;
   P(cx+x,y,cz+z,L%2?PAL.jade2:PAL.jade,7);}}
 const R=Math.ceil(hw);
 for(let x=-R;x<=R;x++)for(let z=-R;z<=R;z++){const d=Math.sqrt(x*x+z*z);
  if(d<=hw+.5&&d>hw-1.6)P(cx+x,y0-1,cz+z,PAL.jade,7);}
 const c=Math.round(hw*.7);
 for(const sx of[-1,1])for(const sz of[-1,1]){P(cx+sx*c,y0+1,cz+sz*c,PAL.jade2,7);P(cx+sx*c,y0+2,cz+sz*c,PAL.jade2,7);P(cx+sx*(c+1),y0+3,cz+sz*(c+1),PAL.jade,7);}
 for(let u=-wallHw+2;u<=wallHw-2;u+=4){
  for(let d=1;d<=3;d++){P(cx+u,y0-1,cz-wallHw-d,PAL.gold,13);P(cx+u,y0-1,cz+wallHw+d,PAL.gold,13);
   P(cx-wallHw-d,y0-1,cz+u,PAL.gold,13);P(cx+wallHw+d,y0-1,cz+u,PAL.gold,13);}}
 if(trim){const h=hw-4*step;
  for(let x=-Math.ceil(h);x<=Math.ceil(h);x++)for(let z=-Math.ceil(h);z<=Math.ceil(h);z++){const d=Math.sqrt(x*x+z*z);
   if(d<=h+.5&&d>h-1.6)P(cx+x,y0+4,cz+z,PAL.gold,13);}}
}
const DOORS=[];
function addDoor(fx,fz,fl,y0,hw){
 const isZ=fz!==0;
 for(let u=-3;u<=3;u++)for(let dy=1;dy<=6;dy++){
  const y=y0+dy;let fcx,fcz,b1x,b1z,b2x,b2z;
  if(isZ){fcx=PAGP.x+u;fcz=PAGP.z+fz*Math.round(hw);b1x=fcx;b1z=PAGP.z+fz*Math.round(hw-1);b2x=fcx;b2z=PAGP.z+fz*Math.round(hw-2);}
  else{fcx=PAGP.x+fx*Math.round(hw);fcz=PAGP.z+u;b1x=PAGP.x+fx*Math.round(hw-1);b1z=fcz;b2x=PAGP.x+fx*Math.round(hw-2);b2z=fcz;}
  T.delete(K(fcx,y,fcz));T.delete(K(b1x,y,b1z));T.delete(K(b2x,y,b2z));
  P(b1x,y,b1z,0xFFC98A,12);
  if(u===0)continue;
  const leaf=u<0?0:1;let hx,hz;
  if(isZ){hx=PAGP.x+(leaf?3.5:-3.5);hz=fcz;}else{hz=PAGP.z+(leaf?3.5:-3.5);hx=fcx;}
  let s;
  if(isZ){const dx=fcx-hx;s=(-Math.sign(dx)*Math.sign(fz))||1;}else{const dz=fcz-hz;s=(Math.sign(dz)*Math.sign(fx))||1;}
  DOORS.push({f:fl,x:fcx,y:y,z:fcz,hx,hz,s});
 }
}
const FLOORS=[];
const HW=[12,10.5,9,7.5,6],SH=9,PX=PAGP.x,PZ=PAGP.z;
function buildPagoda(){
 let y=15;fill(PX-15,PX+15,y-2,y,PZ-15,PZ+15,PAL.stone,9);
 fill(PX-16,PX+16,y-1,y-1,PZ-16,PZ+16,shade(PAL.stone,1.06),9);
 y=16;
 for(let i=0;i<5;i++){
  const hw=HW[i],y0=y,y1=y+SH-1;
  fill(PX-hw,PX+hw,y0,y1,PZ-hw,PZ+hw,PAL.verm,8);
  for(let x=-hw;x<=hw;x++)for(let z=-hw;z<=hw;z++){

   p[i*3]+=Math.sin(tAcc*1.3+fall1.v[i*2+1])*dt*2.4;
   p[i*3+2]+=Math.cos(tAcc*1.1+fall1.v[i*2+1])*dt*2;
   if(p[i*3+1]<-4){p[i*3+1]=48+Math.random()*12;p[i*3]=(Math.random()-.5)*150;p[i*3+2]=(Math.random()-.5)*130;}}
  fall1.g.attributes.position.needsUpdate=true;}
 {const p=mist.p;
  for(let i=0;i<mist.n;i++){const b=MP[i%3];
   p[i*3+1]+=dt*(2.2+mist.v[i*2]);
   p[i*3]+=Math.sin(tAcc+mist.v[i*2+1])*dt*1.5;
   if(p[i*3+1]>b[1]+18){const o=MP[i%3];p[i*3]=o[0]+(Math.random()-.5)*16;p[i*3+1]=o[1];p[i*3+2]=o[2]+(Math.random()-.5)*16;}}
  mist.g.attributes.position.needsUpdate=true;}
 /* camera */
 if(fly){fly.t+=dt;const u=ease(Math.min(1,fly.t/fly.d));
  camera.position.lerpVectors(fly.p0,fly.p1,u);controls.target.lerpVectors(fly.t0,fly.t1,u);
  if(fly.t>=fly.d){fly=null;controls.enabled=true;lastAct=performance.now();}}
 controls.autoRotate=arOn&&!fly&&performance.now()-lastAct>6000;
 controls.update();
 if(camera.position.y<-16)camera.position.y=-16;
 if(frame%4===0)renderer.shadowMap.needsUpdate=true;
 renderer.render(scene,camera);
 fAcc+=dt;fCnt++;
 if(fAcc>.6){fps=Math.round(fCnt/fAcc);fAcc=0;fCnt=0;
  voxCount=nS+WX.length+LX.length+DOORS.length;
  document.getElementById('stats').textContent=voxCount.toLocaleString()+' voxels | '+fps+' FPS';
  window.__VOXEL__.voxelCount=voxCount;window.__VOXEL__.fps=fps;
  window.__VOXEL__.timeOfDay=phaseName(tod);window.__VOXEL__.season=SNAME[season];
 }
}
window.__VOXEL__={voxelCount:0,fps:0,pagodaFloors:5,timeOfDay:'Day',season:'Summer'};
renderer.shadowMap.needsUpdate=true;
renderer.render(scene,camera);
const ld=document.getElementById('load');ld.style.opacity='0';setTimeout(()=>ld.remove(),1000);
loop();
</script>
