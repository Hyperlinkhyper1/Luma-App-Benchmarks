<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AUREON GT — Studio Reveal & Test Drive</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#0b0d12;color:#e8ecf2;font-family:Segoe UI,system-ui,sans-serif}
#app{position:fixed;inset:0}
canvas{display:block}
.panel{position:absolute;background:rgba(12,14,20,.78);backdrop-filter:blur(8px);border:1px solid rgba(255,255,255,.12);border-radius:12px;padding:10px 12px;box-shadow:0 8px 30px rgba(0,0,0,.45)}
.panel h2{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9fb0c8;margin-bottom:8px;font-weight:600}
#topBar{top:12px;left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 14px}
#brand{font-size:15px;font-weight:700;letter-spacing:.22em;color:#fff}
#brand small{display:block;font-size:9px;letter-spacing:.3em;color:#8fa0b8;font-weight:500}
.btnRow{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
button{cursor:pointer;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.06);color:#dfe6ef;font-size:11px;letter-spacing:.06em;padding:6px 10px;border-radius:8px;transition:all .15s}
button:hover{background:rgba(255,255,255,.16)}
button.active{background:#e33b3b;border-color:#ff6b6b;color:#fff}
#config{top:64px;left:12px;width:230px;bottom:12px;overflow:auto;font-size:11px}
#config label{display:block;margin:8px 0 3px;color:#aeb9c9;letter-spacing:.05em}
#config .row{display:flex;gap:6px;flex-wrap:wrap}
.swatch{width:26px;height:26px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.swatch.active{border-color:#fff;box-shadow:0 0 0 2px #000 inset}
#hud{right:12px;bottom:12px;width:280px;display:none}
#hud .big{font-size:34px;font-weight:700;line-height:1}
#hud .lbl{font-size:10px;letter-spacing:.2em;color:#8fa0b8}
#rpmWrap{height:10px;background:#222;border-radius:5px;overflow:hidden;margin:8px 0}
#rpmBar{height:100%;width:0%;background:linear-gradient(90deg,#3fd06a,#f7d13f 70%,#f23c3c 88%)}
.hudRow{display:flex;justify-content:space-between;font-size:12px;color:#cfd8e4;margin:3px 0}
#speed{color:#fff}
#msg{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(10,12,18,.9);border:1px solid rgba(255,255,255,.2);padding:22px 30px;border-radius:14px;text-align:center;z-index:50}
#msg h1{font-size:18px;margin-bottom:8px;letter-spacing:.1em}
#loading{position:absolute;inset:0;background:#0b0d12;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:100;transition:opacity .5s}
#loading .bar{width:220px;height:4px;background:#222;border-radius:2px;overflow:hidden}
#loading .bar i{display:block;height:100%;width:40%;background:#e33b3b;animation:load 1.1s infinite alternate}
@keyframes load{to{margin-left:60%}}
#tooltip{position:absolute;pointer-events:none;background:rgba(8,10,16,.92);border:1px solid rgba(255,255,255,.25);padding:4px 8px;border-radius:6px;font-size:11px;display:none;z-index:30;white-space:nowrap}
#hint{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);font-size:10px;color:#7f8ca0;letter-spacing:.1em;pointer-events:none}
@media (max-width:760px){#config{width:180px}#hud{width:220px}}
</style>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="app"></div>
<div id="loading"><div style="font-size:12px;letter-spacing:.4em;color:#8fa0b8">AUREON GT</div><div class="bar"><i></i></div><div style="font-size:11px;color:#666">Preparing studio…</div></div>
<div id="topBar" class="panel" style="display:none">
  <div id="brand">AUREON GT<small>STUDIO REVEAL · TEST DRIVE</small></div>
  <div class="btnRow">
    <button id="btnShow" class="active">SHOWROOM</button>
    <button id="btnDrive">TEST DRIVE</button>
    <button id="btnMute">SOUND ON</button>
  </div>
</div>
<div id="config" class="panel" style="display:none">
  <h2>Configurator</h2>
  <label>PAINT</label><div class="row" id="paintRow"></div>
  <label>RIM FINISH</label><div class="row" id="rimRow"></div>
  <label>CALIPERS</label><div class="row" id="calRow"></div>
  <label>OPTIONS</label>
  <div class="row"><button id="btnDoors">OPEN DOORS</button><button id="btnLights">LIGHTS ON</button></div>
  <div class="row"><button id="btnXray">X-RAY VIEW</button><button id="btnHide">HIDE UI</button></div>
</div>
<div id="hud" class="panel">
  <div class="lbl">SPEED</div><div class="big"><span id="speed">0</span> <span style="font-size:13px;color:#8fa0b8">km/h</span></div>
  <div id="rpmWrap"><div id="rpmBar"></div></div>
  <div class="hudRow"><span>GEAR</span><span id="gear" style="font-size:18px;color:#fff">N</span></div>
  <div class="hudRow"><span>LAP</span><span id="lap">—:—.——</span></div>
  <div class="hudRow"><span>BEST</span><span id="best">—</span></div>
  <canvas id="minimap" width="250" height="140" style="width:100%;border-radius:8px;background:#10141d;margin-top:6px"></canvas>
  <div class="hudRow"><span>CAM</span><span id="camLbl">CHASE</span></div>
</div>
<div id="hint"></div>
<div id="tooltip"></div>
<div id="msg" style="display:none"></div>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';

const app=document.getElementById('app');
const loading=document.getElementById('loading');
const msg=document.getElementById('msg');
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;

function webGLOk(){try{const c=document.createElement('canvas');return !!(c.getContext('webgl2')||c.getContext('webgl'));}catch(e){return false;}}
if(!webGLOk()){loading.style.display='none';msg.style.display='block';msg.innerHTML='<h1>WebGL unavailable</h1><div>This experience needs a browser with WebGL enabled.</div>';throw new Error('no gl');}

let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}catch(e){loading.style.display='none';msg.style.display='block';msg.innerHTML='<h1>WebGL unavailable</h1><div>This experience needs a browser with WebGL enabled.</div>';throw new Error('no gl');}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.1;
renderer.outputColorSpace=THREE.SRGBColorSpace;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x0b0d12);
const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(renderer),0.04).texture;

const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,2000);
camera.position.set(5.5,2.4,6.5);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.07;
controls.maxPolarAngle=Math.PI*0.52;controls.minDistance=2.2;controls.maxDistance=18;
controls.target.set(0,0.6,0);

/* ---------- lights & studio ---------- */
const hemi=new THREE.HemisphereLight(0xbdd0ff,0x11131a,0.55);scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,2.4);key.position.set(6,9,4);key.castShadow=true;
key.shadow.mapSize.set(2048,2048);key.shadow.camera.left=-6;key.shadow.camera.right=6;key.shadow.camera.top=6;key.shadow.camera.bottom=-6;key.shadow.bias=-0.0004;scene.add(key);
const rim=new THREE.DirectionalLight(0x88aaff,1.1);rim.position.set(-7,5,-6);scene.add(rim);
const softboxMats=[];
const boxGeo=new THREE.BoxGeometry(3.4,0.08,1.1);
for(let i=0;i<3;i++){const m=new THREE.Mesh(boxGeo,new THREE.MeshBasicMaterial({color:0xffffff}));m.position.set(-4+i*4,5.2,-2.4);m.rotation.x=0.9;scene.add(m);softboxMats.push(m.material);}
const studio=new THREE.Group();scene.add(studio);
const floor=new THREE.Mesh(new THREE.CircleGeometry(16,64),new THREE.MeshStandardMaterial({color:0x14161c,roughness:0.18,metalness:0.65,envMapIntensity:1.4}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;studio.add(floor);
const ring=new THREE.Mesh(new THREE.RingGeometry(4.6,4.75,80),new THREE.MeshBasicMaterial({color:0xe33b3b,transparent:true,opacity:0.75,side:THREE.DoubleSide}));
ring.rotation.x=-Math.PI/2;ring.position.y=0.01;studio.add(ring);

/* ---------- textures ---------- */
function canvasTex(size,fn){const c=document.createElement('canvas');c.width=c.height=size;fn(c.getContext('2d'),size);const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;return t;}
const carbonTex=canvasTex(256,(g,s)=>{g.fillStyle='#15161a';g.fillRect(0,0,s,s);for(let y=0;y<s;y+=16)for(let x=0;x<s;x+=16){const odd=((x+y)/16)%2;g.fillStyle=odd?'#22242a':'#101115';g.fillRect(x+1,y+1,14,14);g.fillStyle='rgba(255,255,255,.07)';g.fillRect(x+3,y+3,3,10);}});
carbonTex.wrapS=carbonTex.wrapT=THREE.RepeatWrapping;carbonTex.repeat.set(6,6);
const discTex=canvasTex(256,(g,s)=>{g.fillStyle='#888';g.fillRect(0,0,s,s);g.translate(s/2,s/2);for(let a=0;a<24;a++){g.rotate(Math.PI/12);g.fillStyle='#222';g.fillRect(-3,-s/2+10,6,26);}});
const clusterTex=canvasTex(512,(g,s)=>{g.fillStyle='#05070c';g.fillRect(0,0,s,s);g.strokeStyle='#3fd0ff';g.lineWidth=6;g.beginPath();g.arc(s*0.3,s*0.55,s*0.24,Math.PI*0.8,Math.PI*2.2);g.stroke();g.strokeStyle='#ff5a3c';g.beginPath();g.arc(s*0.72,s*0.55,s*0.24,Math.PI*0.8,Math.PI*2.2);g.stroke();g.fillStyle='#dff3ff';g.font='bold 40px monospace';g.textAlign='center';g.fillText('0',s*0.3,s*0.62);g.fillStyle='#8fa0b8';g.font='16px monospace';g.fillText('km/h',s*0.3,s*0.7);});
clusterTex.wrapS=clusterTex.wrapT=THREE.ClampToEdgeWrapping;
const glowTex=canvasTex(64,(g,s)=>{const r=g.createRadialGradient(s/2,s/2,2,s/2,s/2,s/2);r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=r;g.fillRect(0,0,s,s);});

/* ---------- materials ---------- */
const MAT={};
function setPaint(color,matte){MAT.paint=new THREE.MeshPhysicalMaterial({color,metalness:matte?0.05:0.75,roughness:matte?0.62:0.22,clearcoat:matte?0:1.0,clearcoatRoughness:0.18,envMapIntensity:matte?0.6:1.5});applyPaint();}
function applyPaint(){if(MAT.paint){car.traverse(o=>{if(o.userData.paint)o.material=MAT.paint;});}}
const glassMat=new THREE.MeshPhysicalMaterial({color:0x2a3642,metalness:0,roughness:0.05,transparent:true,opacity:0.42,envMapIntensity:1.8,side:THREE.DoubleSide});
const rubberMat=new THREE.MeshStandardMaterial({color:0x181a1d,roughness:0.9,metalness:0});
const chrome=new THREE.MeshStandardMaterial({color:0xd8dde2,roughness:0.15,metalness:1});
const brushed=new THREE.MeshStandardMaterial({color:0x9aa1a8,roughness:0.42,metalness:0.95});
const carbonMat=new THREE.MeshStandardMaterial({map:carbonTex,color:0x666a70,roughness:0.5,metalness:0.35});
const plasticDark=new THREE.MeshStandardMaterial({color:0x14161a,roughness:0.85});
const seatMat=new THREE.MeshStandardMaterial({color:0x23262c,roughness:0.7,metalness:0.05});

/* ---------- car build ---------- */
const car=new THREE.Group();scene.add(car);
const chassis=new THREE.Group();chassis.visible=false;car.add(chassis);
const paintMeshes=[];

function loft(stations,opts={}){
  const N=opts.seg||28, S=stations.length;
  const pos=[],idx=[];
  for(let i=0;i<S;i++){const st=stations[i];
    for(let j=0;j<N;j++){const t=j/N*Math.PI*2;
      const ct=Math.cos(t),stn=Math.sin(t);
      const x=st.w*Math.sign(ct)*Math.pow(Math.abs(ct),0.72);
      const y=st.b+(st.t-st.b)*Math.pow(0.5+0.5*stn,0.85);
      pos.push(x,y,st.z);
    }}
  for(let i=0;i<S-1;i++)for(let j=0;j<N;j++){
    const a=i*N+j,b=i*N+(j+1)%N,c=(i+1)*N+j,d=(i+1)*N+(j+1)%N;
    idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);g.computeVertexNormals();
  return g;
}
const bodyGeo=loft([
  {z:-2.28,w:0.42,b:0.30,t:0.56},{z:-2.05,w:0.72,b:0.26,t:0.66},{z:-1.45,w:0.92,b:0.24,t:0.78},
  {z:-0.75,w:0.99,b:0.22,t:0.86},{z:-0.05,w:1.0,b:0.22,t:0.92},{z:0.65,w:0.97,b:0.22,t:0.90},
  {z:1.25,w:0.94,b:0.24,t:0.86},{z:1.85,w:0.84,b:0.27,t:0.80},{z:2.28,w:0.66,b:0.32,t:0.72}
],{seg:32});
const bodyMesh=new THREE.Mesh(bodyGeo,new THREE.MeshPhysicalMaterial({color:0xc22535,metalness:0.7,roughness:0.25,clearcoat:1,clearcoatRoughness:0.15,envMapIntensity:1.4}));
bodyMesh.castShadow=true;bodyMesh.userData.paint=true;car.add(bodyMesh);

const canopyGeo=loft([
  {z:-1.05,w:0.34,b:0.74,t:0.86},{z:-0.55,w:0.62,b:0.72,t:1.14},{z:0.05,w:0.66,b:0.72,t:1.16},{z:0.62,w:0.58,b:0.72,t:1.06},{z:0.95,w:0.38,b:0.74,t:0.94}
],{seg:24});
const canopy=new THREE.Mesh(canopyGeo,glassMat);car.add(canopy);

// flat deck panel between canopy and tail
const deck=new THREE.Mesh(new THREE.BoxGeometry(1.45,0.05,0.9),MAT.paint||bodyMesh.material);deck.position.set(0,0.88,1.45);deck.rotation.x=0.0;car.add(deck);deck.userData.paint=true;

const frontSplitter=new THREE.Mesh(new THREE.BoxGeometry(1.5,0.06,0.42),carbonMat);frontSplitter.position.set(0,0.16,-2.18);car.add(frontSplitter);
// diffuser
const diffuser=new THREE.Group();diffuser.position.set(0,0.26,2.24);
for(let i=-2;i<=2;i++){const fin=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.22,0.42),carbonMat);fin.position.set(i*0.24,0,0);fin.rotation.x=-0.25;diffuser.add(fin);}
car.add(diffuser);
// exhaust tips
for(let i=0;i<2;i++){const tip=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.08,0.24,20),new THREE.MeshStandardMaterial({color:0x333333,metalness:0.9,roughness:0.3}));tip.rotation.x=Math.PI/2;tip.position.set(i?0.36:-0.36,0.42,2.3);car.add(tip);}

/* wheels */
const wheels=[];
function makeWheel(x,z,rear){
  const g=new THREE.Group();
  const tyre=new THREE.Mesh(new THREE.TorusGeometry(0.285,0.105,14,42),rubberMat);
  tyre.rotation.y=Math.PI/2;tyre.castShadow=true;g.add(tyre);
  const rimMat=new THREE.MeshStandardMaterial({color:0xd8dde2,metalness:1,roughness:0.2});
  const rim=new THREE.Mesh(new THREE.CylinderGeometry(0.215,0.215,0.17,28),rimMat);rim.rotation.z=Math.PI/2;g.add(rim);
  const spokeGeo=new THREE.BoxGeometry(0.05,0.17,0.185);
  for(let i=0;i<5;i++){const sp=new THREE.Mesh(spokeGeo,rimMat);sp.rotation.x=i/5*Math.PI*2;sp.position.set(0,0,0);sp.translateY?0:0;sp.position.set(0,0,0);const holder=new THREE.Group();holder.rotation.x=i/5*Math.PI*2;sp.position.set(0,0.13,0);holder.add(sp);holder.position.y=0;g.add(holder);}
  const cap=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,0.19,18),carbonMat);cap.rotation.z=Math.PI/2;g.add(cap);
  const disc=new THREE.Mesh(new THREE.CylinderGeometry(0.155,0.155,0.028,32),new THREE.MeshStandardMaterial({map:discTex,color:0xb9bec4,metalness:0.9,roughness:0.35}));disc.rotation.z=Math.PI/2;g.add(disc);
  const cal=new THREE.Mesh(new THREE.BoxGeometry(0.09,0.14,0.12),new THREE.MeshStandardMaterial({color:0xd12b2b,roughness:0.4,metalness:0.2}));cal.position.set(0,0.13,0.14);g.add(cal);
  g.position.set(x,0.395,z);g.userData={rimMat,calMat:cal.material,x,z,rear,steer:0,spin:0,baseY:0.395};
  car.add(g);wheels.push(g);return g;
}
makeWheel(-0.88,-1.42,false);makeWheel(0.88,-1.42,false);makeWheel(-0.88,1.42,true);makeWheel(0.88,1.42,true);

/* lights */
const headlights=[],taillightMat=new THREE.MeshStandardMaterial({color:0x550000,emissive:0xff1a1a,emissiveIntensity:0.35,roughness:0.3});
for(let s=-1;s<=1;s+=2){
  const housing=new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,0.16,20),plasticDark);housing.rotation.x=Math.PI/2;housing.position.set(s*0.6,0.62,-2.18);car.add(housing);
  const proj=new THREE.Mesh(new THREE.SphereGeometry(0.055,16,16),new THREE.MeshStandardMaterial({color:0xffffff,emissive:0xcfe8ff,emissiveIntensity:0.3,roughness:0.1,metalness:0.2}));proj.position.set(s*0.6,0.62,-2.27);car.add(proj);headlights.push(proj);
  const drl=new THREE.Mesh(new THREE.BoxGeometry(0.34,0.035,0.05),new THREE.MeshStandardMaterial({color:0x222,emissive:0xbfe6ff,emissiveIntensity:0.6}));drl.position.set(s*0.62,0.5,-2.26);car.add(drl);headlights.push(drl);
  const ind=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.05,0.04),new THREE.MeshStandardMaterial({color:0x331a00,emissive:0xffa42b,emissiveIntensity:0.5}));ind.position.set(s*0.78,0.5,-2.26);car.add(ind);
  const t=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.075,0.06),taillightMat);t.position.set(s*0.48,0.72,2.27);car.add(t);
  const ti=new THREE.Mesh(new THREE.BoxGeometry(0.1,0.05,0.04),new THREE.MeshStandardMaterial({color:0x2a1400,emissive:0xffa42b,emissiveIntensity:0.4}));ti.position.set(s*0.86,0.66,2.27);car.add(ti);
  const mir=new THREE.Group();const mBase=new THREE.Mesh(new THREE.BoxGeometry(0.05,0.05,0.1),plasticDark);const mHead=new THREE.Mesh(new THREE.SphereGeometry(0.075,14,12),new THREE.MeshStandardMaterial({color:0x1a1d22,roughness:0.25,metalness:0.6}));mHead.scale.set(1.25,0.75,0.9);mBase.position.set(0,0,0);mHead.position.set(s*0.12,0.06,0);mir.add(mBase,mHead);mir.position.set(s*1.02,0.9,-0.55);car.add(mir);
}
// taillight full-width strip
const tailStrip=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.06,0.05),taillightMat);tailStrip.position.set(0,0.74,2.28);car.add(tailStrip);

/* intakes / handles */
for(let s=-1;s<=1;s+=2){
  const intake=new THREE.Mesh(new THREE.BoxGeometry(0.08,0.22,0.55),plasticDark);intake.position.set(s*0.99,0.62,0.6);intake.rotation.y=s*0.08;car.add(intake);
  const handle=new THREE.Mesh(new THREE.BoxGeometry(0.16,0.035,0.04),chrome);handle.position.set(s*0.985,0.78,-0.1);car.add(handle);
}
// wing
const wing=new THREE.Group();
const wingPanel=new THREE.Mesh(new THREE.BoxGeometry(1.35,0.05,0.42),carbonMat);wingPanel.castShadow=true;wing.add(wingPanel);
for(let s=-1;s<=1;s+=2){const leg=new THREE.Mesh(new THREE.BoxGeometry(0.06,0.22,0.22),plasticDark);leg.position.set(s*0.42,-0.12,0.0);wing.add(leg);}
wing.position.set(0,1.02,1.95);car.add(wing);

/* doors */
const doors=[];
for(let s=-1;s<=1;s+=2){
  const hinge=new THREE.Group();hinge.position.set(s*0.92,0.86,-0.62);
  const door=new THREE.Mesh(new THREE.BoxGeometry(0.07,0.52,1.35),bodyMesh.material);
  door.userData.paint=true;door.position.set(s*0.02,-0.24,0.68);door.castShadow=true;hinge.add(door);car.add(hinge);
  doors.push({hinge,s,open:0});
}

/* interior */
const interior=new THREE.Group();car.add(interior);
const dash=new THREE.Mesh(new THREE.BoxGeometry(1.15,0.22,0.34),new THREE.MeshStandardMaterial({color:0x14161c,roughness:0.6}));dash.position.set(0,0.78,-0.42);interior.add(dash);
const cluster=new THREE.Mesh(new THREE.PlaneGeometry(0.52,0.26),new THREE.MeshBasicMaterial({map:clusterTex}));cluster.position.set(0,0.88,-0.28);cluster.rotation.x=-0.28;interior.add(cluster);

const trackPts=[];const TRACK_N=14;
for(let i=0;i<TRACK_N;i++){const a=i/TRACK_N*Math.PI*2;const r=38+Math.sin(a*3.1)*7+Math.cos(a*1.7)*4;trackPts.push(new THREE.Vector3(Math.cos(a)*r,0,Math.sin(a)*r));}
const trackCurve=new THREE.CatmullRomCurve3(trackPts,true,'catmullrom',0.6);
const TRACK_HALF=5.4;
const trackGroup=new THREE.Group();trackGroup.visible=false;scene.add(trackGroup);
(function buildTrack(){
  const seg=400, posT=[],idx=[];
  for(let i=0;i<=seg;i++){const u=i/seg;const p=trackCurve.getPointAt(u);const tan=trackCurve.getTangentAt(u);const n=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    posT.push(p.x+n.x*TRACK_HALF,0.02,p.z+n.z*TRACK_HALF,p.x-n.x*TRACK_HALF,0.02,p.z-n.z*TRACK_HALF);}
  for(let i=0;i<seg;i++){const a=i*2,b=i*2+1,c=i*2+2,d=i*2+3;idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(posT,3));g.setIndex(idx);g.computeVertexNormals();
  const road=new THREE.Mesh(g,new THREE.MeshStandardMaterial({color:0x2b2d31,roughness:0.92,side:THREE.DoubleSide}));road.receiveShadow=true;trackGroup.add(road);
  // kerbs
  for(let s=-1;s<=1;s+=2){for(let i=0;i<120;i++){const u=i/120;const p=trackCurve.getPointAt(u);const tan=trackCurve.getTangentAt(u);const n=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    const stripe=new THREE.Mesh(new THREE.BoxGeometry(1.4,0.05,4.6),new THREE.MeshStandardMaterial({color:i%2?0xe33b3b:0xf0f0f0,roughness:0.8}));
    stripe.position.set(p.x+n.x*(TRACK_HALF+0.8)*s,0.03,p.z+n.z*(TRACK_HALF+0.8)*s);stripe.rotation.y=Math.atan2(tan.x,tan.z);trackGroup.add(stripe);}}
  // runoff edges & barriers
  for(let s=-1;s<=1;s+=2){for(let i=0;i<90;i++){const u=i/90;const p=trackCurve.getPointAt(u);const tan=trackCurve.getTangentAt(u);const n=new THREE.Vector3(-tan.z,0,tan.x).normalize();
    const post=new THREE.Mesh(new THREE.CylinderGeometry(0.08,0.08,0.9,6),new THREE.MeshStandardMaterial({color:0xcfd4da,roughness:0.6}));
    post.position.set(p.x+n.x*(TRACK_HALF+2.6)*s,0.45,p.z+n.z*(TRACK_HALF+2.6)*s);trackGroup.add(post);}}
  // grass
  const grass=new THREE.Mesh(new THREE.CircleGeometry(160,48),new THREE.MeshStandardMaterial({color:0x1f5122,roughness:1}));grass.rotation.x=-Math.PI/2;grass.position.y=-0.05;grass.receiveShadow=true;trackGroup.add(grass);
  // start line
  const start=new THREE.Mesh(new THREE.PlaneGeometry(TRACK_HALF*2,1.1),new THREE.MeshStandardMaterial({color:0xf2f2f2}));const p0=trackCurve.getPointAt(0);const t0=trackCurve.getTangentAt(0);start.position.set(p0.x,0.04,p0.z);start.rotation.x=-Math.PI/2;start.rotation.z=Math.atan2(t0.x,t0.z)+Math.PI/2;trackGroup.add(start);
  // trees
  const trunkGeo=new THREE.CylinderGeometry(0.14,0.2,1.6,6);const leafGeo=new THREE.ConeGeometry(1.5,3.4,8);
  const trunkMat=new THREE.MeshStandardMaterial({color:0x4a3421,roughness:1});const leafMat=new THREE.MeshStandardMaterial({color:0x1c4d27,roughness:1});
  const trunks=new THREE.InstancedMesh(trunkGeo,trunkMat,80);const leaves=new THREE.InstancedMesh(leafGeo,leafMat,80);
  const dummy=new THREE.Object3D();let ti=0;
  for(let i=0;i<80;i++){const a=Math.random()*Math.PI*2;const r=55+Math.random()*70;const x=Math.cos(a)*r,z=Math.sin(a)*r;
    dummy.position.set(x,0.8,z);dummy.scale.set(1,0.9+Math.random()*0.7,1);dummy.rotation.y=Math.random()*3;dummy.updateMatrix();trunks.setMatrixAt(ti,dummy.matrix);
    dummy.position.y=2.9;dummy.updateMatrix();leaves.setMatrixAt(ti,dummy.matrix);ti++;}
  trunks.castShadow=leaves.castShadow=true;trackGroup.add(trunks,leaves);
  // distant hills
  for(let i=0;i<10;i++){const a=i/10*Math.PI*2;const hill=new THREE.Mesh(new THREE.ConeGeometry(45+Math.random()*25,22+Math.random()*18,7),new THREE.MeshStandardMaterial({color:0x24402a,roughness:1}));hill.position.set(Math.cos(a)*150,8,Math.sin(a)*150);trackGroup.add(hill);}
})();

function drawMinimap(u,lat){const w=minimap.width,h=minimap.height;mmc.clearRect(0,0,w,h);mmc.fillStyle='#10141d';mmc.fillRect(0,0,w,h);
  const pts=[];for(let i=0;i<=100;i++){const p=trackCurve.getPointAt(i/100);pts.push(p);}
  let mnx=1e9,mny=1e9,mxx=-1e9,mxy=-1e9;pts.forEach(p=>{mnx=Math.min(mnx,p.x);mxx=Math.max(mxx,p.x);mny=Math.min(mny,p.z);mxy=Math.max(mxy,p.z);});
  const sc=Math.min((w-20)/(mxx-mnx),(h-20)/(mxy-mny));const ox=(w-(mxx-mnx)*sc)/2-mnx*sc,oz=(h-(mxy-mny)*sc)/2-mny*sc;
  mmc.strokeStyle='#e33b3b';mmc.lineWidth=5;mmc.lineCap='round';mmc.beginPath();pts.forEach((p,i)=>{const x=p.x*sc+ox,y=p.z*sc+oz;i?mmc.lineTo(x,y):mmc.moveTo(x,y);});mmc.stroke();
  mmc.strokeStyle='#3a4150';mmc.lineWidth=2;mmc.beginPath();pts.forEach((p,i)=>{const x=p.x*sc+ox,y=p.z*sc+oz;i?mmc.lineTo(x,y):mmc.moveTo(x,y);});mmc.stroke();
  const p=trackCurve.getPointAt(u);const tan=trackCurve.getTangentAt(u);const n=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  const cx=(p.x+n.x*lat)*sc+ox,cy=(p.z+n.z*lat)*sc+oz;mmc.fillStyle='#ffd23f';mmc.beginPath();mmc.arc(cx,cy,4,0,7);mmc.fill();}

  tooltip.style.display='none';});
renderer.domElement.addEventListener('pointerdown',()=>{initAudio();if(actx&&actx.state==='suspended')actx.resume();});

/* camera presets in topBar? use config panel shortcut */
const presets=Object.keys(camPresets);presets.forEach((p,i)=>{const b=document.createElement('button');b.textContent=p;b.onclick=()=>{if(mode!=='show')return;const pr=camPresets[p];camera.position.set(...pr.pos);controls.target.set(...pr.tgt);controls.update();};document.getElementById('config').appendChild(b);});

/* ---------- animation ---------- */
const clock=new THREE.Clock();
let doorT=0;
function updateDoors(dt){doorT=lerp(doorT,doorsOpen?1:0,1-Math.pow(0.001,dt));doors.forEach(d=>{d.hinge.rotation.z=d.s*-doorT*1.22;d.hinge.position.y=0.86+doorT*0.18;});}
function updateWing(dt){const target=(mode==='drive'&&G.speed*3.6>120)?0.34:0;wing.position.y=lerp(wing.position.y,1.02+target,1-Math.pow(0.0005,dt));}
function updateSmoke(dt){for(const p of smokePool){if(p.life>0){p.life-=dt;p.s.position.y+=dt*1.1;p.s.scale.setScalar(p.s.scale.x+dt*1.5);p.s.material.opacity=Math.max(0,p.life*0.55);if(p.life<=0)p.s.visible=false;}}}
function updateSkids(dt){for(const s of skids){s.material.opacity-=dt*0.008;if(s.material.opacity<=0.05){}}}
function kmh(u,lat){const p1=trackCurve.getPointAt((u+0.002)%1);const p0=trackCurve.getPointAt((u-0.002+1)%1);return 0;}

function driveUpdate(dt){
  const thr=(keys['KeyW']||keys['ArrowUp'])?1:0, brk=(keys['KeyS']||keys['ArrowDown'])?1:0;
  const stIn=((keys['KeyA']||keys['ArrowLeft'])?-1:0)+((keys['KeyD']||keys['ArrowRight'])?1:0);
  const hand=keys['Space']?1:0;
  // gearing
  if(G.auto){if(G.rpm>6500&&G.gear<6){G.gear++;G.cut=0.18;}else if(G.rpm<2400&&G.gear>1){G.gear--;G.cut=0.18;}}
  G.cut=Math.max(0,G.cut-dt);
  const ratio=GEAR_RATIOS[G.gear-1];
  const targetRpm=850+ (G.speed/MAX_SPEED)*7600*(ratio/2.9);
  const targetSpeed=thr*(MAX_SPEED/(ratio*0.62));
  const accel=thr*(9.5/(ratio*0.55))*(1-G.speed/(MAX_SPEED*1.05));
  G.speed+=(accel-brk*22-G.speed*0.012 - (hand?9:0))*dt;
  G.speed=clamp(G.speed,0,MAX_SPEED);
  G.rpm=lerp(G.rpm,clamp(850+(G.speed/MAX_SPEED)*7300*(ratio/1.6),850,8200),1-Math.pow(0.02,dt));
  if(G.cut>0)G.rpm*=0.75;
  // steering & grip
  const speedK=G.speed/3.6;
  const maxSteer=lerp(0.55,0.09,clamp(speedK/200,0,1));
  G.steer=lerp(G.steer,stIn*maxSteer,1-Math.pow(0.002,dt));
  const gripBase=hand?4.5:11.5;
  const latG=Math.abs(G.speed*0.012*Math.tan(G.steer)*(1+G.speed/95));
  const over=latG>gripBase;
  const grip=over?gripBase/(latG||1):1;
  G.slip=lerp(G.slip,stIn*G.steer*(1+latG*0.05)*grip,1-Math.pow(0.02,dt));
  const yawRate=(G.speed/2.6)*Math.tan(G.steer)*grip;
  G.yaw+=yawRate*dt;
  const tan=trackCurve.getTangentAt(G.u);const tYaw=Math.atan2(tan.x,tan.z);
  // advance
  const dU=(G.speed*dt)/(trackCurve.getLength());
  G.lastU=G.u;G.u=(G.u+dU)%1;
  // lateral drift from slip
  G.lat+=Math.sin(G.slip)*G.speed*dt*0.55;
  const maxLat=TRACK_HALF-1.1;
  if(Math.abs(G.lat)>maxLat){const over2=Math.abs(G.lat)-maxLat;G.lat=Math.sign(G.lat)*maxLat;G.speed=Math.max(0,G.speed-over2*14*dt*3);}
  const p=trackCurve.getPointAt(G.u);const n=new THREE.Vector3(-tan.z,0,tan.x).normalize();
  car.position.set(p.x+n.x*G.lat,0,p.z+n.z*G.lat);
  car.rotation.y=tYaw+G.slip;
  // lap timing
  if(G.lastU>0.9&&G.u<0.1&&G.lapT>5){const lap=G.lapT;if(!G.best||lap<G.best)G.best=lap;G.lapT=0;}
  if(mode==='drive')G.lapT+=dt;
  // wheel spin & steer
  const wSpin=G.speed/0.395*dt;
  wheels.forEach(w=>{w.userData.spin+=wSpin;w.rotation.x=w.userData.spin;if(!w.userData.rear){w.rotation.y=G.steer;}});
  // body roll & pitch
  const roll=clamp(G.slip*0.5,-0.14,0.14);
  const pitch=clamp((brk*3.4-thr*2.1)/9,-0.06,0.075);
  car.rotation.z=lerp(car.rotation.z,roll,1-Math.pow(0.005,dt));
  car.rotation.x=lerp(car.rotation.x,pitch,1-Math.pow(0.005,dt));
  // suspension wheel bob
  wheels.forEach((w,i)=>{w.position.y=0.395+Math.sin(clock.elapsedTime*7+i*1.7)*0.012;});
  // slip smoke
  if(over||hand&&G.speed>15){const rw=wheels[2],rw2=wheels[3];
    [rw,rw2].forEach(w=>{const wp=new THREE.Vector3();w.getWorldPosition(wp);wp.y=0.12;spawnSmoke(wp.x,wp.y,wp.z);
      if(Math.random()<0.35)spawnSkid(wp.x,wp.z,car.rotation.y);});}
  // taillight brake
  taillightMat.emissiveIntensity=brk?2.6:(lightsOn?0.7:0.25);
  // wing speed logic handled in updateWing
  updateAudio(G.rpm,thr,G.speed);
  // HUD
  document.getElementById('speed').textContent=Math.round(G.speed*3.6);
  document.getElementById('rpmBar').style.width=(G.rpm/8200*100)+'%';
  document.getElementById('gear').textContent=G.speed<1&&thr===0?'N':(G.gear);
  document.getElementById('lap').textContent=fmtTime(G.lapT);
  document.getElementById('best').textContent=G.best?fmtTime(G.best):'—';
  drawMinimap(G.u,G.lat);
  // camera
  const camT=camMode===0?'chase':camMode===1?'bonnet':camMode===2?'cockpit':'tv';
  let camPos,camTar;
  const fwd=new THREE.Vector3(Math.sin(car.rotation.y),0,Math.cos(car.rotation.y));
  const right=new THREE.Vector3(fwd.z,0,-fwd.x);
  const cp=car.position;
  if(camT==='chase'){camPos=cp.clone().addScaledVector(fwd,-7.4).add(new THREE.Vector3(0,2.9,0)).addScaledVector(right,0);camTar=cp.clone().addScaledVector(fwd,6).add(new THREE.Vector3(0,1.1,0));}
  else if(camT==='bonnet'){camPos=cp.clone().addScaledVector(fwd,1.15).add(new THREE.Vector3(0,1.05,0));camTar=cp.clone().addScaledVector(fwd,12).add(new THREE.Vector3(0,0.6,0));}
  else if(camT==='cockpit'){camPos=cp.clone().add(new THREE.Vector3(0,1.05,0)).addScaledVector(fwd,-0.15);camTar=cp.clone().addScaledVector(fwd,14).add(new THREE.Vector3(0,0.85,0));}
  else{camPos=cp.clone().addScaledVector(right,11).add(new THREE.Vector3(0,5.5,0));camTar=cp.clone().add(new THREE.Vector3(0,1,0));}
  camera.position.lerp(camPos,1-Math.pow(0.0001,dt));camera.lookAt(camTar);
}
function fmtTime(t){if(!t)return '—:—.——';const m=Math.floor(t/60),s=Math.floor(t%60),ms=Math.floor((t%1)*100);return m+':'+String(s).padStart(2,'0')+'.'+String(ms).padStart(2,'0');}

/* ---------- loop ---------- */
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),0.05);
  if(mode==='show'){
    revealT=Math.min(1,revealT+dt*0.55);
    const k=revealT*revealT*(3-2*revealT);
    key.intensity=2.4*k;rim.intensity=1.1*k;hemi.intensity=0.55*(0.35+0.65*k);
    softboxMats.forEach(m=>m.color.setScalar(0.15+0.85*k));
    if(turntable)car.rotation.y+=dt*0.22;
    controls.update();
    if(revealT<1&&revealT>0){camera.position.lerp(new THREE.Vector3(5.5,2.4,6.5),1-Math.pow(0.05,dt));}
  }else{
    driveUpdate(dt);
  }
  updateDoors(dt);updateWing(dt);updateSmoke(dt);
  // wheel rotation direction fix for correct look
  renderer.render(scene,camera);
}

/* ---------- resize / init ---------- */
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
function showAllUI(){['topBar','config'].forEach(id=>document.getElementById(id).style.display='block');}
buildSwatches; // keep reference
const title=document.getElementById('brand');
// paint initial
applyPaint();applyRim();applyLights();applyXray();
updateCamLabel();
elHint.textContent=hints.show;
showAllUI();
animate();
setTimeout(showLoadingDone,350);
</script>
