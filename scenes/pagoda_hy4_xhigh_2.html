<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOXEL GARDEN</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    user-select: none;
  }
  canvas { display: block; }
  #hud {
    position: absolute;
    top: 24px;
    left: 24px;
    color: #FFE5EC;
    pointer-events: none;
    text-shadow: 0 2px 6px rgba(0,0,0,0.6);
    z-index: 10;
  }
  .title {
    font-size: 20px;
    font-weight: 800;
    letter-spacing: 5px;
    color: #E8B86D;
    margin-bottom: 6px;
  }
  .stats {
    font-size: 13px;
    opacity: 0.95;
    margin-bottom: 4px;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
  }
  .hint {
    font-size: 12px;
    opacity: 0.65;
    margin-bottom: 18px;
    letter-spacing: 0.5px;
  }
  .controls {
    pointer-events: auto;
    display: flex;
    align-items: center;
    gap: 14px;
    background: rgba(10, 17, 40, 0.45);
    padding: 8px 14px;
    border-radius: 24px;
    border: 1px solid rgba(232, 184, 109, 0.35);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    width: max-content;
  }
  input[type=range] {
    width: 150px;
    accent-color: #E8B86D;
    cursor: pointer;
    opacity: 0.9;
  }
  button {
    background: transparent;
    border: 1px solid #E8B86D;
    color: #E8B86D;
    border-radius: 14px;
    padding: 5px 14px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 1px;
    transition: all 0.2s ease;
  }
  button:hover {
    background: #E8B86D;
    color: #0A1128;
  }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>

<div id="hud">
  <div class="title">VOXEL GARDEN</div>
  <div class="stats" id="stats">0.0k voxels | 60 FPS</div>
  <div class="hint">Click lanterns · Click pagoda floors</div>
  <div class="controls">
    <input type="range" id="timeSlider" min="0" max="1" step="0.001" value="0.35">
    <button id="pauseBtn">Pause</button>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --------------------------------------------------------
// 1. STATE & GLOBALS
// --------------------------------------------------------
let elapsed = 0;
let timeOfDay = 0.35;
let isPaused = false;
const CYCLE_LEN = 90;
let waterShader = null, leavesShader = null;
let totalVoxels = 0;
let introDone = false;
let idleTimer = 0;

const cTop = new THREE.Color();
const cBot = new THREE.Color();
const cSun = new THREE.Color();
const tmpColor = new THREE.Color();

window.__VOXEL__ = {
  voxelCount: 0,
  fps: 60,
  pagodaFloors: 5,
  timeOfDay: 0.35
};

// --------------------------------------------------------
// 2. RENDERER / SCENE / CAMERA / CONTROLS
// --------------------------------------------------------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2('#B1D8FF', 0.006);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 400);
const introStart = new THREE.Vector3(0, 4, 32);
const introEnd = new THREE.Vector3(28, 22, 28);
camera.position.copy(introStart);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.4;
controls.enabled = false;
controls.target.set(0, 12, 0);
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.minDistance = 15;
controls.maxDistance = 90;

controls.addEventListener('start', () => { controls.autoRotate = false; idleTimer = 0; });
controls.addEventListener('end', () => { idleTimer = elapsed; });

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

// --------------------------------------------------------
// 3. MATERIALS & SHADERS
// --------------------------------------------------------
const geometry = new THREE.BoxGeometry(1, 1, 1);

const materials = {
  solid: new THREE.MeshStandardMaterial({ roughness: 0.85, metalness: 0.05 }),
  emissive: new THREE.MeshStandardMaterial({ roughness: 0.4, emissive: '#FFD28A', emissiveIntensity: 0.8 }),
  metal: new THREE.MeshStandardMaterial({ roughness: 0.3, metalness: 0.85 }),
  water: new THREE.MeshStandardMaterial({ roughness: 0.1, metalness: 0.1, transparent: true, opacity: 0.85 }),
  leaves: new THREE.MeshStandardMaterial({ roughness: 0.9 })
};

materials.water.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = { value: 0 };
  waterShader = shader;
  shader.vertexShader = `uniform float uTime;\nvarying float vWave;\n` + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace(
    `#include <begin_vertex>`,
    `#include <begin_vertex>
     vec4 wp = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
     float wave = sin(wp.x * 2.0 + uTime * 3.0) * cos(wp.z * 2.0 + uTime * 2.0) * 0.3;
     transformed.y += wave;
     vWave = wave;`
  );
  shader.fragmentShader = `varying float vWave;\n` + shader.fragmentShader;
  shader.fragmentShader = shader.fragmentShader.replace(
    `#include <color_fragment>`,
    `#include <color_fragment>
     diffuseColor.rgb += vWave * 0.4;`
  );
};

materials.leaves.onBeforeCompile = (shader) => {
  shader.uniforms.uTime = { value: 0 };
  leavesShader = shader;
  shader.vertexShader = `uniform float uTime;\n` + shader.vertexShader;
  shader.vertexShader = shader.vertexShader.replace(
    `#include <begin_vertex>`,
    `#include <begin_vertex>
     vec4 wp = instanceMatrix * vec4(0.0, 0.0, 0.0, 1.0);
     float sway = sin(uTime * 1.5 + wp.x * 0.5 + wp.z * 0.5) * 0.18;
     transformed.x += sway * max(0.0, wp.y * 0.1);
     transformed.z += sway * 0.6 * max(0.0, wp.y * 0.1);`
  );
};

// --------------------------------------------------------
// 4. VOXEL ENGINE
// --------------------------------------------------------
const groups = { solid: [], water: [], leaves: [], emissive: [], metal: [] };

function addVoxel(matId, hex, x, y, z, sx=1, sy=1, sz=1, shade=1) {
  const m = new THREE.Matrix4().compose(
    new THREE.Vector3(x, y, z),
    new THREE.Quaternion(),
    new THREE.Vector3(sx, sy, sz)
  );
  tmpColor.set(hex).multiplyScalar(shade * (0.92 + Math.random() * 0.16));
  groups[matId].push({ m, c: tmpColor.clone() });
}

function buildStatic() {
  for (const matId in groups) {
    const data = groups[matId];
    if (!data.length) continue;
    const mesh = new THREE.InstancedMesh(geometry, materials[matId], data.length);
    data.forEach((d, i) => {
      mesh.setMatrixAt(i, d.m);
      mesh.setColorAt(i, d.c);
    });
    mesh.castShadow = (matId !== 'water');
    mesh.receiveShadow = true;
    scene.add(mesh);
    totalVoxels += data.length;
  }
}

// --------------------------------------------------------
// 5. WORLD GENERATION
// --------------------------------------------------------
function noise2D(x, z) {
  return Math.sin(x * 0.2) * Math.cos(z * 0.2) + Math.sin(x * 0.1 + z * 0.15) * 0.5;
}

// Main Flying Island
for (let x = -32; x < 32; x++) {
  for (let z = -32; z < 32; z++) {
    const d = Math.sqrt(x*x + z*z);
    const threshold = 26 + noise2D(x, z) * 4;
    const pondD = Math.sqrt((x+14)**2 + (z-6)**2);
    const isPond = pondD < 8 + noise2D(x+10, z) * 1.5;

    if (d < threshold) {
      let yTop = isPond ? 0 : Math.floor(noise2D(x*0.5, z*0.5) * 1.5);
      const depth = Math.floor((threshold - d) * 1.2 + 2 + noise2D(x, z) * 2);

      for (let y = yTop; y > yTop - depth; y--) {
        const shade = 0.45 + 0.55 * ((y - (yTop - depth)) / depth);
        if (y === yTop) {
          if (isPond) {
            addVoxel('solid', '#606C38', x, y-1, z, 1, 1, 1, 0.6);
          } else {
            let onPath = false;
            if (z > -2 && z < 28) {
              const px = Math.sin((z - 26) * 0.4) * 6;
              if (Math.abs(x - px) < 2.5) onPath = true;
            }
            if (x > -10 && x < -4 && z > 4 && z < 8) onPath = true;

            if (onPath) addVoxel('solid', '#9AA0A6', x, y, z, 1, 1, 1, shade * 1.1);
            else addVoxel('solid', '#606C38', x, y, z, 1, 1, 1, shade);
            if (!onPath && Math.random() < 0.05) addVoxel('solid', '#40916C', x, y+0.1, z, 0.8, 0.2, 0.8, shade);
          }
        } else if (y > yTop - 3) {
          addVoxel('solid', '#4A2C1A', x, y, z, 1, 1, 1, shade * 0.8);
        } else {
          addVoxel('solid', '#9AA0A6', x, y, z, 1, 1, 1, shade * 0.7);
        }
      }

      if (isPond) {
        addVoxel('water', '#7ED6DF', x, -0.2, z, 1, 0.4, 1, 1.0);
      } else if (pondD >= 8 + noise2D(x+10, z)*1.5 && pondD < 9.5 + noise2D(x+10, z)*1.5) {
        addVoxel('solid', '#9AA0A6', x, 0, z, 1, 1, 1, 1.0);
      }
    }
  }
}

// Waterfall connector
for (let x = -22; x >= -26; x--) {
  for (let z = 5; z <= 7; z++) addVoxel('water', '#7ED6DF', x, -0.2, z, 1, 0.4, 1);
}

// Smaller Floating Islands
[
  { cx: 35, cz: -15, cy: 4, r: 5 },
  { cx: -38, cz: 20, cy: -2, r: 6 },
  { cx: 20, cz: 38, cy: 8, r: 4 }
].forEach(isl => {
  for (let dx = -isl.r-1; dx <= isl.r+1; dx++) {
    for (let dz = -isl.r-1; dz <= isl.r+1; dz++) {
      const dd = Math.sqrt(dx*dx + dz*dz);
      if (dd < isl.r + noise2D(dx+isl.cx, dz+isl.cz) * 1.5) {
        const dep = Math.floor((isl.r - dd) * 1.5 + 2);
        for (let y = 0; y > -dep; y--) {
          const shade = 0.5 + 0.5 * ((y + dep) / dep);
          if (y === 0) addVoxel('solid', '#606C38', isl.cx+dx, isl.cy+y, isl.cz+dz, 1, 1, 1, shade);
          else addVoxel('solid', '#9AA0A6', isl.cx+dx, isl.cy+y, isl.cz+dz, 1, 1, 1, shade * 0.7);
        }
        if (isl.cy === 4 && dx === 0 && dz === 0) {
          addVoxel('solid', '#4A2C1A', isl.cx, isl.cy+1, isl.cz, 1, 2, 1);
          addVoxel('leaves', '#FFB7C5', isl.cx, isl.cy+3, isl.cz, 3, 2, 3);
        }
      }
    }
  }
});

// Pagoda Base
for (let x = -8; x <= 8; x++) for (let z = -8; z <= 8; z++) addVoxel('solid', '#9AA0A6', x, 1, z, 1, 1, 1, 0.9);

// Pagoda Floors & Roofs
const floorHitboxes = [];
const doorMeshes = [];
const doorStates = [];

for (let i = 0; i < 5; i++) {
  const R = 7 - i;
  const baseY = 2 + i * 5;
  const roofR = R + 3;

  // Core & Illuminated Interior
  for (let cx = -R+1; cx <= R-1; cx++) {
    for (let cz = -R+1; cz <= R-1; cz++) {
      addVoxel('solid', '#4A2C1A', cx, baseY, cz, 1, 1, 1, 0.6);
      if (Math.abs(cx) < 2 && Math.abs(cz) < 2) {
        addVoxel('emissive', '#FFE5B4', cx, baseY+1, cz, 1, 1, 1, 0.9);
      }
    }
  }

  // Walls
  for (let x = -R; x <= R; x++) {
    for (let z = -R; z <= R; z++) {
      if (Math.abs(x) === R || Math.abs(z) === R) {
        if (z === R && Math.abs(x) <= 1) continue; // Door gap
        if (Math.abs(x) === R && Math.abs(z) === R) continue; // Pillars
        addVoxel('solid', '#4A2C1A', x, baseY+1, z, 1, 2, 0.5, 0.8);
      }
    }
  }

  // Vermillion Pillars
  [[-R,-R],[R,-R],[-R,R],[R,R],[0,-R],[0,R],[-R,0],[R,0]].forEach(p => {
    for (let y = 0; y < 3; y++) addVoxel('solid', '#C73E1D', p[0], baseY+y, p[1], 1, 1, 1);
  });

  // Stepped Upturned Jade Roofs
  for (let rx = -roofR; rx <= roofR; rx++) {
    for (let rz = -roofR; rz <= roofR; rz++) {
      const dist = Math.max(Math.abs(rx), Math.abs(rz));
      if (dist > roofR) continue;
      let ry = baseY + 3 + Math.floor((roofR - dist) * 0.6);
      if (Math.abs(rx) >= roofR - 1 && Math.abs(rz) >= roofR - 1) ry += 2;
      else if (Math.abs(rx) === roofR || Math.abs(rz) === roofR) ry += 1;

      for (let ry2 = Math.max(baseY+3, ry-1); ry2 <= ry; ry2++) {
        const isSurface = (ry2 === ry);
        const isEdge = (dist === roofR);
        const color = isEdge ? '#E8B86D' : (isSurface ? (Math.random()<0.5?'#2D6A4F':'#40916C') : '#4A2C1A');
        addVoxel(isEdge ? 'metal' : 'solid', color, rx, ry2, rz, 1, 1, 1, 0.7 + (ry2 - (baseY+3))*0.1);
      }
    }
  }
  addVoxel('metal', '#E8B86D', 0, baseY + 3 + Math.floor(roofR*0.6) + 1, 0, 2, 1, 2);

  // Door InstancedMesh
  const dm = new THREE.InstancedMesh(geometry, materials.solid, 2);
  dm.castShadow = true; dm.receiveShadow = true;
  scene.add(dm);
  doorMeshes.push(dm);
  doorStates.push({ current: 0, target: 0 });

  // Floor Hitbox
  const h = new THREE.Mesh(
    new THREE.BoxGeometry(R*2, 3, 1),
    new THREE.MeshBasicMaterial({ visible: false })
  );
  h.position.set(0, baseY + 1.5, R + 0.5);
  h.userData.floor = i;
  scene.add(h);
  floorHitboxes.push(h);
}

// Finial (Sorin)
const topY = 29;
for (let y = 0; y < 5; y++) addVoxel('metal', '#E8B86D', 0, topY+y, 0, 1, 1, 1);
for (let y = 1; y < 4; y += 1.2) addVoxel('metal', '#E8B86D', 0, topY+y, 0, 2.5, 0.25, 2.5);
addVoxel('emissive', '#FFE5B4', 0, topY+5, 0, 0.8, 0.8, 0.8, 1.2);

// Torii Gate
for (let y = 1; y <= 7; y++) {
  addVoxel('solid', '#C73E1D', -4, y, 26, 1, 1, 1);
  addVoxel('solid', '#C73E1D',  4, y, 26, 1, 1, 1);
}
for (let x = -6; x <= 6; x++) {
  addVoxel('solid', '#C73E1D', x, (Math.abs(x) >= 5) ? 9 : 8, 26, 1, 1, 1);
  if (Math.abs(x) <= 5) addVoxel('solid', '#C73E1D', x, 6, 26, 1, 1, 1);
}
addVoxel('metal', '#E8B86D', 0, 7, 26, 2, 1, 1);

// Arched Bridge
for (let x = -11; x <= -5; x++) {
  const arch = Math.floor(2 - Math.pow((x+8)/3, 2));
  for (let z = 5; z <= 7; z++) {
    addVoxel('solid', '#C73E1D', x, 1+arch, z, 1, 0.5, 1);
    if (z === 5 || z === 7) addVoxel('solid', '#C73E1D', x, 2+arch, z, 1, 1, 0.5);
  }
}

// Bamboo Fence
for (let z = -15; z <= 15; z++) {
  if (Math.sqrt(400 + z*z) < 26) {
    addVoxel('solid', '#40916C', -20, 1, z, 0.5, 2, 0.5, 0.9);
    addVoxel('solid', '#606C38', -20, 2, z, 0.8, 0.2, 0.8);
    addVoxel('solid', '#4A2C1A', -20, 1.5, z, 0.3, 0.3, 1);
  }
}

// Jizo Statues
function makeJizo(jx, jz) {
  addVoxel('solid', '#9AA0A6', jx, 1, jz, 2, 1, 2);
  addVoxel('solid', '#9AA0A6', jx, 2, jz, 1.5, 1.5, 1.5);
  addVoxel('solid', '#9AA0A6', jx, 3.5, jz, 1.6, 1, 1.6);
  addVoxel('solid', '#C73E1D', jx, 2.6, jz+0.4, 1.2, 0.8, 0.5);
}
makeJizo(-8, 18); makeJizo(8, 18);

// 40 Flowers
let fCount = 0;
while (fCount < 40) {
  const fx = Math.floor((Math.random()-0.5)*50);
  const fz = Math.floor((Math.random()-0.5)*50);
  const d = Math.sqrt(fx*fx + fz*fz);
  const pd = Math.sqrt((fx+14)**2 + (fz-6)**2);
  if (d < 24 && pd > 10 && Math.abs(fx) > 9) {
    const c = ['#FFB7C5','#FF8FAB','#FFE5EC','#E8B86D'][Math.floor(Math.random()*4)];
    addVoxel('emissive', c, fx, 1.2, fz, 0.4, 0.4, 0.4, 0.8);
    addVoxel('solid', '#40916C', fx, 1.0, fz, 0.2, 0.4, 0.2);
    fCount++;
  }
}

// Exactly 8 Trees
const treeSpots = [
  {x: 12, z: 12, type: 'Sakura'}, {x: -12, z: -10, type: 'Sakura'}, {x: 16, z: -4, type: 'Sakura'},
  {x: -16, z: 16, type: 'Pine'}, {x: 18, z: 18, type: 'Pine'},
  {x: 10, z: -16, type: 'Maple'}, {x: -8, z: -18, type: 'Maple'},
  {x: -18, z: -4, type: 'Willow'}
];
treeSpots.forEach(t => {
  const tx = t.x, tz = t.z, type = t.type;
  const trunkH = type === 'Pine' ? 6 : (type === 'Willow' ? 5 : 4);
  for (let y = 1; y <= trunkH; y++) addVoxel('solid', '#4A2C1A', tx, y, tz, 1, 1, 1, 0.8);

  if (type === 'Pine') {
    for (let l = 0; l < 3; l++) {
      const ly = trunkH - l*2, lr = 3 - l;
      for (let dx = -lr; dx <= lr; dx++) for (let dz = -lr; dz <= lr; dz++) {
        if (Math.abs(dx)+Math.abs(dz) <= lr+1 && Math.random() > 0.1)
          addVoxel('leaves', '#2D6A4F', tx+dx, ly, tz+dz, 1, 1, 1, 0.8+Math.random()*0.4);
      }
    }
  } else if (type === 'Sakura') {
    for (let dx = -4; dx <= 4; dx++) for (let dy = -2; dy <= 2; dy++) for (let dz = -4; dz <= 4; dz++) {
      if (Math.sqrt(dx*dx + dy*dy*1.5 + dz*dz) < 3.5 + Math.random()) {
        const c = ['#FFB7C5','#FF8FAB','#FFE5EC'][Math.floor(Math.random()*3)];
        addVoxel('leaves', c, tx+dx, trunkH+dy+1, tz+dz, 1, 1, 1, 0.9);
      }
    }
    for (let dx = -2; dx <= 2; dx++) addVoxel('solid', '#4A2C1A', tx+dx, trunkH, tz, 1, 0.5, 1);
  } else if (type === 'Maple') {
    for (let dx = -3; dx <= 3; dx++) for (let dy = -1; dy <= 2; dy++) for (let dz = -3; dz <= 3; dz++) {
      if (Math.sqrt(dx*dx + dy*dy + dz*dz) < 3.2 + Math.random()) {
        const c = ['#C73E1D','#E8B86D','#9D2E1D'][Math.floor(Math.random()*3)];
        addVoxel('leaves', c, tx+dx, trunkH+dy, tz+dz, 1, 1, 1, 0.9);
      }
    }
  } else if (type === 'Willow') {
    for (let a = 0; a < 12; a++) {
      const ang = (a/12) * Math.PI * 2;
      const sx = Math.cos(ang)*3, sz = Math.sin(ang)*3;
      addVoxel('leaves', '#40916C', tx+sx, trunkH+1, tz+sz, 1, 1, 1);
      for (let y = 0; y < 4; y++) addVoxel('leaves', '#606C38', tx+sx*0.8, trunkH-y, tz+sz*0.8, 0.6, 1, 0.6, 0.8);
    }
    addVoxel('leaves', '#40916C', tx, trunkH+2, tz, 3, 1, 3);
  }
});

buildStatic();

// --------------------------------------------------------
// 6. LIGHTS, LANTERNS & SKY
// --------------------------------------------------------
const hemi = new THREE.HemisphereLight('#B1D8FF', '#606C38', 1.0);
scene.add(hemi);

const sun = new THREE.DirectionalLight('#FFF4E0', 2.0);
sun.castShadow = true;
sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;
sun.shadow.camera.left = -40; sun.shadow.camera.right = 40;
sun.shadow.camera.top = 40;   sun.shadow.camera.bottom = -40;
sun.shadow.camera.near = 1;   sun.shadow.camera.far = 120;
sun.shadow.bias = -0.0005;
scene.add(sun);

// Procedural Sky Canvas
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 2; skyCanvas.height = 256;
const skyCtx = skyCanvas.getContext('2d');
const skyTex = new THREE.CanvasTexture(skyCanvas);
skyTex.colorSpace = THREE.SRGBColorSpace;
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(250, 32, 16),
  new THREE.MeshBasicMaterial({ map: skyTex, side: THREE.BackSide, depthWrite: false, fog: false })
);
scene.add(sky);

const lanterns = [];
[[-6, 10], [6, 10], [-6, -10], [6, -10]].forEach(([lx, lz]) => {
  addVoxel('solid', '#9AA0A6', lx, 1, lz, 1.5, 1, 1.5);
  addVoxel('solid', '#9AA0A6', lx, 2, lz, 0.6, 1, 0.6);
  // Re-add these directly to static mesh since buildStatic already ran
  // We'll just create a tiny supplemental mesh for lantern bodies to keep it clean
});

// Supplemental static mesh for lanterns (added post-build for simplicity)
const lanternGroup = { solid: [], emissive: [], metal: [] };
[[-6, 10], [6, 10], [-6, -10], [6, -10]].forEach(([lx, lz]) => {
  const push = (m, hex, x,y,z, sx,sy,sz) => {
    lanternGroup[m].push({
      mat: new THREE.Matrix4().compose(new THREE.Vector3(x,y,z), new THREE.Quaternion(), new THREE.Vector3(sx,sy,sz)),
      col: new THREE.Color(hex)
    });
  };
  push('solid', '#9AA0A6', lx, 1, lz, 1.5, 1, 1.5);
  push('solid', '#9AA0A6', lx, 2, lz, 0.6, 1, 0.6);
  push('emissive', '#FFE5B4', lx, 3, lz, 1.2, 1.2, 1.2);
  push('solid', '#4A2C1A', lx, 3.8, lz, 2, 0.4, 2);
  push('metal', '#E8B86D', lx, 4.2, lz, 0.5, 0.5, 0.5);

  const hit = new THREE.Mesh(new THREE.BoxGeometry(2, 2.5, 2), new THREE.MeshBasicMaterial({ visible: false }));
  hit.position.set(lx, 3, lz);
  scene.add(hit);

  const light = new THREE.PointLight('#FFB86D', 0, 14, 2);
  light.position.set(lx, 3.2, lz);
  scene.add(light);

  lanterns.push({ hit, light, on: true, baseIntensity: 2.2 });
});
for (const m in lanternGroup) {
  const d = lanternGroup[m];
  const im = new THREE.InstancedMesh(geometry, materials[m], d.length);
  d.forEach((v, i) => { im.setMatrixAt(i, v.mat); im.setColorAt(i, v.col); });
  im.castShadow = true; im.receiveShadow = true;
  scene.add(im);
  totalVoxels += d.length;
}

const skyColors = [
  { top:'#0A1128', bot:'#1C3A5E', si:0.1, hi:0.2, sc:'#3A5A8C' },
  { top:'#2A4B7C', bot:'#FF8FAB', si:1.2, hi:0.7, sc:'#FFB7C5' },
  { top:'#4A90E2', bot:'#B1D8FF', si:2.5, hi:1.2, sc:'#FFF4E0' },
  { top:'#1A2A5E', bot:'#E8B86D', si:1.2, hi:0.7, sc:'#FFA05C' },
  { top:'#0A1128', bot:'#1C3A5E', si:0.1, hi:0.2, sc:'#3A5A8C' }
];

function updateSky(tod) {
  let i = Math.floor(tod * 4);
  let f = (tod * 4) % 1;
  f = f * f * (3 - 2 * f);
  const a = skyColors[i], b = skyColors[i+1];

  cTop.set(a.top).lerp(tmpColor.set(b.top), f);
  cBot.set(a.bot).lerp(tmpColor.set(b.bot), f);
  cSun.set(a.sc).lerp(tmpColor.set(b.sc), f);

  const grad = skyCtx.createLinearGradient(0, 0, 0, 256);
  grad.addColorStop(0.0, `#${cTop.getHexString()}`);
  grad.addColorStop(0.5, `#${cTop.clone().lerp(cBot, 0.5).getHexString()}`);
  grad.addColorStop(1.0, `#${cBot.getHexString()}`);
  skyCtx.fillStyle = grad;
  skyCtx.fillRect(0, 0, 2, 256);
  skyTex.needsUpdate = true;
  scene.fog.color.copy(cBot);

  sun.color.copy(cSun);
  sun.intensity = a.si + (b.si - a.si) * f;
  hemi.intensity = a.hi + (b.hi - a.hi) * f;

  const angle = tod * Math.PI * 2 - Math.PI / 2;
  sun.position.set(Math.cos(angle) * 60, Math.sin(angle) * 60 + 10, 30);

  const darkFactor = Math.max(0, 1 - Math.min(tod / 0.25, (1 - tod) / 0.25));
  materials.emissive.emissiveIntensity = 0.3 + darkFactor * 1.1;

  lanterns.forEach(l => {
    l.light.intensity = l.on
      ? l.baseIntensity * darkFactor * (0.9 + Math.sin(elapsed * 12 + l.hit.position.x) * 0.1)
      : 0;
  });
}

// --------------------------------------------------------
// 7. DYNAMIC MESHES
// --------------------------------------------------------
// Doors
function updateDoors(dt) {
  for (let i = 0; i < 5; i++) {
    const s = doorStates[i];
    s.current += (s.target - s.current) * Math.min(1, dt * 8);
    const R = 7 - i, baseY = 2 + i * 5;
    const offset = s.current * 1.5;
    const dm = doorMeshes[i];

    dm.setMatrixAt(0, new THREE.Matrix4().compose(new THREE.Vector3(-0.75 - offset, baseY+1, R+0.35), new THREE.Quaternion(), new THREE.Vector3(1.5, 2, 0.2)));
    dm.setMatrixAt(1, new THREE.Matrix4().compose(new THREE.Vector3( 0.75 + offset, baseY+1, R+0.35), new THREE.Quaternion(), new THREE.Vector3(1.5, 2, 0.2)));
    dm.setColorAt(0, tmpColor.set('#C73E1D'));
    dm.setColorAt(1, tmpColor.set('#C73E1D'));
    dm.instanceMatrix.needsUpdate = true;
    dm.instanceColor.needsUpdate = true;
  }
}

// Koi
const koiMesh = new THREE.InstancedMesh(geometry, materials.emissive, 18);
scene.add(koiMesh);
const koiData = Array.from({length: 6}, (_, i) => ({
  angle: (i/6)*Math.PI*2, radius: 3 + Math.random()*3, speed: 0.5 + Math.random()*0.3, cx: -14, cz: 6
}));
function updateKoi(t) {
  koiData.forEach((k, i) => {
    const a = k.angle + t * k.speed;
    const x = k.cx + Math.cos(a)*k.radius;
    const z = k.cz + Math.sin(a)*k.radius;
    const y = -0.65 + Math.sin(t*5 + i)*0.05;
    const rot = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), -a);
    const tx = x + Math.sin(a)*1.2, tz = z - Math.cos(a)*1.2;

    koiMesh.setMatrixAt(i*3+0, new THREE.Matrix4().compose(new THREE.Vector3(x,y,z), rot, new THREE.Vector3(0.8,0.4,1.6)));
    koiMesh.setMatrixAt(i*3+1, new THREE.Matrix4().compose(new THREE.Vector3(tx,y,tz), rot, new THREE.Vector3(0.4,0.2,0.8)));
    koiMesh.setMatrixAt(i*3+2, new THREE.Matrix4().compose(new THREE.Vector3(x,y+0.2,z), rot, new THREE.Vector3(0.5,0.2,0.5)));

    const c1 = tmpColor.set(i%2 ? '#FF8FAB' : '#E8B86D');
    koiMesh.setColorAt(i*3+0, c1); koiMesh.setColorAt(i*3+1, c1);
    koiMesh.setColorAt(i*3+2, tmpColor.set('#FFE5EC'));
  });
  koiMesh.instanceMatrix.needsUpdate = true; koiMesh.instanceColor.needsUpdate = true;
}

// Petals
const petalMesh = new THREE.InstancedMesh(geometry, materials.emissive, 200);
scene.add(petalMesh);
const petals = Array.from({length: 200}, () => ({
  x: (Math.random()-0.5)*60, y: Math.random()*30, z: (Math.random()-0.5)*60,
  speed: 1 + Math.random()*2, drift: Math.random()*Math.PI*2
}));
function updatePetals(dt, t) {
  petals.forEach((p, i) => {
    p.y -= p.speed * dt;
    p.x += Math.sin(t + p.drift) * dt * 1.5;
    p.z += Math.cos(t*0.8 + p.drift) * dt;
    if (p.y < 0) { p.y = 30; p.x = (Math.random()-0.5)*60; p.z = (Math.random()-0.5)*60; }
    const rot = new THREE.Quaternion().setFromEuler(new THREE.Euler(t*2+i, t*3+i, 0));
    petalMesh.setMatrixAt(i, new THREE.Matrix4().compose(new THREE.Vector3(p.x,p.y,p.z), rot, new THREE.Vector3(0.3,0.1,0.3)));
    petalMesh.setColorAt(i, tmpColor.set(i%3===0?'#FFE5EC':'#FFB7C5'));
  });
  petalMesh.instanceMatrix.needsUpdate = true; petalMesh.instanceColor.needsUpdate = true;
}

// Birds
const birdMesh = new THREE.InstancedMesh(geometry, materials.solid, 9);
scene.add(birdMesh);
function updateBirds(t) {
  for (let i = 0; i < 3; i++) {
    const a = t * 0.3 + (i/3)*Math.PI*2;
    const bx = Math.cos(a)*35, bz = Math.sin(a)*35, by = 25 + Math.sin(t*2+i)*2;
    const flap = Math.sin(t*10 + i) * 0.5;
    const wx = Math.cos(a)*0.8, wz = Math.sin(a)*0.8;
    const qBody = new THREE.Quaternion().setFromAxisAngle(new THREE.Vector3(0,1,0), -a);
    const qL = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, -a, flap));
    const qR = new THREE.Quaternion().setFromEuler(new THREE.Euler(0, -a, -flap));

    birdMesh.setMatrixAt(i*3+0, new THREE.Matrix4().compose(new THREE.Vector3(bx,by,bz), qBody, new THREE.Vector3(0.5,0.5,1.5)));
    birdMesh.setMatrixAt(i*3+1, new THREE.Matrix4().compose(new THREE.Vector3(bx-wx,by,bz-wz), qL, new THREE.Vector3(1.5,0.2,0.6)));
    birdMesh.setMatrixAt(i*3+2, new THREE.Matrix4().compose(new THREE.Vector3(bx+wx,by,bz+wz), qR, new THREE.Vector3(1.5,0.2,0.6)));
    const c = tmpColor.set('#4A2C1A');
    birdMesh.setColorAt(i*3+0, c); birdMesh.setColorAt(i*3+1, c); birdMesh.setColorAt(i*3+2, c);
  }
  birdMesh.instanceMatrix.needsUpdate = true; birdMesh.instanceColor.needsUpdate = true;
}

// Waterfall
const wfMesh = new THREE.InstancedMesh(geometry, materials.water, 60);
scene.add(wfMesh);
const wfData = Array.from({length: 60}, () => ({
  ox: (Math.random()-0.5)*1.5, oz: (Math.random()-0.5)*1.5, off: Math.random()*20, spd: 0.8+Math.random()*0.4
}));
function updateWaterfall(t) {
  wfData.forEach((w, i) => {
    const y = -((t * w.spd * 5 + w.off) % 20);
    wfMesh.setMatrixAt(i, new THREE.Matrix4().compose(new THREE.Vector3(-26+w.ox, y, 6+w.oz), new THREE.Quaternion(), new THREE.Vector3(0.6,1.2,0.6)));
    wfMesh.setColorAt(i, tmpColor.set(i%5===0?'#FFE5EC':'#7ED6DF'));
  });
  wfMesh.instanceMatrix.needsUpdate = true; wfMesh.instanceColor.needsUpdate = true;
}

totalVoxels += 10 + 18 + 200 + 9 + 60;
window.__VOXEL__.voxelCount = totalVoxels;
document.getElementById('stats').innerText = `${(totalVoxels/1000).toFixed(1)}k voxels | 60 FPS`;

// --------------------------------------------------------
// 8. INTERACTION
// --------------------------------------------------------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('pointerdown', (e) => {
  if (!introDone || e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON') return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const lHits = raycaster.intersectObjects(lanterns.map(l => l.hit));
  if (lHits.length) {
    const l = lanterns.find(x => x.hit === lHits[0].object);
    l.on = !l.on;
    return;
  }
  const fHits = raycaster.intersectObjects(floorHitboxes);
  if (fHits.length) {
    const idx = fHits[0].object.userData.floor;
    doorStates[idx].target = doorStates[idx].target === 0 ? 1 : 0;
  }
});

document.getElementById('timeSlider').addEventListener('input', e => { timeOfDay = parseFloat(e.target.value); });
document.getElementById('pauseBtn').addEventListener('click', e => {
  isPaused = !isPaused;
  e.target.innerText = isPaused ? 'Play' : 'Pause';
});

// --------------------------------------------------------
// 9. ANIMATION LOOP
// --------------------------------------------------------
let lastTime = performance.now();
let frames = 0, lastFpsTime = lastTime, fps = 60;

function animate(now) {
  requestAnimationFrame(animate);
  let dt = (now - lastTime) / 1000;
  lastTime = now;
  if (dt > 0.1) dt = 0.1;

  if (!isPaused) {
    elapsed += dt;
    timeOfDay = (timeOfDay + dt / CYCLE_LEN) % 1;
    document.getElementById('timeSlider').value = timeOfDay;
  }

  frames++;
  if (now - lastFpsTime > 500) {
    fps = Math.round(frames * 1000 / (now - lastFpsTime));
    frames = 0; lastFpsTime = now;
    document.getElementById('stats').innerText = `${(totalVoxels/1000).toFixed(1)}k voxels | ${fps} FPS`;
    window.__VOXEL__.fps = fps;
  }
  window.__VOXEL__.timeOfDay = timeOfDay;

  updateSky(timeOfDay);

  if (!introDone) {
    if (elapsed < 2.5) {
      let p = elapsed / 2.5;
      p = p * p * (3 - 2 * p);
      camera.position.lerpVectors(introStart, introEnd, p);
      camera.lookAt(0, 10 + p * 4, 0);
    } else {
      introDone = true;
      controls.enabled = true;
      idleTimer = elapsed;
    }
  } else {
    if (elapsed - idleTimer > 3.0) controls.autoRotate = true;
    controls.update();
  }

  if (waterShader) waterShader.uniforms.uTime.value = elapsed;
  if (leavesShader) leavesShader.uniforms.uTime.value = elapsed;

  updateDoors(dt);
  if (!isPaused) {
    updateKoi(elapsed);
    updatePetals(dt, elapsed);
    updateBirds(elapsed);
    updateWaterfall(elapsed);
  }

  renderer.render(scene, camera);
}

requestAnimationFrame(animate);
</script>
