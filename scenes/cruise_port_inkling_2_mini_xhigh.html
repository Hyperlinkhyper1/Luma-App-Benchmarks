#about{position:fixed;top:10px;right:12px;z-index:10;color:#fff;font-size:10px;opacity:.7;text-align:right;line-height:1.5;text-shadow:0 1px 3px #000;}
#err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;color:#ffd9d0;background:#1a0f0f;z-index:60;padding:30px;font-size:16px;}

  <select id="wx"><option value="clear">Clear</option><option value="haze">Haze</option><option value="rain">Light rain</option></select>

/* ---------- helpers ---------- */
const M=(g,m,x=0,y=0,z=0)=>{const o=new THREE.Mesh(g,m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o;};

function textTex(w,h,txt,fg='#17324a',bg='rgba(255,255,255,0)',font='bold 90px Georgia'){return canvasTex(w,h,(g)=>{g.fillStyle=bg;g.fillRect(0,0,w,h);g.fillStyle=fg;g.font=font;g.textAlign='center';g.textBaseline='middle';g.fillText(txt,w/2,h/2);});}
const lerp=(a,b,t)=>a+(b-a)*t, clamp=(v,a,b)=>Math.max(a,Math.min(b,v)), sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};

/* ---------- sky ---------- */
const skyUni={top:{value:new THREE.Color(0x3a5b8c)},bottom:{value:new THREE.Color(0xf5b96a)},off:{value:20}};
const skyMat=new THREE.ShaderMaterial({side:THREE.BackSide,depthWrite:false,uniforms:skyUni,vertexShader:`varying vec3 vP;void main(){vP=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,fragmentShader:`varying vec3 vP;uniform vec3 top,bottom;uniform float off;void main(){float h=normalize(vP).y;vec3 c=mix(bottom,top,smoothstep(-0.05,0.5,h));gl_FragColor=vec4(c,1.);}`});
scene.add(new THREE.Mesh(new THREE.SphereGeometry(2400,24,16),skyMat));
const sunMesh=new THREE.Mesh(new THREE.SphereGeometry(60,16,16),new THREE.MeshBasicMaterial({color:0xffd9a0})); scene.add(sunMesh);
const moonMesh=new THREE.Mesh(new THREE.SphereGeometry(38,16,16),new THREE.MeshBasicMaterial({color:0xe8ecff})); moonMesh.visible=false; scene.add(moonMesh);
const starGeo=new THREE.BufferGeometry(); const starN=500, sp=new Float32Array(starN*3);
for(let i=0;i<starN;i++){const a=Math.random()*Math.PI*2,e=Math.random()*Math.PI*0.45+0.05;sp[i*3]=Math.cos(a)*Math.cos(e)*2200;sp[i*3+1]=Math.sin(e)*2200;sp[i*3+2]=Math.sin(a)*Math.cos(e)*2200;}

scene.add(new THREE.Points(starGeo,starMat));

/* ---------- water ---------- */
const waterUni={uT:{value:0},uNight:{value:0}};
const waterMat=new THREE.ShaderMaterial({transparent:false,uniforms:waterUni,vertexShader:`varying vec3 vW;uniform float uT;void main(){vec3 p=position;p.y+=sin(p.x*0.06+uT*1.1)*0.4+cos(p.z*0.09+uT*0.8)*0.35;vW=(modelMatrix*vec4(p,1.)).xyz;gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.);}`,
fragmentShader:`varying vec3 vW;uniform float uT,uNight;void main(){vec3 deep=mix(vec3(0.05,0.22,0.33),vec3(0.02,0.05,0.12),uNight);vec3 lite=mix(vec3(0.20,0.42,0.50),vec3(0.05,0.10,0.20),uNight);float f=(sin(vW.x*0.05+uT)+sin(vW.z*0.07-uT*0.7)+2.)/4.;vec3 c=mix(deep,lite,f*0.55);float sp=pow(max(0.,sin(vW.x*0.35+uT*2.)*sin(vW.z*0.3-uT*1.7)),8.);c+=vec3(1.,0.95,0.8)*sp*0.25*(1.-uNight);gl_FragColor=vec4(c,1.);}`});
const water=new THREE.Mesh(new THREE.PlaneGeometry(1800,420,160,44),waterMat);
water.rotation.x=-Math.PI/2; water.position.set(0,0,75); scene.add(water);

/* ---------- city textures ---------- */
function facadeTex(base,tiles,winLit){return canvasTex(128,256,(g,w,h)=>{g.fillStyle=base;g.fillRect(0,0,w,h);
 if(tiles){g.fillStyle='rgba(255,255,255,0.06)';for(let y=0;y<h;y+=16)for(let x=0;x<w;x+=16)g.fillRect(x+1,y+1,14,14);g.strokeStyle='rgba(40,90,140,0.35)';g.lineWidth=1;for(let y=0;y<h;y+=16){g.beginPath();g.moveTo(0,y);g.lineTo(w,y);g.stroke();}g.strokeStyle='rgba(40,90,140,0.2)';for(let x=0;x<w;x+=16){g.beginPath();g.moveTo(x,0);g.lineTo(x,h);g.stroke();}}
 for(let fy=0;fy<5;fy++){for(let fx=0;fx<4;fx++){const x=12+fx*29,y=18+fy*46;g.fillStyle=(winLit&&Math.random()<0.55)?'#ffd97a':(winLit?'#223148':'#2c3a4e');g.fillRect(x,y,15,22);g.strokeStyle='rgba(0,0,0,0.35)';g.strokeRect(x,y,15,22);if(winLit&&Math.random()<0.4){g.fillStyle='rgba(255,240,190,0.5)';g.fillRect(x+1,y+1,13,5);}}}},2,1);}
const facDay=['#e8d9c0','#f0e3c8','#e6c9a8','#f3ead6','#e2b78c'].map(c=>facadeTex(c,false,false));
const facNight=['#e8d9c0','#f0e3c8','#e6c9a8','#f3ead6','#e2b78c'].map(c=>facadeTex(c,false,true));
const azDay=facadeTex('#dfe8ea',true,false), azNight=facadeTex('#dfe8ea',true,true);

/* ---------- ground / quay / hill ---------- */
const ground=M(new THREE.BoxGeometry(1900,2,500),LAM(0x6f7d5b),0,-1.05,-230); scene.add(ground);
const quayMat=LAM(0x9a958c);
const quay=M(new THREE.BoxGeometry(1900,3.4,14),quayMat,0,1.4,-36); scene.add(quay);
const plaza=M(new THREE.BoxGeometry(1900,3.6,90),LAM(0xcbbfa8),0,1.35,-95); scene.add(plaza);
// Alfama hill
function hillH(z,x){const d=(-z-110)/320;return d<0?0:Math.pow(d,1.55)*100+Math.sin(x*0.008+1)*4;}
const hillGeo=new THREE.PlaneGeometry(900,340,60,30); hillGeo.rotateX(-Math.PI/2);
{const p=hillGeo.attributes.position;for(let i=0;i<p.count;i++){const x=p.getX(i),z=p.getZ(i)-280;p.setY(i,hillH(z,x));}hillGeo.computeVertexNormals();}
const hill=new THREE.Mesh(hillGeo,LAM(0x8a8463)); hill.receiveShadow=true; hill.position.set(0,0,0); scene.add(hill);
const southBank=M(new THREE.BoxGeometry(1900,3,240),LAM(0x8b8f7a),0,0.4,270); scene.add(southBank);

/* ---------- houses ---------- */
const houseGeo=new THREE.BoxGeometry(1,1,1); houseGeo.translate(0,0.5,0);
const houseMats=facDay.map(t=>new THREE.MeshLambertMaterial({map:t}));
const houseInstanced=new THREE.InstancedMesh(houseGeo,new THREE.MeshLambertMaterial({map:facDay[0]}),420);
const roofGeo=new THREE.ConeGeometry(0.78,0.5,4); roofGeo.rotateY(Math.PI/4); roofGeo.translate(0,0.25,0);
const roofMat=LAM(0xb3502f); const roofInstanced=new THREE.InstancedMesh(roofGeo,roofMat,420);
const dummy=new THREE.Object3D(); let hi=0;
for(let i=0;i<420;i++){
  const x=-420+(Math.random()*840), z=-115-Math.random()*300;
  const y=hillH(z,x); if(y<2)continue;
  const w=10+Math.random()*12, d=10+Math.random()*10, fl=3+Math.floor(Math.random()*3), h=fl*3.1;
  dummy.position.set(x,y,z); dummy.scale.set(w,h,d); dummy.rotation.y=(Math.random()-0.5)*0.28; dummy.updateMatrix();
  houseInstanced.setMatrixAt(hi,dummy.matrix);
  dummy.position.set(x,y+h,z); dummy.scale.set(w*1.06,1,d*1.06); dummy.updateMatrix();
  roofInstanced.setMatrixAt(hi,dummy.matrix); hi++;
}
houseInstanced.count=hi; roofInstanced.count=hi; houseInstanced.castShadow=roofInstanced.castShadow=true; houseInstanced.receiveShadow=roofInstanced.receiveShadow=true;
scene.add(houseInstanced,roofInstanced);
// azulejo accent buildings (few real meshes)
for(let i=0;i<7;i++){const x=-380+Math.random()*760,z=-130-Math.random()*120,y=hillH(z,x);if(y<2)continue;
 const b=M(new THREE.BoxGeometry(11,11,11),new THREE.MeshLambertMaterial({map:azDay}),x,y+5.5,z); scene.add(b);
 const cap=M(new THREE.ConeGeometry(9,3,4),roofMat,x,y+12.5,z); cap.rotation.y=Math.PI/4; scene.add(cap);}
// waterfront street houses
for(let i=0;i<14;i++){const x=-420+i*64+Math.random()*10;const h=8+Math.random()*10;
 const b=M(new THREE.BoxGeometry(26,h,20),new THREE.MeshLambertMaterial({map:facDay[i%5]}),x,1.4+h/2,-42-14-Math.random()*6); scene.add(b);
 const cap=M(new THREE.ConeGeometry(20,4,4),roofMat,x,1.4+h+1.8,-42-16); cap.rotation.y=Math.PI/4; scene.add(cap);}

/* ---------- landmarks ---------- */
const stoneMat=LAM(0xd8cdb8), stoneDark=LAM(0xb9ac93);
// São Jorge Castle
const castle=new THREE.Group();
castle.add(M(new THREE.BoxGeometry(90,26,70),stoneMat,0,13,0));
for(const [tx,tz] of [[-42,-32],[42,-32],[-42,32],[42,32]]){
  castle.add(M(new THREE.CylinderGeometry(9,11,40,8),stoneMat,tx,20,tz));
  castle.add(M(new THREE.ConeGeometry(10,9,8),LAM(0xc9573a),tx,44,tz));}
castle.add(M(new THREE.BoxGeometry(26,20,22),stoneDark,0,8,42));
for(let i=0;i<12;i++)castle.add(M(new THREE.BoxGeometry(4,3,3),stoneMat,-40+i*7.3,28.5,-33));
castle.position.set(285,hillH(-270,285)+2,-270); scene.add(castle);
// Pantheon
const panth=new THREE.Group();
panth.add(M(new THREE.CylinderGeometry(16,16,14,24),LAM(0xf2efe6),0,7,0));
panth.add(M(new THREE.CylinderGeometry(16.5,16.5,4,24),LAM(0xe8e4d8),0,14,0));
const dome=M(new THREE.SphereGeometry(13,24,16,0,Math.PI*2,0,Math.PI/2),LAM(0xcfd6da),0,18,0); panth.add(dome);
panth.add(M(new THREE.SphereGeometry(2.4,12,10),LAM(0xe8e4d8),0,31,0));
panth.add(M(new THREE.BoxGeometry(30,10,10),LAM(0xefe9dc),0,5,17));
for(let i=0;i<6;i++)panth.add(M(new THREE.CylinderGeometry(1.4,1.5,8,10),LAM(0xf6f2e8),-12.5+i*5,4,22.5));
panth.position.set(-40,1.6,-58); panth.rotation.y=Math.PI; scene.add(panth);
// Sé towers
const se=new THREE.Group();
for(const dx of [-8,8]){const t=M(new THREE.BoxGeometry(6,34,6),LAM(0xe3d7bd),dx,17,0);t.rotation.x=0.02;se.add(t);se.add(M(new THREE.ConeGeometry(4.6,7,4),LAM(0xb3502f),dx,37.5,0)).material=se.children[se.children.length-1].material;se.children[se.children.length-1].rotation.y=Math.PI/4;}
se.add(M(new THREE.BoxGeometry(4,10,12),LAM(0xd9cdb2),0,5,0));
se.position.set(-150,1.6,-50); scene.add(se);
// Praça do Comércio: arcade + arch
const comercio=new THREE.Group();
const archShape=new THREE.Shape(); archShape.moveTo(-14,0); archShape.lineTo(-14,26); archShape.lineTo(14,26); archShape.lineTo(14,0); archShape.lineTo(7,0); archShape.lineTo(7,14); archShape.quadraticCurveTo(0,20,-7,14); archShape.lineTo(-7,0); archShape.closePath();
const arch=new THREE.Mesh(new THREE.ExtrudeGeometry(archShape,{depth:5,bevelEnabled:false}),LAM(0xd9b25f)); arch.castShadow=true; comercio.add(arch);
comercio.position.set(-290,1.6,-48); scene.add(comercio);
const arcadeTex=canvasTex(512,96,(g,w,h)=>{g.fillStyle='#e0b96a';g.fillRect(0,0,w,h);g.fillStyle='#3d2c18';for(let i=0;i<12;i++){const x=12+i*41;g.beginPath();g.arc(x+16,58,15,Math.PI,0);g.lineTo(x+31,88);g.lineTo(x+1,88);g.closePath();g.fill();}});
const arcade=M(new THREE.BoxGeometry(430,16,18),new THREE.MeshLambertMaterial({map:arcadeTex}),-285,9.6,-72); scene.add(arcade);
// 25 de Abril bridge
const bridge=new THREE.Group(); const BR=0xc33a28; const brMat=LAM(BR);
bridge.add(M(new THREE.BoxGeometry(24,7,240),brMat,0,70,46));
for(const tz of [-8,98]){
  bridge.add(M(new THREE.BoxGeometry(6,150,6),brMat,-6,145,tz)); bridge.add(M(new THREE.BoxGeometry(6,150,6),brMat,6,145,tz));
  bridge.add(M(new THREE.BoxGeometry(18,5,6),brMat,0,150,tz));}
bridge.add(M(new THREE.BoxGeometry(3,150,3),brMat,0,215,-8)); // apex pin
for(const tz of [-8,98]){for(const side of [-1,1]){const a=new THREE.Vector3(0,200,tz),b=new THREE.Vector3(0,74,46+side*120);
  const l=a.distanceTo(b);const cyl=M(new THREE.CylinderGeometry(0.7,0.7,l,6),brMat,0,0,0);
  cyl.position.copy(a.clone().lerp(b,0.5));cyl.lookAt(b);cyl.rotateX(Math.PI/2);bridge.add(cyl);}}
bridge.position.set(-390,0,0); scene.add(bridge);
// Cristo Rei on south bank hill
const southHill=M(new THREE.ConeGeometry(60,42,20),LAM(0x7a8a5e),-460,0,235); scene.add(southHill);
const cristo=new THREE.Group();
cristo.add(M(new THREE.BoxGeometry(10,26,10),LAM(0xd6d0c2),0,13,0));
const sil=LAM(0x6f7d8a);
cristo.add(M(new THREE.CylinderGeometry(4.4,5.2,26,10),sil,0,38,0));
cristo.add(M(new THREE.SphereGeometry(3.2,12,10),sil,0,54,0));
const arms=M(new THREE.BoxGeometry(46,3,3),sil,0,46,0); cristo.add(arms);
cristo.add(M(new THREE.CylinderGeometry(0.6,0.6,20,6),LAM(0x9aa4ad),0,40,0));
cristo.position.set(-460,42,235); scene.add(cristo);
// South bank buildings
for(let i=0;i<16;i++){const x=-700+i*95+Math.random()*20;const h=9+Math.random()*13;
 const b=M(new THREE.BoxGeometry(34,h,22),new THREE.MeshLambertMaterial({map:facDay[(i*2)%5]}),x,1+h/2,205); scene.add(b);
 const cap=M(new THREE.ConeGeometry(24,4,4),roofMat,x,1+h+2,205); cap.rotation.y=Math.PI/4; scene.add(cap);}

/* ---------- TERMINAL ---------- */
const terminal=new THREE.Group();
const termTex=canvasTex(512,128,(g,w,h)=>{const grd=g.createLinearGradient(0,0,0,h);grd.addColorStop(0,'#cfa76b');grd.addColorStop(1,'#b98e55');g.fillStyle=grd;g.fillRect(0,0,w,h);g.fillStyle='#26435e';for(let x=14;x<w;x+=42){g.beginPath();g.moveTo(x,58);g.lineTo(x+30,58);g.lineTo(x+30,102);g.lineTo(x,102);g.fill();}
g.fillStyle='#fff7e6';g.font='bold 34px Georgia';g.textAlign='center';g.fillText('T E R M I N A L   D E   C R U Z E I R O S',w/2,42);});

scene.add(terminal);

/* ---------- SHIP ---------- */
const ship=new THREE.Group(); scene.add(ship);
const L=300,W=38;
function hullGeo(){
 const st=64,pts=14,pos=[],idx=[];
 for(let i=0;i<=st;i++){const t=i/st;const x=(t-0.5)*L;
  let w;
  if(t>0.74){const q=(t-0.74)/0.26;w=W*0.5*Math.pow(Math.cos(q*Math.PI/2),0.5);}
  else if(t<0.14){w=W*0.5*(0.86+0.14*Math.sin(t/0.14*Math.PI/2));}
  else w=W*0.5;
  const bowRise=t>0.62?Math.pow((t-0.62)/0.38,2)*10:0;
  const deckY=11.5+(t>0.8?(t-0.8)/0.2*4.5:0);

function flyTo(name){const v=camViews[name];
 if(name==='river'){camTween=null;controls.autoRotate=false;return;}
 if(name==='deck'){camTween=null;controls.autoRotate=false;return;}
 camTween={p0:camera.position.clone(),t0:controls.target.clone(),p1:v.p.clone(),t1:v.t.clone(),k:0,dur:1.4};}
let currentCam='lookout';
/* walk mode */
const walk={on:false,yaw:0,pitch:0,vel:new THREE.Vector3(),keys:{}};
const spawn=new THREE.Object3D(); spawn.position.set(-30,2.6,-42); scene.add(spawn);
const walkCam={active:false};
renderer.domElement.addEventListener('pointerdown',()=>{ if(walk.on){renderer.domElement.requestPointerLock();} });
document.addEventListener('pointerlockchange',()=>{walk.on=document.pointerLockElement===renderer.domElement;
 document.getElementById('cross').style.display=walk.on?'block':'none';
 document.getElementById('walk').classList.toggle('on',walk.on);
 if(walk.on)controls.enabled=false; else controls.enabled=true;});
addEventListener('keydown',e=>walk.keys[e.code]=true); addEventListener('keyup',e=>walk.keys[e.code]=false);
document.addEventListener('mousemove',e=>{if(!walk.on)return; walk.yaw-=e.movementX*0.0023; walk.pitch=clamp(walk.pitch-e.movementY*0.0023,-1.2,1.2);});
/* audio horn */
let actx=null;
function horn(){try{actx=actx||new (window.AudioContext||window.webkitAudioContext)();
 const t=actx.currentTime; const out=actx.createGain(); out.gain.setValueAtTime(0,t); out.gain.linearRampToValueAtTime(0.35,t+0.25); out.gain.linearRampToValueAtTime(0.3,t+2.0); out.gain.exponentialRampToValueAtTime(0.001,t+2.6); out.connect(actx.destination);
 for(const f of [82,110,164]){const o=actx.createOscillator();o.type='sawtooth';o.frequency.value=f;const lp=actx.createBiquadFilter();lp.type='lowpass';lp.frequency.value=420;o.connect(lp);lp.connect(out);o.start(t);o.stop(t+2.7);}}catch(e){}}
/* departure */
let depart={state:'moored',t:0,dir:0};
const departBtn=document.getElementById('depart');
departBtn.addEventListener('click',()=>{ if(depart.state==='moored'||depart.state==='returning'){ if(depart.state==='moored'){depart.state='leaving';depart.dir=1;horn();} else {depart.state='returning';depart.dir=-1;} departBtn.textContent=depart.state==='leaving'?'▮ RETURN TO PORT':'▶ DEPARTURE'; }} else {depart.state='returning';depart.dir=-1;departBtn.textContent='▶ DEPARTURE';} });
document.getElementById('horns').addEventListener('click',horn);
function applyDeparture(t){
 // gangways
 const stow=sstep(0,0.16,t); gangways.forEach(g=>{g.rotation.x=-stow*1.35;});
 lines.forEach(l=>{l.material.opacity=(1-sstep(0,0.14,t))*0.9; l.visible=l.material.opacity>0.02;});
 // ship motion
 const rot=sstep(0.12,0.72,t);
 ship.rotation.y=rot*Math.PI;
 const drive=sstep(0.2,1,t);
 ship.position.x=-drive*900;
 ship.position.z=-5+sstep(0,0.35,t)*58;
 // tug: pushed alongside bow early, eased back later
 const push=sstep(0,0.4,t); const release=sstep(0.42,0.8,t);
 const bowOut=push*(1-release);
 tug.position.x=lerp(175,ship.position.x+225,bowOut); tug.position.z=lerp(20,58,bowOut); tug.rotation.y=lerp(Math.PI,Math.PI/2-rot*0.15,bowOut);
 if(t>0.6){tug.position.z=lerp(tug.position.z,24,0.01);}
}
applyDeparture(0);
/* ---------- UI ---------- */
document.querySelectorAll('[data-cam]').forEach(b=>b.addEventListener('click',()=>{
 document.querySelectorAll('[data-cam]').forEach(x=>x.classList.remove('on')); b.classList.add('on');
 currentCam=b.dataset.cam; flyTo(currentCam);
 controls.autoRotate=false;}));
document.getElementById('walk').addEventListener('click',()=>{ if(walk.on)document.exitPointerLock(); else renderer.domElement.requestPointerLock();});
document.getElementById('hideui').addEventListener('click',()=>{const u=document.getElementById('ui');u.style.display=u.style.display==='none'?'block':'none';});
document.getElementById('time').addEventListener('input',e=>{timeH=parseFloat(e.target.value);});
const playBtn=document.getElementById('play');
playBtn.addEventListener('click',()=>{playing=!playing;playBtn.textContent=playing?'PAUSE':'PLAY';playBtn.classList.toggle('on',playing);});
document.getElementById('wx').addEventListener('change',e=>setWeather(e.target.value));
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

/* ---------- loop ---------- */
const clock=new THREE.Clock(); let firstFrame=true;
function tick(){
 requestAnimationFrame(tick); const dt=Math.min(clock.getDelta(),0.05); const t=clock.elapsedTime;
 waterUni.uT.value=t;
 if(playing){timeH=(timeH+dt*0.05)%24; document.getElementById('time').value=timeH;}
 setTime(timeH);
 // departure
 if(depart.state==='leaving'||depart.state==='returning'){
  depart.t+=depart.dir*dt/90; 
  if(depart.state==='leaving'&&depart.t>=1){depart.t=1;depart.state='gone';departBtn.textContent='▶ DEPARTURE';departBtn.textContent='◀ RETURN TO PORT';}
  if(depart.state==='returning'&&depart.t<=0){depart.t=0;depart.state='moored';departBtn.textContent='▶ DEPARTURE';}
  applyDeparture(clamp(depart.t,0,1));
  if(depart.state==='leaving'&&depart.t>=1){departBtn.textContent='◀ RETURN TO PORT';}
 }
 // ferry motion
 ferries.forEach(f=>{f.t+=f.dir*dt*f.speed*1.6; if(f.t>1){f.t=1;f.dir=-1;} if(f.t<0){f.t=0;f.dir=1;}
  const z=lerp(f.path[1][1],f.path[0][1],f.t), x=f.path[1][0]+Math.sin(f.t*Math.PI*2)*0.1;
  f.o.position.set(f.x+ (x-f.path[1][0])*0,0.4,lerp(20,150,f.t)); f.o.rotation.y=Math.PI/2+(f.dir>0?0.04:Math.PI-0.04);
  f.o.rotation.y=(f.dir>0?Math.PI/2:-Math.PI/2);
  f.o.userData.wake.material.opacity=0.3+Math.sin(t*3)*0.08;});
 // tug gentle bob
 tug.position.y=0.4+Math.sin(t*1.3)*0.25; pilot.position.y=0.4+Math.sin(t*1.1+2)*0.25;
 pilot.rotation.y=0.6+Math.sin(t*0.3)*0.4;
 // sailboats drift
 sails.forEach((s,i)=>{s.position.x+=Math.sin(t*0.14+i*2.1)*dt*1.2; s.position.z+=Math.cos(t*0.1+i)*dt*0.8; s.rotation.y=Math.sin(t*0.2+i)*0.4+Math.PI/4;});
 // vehicles
 vehicles.forEach(v=>{v.x+=v.dir*v.v*dt; if(v.x>420)v.dir=-1; if(v.x<-420)v.dir=1; v.o.position.x=v.x; v.o.rotation.y=v.dir>0?0:Math.PI;});
 // pedestrians
 pedestrians.forEach((p,i)=>{p.t=(p.t+dt*p.speed*0.35)%1; const pos=pedPath(p.t,p.kind); const c=pedCols[i%pedCols.length];
  dummy.position.set(pos.x,pos.y+Math.abs(Math.sin(t*7+p.phase))*0.15,pos.z); dummy.rotation.set(0,p.phase,0); dummy.scale.set(1,1,1); dummy.updateMatrix(); pedMesh.setMatrixAt(i,dummy.matrix); pedMesh.setColorAt(i,new THREE.Color(c));});
 pedMesh.instanceMatrix.needsUpdate=true; if(pedMesh.instanceColor)pedMesh.instanceColor.needsUpdate=true;
 // gulls
 gulls.forEach(g=>{g.a+=dt*g.s*0.9; g.m.position.set(g.cx+Math.cos(g.a)*g.r,g.h+Math.sin(g.a*1.7)*5,g.cz+Math.sin(g.a)*g.r); g.m.rotation.y=-g.a+Math.PI/2; g.m.rotation.z=Math.sin(t*6+g.a)*0.35;});
 // tram
 tramLoop.t+=dt*0.02*tramLoop.dir; if(tramLoop.t>1){tramLoop.t=1;tramLoop.dir=-1;} if(tramLoop.t<0){tramLoop.t=0;tramLoop.dir=1;}
 {const tt=tramLoop.t; const x=-160+Math.sin(tt*Math.PI)*300*0.5+tt*260; const z=-140-tt*150; const y=hillH(z,x); tram.position.set(x,y+0.5,z); tram.rotation.y=Math.atan2(Math.cos(tt*Math.PI)*0.4,-1); tram.rotation.y=0.2;}
 // bridge cables pulse (subtle)
 radar.rotation.y+=dt*2;
 navLight.material.color.set(Math.sin(t*4)>0?0xff4444:0x551111);
 // rain
 if(rain){const p=rain.geometry.attributes.position; for(let i=0;i<p.count;i++){let y=p.getY(i)-dt*38; if(y<0)y=140; p.setY(i,y);} p.needsUpdate=true;}
 // tween + deck/river camera
 if(camTween){camTween.k+=dt/camTween.dur; const k=sstep(0,1,camTween.k);
  camera.position.lerpVectors(camTween.p0,camTween.p1,k); controls.target.lerpVectors(camTween.t0,camTween.t1,k);
  if(camTween.k>=1)camTween=null;}
 if(currentCam==='river'){const f=ferries[0]; camera.position.lerp(new THREE.Vector3(f.o.position.x+8,f.o.position.y+6.4,f.o.position.z-14),0.08); camera.lookAt(0,16,-12); controls.target.set(0,16,-12);}
 if(currentCam==='deck'){camera.position.lerp(new THREE.Vector3(ship.position.x-95*Math.cos(ship.rotation.y)+0*Math.sin(ship.rotation.y),ship.position.y+41,ship.position.z+0*0),0.18);
  camera.position.x=ship.position.x - Math.cos(ship.rotation.y)*95; camera.position.z=ship.position.z - Math.sin(ship.rotation.y)*95; camera.position.y=ship.position.y+41;
  controls.target.set(0,22,-300); camera.lookAt(controls.target);}
 // walk mode
 if(walk.on){const speed2=8*dt; let mv=0;
  const fwd=new THREE.Vector3(Math.sin(walk.yaw),0,Math.cos(walk.yaw));
  if(walk.keys.KeyW)mv+=1; if(walk.keys.KeyS)mv-=1;
  const right=new THREE.Vector3(-fwd.z,0,fwd.x); let rx=0; if(walk.keys.KeyD)rx+=1; if(walk.keys.KeyA)rx-=1;
  spawn.position.addScaledVector(fwd,-mv*speed2*-1); spawn.position.addScaledVector(right,rx*speed2);
  spawn.position.x=clamp(spawn.position.x,-400,400); spawn.position.z=clamp(spawn.position.z,-52,-34);
  const bob=Math.sin(t*8)*(mv||rx?0.12:0);
  camera.position.set(spawn.position.x,2.6+bob,spawn.position.z);
  camera.rotation.set(walk.pitch,walk.yaw,0,'YXZ');}
 if(walk.on){camera.rotation.order='YXZ';}else controls.update();
 renderer.render(scene,camera);
 if(firstFrame){firstFrame=false;const l=document.getElementById('loading');l.style.opacity='0';setTimeout(()=>l.style.display='none',900);}
}
setWeather('clear'); setTime(timeH);
flyTo('lookout'); currentCam='lookout'; setTimeout(()=>{controls.autoRotate=false;},8000);
tick();
</script>
</body>
</html>
