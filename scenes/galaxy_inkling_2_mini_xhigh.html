<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3D Galaxy Benchmark — Spaceship Voyage</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#02030a;font-family:'Segoe UI',system-ui,sans-serif;color:#dfe8ff}
  #app{position:fixed;inset:0}
  canvas{display:block}
  #hud{position:fixed;top:12px;left:12px;padding:10px 14px;background:rgba(8,12,28,.62);border:1px solid rgba(120,160,255,.25);border-radius:10px;backdrop-filter:blur(6px);pointer-events:none;min-width:230px}
  #hud .region{font-size:19px;font-weight:600;color:#9fd0ff;letter-spacing:.06em}
  #hud .row{font-size:12px;color:#b9c6e6;margin-top:3px;font-variant-numeric:tabular-nums}
  #hud .row b{color:#fff;font-weight:600}
  #minimap{position:fixed;bottom:12px;left:12px;width:170px;height:170px;border-radius:50%;border:1px solid rgba(120,160,255,.35);background:rgba(4,7,18,.66);backdrop-filter:blur(4px)}
  #controls{position:fixed;top:12px;right:12px;display:flex;flex-direction:column;gap:6px;background:rgba(8,12,28,.66);border:1px solid rgba(120,160,255,.25);border-radius:10px;padding:10px;backdrop-filter:blur(6px)}
  #controls button{background:rgba(60,90,180,.35);border:1px solid rgba(130,170,255,.35);color:#dfe8ff;padding:5px 10px;border-radius:6px;cursor:pointer;font-size:11px;letter-spacing:.04em;text-align:left}
  #controls button:hover{background:rgba(90,130,230,.5)}
  #controls button.active{background:rgba(90,160,255,.65);color:#fff}
  #controls input[type=range]{accent-color:#6ea8ff}
  #controls label{font-size:10px;color:#93a6d0;display:block;margin:4px 0 2px}
  #hint{position:fixed;bottom:14px;right:14px;font-size:11px;color:#8fa0c8;background:rgba(8,12,28,.55);padding:6px 10px;border-radius:8px;pointer-events:none}
  #loader{position:fixed;inset:0;background:#02030a;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;transition:opacity .8s}
  #loader .bar{width:220px;height:3px;background:rgba(120,160,255,.2);border-radius:2px;overflow:hidden}
  #loader .bar i{display:block;height:100%;width:40%;background:#6ea8ff;animation:load 1.1s infinite}
  @keyframes load{0%{transform:translateX(-100%)}100%{transform:translateX(350%)}}
  #err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:#0a0d1c;z-index:20;color:#ffb0b0;font-size:16px;text-align:center;padding:30px}
  #uiHidden #hud,#uiHidden #controls,#uiHidden #minimap,#uiHidden #hint{display:none}
</style>
</head>
<body>

<div id="err"><div><h2>WebGL unavailable</h2><p>This benchmark needs WebGL. Please use a modern browser.</p></div></div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {ShaderPass} from 'three/addons/postprocessing/ShaderPass.js';

const LY = 10; // units per light-year
const GAL_R = 500000; // galaxy radius in units (=50,000 ly)
const STAR_COUNT = 250000;

let renderer, scene, camera, composer, clock;
let galaxyMat, stars, dustLanes, nebSpriteGroup, nebGroup;
let ship, thrusters=[], navLights=[], engineLight;
let blackHole, accretion, routeLine;
let hyperGroup, hyperLines;
let mixPass;
let journey = { t:0, dur:170, playing:true, speed:1.0, route:null, path:null, segments:[] };
let systems = {};
let camMode = 'cinematic', hideUI=false;
let audio=null, audioOn=false, audioGain=null;
let minimapCtx, minimapTimer=0;
const _v = new THREE.Vector3(), _v2 = new THREE.Vector3(), _v3 = new THREE.Vector3();

try{ init(); }catch(e){ document.getElementById('err').style.display='flex'; console.error(e); }

function init(){
  const app = document.getElementById('app');
  renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.15;
  renderer.setClearColor(0x02030a);
  app.appendChild(renderer.domElement);

  scene = new THREE.Scene();
  scene.fog = null;
  camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.5, 4e6);
  clock = new THREE.Clock();

  buildGalaxy(); buildBlackHole(); buildNebula(); buildSystems();
  buildShip(); buildHyperdrive(); buildRoute(); buildRouteLine();

  scene.add(new THREE.AmbientLight(0x223044, 1.2));
  const sun = new THREE.DirectionalLight(0xfff2dd, 2.2); sun.position.set(1,0.6,0.4); scene.add(sun);

  // post
  composer = new EffectComposer(renderer);
  composer.addPass(new RenderPass(scene,camera));
  const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight), 0.85, 0.7, 0.72);
  composer.addPass(bloom);
  const Lensing = {
    uniforms:{ tDiffuse:{value:null}, uCenter:{value:new THREE.Vector2(-10,-10)}, uStrength:{value:0.35}, uRadius:{value:0.12}, uTime:{value:0} },
    vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      uniform sampler2D tDiffuse; uniform vec2 uCenter; uniform float uStrength,uRadius,uTime; varying vec2 vUv;
      void main(){
        vec2 d = uv-uCenter; float r=length(d);
        float s = uStrength*uRadius*uRadius/(r*r+0.0006);
        vec2 dir = (r>0.0001)? d/r : vec2(0.0);
        vec2 uv2 = uv + dir*s*0.35;
        uv2=clamp(uv2,0.0,1.0);
        vec4 c = texture2D(tDiffuse,uv2);
        float ring = smoothstep(uRadius*1.6,uRadius*1.1,r)*smoothstep(uRadius*0.35,uRadius*0.7,r);
        c.rgb += vec3(1.0,0.72,0.38)*ring*0.5;
        gl_FragColor = c;
      }`
  };
  mixPass = new ShaderPass(Lensing);
  composer.addPass(mixPass);

  minimapCtx = document.getElementById('minimap').getContext('2d');

  bindUI();
  resize();
  addEventListener('resize', resize);

  setTimeout(()=>{ document.getElementById('loader').style.opacity='0'; setTimeout(()=>document.getElementById('loader').style.display='none',900); }, 1200);
  animate();
}

/* ---------- procedural canvas textures ---------- */
function makeStarTexture(){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d'); const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.25,'rgba(255,255,255,.8)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  const t=new THREE.CanvasTexture(c); return t;
}
function makeNebulaTexture(){
  const c=document.createElement('canvas'); c.width=c.height=256;
  const g=c.getContext('2d');
  g.clearRect(0,0,256,256);
  for(let i=0;i<220;i++){
    const x=128+(Math.random()-0.5)*170, y=128+(Math.random()-0.5)*170;
    const r=4+Math.random()*34, a=0.03+Math.random()*0.07;
    const hue=Math.random();
    const col = hue<0.45? '150,80,220' : hue<0.75? '220,90,180' : '90,170,230';
    const gr=g.createRadialGradient(x,y,0,x,y,r);
    gr.addColorStop(0,`rgba(${col},${a})`); gr.addColorStop(1,`rgba(${col},0)`);
    g.fillStyle=gr; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
  }
  return new THREE.CanvasTexture(c);
}
function makePlanetTexture(base, cloud, ring){
  const c=document.createElement('canvas'); c.width=256; c.height=128;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,128); gr.addColorStop(0,base); gr.addColorStop(.5,cloud); gr.addColorStop(1,base);
  g.fillStyle=gr; g.fillRect(0,0,256,128);
  for(let i=0;i<160;i++){ // cloud streaks
    const y=Math.random()*128, w=20+Math.random()*70, h=2+Math.random()*6, x=Math.random()*256;
    g.fillStyle=`rgba(255,255,255,${0.04+Math.random()*0.12})`;
    g.beginPath(); g.ellipse(x,y,w,h,0,0,7); g.fill();
  }
  // bands
  for(let i=0;i<6;i++){ g.fillStyle=`rgba(0,0,0,${0.05+Math.random()*0.08})`; g.fillRect(0,Math.random()*128,256,3+Math.random()*8); }
  return new THREE.CanvasTexture(c);
}

/* ---------- galaxy ---------- */
function buildGalaxy(){
  const pos=new Float32Array(STAR_COUNT*3), col=new Float32Array(STAR_COUNT*3),
        size=new Float32Array(STAR_COUNT), bright=new Float32Array(STAR_COUNT),
        orbit=new Float32Array(STAR_COUNT);
  const ARMS=3, BAR_LEN=90000, OUTER=GAL_R, INNER=18000;
  function dustDim(r,a,armAng){ // inner-edge dust lane
    const armsRot = (r-INNER)/(OUTER-INNER)*2.4;
    const local = ((a - armAng - armsRot)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI;
    const lane = Math.exp(-Math.pow((local-0.5)/0.22,2)) * Math.exp(-Math.pow((r-INNER*1.6)/40000,2));
    return 1 - 0.72*lane;
  }
  function tempColor(t){ // t:0 cold(orange)..1 hot(blue)
    if(t<0.35){ const k=t/0.35; return [1.0, 0.62+0.25*k, 0.42+0.32*k]; }
    if(t<0.7){ const k=(t-0.35)/0.35; return [1.0, 0.87+0.1*k, 0.74+0.25*k]; }
    const k=(t-0.7)/0.3; return [0.78+0.2*k, 0.88+0.1*k, 1.0];
  }
  for(let i=0;i<STAR_COUNT;i++){
    const kind=Math.random();
    let r,a,y,t,br,sz;
    if(kind<0.52){ // spiral arms
      const arm=Math.floor(Math.random()*ARMS)*(Math.PI*2/ARMS);
      const tt=Math.pow(Math.random(),0.75);
      r=INNER+tt*(OUTER-INNER);
      const spread=1.15 - tt*0.7;
      a=arm + r/OUTER*2.4 + (Math.random()-0.5)*spread;
      y=(Math.random()-0.5)*(14000+tt*9000);
      t=0.55+Math.random()*0.45; br=0.7+Math.random()*0.9; sz=0.8+Math.random()*2.2;
      const d=dustDim(r,a,arm); br*=d;
    } else if(kind<0.64){ // bar
      const s=(Math.random()*2-1); r=Math.abs(s)*BAR_LEN; a=(Math.random()<0.5?0:Math.PI)+(Math.random()-0.5)*0.5;
      y=(Math.random()-0.5)*6000; t=0.15+Math.random()*0.35; br=0.5+Math.random()*0.5; sz=0.7+Math.random()*1.6;
    } else if(kind<0.82){ // disc
      r=INNER+Math.random()*(OUTER*0.95-INNER);
      a=Math.random()*Math.PI*2; y=(Math.random()-0.5)*7000*(1-r/OUTER*0.4);
      t=0.45+Math.random()*0.45; br=0.45+Math.random()*0.6; sz=0.7+Math.random()*1.5;
    } else if(kind<0.93){ // bulge
      const u=Math.random()*Math.PI*2, v=Math.acos(2*Math.random()-1);
      const rad=Math.pow(Math.random(),2.2)*38000;
      r=rad*Math.sin(v); a=u; y=rad*Math.cos(v)*0.55;
      t=0.02+Math.random()*0.25; br=0.6+Math.random()*0.7; sz=0.8+Math.random()*2.4;
    } else { // halo
      const u=Math.random()*Math.PI*2, v=Math.acos(2*Math.random()-1);
      const rad=90000+Math.random()*220000;
      r=rad*Math.sin(v); a=u; y=rad*Math.cos(v)*0.5;
      t=0.1+Math.random()*0.3; br=0.28+Math.random()*0.3; sz=0.6+Math.random()*1.2;
    }
    pos[i*3]=Math.cos(a)*r; pos[i*3+1]=y; pos[i*3+2]=Math.sin(a)*r;
    const c=tempColor(t);
    col[i*3]=c[0]; col[i*3+1]=c[1]; col[i*3+2]=c[2];
    size[i]=sz; bright[i]=br;
    orbit[i]=1/Math.pow(Math.max(r,15000)/15000,0.9);
  }
  const geo=new THREE.BufferGeometry();
  geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
  geo.setAttribute('aColor',new THREE.BufferAttribute(col,3));
  geo.setAttribute('aSize',new THREE.BufferAttribute(size,1));
  geo.setAttribute('aBright',new THREE.BufferAttribute(bright,1));
  geo.setAttribute('aOrbit',new THREE.BufferAttribute(orbit,1));
  galaxyMat=new THREE.ShaderMaterial({
    transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    uniforms:{uTime:{value:0}, uTex:{value:makeStarTexture()}},
    vertexShader:`
      attribute vec3 aColor; attribute float aSize,aBright,aOrbit;
      uniform float uTime; varying vec3 vC; varying float vB;
      void main(){
        vec3 p=position;
        float ang=uTime*0.0016*aOrbit;
        float cs=cos(ang), sn=sin(ang);
        p.xz=mat2(cs,-sn,sn,cs)*p.xz;
        vC=aColor; vB=aBright;
        vec4 mv=modelViewMatrix*vec4(p,1.0);
        gl_PointSize=aSize*(320000.0/(-mv.z));
        gl_PointSize=clamp(gl_PointSize,1.0,64.0);
        gl_Position=projectionMatrix*mv;
      }`,
    fragmentShader:`
      uniform sampler2D uTex; varying vec3 vC; varying float vB;
      void main(){
        vec4 t=texture2D(uTex,gl_PointCoord);
        gl_FragColor=vec4(vC*vB, t.a*vB);
      }`
  });
  stars=new THREE.Points(geo,galaxyMat); stars.frustumCulled=false; scene.add(stars);

  // H-II pink regions
  const n=900, hp=new Float32Array(n*3), hc=new Float32Array(n*3), hs=new Float32Array(n), hb=new Float32Array(n), ho=new Float32Array(n);
  for(let i=0;i<n;i++){
    const arm=Math.floor(Math.random()*ARMS)*(Math.PI*2/ARMS);
    const tt=Math.random(); const r=INNER+tt*(OUTER*0.92-INNER);
    const a=arm + r/OUTER*2.4 + (Math.random()-0.5)*0.6;
    const y=(Math.random()-0.5)*8000;
    hp[i*3]=Math.cos(a)*r; hp[i*3+1]=y; hp[i*3+2]=Math.sin(a)*r;
    hc[i*3]=1.0; hc[i*3+1]=0.32; hc[i*3+2]=0.72;
    hs[i]=1.1+Math.random()*2.6; hb[i]=0.9+Math.random()*1.1; ho[i]=1/Math.pow(Math.max(r,15000)/15000,0.9);
  }
  const hg=new THREE.BufferGeometry();
  hg.setAttribute('position',new THREE.BufferAttribute(hp,3));
  hg.setAttribute('aColor',new THREE.BufferAttribute(hc,3));
  hg.setAttribute('aSize',new THREE.BufferAttribute(hs,1));
  hg.setAttribute('aBright',new THREE.BufferAttribute(hb,1));
  hg.setAttribute('aOrbit',new THREE.BufferAttribute(ho,1));
  const hyp=new THREE.Points(hg,galaxyMat.clone());
  hyp.frustumCulled=false; scene.add(hyp);
}

function buildBlackHole(){
  const grp=new THREE.Group();
  const sphere=new THREE.Mesh(new THREE.SphereGeometry(4200,32,32), new THREE.MeshBasicMaterial({color:0x000000}));
  grp.add(sphere);
  const ringGeo=new THREE.RingGeometry(5200,17500,96,1);
  const ringMat=new THREE.ShaderMaterial({
    side:THREE.DoubleSide, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending,
    vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      uniform float uTime; varying vec2 vUv;
      void main(){
        float r=length(vUv-0.5)*2.0;
        float t=(r-0.3)/0.7;
        float glow=smoothstep(0.32,0.45,r)*smoothstep(1.0,0.5,r);
        float streak=0.75+0.25*sin(atan(vUv.y-0.5,vUv.x-0.5)*14.0+uTime*2.5);
        vec3 col=mix(vec3(1.0,0.55,0.15),vec3(1.0,0.9,0.6),smoothstep(0.4,0.7,r));
        gl_FragColor=vec4(col*glow*streak*1.6, glow);
      }`,
    uniforms:{uTime:{value:0}}
  });
  const ring=new THREE.Mesh(ringGeo,ringMat);
  ring.rotation.x=-Math.PI/2.35; ring.rotation.z=0.35;
  grp.add(ring);
  const halo=new THREE.Sprite(new THREE.SpriteMaterial({map:makeStarTexture(),color:0xffb066,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending,depthWrite:false}));
  halo.scale.set(26000,26000,1); grp.add(halo);
  scene.add(grp);
  blackHole=grp; accretion=ringMat;
}

function buildNebula(){
  nebGroup=new THREE.Group();
  const tex=makeNebulaTexture();
  // place a nebula near a segment of route
  const ang=0.8, dist=GAL_R*0.55;
  const cx=Math.cos(ang)*dist, cz=Math.sin(ang)*dist;
  for(let i=0;i<70;i++){
    const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,color:new THREE.Color().setHSL(0.72+Math.random()*0.3,0.7,0.6),transparent:true,opacity:0.16+Math.random()*0.2,blending:THREE.AdditiveBlending,depthWrite:false}));
    const rr=Math.pow(Math.random(),0.6)*38000;
    s.position.set(cx+(Math.random()-0.5)*rr,(Math.random()-0.5)*18000,cz+(Math.random()-0.5)*rr*0.6);
    const sc=22000+Math.random()*40000; s.scale.set(sc,sc*0.6,1);
    nebGroup.add(s);
  }
  scene.add(nebGroup);
  nebGroup.position.set(cx,0,cz); // children are relative? re-center:
  nebGroup.position.set(0,0,0);
}

/* ---------- planet systems (departure & arrival) ---------- */
function starAt(pos,scale,color){
  const grp=new THREE.Group(); grp.position.copy(pos);
  const sun=new THREE.Mesh(new THREE.SphereGeometry(scale,32,32), new THREE.MeshBasicMaterial({color:0xfff4d6}));
  grp.add(sun);
  const spr=new THREE.Sprite(new THREE.SpriteMaterial({map:makeStarTexture(),color:color,transparent:true,opacity:0.95,blending:THREE.AdditiveBlending,depthWrite:false}));
  spr.scale.set(scale*10,scale*10,1); grp.add(spr);
  const light=new THREE.PointLight(0xffeecc, 2.2, scale*400, 1.4); grp.add(light);
  scene.add(grp); return grp;
}
function planetAt(sys, radius, dist, colorHex, texBase, texCloud, size, opts={}){
  const tex=makePlanetTexture(texBase,texCloud);
  const mat=new THREE.MeshStandardMaterial({map:tex,roughness:0.85,metalness:0.05,emissive:opts.emissive||0x000000});
  const p=new THREE.Mesh(new THREE.SphereGeometry(size,48,48),mat);
  p.position.set(Math.random()*2-1,0.3+Math.random()*0.5,Math.random()*2-1).normalize().multiplyScalar(dist);
  sys.add(p);
  if(opts.moon){
    const moon=new THREE.Mesh(new THREE.SphereGeometry(size*0.32,24,24),new THREE.MeshStandardMaterial({color:0x9aa0ad,roughness:1}));
    moon.position.set(size*2.6,0.2,0); p.add(moon);
  }
  if(opts.clouds){
    const cl=new THREE.Mesh(new THREE.SphereGeometry(size*1.035,48,48),new THREE.MeshStandardMaterial({color:0xffffff,transparent:true,opacity:0.35,roughness:1}));
    p.add(cl);
  }
  if(opts.atmosphere){
    const at=new THREE.Mesh(new THREE.SphereGeometry(size*1.28,48,48),new THREE.ShaderMaterial({
      transparent:true, side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false,
      vertexShader:`varying float vI; void main(){ vI=dot(normalize(position),vec3(0,0,1.0)); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
      fragmentShader:`varying float vI; uniform vec3 c; void main(){ float i=pow(0.9-vI*0.4,2.0); gl_FragColor=vec4(c*i,i);}`,
      uniforms:{c:{value:new THREE.Color(opts.atmosphere)}}
    }));
    p.add(at);
  }
  if(opts.ring){
    const rm=new THREE.MeshStandardMaterial({color:opts.ring,roughness:0.6,metalness:0.2,transparent:true,opacity:0.9,side:THREE.DoubleSide});
    const ring=new THREE.Mesh(new THREE.RingGeometry(size*1.4,size*2.3,80,1),rm);
    ring.rotation.x=Math.PI/2.15; p.add(ring);
  }
  return p;
}
function buildSystems(){
  const R=GAL_R*0.62;
  const depAng=2.35, depPos=new THREE.Vector3(Math.cos(depAng)*R, 6000, Math.sin(depAng)*R);
  const dep=starAt(depPos,5200,0xffd9a0);
  planetAt(dep,0,16000,0x3fa06a,'#1c4f7a','#7fc3e8',4200,{clouds:true,atmosphere:0x5ec8ff,moon:true});
  const arrAng=0.35, arrPos=new THREE.Vector3(Math.cos(arrAng)*R*1.35,-4000,Math.sin(arrAng)*R*1.35);
  const arr=starAt(arrPos,4200,0xbfe0ff);
  planetAt(arr,0,19000,0xd9a06a,'#c46a3a','#f0d8a0',4600,{ring:0xe8d6a8});
  systems={departure:dep,arrival:arr};
  systems.departure.position.copy(depPos); systems.arrival.position.copy(arrPos);
  systems.depPos=depPos.clone(); systems.arrPos=arrPos.clone();
}

/* ---------- ship ---------- */
function buildShip(){
  ship=new THREE.Group();
  const hullMat=new THREE.MeshStandardMaterial({color:0xb8c2d4,roughness:0.42,metalness:0.72});
  const darkMat=new THREE.MeshStandardMaterial({color:0x2a3350,roughness:0.5,metalness:0.8});
  const accent=new THREE.MeshStandardMaterial({color:0xffaa33,roughness:0.4,metalness:0.6,emissive:0x co?0:0x000000});
  const accent2=new THREE.MeshStandardMaterial({color:0xffaa33,roughness:0.4,metalness:0.6,emissive:0x441e00});

  // main hull: capsule-ish via LatheGeometry
  const pts=[];
  for(let i=0;i<=14;i++){ const t=i/14; const r=Math.sin(Math.PI*Math.pow(t,0.8))*1.9*(1-t*0.35)+0.05; pts.push(new THREE.Vector2(r, (t-0.5)*9)); }
  const hull=new THREE.Mesh(new THREE.LatheGeometry(pts,24),hullMat);
  hull.rotation.x=Math.PI/2; ship.add(hull);

  // nose cone
  const nose=new THREE.Mesh(new THREE.ConeGeometry(0.62,2.6,20),darkMat); nose.position.z=5.6; nose.rotation.x=Math.PI/2; ship.add(nose);
  // spine
  const spine=new THREE.Mesh(new THREE.BoxGeometry(0.7,0.55,6.4),darkMat); spine.position.y=1.15; ship.add(spine);
  const spineFin=new THREE.Mesh(new THREE.BoxGeometry(0.18,1.7,2.4),accent2); spineFin.position.set(0,2.1,-1.6); ship.add(spineFin);

  // cockpit canopy
  const canopy=new THREE.Mesh(new THREE.SphereGeometry(0.85,20,20),new THREE.MeshStandardMaterial({color:0x0d1a2e,roughness:0.08,metalness:0.9,emissive:0x1c4a7a,emissiveIntensity:0.9}));
  canopy.scale.set(0.72,0.55,1.5); canopy.position.set(0,1.35,2.4); ship.add(canopy);

  // wing / side panels
  const wingGeo=new THREE.BoxGeometry(5.6,0.22,2.3);
  const wingL=new THREE.Mesh(wingGeo,hullMat); wingL.position.set(-2.9,0,-0.6); wingL.rotation.z=0.12; ship.add(wingL);
  const wingR=wingL.clone(); wingR.position.x=2.9; wingR.rotation.z=-0.12; ship.add(wingR);
  const tipGeo=new THREE.BoxGeometry(0.16,0.9,1.7);
  const tipL=new THREE.Mesh(tipGeo,accent2); tipL.position.set(-5.6,0.4,-1.1); ship.add(tipL);
  const tipR=tipL.clone(); tipR.position.x=5.6; ship.add(tipR);

  // engine nacelles
  [-2.2,2.2].forEach(x=>{
    const nacelle=new THREE.Mesh(new THREE.CylinderGeometry(0.62,0.78,3.4,18),darkMat);
    nacelle.rotation.x=Math.PI/2; nacelle.position.set(x,0.1,-3.6); ship.add(nacelle);
    const lip=new THREE.Mesh(new THREE.TorusGeometry(0.62,0.12,10,20),accent2);
    lip.position.set(x,0.1,-5.25); ship.add(lip);
    const plume=new THREE.Mesh(new THREE.ConeGeometry(0.55,3.2,16,1,true),new THREE.MeshBasicMaterial({color:0x66ccff,transparent:true,opacity:0.75,blending:THREE.AdditiveBlending,depthWrite:false,side:THREE.DoubleSide}));
    plume.rotation.x=-Math.PI/2; plume.position.set(x,0.1,-6.9); ship.add(plume);
    thrusters.push(plume);
  });

  // sensor mast + antennae
  const mast=new THREE.Mesh(new THREE.CylinderGeometry(0.05,0.05,1.6,6),darkMat); mast.position.set(0,1.7,-2.4); ship.add(mast);
  const dish=new THREE.Mesh(new THREE.SphereGeometry(0.55,12,12,0,Math.PI*2,0,Math.PI/2),hullMat);
  dish.position.set(0,2.7,-2.4); dish.rotation.x=Math.PI*0.75; ship.add(dish);

  // nav lights: red port(left), green starboard, white strobe
  function light(x,y,z,color,size){
    const m=new THREE.Mesh(new THREE.SphereGeometry(size,8,8),new THREE.MeshBasicMaterial({color}));
    m.position.set(x,y,z); ship.add(m); navLights.push(m); return m;
  }
  light(-5.7,0.45,-1.1,0xff2222,0.22); light(5.7,0.45,-1.1,0x22ff44,0.22); light(0,2.3,-3.4,0xffffff,0.18);
  engineLight=new THREE.PointLight(0x66bbff,3.5,60,1.6); engineLight.position.set(0,0.3,-6.2); ship.add(engineLight);

  ship.scale.setScalar(1.4);
  scene.add(ship);
}

/* ---------- hyperdrive streaks ---------- */
function buildHyperdrive(){
  hyperGroup=new THREE.Group();
  const N=260; const pos=new Float32Array(N*6);
  for(let i=0;i<N;i++){
    const a=Math.random()*Math.PI*2, rr=4+Math.random()*30;
    const x=Math.cos(a)*rr, y=Math.sin(a)*rr, z=-Math.random()*300+30;
    const len=20+Math.random()*70;
    pos[i*6]=x; pos[i*6+1]=y; pos[i*6+2]=z; pos[i*6+3]=x; pos[i*6+4]=y; pos[i*6+5]=z-len;
  }
  const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  const m=new THREE.LineBasicMaterial({color:0x9fd8ff,transparent:true,opacity:0.85,blending:THREE.AdditiveBlending});
  hyperLines=new THREE.LineSegments(g,m); hyperLines.frustumCulled=false;
  hyperGroup.add(hyperLines);
  const tunnel=new THREE.Mesh(new THREE.ConeGeometry(60,260,48,1,true),new THREE.ShaderMaterial({
    transparent:true, side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false,
    uniforms:{uTime:{value:0}},
    vertexShader:`varying vec2 vUv; void main(){vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform float uTime; varying vec2 vUv;
      void main(){ float w=0.5+0.5*sin(vUv.x*44.0+uTime*30.0); float f=smoothstep(0.0,0.25,vUv.y)*smoothstep(1.0,0.7,vUv.y);
      gl_FragColor=vec4(vec3(0.35,0.62,1.0)*w*f, w*f*0.5); }`
  }));
  tunnel.rotation.x=Math.PI/2; tunnel.position.z=-130; hyperGroup.add(tunnel);
  hyperGroup.visible=false;
  scene.add(hyperGroup);
  hyperGroup.userData.tunnel=tunnel;
}

/* ---------- journey route ---------- */
const REGION_NAMES=[
  {end:0.14,n:'Departure · Aurelia System'},
  {end:0.34,n:'Outbound · Orion Spur'},
  {end:0.58,n:'Hyperdrive'},
  {end:0.74,n:'Galactic Core'},
  {end:0.88,n:'Nebula · Cygnus Rift'},
  {end:1.01,n:'Arrival · Vega System'}
];
function buildRoute(destPos){
  const dep=systems.depPos.clone(), arr=(destPos||systems.arrPos).clone();
  const start=dep.clone();
  const dir=_v.copy(arr).sub(start);
  const len=dir.length();
  const perp=new THREE.Vector3(-dir.z,0,dir.x).normalize();
  const mid1=_v2.copy(start).lerp(arr,0.32).add(perp.clone().multiplyScalar(len*0.10)).add(new THREE.Vector3(0,len*0.06,0));
  const mid2=new THREE.Vector3().copy(start).lerp(arr,0.68).sub(perp.clone().multiplyScalar(len*0.08)).add(new THREE.Vector3(0,len*0.03,0));
  // ensure core pass: route near centre
  const core=new THREE.Vector3(Math.cos(0.8)*26000,12000,Math.sin(0.8)*26000);
  const pts=[
    start.clone(),
    start.clone().lerp(arr,0.10).add(new THREE.Vector3(0,18000,0)),
    start.clone().lerp(arr,0.24).add(new THREE.Vector3(0,42000,0)),
    start.clone().lerp(arr,0.42),
    core.clone(),
    start.clone().lerp(arr,0.62),
    new THREE.Vector3(12000,-9000,-90000*0.75),
    start.clone().lerp(arr,0.86).add(new THREE.Vector3(0,6000,0)),
    arr.clone().add(new THREE.Vector3(0,9000,0)),
    arr.clone().add(new THREE.Vector3(1400,2500,1800))
  ];
  journey.path=new THREE.CatmullRomCurve3(pts,false,'catmullrom',0.35);
  journey.parts=[]; let prev=0;
  const N=400; let total=0; const lenAt=[];
  for(let i=1;i<=N;i++){ const p=journey.path.getPoint(i/N), q=journey.path.getPoint((i-1)/N); const l=p.distanceTo(q); lenAt.push(l); total+=l; }
  journey.totalLen=total;
}
function buildRouteLine(){
  const g=new THREE.BufferGeometry();
  const line=new THREE.Line(g,new THREE.LineBasicMaterial({color:0x6ea8ff,transparent:true,opacity:0.45}));
  line.frustumCulled=false; scene.add(line); routeLine=line; updateRouteLine();
}
function updateRouteLine(){
  const pts=journey.path.getSpacedPoints(220);
  routeLine.geometry.dispose();
  routeLine.geometry=new THREE.BufferGeometry().setFromPoints(pts);
}

/* ---------- camera & update ---------- */
function updateShip(dt, t){
  const j=journey;
  const p=j.path.getPoint(j.t);
  const ahead=j.path.getPoint(Math.min(j.t+0.012,1));
  const dir=_v.copy(ahead).sub(p).normalize();
  ship.position.copy(p);
  _v2.copy(ship.position).add(dir);
  ship.lookAt(_v2);
  const phase=phaseAt(j.t);
  // throttle visuals
  const thr = phase.hyper? 2.6 : phase.core?0.6:1.0;
  thrusters.forEach((pl,i)=>{ pl.scale.set(1, 1+Math.sin(t*30+i)*0.25, thr*(1+Math.random()*0.15)); pl.material.opacity = phase.hyper?0.95:0.6+Math.random()*0.2; });
  engineLight.intensity=phase.hyper?26:4+Math.sin(t*22)*1.2;
  ship.position.y += Math.sin(t*1.7)*6; // subtle bob (scaled)

  // hyperdrive
  hyperGroup.visible=phase.hyper;
  if(phase.hyper){
    hyperGroup.position.copy(ship.position); hyperGroup.quaternion.copy(ship.quaternion);
    const posAttr=hyperLines.geometry.getAttribute('position');
    const arr=posAttr.array;
    for(let i=0;i<posAttr.count/2;i++){
      // move streaks toward camera along local z (negative), wrap
      let z=arr[i*6+2]; z+=280; if(z>30){ z-=300; }
      arr[i*6+2]=z; arr[i*6+5]=z- (20+((i*37)%70));
    }
    posAttr.needsUpdate=true;
    hyperGroup.userData.tunnel.material.uniforms.uTime.value=t;
  }
  return phase;
}
function phaseAt(t){
  const s=t;
  const hyper = s>0.33 && s<0.56;
  const core = s>=0.56 && s<0.72;
  const region=REGION_NAMES.find(r=>s<r.end).n;
  return {hyper, core, region};
}
function updateCamera(dt, phase){
  const j=journey;
  if(camMode==='galmap'){
    const R=GAL_R*1.05;
    const ang=tGlobal*0.03;
    camera.position.set(Math.cos(ang)*R, R*0.42, Math.sin(ang)*R);
    camera.lookAt(0,0,0);
    camera.fov+= (55-camera.fov)*0.05; camera.updateProjectionMatrix();
    return;
  }
  const target=_v.copy(ship.position);
  const shipQ=ship.quaternion;
  if(camMode==='cockpit'){
    _v2.set(0,1.35,2.2).applyQuaternion(shipQ).add(ship.position);
    camera.position.copy(_v2);
    _v3.set(0,0,10).applyQuaternion(shipQ).add(ship.position);
    camera.lookAt(_v3);
    camera.fov+= (75-camera.fov)*0.06;
  } else {
    const back = phase.hyper? 30 : camMode==='chase'?26:42;
    const up = phase.hyper? 10 : camMode==='chase'?9:17;
    _v2.set(0,up,back).applyQuaternion(shipQ).add(ship.position);
    camera.position.lerp(_v2, 1-Math.pow(0.0018,dt));
    _v3.set(0,0,28).applyQuaternion(shipQ).add(ship.position);
    camera.lookAt(_v3);
    const targetFov = phase.hyper? 92 : camMode==='cinematic'? 62 : 66;
    camera.fov+= (targetFov-camera.fov)*0.045;
  }
  camera.updateProjectionMatrix();
  // lensing center
  const sp=_v.copy(blackHole.position).project(camera);
  if(sp.z<1){
    mixPass.uniforms.uCenter.value.set(sp.x*0.5+0.5, sp.y*0.5+0.5);
    mixPass.uniforms.uStrength.value = 0.5;
  } else mixPass.uniforms.uCenter.value.set(-10,-10);
  mixPass.uniforms.uTime.value=tGlobal;
}

let tGlobal=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  tGlobal+=dt;
  const j=journey;
  if(j.playing){
    j.t+=dt*j.speed/j.dur;
    if(j.t>=1){ j.t=0; /* loop: regenerate new route */ buildRoute(pickNewDest()); updateRouteLine(); }
  }
  updateShip(dt,tGlobal);
  const phase=phaseAt(j.t);
  updateCamera(dt,phase);
  galaxyMat.uniforms.uTime.value=tGlobal;
  scene.children.forEach(o=>{ if(o.material&&o.material.uniforms&&o.material.uniforms.uTime&&o.isInstancedMesh===false&&o.geometry&&o.geometry.type==='RingGeometry') o.material.uniforms.uTime.value=tGlobal; });
  if(accretion) accretion.uniforms.uTime.value=tGlobal;
  // blink nav lights
  const blink=Math.sin(tGlobal*6)>0.55;
  navLights[2].material.color.setHex(blink?0xffffff:0x333333);
  navLights[0].material.color.setHex(Math.sin(tGlobal*2)>0?0xff2222:0x550000);
  navLights[1].material.color.setHex(Math.sin(tGlobal*2)>0?0x22ff44:0x003300);

  updateHUD(phase);
  minimapTimer+=dt; if(minimapTimer>0.12){ minimapTimer=0; drawMinimap(phase); }
  composer.render();
}

function pickNewDest(){
  const a=Math.random()*Math.PI*2;
  const r=GAL_R*(0.5+Math.random()*0.5);
  // keep a sensible arrival position
  return new THREE.Vector3(Math.cos(a)*r,(Math.random()-0.5)*12000,Math.sin(a)*r);
}

function updateHUD(phase){
  const distLy=Math.sqrt(ship.position.x*ship.position.x+ship.position.z*ship.position.z)/LY;
  let speed;
  if(phase.hyper) speed=(120+Math.sin(tGlobal*3)*60).toFixed(0)+' × c';
  else speed=(0.12+0.06*Math.sin(tGlobal*0.8)).toFixed(2)+'c';
  const remaining=(1-journey.t)*journey.totalLen/LY;
  const etaSec=remaining/(phase.hyper? 3000 : 300);
  document.getElementById('region').textContent=phase.region;
  document.getElementById('dist').textContent=distLy.toLocaleString(undefined,{maximumFractionDigits:0});
  document.getElementById('speed').textContent=speed;
  document.getElementById('eta').textContent='T-'+(etaSec/60).toFixed(1)+' min';
}

function drawMinimap(phase){
  const c=minimapCtx, W=340; c.clearRect(0,0,W,W);
  const cx=W/2, cy=W/2, R=W/2-12;
  // disc
  c.save(); c.translate(cx,cy); c.rotate(0.35);
  c.fillStyle='rgba(90,110,180,0.18)';
  c.beginPath(); c.ellipse(0,0,R,R*0.42,0,0,7); c.fill();
  c.strokeStyle='rgba(150,180,255,0.25)'; c.lineWidth=1; c.stroke();
  c.restore();
  // core
  c.fillStyle='rgba(255,200,120,0.9)'; c.beginPath(); c.arc(cx,cy,4,0,7); c.fill();
  // route
  const s2=v=>([cx+v.x/GAL_R*R, cy+v.z/GAL_R*R]);
  c.strokeStyle='rgba(140,190,255,0.85)'; c.lineWidth=2; c.setLineDash([5,4]);
  c.beginPath();
  for(let i=0;i<=60;i++){ const p=journey.path.getPoint(i/60); const [x,y]=s2(p); i?c.lineTo(x,y):c.moveTo(x,y); }
  c.stroke(); c.setLineDash([]);
  // start/end
  const [ex,ey]=s2(systems.arrPos); c.strokeStyle='#8ef0b0'; c.beginPath(); c.arc(ex,ey,5,0,7); c.stroke();
  // ship
  const [sx,sy]=s2(ship.position);
  c.fillStyle='#ffffff'; c.beginPath(); c.arc(sx,sy,4,0,7); c.fill();
  c.strokeStyle='rgba(255,255,255,.4)'; c.beginPath(); c.arc(sx,sy,8,0,7); c.stroke();
}

/* ---------- UI ---------- */
function bindUI(){
  document.querySelectorAll('[data-cam]').forEach(b=>b.addEventListener('click',()=>{
    camMode=b.dataset.cam;
    document.querySelectorAll('[data-cam]').forEach(x=>x.classList.toggle('active',x===b));
  }));
  const speedCtl=document.getElementById('speedCtl');
  speedCtl.addEventListener('input',e=>{ journey.speed=parseFloat(e.target.value); document.getElementById('spdVal').textContent=journey.speed.toFixed(2).replace(/\.?0+$/,'')+'×'; });
  document.getElementById('speedCtl').addEventListener('input',()=>{ document.getElementById('spdVal').textContent=journey.speed.toFixed(2).replace(/0+$/,'').replace(/\.$/,'')+'×'; });
  const pause=document.getElementById('pauseBtn');
  pause.addEventListener('change',()=>{ journey.playing=!pause.checked; });
  document.getElementById('muteBtn').addEventListener('click',()=>{ toggleAudio(); });
  document.getElementById('hideBtn').addEventListener('click',()=>{
    hideUI=!hideUI; document.body.classList.toggle('uiHidden',hideUI);
    document.getElementById('hideBtn').textContent=hideUI?'Show UI':'Hide UI';
  });
  // click on galaxy map sets destination
  renderer.domElement.addEventListener('pointerdown',e=>{
    ensureAudio();
    if(camMode!=='map' && camMode!=='galmap'){}
    if(camMode!=='map') return;
    // map click: project through camera
    const ndc=new THREE.Vector2((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
    const ray=new THREE.Raycaster(); ray.setFromCamera(ndc,camera);
    const t=ray.ray.intersectPlane(new THREE.Plane(new THREE.Vector3(0,1,0),0),_v);
    if(t){
      _v.y=0;
      const l=Math.hypot(_v.x,_v.z);
      if(l>10000 && l<GAL_R*1.3){
        buildRoute(_v.clone()); updateRouteLine(); journey.t=0;
      }
    }
  });
  addEventListener('pointerdown',ensureAudio,{once:true});
}
function toggleAudio(){
  audioOn=!audioOn;
  if(audioOn){ ensureAudio(); }
  if(audioGain) audioGain.gain.linearRampToValueAtTime(audioOn?0.09:0.0, audio.context.currentTime+0.4);
  document.getElementById('muteBtn').textContent=audioOn?'🔊 Hum (on)':'🔇 Hum (off)';
}
function ensureAudio(){
  if(audio) { if(audio.context.state==='suspended') audio.context.resume(); return; }
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const gain=ctx.createGain(); gain.gain.value=0.0; gain.connect(ctx.destination);
    const o1=ctx.createOscillator(); o1.type='sawtooth'; o1.frequency.value=42;
    const o2=ctx.createOscillator(); o2.type='sine'; o2.frequency.value=84;
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=220; f.Q.value=2;
    o1.connect(f); o2.connect(f); f.connect(gain);
    o1.start(); o2.start();
    audio={context:ctx}; audioGain=gain;
  }catch(e){ audio=null; }
}

function resize(){
  camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
}
