      opacity: 0;

      text-transform: uppercase;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    }
    .section {
      border-top: 1px solid rgba(255,255,255,0.1);

    .label {

      display: flex;

      text-transform: uppercase;
      color: #dbe6ec;

    }
    @media (max-width: 620px) {
      #ui { left: 10px; bottom: 10px; width: calc(100vw - 20px); padding: 10px; }
      #uiToggle { right: 10px; top: 10px; }
      .grid { grid-template-columns: 1fr 1fr; }
    }

  <div id="loading">

  <div id="ui">

    <div class="section" style="border-top:0;padding-top:0;margin-top:0;">

      <div class="row" style="margin-top:2px;">
        <button id="playBtn">PAUSE</button>

      </div>
    </div>

    <div class="section">

      <button id="departBtn" class="wide danger">DEPARTURE</button>

  <button id="uiToggle">HIDE UI</button>
  <div id="crosshair"></div>
  <div id="walkHint">WASD · mouse look · ESC to exit</div>

  <script>
    setTimeout(function () {
      if (!window.__lisbonStarted) {
        var l = document.getElementById("loading");
        if (l && !l.classList.contains("hide")) {
          l.innerHTML = '<h1>Unable to start 3D</h1><p>The WebGL scene did not initialise. Check that WebGL is enabled and the Three.js CDN is reachable.</p>';
        }
      }
    }, 15000);
  </script>

  <script type="module">
    import * as THREE from "three";
    import { OrbitControls } from "three/addons/controls/OrbitControls.js";
    import { Water } from "three/addons/objects/Water.js";

    window.__lisbonStarted = true;

    let renderer, scene, camera, controls, clock;
    let water, skyMesh, stars, rainPoints;
    let sunLight, moonLight, hemiLight, ambientLight;
    let shipRoot, cabinWindows, cabinLit = [], shipDeckLights;
    let bridgeWindowMat = null;
    let mooringLineGroup, mooringLineMat, gangways = [];
    let tug, pilotBoat, ferries = [], sailboats = [], seagulls = [];
    let passengers = null, passengerRoutes = [], passengerData = [];
    let vehicles = [], forkliftGroup = null;
    let tram = null, tramCurve = null, radarGroups = [];
    let cityWindowPoints = null, cityWindowMaterial = null;
    let bridgeDeckLights = null;
    let nightGlowMaterials = [], basicNightParts = [];
    let currentPreset = "river";
    let timeOfDay = 18.3;
    let timePlaying = true;
    let weather = "clear";
    let nightFactor = 0;
    let lastCabinNight = -1;
    let shipProgress = 0;
    let shipTarget = 0;
    let shipAnimating = false;
    let walkMode = false;
    let yaw = Math.PI;
    let pitch = -0.04;

    let draggingLook = false;
    let cameraTransition = null;
    let sunDir = new THREE.Vector3();
    let rainData = null;
    let audioCtx = null;
    let elapsedTotal = 0;

    const tmpObject = new THREE.Object3D();
    const tmpVecA = new THREE.Vector3();
    const tmpVecB = new THREE.Vector3();
    const tmpColor = new THREE.Color();

    const PALETTE_HOUSES = [
      0xf1e6d8, 0xe7d5bc, 0xf2d7a3, 0xd8a08d, 0xa6c3d7,
      0xe8e3d9, 0xd4c0df, 0xc6ddc4, 0xf0c9b7, 0xffffff
    ];

    const PRESETS = {
      miradouro: {
        pos: new THREE.Vector3(92, 128, -438),
        target: new THREE.Vector3(-8, 22, -18)
      },
      waterfront: {
        pos: new THREE.Vector3(82, 4.1, -63),
        target: new THREE.Vector3(-26, 26, -22)
      },
      aerial: {
        pos: new THREE.Vector3(315, 275, 300),
        target: new THREE.Vector3(0, 24, -42)
      },
      river: {
        pos: new THREE.Vector3(238, 38, 236),
        target: new THREE.Vector3(0, 26, -28)
      },
      deck: {
        pos: new THREE.Vector3(5, 63.5, -24),
        target: new THREE.Vector3(-260, 39, -235)
      }
    };

    const SKY_NIGHT_TOP = new THREE.Color(0x030812);
    const SKY_NIGHT_BOTTOM = new THREE.Color(0x0a1728);
    const SKY_DAY_TOP = new THREE.Color(0x5186b9);
    const SKY_DAY_BOTTOM = new THREE.Color(0xd7e6ef);
    const SKY_GOLD_TOP = new THREE.Color(0x3f5f87);
    const SKY_GOLD_BOTTOM = new THREE.Color(0xf4a45f);
    const FOG_NIGHT = new THREE.Color(0x07111c);
    const FOG_DAY = new THREE.Color(0xc7d7dd);
    const FOG_GOLD = new THREE.Color(0xd9a678);
    const WATER_NIGHT = new THREE.Color(0x06121e);
    const WATER_DAY = new THREE.Color(0x2f728c);
    const WATER_GOLD = new THREE.Color(0x3b6674);
    const SUN_WHITE = new THREE.Color(0xfff4dd);
    const SUN_WARM = new THREE.Color(0xffb56c);

    function clamp(v, a, b) { return Math.max(a, Math.min(b, v)); }
    function smoothstep(a, b, x) {
      const t = clamp((x - a) / (b - a), 0, 1);
      return t * t * (3 - 2 * t);
    }
    function easeInOut(t) { return t * t * (3 - 2 * t); }

    let seed = 18374021;
    function rand() {
      seed = (seed * 1664525 + 1013904223) >>> 0;
      return seed / 4294967296;
    }
    function randRange(a, b) { return a + (b - a) * rand(); }

    function terrainHeight(x, z) {
      if (z > -100) return 2.0;
      if (x > -470 && x < -235 && z > -242 && z < -92) return 2.25;
      const d = Math.max(0, -z - 100);
      let h = 2.2 + Math.min(68, d * 0.108);
      h += 50 * Math.exp(-Math.pow((x - 152) / 155, 2) - Math.pow((z + 365) / 155, 2));
      h += 21 * Math.exp(-Math.pow((x + 275) / 215, 2) - Math.pow((z + 300) / 175, 2));
      h += 13 * Math.exp(-Math.pow((x - 58) / 95, 2) - Math.pow((z + 225) / 115, 2));
      h += Math.sin(x * 0.021) * Math.sin(z * 0.018) * 3.4;
      return h;
    }

    function southBankHeight(x, z) {
      let h = 2 + Math.max(0, (z - 610)) * 0.018;
      h += 34 * Math.exp(-Math.pow((x + 525) / 190, 2) - Math.pow((z - 665) / 120, 2));
      h += 18 * Math.exp(-Math.pow((x - 210) / 260, 2) - Math.pow((z - 735) / 140, 2));
      h += Math.sin(x * 0.012) * Math.cos(z * 0.016) * 2.2;
      return h;
    }

    function canvasTexture(w, h, draw) {
      const canvas = document.createElement("canvas");
      canvas.width = w;
      canvas.height = h;
      const ctx = canvas.getContext("2d");
      draw(ctx, w, h);
      const tex = new THREE.CanvasTexture(canvas);
      tex.colorSpace = THREE.SRGBColorSpace;
      tex.anisotropy = Math.min(8, renderer.capabilities.getMaxAnisotropy());
      return tex;
    }

    function makeGlowTexture() {
      return canvasTexture(128, 128, (ctx, w, h) => {
        const g = ctx.createRadialGradient(w * 0.5, h * 0.5, 1, w * 0.5, h * 0.5, w * 0.5);
        g.addColorStop(0, "rgba(255,255,255,1)");
        g.addColorStop(0.18, "rgba(255,245,215,0.92)");
        g.addColorStop(0.5, "rgba(255,220,160,0.28)");
        g.addColorStop(1, "rgba(255,190,100,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      });
    }

    function makeStarTexture() {
      return canvasTexture(64, 64, (ctx, w, h) => {
        const g = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
        g.addColorStop(0, "rgba(255,255,255,1)");
        g.addColorStop(0.15, "rgba(200,225,255,0.85)");
        g.addColorStop(0.55, "rgba(130,170,255,0.16)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, w, h);
      });
    }

    function makePavingTexture() {
      const tex = canvasTexture(512, 256, (ctx, w, h) => {
        ctx.fillStyle = "#b7b4aa";
        ctx.fillRect(0, 0, w, h);
        for (let y = 0; y < h; y += 32) {
          for (let x = 0; x < w; x += 48) {
            const off = (Math.floor(y / 32) % 2) * 24;
            const v = 168 + Math.floor(rand() * 24);
            ctx.fillStyle = `rgb(${v},${v - 2},${v - 8})`;
            ctx.fillRect(x + off + 1, y + 1, 46, 30);
          }
        }
        ctx.strokeStyle = "rgba(75,75,70,0.18)";
        ctx.lineWidth = 1;
        for (let y = 0; y <= h; y += 32) {
          ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke();
        }
        for (let x = 0; x <= w; x += 48) {
          ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h); ctx.stroke();
        }
        for (let i = 0; i < 600; i++) {
          ctx.fillStyle = `rgba(70,70,65,${0.02 + rand() * 0.05})`;
          ctx.fillRect(rand() * w, rand() * h, 1.4, 1.4);
        }
      });
      tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(16, 4);
      return tex;
    }

    function makeFacadeTexture(tiled = false) {
      return canvasTexture(512, 512, (ctx, w, h) => {
        ctx.fillStyle = tiled ? "#dbe7ea" : "#f3ede3";
        ctx.fillRect(0, 0, w, h);
        if (tiled) {
          for (let y = 0; y < h; y += 32) {
            for (let x = 0; x < w; x += 32) {
              const b = 195 + Math.floor(rand() * 30);
              ctx.fillStyle = `rgb(${b - 32},${b - 8},${b})`;
              ctx.fillRect(x + 1, y + 1, 30, 30);
              ctx.strokeStyle = "rgba(255,255,255,0.55)";
              ctx.lineWidth = 1.5;
              ctx.strokeRect(x + 5, y + 5, 22, 22);
              ctx.beginPath();
              ctx.moveTo(x + 5, y + 16); ctx.lineTo(x + 27, y + 16);
              ctx.moveTo(x + 16, y + 5); ctx.lineTo(x + 16, y + 27);
              ctx.stroke();
            }
          }
        } else {
          for (let i = 0; i < 1800; i++) {
            ctx.fillStyle = `rgba(100,80,60,${rand() * 0.018})`;
            ctx.fillRect(rand() * w, rand() * h, 2, 2);
          }
        }
        for (let row = 0; row < 4; row++) {
          for (let col = 0; col < 3; col++) {
            const x = 50 + col * 145;
            const y = 42 + row * 111;
            ctx.fillStyle = "rgba(255,255,255,0.6)";
            ctx.fillRect(x - 5, y - 5, 70, 80);
            ctx.fillStyle = row === 0 ? "#3c5d72" : "#253b4a";
            ctx.fillRect(x, y, 58, 58);
            ctx.fillStyle = "rgba(255,255,255,0.16)";
            ctx.fillRect(x + 6, y + 6, 18, 20);
            ctx.fillStyle = row === 2 ? "rgba(255,230,185,0.55)" : "rgba(130,180,205,0.30)";
            ctx.fillRect(x + 8, y + 8, 14, 16);
            ctx.strokeStyle = "rgba(35,35,35,0.5)";
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(x + 29, y); ctx.lineTo(x + 29, y + 58);
            ctx.stroke();
            ctx.fillStyle = "rgba(255,255,255,0.72)";
            ctx.fillRect(x - 4, y + 58, 66, 4);
            ctx.strokeStyle = "rgba(70,60,45,0.5)";
            ctx.lineWidth = 1.4;
            for (let b = 0; b < 6; b++) {
              ctx.beginPath();
              ctx.moveTo(x + b * 12, y + 70);
              ctx.lineTo(x + b * 12, y + 60);
              ctx.stroke();
            }
          }
        }
        ctx.strokeStyle = "rgba(70,50,35,0.16)";
        ctx.lineWidth = 4;
        ctx.strokeRect(2, 2, w - 4, h - 4);
      });
    }

    function makeTileTexture() {
      return canvasTexture(256, 256, (ctx, w, h) => {
        ctx.fillStyle = "#e4ebec";
        ctx.fillRect(0, 0, w, h);
        for (let y = 0; y < h; y += 24) {
          for (let x = 0; x < w; x += 24) {
            const on = ((x / 24 + y / 24) % 2) < 1;
            ctx.fillStyle = on ? "#6d9ab3" : "#c8dce5";
            ctx.fillRect(x + 1, y + 1, 22, 22);
            ctx.strokeStyle = "rgba(255,255,255,0.72)";
            ctx.lineWidth = 1.2;
            ctx.strokeRect(x + 5, y + 5, 14, 14);
          }
        }
      });
    }

    function makeWakeTexture() {
      return canvasTexture(256, 64, (ctx, w, h) => {
        ctx.clearRect(0, 0, w, h);
        const grad = ctx.createLinearGradient(0, 0, w, 0);
        grad.addColorStop(0, "rgba(255,255,255,0)");
        grad.addColorStop(0.24, "rgba(255,255,255,0.38)");
        grad.addColorStop(0.54, "rgba(255,255,255,0.22)");
        grad.addColorStop(0.82, "rgba(255,255,255,0.10)");
        grad.addColorStop(1, "rgba(255,255,255,0)");
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
        for (let i = 0; i < 100; i++) {
          ctx.fillStyle = `rgba(255,255,255,${rand() * 0.22})`;
          ctx.beginPath();
          ctx.ellipse(rand() * w, rand() * h, 1 + rand() * 5, 0.5 + rand() * 1.2, 0, 0, Math.PI * 2);
          ctx.fill();
        }

    function makeTextPlane(text, width, height, color = "#ffffff", background = null, fontSize = 92) {
      const tex = canvasTexture(1024, 256, (ctx, w, h) => {
        ctx.clearRect(0, 0, w, h);
        if (background) {
          ctx.fillStyle = background;
          ctx.fillRect(0, 0, w, h);

        ctx.fillStyle = color;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

    function makeArchHole(cx, bottom, width, topY) {
      const path = new THREE.Path();
      const r = width * 0.5;
      path.moveTo(cx - r, bottom);
      path.lineTo(cx - r, topY - r);
      path.absarc(cx, topY - r, r, Math.PI, 0, true);
      path.lineTo(cx + r, bottom);
      path.closePath();
      return path;
    }

    function createSky() {
      const geo = new THREE.SphereGeometry(5200, 40, 24);
      const mat = new THREE.ShaderMaterial({
        side: THREE.BackSide,
        depthWrite: false,
        uniforms: {
          topColor: { value: new THREE.Color(0x4f83b5) },
          bottomColor: { value: new THREE.Color(0xd8e6ee) },
          sunColor: { value: new THREE.Color(0xffc17a) },
          sunDir: { value: new THREE.Vector3(0.2, 0.4, 0.1) },
          night: { value: 0.0 }
        },
        vertexShader: `
          varying vec3 vWorldPosition;
          void main() {
            vec4 worldPosition = modelMatrix * vec4(position, 1.0);
            vWorldPosition = worldPosition.xyz;
            gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
          }
        `,
        fragmentShader: `
          varying vec3 vWorldPosition;
          uniform vec3 topColor;
          uniform vec3 bottomColor;
          uniform vec3 sunColor;
          uniform vec3 sunDir;
          uniform float night;
          void main() {
            vec3 dir = normalize(vWorldPosition - cameraPosition);
            float h = clamp(dir.y * 0.5 + 0.5, 0.0, 1.0);
            vec3 col = mix(bottomColor, topColor, pow(max(dir.y, 0.0), 0.55));
            float sunDot = max(dot(dir, normalize(sunDir)), 0.0);
            float disc = pow(sunDot, 820.0);
            float glow = pow(sunDot, 18.0);
            col += sunColor * disc * 2.4;
            col += sunColor * glow * 0.16;
            col += vec3(0.045, 0.055, 0.075) * night * (0.5 + h * 0.5);
            gl_FragColor = vec4(col, 1.0);
          }
        `
      });
      skyMesh = new THREE.Mesh(geo, mat);
      skyMesh.frustumCulled = false;
      scene.add(skyMesh);

      const starGeo = new THREE.BufferGeometry();
      const starPos = [];
      for (let i = 0; i < 1800; i++) {
        const u = rand() * Math.PI * 2;

        starPos.push(
          Math.sin(v) * Math.cos(u) * r,
          Math.cos(v) * r + 80,
          Math.sin(v) * Math.sin(u) * r
        );
      }
      starGeo.setAttribute("position", new THREE.Float32BufferAttribute(starPos, 3));
      const starMat = new THREE.PointsMaterial({
        size: 9,
        map: makeStarTexture(),
        transparent: true,
        opacity: 0,
        depthWrite: false,
        blending: THREE.AdditiveBlending,
        color: 0xe5f0ff,
        sizeAttenuation: true
      });
      stars = new THREE.Points(starGeo, starMat);
      stars.frustumCulled = false;
      scene.add(stars);
    }

    function createWater() {
      const normalCanvas = document.createElement("canvas");
      normalCanvas.width = 256;
      normalCanvas.height = 256;
      const nctx = normalCanvas.getContext("2d");
      const img = nctx.createImageData(256, 256);
      for (let y = 0; y < 256; y++) {
        for (let x = 0; x < 256; x++) {
          const u = x / 256 * Math.PI * 2;
          const v = y / 256 * Math.PI * 2;
          let nx = Math.sin(u * 4 + v * 2) * 0.035 + Math.sin(u * 9 - v * 5) * 0.018;
          let ny = Math.cos(u * 3 - v * 4) * 0.035 + Math.sin(u * 7 + v * 8) * 0.016;
          let nz = Math.sqrt(Math.max(0.01, 1 - nx * nx - ny * ny));
          const i = (y * 256 + x) * 4;
          img.data[i] = (nx * 0.5 + 0.5) * 255;
          img.data[i + 1] = (ny * 0.5 + 0.5) * 255;
          img.data[i + 2] = (nz * 0.5 + 0.5) * 255;
          img.data[i + 3] = 255;
        }
      }
      nctx.putImageData(img, 0, 0);
      const normalTex = new THREE.CanvasTexture(normalCanvas);
      normalTex.wrapS = normalTex.wrapT = THREE.RepeatWrapping;
      normalTex.repeat.set(5, 5);

      const waterGeo = new THREE.PlaneGeometry(3200, 2100, 1, 1);

    function makeHullGeometry() {
      const profile = [
        { z: 1.00, y: 22.0 },
        { z: 1.00, y: 17.0 },
        { z: 1.00, y: 10.5 },
        { z: 1.00, y: 3.0 },
        { z: 0.92, y: -2.2 },
        { z: 0.72, y: -6.0 },
        { z: 0.38, y: -8.4 },
        { z: 0.00, y: -9.5 },
        { z: -0.38, y: -8.4 },
        { z: -0.72, y: -6.0 },
        { z: -0.92, y: -2.2 },
        { z: -1.00, y: 3.0 },
        { z: -1.00, y: 10.5 },
        { z: -1.00, y: 17.0 },
        { z: -1.00, y: 22.0 }
      ];
      const stations = 82;
      const positions = [];
      const colors = [];
      const indices = [];
      const c = new THREE.Color();
      for (let i = 0; i <= stations; i++) {
        const s = i / stations;
        const xBase = -150 + 300 * s;
        let w;
        if (s < 0.09) {
          w = 9 + (19 - 9) * (s / 0.09);
        } else if (s < 0.78) {
          w = 19;
        } else {
          w = 19 * Math.pow(Math.max(0, (1 - s) / 0.22), 0.56);
        }
        for (let j = 0; j < profile.length; j++) {
          const p = profile[j];
          let x = xBase;
          if (s > 0.75) {
            x += Math.pow((s - 0.75) / 0.25, 2.35) * ((p.y + 9.5) / 31.5) * 22;
          }
          if (s < 0.07) {
            x -= Math.pow((0.07 - s) / 0.07, 2) * ((p.y + 9.5) / 31.5) * 5;
          }
          const y = p.y;
          const z = p.z * w;
          positions.push(x, y, z);
          if (y < 0.15) c.setHex(0x5a1018);
          else if (y < 1.8) c.setHex(0x0b2948);
          else c.setHex(0xf0eee8);
          colors.push(c.r, c.g, c.b);
        }
      }
      for (let i = 0; i < stations; i++) {
        for (let j = 0; j < profile.length - 1; j++) {
          const a = i * profile.length + j;
          const b = a + 1;
          const cIdx = (i + 1) * profile.length + j;
          const d = cIdx + 1;
          indices.push(a, cIdx, b, b, cIdx, d);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setAttribute("color", new THREE.Float32BufferAttribute(colors, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function makeDeckGeometry() {
      const stations = 64;
      const positions = [];
      const indices = [];
      for (let i = 0; i <= stations; i++) {
        const s = i / stations;
        const xBase = -150 + 300 * s;
        let w;
        if (s < 0.09) w = 9 + (19 - 9) * (s / 0.09);
        else if (s < 0.78) w = 19;
        else w = 19 * Math.pow(Math.max(0, (1 - s) / 0.22), 0.56);
        let x = xBase;
        if (s > 0.75) {
          x += Math.pow((s - 0.75) / 0.25, 2.35) * ((22 + 9.5) / 31.5) * 22;
        }
        if (s < 0.07) {
          x -= Math.pow((0.07 - s) / 0.07, 2) * ((22 + 9.5) / 31.5) * 5;
        }
        positions.push(x, 22.08, w, x, 22.08, -w);
        if (i < stations) {
          const a = i * 2;
          indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      return geo;
    }

    function makeCable(start, end, sag, radius, material) {
      const mid = start.clone().add(end).multiplyScalar(0.5);
      mid.y -= sag;
      const curve = new THREE.CatmullRomCurve3([start, mid, end]);
      return new THREE.Mesh(new THREE.TubeGeometry(curve, 18, radius, 6, false), material);
    }

    function createMooringAndGangways() {
      shipRoot.updateMatrixWorld(true);

        opacity: 1
      });

      const pairs = [
        { localX: 120, bollardX: -120 },
        { localX: 82, bollardX: -82 },
        { localX: -85, bollardX: 85 },
        { localX: -122, bollardX: 122 }
      ];
      for (const pair of pairs) {
        const start = new THREE.Vector3(pair.localX, 11.3, 18.9).applyMatrix4(shipRoot.matrixWorld);
        const end = new THREE.Vector3(pair.bollardX, 3.7, -54.2);
        const line = makeCable(start, end, 0.8, 0.11, mooringLineMat);
        mooringLineGroup.add(line);
      }
      scene.add(mooringLineGroup);

      gangways = [];
      for (const x of [-47, 42]) {
        const pivot = new THREE.Group();
        pivot.position.set(x, 2.15, -50.0);

          color: 0xb7b6ad,

        });

          metalness: 0.55
        });

        const ramp = new THREE.Mesh(new THREE.BoxGeometry(3.1, 0.18, 9.4), rampMat);
        ramp.position.set(0, 4.0, 4.6);
        ramp.rotation.x = slope;
        ramp.castShadow = true;
        ramp.receiveShadow = true;
        pivot.add(ramp);
        for (const side of [-1, 1]) {
          const rail = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.08, 9.5), railMat);
          rail.position.set(side * 1.48, 5.8, 4.65);
          rail.rotation.x = slope;

          for (let i = 0; i < 4; i++) {

            post.position.set(side * 1.48, 5.3 + i * 0.5, 1.9 + i * 2.0);

    function createAlfama() {
      const facadeRegular = makeFacadeTexture(false);
      const facadeTiled = makeFacadeTexture(true);

      facadeTiled.map = facadeTiled.map || null;

      const housesRegular = [];
      const housesTiled = [];
      const roofs = [];
      const windowPositions = [];

      const landmarksToAvoid = [
        { x: 60, z: -245, r: 58 },
        { x: -120, z: -230, r: 52 },
        { x: 152, z: -365, r: 104 },
        { x: -350, z: -155, r: 115 }
      ];

      for (let z = -122; z > -610; z -= 27) {
        for (let x = -520; x < 530; x += 29) {
          if (rand() < 0.17) continue;
          const px = x + (rand() - 0.5) * 19;
          const pz = z + (rand() - 0.5) * 20;
          if (pz > -103) continue;
          let skip = false;
          for (const lm of landmarksToAvoid) {
            if ((px - lm.x) ** 2 + (pz - lm.z) ** 2 < lm.r * lm.r) { skip = true; break; }
          }
          if (skip) continue;
          const baseY = terrainHeight(px, pz);
          if (baseY > 100) continue;
          const w = 7.2 + rand() * 8.8;
          const d = 6.4 + rand() * 7.0;
          const h = 8.2 + rand() * 10.2;
          const rot = (rand() - 0.5) * 0.34;
          const house = {
            x: px,
            z: pz,
            baseY: baseY - 0.55,
            w, d, h, rot,
            color: PALETTE_HOUSES[Math.floor(rand() * PALETTE_HOUSES.length)]
          };
          if (rand() < 0.13) housesTiled.push(house);
          else housesRegular.push(house);
          const roofH = 2.1 + rand() * 1.8;
          roofs.push({ ...house, roofH });
          const winCount = 3 + Math.floor(rand() * 3);
          for (let k = 0; k < winCount; k++) {
            const wx = px + (rand() - 0.5) * w * 0.8;
            const wy = baseY + 2.0 + rand() * Math.max(2, h - 3.5);
            const wz = pz + d * 0.5 + 0.26;
            windowPositions.push(wx, wy, wz);
          }
        }
      }

      function buildHouseMesh(data, texture, useTile) {
        if (!data.length) return;
        const geo = new THREE.BoxGeometry(1, 1, 1);
        const mat = new THREE.MeshStandardMaterial({
          map: internetSafeTexture(texture, useTile),
          color: 0xffffff,
          roughness: 0.84,
          metalness: 0.02
        });
        const inst = new THREE.InstancedMesh(geo, mat, data.length);
        const color = new THREE.Color();
        data.forEach((h, i) => {
          tmpObject.position.set(h.x, h.baseY + h.h * 0.5, h.z);
          tmpObject.rotation.set(0, h.rot, 0);
          tmpObject.scale.set(h.w, h.h, h.d);
          tmpObject.updateMatrix();
          inst.setMatrixAt(i, tmpObject.matrix);
          color.setHex(h.color);
          inst.setColorAt(i, color);
        });
        inst.instanceMatrix.needsUpdate = true;
        if (inst.instanceColor) inst.instanceColor.needsUpdate = true;
        inst.receiveShadow = true;
        inst.castShadow = false;
        scene.add(inst);
      }

      function internetSafeTexture(texture, useTile) {
        if (useTile && tileTex) {
          const canvas = document.createElement("canvas");
          canvas.width = 512;
          canvas.height = 512;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(texture.image, 0, 0);
          const t = new THREE.CanvasTexture(canvas);
          t.colorSpace = THREE.SRGBColorSpace;
          t.wrapS = t.wrapT = THREE.RepeatWrapping;
          t.repeat.set(1, 1);
          return t;
        }
        return texture;
      }

      buildHouseMesh(housesRegular, facadeRegular, false);
      buildHouseMesh(housesTiled, facadeTiled, true);

      const roofGeo = new THREE.ConeGeometry(1, 1, 4, 1);
      roofGeo.rotateY(Math.PI / 4);
      const roofMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        roughness: 0.94,
        metalness: 0.0
      });
      const roofInst = new THREE.InstancedMesh(roofGeo, roofMat, roofs.length);
      const rc = new THREE.Color();
      roofs.forEach((h, i) => {
        tmpObject.position.set(h.x, h.baseY + h.h + h.roofH * 0.5, h.z);
        tmpObject.rotation.set(0, h.rot, 0);
        tmpObject.scale.set(h.w * 0.72, h.roofH, h.d * 0.72);
        tmpObject.updateMatrix();
        roofInst.setMatrixAt(i, tmpObject.matrix);
        rc.setHSL(0.035 + rand() * 0.025, 0.54 + rand() * 0.12, 0.32 + rand() * 0.08);
        roofInst.setColorAt(i, rc);
      });
      roofInst.instanceMatrix.needsUpdate = true;
      if (roofInst.instanceColor) roofInst.instanceColor.needsUpdate = true;

      scene.add(roofInst);

      const wgeo = new THREE.BufferGeometry();

      cityWindowMaterial = new THREE.PointsMaterial({
        size: 1.8,
        map: makeGlowTexture(),
        color: 0xffd89a,
        transparent: true,
        opacity: 0,

    function makeRibbon(curve, width, material, yOffset = 0.2) {
      const N = 90;
      const positions = [];
      const indices = [];
      for (let i = 0; i <= N; i++) {
        const p = curve.getPointAt(i / N);
        const t = curve.getTangentAt(i / N).normalize();
        const nx = -t.z;
        const nz = t.x;
        const len = Math.hypot(nx, nz) || 1;
        const ox = nx / len * width * 0.5;
        const oz = nz / len * width * 0.5;
        const y = terrainHeight(p.x, p.z) + yOffset;
        positions.push(p.x + ox, y, p.z + oz, p.x - ox, y, p.z - oz);
        if (i < N) {
          const a = i * 2;
          indices.push(a, a + 1, a + 2, a + 1, a + 3, a + 2);
        }
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.Float32BufferAttribute(positions, 3));
      geo.setIndex(indices);
      geo.computeVertexNormals();
      const mesh = new THREE.Mesh(geo, material);
      mesh.receiveShadow = true;
      return mesh;
    }

        ])
      ];

        color: 0xffffff,

      });

      const c = new THREE.Color();
      for (let i = 0; i < count; i++) {
        const routeIndex = i < 30 ? 0 : (i < 58 ? 1 : (i < 83 ? 2 : 3));
        const route = passengerRoutes[routeIndex];
        const speed = 0.010 + rand() * 0.022;
        passengerData.push({
          route,
          phase: rand(),
          speed,
          bob: rand() * Math.PI * 2,
          scale: 0.88 + rand() * 0.22
        });
        c.setHex(clothing[Math.floor(rand() * clothing.length)]);
        bodies.setColorAt(i, c);

      bodies.instanceMatrix.needsUpdate = true;
      heads.instanceMatrix.needsUpdate = true;
      if (bodies.instanceColor) bodies.instanceColor.needsUpdate = true;
      bodies.frustumCulled = false;
      heads.frustumCulled = false;
      bodies.castShadow = true;
      heads.castShadow = false;
      scene.add(bodies, heads);
      passengers = { bodies, heads };

    function updatePassengers(elapsed) {
      if (!passengers) return;
      const { bodies, heads } = passengers;
      for (let i = 0; i < passengerData.length; i++) {
        const p = passengerData[i];
        let u = (p.phase + elapsed * p.speed) % 2;
        if (u > 1) u = 2 - u;
        const pos = p.route.getPointAt(u);
        const tangent = p.route.getTangentAt(u);
        const bob = Math.sin(elapsed * 7.5 + p.bob) * 0.035;
        const yawAngle = Math.atan2(tangent.x, tangent.z);
        tmpObject.position.set(pos.x, pos.y + 0.61 + bob, pos.z);
        tmpObject.rotation.set(0, yawAngle, 0);
        tmpObject.scale.set(p.scale, p.scale, p.scale);
        tmpObject.updateMatrix();
        bodies.setMatrixAt(i, tmpObject.matrix);
        tmpObject.position.y = pos.y + 1.40 + bob;
        tmpObject.scale.set(p.scale * 0.94, p.scale * 0.94, p.scale * 0.94);
        tmpObject.updateMatrix();
        heads.setMatrixAt(i, tmpObject.matrix);
      }
      bodies.instanceMatrix.needsUpdate = true;
      heads.instanceMatrix.needsUpdate = true;
    }

    function updateVehicles(elapsed) {
      for (const v of vehicles) {
        if (v.kind === "linear") {
          const span = v.max - v.min;
          let d = ((elapsed * v.speed + v.phase) % span + span) % span;
          if (v.reverse) d = span - d;
          v.root.position.x = v.min + d;
          v.root.position.z = v.z;
          v.root.rotation.y = v.reverse ? Math.PI : 0;
        } else if (v.kind === "forklift") {
          const x = v.baseX + Math.sin(elapsed * 0.64 + v.phase) * 22;
          v.root.position.x = x;
          v.root.position.z = v.baseZ + Math.sin(elapsed * 0.32 + v.phase) * 2.2;
          v.root.rotation.y = Math.cos(elapsed * 0.64 + v.phase) > 0 ? 0 : Math.PI;
        }
      }
    }

          new THREE.CylinderGeometry(0.06, 0.09, 8.0, 5),
          new THREE.MeshStandardMaterial({ color: 0x7d7a6d, roughness: 0.6 })
        );
        mast.position.set(0, 4.6, 0);
        sg.add(mast);
        const sailShape = new THREE.Shape();
        sailShape.moveTo(0, 0);
        sailShape.lineTo(0, 6.3);
        sailShape.lineTo(3.7, 0.6);
        sailShape.closePath();
        const sail = new THREE.Mesh(
          new THREE.ShapeGeometry(sailShape),
          new THREE.MeshStandardMaterial({
            color: sailColors[i % sailColors.length],
            roughness: 0.82,
            side: THREE.DoubleSide
          })
        );
        sail.position.set(-0.1, 1.9, 0);
        sail.rotation.y = Math.PI / 2;
        sg.add(sail);
        sg.position.set(randRange(-150, 460), 0, randRange(120, 480));
        sg.rotation.y = randRange(-Math.PI, Math.PI);
        scene.add(sg);
        sailboats.push({
          root: sg,
          phase: rand() * Math.PI * 2,
          speed: randRange(0.02, 0.06),
          ax: randRange(30, 80),
          az: randRange(20, 70)
        });
      }
    }

    function updateBoats(elapsed, delta) {
      if (tug) {
        if (shipProgress > 0.055 && shipProgress < 0.38) {
          const bow = new THREE.Vector3(174, 0, 0).applyMatrix4(shipRoot.matrixWorld);
          const target = new THREE.Vector3(bow.x - 6, 0, bow.z + 25);
          tug.position.lerp(target, 0.035);
          tug.rotation.y = shipRoot.rotation.y + Math.PI * 0.52;
        } else {
          const standby = new THREE.Vector3(-165 + Math.sin(elapsed * 0.22) * 14, 0, 38);
          tug.position.lerp(standby, 0.02);
          tug.rotation.y = 0.3;
        }
        tug.position.y = Math.sin(elapsed * 0.9) * 0.12;
      }
      if (pilotBoat) {
        const a = elapsed * 0.035;
        pilotBoat.position.x = 96 + Math.cos(a) * 64;
        pilotBoat.position.z = 128 + Math.sin(a) * 58;
        pilotBoat.position.y = Math.sin(elapsed * 1.1) * 0.13;
        pilotBoat.rotation.y = -a + Math.PI / 2;
      }
      for (const f of ferries) {
        f.root.position.z += f.speed * delta * f.dir;
        if (f.dir > 0 && f.root.position.z > 800) {
          f.root.position.z = -80;
        } else if (f.dir < 0 && f.root.position.z < -80) {
          f.root.position.z = 800;
        }
        f.root.position.y = Math.sin(elapsed * 0.55 + f.x) * 0.14;
        f.root.rotation.y = f.dir > 0 ? -Math.PI / 2 : Math.PI / 2;
      }
      for (const s of sailboats) {
        s.root.position.x += Math.cos(elapsed * 0.08 + s.phase) * s.speed;
        s.root.position.z += Math.sin(elapsed * 0.06 + s.phase) * s.speed * 0.55;
        s.root.position.y = Math.sin(elapsed * 0.8 + s.phase) * 0.15;
        s.root.rotation.z = Math.sin(elapsed * 0.7 + s.phase) * 0.045;
      }
    }

    function createSeagulls() {
      const birdMat = new THREE.MeshStandardMaterial({
        color: 0xf3f3ef,
        roughness: 0.76,
        side: THREE.DoubleSide
      });
      for (let i = 0; i < 15; i++) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(new THREE.SphereGeometry(0.35, 6, 4), birdMat);
        body.scale.set(1.2, 0.6, 0.6);
        g.add(body);
        const left = new THREE.Mesh(new THREE.BoxGeometry(0.4, 0.055, 1.15), birdMat);
        left.position.z = 0.67;
        const right = left.clone();
        right.position.z = -0.67;
        g.add(left, right);
        g.userData.wings = [left, right];
        g.userData.center = new THREE.Vector3(randRange(-80, 160), randRange(34, 92), randRange(-120, 90));
        g.userData.radius = randRange(30, 110);
        g.userData.height = randRange(34, 88);
        g.userData.phase = rand() * Math.PI * 2;
        g.userData.speed = randRange(0.11, 0.26);
        g.scale.setScalar(randRange(0.8, 1.4));
        scene.add(g);
        seagulls.push(g);
      }
    }

    function updateSeagulls(elapsed) {
      for (const g of seagulls) {
        const d = g.userData;
        const a = elapsed * d.speed + d.phase;
        g.position.set(
          d.center.x + Math.cos(a) * d.radius,
          d.height + Math.sin(elapsed * 0.7 + d.phase) * 5.0,
          d.center.z + Math.sin(a) * d.radius * 0.72
        );
        g.rotation.y = -a;
        const flap = Math.sin(elapsed * 7.4 + d.phase) * 0.55;
        g.userData.wings[0].rotation.x = flap;
        g.userData.wings[1].rotation.x = -flap;
      }
    }

    function createRain() {
      const count = 2200;
      const positions = new Float32Array(count * 3);
      const speeds = new Float32Array(count);
      for (let i = 0; i < count; i++) {
        positions[i * 3] = randRange(-110, 110);
        positions[i * 3 + 1] = randRange(0, 90);
        positions[i * 3 + 2] = randRange(-110, 110);
        speeds[i] = 16 + rand() * 24;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute("position", new THREE.BufferAttribute(positions, 3));
      const mat = new THREE.PointsMaterial({
        color: 0xc8dbe8,
        size: 0.22,
        transparent: true,
        opacity: 0.52,
        depthWrite: false,
        sizeAttenuation: true
      });
      rainPoints = new THREE.Points(geo, mat);
      rainPoints.frustumCulled = false;
      rainPoints.visible = false;
      scene.add(rainPoints);
      rainData = { speeds, positions, count };
    }

    function updateRain(delta) {
      if (!rainPoints || !rainPoints.visible || !rainData) return;
      const pos = rainPoints.geometry.attributes.position;
      for (let i = 0; i < rainData.count; i++) {
        let y = pos.getY(i) - rainData.speeds[i] * delta;
        if (y < 0) y += 90;
        pos.setY(i, y);
      }
      pos.needsUpdate = true;
      rainPoints.position.set(camera.position.x, 0, camera.position.z);
    }

    function animateTram(elapsed) {
      if (!tram || !tramCurve) return;
      let t = (elapsed * 0.0045 + 0.16) % 1;
      const pos = tramCurve.getPointAt(t);
      const tangent = tramCurve.getTangentAt(t).normalize();
      tram.position.copy(pos);
      tram.quaternion.setFromUnitVectors(new THREE.Vector3(1, 0, 0), tangent);
    }

    function updateCabinColors(n) {
      if (!cabinWindows) return;
      const color = new THREE.Color();
      for (let i = 0; i < cabinWindows.count; i++) {
        if (n > 0.12) {
          if (cabinLit[i] > 0) {
            color.setHSL(
              0.085 + 0.025 * (i % 7) / 7,
              0.74,
              0.38 + cabinLit[i] * 0.34
            );
          } else {
            color.setHex(0x07131c);
          }
        } else {
          color.setHex(0x172b3a);
        }
        cabinWindows.setColorAt(i, color);
      }
      if (cabinWindows.instanceColor) cabinWindows.instanceColor.needsUpdate = true;
    }

    function updateNightVisuals() {
      const n = nightFactor;
      for (const e of nightGlowMaterials) {
        e.mat.emissive.copy(e.color);
        e.mat.emissiveIntensity = e.strength * n;
      }
      for (const e of basicNightParts) {
        e.mat.opacity = e.maxOpacity * n;
      }
      if (cityWindowMaterial) cityWindowMaterial.opacity = 0.95 * n;
      if (shipDeckLights) shipDeckLights.material.opacity = 0.98 * n;
      if (bridgeDeckLights) bridgeDeckLights.material.opacity = 0.96 * n;
      if (stars) stars.material.opacity = 0.9 * n;
      if (bridgeWindowMat) {
        bridgeWindowMat.color.setHex(n > 0.35 ? 0x9ed7e8 : 0x142633);
      }
      if (Math.abs(n - lastCabinNight) > 0.025) {
        updateCabinColors(n);
        lastCabinNight = n;
      }
    }

    function updateTimeOfDay() {
      const hour = timeOfDay;
      const angle = ((hour - 6) / 14) * Math.PI;
      sunDir.set(Math.cos(angle) * 0.92, Math.sin(angle), 0.34).normalize();
      const daylight = smoothstep(-0.1, 0.12, sunDir.y);
      nightFactor = 1 - smoothstep(-0.16, 0.09, sunDir.y);
      const golden = Math.exp(-Math.pow((sunDir.y - 0.075) / 0.19, 2));

      sunLight.position.copy(sunDir).multiplyScalar(680);
      sunLight.position.z += -90;
      sunLight.intensity = Math.max(0, daylight) * 2.75;
      sunLight.color.copy(SUN_WARM).lerp(SUN_WHITE, clamp(daylight * 1.2, 0, 1));
      moonLight.intensity = 0.16 * nightFactor;
      ambientLight.intensity = 0.06 + 0.22 * daylight;
      hemiLight.intensity = 0.18 + 0.55 * daylight;
      hemiLight.color.setHex(daylight > 0.3 ? 0xb4d9ee : 0x35465d);
      hemiLight.groundColor.setHex(daylight > 0.3 ? 0x6b5540 : 0x121921);

      const top = SKY_NIGHT_TOP.clone().lerp(SKY_DAY_TOP, daylight);
      top.lerp(SKY_GOLD_TOP, golden * 0.55);
      const bottom = SKY_NIGHT_BOTTOM.clone().lerp(SKY_DAY_BOTTOM, daylight);
      bottom.lerp(SKY_GOLD_BOTTOM, golden * 0.72);
      if (weather === "rain") {
        top.lerp(new THREE.Color(0x384650), 0.72);
        bottom.lerp(new THREE.Color(0x66737a), 0.55);
      } else if (weather === "haze") {
        top.lerp(new THREE.Color(0x93a5ae), 0.32);
        bottom.lerp(new THREE.Color(0xd7d0c1), 0.25);
      }
      skyMesh.material.uniforms.topColor.value.copy(top);
      skyMesh.material.uniforms.bottomColor.value.copy(bottom);
      skyMesh.material.uniforms.sunColor.value.copy(SUN_WARM).lerp(SUN_WHITE, daylight);
      skyMesh.material.uniforms.sunDir.value.copy(sunDir);
      skyMesh.material.uniforms.night.value = nightFactor;

      const fogColor = FOG_NIGHT.clone().lerp(FOG_DAY, daylight);
      fogColor.lerp(FOG_GOLD, golden * 0.6);
      if (weather === "rain") fogColor.lerp(new THREE.Color(0x5a6267), 0.7);
      else if (weather === "haze") fogColor.lerp(new THREE.Color(0xb9b7ac), 0.5);
      scene.fog.color.copy(fogColor);

      if (water) {
        water.material.uniforms.sunDirection.value.copy(sunDir);
        water.material.uniforms.sunColor.value.copy(SUN_WARM).lerp(SUN_WHITE, daylight);
        const wc = WATER_NIGHT.clone().lerp(WATER_DAY, daylight);
        wc.lerp(WATER_GOLD, golden * 0.55);
        if (weather === "rain") wc.lerp(new THREE.Color(0x33454f), 0.55);
        water.material.uniforms.waterColor.value.copy(wc);
        water.material.uniforms.distortionScale.value = 1.2 + 2.2 * daylight;
      }

      renderer.toneMappingExposure = 0.92 + 0.13 * daylight;
      updateNightVisuals();
    }

    function updateTimeLabel() {
      const h = Math.floor(timeOfDay) % 24;
      const m = Math.floor((timeOfDay - Math.floor(timeOfDay)) * 60);
      const el = document.getElementById("timeValue");
      if (el) el.textContent = `${String(h).padStart(2, "0")}:${String(m).padStart(2, "0")}`;
    }

    function applyWeather() {
      if (!scene) return;
      if (weather === "clear") scene.fog.density = 0.00052;
      else if (weather === "haze") scene.fog.density = 0.00105;
      else scene.fog.density = 0.00155;
      if (rainPoints) rainPoints.visible = weather === "rain";
      updateTimeOfDay();
    }

    function updateShipProgress(delta) {
      if (Math.abs(shipTarget - shipProgress) > 0.00001) {
        const dir = Math.sign(shipTarget - shipProgress);
        shipProgress = clamp(shipProgress + dir * delta / 42, 0, 1);
        if (Math.abs(shipTarget - shipProgress) < 0.0003) {
          shipProgress = shipTarget;
          shipAnimating = false;
          updateDepartButton();
        }
      }
      updateShipTransform();
      updateGangwaysAndMoorings();
    }

    function updateShipTransform() {
      if (!shipRoot) return;
      const p = shipProgress;
      let x = 0;
      let z = -22;
      let rot = Math.PI;
      if (p > 0.08 && p <= 0.26) {
        const q = easeInOut((p - 0.08) / 0.18);
        x = -75 * q;
        z = -22 + 78 * q;
        rot = Math.PI + 0.30 * q;
      } else if (p > 0.26) {
        const q = easeInOut((p - 0.26) / 0.74);
        x = -75 - 860 * q;
        z = 56 + 35 * q;
        rot = Math.PI + 0.30 + 0.045 * q;
      }
      shipRoot.position.set(x, 0, z);
      shipRoot.rotation.y = rot;
      shipRoot.updateMatrixWorld(true);
    }

    function updateGangwaysAndMoorings() {
      const p = shipProgress;
      const retract = smoothstep(0.008, 0.055, p);
      for (const g of gangways) {
        g.rotation.x = -1.05 * retract;
      }
      if (mooringLineMat) {
        mooringLineMat.opacity = 1 - smoothstep(0.0, 0.035, p);
        mooringLineGroup.visible = mooringLineMat.opacity > 0.02;
      }
    }

    function playHorn() {
      try {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (audioCtx.state === "suspended") audioCtx.resume();
        const now = audioCtx.currentTime;
        const master = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        filter.type = "lowpass";
        filter.frequency.setValueAtTime(900, now);
        filter.frequency.exponentialRampToValueAtTime(420, now + 2.8);
        master.gain.setValueAtTime(0.0001, now);
        master.gain.exponentialRampToValueAtTime(0.24, now + 0.13);
        master.gain.setValueAtTime(0.24, now + 1.75);
        master.gain.exponentialRampToValueAtTime(0.0001, now + 3.45);
        master.connect(filter);
        filter.connect(audioCtx.destination);
        const freqs = [68, 102, 137, 204];
        freqs.forEach((f, i) => {
          const osc = audioCtx.createOscillator();
          osc.type = i < 2 ? "sawtooth" : "triangle";
          osc.frequency.setValueAtTime(f, now);
          osc.frequency.linearRampToValueAtTime(f * 0.985, now + 3.1);
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.16 / (i + 1), now);
          gain.gain.setValueAtTime(0.16 / (i + 1), now + 1.8);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 3.2);
          osc.connect(gain);
          gain.connect(master);
          osc.start(now);
          osc.stop(now + 3.3);
        });
      } catch (err) {
        console.warn("Horn audio could not start", err);
      }
    }

    function updateDepartButton() {
      const btn = document.getElementById("departBtn");
      if (!btn) return;
      if (shipTarget > 0.5) {
        btn.textContent = "RETURN TO BERTH";
      } else {
        btn.textContent = "DEPARTURE";
      }
    }

    function setPreset(name, instant = false) {
      if (!PRESETS[name]) return;
      if (walkMode) stopWalk(false);
      currentPreset = name;
      document.querySelectorAll("#presetGrid button").forEach(b => {
        b.classList.toggle("active", b.dataset.preset === name);
      });
      const p = PRESETS[name];
      if (instant) {
        camera.position.copy(p.pos);
        controls.target.copy(p.target);
        controls.update();
        cameraTransition = null;
        controls.enabled = true;
      } else {
        cameraTransition = {
          startPos: camera.position.clone(),
          startTarget: controls.target.clone(),
          endPos: p.pos.clone(),
          endTarget: p.target.clone(),
          t: 0
        };
        controls.enabled = false;
      }
    }

    function updateCameraTransition(delta) {
      if (!cameraTransition) return;
      cameraTransition.t = clamp(cameraTransition.t + delta / 1.45, 0, 1);
      const e = easeInOut(cameraTransition.t);
      camera.position.lerpVectors(cameraTransition.startPos, cameraTransition.endPos, e);
      controls.target.lerpVectors(cameraTransition.startTarget, cameraTransition.endTarget, e);
      camera.lookAt(controls.target);
      if (cameraTransition.t >= 1) {
        cameraTransition = null;
        controls.enabled = true;
        controls.update();
      }
    }

    function startWalk() {
      if (walkMode) return;
      if (cameraTransition) cameraTransition = null;
      walkMode = true;
      controls.enabled = false;
      camera.position.set(0, 3.7, -66);
      yaw = Math.PI;
      pitch = -0.03;
      camera.rotation.order = "YXZ";
      camera.rotation.set(pitch, yaw, 0);
      document.getElementById("crosshair").style.display = "block";
      document.getElementById("walkHint").style.display = "block";
      const walkBtn = document.getElementById("walkBtn");
      if (walkBtn) walkBtn.textContent = "EXIT WALK";
      document.querySelectorAll("#presetGrid button").forEach(b => b.classList.remove("active"));
      if (renderer.domElement.requestPointerLock) {
        renderer.domElement.requestPointerLock();
      }
    }

    function stopWalk(restore = true) {
      if (!walkMode) return;
      walkMode = false;
      controls.enabled = true;
      document.getElementById("crosshair").style.display = "none";
      document.getElementById("walkHint").style.display = "none";
      const walkBtn = document.getElementById("walkBtn");
      if (walkBtn) walkBtn.textContent = "WALK THE QUAY";
      if (document.pointerLockElement) document.exitPointerLock();
      if (restore) {
        setPreset("waterfront");
      } else {
        controls.target.set(0, 25, -25);
        controls.update();
      }
    }

    function updateWalk(delta) {
      if (!walkMode) return;
      const speed = (keys["ShiftLeft"] || keys["ShiftRight"] ? 10 : 4.5) * delta;
      const forward = new THREE.Vector3(-Math.sin(yaw), 0, -Math.cos(yaw));
      const right = new THREE.Vector3(-forward.z, 0, forward.x);
      if (keys["KeyW"] || keys["ArrowUp"]) camera.position.addScaledVector(forward, speed);
      if (keys["KeyS"] || keys["ArrowDown"]) camera.position.addScaledVector(forward, -speed);
      if (keys["KeyD"] || keys["ArrowRight"]) camera.position.addScaledVector(right, speed);
      if (keys["KeyA"] || keys["ArrowLeft"]) camera.position.addScaledVector(right, -speed);
      camera.position.x = clamp(camera.position.x, -245, 245);
      camera.position.z = clamp(camera.position.z, -132, -54.5);
      camera.position.y = 3.7;
      camera.rotation.order = "YXZ";
      camera.rotation.set(pitch, yaw, 0);
    }

    function setupUI() {
      document.querySelectorAll("#presetGrid button").forEach(btn => {
        btn.addEventListener("click", () => setPreset(btn.dataset.preset));
      });
      const timeSlider = document.getElementById("timeSlider");
      timeSlider.addEventListener("input", () => {
        timeOfDay = parseFloat(timeSlider.value);
        timePlaying = false;
        const playBtn = document.getElementById("playBtn");
        if (playBtn) playBtn.textContent = "PLAY";
        lastCabinNight = -1;
        updateTimeLabel();
        updateTimeOfDay();
      });
      const playBtn = document.getElementById("playBtn");
      playBtn.addEventListener("click", () => {
        timePlaying = !timePlaying;
        playBtn.textContent = timePlaying ? "PAUSE" : "PLAY";
      });
      const weatherSelect = document.getElementById("weatherSelect");
      weatherSelect.addEventListener("change", () => {
        weather = weatherSelect.value;
        applyWeather();
      });
      const walkBtn = document.getElementById("walkBtn");
      walkBtn.addEventListener("click", () => {
        if (walkMode) stopWalk(true);
        else startWalk();
      });
      const departBtn = document.getElementById("departBtn");
      departBtn.addEventListener("click", () => {
        if (shipTarget > 0.5) {
          shipTarget = 0;
          shipAnimating = true;
          departBtn.textContent = "DEPARTURE";
        } else {
          shipTarget = 1;
          shipAnimating = true;
          departBtn.textContent = "RETURN TO BERTH";
          playHorn();
        }
      });
      const uiToggle = document.getElementById("uiToggle");
      const ui = document.getElementById("ui");
      uiToggle.addEventListener("click", () => {
        const hidden = ui.classList.toggle("hidden");
        uiToggle.textContent = hidden ? "SHOW UI" : "HIDE UI";
      });

      window.addEventListener("keydown", e => {
        keys[e.code] = true;
        if (walkMode && ["KeyW", "KeyA", "KeyS", "KeyD", "ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) {
          e.preventDefault();
        }
        if (walkMode && e.code === "Escape") {
          stopWalk(true);
        }
      });
      window.addEventListener("keyup", e => {
        keys[e.code] = false;
      });

      renderer.domElement.addEventListener("pointerdown", () => {
        if (walkMode && !document.pointerLockElement) {
          draggingLook = true;
          if (renderer.domElement.requestPointerLock) renderer.domElement.requestPointerLock();
        }
      });
      window.addEventListener("pointerup", () => { draggingLook = false; });
      window.addEventListener("mousemove", e => {
        if (!walkMode) return;
        if (document.pointerLockElement === renderer.domElement || draggingLook) {
          const mx = e.movementX || 0;
          const my = e.movementY || 0;
          yaw -= mx * 0.0023;
          pitch -= my * 0.0023;
          pitch = clamp(pitch, -1.25, 1.15);
        }
      });
      document.addEventListener("pointerlockchange", () => {
        const locked = document.pointerLockElement === renderer.domElement;
        if (!locked && walkMode) {
          document.getElementById("walkHint").textContent = "CLICK TO LOOK · WASD TO MOVE · ESC TO EXIT";
        } else if (locked && walkMode) {
          document.getElementById("walkHint").textContent = "WASD · mouse look · ESC to exit";
        }
      });
      controls.addEventListener("start", () => {
        if (cameraTransition) {
          cameraTransition = null;
          controls.enabled = true;
        }
      });
      window.addEventListener("resize", onResize);
    }

    function onResize() {
      if (!renderer || !camera) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      if (water) water.material.uniforms.size.value.set(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.05);
      elapsedTotal += delta;

      if (timePlaying) {
        timeOfDay = (timeOfDay + delta * 0.0185) % 24;
        const slider = document.getElementById("timeSlider");
        if (slider) slider.value = timeOfDay.toFixed(2);
        updateTimeLabel();
      }

      updateTimeOfDay();
      updateShipProgress(delta);

      if (water) {
        water.material.uniforms.time.value += delta * 0.34;
      }
      if (skyMesh) skyMesh.position.copy(camera.position);
      if (stars) stars.position.copy(camera.position);

      if (!walkMode && !cameraTransition) {
        controls.update();
      }
      updateCameraTransition(delta);
      updateWalk(delta);

      animateTram(elapsedTotal);
      updatePassengers(elapsedTotal);
      updateVehicles(elapsedTotal);
      updateBoats(elapsedTotal, delta);
      updateSeagulls(elapsedTotal);
      updateRain(delta);

      for (const r of radarGroups) r.rotation.y += delta * 1.8;

      if (walkMode) {
        camera.rotation.order = "YXZ";
        camera.rotation.set(pitch, yaw, 0);
      }

      renderer.render(scene, camera);
    }

    function init() {
      clock = new THREE.Clock();
      createWebGLRenderer();
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0xc7d7dd, 0.00052);
      camera = new THREE.PerspectiveCamera(54, window.innerWidth / window.innerHeight, 0.1, 12000);
      camera.position.copy(PRESETS.river.pos);
      camera.lookAt(PRESETS.river.target);

      controls = new OrbitControls(camera, renderer.domElement);
      controls.target.copy(PRESETS.river.target);
      controls.enableDamping = true;
      controls.dampingFactor = 0.065;
      controls.minDistance = 8;
      controls.maxDistance = 1700;
      controls.maxPolarAngle = Math.PI * 0.495;
      controls.minPolarAngle = 0.03;
      controls.update();

      createSky();
      createLights();
      createWater();
      createTerrain();
      createQuay();
      createTerminal();
      createShip();
      createAlfama();
      createPantheon();
      createSeCathedral();
      createCastle();
      createPraca();
      createBridge();
      createCristoRei();
      createSouthBankCity();
      createPortLife();
      setupUI();

      setPreset("river", true);
      updateTimeLabel();
      applyWeather();
      updateTimeOfDay();
      updateDepartButton();
      onResize();

      setTimeout(() => {
        const loading = document.getElementById("loading");
        if (loading) loading.classList.add("hide");
        setTimeout(() => {
          if (loading && loading.parentNode) loading.parentNode.removeChild(loading);
        }, 1400);
      }, 420);

      animate();
    }

    try {
      init();
    } catch (err) {
      console.error(err);
      const loading = document.getElementById("loading");
      if (loading) {
        loading.classList.remove("hide");
        loading.innerHTML = '<h1>Unable to start 3D</h1><p>' +
          String(err && err.message ? err.message : err).replace(/</g, "&lt;") +
          '</p>';
      }
    }
  </script>
</body>
</html>
