<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procedural V8 Engine</title>
    <style>
        body { margin: 0; overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; color: #fff; user-select: none; }
        #ui { position: absolute; top: 10px; left: 10px; width: 320px; background: rgba(15,15,20,0.9); border: 1px solid #444; border-radius: 8px; padding: 15px; box-sizing: border-box; max-height: 95vh; overflow-y: auto; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        h2 { margin-top: 0; font-size: 18px; color: #ff8844; text-align: center; border-bottom: 1px solid #555; padding-bottom: 10px; letter-spacing: 1px; }
        .panel { margin-bottom: 15px; }
        label { display: block; font-size: 12px; margin-bottom: 4px; color: #ddd; }
        input[type=range] { width: 100%; cursor: pointer; }
        .btn-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 5px; }
        button { flex: 1; background: #333; color: #fff; border: 1px solid #555; padding: 5px; font-size: 11px; cursor: pointer; border-radius: 4px; min-width: 45px; transition: background 0.2s; }
        button:hover { background: #555; }
        button.active { background: #ff8844; color: #000; font-weight: bold; }
        select { width: 100%; background: #222; color: #fff; border: 1px solid #555; padding: 4px; margin-bottom: 5px; border-radius: 4px; }
        .toggle-row { display: flex; flex-wrap: wrap; gap: 6px; font-size: 11px; }
        .toggle-row label { display: inline-flex; align-items: center; gap: 3px; margin: 0; cursor: pointer; }
        #info { position: absolute; bottom: 10px; left: 10px; background: rgba(0,0,0,0.7); padding: 10px 15px; border-radius: 5px; font-size: 14px; color: #0f0; border: 1px solid #444; }
        .section-title { font-size: 11px; color: #888; text-transform: uppercase; margin-top: 10px; margin-bottom: 5px; border-bottom: 1px solid #333; }
    </style>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

<div id="ui">
    <h2>V8 ENGINE SIMULATION</h2>
    
    <div class="panel">
        <div class="section-title">Engine Speed</div>
        <label>RPM: <span id="rpmDisplay">700</span></label>
        <input type="range" id="rpmSlider" min="0" max="8000" step="100" value="700">
        <div class="btn-row">
            <button onclick="setRPM(0)">STOP</button>
            <button onclick="setRPM(700)">IDLE</button>
            <button onclick="setRPM(2000)">2000</button>
            <button onclick="setRPM(4000)">4000</button>
            <button onclick="setRPM(6000)">6000</button>
            <button onclick="setRPM(8000)">8000</button>
        </div>
    </div>
    
    <div class="panel">
        <div class="section-title">Simulation Control</div>
        <label>Crank Angle: <span id="angleDisplay">0</span>°</label>
        <input type="range" id="crankSlider" min="0" max="720" step="1" value="0">
        <div class="btn-row">
            <button id="btnRun" class="active" onclick="setRunMode(false)">RUN</button>
            <button id="btnManual" onclick="setRunMode(true)">MANUAL</button>
            <button id="btnPause" onclick="togglePause()">PAUSE</button>
        </div>
        <div class="btn-row">
            <button onclick="setSpeed(1)" class="speedBtn active" data-speed="1">1x</button>
            <button onclick="setSpeed(0.25)" class="speedBtn" data-speed="0.25">0.25x</button>
            <button onclick="setSpeed(0.05)" class="speedBtn" data-speed="0.05">0.05x</button>
        </div>
    </div>

    <div class="panel">
        <div class="section-title">Views & Inspection</div>
        <div class="btn-row">
            <button onclick="setCamera('HERO')">HERO</button>
            <button onclick="setCamera('FRONT')">FRONT</button>
            <button onclick="setCamera('SIDE')">SIDE</button>
            <button onclick="setCamera('TOP')">TOP</button>
            <button onclick="setCamera('INTERNAL')">INT</button>
        </div>
        <label style="margin-top:8px;">Inspect Cylinder:</label>
        <select id="inspectSelect" onchange="setInspect(parseInt(this.value))">
            <option value="0">None</option>
            <option value="1">Cylinder 1</option>
            <option value="2">Cylinder 2</option>
            <option value="3">Cylinder 3</option>
            <option value="4">Cylinder 4</option>
            <option value="5">Cylinder 5</option>
            <option value="6">Cylinder 6</option>
            <option value="7">Cylinder 7</option>
            <option value="8">Cylinder 8</option>
        </select>
    </div>
    
    <div class="panel">
        <div class="section-title">Assembly</div>
        <label>Exploded View: <span id="explodeDisplay">0</span></label>
        <input type="range" id="explodeSlider" min="0" max="10" step="0.1" value="0">
    </div>

    <div class="panel">
        <div class="section-title">Visibility</div>
        <div class="toggle-row">
            <label><input type="checkbox" id="togBlock" checked onchange="toggleGroup('block',this.checked)"> Block</label>
            <label><input type="checkbox" id="togPistons" checked onchange="toggleGroup('pistons',this.checked)"> Pistons</label>
            <label><input type="checkbox" id="togCrank" checked onchange="toggleGroup('crank',this.checked)"> Crank</label>
            <label><input type="checkbox" id="togRods" checked onchange="toggleGroup('rods',this.checked)"> Rods</label>
            <label><input type="checkbox" id="togValves" checked onchange="toggleGroup('valves',this.checked)"> Valves</label>
            <label><input type="checkbox" id="togIntake" checked onchange="toggleGroup('intake',this.checked)"> Intake</label>
            <label><input type="checkbox" id="togExhaust" checked onchange="toggleGroup('exhaust',this.checked)"> Exhaust</label>
            <label><input type="checkbox" id="togTiming" checked onchange="toggleGroup('timing',this.checked)"> Timing</label>
        </div>
    </div>
</div>

<div id="info">Cyl 1: INTAKE (0°)</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- CONSTANTS & STATE ---
const R = 1.0;             // Crank radius
const L = 3.5;             // Rod length
const bore = 1.1;          // Piston radius
const zPositions = [-4.5, -1.5, 1.5, 4.5]; // Throw Z positions
const gammaL = Math.PI / 4;  // Left bank angle (45 deg)
const gammaR = -Math.PI / 4; // Right bank angle (-45 deg)
const phiPhases = [Math.PI/4, 3*Math.PI/4, 7*Math.PI/4, 5*Math.PI/4]; // Crossplane throw phases
const firingAngles = [0, 630, 270, 180, 450, 360, 540, 90]; // Firing order 1-8-4-3-6-5-7-2

const cylinders = [
    { id: 1, bank: 'L', throwIdx: 0, F: 0 },
    { id: 2, bank: 'R', throwIdx: 0, F: 630 },
    { id: 3, bank: 'L', throwIdx: 1, F: 270 },
    { id: 4, bank: 'R', throwIdx: 1, F: 180 },
    { id: 5, bank: 'L', throwIdx: 2, F: 450 },
    { id: 6, bank: 'R', throwIdx: 2, F: 360 },
    { id: 7, bank: 'L', throwIdx: 3, F: 540 },
    { id: 8, bank: 'R', throwIdx: 3, F: 90 },
];

const U_L = new THREE.Vector3(Math.sin(gammaL), Math.cos(gammaL), 0);
const V_L = new THREE.Vector3(Math.cos(gammaL), -Math.sin(gammaL), 0);
const U_R = new THREE.Vector3(Math.sin(gammaR), Math.cos(gammaR), 0);
const V_R = new THREE.Vector3(Math.cos(gammaR), -Math.sin(gammaR), 0);
const Y_AXIS = new THREE.Vector3(0, 1, 0);

let crankAngle = 0; 
let rpm = 700;
let isPaused = false;
let isManual = false;
let timeScale = 1.0;
let explodeAmount = 0;
let inspectCylinder = 1;

// --- MATERIALS ---
const MAT_BLOCK = new THREE.MeshStandardMaterial({ color: 0x333333, roughness: 0.8, metalness: 0.3, transparent: true, opacity: 0.35, side: THREE.DoubleSide });
const MAT_PISTON = new THREE.MeshStandardMaterial({ color: 0xdddddd, roughness: 0.2, metalness: 0.8 });
const MAT_ROD = new THREE.MeshStandardMaterial({ color: 0x777777, roughness: 0.3, metalness: 0.9 });
const MAT_CRANK = new THREE.MeshStandardMaterial({ color: 0x444444, roughness: 0.2, metalness: 0.9 });
const MAT_CAM = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.2, metalness: 0.9 });
const MAT_VALVE = new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.3, metalness: 0.8 });
const MAT_SPRING = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.6, metalness: 0.5 });
const MAT_INTAKE = new THREE.MeshStandardMaterial({ color: 0x999999, roughness: 0.4, metalness: 0.7 });
const MAT_EXHAUST = new THREE.MeshStandardMaterial({ color: 0x664422, roughness: 0.7, metalness: 0.6 });
const MAT_GEAR = new THREE.MeshStandardMaterial({ color: 0x555555, roughness: 0.5, metalness: 0.8 });
const MAT_INSPECT = new THREE.MeshStandardMaterial({ color: 0xff3300, emissive: 0xff0000, emissiveIntensity: 0.6, roughness: 0.2 });
const MAT_COMBUSTION = new THREE.MeshBasicMaterial({ color: 0xffaa00, transparent: true, opacity: 0.0, blending: THREE.AdditiveBlending, depthWrite: false });

// --- SCENE SETUP ---
let scene, camera, renderer, controls;
const clock = new THREE.Clock();

// Groups
let crankGroup, camGroups = {};
let engineGroups = {
    block: new THREE.Group(),
    pistons: new THREE.Group(),
    crank: new THREE.Group(),
    rods: new THREE.Group(),
    valves: new THREE.Group(),
    intake: new THREE.Group(),
    exhaust: new THREE.Group(),
    timing: new THREE.Group()
};
// Explode Groups
let explodeGroups = {
    headL: new THREE.Group(), headR: new THREE.Group(),
    timing: new THREE.Group(), flywheel: new THREE.Group(),
    intake: new THREE.Group(), exhaustL: new THREE.Group(), exhaustR: new THREE.Group()
};
explodeGroups.headL.userData.dir = U_L;
explodeGroups.headR.userData.dir = U_R;
explodeGroups.timing.userData.dir = new THREE.Vector3(0,0,-1);
explodeGroups.flywheel.userData.dir = new THREE.Vector3(0,0,1);
explodeGroups.intake.userData.dir = new THREE.Vector3(0,1,0);
explodeGroups.exhaustL.userData.dir = U_L.clone().negate().add(new THREE.Vector3(0,-1,0)).normalize();
explodeGroups.exhaustR.userData.dir = U_R.clone().negate().add(new THREE.Vector3(0,-1,0)).normalize();

// Dynamic Objects
let pistons = [], rods = [], valves = [], combustionLights = [], combustionMeshes = [];

function init() {
    scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.015);

    camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 200);
    camera.position.set(18, 12, 18);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    document.body.appendChild(renderer.domElement);

    controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.target.set(0, 2, 0);

    // Lighting
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444455, 0.6));
    let keyLight = new THREE.DirectionalLight(0xffffff, 2.0);
    keyLight.position.set(10, 20, 10);
    keyLight.castShadow = true;
    keyLight.shadow.mapSize.width = 2048;
    keyLight.shadow.mapSize.height = 2048;
    keyLight.shadow.camera.left = -15; keyLight.shadow.camera.right = 15;
    keyLight.shadow.camera.top = 15; keyLight.shadow.camera.bottom = -15;
    scene.add(keyLight);

    let fillLight = new THREE.DirectionalLight(0x88bbff, 0.8);
    fillLight.position.set(-10, 5, -15);
    scene.add(fillLight);

    // Floor
    let grid = new THREE.GridHelper(60, 60, 0x444444, 0x222222);
    grid.position.y = -8;
    scene.add(grid);

    // Build Engine
    buildBlock();
    buildCrankshaft();
    buildPistonsAndRods();
    buildValveTrain();
    buildTimingAndAccessories();
    buildIntakeExhaust();
    buildCombustion();

    // Attach groups to scene
    Object.values(engineGroups).forEach(g => scene.add(g));
    Object.values(explodeGroups).forEach(g => engineGroups.timing.parent ? null : scene.add(g)); 
    // Reparent specific parts to explode groups
    reparentForExplode();

    window.addEventListener('resize', onWindowResize);
    animate();
}

function reparentForExplode() {
    // Heads & Valves
    engineGroups.valves.children.forEach((v, idx) => {
        let cyl = cylinders[idx];
        let target = cyl.bank === 'L' ? explodeGroups.headL : explodeGroups.headR;
        target.add(v);
    });
    // Timing
    while(engineGroups.timing.children.length > 0) {
        explodeGroups.timing.add(engineGroups.timing.children[0]);
    }
    // Intake & Exhaust
    while(engineGroups.intake.children.length > 0) {
        explodeGroups.intake.add(engineGroups.intake.children[0]);
    }
    engineGroups.exhaust.children.forEach(ex => {
        if(ex.userData.bank === 'L') explodeGroups.exhaustL.add(ex);
        else explodeGroups.exhaustR.add(ex);
    });
}

function buildBlock() {
    let crankcase = new THREE.Mesh(new THREE.BoxGeometry(8, 4, 15), MAT_BLOCK);
    engineGroups.block.add(crankcase);
    
    // Bores
    cylinders.forEach(cyl => {
        let u = cyl.bank === 'L' ? U_L : U_R;
        let z = zPositions[cyl.throwIdx];
        let boreMesh = new THREE.Mesh(new THREE.CylinderGeometry(1.2, 1.2, 7, 32, 1, true), MAT_BLOCK);
        boreMesh.position.copy(u).multiplyScalar(4.0).add(new THREE.Vector3(0,0,z));
        boreMesh.quaternion.setFromUnitVectors(Y_AXIS, u);
        engineGroups.block.add(boreMesh);
    });
    
    // Main bearing caps
    for(let i=0; i<5; i++) {
        let z = -6.0 + i*3.0;
        let cap = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.6, 1.0), MAT_BLOCK);
        cap.position.set(0, -1.8, z);
        engineGroups.block.add(cap);
    }
}

function buildCrankshaft() {
    crankGroup = new THREE.Group();
    
    // Main journals
    for(let i=0; i<5; i++) {
        let main = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 1.2, 16), MAT_CRANK);
        main.rotation.x = Math.PI/2;
        main.position.z = -6.0 + i*3.0;
        crankGroup.add(main);
    }
    
    // Rod journals, webs, counterweights
    for(let t=0; t<4; t++) {
        let phi = phiPhases[t];
        let z = zPositions[t];
        
        // Rod journal
        let rodJ = new THREE.Mesh(new THREE.CylinderGeometry(0.5, 0.5, 2.0, 16), MAT_CRANK);
        rodJ.rotation.x = Math.PI/2;
        rodJ.position.set(R * Math.sin(phi), R * Math.cos(phi), z);
        crankGroup.add(rodJ);
        
        // Webs & Counterweights
        [-1.0, 1.0].forEach(side => {
            let webGroup = new THREE.Group();
            webGroup.rotation.z = -phi;
            webGroup.position.z = z + side;
            
            let web = new THREE.Mesh(new THREE.BoxGeometry(0.8, R + 1.8, 0.4), MAT_CRANK);
            web.position.y = (R - 1.8)/2; // Spans from -1.8 to R
            webGroup.add(web);
            
            crankGroup.add(webGroup);
        });
    }
    
    // Flywheel
    let flyGroup = new THREE.Group();
    flyGroup.position.z = 6.8;
    let fly = new THREE.Mesh(new THREE.CylinderGeometry(3.0, 3.0, 0.5, 64), MAT_CRANK);
    fly.rotation.x = Math.PI/2;
    flyGroup.add(fly);
    let ringGear = new THREE.Mesh(new THREE.TorusGeometry(3.0, 0.2, 8, 64), MAT_GEAR);
    flyGroup.add(ringGear);
    for(let i=0; i<8; i++) {
        let a = i * Math.PI/4;
        let bolt = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.6, 8), MAT_GEAR);
        bolt.rotation.x = Math.PI/2;
        bolt.position.set(1.5*Math.cos(a), 1.5*Math.sin(a), 0);
        flyGroup.add(bolt);
    }
    crankGroup.add(flyGroup);
    explodeGroups.flywheel.add(flyGroup);
    
    engineGroups.crank.add(crankGroup);
}

function buildPistonsAndRods() {
    cylinders.forEach((cyl, i) => {
        // Piston
        let pGroup = new THREE.Group();
        let crown = new THREE.Mesh(new THREE.CylinderGeometry(bore, bore, 1.5, 32), MAT_PISTON);
        pGroup.add(crown);
        for(let r=0; r<3; r++) {
            let ring = new THREE.Mesh(new THREE.TorusGeometry(bore+0.02, 0.04, 8, 32), MAT_GEAR);
            ring.rotation.x = Math.PI/2;
            ring.position.y = 0.5 - r*0.15;
            pGroup.add(ring);
        }
        pistons.push(pGroup);
        engineGroups.pistons.add(pGroup);
        
        // Rod
        let rGroup = new THREE.Group();
        let shank = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, L, 12), MAT_ROD);
        rGroup.add(shank);
        
        let bigEnd = new THREE.Mesh(new THREE.TorusGeometry(0.45, 0.15, 12, 24), MAT_ROD);
        bigEnd.rotation.x = Math.PI/2;
        bigEnd.position.y = -L/2 + 0.3;
        rGroup.add(bigEnd);
        
        let smallEnd = new THREE.Mesh(new THREE.TorusGeometry(0.25, 0.15, 12, 24), MAT_ROD);
        smallEnd.rotation.x = Math.PI/2;
        smallEnd.position.y = L/2 - 0.3;
        rGroup.add(smallEnd);
        
        rods.push(rGroup);
        engineGroups.rods.add(rGroup);
    });
}

function createSpring() {
    let pts = [];
    for(let i=0; i<=60; i++) {
        let t = i/60;
        let angle = t * Math.PI * 2 * 8;
        pts.push(new THREE.Vector3(0.22 * Math.cos(angle), t * 0.6, 0.22 * Math.sin(angle)));
    }
    let curve = new THREE.CatmullRomCurve3(pts);
    return new THREE.Mesh(new THREE.TubeGeometry(curve, 120, 0.035, 6, false), MAT_SPRING);
}

function createLobe() {
    let shape = new THREE.Shape();
    for(let i=0; i<=32; i++) {
        let a = (i/32) * Math.PI * 2;
        let r = 0.4 + 0.4 * Math.pow(Math.max(0, Math.sin(a)), 4);
        if(i===0) shape.moveTo(r*Math.cos(a), r*Math.sin(a)); 
        else shape.lineTo(r*Math.cos(a), r*Math.sin(a));
    }
    let geom = new THREE.ExtrudeGeometry(shape, { depth: 0.3, bevelEnabled: false });
    geom.translate(0, 0, -0.15);
    return geom;
}

const LOBE_GEOM = createLobe();

function buildValveTrain() {
    // Camshafts
    ['L','R'].forEach(bank => {
        let cam = new THREE.Group();
        let u = bank === 'L' ? U_L : U_R;
        cam.position.copy(u).multiplyScalar(7.4);
        
        let shaft = new THREE.Mesh(new THREE.CylinderGeometry(0.2, 0.2, 14, 16), MAT_CAM);
        shaft.rotation.x = Math.PI/2;
        cam.add(shaft);
        
        let gamma = bank === 'L' ? gammaL : gammaR;
        cylinders.forEach(c => {
            if(c.bank !== bank) return;
            let F_rad = c.F * Math.PI / 180;
            
            // Intake lobe
            let betaInt = gamma + Math.PI - (F_rad + Math.PI/2)/2;
            let lobeInt = new THREE.Mesh(LOBE_GEOM, MAT_CAM);
            lobeInt.position.set(0, 0, zPositions[c.throwIdx]);
            lobeInt.rotation.z = -betaInt;
            
            // Exhaust lobe
            let betaEx = gamma + Math.PI - (F_rad + 630 * Math.PI/180)/2;
            let lobeEx = new THREE.Mesh(LOBE_GEOM, MAT_CAM);
            lobeEx.position.set(0, 0, zPositions[c.throwIdx]);
            lobeEx.rotation.z = -betaEx;
            
            // Lateral offsets for SOHC design
            let v = bank === 'L' ? V_L : V_R;
            let offsetGroupInt = new THREE.Group();
            offsetGroupInt.position.copy(v).multiplyScalar(0.5);
            offsetGroupInt.add(lobeInt);
            cam.add(offsetGroupInt);
            
            let offsetGroupEx = new THREE.Group();
            offsetGroupEx.position.copy(v).multiplyScalar(-0.5);
            offsetGroupEx.add(lobeEx);
            cam.add(offsetGroupEx);
        });
        
        camGroups[bank] = cam;
        (bank==='L' ? explodeGroups.headL : explodeGroups.headR).add(cam);
    });

    // Valves & Springs
    cylinders.forEach((c, i) => {
        let u = c.bank === 'L' ? U_L : U_R;
        let v = c.bank === 'L' ? V_L : V_R;
        let z = zPositions[c.throwIdx];
        
        let vPair = { intakeMesh: null, exhaustMesh: null, intakeSpring: null, exhaustSpring: null, intakeRetainer: null, exhaustRetainer: null };
        
        [1, -1].forEach((side, sIdx) => {
            let vGroup = new THREE.Group();
            vGroup.position.copy(u).multiplyScalar(6.2).add(v.clone().multiplyScalar(side*0.5)).add(new THREE.Vector3(0,0,z));
            vGroup.quaternion.setFromUnitVectors(Y_AXIS, u);
            
            let valveMesh = new THREE.Group();
            let stem = new THREE.Mesh(new THREE.CylinderGeometry(0.08, 0.08, 1.2, 12), MAT_VALVE);
            stem.position.y = 0.2; // from -0.4 to 0.8
            valveMesh.add(stem);
            let headMesh = new THREE.Mesh(new THREE.CylinderGeometry(0.45, 0.25, 0.15, 16), MAT_VALVE);
            headMesh.position.y = -0.45;
            valveMesh.add(headMesh);
            vGroup.add(valveMesh);
            
            let spring = createSpring();
            vGroup.add(spring);
            
            let retainer = new THREE.Mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.1, 16), MAT_VALVE);
            retainer.position.y = 0.6;
            vGroup.add(retainer);
            
            if(sIdx === 0) {
                vPair.intakeMesh = valveMesh; vPair.intakeSpring = spring; vPair.intakeRetainer = retainer;
            } else {
                vPair.exhaustMesh = valveMesh; vPair.exhaustSpring = spring; vPair.exhaustRetainer = retainer;
            }
            engineGroups.valves.add(vGroup);
        });
        valves.push(vPair);
    });
}

function makeBelt(c1, r1, c2, r2, z) {
    let dir = new THREE.Vector2(c2.x - c1.x, c2.y - c1.y).normalize();
    let perp = new THREE.Vector2(-dir.y, dir.x);
    let p1 = new THREE.Vector3(c1.x + perp.x*r1, c1.y + perp.y*r1, z);
    let p2 = new THREE.Vector3(c2.x + perp.x*r2, c2.y + perp.y*r2, z);
    let p3 = new THREE.Vector3(c2.x - perp.x*r2, c2.y - perp.y*r2, z);
    let p4 = new THREE.Vector3(c1.x - perp.x*r1, c1.y - perp.y*r1, z);
    let curve = new THREE.CatmullRomCurve3([p1, p2, p3, p4], true, 'catmullrom', 0.5);
    return new THREE.Mesh(new THREE.TubeGeometry(curve, 100, 0.12, 8, true), MAT_GEAR);
}

function buildTimingAndAccessories() {
    let zFront = -7.0;
    // Crank gear
    let crankGear = new THREE.Mesh(new THREE.CylinderGeometry(0.8, 0.8, 0.3, 32), MAT_GEAR);
    crankGear.rotation.x = Math.PI/2;
    crankGear.position.z = zFront;
    crankGear.userData.isGear = true;
    engineGroups.timing.add(crankGear);
    
    ['L','R'].forEach(bank => {
        let u = bank === 'L' ? U_L : U_R;
        let center = u.clone().multiplyScalar(7.4);
        
        let camGear = new THREE.Mesh(new THREE.CylinderGeometry(1.6, 1.6, 0.3, 32), MAT_GEAR);
        camGear.rotation.x = Math.PI/2;
        camGear.position.set(center.x, center.y, zFront);
        camGear.userData.isGear = true;
        engineGroups.timing.add(camGear);
        
        // Belt
        let belt = makeBelt(new THREE.Vector2(0,0), 0.8, new THREE.Vector2(center.x, center.y), 1.6, zFront);
        engineGroups.timing.add(belt);
    });
    
    // Crank Pulley
    let pulley = new THREE.Mesh(new THREE.CylinderGeometry(1.5, 1.5, 0.4, 32), MAT_GEAR);
    pulley.rotation.x = Math.PI/2;
    pulley.position.z = -7.8;
    pulley.userData.isGear = true;
    engineGroups.timing.add(pulley);
}

function buildIntakeExhaust() {
    // Plenum
    let plenum = new THREE.Mesh(new THREE.BoxGeometry(5, 2, 12), MAT_INTAKE);
    plenum.position.set(0, 11.5, 0);
    engineGroups.intake.add(plenum);
    
    cylinders.forEach(c => {
        let u = c.bank === 'L' ? U_L : U_R;
        let v = c.bank === 'L' ? V_L : V_R;
        let z = zPositions[c.throwIdx];
        
        // Runner
        let start = new THREE.Vector3(0, 10.5, z);
        let end = u.clone().multiplyScalar(7.2).add(new THREE.Vector3(0,0,z));
        let mid = end.clone().lerp(start, 0.5).add(new THREE.Vector3(0, 0.5, 0));
        let curve = new THREE.CatmullRomCurve3([start, mid, end]);
        let runner = new THREE.Mesh(new THREE.TubeGeometry(curve, 32, 0.5, 12, false), MAT_INTAKE);
        engineGroups.intake.add(runner);
        
        // Header
        let hStart = u.clone().multiplyScalar(7.2).add(v.clone().multiplyScalar(c.bank==='L'?0.5:-0.5)).add(new THREE.Vector3(0,0,z));
        let hMid1 = u.clone().multiplyScalar(9).add(new THREE.Vector3(0, 2, z));
        let hEnd = new THREE.Vector3(c.bank==='L'?7:-7, -4, 0);
        let hCurve = new THREE.CatmullRomCurve3([hStart, hMid1, hEnd]);
        let header = new THREE.Mesh(new THREE.TubeGeometry(hCurve, 32, 0.35, 12, false), MAT_EXHAUST);
        header.userData.bank = c.bank;
        engineGroups.exhaust.add(header);
    });
}

function buildCombustion() {
    cylinders.forEach(c => {
        let u = c.bank === 'L' ? U_L : U_R;
        let z = zPositions[c.throwIdx];
        let pos = u.clone().multiplyScalar(6.0).add(new THREE.Vector3(0,0,z));
        
        let light = new THREE.PointLight(0xff5500, 0, 8);
        light.position.copy(pos);
        engineGroups.block.add(light); // keep at origin relative to block
        combustionLights.push(light);
        
        let mesh = new THREE.Mesh(new THREE.SphereGeometry(0.8, 16, 16), MAT_COMBUSTION.clone());
        mesh.position.copy(pos);
        engineGroups.block.add(mesh);
        combustionMeshes.push(mesh);
    });
}

// --- MATH & UPDATE ---
function getLift(C, openAngle, duration, maxLift) {
    let d = (C - openAngle + 720) % 720;
    if (d > 0 && d < duration) return Math.sin((d / duration) * Math.PI) * maxLift;
    return 0;
}

function getStroke(C) {
    if(C < 180) return 'INTAKE';
    if(C < 360) return 'COMPRESSION';
    if(C < 540) return 'POWER';
    return 'EXHAUST';
}

function updateMechanics() {
    let crankRad = crankAngle * Math.PI / 180;
    crankGroup.rotation.z = -crankRad;
    let camRad = crankRad / 2;
    
    if(camGroups['L']) camGroups['L'].rotation.z = -camRad;
    if(camGroups['R']) camGroups['R'].rotation.z = -camRad;
    
    // Rotate gears visually
    engineGroups.timing.children.forEach(child => {
        if(child.userData.isGear) {
            if(child.geometry.parameters.radiusTop === 0.8 || child.geometry.parameters.radiusTop === 1.5) {
                child.rotation.z = -crankRad;
            } else {
                child.rotation.z = -camRad;
            }
        }
    });
    
    cylinders.forEach((cyl, i) => {
        let u = cyl.bank === 'L' ? U_L : U_R;
        let v = cyl.bank === 'L' ? V_L : V_R;
        let gamma = cyl.bank === 'L' ? gammaL : gammaR;
        let z = zPositions[cyl.throwIdx];
        
        let theta_pin = crankRad + phiPhases[cyl.throwIdx];
        let pc = new THREE.Vector3(R * Math.sin(theta_pin), R * Math.cos(theta_pin), z);
        
        let s = R * Math.cos(theta_pin - gamma);
        let x = R * Math.sin(theta_pin - gamma);
        let underSqrt = L*L - x*x;
        if(underSqrt < 0) underSqrt = 0;
        let D = s + Math.sqrt(underSqrt);
        
        let pw = u.clone().multiplyScalar(D).add(new THREE.Vector3(0, 0, z));
        
        // Piston
        let p = pistons[i];
        p.position.copy(pw);
        p.quaternion.setFromUnitVectors(Y_AXIS, u);
        
        // Rod
        let r = rods[i];
        r.position.copy(pc).add(pw).multiplyScalar(0.5);
        r.quaternion.setFromUnitVectors(Y_AXIS, pw.clone().sub(pc).normalize());
        
        // Cycle & Valves
        let C = (crankAngle - cyl.F + 720) % 720;
        let intLift = getLift(C, -10, 200, 0.4);
        let exhLift = getLift(C, 530, 200, 0.4);
        
        let vp = valves[i];
        vp.intakeMesh.position.y = -intLift;
        vp.exhaustMesh.position.y = -exhLift;
        vp.intakeSpring.scale.y = (0.6 - intLift)/0.6;
        vp.exhaustSpring.scale.y = (0.6 - exhLift)/0.6;
        vp.intakeRetainer.position.y = 0.6 - intLift;
        vp.exhaustRetainer.position.y = 0.6 - exhLift;
        
        // Combustion
        let combust = 0;
        if (C >= 360 && C <= 450) {
            combust = Math.max(0, 1 - (C - 360)/90);
        }
        combustionLights[i].intensity = combust * 30;
        combustionMeshes[i].material.opacity = combust * 0.8;
        combustionMeshes[i].scale.setScalar(1 + combust * 0.5);
        
        // Inspection
        let mat = (inspectCylinder > 0 && inspectCylinder === cyl.id) ? MAT_INSPECT : null;
        p.children.forEach(m => m.material = mat || MAT_PISTON);
        r.children.forEach(m => m.material = mat || MAT_ROD);
        
        if (inspectCylinder === cyl.id) {
            document.getElementById('info').innerText = `Cyl ${cyl.id}: ${getStroke(C)} (${Math.round(C)}°)`;
        }
    });
}

// --- ANIMATION LOOP ---
function animate() {
    requestAnimationFrame(animate);
    let dt = clock.getDelta();
    
    if (!isPaused && !isManual) {
        let degPerSec = rpm * 6 * timeScale;
        crankAngle = (crankAngle + degPerSec * dt) % 720;
        document.getElementById('crankSlider').value = crankAngle;
    } else if (isManual) {
        crankAngle = parseFloat(document.getElementById('crankSlider').value);
    }
    
    document.getElementById('rpmDisplay').innerText = Math.round(rpm);
    document.getElementById('angleDisplay').innerText = Math.round(crankAngle);
    
    updateMechanics();
    controls.update();
    renderer.render(scene, camera);
}

// --- UI HANDLERS ---
function onWindowResize() {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
}

function setRPM(val) { rpm = val; document.getElementById('rpmSlider').value = val; }
document.getElementById('rpmSlider').oninput = e => rpm = parseFloat(e.target.value);

function setRunMode(manual) {
    isManual = manual;
    document.getElementById('btnManual').className = manual ? 'active' : '';
    document.getElementById('btnRun').className = !manual ? 'active' : '';
}
function togglePause() { isPaused = !isPaused; document.getElementById('btnPause').className = isPaused ? 'active' : ''; }
function setSpeed(s) { 
    timeScale = s; 
    document.querySelectorAll('.speedBtn').forEach(b => b.className = 'speedBtn' + (parseFloat(b.dataset.speed)===s?' active':''));
}
document.getElementById('crankSlider').oninput = () => { if(!isManual) setRunMode(true); };

function setCamera(preset) {
    const presets = {
        HERO: { pos: [18, 12, 18], target: [0,2,0] },
        FRONT: { pos: [0, 5, -22], target: [0,2,0] },
        SIDE: { pos: [22, 5, 0], target: [0,2,0] },
        TOP: { pos: [0, 25, 0.1], target: [0,0,0] },
        INTERNAL: { pos: [6, 4, 6], target: [0,2,0] }
    };
    camera.position.set(...presets[preset].pos);
    controls.target.set(...presets[preset].target);
    controls.update();
}

function setInspect(val) { inspectCylinder = val; if(val===0) document.getElementById('info').innerText = 'Select cylinder to inspect'; }

document.getElementById('explodeSlider').oninput = e => {
    explodeAmount = parseFloat(e.target.value);
    document.getElementById('explodeDisplay').innerText = explodeAmount.toFixed(1);
    Object.values(explodeGroups).forEach(g => g.position.copy(g.userData.dir).multiplyScalar(explodeAmount));
};

function toggleGroup(name, visible) {
    if(name === 'timing') {
        explodeGroups.timing.visible = visible;
    } else if (name === 'valves') {
        engineGroups.valves.visible = visible;
    } else if (name === 'intake') {
        explodeGroups.intake.visible = visible;
    } else if (name === 'exhaust') {
        explodeGroups.exhaustL.visible = visible;
        explodeGroups.exhaustR.visible = visible;
    } else {
        engineGroups[name].visible = visible;
    }
}

init();
</script>
