<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SERVER ARCHITECTURE LAB</title>
<style>
:root{--bg:#0b0e13;--panel:#12161d;--panel2:#171c25;--line:#26303d;--txt:#c9d4e0;--dim:#6f7d8f;--acc:#4da3ff;--grn:#39d97e;--amb:#ffb454;--red:#ff5d5d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg);font-family:'Segoe UI',Arial,sans-serif;color:var(--txt)}
#c{position:fixed;inset:0;display:block}
#topbar{position:fixed;top:0;left:0;right:0;height:42px;background:rgba(12,15,20,.92);border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:18px;z-index:20;backdrop-filter:blur(6px)}
#topbar h1{font-size:15px;letter-spacing:3px;color:#eef4fb;font-weight:700}
#topbar .sub{font-size:10px;color:var(--dim);letter-spacing:1px}
.stat{font-size:11px;color:var(--dim);margin-left:auto}
.stat b{color:var(--txt);font-weight:600;margin-right:6px}
.stat span{margin-right:14px}
.stat span:last-child{margin-right:0}
.panel{position:fixed;background:rgba(16,20,27,.93);border:1px solid var(--line);border-radius:10px;z-index:15;backdrop-filter:blur(8px);overflow:hidden}
#left{left:12px;top:52px;width:230px;max-height:calc(100% - 130px);overflow-y:auto;padding:10px}
#right{right:12px;top:52px;width:330px;max-height:calc(100% - 130px);overflow-y:auto;padding:12px}
#bottombar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:20;background:rgba(12,15,20,.92);padding:8px;border-radius:12px;border:1px solid var(--line);flex-wrap:wrap;justify-content:center;max-width:96vw}
h2.pt{font-size:10px;letter-spacing:2px;color:var(--dim);border-bottom:1px solid var(--line);padding:6px 0 5px;margin-bottom:6px;text-transform:uppercase}
.srv{display:block;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:6px;color:var(--txt);padding:5px 7px;margin:3px 0;cursor:pointer;font-size:11px}
.srv:hover{background:#1c2330}
.srv.sel{background:#18243a;border-color:var(--acc)}
.srv .nm{font-weight:600;font-size:11px}
.srv .meta{color:var(--dim);font-size:10px;margin-top:2px}
.chip{display:inline-block;font-size:8px;padding:1px 5px;border-radius:8px;border:1px solid var(--line);color:var(--dim);margin-right:4px}
button.t{background:#1a212d;color:var(--txt);border:1px solid #2b3646;border-radius:7px;padding:6px 10px;font-size:10px;letter-spacing:.5px;cursor:pointer;font-weight:600;white-space:nowrap}
button.t:hover{border-color:var(--acc);color:#fff}
button.t.on{background:#17324f;border-color:var(--acc);color:#9fd0ff}
button.t:disabled{opacity:.35;cursor:default}
#selName{font-size:15px;font-weight:700;color:#eef4fb;letter-spacing:.5px}
#selSub{font-size:10px;color:var(--acc);margin:3px 0 8px;letter-spacing:1px}
table.spec{width:100%;font-size:11px;border-collapse:collapse}
table.spec td{padding:3px 2px;border-bottom:1px solid #1c242f}
table.spec td:first-child{color:var(--dim);width:44%}
.hrow{display:flex;justify-content:space-between;font-size:11px;padding:2.5px 0;border-bottom:1px dashed #1e2733}
.hrow .v{font-variant-numeric:tabular-nums;color:#e6edf5}
.bar{height:4px;background:#1d2530;border-radius:2px;overflow:hidden;margin:3px 0 6px}
.bar i{display:block;height:100%;background:linear-gradient(90deg,#2f6f4f,var(--grn))}
.warn{color:var(--amb);font-size:11px;margin-top:6px;min-height:14px}
.err{color:var(--red);font-size:11px;margin-top:6px;min-height:14px}
.phys{color:var(--txt);font-size:10px;background:#161d27;border:1px solid #222d3b;border-radius:6px;padding:6px;margin-top:6px;line-height:1.5}
.cmp{margin-top:6px}
.cmp .row{display:flex;align-items:center;font-size:10px;margin:4px 0;gap:6px}
.cmp .row .nm{width:120px;color:#aeb9c6;flex:none}
.cmp .row .tr{flex:1;height:6px;background:#1c242f;border-radius:3px;overflow:hidden}
.cmp .row .tr i{display:block;height:100%;background:var(--acc)}
.cmp .row .v{width:24px;text-align:right;color:var(--dim)}
.mini{font-size:9px;color:var(--dim);letter-spacing:.5px;margin-top:4px}
.tag{display:inline-block;background:#13202e;border:1px solid #27415c;color:#7fc0ff;border-radius:4px;padding:1px 6px;font-size:9px;margin:2px 2px 0 0}
#compInfo{background:#0f151d;border:1px solid var(--line);border-radius:6px;padding:7px;margin-top:8px;min-height:52px;font-size:10.5px;line-height:1.55}
#compInfo h4{color:var(--acc);font-size:11px;margin-bottom:3px}
#hint{position:fixed;bottom:78px;right:12px;font-size:10px;color:var(--dim);z-index:10;text-align:right}
::-webkit-scrollbar{width:6px}::-webkit-scrollbar-thumb{background:#26303d;border-radius:3px}
.badge{font-size:9px;color:var(--grn);border:1px solid #1d4a30;border-radius:4px;padding:1px 5px;margin-left:5px}
</style>
</head>

let camTween=null;
function tweenCam(pos,tgt,dur){camTween={p0:camera.position.clone(),t0:controls.target.clone(),p1:pos.clone(),t1:tgt.clone(),t:0,dur:dur||1.1};}
function applyMode(newMode){
 if(newMode==='slice'&&mode!=='slice'){
   mode='slice';
   document.getElementById('bReturn').style.display='inline-block';
   document.getElementById('bRack').style.display='none';
   document.getElementById('bSlice').style.display='none';
   const s=servers[selIdx];
   const worldPos=new THREE.Vector3();s.group.getWorldPosition(worldPos);
   scene.add(s.group);s.group.position.set(worldPos.x,worldPos.y,worldPos.z);
   s.group.rotation.set(0,0,0);
   s.group.scale.set(1,1,1);
   // animate out
   const targetPos=new THREE.Vector3(0,0.24,0);
   const start=s.group.position.clone();
   let t=0;const dur=1.4;
   (function step(){t+=0.016;const k=Math.min(1,t/dur);const e=1-Math.pow(1-k,3);
     s.group.position.set(start.x+(targetPos.x-start.x)*e,start.y+(targetPos.y-start.y)*e,start.z+(targetPos.z-start.z)*e);
     s.group.position.z=start.z+0.55*Math.min(1,t/dur);
     if(t<dur)requestAnimationFrame(step);}
   )();
   rackFade=1;
   fadeRackSeq(0.10);
   tweenCam(new THREE.Vector3(1.55,1.05,1.85),new THREE.Vector3(0,0.24,0),1.3);
   // explode at end? no. cover open
   setTimeout(()=>{setCover(true);},900);
   initAirflow();initPower();initData();
 } else if(newMode==='rack'&&mode!=='rack'){
   mode='rack';
   document.getElementById('bReturn').style.display='none';
   document.getElementById('bRack').style.display='inline-block';
   document.getElementById('bSlice').style.display='inline-block';
   const s=servers[selIdx];
   setCover(false);setExplode(false);setAirflow(false);setPower(false);setData(false);
   fadeRackSeq(1);
   scene.remove(s.group);
   serversRoot.add(s.group);
   s.group.position.set(0,s.spec.baseY,0);
   s.group.rotation.set(0,0,0);
   tweenCam(new THREE.Vector3(2.5,2.3,3.1),new THREE.Vector3(0,0.98,0),1.2);
 }
 updateModeButtons();
}
let rackFade=1,rackFadeTarget=1;
function fadeRackSeq(v){rackFadeTarget=v;}
function updateModeButtons(){document.getElementById('bSlice').disabled=mode!=='rack'||!servers[selIdx];}

// camera presets
function rackPreset(name){
 if(mode!=='rack')return;
 const map={front:[[0,1.1,3.4],[0,0.95,0]],threeq:[[2.5,2.3,3.1],[0,0.98,0]],side:[[3.3,1.2,0.05],[0,0.98,0]],rear:[[0,1.2,-3.4],[0,0.98,0]]};
 const m=map[name];if(!m)return;
 tweenCam(new THREE.Vector3(...m[0]),new THREE.Vector3(...m[1]),1.0);
}
function slicePreset(name){
 const s=servers[selIdx];const h=s.hl.h;
 const map={whole:[[1.4,1.0,1.8],[0,0.22,0]],top:[[0.02,1.7,0.35],[0,0.22,0]],threeq:[[1.3,0.85,1.55],[0,0.22,0]],front:[[0,0.75,1.9],[0,0.2,0]],rear:[[0,0.85,-1.9],[0,0.2,0]],cpu:[[0.85,0.75,1.15],[0,0.28,0]],gpu:[[0.9,0.75,1.3],[0,0.22,0]],storage:[[1.0,0.85,1.4],[0,0.2,0]]};
 const m=map[name];if(!m)return;
 tweenCam(new THREE.Vector3(...m[0]),new THREE.Vector3(...m[1]),1.0);
}
window.rackPreset=rackPreset;window.slicePreset=slicePreset;

// cover
let coverTween=null;
function setCover(open){
 coverOpen=open;coverTarget=open?1:0;
 document.getElementById('bCover').textContent=open?'CLOSE COVER':'OPEN COVER';
 document.getElementById('bCover').classList.toggle('on',open);
 setHealthRefresh();
}
function coverLerp(){
 coverT+=(coverTarget-coverT)*0.12;
 const s=servers[selIdx];if(!s||!s.hl.parts.cover)return;
 s.hl.parts.cover.position.set(0,coverT*0.5,-coverT*0.55);
 s.hl.parts.cover.rotation.x=coverT*0.32;
}

// exploded
function setExplode(ex){exploded=ex;explodeTarget=ex?1:0;document.getElementById('bExpl').classList.toggle('on',ex);document.getElementById('bExpl').textContent=ex?'COLLAPSE':'EXPLODE';}
function explodeLerp(){
 explodeT+=(explodeTarget-explodeT)*0.1;
 const s=servers[selIdx];if(!s)return;
 const off=explodeT;
 if(s.hl.parts.cover&&coverOpen){s.hl.parts.cover.position.y+=off*0.22;}
 if(s.hl.parts.fans)s.hl.parts.fans.position.y=off*0.16;
 if(s.hl.parts.gpu)s.hl.parts.gpu.position.y=off*0.34;
 if(s.hl.parts.cpus)s.hl.parts.cpus.position.y=off*0.18;
 if(s.hl.parts.dimm)s.hl.parts.dimm.position.y=off*0.26;
 if(s.hl.parts.storage)s.hl.parts.storage.position.y=off*0.08;
 if(s.hl.parts.board)s.hl.parts.board.position.y=-off*0.1;
 if(s.hl.parts.psu)s.hl.parts.psu.position.y=off*-0.14;
 if(s.hl.parts.nic)s.hl.parts.nic.position.y=off*0.2;
}

// cutaway
function setCutaway(v){cutaway=v;document.getElementById('bCut').classList.toggle('on',v);
 const s=servers[selIdx];if(!s)return;
 const mats=new Set();
 s.group.traverse(o=>{if(o.isMesh&&o.material&&!o.material.transparent&&(o.material.color&&(o.material.color.getHex()===0x232a34||o.material.color.getHex()===0x39434f||o.material.color.getHex()===0x1b212a)))mats.add(o.material);});
 mats.forEach(m=>{m.transparent=v;m.opacity=v?0.18:1;});
}
// store original materials for cutaway
const cutawayMats=new Map();

// airflow / power / data groups
let airGroup=null,powerGroup=null,dataGroup=null;
function initAirflow(){
 clearFx(airGroup);airGroup=new THREE.Group();const s=servers[selIdx];
 const N=340;const pos=new Float32Array(N*3);const spd=new Float32Array(N);
 for(let i=0;i<N;i++){pos[i*3]=(Math.random()-0.5)*0.36;pos[i*3+1]=(Math.random())*s.hl.h*0.85+0.01;pos[i*3+2]=0.36+Math.random()*-0.72;spd[i]=0.10+Math.random()*0.14;}
 const geo=new THREE.BufferGeometry();geo.setAttribute('position',new THREE.BufferAttribute(pos,3));
 const mat=new THREE.PointsMaterial({color:0x66c4ff,size:0.008,transparent:true,opacity:0.75,blending:THREE.AdditiveBlending,depthWrite:false});
 const pts=new THREE.Points(geo,mat);pts.userData={spd,N,base:pos.slice()};
 airGroup.add(pts);s.group.add(airGroup);airGroup.visible=false;
}
function initPower(){
 clearFx(powerGroup);powerGroup=new THREE.Group();const s=servers[selIdx];
 const mat=new THREE.MeshStandardMaterial({color:0x3a2208,emissive:0xff8c2e,emissiveIntensity:1.6,transparent:true,opacity:0.9});
 const psu=s.hl.parts.psu;
 s.hl.components.filter(c=>c.name.startsWith('PSU')).slice(0,2).forEach((c,i)=>{
  const p0=new THREE.Vector3(c.mesh.position.x,c.mesh.position.y,-0.3);
  const p1=new THREE.Vector3(0,s.hl.h*0.4,-0.03);
  const curve=new THREE.CatmullRomCurve3([p0,new THREE.Vector3(c.mesh.position.x*0.5,s.hl.h*0.5,-0.15),p1]);
  const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,12,0.008,6),mat);powerGroup.add(tube);
 });
 const curve=new THREE.CatmullRomCurve3([new THREE.Vector3(0,s.hl.h*0.4,-0.03),new THREE.Vector3(0,s.hl.h*0.5,0.05)]);
 powerGroup.add(new THREE.Mesh(new THREE.TubeGeometry(curve,8,0.008,6),mat));
 powerGroup.visible=false;s.group.add(powerGroup);
}
function initData(){
 clearFx(dataGroup);dataGroup=new THREE.Group();const s=servers[selIdx];
 const mat=new THREE.MeshStandardMaterial({color:0x052a14,emissive:0x2ee06e,emissiveIntensity:1.6,transparent:true,opacity:0.9});
 const a=s.spec.arch;
 if(a.gpus>0){
  for(let i=0;i<2;i++){const c=new THREE.CatmullRomCurve3([new THREE.Vector3(0.1,s.hl.h*0.45,0),new THREE.Vector3(0.15,s.hl.h*0.5,0.3)]);
  dataGroup.add(new THREE.Mesh(new THREE.TubeGeometry(c,8,0.007,6),mat));}
 }else if(a.drives>0){
  const c=new THREE.CatmullRomCurve3([new THREE.Vector3(0,s.hl.h*0.35,0.1),new THREE.Vector3(0.1,s.hl.h*0.4,-0.12)]);
  dataGroup.add(new THREE.Mesh(new THREE.TubeGeometry(c,8,0.007,6),mat));
 } else {
  const c=new THREE.CatmullRomCurve3([new THREE.Vector3(0,s.hl.h*0.4,0.12),new THREE.Vector3(0.08,s.hl.h*0.45,0.31)]);
  dataGroup.add(new THREE.Mesh(new THREE.TubeGeometry(c,8,0.007,6),mat));
 }
 dataGroup.visible=false;s.group.add(dataGroup);
}
function clearFx(g){if(!g)return;g.parent&&g.parent.remove(g);}
function setAirflow(v){airflow=v;if(airGroup)airGroup.visible=v;document.getElementById('bAir').classList.toggle('on',v);}
function setPower(v){powerPaths=v;if(powerGroup)powerGroup.visible=v;document.getElementById('bPow').classList.toggle('on',v);}
function setData(v){dataPaths=v;if(dataGroup)dataGroup.visible=v;document.getElementById('bData').classList.toggle('on',v);}
function setHealthRefresh(){if(mode==='slice'){setCover(coverOpen);}}
function switchSliceTo(i,animate){
 const old=servers[selIdx];const s=servers[i];selIdx=i;
 if(!s)return;
 // hide old fx
 if(old&&old!==s){if(airGroup)airGroup.visible=false;if(powerGroup)powerGroup.visible=false;if(dataGroup)dataGroup.visible=false;clearFx(airGroup);clearFx(powerGroup);clearFx(dataGroup);}
 renderList();renderRight();
 if(mode==='slice'){
   const grpStart=s.group.position.clone();
   const targetPos=new THREE.Vector3(0,0.24,0);
   let t=0;const dur=0.7;
   (function step(){t+=0.016;const k=Math.min(1,t/dur);const e=1-Math.pow(1-k,3);
    s.group.position.set(grpStart.x+(targetPos.x-grpStart.x)*e,grpStart.y+(targetPos.y-grpStart.y)*e,grpStart.z+(targetPos.z-grpStart.z)*e);
    if(t<dur)requestAnimationFrame(step);})();
   setCover(coverOpen);setExplode(exploded);setCutaway(cutaway);initAirflow();initPower();initData();setAirflow(airflow);setPower(powerPaths);setData(dataPaths);
   if(airflow&&airGroup)airGroup.visible=true;
 }
 highlightServer(s.group,true);
}
function highlightServer(g,on){/* servers always highlighted in view */}
// cover open default after slice
function selectAndEnterSlice(){if(mode==='rack'){applyMode('slice');}}

// ============ FAILURES ============
const failPanel=document.createElement('div');
failPanel.className='panel';failPanel.style.cssText='top:52px;left:250px;width:300px;padding:10px;display:none';
failPanel.innerHTML=`<h2 class="pt">FAILURE SIMULATION</h2>
 <button class="t" data-f="fan">FAN FAILURE</button>
 <button class="t" data-f="psu">PSU FAILURE</button>
 <button class="t" data-f="drive">DRIVE FAILURE</button>
 <button class="t" data-f="gpu">GPU OVERHEAT</button>
 <button class="t" data-f="net">NETWORK LINK FAILURE</button>
 <div class="mini">Redundancy absorbs single failures. Disabled module shows offline LED; healthy modules carry load. This is why enterprise servers use hot-swap redundancy.</div>`;
document.body.appendChild(failPanel);
failPanel.querySelectorAll('button').forEach(b=>b.onclick=()=>{const f=b.dataset.f;failures[f]=!failures[f];b.classList.toggle('on',failures[f]);renderRight();syncFailureVisuals();});

function syncFailureVisuals(){
 const s=servers[selIdx];if(!s)return;
 // fan failure: first fan LED red, blades stop
 s.hl.fans.forEach((f,i)=>{
   if(failures.fan&&i===0){f.speed=0;f.ledRed=true;}
   else if(failures.fan&&i!==0)f.speed=0.32;
   else{f.speed=0.2;f.ledRed=false;}
 });
}
function forceFailureVisuals(){
 // reset all LEDs
 const s=servers[selIdx];if(!s)return;
 s.hl.fans.forEach(f=>{f.ledRed=false;});
}

// ============ INIT UI ============
const btn=id=>document.getElementById(id);
btn('bRack').onclick=()=>applyMode('rack');
btn('bSlice').onclick=()=>applyMode('slice');
btn('bReturn').onclick=()=>applyMode('rack');
document.getElementById('bottombar').addEventListener('click',e=>{
 const b=e.target.closest('button');if(!b)return;
 switch(b.id){
  case 'bCover':setCover(!coverOpen);break;
  case 'bCut':setCutaway(!cutaway);break;
  case 'bExpl':setExplode(!exploded);break;
  case 'bAir':setAirflow(!airflow);break;
  case 'bPow':setPower(!powerPaths);break;
  case 'bData':setData(!dataPaths);break;
  case 'bCompare':compareOpen=!compareOpen;comparePanel.style.display=compareOpen?'block':'none';b.classList.toggle('on',compareOpen);break;
  case 'bFail':failOpen=!failOpen;failPanel.style.display=failOpen?'block':'none';b.classList.toggle('on',failOpen);break;
  case 'bReset':resetApp();break;
  case 'bPrev':selectServer((selIdx-1+servers.length)%servers.length);break;
  case 'bNext':selectServer((selIdx+1)%servers.length);break;
 }});
['bRack','bSlice','bReturn','bPrev','bNext','bCover','bCut','bExpl','bAir','bPow','bData','bCompare','bFail','bReset'].forEach(i=>{const el=btn(i);if(el)el.addEventListener('click',()=>{});});
// separate listeners since above uses switch once
btn('bRack').onclick=()=>applyMode('rack');
btn('bSlice').onclick=()=>applyMode('slice');
btn('bReturn').onclick=()=>applyMode('rack');
btn('bPrev').onclick=()=>selectServer((selIdx-1+servers.length)%servers.length);
btn('bNext').onclick=()=>selectServer((selIdx+1)%servers.length);
btn('bCover').onclick=()=>setCover(!coverOpen);
btn('bCut').onclick=()=>setCutaway(!cutaway);
btn('bExpl').onclick=()=>setExplode(!exploded);
btn('bAir').onclick=()=>setAirflow(!airflow);
btn('bPow').onclick=()=>setPower(!powerPaths);
btn('bData').onclick=()=>setData(!dataPaths);
btn('bCompare').onclick=()=>{compareOpen=!compareOpen;comparePanel.style.display=compareOpen?'block':'none';btn('bCompare').classList.toggle('on',compareOpen);};
btn('bFail').onclick=()=>{failOpen=!failOpen;failPanel.style.display=failOpen?'block':'none';btn('bFail').classList.toggle('on',failOpen);};
btn('bReset').onclick=()=>resetApp();

function resetApp(){
 resetHealth();
 coverT=0;coverTarget=0;coverOpen=false;btn('bCover').textContent='OPEN COVER';btn('bCover').classList.remove('on');
 explodeT=0;explodeTarget=0;exploded=false;btn('bExpl').classList.remove('on');btn('bExpl').textContent='EXPLODE';
 cutaway=false;btn('bCut').classList.remove('on');
 setCutaway(false);
 setAirflow(false);setPower(false);setData(false);airflow=false;powerPaths=false;dataPaths=false;
 // clear cutaway transparent
 servers.forEach(s=>s.group.traverse(o=>{if(o.isMesh&&o.material&&o.material.transparent&&o.material.opacity<1){o.material.transparent=false;o.material.opacity=1;}}));
 if(mode==='slice'){scene.remove(servers[selIdx].group);etherserversRootReadd(servers[selIdx]);}
 applyMode('rack');
 renderList();renderRight();syncFailureVisuals();forceFailureVisuals();
 failPanel.style.display='none';failOpen=false;btn('bFail').classList.remove('on');
 document.querySelectorAll('#bottombar button').forEach(b=>b.classList.remove('on'));
 rackFadeTarget=1;
 health={};
}
function etherserversRootReadd(s){serversRoot.add(s.group);s.group.position.set(0,s.spec.baseY,0);s.group.rotation.set(0,0,0);}
function resetCut(){}

// ============ CAMERA PRESETS (extra panel logic in right) ============
// add rack preset buttons to left panel on render
const presetBar=document.createElement('div');
presetBar.style.cssText='position:fixed;top:52px;left:250px;z-index:14;display:flex;gap:4px';
presetBar.innerHTML=`<button class="t" data-p="front">FULL RACK FRONT</button><button class="t" data-p="threeq">3/4</button><button class="t" data-p="side">SIDE</button><button class="t" data-p="rear">REAR</button><button class="t" data-p="whole" style="display:none">SLICEPRESETS</button>`;
presetBar.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(b.dataset.p==='whole')return;rackPreset(b.dataset.p);});
document.body.appendChild(presetBar);
const slicePresetBar=document.createElement('div');
slicePresetBar.style.cssText='position:fixed;top:52px;left:50%;transform:translateX(-50%);z-index:14;display:none;gap:4px';
slicePresetBar.innerHTML=['whole','top','threeq','front','rear','cpu','gpu','storage'].map(p=>`<button class="t" data-p="${p}">${p.toUpperCase()}</button>`).join('');
slicePresetBar.querySelectorAll('button').forEach(b=>b.onclick=()=>slicePreset(b.dataset.p));
document.body.appendChild(slicePresetBar);
function updateModeButtonsUI(){
 const isR=mode==='rack';
 presetBar.style.display=isR?'flex':'none';
 slicePresetBar.style.display=!isR?'flex':'none';
 presetBar.querySelector('[data-p=whole]').style.display='none';
}
const oldApplyMode=applyMode;
applyMode=function(m){oldApplyMode(m);updateModeButtonsUI();};

// ============ HEALTH SIM LOOP ============
setInterval(()=>{
 servers.forEach(s=>{
  const h=health[s.spec.id]=health[s.spec.id]||initHealth(s);
  const jitter=(a,b)=>{h[a]+=(Math.random()-0.5)*b*0.3;return h[a]};
  jitter('cpu1T',1);jitter('cpu2T',1);jitter('gpuT',2);jitter('net',4);jitter('fans',400);
  if(failures.fan&&s.spec.id===selIdx){h.cpu1T+=0.4;h.cpu2T+=0.4;h.fans+=200;}
  if(failures.psu&&s.spec.id===selIdx){h.power*=1.08;}
  if(failures.gpu&&s.spec.id===selIdx){h.gpuT+=1.2;h.fans+=250;}
  if(failures.net&&s.spec.id===selIdx){h.net*=0.4;}
  h.cpu1T=Math.min(h.cpu1T,98);h.cpu2T=Math.min(h.cpu2T,98);
  if(h.gpuT)h.gpuT=Math.min(h.gpuT,96);
  h.power=Math.min(h.power,s.spec.power*1.5);
  h.fans=Math.min(h.fans,14000);
 });
 if(mode==='slice')renderRight();
},1100);

// ============ ANIMATION LOOP ============
const clock=new THREE.Clock();let frames=0,lastFps=0;
function animate(){
 requestAnimationFrame(animate);
 const dt=clock.getDelta();frames++;
 // cam tween
 if(camTween){camTween.t+=dt;const k=Math.min(1,camTween.t/camTween.dur);const e=1-Math.pow(1-k,3);
  camera.position.lerpVectors(camTween.p0,camTween.p1,e);controls.target.lerpVectors(camTween.t0,camTween.t1,e);
  if(k>=1)camTween=null;}
 // rack fade
 if(Math.abs(rackFade-rackFadeTarget)>0.005){rackFade+=(rackFadeTarget-rackFade)*0.08;
  rack.traverse(o=>{if(o.isMesh||o.isSprite){if(o.material.transparent!==true){o.material.transparent=true;}o.material.opacity=rackFade;}});}
 // cover & explode
 coverLerp();explodeLerp();
 // fans
 servers.forEach(s=>{s.hl.fans.forEach((f,i)=>{
   let spd=f.speed||0.2;if(failures.fan&&s.spec.id===selIdx&&i===0)spd=0;
   else if(failures.fan&&s.spec.id===selIdx&&i>0)spd=0.34;
   else spd=0.2;
   f.blades.rotation.z+=dt*spd*30;});});
 // airflow points
 if(airGroup&&airGroup.visible){
  const pts=airGroup.children[0];const arr=pts.geometry.attributes.position.array;const spd=pts.userData.spd;const base=pts.userData.base;
  for(let i=0;i<pts.userData.N;i++){const z=arr[i*3+2];const b=base[i*3+2];const nz=z-spd[i]*dt*(0.8+Math.random()*0.4);
   if(nz<base[i*3+2]-0.72){arr[i*3+2]=base[i*3+2];}else arr[i*3+2]=nz;}
  pts.geometry.attributes.position.needsUpdate=true;
 }
 // power pulse
 if(powerGroup&&powerGroup.visible){powerGroup.children.forEach((c,i)=>{c.material.emissiveIntensity=1.2+Math.sin(clock.elapsedTime*3+i)*0.7;});}
 controls.update();
 renderer.render(scene,camera);
 // fps
 lastFps+=dt;if(lastFps>=0.5){document.getElementById('fps').textContent=Math.round(frames/lastFps);frames=0;lastFps=0;
  document.getElementById('draws').textContent=renderer.info.render.calls;
  document.getElementById('tris').textContent=(renderer.info.render.triangles/1000).toFixed(0)+'k';}
}

// ============ RESIZE ============
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});

// ============ INIT ============
renderList();renderRight();updateModeButtonsUI();
tweenCam(new THREE.Vector3(2.5,2.3,3.1),new THREE.Vector3(0,0.98,0),1.4);
animate();
</script>
