<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Aurora 68 — Mechanical Keyboard Assembly</title>
<style>
:root{--bg:#0e1015;--bg2:#161a22;--ink:#eef1f8;--muted:#8993a8;--accent:#8ee7cc;--gold:#e8bd72;--line:rgba(255,255,255,.12);--shadow:0 30px 80px rgba(0,0,0,.5)}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{background:radial-gradient(1200px 800px at 55% 28%,#202836 0%,#11141a 55%,#090b0f 100%);color:var(--ink);font:14px/1.5 Inter,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;user-select:none}
#scene{position:fixed;inset:0;perspective:1100px;perspective-origin:50% 42%;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
#world{position:absolute;left:50%;top:48%;width:620px;height:560px;margin:-260px 0 0 -310px;transform-style:preserve-3d;will-change:transform}
#fit{position:absolute;left:0;top:0;width:620px;height:560px;transform-style:preserve-3d}
.obj{position:absolute;left:50%;top:50%;transform-style:preserve-3d;transform-origin:50% 50%}
.face{position:absolute;left:50%;top:50%;transform-style:preserve-3d}
#base{position:absolute;left:50%;top:50%;transform-style:preserve-3d;will-change:transform}
.layer{position:absolute;inset:0;transform-style:preserve-3d;will-change:transform,opacity}
.cap{position:absolute;transform-style:preserve-3d;left:50%;top:50%;will-change:transform}
.key{position:absolute;inset:0;border:0;padding:0;margin:0;background:none;cursor:pointer;outline:none;transform-style:preserve-3d}
.key:focus-visible .legend{box-shadow:0 0 0 2px var(--accent),0 8px 12px rgba(0,0,0,.5)}
.legend{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font:500 13px/1 ui-monospace,SFMono-Regular,Menlo,monospace;color:#2a3038;letter-spacing:.02em;pointer-events:none;white-space:nowrap}
.legend.sm{font-size:10px;letter-spacing:.08em}
.shine{position:absolute;inset:0;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.34),transparent 42%,transparent 68%,rgba(0,0,0,.12));border-radius:inherit}
.top{position:absolute;left:50%;top:50%;border-radius:6px;overflow:hidden}
.side{position:absolute;left:50%;top:50%;border-radius:3px;backface-visibility:visible}
.ui{position:fixed;z-index:20;pointer-events:none}
.ui>*{pointer-events:auto}
header{top:clamp(16px,3vh,30px);left:clamp(16px,3vw,34px)}
.kicker{display:flex;align-items:center;gap:9px;font:600 10px/1 system-ui,sans-serif;letter-spacing:.22em;color:var(--accent);text-transform:uppercase}
.kicker:before{content:"";width:6px;height:6px;background:var(--accent);border-radius:50%;box-shadow:0 0 12px var(--accent)}
h1{font:600 clamp(20px,3.2vw,30px)/1.1 Inter,system-ui,sans-serif;letter-spacing:-.03em;margin:9px 0 6px}
.sub{color:var(--muted);font-size:12px;max-width:330px}
.controls{right:clamp(14px,2.6vw,28px);top:clamp(14px,2.6vw,28px);display:flex;gap:8px;align-items:center}
button{font:500 12px/1 Inter,system-ui,sans-serif;color:var(--ink);background:rgba(255,255,255,.055);border:1px solid var(--line);border-radius:10px;padding:10px 13px;cursor:pointer;display:inline-flex;align-items:center;gap:7px;transition:background .2s,border-color .2s,transform .12s;backdrop-filter:blur(10px)}
button:hover{background:rgba(255,255,255,.1)}button:active{transform:translateY(1px)}
button[aria-pressed="true"]{border-color:rgba(142,231,204,.5);color:var(--accent)}
button .i{font-size:14px;line-height:1}
.soundbtn{padding:10px 11px}
.hint{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);z-index:22;color:#c8d0e0;background:rgba(16,20,27,.82);border:1px solid var(--line);border-radius:999px;padding:8px 16px;font-size:12px;backdrop-filter:blur(10px);opacity:0;transition:opacity .4s;pointer-events:none}
.hint.show{opacity:1}
footer{bottom:clamp(14px,2.4vh,24px);left:50%;transform:translateX(-50%);display:flex;gap:8px;align-items:center;max-width:calc(100vw - 28px);flex-wrap:wrap;justify-content:center}
.legendhint{font-size:11px;color:var(--muted);white-space:nowrap}
#stage{position:fixed;left:0;right:0;bottom:64px;text-align:center;z-index:21;pointer-events:none;font-size:11px;color:var(--muted);letter-spacing:.06em}
#progress{position:fixed;left:50%;bottom:0;transform:translateX(-50%);height:2px;width:180px;background:rgba(255,255,255,.1);z-index:21;opacity:0;transition:opacity .3s}
#progress i{display:block;height:100%;width:0%;background:linear-gradient(90deg,var(--accent),var(--gold));transition:width .1s linear}
@media (max-width:720px){h1{font-size:21px}.sub{display:none}.legend{font-size:11px}.legend.sm{font-size:8px}.controls button{padding:9px 10px}.controls .lbl{display:none}#stage{bottom:82px}.hint{bottom:110px}}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="scene"><div id="world"><div id="fit"><div id="base"></div></div></div></div>
<header class="ui">
  <div class="kicker">Aurora Labs · 68</div>
  <h1>Gasket-mounted, end to end.</h1>
  <div class="sub">Cream PBT keycaps on a brushed aluminum chassis with a soft mint gasket seam.</div>
</header>
<div class="controls ui">
  <button id="replay" title="Replay assembly (R)"><span class="i">↻</span><span class="lbl">Replay</span></button>
  <button id="sound" class="soundbtn" title="Enable sound"><span class="i" id="soundIcon">🔇</span><span class="lbl" id="soundLbl">Sound off</span></button>
</div>
<div id="stage">Assembling</div>
<div class="hint" id="hint">Tap any key to enable sound</div>
<div id="progress"><i></i></div>
<footer class="ui">
  <span class="legendhint">Click or type to play · Space for the deep one</span>
  <button id="tiltL" title="Rotate view left" aria-label="Rotate view left">‹</button>
  <button id="tiltR" title="Rotate view right" aria-label="Rotate view right">›</button>
  <button id="tiltUp" title="Tilt up" aria-label="Tilt up">↑</button>
  <button id="tiltD" title="Tilt down" aria-label="Tilt down">↓</button>
</footer>
<script>
(() => {
"use strict";
const W=620,H=560,D=27,ROWS=5,rowY=[-188,-98,-8,82,172],ROW_GAP=90;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const scene=document.getElementById('scene'),world=document.getElementById('world'),fit=document.getElementById('fit'),base=document.getElementById('base');
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v)),lerp=(a,b,t)=>a+(b-a)*t,ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
const rad=d=>d*Math.PI/180;

const layout=[
 [[0,1,'1'],[1,1,'2'],[2,1,'3'],[3,1,'4'],[4,1,'5'],[5,1,'6'],[6,1,'7'],[7,1,'8'],[8,1,'9'],[9,1,'0'],[10,1,'−'],[11,1,'+'],[12,1,'⌫'],[13,1,'del'],[14,1.5,'home'],[15.5,1.5,'end']],
 [[0,1.5,'tab'],[1.5,1,'Q'],[2.5,1,'W'],[3.5,1,'E'],[4.5,1,'R'],[5.5,1,'T'],[6.5,1,'Y'],[7.5,1,'U'],[8.5,1,'I'],[9.5,1,'O'],[10.5,1,'P'],[11.5,1,'['],[12.5,1,']'],[13.5,1.5,'\\'],[15,1,'pg up']],
 [[0,1.75,'caps'],[1.75,1,'A'],[2.75,1,'S'],[3.75,1,'D'],[4.75,1,'F'],[5.75,1,'G'],[6.75,1,'H'],[7.75,1,'J'],[8.75,1,'K'],[9.75,1,'L'],[10.75,1,';'],[11.75,1,"'"],[12.75,2,'enter'],[14.75,1,'↑'],[15.75,1,'pg dn']],
 [[0,2.25,'shift'],[2.25,1,'Z'],[3.25,1,'X'],[4.25,1,'C'],[5.25,1,'V'],[6.25,1,'B'],[7.25,1,'N'],[8.25,1,'M'],[9.25,1,','],[10.25,1,'.'],[11.25,1,'/'],[12.25,2.75,'⇧'],[15,1,'←'],[16,1,'→']],
 [[0,2.75,'ctrl'],[2.75,1.5,'alt'],[4.25,1.25,'gui'],[5.5,6.25,'space'],[11.75,1.25,'gui'],[13,1.25,'alt'],[14.25,1.25,'fn'],[15.5,1.5,'ctrl']]
];
const allKeys=[];
let keyIndex=0;
const keyList=[];
layout.forEach((row,r)=>row.forEach(([x,w,label])=>{
  const wpx=52*w, xpx=(x-8.3)*52;
  keyList.push({x:xpx,w:wpx,label,row:r,cx:xpx+wpx/2,cy:rowY[r]});
}));
keyList.sort((a,b)=>a.cx-b.cx);
keyList.forEach((k,i)=>{k.idx=i;allKeys.push(k)});

// ---- materials ----
function el(cls,style){const e=document.createElement('div');e.className=cls;if(style)Object.assign(e.style,style);return e}
function face(w,h,style,depth,top=false){
  const f=el('face',{width:w+'px',height:h+'px',marginLeft:-w/2+'px',marginTop:-h/2+'px',...style});
  f.style.transform=`translateZ(${depth}px)`;return f;
}
function box(w,h,d,style,depth=0){
  const g=el('obj',{width:w+'px',height:h+'px'});
  const faces=[face(w,h,style,d/2,true),face(w,h,{...style,filter:'brightness(.55)'},-d/2)];
  faces.forEach(f=>g.appendChild(f));
  return g;
}
function layer(name,z){const l=el('layer',{width:W+'px',height:H+'px',transform:`translateZ(${z}px)`});base.appendChild(l);l.dataset.name=name;return l}
function pcbStyle(){return{background:'linear-gradient(135deg,#255f4b,#17473a)',borderRadius:'10px',boxShadow:'inset 0 0 0 1px rgba(255,255,255,.12)'}}
function plateStyle(){return{background:'linear-gradient(135deg,#d9d5c8,#b9b4a7)',borderRadius:'9px',boxShadow:'inset 0 0 0 1px rgba(255,255,255,.5),inset 0 0 18px rgba(0,0,0,.14)'}}
function capStyle(color,accent=false){return{background:`linear-gradient(145deg,${accent?'#d6e8df':'#f1eee4'},${accent?'#b8cdc3':'#ddd9cc'})`,borderRadius:'6px',boxShadow:'inset 0 0 0 1px rgba(255,255,255,.35)'}}

const keycaps=[];
function makeKeycap(k){
  const w=52*k.w-3, h=52-3, r=7;
  const cap=el('div',{width:w+'px',height:h+'px',transform:`translateZ(0px)`});
  const baseStyle=capStyle(k.label==='space'?'#e9e4d7':(k.label==='enter'?'#cfe2d8':(k.label==='shift'||k.label==='caps'||k.label==='tab'||k.label==='ctrl'||k.label==='alt'||k.label==='gui'||k.label==='fn'?'#e6e1d4':'#f1eee4')),k.label==='enter');
  const skirt=face(w,h,{...baseStyle,boxShadow:'inset 0 0 0 1px rgba(0,0,0,.08)'},4);
  const top=face(w-5,h-5,{...baseStyle,background:k.label==='enter'?'linear-gradient(145deg,#e5f1eb,#cddfd6)':'linear-gradient(145deg,#fbf9f1,#ece7d9)',borderRadius:5},11);
  const lgd=el('div',{class:'legend'+(k.label.length>3||k.label==='shift'||k.label==='caps'?' sm':''),});
  lgd.textContent=k.label===' '?'':k.label; if(k.label==='space')lgd.textContent='';
  top.appendChild(lgd);top.appendChild(el('div',{class:'shine'}));
  cap.appendChild(skirt);cap.appendChild(top);
  // four side faces (extruded look)
  const sideStyle={background:k.label==='enter'?'linear-gradient(#c6d8cf,#a7bcb3)':'linear-gradient(#d6d2c6,#bdb8aa)',borderRadius:'3px'};
  [[w,'h',8],[w,'h',4],[w,'h',6],[w,'h',2]].forEach(()=>{});
  const sideTop=el('div',{class:'side',width:w+'px',height:'8px',marginLeft:-w/2+'px',top:'-4px',...sideStyle,transform:'translateZ(4px) rotateX(90deg)'});
  const sideBot=el('div',{class:'side',width:w+'px',height:'8px',marginLeft:-w/2+'px',top:'-4px',...sideStyle,transform:'translateZ(4px) rotateX(-90deg)'});
  const sideL=el('div',{class:'side',width:'8px',height:h+'px',left:'-4px',...sideStyle,transform:'translateZ(4px) rotateY(-90deg)'});
  const sideR=el('div',{class:'side',width:'8px',height:h+'px',right:'-4px',...sideStyle,transform:'translateZ(4px) rotateY(90deg)'});
  [sideTop,sideBot,sideL,sideR].forEach(s=>cap.appendChild(s));
  const key=el('div',{class:'cap',width:w+'px',height:h+'px',transform:`translate3d(0,0,0px)`});
  const btn=document.createElement('button');btn.className='key';btn.type='button';btn.setAttribute('aria-label',k.label===' '?'Space':k.label);
  btn.style.transformStyle='preserve-3d';btn.appendChild(cap);key.appendChild(btn);
  return {cap,btn,key};
}

const baseStyle={background:'linear-gradient(135deg,#d6d0c0 0%,#e4ded0 38%,#bfb9aa 100%)',borderRadius:'18px',boxShadow:'inset 0 0 0 2px rgba(255,255,255,.22),inset 0 0 0 12px rgba(0,0,0,.035),inset 0 -24px 40px rgba(0,0,0,.18),0 46px 90px rgba(0,0,0,.55)'};
const caseBottom=el('div',{class:'obj',width:(W+18)+'px',height:(H+16)+'px',transform:'translateZ(-22px) rotateX(0deg)'});
const caseTopFace=face(W,H,baseStyle,0);
caseBottom.appendChild(face(W,H,baseStyle,-22));caseBottom.appendChild(face(W,H,{...baseStyle,filter:'brightness(.7)'},18));
base.appendChild(caseBottom);
// side rails
const railStyle={background:'linear-gradient(180deg,#d8d2c4,#b3ad9e 60%,#9c968a)',borderRadius:'5px',boxShadow:'inset 0 0 0 1px rgba(255,255,255,.18)'};
function rail(w,h,x,y,rot,depth){
 const r=el('div',{class:'obj',width:w+'px',height:h+'px'});
 const f=el('div',{class:'face',width:w+'px',height:h+'px',marginLeft:-w/2+'px',marginTop:-h/2+'px',...railStyle,transform:`rotateX(${rot}deg)`});
 r.style.transform=`translate3d(${x}px,${y}px,${depth}px) rotateX(${rot}deg)`;
 r.appendChild(f);base.appendChild(r);return r;
}
rail(W,H/2,0,(H/2-9),90,3);
rail(W,H/2,0,(-H/2+9),-90,3);
rail(D,H/2,(W/2-9),0,90,3).style.transform=`translate3d(${W/2-9}px,0,3px) rotateY(90deg)`;
rail(D,H/2,(-W/2+9),0,90,3).style.transform=`translate3d(${-W/2+9}px,0,3px) rotateY(-90deg)`;
// gasket seam glow
const gasket=el('div',{class:'obj',width:(W-6)+'px',height:(H-6)+'px',transform:'translateZ(-8px)'});
gasket.appendChild(face(W-6,H-6,{background:'linear-gradient(120deg,#79bda8,#8ed8bf,#6aa895)',borderRadius:'15px',opacity:.9},0));
base.appendChild(gasket);

// ---- layers ----
const L={};
L.pcb=layer('pcb',-12);
const pcb=box(W-10,H-10,6,pcbStyle(),0);L.pcb.appendChild(pcb);
// pcb traces + screw holes
for(let i=0;i<14;i++){
  const g=el('div',{class:'obj',width:'90px',height:'5px',transform:`translate3d(${(i%4-1.5)*120}px,${(-180+i*28)}px,3.2px)`});
  g.appendChild(face(90,5,{background:'rgba(214,201,128,.4)',borderRadius:'3px'},0));L.pcb.appendChild(g);
}
for(let i=0;i<6;i++){
 const g=el('div',{class:'obj',width:'12px',height:'12px',transform:`translate3d(${(i%2?1:-1)*(W/2-30)}px,${-210+i*84}px,3.6px)`});
 g.appendChild(face(12,12,{background:'#d8c07a',borderRadius:'50%',boxShadow:'0 0 0 2px #2c3e34'},0));L.pcb.appendChild(g);
}
// usb-c cutout detail
const usb=el('div',{class:'obj',width:'80px',height:'34px',transform:'translate3d(0,-272px,6px)'});
usb.appendChild(face(80,34,{background:'linear-gradient(#cfd6d1,#8f9a95)',borderRadius:'5px',boxShadow:'inset 0 0 0 3px #5a6661'},0));L.pcb.appendChild(usb);

L.foam=layer('foam',-2);
const foam=box(W-14,H-14,10,{background:'linear-gradient(135deg,#a58f7d,#8f7865)',borderRadius:'11px',boxShadow:'inset 0 0 0 1px rgba(0,0,0,.15)'},0);
L.foam.appendChild(foam);
for(let i=0;i<24;i++){
  const g=el('div',{class:'obj',width:'16px',height:'16px',transform:`translate3d(${(i%6-2.5)*82}px,${(-190+Math.floor(i/6)*94)}px,5.2px)`});
  g.appendChild(face(16,16,{background:'rgba(0,0,0,.09)',borderRadius:'50%'},0));L.foam.appendChild(g);
}

L.plate=layer('plate',8);
const plate=box(W-18,H-18,8,plateStyle(),0);L.plate.appendChild(plate);
// plate switch holes
keyList.forEach(k=>{
  const hole=el('div',{class:'obj',width:(52*k.w-8)+'px',height:'44px',transform:`translate3d(${k.cx}px,${k.cy}px,4.3px)`});
  hole.appendChild(face(52*k.w-8,44,{background:'#15161a',borderRadius:'4px',boxShadow:'inset 0 3px 6px rgba(0,0,0,.6)'},0));
  L.plate.appendChild(hole);
});

L.switches=layer('switches',26);
L.keys=layer('keys',50);

// switches one at a time, left to right
const switches=[];
keyList.forEach(k=>{
  const w=52*k.w-12;
  const sw=el('div',{class:'obj',width:w+'px',height:'40px'});
  const body=el('div',{class:'face',width:w+'px',height:'40px',marginLeft:-w/2+'px',marginTop:'-20px',background:'linear-gradient(150deg,#3c4550,#252b33)',borderRadius:'4px',boxShadow:'inset 0 0 0 1px rgba(255,255,255,.12)',transform:'translateZ(0px)'});
  sw.appendChild(body);
  // stem
  const stem=el('div',{class:'face',width:'18px',height:'18px',left:'50%',top:'50%',marginLeft:'-9px',marginTop:'-9px',background:'linear-gradient(145deg,#e4c98c,#b99a5c)',borderRadius:'3px',transform:'translateZ(10px)'});
  sw.appendChild(stem);
  // top housing hint + LED
  const led=el('div',{class:'face',width:'7px',height:'3px',left:'50%',top:'4px',marginLeft:'-3.5px',background:'#9ef0cf',borderRadius:'2px',transform:'translateZ(1px)',opacity:.85});
  sw.appendChild(led);
  sw.style.transform=`translate3d(${k.cx}px,${k.cy}px,0px)`;
  sw.style.transform += ` translateY(-250px) translateZ(120px) rotateX(-38deg)`;
  L.switches.appendChild(sw);
  switches.push({el:sw,k,rest:`translate3d(${k.cx}px,${k.cy}px,0px)`});

  const c=makeKeycap(k);
  c.key.style.transform=`translate3d(${k.cx}px,${k.cy}px,0px)`;
  c.cap.style.transform='translateY(-260px) translateZ(160px) rotateX(-32deg)';
  L.keys.appendChild(c.key);
  k.sw=sw; k.cap=c.cap; k.btn=c.btn; k.wrap=c.key; k.pressed=false;
  k.restTransform=`translate3d(${k.cx}px,${k.cy}px,0px)`;
  const capDepth=k.label===' '||k.w>1.25?11:15;
  k.capTopZ=capDepth;
  c.btn.addEventListener('click',e=>{e.preventDefault();e.stopPropagation();initAudio();press(k,true)});
  c.btn.addEventListener('pointerdown',e=>{initAudio()});
});

// knob
const knob=el('div',{class:'obj',width:'54px',height:'54px',transform:'translate3d(272px,-238px,26px)'});
const kd=el('div',{class:'face',width:'54px',height:'54px',marginLeft:'-27px',marginTop:'-27px',background:'repeating-conic-gradient(#d9d3c4 0deg 6deg,#c2bcad 6deg 12deg)',borderRadius:'50%',boxShadow:'0 2px 6px rgba(0,0,0,.4),inset 0 0 0 1px rgba(0,0,0,.2)',transform:'translateZ(0px)'});
const kt=el('div',{class:'face',width:'42px',height:'42px',left:'50%',top:'50%',marginLeft:'-21px',marginTop:'-21px',background:'radial-gradient(circle at 36% 30%,#f2eee2,#b8b2a4)',borderRadius:'50%',transform:'translateZ(8px)',boxShadow:'inset 0 0 0 1px rgba(0,0,0,.18)'});
const mark=el('div',{class:'face',width:'3px',height:'12px',left:'50%',top:'7px',marginLeft:'-1.5px',background:'#5b6b64',borderRadius:'2px',transform:'translateZ(9px)'});
knob.appendChild(kd);knob.appendChild(kt);knob.appendChild(mark);L.keys.appendChild(knob);
knob.addEventListener('pointerdown',e=>{initAudio();knobRotate=true;lastX=e.clientX;knob.setPointerCapture?.(e.pointerId)});
let knobRotate=false,lastX=0,knobAngle=0;
knob.addEventListener('pointermove',e=>{if(!knobRotate)return;knobAngle=clamp(knobAngle+(e.clientX-lastX)*1.2,-140,140);lastX=e.clientX;knob.style.transform=`translate3d(272px,-238px,26px) rotateZ(${knobAngle}deg)`});
knob.addEventListener('pointerup',()=>knobRotate=false);
knob.addEventListener('pointercancel',()=>knobRotate=false);

// ---- assembly ----
const initLayerZ={pcb:-12,foam:-2,plate:8,switches:26,keys:50};
const finalTransform={};
Object.entries(L).forEach(([k,v])=>{finalTransform[k]=`translateZ(${initLayerZ[k]}px)`});
let assembling=true;
const stage=document.getElementById('stage'),prog=document.getElementById('progress'),progBar=prog.querySelector('i');
function resetExploded(){
  keyList.forEach(k=>{
    k.wrap.style.transition='none';
    k.cap.style.transition='none';
    k.cap.style.transform='translateY(-270px) translateZ(165px) rotateX(-34deg)';
    k.sw.style.transition='none';
    k.sw.style.transform=`translate3d(${k.cx}px,${k.cy}px,0px) translateY(-300px) translateZ(150px) rotateX(-42deg)`;
  });
  L.pcb.style.transform='translateZ(-78px)';
  L.foam.style.transform='translateZ(-120px)';
  L.plate.style.transform='translateZ(-150px)';
  L.switches.style.transform='translateZ(20px)';
  L.keys.style.transform='translateZ(70px)';
  void L.keys.offsetWidth;
}
function stageSettle(name,dur){
  stage.textContent=name;
  L[name].style.transition=`transform ${dur}ms cubic-bezier(.22,1,.36,1)`;
  L[name].style.transform=finalTransform[name];
}
function placeSwitch(i){
  const k=keyList[i];
  k.sw.style.transition=`transform ${280+reduce*0}ms cubic-bezier(.34,1.56,.64,1)`;
  k.sw.style.transform=k.restTransform;
  if(!reduce && i%3===0) clickTick();
}
function placeCap(i){
  const k=keyList[i];
  k.cap.style.transition=`transform ${340+reduce*0}ms cubic-bezier(.22,1.12,.36,1)`;
  k.cap.style.transform='translateY(0px) translateZ(0px) rotateX(0deg)';
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let runToken=0;
async function assemble(){
  const token=++runToken;assembling=true;
  stage.style.opacity='1';prog.style.opacity='1';
  resetExploded();
  const reduced=reduce;
  await sleep(reduced?80:700);
  stageSettle('pcb',reduced?1:650);
  await sleep(reduced?100:900); if(token!==runToken)return;
  stageSettle('foam',reduced?1:600);
  await sleep(reduced?70:650); if(token!==runToken)return;
  stageSettle('plate',reduced?1:650);
  await sleep(reduced?50:750); if(token!==runToken)return;
  stage.textContent='Installing switches'; progBar.style.width='40%';
  for(let i=0;i<keyList.length;i++){placeSwitch(i);progBar.style.width=(40+i/keyList.length*32)+'%';await sleep(reduced?2:30);if(token!==runToken)return;}
  stageSettle('switches',reduced?1:500);
  await sleep(reduced?80:650); if(token!==runToken)return;
  stage.textContent='Seating keycaps'; progBar.style.width='78%';
  for(let i=0;i<keyList.length;i++){placeCap(i);progBar.style.width=(78+i/keyList.length*20)+'%';await sleep(reduced?2:40);if(token!==runToken)return;}
  await sleep(reduced?60:900); if(token!==runToken)return;
  stageSettle('keys',reduced?1:450);
  await sleep(reduced?80:500);
  stage.textContent=reduce?'Assembly complete — click or type to play':'68 keys · click or type to play';
  prog.style.opacity='0';progBar.style.width='0%';
  assembling=false;
  if(!audioOn&&!hasInteracted) hint.classList.add('show');
}
// ensure initial layer transform + cap start
Object.entries(L).forEach(([k,v])=>{v.style.transition='none';v.style.transform=finalTransform[k]});
resetExploded();

// ---- audio ----
let audioCtx=null,master=null,audioOn=false,hasInteracted=false;
const hint=document.getElementById('hint'),soundBtn=document.getElementById('sound'),soundLbl=document.getElementById('soundLbl'),soundIcon=document.getElementById('soundIcon');
function initAudio(){
  if(!audioCtx){
    const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;
    audioCtx=new AC();master=audioCtx.createGain();master.gain.value=.8;master.connect(audioCtx.destination);
  }
  if(audioCtx.state==='suspended')audioCtx.resume();
  hasInteracted=true;hint.classList.remove('show');
  if(!audioOn){audioOn=true;soundBtn.setAttribute('aria-pressed','true');soundLbl.textContent='Sound on';soundIcon.textContent='🔊';}
}
function blip(freq,dur,type,vol,slide,delay=0){
  if(!audioCtx)return;
  const t=audioCtx.currentTime+delay;
  const o=audioCtx.createOscillator(),g=audioCtx.createGain();
  o.type=type;o.frequency.setValueAtTime(freq,t);
  if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(30,slide),t+dur);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.004);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+dur+.02);
}
let noiseBuf=null;
function getNoise(){
  if(noiseBuf)return noiseBuf;
  const len=Math.floor(audioCtx.sampleRate*.18);noiseBuf=audioCtx.createBuffer(1,len,audioCtx.sampleRate);
  const d=noiseBuf.getChannelData(0);for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  return noiseBuf;
}
function noise(dur,freq,q,vol,delay=0){
  const t=audioCtx.currentTime+delay;
  const s=audioCtx.createBufferSource();s.buffer=getNoise();
  const f=audioCtx.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
  const g=audioCtx.createGain();g.gain.setValueAtTime(vol,t);g.gain.exponentialRampToValueAtTime(.0008,t+dur);
  s.connect(f);f.connect(g);g.connect(master);s.start(t);s.stop(t+dur);
}
function playKey(label){
  if(!audioOn||!audioCtx)return;
  const r=Math.random();
  if(label===' '||label==='space'){
    noise(.085,180,.9,.5);blip(74,.16,'sine',.5,38);blip(115,.09,'triangle',.14,72);
  }else if(label==='enter'){
    noise(.05,320,1.2,.32);blip(160,.07,'square',.13,96);blip(88,.12,'sine',.3,50);
  }else if(label==='⌫'||label==='backspace'){
    noise(.06,420,1.4,.34);blip(210,.055,'square',.1,120);blip(118,.09,'triangle',.16,70);
  }else if(['shift','caps','tab','ctrl','alt','gui','fn'].includes(label)||label==='⇧'){
    noise(.045,560,1.6,.25);blip(300,.05,'triangle',.09,190);blip(150,.06,'sine',.1,95);
  }else if(/^[0-9]$/.test(label)||['−','+','[',']',';','\\',',','.','/','−'].includes(label)){
    noise(.032,1250+r*200,2.2,.22);blip(430+r*90,.045,'square',.075,290);
  }else if(label==='del'||label==='home'||label==='end'||label==='pg up'||label==='pg dn'){
    noise(.04,900,2.5,.22);blip(370,.04,'triangle',.07,240);
  }else if(['↑','←','↓','→'].includes(label)){
    noise(.04,760,2,.2);blip(340,.045,'triangle',.07,210);
  }else{
    noise(.035,1550+r*350,2.6,.2);blip(500+r*130,.05,'square',.06,310);
  }
}
function clickTick(){
  if(!audioOn||!audioCtx)return;
  noise(.014,2200,3,.05);
}

// ---- press animation + physical keys ----
const pressedTimers=new WeakMap();
function press(k,fromClick){
  initAudio();
  if(assembling){hint.classList.remove('show');return}
  if(k.pressed)return;
  k.pressed=true;
  k.cap.style.transition=reduce?'transform .02s':'transform 70ms cubic-bezier(.3,.7,.4,1)';
  k.cap.style.transform=`translateY(2px) translateZ(-7px) rotateX(-1deg)`;
  k.cap.style.filter='brightness(.93)';
  playKey(k.label);
  clearTimeout(pressedTimers.get(k));
  const dur=reduce?70:(k.label===' '?190:120+Math.random()*60);
  pressedTimers.set(k,setTimeout(()=>{
    k.pressed=false;
    k.cap.style.transition=reduce?'transform .05s':'transform 140ms cubic-bezier(.22,1.6,.36,1)';
    k.cap.style.transform='translateY(0px) translateZ(0px) rotateX(0deg)';
    k.cap.style.filter='none';
  },dur));
}
const codeMap={Space:'space',Enter:'enter',Backspace:'⌫',Tab:'tab',CapsLock:'caps',ShiftLeft:'shift',ShiftRight:'⇧',ControlLeft:'ctrl',ControlRight:'ctrl',AltLeft:'alt',AltRight:'alt',MetaLeft:'gui',MetaRight:'gui',ArrowUp:'↑',ArrowDown:'↓',ArrowLeft:'←',ArrowRight:'→',Delete:'del',Home:'home',End:'end',PageUp:'pg up',PageDown:'pg dn','-':'−','=':'+','[':'[',']':']','\\':'\\',';':';',"'":"'",',':',','.','/':'/','`':'~'};
const down=new Set();
addEventListener('keydown',e=>{
  initAudio();
  if(assembling)return;
  if(e.metaKey||e.ctrlKey)return;
  let label=codeMap[e.code];
  if(!label){label=e.key;if(e.key.length>1)return}
  const k=keyList.find(k=>k.label===label||k.label.toLowerCase()===String(label).toLowerCase());
  if(k){e.preventDefault();if(!down.has(e.code)){down.add(e.code);press(k)}}
});
addEventListener('keyup',e=>{down.delete(e.code)});
addEventListener('blur',()=>down.clear());

// ---- camera + gestures ----
let yaw=-21,pitch=57,targetYaw=-21,targetPitch=57,drag=false,lastX=0,lastY=0;
function view(){world.style.transform=`rotateX(${pitch}deg) rotateY(${yaw}deg)`}
scene.addEventListener('pointerdown',e=>{
  initAudio();
  if(e.target.closest('.key')||e.target.closest('#base')&&e.target.closest('.cap'))return;
  drag=true;lastX=e.clientX;lastY=e.clientY;scene.setPointerCapture?.(e.pointerId);
});
scene.addEventListener('pointermove',e=>{
  if(!drag)return;
  targetYaw+=(e.clientX-lastX)*.22;
  targetPitch=clamp(targetPitch-(e.clientY-lastY)*.22,18,72);
  lastX=e.clientX;lastY=e.clientY;
});
addEventListener('pointerup',()=>{drag=false});
scene.addEventListener('wheel',e=>{targetPitch=clamp(targetPitch+e.deltaY*.02,18,72)},{passive:true});
document.getElementById('tiltL').onclick=()=>targetYaw-=15;
document.getElementById('tiltR').onclick=()=>targetYaw+=15;
document.getElementById('tiltUp').onclick=()=>targetPitch=clamp(targetPitch-8,18,72);
document.getElementById('tiltD').onclick=()=>targetPitch=clamp(targetPitch+8,18,72);

// responsive scale
function resize(){
  const s=Math.min(innerWidth/820,innerHeight/760,1.2);
  fit.style.transform=`scale(${s})`;
}
addEventListener('resize',resize);resize();
view();

// loop
let last=performance.now();
function tick(t){
  const dt=Math.min(50,t-last);last=t;
  yaw=lerp(yaw,targetYaw,1-Math.pow(.001,dt/1000));
  pitch=lerp(pitch,targetPitch,1-Math.pow(.001,dt/1000));
  view();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

// controls
document.getElementById('replay').onclick=()=>{initAudio();assemble()};
soundBtn.onclick=()=>{audioOn=!audioOn;if(audioOn)initAudio();soundLbl.textContent=audioOn?'Sound on':'Sound off';soundIcon.textContent=audioOn?'🔊':'🔇';soundBtn.setAttribute('aria-pressed',String(audioOn));if(audioOn)playKey('M')};
setTimeout(()=>{if(!hasInteracted&&!reduce)hint.classList.add('show')},2200);
setTimeout(()=>hint.classList.remove('show'),6000);
setTimeout(()=>{if(!assembling){stage.textContent='68 keys · click or type to play'}},300);

// intro stagger
setTimeout(()=>{if(!reduce)hint.classList.add('show')},1600);
assemble();
})();
</script>
</body>
</html>
