<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

// ─── constants ──────────────────────────────────────────────
const CELL = 1;
const IW = 144, ID = 128;          // terrain grid cells
const ISM = 72, JSM = 64;          // half-extents
const SEED = 137;

// ─── noise ──────────────────────────────────────────────────
function hash2(ix, iz){
  let h = (ix*374761393 + iz*668265263) | 0;
  h = ((h ^ (h>>>13)) * 1274126177) | 0;
  return ((h ^ (h>>>16)) & 0x7fffffff) / 0x7fffffff;
}
function vnoise(x, z){
  const ix = Math.floor(x), iz = Math.floor(z);
  const fx = x-ix, fz = z-iz;
  const sx = fx*fx*(3-2*fx), sz = fz*fz*(3-2*fz);
  const v00 = hash2(ix,iz), v10 = hash2(ix+1,iz);
  const v01 = hash2(ix,iz+1), v11 = hash2(ix+1,iz+1);
  return v00*(1-sx)*(1-sz)+v10*sx*(1-sz)+v01*(1-sx)*sz+v11*sx*sz;
}
function fbm(x, z, oct){
  let v=0, a=1, f=1, m=0;
  for(let i=0;i<oct;i++){ v+=a*vnoise(x*f,z*f); m+=a; a*=0.5; f*=2; }
  return v/m;
}

// ─── heightmap ──────────────────────────────────────────────
function islandHeight(x, z){
  const dx = x/ISM, dz = z/JSM;
  const dist = Math.sqrt(dx*dx+dz*dz);
  let h = Math.max(0, 1 - dist*0.85) * 14;
  h += fbm(x*0.04+SEED, z*0.04+SEED, 4) * 5;
  h += fbm(x*0.12, z*0.12, 2) * 1.8;
  // asymmetries
  h += Math.sin(x*0.06)*0.6 + Math.cos(z*0.07)*0.5;
  // terrace flattening
  // upper terrace (pagoda): center (-12, -32), radius 18, height 11
  const du = Math.sqrt((x+12)*(x+12)+(z+32)*(z+32));
  if(du < 22) h = Math.max(h, 11 + (du-18)*0.05);
  // middle terrace (zen): center (22, 2), radius 16, height 6.5
  const dm = Math.sqrt((x-22)*(x-22)+(z-2)*(z-2));
  if(dm < 18) h = Math.max(h, 6.5 + (dm-14)*0.04);
  // bamboo terrace: center (-30, 22), radius 14, height 5
  const db = Math.sqrt((x+30)*(x+30)+(z-22)*(z-22));
  if(db < 16) h = Math.max(h, 5 + (db-12)*0.04);
  // lower terrace: center (4, 44), radius 14, height 3.5
  const dl = Math.sqrt((x-4)*(x-4)+(z-44)*(z-44));
  if(dl < 16) h = Math.max(h, 3.5 + (dl-12)*0.03);
  // carve pools
  // top pool at (-28, -38)
  const pt = Math.sqrt((x+28)*(x+28)+(z+38)*(z+38));
  if(pt < 11) h = Math.min(h, 9.5 - (11-pt)*0.1);
  // middle pool at (18, 8)
  const pm = Math.sqrt((x-18)*(x-18)+(z-8)*(z-8));
  if(pm < 13) h = Math.min(h, 5.0 - (13-pm)*0.08);
  // lower pool at (8, 48)
  const pl = Math.sqrt((x-8)*(x-8)+(z-48)*(z-48));
  if(pl < 12) h = Math.min(h, 2.0 - (12-pl)*0.06);
  // cliff cut on far side (negative z) for waterfall
  if(z < -50 && x > -20 && x < 20){
    const cliff = Math.max(0, (-45 - z)/8);
    h = Math.min(h, 8 - cliff*3);
  }
  return Math.max(0.2, h);
}

// ─── renderer / scene / camera ──────────────────────────────
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x0a0a18, 0.0035);

const camera = new THREE.PerspectiveCamera(48, window.innerWidth/window.innerHeight, 0.1, 800);
camera.position.set(55, 48, 78);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 6, -4);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.minDistance = 18;
controls.maxDistance = 180;
controls.maxPolarAngle = Math.PI*0.92;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.6;
controls.update();

// ─── composer ───────────────────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.25, 0.4, 0.15);
composer.addPass(bloom);

// ─── materials ──────────────────────────────────────────────
const MAT = {
  stone:    new THREE.MeshStandardMaterial({color:0x9AA0A6, roughness:0.85, metalness:0.05}),
  stoneDk:  new THREE.MeshStandardMaterial({color:0x7A8088, roughness:0.9, metalness:0.0}),
  vermillion:new THREE.MeshStandardMaterial({color:0xC73E1D, roughness:0.55, metalness:0.15}),
  vermDk:   new THREE.MeshStandardMaterial({color:0x9A2E15, roughness:0.6, metalness:0.1}),
  gold:     new THREE.MeshStandardMaterial({color:0xE8B86D, roughness:0.35, metalness:0.6}),
  goldL:    new THREE.MeshStandardMaterial({color:0xF5D48A, roughness:0.25, metalness:0.7}),
  teak:     new THREE.MeshStandardMaterial({color:0x4A2C1A, roughness:0.7, metalness:0.05}),
  teakDk:   new THREE.MeshStandardMaterial({color:0x2D1A0E, roughness:0.75, metalness:0.0}),
  jadeDk:   new THREE.MeshStandardMaterial({color:0x2D6A4F, roughness:0.6, metalness:0.1}),
  jade:     new THREE.MeshStandardMaterial({color:0x40916C, roughness:0.55, metalness:0.15}),
  jadeLt:   new THREE.MeshStandardMaterial({color:0x5DB080, roughness:0.5, metalness:0.1}),
  sakuraLt: new THREE.MeshStandardMaterial({color:0xFFE5EC, roughness:0.6, metalness:0.0}),
  sakura:   new THREE.MeshStandardMaterial({color:0xFFB7C5, roughness:0.55, metalness:0.0}),
  sakuraDk: new THREE.MeshStandardMaterial({color:0xFF8FAB, roughness:0.5, metalness:0.0}),
  pond:     new THREE.MeshStandardMaterial({color:0x7ED6DF, roughness:0.1, metalness:0.3, transparent:true, opacity:0.88}),
  pondDk:   new THREE.MeshStandardMaterial({color:0x4A9BA8, roughness:0.1, metalness:0.3, transparent:true, opacity:0.7}),
  moss:     new THREE.MeshStandardMaterial({color:0x606C38, roughness:0.9, metalness:0.0}),
  mossLt:   new THREE.MeshStandardMaterial({color:0x7A8A50, roughness:0.85, metalness:0.0}),
  wood:     new THREE.MeshStandardMaterial({color:0x8B6F47, roughness:0.7, metalness:0.0}),
  woodDk:   new THREE.MeshStandardMaterial({color:0x5C4530, roughness:0.7, metalness:0.0}),
  roof:     new THREE.MeshStandardMaterial({color:0xA0522D, roughness:0.6, metalness:0.1}),
  roofDk:   new THREE.MeshStandardMaterial({color:0x7A3D22, roughness:0.65, metalness:0.1}),
  water:    new THREE.MeshStandardMaterial({color:0x3A7CA5, roughness:0.05, metalness:0.4, transparent:true, opacity:0.8}),
  waterSh:  new THREE.MeshStandardMaterial({color:0x5A9CC5, roughness:0.05, metalness:0.4, transparent:true, opacity:0.7}),
  ice:      new THREE.MeshStandardMaterial({color:0xD8E8F0, roughness:0.2, metalness:0.1, transparent:true, opacity:0.6}),
  bark:     new THREE.MeshStandardMaterial({color:0x5C3A1E, roughness:0.8, metalness:0.0}),
  leafDk:   new THREE.MeshStandardMaterial({color:0x2D5A27, roughness:0.8, metalness:0.0}),
  leaf:     new THREE.MeshStandardMaterial({color:0x3A7A32, roughness:0.75, metalness:0.0}),
  leafLt:   new THREE.MeshStandardMaterial({color:0x5A9A4A, roughness:0.7, metalness:0.0}),
  flower:   new THREE.MeshStandardMaterial({color:0xFFB7C5, roughness:0.5, metalness:0.0}),
  flowerW:  new THREE.MeshStandardMaterial({color:0xFFF0F5, roughness:0.5, metalness:0.0}),
  lantern:  new THREE.MeshStandardMaterial({color:0xE8B86D, roughness:0.3, metalness:0.5, emissive:0xE8B86D, emissiveIntensity:0.15}),
  lanternD: new THREE.MeshStandardMaterial({color:0x4A2C1A, roughness:0.7, metalness:0.1}),
  reeds:    new THREE.MeshStandardMaterial({color:0x7A8A4A, roughness:0.8, metalness:0.0}),
  finial:   new THREE.MeshStandardMaterial({color:0xE8B86D, roughness:0.3, metalness:0.6, emissive:0xE8B86D, emissiveIntensity:0.05}),
};

const backupEmissive = {};
for(const k in MAT){
  if(MAT[k].emissive){
    backupEmissive[k] = MAT[k].emissive.clone();
  }
}

// ─── voxel engine ───────────────────────────────────────────
const voxels = new Map(); // matKey -> [{x,y,z}, ...]
const geoBox = new THREE.BoxGeometry(0.96, 0.96, 0.96);

function vadd(x, y, z, mat){
  const arr = voxels.get(mat);
  if(arr) arr.push({x,y,z});
  else voxels.set(mat, [{x,y,z}]);
}
function vaddB(x, y, z, mat, w, h, d){
  for(let iy=0;iy<h;iy++)for(let iz=0;iz<d;iz++)for(let ix=0;ix<w;ix++){
    vadd(x+ix, y+iy, z+iz, mat);
  }
}

function buildInstanced(matKey){
  const arr = voxels.get(matKey);
  if(!arr || arr.length===0) return null;
  const mat = MAT[matKey];
  const mesh = new THREE.InstancedMesh(geoBox, mat, arr.length);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  const dummy = new THREE.Object3D();
  for(let i=0;i<arr.length;i++){
    const p = arr[i];
    dummy.position.set(p.x, p.y, p.z);
    dummy.updateMatrix();
    mesh.setMatrixAt(i, dummy.matrix);
  }
  mesh.instanceMatrix.needsUpdate = true;
  return mesh;
}

const mounted = [];
function mount(key){
  const m = buildInstanced(key);
  if(m){ scene.add(m); mounted.push(m); }
}

// ─── terrain ────────────────────────────────────────────────
function buildTerrain(){
  const heights = new Float32Array(IW*ID);
  for(let i=0;i<IW;i++)for(let j=0;j<ID;j++){
    const x = i - ISM, z = j - JSM;
    heights[j*IW+i] = islandHeight(x, z);
  }
  // surface voxels + cliff faces
  for(let i=0;i<IW;i++)for(let j=0;j<ID;j++){
    const x = i - ISM, z = j - JSM;
    const h = heights[j*IW+i];
    if(h < 0.3) continue;
    // surface
    vadd(x, h-0.5, z, h<2.5 ? 'moss' : (h<4 ? 'stone' : 'stone'));
    // surface detail: small bumps
    if(h > 2 && hash2(i*7+3, j*13+5) > 0.7){
      vadd(x + (hash2(i*3,j*5)-0.5), h-0.5, z + (hash2(i*11,j*7)-0.5), 'stoneDk');
    }
    // cliff faces: check neighbors
    const nx = (i<IW-1)?heights[j*IW+i+1]:0;
    const px = (i>0)?heights[j*IW+i-1]:0;
    const nz = (j<ID-1)?heights[(j+1)*IW+i]:0;
    const pz = (j>0)?heights[(j-1)*IW+i]:0;
    // right cliff
    if(nx < h-1.2){
      const drop = Math.floor(h - nx);
      for(let k=0;k<drop;k++) vadd(x+0.5, h-0.5-k, z, 'stoneDk');
    }
    // left cliff
    if(px < h-1.2){
      const drop = Math.floor(h - px);
      for(let k=0;k<drop;k++) vadd(x-0.5, h-0.5-k, z, 'stoneDk');
    }
    // front cliff
    if(nz < h-1.2){
      const drop = Math.floor(h - nz);
      for(let k=0;k<drop;k++) vadd(x, h-0.5-k, z+0.5, 'stoneDk');
    }
    // back cliff
    if(pz < h-1.2){
      const drop = Math.floor(h - pz);
      for(let k=0;k<drop;k++) vadd(x, h-0.5-k, z-0.5, 'stoneDk');
    }
  }
  // underside strata
  for(let i=4;i<IW-4;i+=2)for(let j=4;j<ID-4;j+=2){
    const x = i - ISM, z = j - JSM;
    const h = heights[j*IW+i];
    if(h < 1) continue;
    // tapered underside
    const distCenter = Math.sqrt((x/ISM)*(x/ISM)+(z/JSM)*(z/JSM));
    const taper = Math.max(0, 1 - distCenter*0.6);
    const underH = Math.floor(h * 0.4 * taper);
    for(let k=0;k<underH;k++){
      const y = 0.5 - k;
      if(y > -6){
        const rockType = (k%3===0)?'stoneDk':'stone';
        vadd(x, y, z, rockType);
      }
    }
    // roots / moss on underside edges
    if(h > 4 && hash2(i*5+1, j*7+3) > 0.6){
      for(let k=0;k<3;k++){
        vadd(x + (hash2(i*3,j*9)-0.5)*1.5, -0.5-k*0.5, z + (hash2(i*11,j*5)-0.5)*1.5, 'moss');
      }
    }
  }
  // extra rocks on surface
  for(let i=0;i<IW;i+=3)for(let j=0;j<ID;j+=3){
    const x = i - ISM, z = j - JSM;
    const h = heights[j*IW+i];
    if(h < 1.5) continue;
    if(hash2(i*17+5, j*23+11) > 0.85){
      const rsize = 1 + Math.floor(hash2(i*3,j*7)*2);
      for(let iy=0;iy<rsize;iy++)for(let iz=-1;iz<=1;iz++)for(let ix=-1;ix<=1;ix++){
        if(Math.abs(ix)+Math.abs(iz)<=1+vsizeRand(i,j)){
          vadd(x+ix, h-0.5-iy, z+iz, 'stoneDk');
        }
      }
    }
  }
}

function vsizeRand(i,j){ return hash2(i*3,j*7)>0.5?1:0; }

// ─── pagoda ─────────────────────────────────────────────────
const pagodaVox = { count:0 };
const pagodaFloors = []; // {mesh, doors, open, targetX}

function buildPagoda(){
  const baseX = -12, baseZ = -32, baseY = 11;
  const plinthSize = 12;
  // plinth
  vaddB(baseX-plinthSize/2, baseY-2, baseZ-plinthSize/2, 'stone', plinthSize, 2, plinthSize);
  vaddB(baseX-plinthSize/2, baseY, baseZ-plinthSize/2, 'stone', plinthSize, 1, plinthSize);
  // step
  vaddB(baseX-plinthSize/2-1, baseY+1, baseZ-plinthSize/2-1, 'stone', plinthSize+2, 1, plinthSize+2);

  const storyH = 4.5;
  const roofH = 2.8;
  const sizes = [9, 7.5, 6.5, 5.5, 4.5];
  const roofOverhangs = [2.5, 2.2, 2.0, 1.8, 1.5];

  for(let s=0;s<5;s++){
    const cx = baseX, cz = baseZ, cy = baseY + 3 + s*(storyH+roofH);
    const sz = sizes[s];
    const oh = roofOverhangs[s];
    const floorY = cy;

    // floor plate
    vaddB(cx-sz/2, floorY, cz-sz/2, 'wood', sz, 0.3, sz);

    // walls (4 sides, thin)
    const wallThick = 0.4;
    const wallH = storyH;
    // front wall (z+)
    vaddB(cx-sz/2+wallThick, floorY+0.3, cz+sz/2-wallThick, 'vermillion', sz-2*wallThick, wallH, wallThick);
    // back wall (z-)
    vaddB(cx-sz/2+wallThick, floorY+0.3, cz-sz/2, 'vermillion', sz-2*wallThick, wallH, wallThick);
    // left wall (x-)
    vaddB(cx-sz/2, floorY+0.3, cz-sz/2+wallThick, 'vermillion', wallThick, wallH, sz-2*wallThick);
    // right wall (x+)
    vaddB(cx+sz/2-wallThick, floorY+0.3, cz-sz/2+wallThick, 'vermillion', wallThick, wallH, sz-2*wallThick);

    // pillars (4 corners, slightly visible)
    const pillarW = 0.5;
    for(const [px,pz] of [[-1,1],[1,1],[-1,-1],[1,-1]]){
      vaddB(cx+px*sz/2-pillarW/2, floorY+0.3, cz+pz*sz/2-pillarW/2, 'vermillion', pillarW, wallH, pillarW);
    }

    // door openings (front wall): leave gap by not placing voxels
    // (we'll add doors separately)

    // balcony floor (under roof)
    const balcY = floorY + wallH;
    vaddB(cx-sz/2+0.3, balcY, cz-sz/2+0.3, 'wood', sz-0.6, 0.2, sz-0.6);

    // railing (simple posts)
    const railH = 0.8;
    for(let i=0;i<=4;i++){
      const t = i/4;
      const rx = cx - sz/2 + t*sz;
      const rz = cz + sz/2;
      vadd(rx, balcY+0.2, rz, 'vermillion');
      vadd(rx, balcY+0.2+railH, rz, 'vermillion');
      // rail bar
      if(i<4){
        const nx = cx - sz/2 + (i+1)/4*sz;
        vaddB(rx, balcY+0.2+railH*0.5, rz, 'vermillion', Math.abs(nx-rx)+0.2, 0.15, 0.15);
      }
    }
    for(let i=0;i<=4;i++){
      const t = i/4;
      const rz = cz - sz/2 + t*sz;
      const rx = cx + sz/2;
      vadd(rx, balcY+0.2, rz, 'vermillion');
      vadd(rx, balcY+0.2+railH, rz, 'vermillion');
      if(i<4){
        const nz = cz - sz/2 + (i+1)/4*sz;
        vaddB(rx, balcY+0.2+railH*0.5, rz, 'vermillion', 0.15, 0.15, Math.abs(nz-rz)+0.2);
      }
    }

    // ROOF — layered, upturned corners
    const roofY = balcY + 0.3;
    const rSize = sz + oh*2;
    const rThick = 0.4;

    // lower roof layer (wider)
    const r1Size = rSize + 0.8;
    // roof surface (slightly sloped, represented as flat with upturned corners)
    vaddB(cx-r1Size/2, roofY, cz-r1Size/2, 'roof', r1Size, rThick, r1Size);
    // upturned corners (4 corners, small triangles approximated as voxels)
    const cornerSize = 1.2;
    for(const [sx,sz2] of [[1,1],[-1,1],[1,-1],[-1,-1]]){
      for(let ix=0;ix<cornerSize;ix+=0.5){
        for(let iz=0;iz<cornerSize;iz+=0.5){
          const dist = Math.sqrt(ix*ix+iz*iz);
          if(dist < cornerSize && ix>0.2 && iz>0.2){
            const yy = roofY + rThick/2 + (1 - dist/cornerSize)*0.6;
            vadd(cx+sx*(r1Size/2-0.3)+sx*ix*0.4, yy, cz+sz2*(r1Size/2-0.3)+sz2*iz*0.4, 'roof');
          }
        }
      }
    }

    // upper roof layer (smaller, on top)
    const r2Size = sz + 1.2;
    const roofY2 = roofY + rThick + 0.2;
    vaddB(cx-r2Size/2, roofY2, cz-r2Size/2, 'roofDk', r2Size, rThick*0.8, r2Size);
    // upturned corners on upper roof
    for(const [sx,sz2] of [[1,1],[-1,1],[1,-1],[-1,-1]]){
      for(let ix=0;ix<0.8;ix+=0.4){
        for(let iz=0;iz<0.8;iz+=0.4){
          const dist = Math.sqrt(ix*ix+iz*iz);
          if(dist < 0.8 && ix>0.1 && iz>0.1){
            const yy = roofY2 + rThick*0.4 + (1-dist/0.8)*0.4;
            vadd(cx+sx*(r2Size/2-0.2)+sx*ix*0.3, yy, cz+sz2*(r2Size/2-0.2)+sz2*iz*0.3, 'roofDk');
          }
        }
      }
    }

    // eaves brackets (under lower roof)
    const bracketY = roofY - 0.1;
    for(let i=0;i<=4;i++){
      const t = i/4;
      // front
      const bx = cx - sz/2 + t*sz;
      const bz = cz + sz/2 + 0.3;
      vadd(bx, bracketY, bz, 'woodDk');
      // back
      const bz2 = cz - sz/2 - 0.3;
      vadd(bx, bracketY, bz2, 'woodDk');
      // left
      const bx2 = cx - sz/2 - 0.3;
      const bz3 = cz - sz/2 + t*sz;
      vadd(bx2, bracketY, bz3, 'woodDk');
      // right
      const bx3 = cx + sz/2 + 0.3;
      vadd(bx3, bracketY, bz3, 'woodDk');
    }

    // gold roof accents (ridge line)
    const ridgeY = roofY2 + rThick*0.4;
    vaddB(cx-r2Size/2+0.3, ridgeY, cz-r2Size/2+0.3, 'gold', r2Size-0.6, 0.15, 0.15);
    vaddB(cx-r2Size/2+0.3, ridgeY+0.1, cz-r2Size/2+0.3, 'goldL', r2Size-0.6, 0.1, 0.1);

    // interior warm light (visible through door openings)
    // place warm-colored voxels inside, visible from front
    const doorW = 1.2, doorH = 2.0;
    const doorX = cx, doorZ = cz + sz/2 - 0.3;
    for(let iy=0;iy<doorH;iy+=0.5){
      for(let ix=-doorW/2;ix<=doorW/2;ix+=0.5){
        vadd(doorX+ix, floorY+0.5+iy, doorZ, 'sakuraLt');
      }
    }

    // DOORS — separate instanced mesh for animation
    const doorVox = [];
    const doorMat = 'vermillion';
    const dw = 0.8, dh = doorH, dd = 0.15;
    for(let iy=0;iy<dh;iy+=0.4){
      for(let ix=-dw/2;ix<=dw/2;ix+=0.4){
        doorVox.push({x:doorX+ix, y:floorY+0.5+iy, z:doorZ+dd/2});
        doorVox.push({x:doorX+ix, y:floorY+0.5+iy, z:doorZ-dd/2});
      }
    }
    if(doorVox.length){
      const arr = doorVox;
      const mesh = new THREE.InstancedMesh(geoBox, MAT['vermillion'], arr.length);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      const dummy = new THREE.Object3D();
      for(let i=0;i<arr.length;i++){
        dummy.position.set(arr[i].x, arr[i].y, arr[i].z);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
      }
      mesh.instanceMatrix.needsUpdate = true;
      scene.add(mesh);
      pagodaFloors.push({
        floor:s, mesh, open:false,
        targetX:0, currentX:0,
        doorX:doorX, doorZ:doorZ,
        dw:dw, dh:dh
      });
      pagodaVox.count += arr.length;
    }


  }

  // finial (stacked spire on top)
  const topY = baseY + 3 + 5*(storyH+roofH) + 0.3;
  const finialX = baseX, finialZ = baseZ;
  // stacked discs
  for(let i=0;i<4;i++){
    const r = 0.6 - i*0.1;
    const y = topY + i*0.5;
    vaddB(finialX-r, y, finialZ-r, 'gold', r*2, 0.15, r*2);
    vaddB(finialX-r, y+0.1, finialZ-r, 'goldL', r*2, 0.1, r*2);
  }
  // spire
  vaddB(finialX-0.08, topY+2.2, finialZ-0.08, 'gold', 0.16, 1.2, 0.16);
  vaddB(finialX-0.05, topY+3.0, finialZ-0.05, 'finial', 0.1, 0.3, 0.1);
  // orb
  vaddB(finialX-0.2, topY+3.3, finialZ-0.2, 'gold', 0.4, 0.3, 0.4);
  vaddB(finialX-0.15, topY+3.4, finialZ-0.15, 'goldL', 0.3, 0.15, 0.3);

  pagodaVox.count += 120; // approximate finial count
}

// ─── bamboo forest ──────────────────────────────────────────
function buildBamboo(){
  const bx = -32, bz = 24;
  const bw = 34, bd = 26;
  const stalks = [];
  // generate stalk positions: clustered on both sides of a winding path
  const pathPoints = [];
  for(let t=0;t<=1;t+=0.05){
    const px = bx + 4 + t*(bw-8);
    const pz = bz + 2 + Math.sin(t*6)*4 + t*6;
    pathPoints.push({x:px, z:pz});
  }
  for(let i=0;i<44;i++){
    let attempts = 0;
    let placed = false;
    while(!placed && attempts<20){
      const sx = bx + 2 + Math.random()*(bw-4);
      const sz = bz + 2 + Math.random()*(bd-4);
      // check not too close to path
      let onPath = false;
      for(const pp of pathPoints){
        if(Math.sqrt((sx-pp.x)**2+(sz-pp.z)**2) < 2.5){ onPath = true; break; }
      }
      if(onPath){ attempts++; continue; }
      // check not too close to other stalks
      let tooClose = false;
      for(const st of stalks){
        if(Math.sqrt((sx-st.x)**2+(sz-st.z)**2) < 1.8){ tooClose = true; break; }
      }
      if(tooClose){ attempts++; continue; }
      stalks.push({x:sx, z:sz, h:6+Math.random()*5, wind:Math.random()*Math.PI*2});
      placed = true;
    }
  }

  for(const st of stalks){
    const h = st.h;
    const segments = Math.floor(h/1.2);
    const green = st.h > 8 ? 'leafDk' : (st.h > 6 ? 'leaf' : 'leafLt');
    // stalk segments (segmented green stems with joints)
    for(let s=0;s<segments;s++){
      const segH = (s===segments-1)? (h - s*1.2) : 1.2;
      const yBase = 1 + s*1.2;
      // main stalk
      vaddB(st.x-0.2, yBase, st.z-0.2, 'jadeDk', 0.4, segH, 0.4);
      // highlight side
      vaddB(st.x-0.2, yBase, st.z-0.1, 'jade', 0.15, segH, 0.1);
      // joint at top of segment
      if(s < segments-1){
        vaddB(st.x-0.3, yBase+segH-0.1, st.z-0.3, 'jadeDk', 0.6, 0.15, 0.6);
        vaddB(st.x-0.25, yBase+segH-0.05, st.z-0.25, 'jade', 0.4, 0.1, 0.4);
      }
    }
    // leaf cluster at top
    const topY = 1 + h;
    const leafColor = st.h > 8 ? 'leafDk' : (st.h > 6 ? 'leaf' : 'leafLt');
    for(let i=0;i<8;i++){
      const ang = i/8*Math.PI*2 + st.wind;
      const rad = 0.6 + Math.random()*0.4;
      const lx = st.x + Math.cos(ang)*rad;
      const lz = st.z + Math.sin(ang)*rad;
      const ly = topY - 0.3 + Math.random()*0.4;
      vaddB(lx-0.15, ly, lz-0.15, leafColor, 0.3, 0.15, 0.3);
      // leaf blade
      const ang2 = ang + 0.3;
      vaddB(lx+Math.cos(ang2)*0.3-0.1, ly+0.1, lz+Math.sin(ang2)*0.3-0.1, leafColor, 0.2, 0.1, 0.4);
    }
    // a few higher leaves
    for(let i=0;i<4;i++){
      const ang = i/4*Math.PI*2 + st.wind + 0.5;
      const rad = 0.8 + Math.random()*0.3;
      const lx = st.x + Math.cos(ang)*rad;
      const lz = st.z + Math.sin(ang)*rad;
      const ly = topY - 0.5;
      vaddB(lx-0.12, ly, lz-0.12, 'leafLt', 0.24, 0.12, 0.24);
    }
  }

  // bamboo fencing along path
  for(let t=0;t<=1;t+=0.08){
    const px = bx + 4 + t*(bw-8);
    const pz = bz + 2 + Math.sin(t*6)*4 + t*6;
    for(let side=-1;side<=1;side+=2){
      const fx = px + side*1.2;
      const fz = pz;
      vaddB(fx-0.08, 0.5, fz-0.08, 'wood', 0.16, 1.2, 0.16);
      vaddB(fx-0.08, 1.4, fz-0.08, 'wood', 0.16, 0.1, 0.16);
      // horizontal rails
      vaddB(fx-0.3, 0.7, fz-0.05, 'wood', 0.6, 0.08, 0.1);
      vaddB(fx-0.3, 1.2, fz-0.05, 'wood', 0.6, 0.08, 0.1);
    }
  }
}

// ─── zen garden ─────────────────────────────────────────────
function buildZenGarden(){
  const zx = 22, zz = 2;
  const zw = 30, zd = 22;
  const zTop = 6.5;

  // gravel bed
  for(let i=0;i<zw;i++)for(let j=0;j<zd;j++){
    const x = zx - zw/2 + i;
    const z = zz - zd/2 + j;
    // ripple / rake pattern
    const nx = i/zw, nz = j/zd;
    const rake = Math.sin(nx*20 + nz*8) * 0.5 + 0.5;
    const mat = rake > 0.6 ? 'stone' : (rake > 0.4 ? 'stoneDk' : 'moss');
    // concentric arcs around 3 rock groupings
    const rocks = [
      {x:zx-7, z:zz-5, r:3},
      {x:zx+4, z:zz+3, r:2.5},
      {x:zx-2, z:zz+6, r:2}
    ];
    let nearRock = false;
    for(const rk of rocks){
      const d = Math.sqrt((x-rk.x)**2+(z-rk.z)**2);
      if(d < rk.r + 1.5) nearRock = true;
      if(d < rk.r){
        // rock grouping
        if(hash2(i*13+j*7+j, j*11+i*5) > 0.3){
          vadd(x, zTop-0.3, z, 'stoneDk');
        }
        continue;
      }
    }
    if(nearRock){
      vadd(x, zTop-0.3, z, 'stone');
    } else {
      vadd(x, zTop-0.3, z, mat);
    }
    // moss at rock bases
    for(const rk of rocks){
      const d = Math.sqrt((x-rk.x)**2+(z-rk.z)**2);
      if(d < rk.r + 0.5 && d > rk.r-0.5){
        vadd(x, zTop-0.5, z, 'mossLt');
      }
    }
  }

  // stone edge
  for(let i=0;i<zw+2;i++)for(let j=0;j<2;j++){
    const x = zx - zw/2 - 1 + i;
    const z = zz - zd/2 - 1 + j;
    if(x>zx-zw/2-1 && x<zx+zw/2+1 && z>zz-zd/2-1 && z<zz+zd/2+1){
      if(i<2 || i>zw || j<2 || j>zd){
        // edge voxels
      }
    }
  }
  // actual edge placement
  for(let i=0;i<zw+2;i++){
    for(const [oz] of [[-1],[zd+1]]){
      const x = zx - zw/2 - 1 + i;
      const z = zz + oz;
      if(x>=zx-zw/2-1 && x<=zx+zw/2+1 && z>=zz-1 && z<=zz+zd+1){
        vadd(x, zTop-0.3, z, 'stone');
      }
    }
  }
  for(let j=0;j<zd+2;j++){
    for(const [ox] of [[-1],[zw+1]]){
      const x = zx + ox;
      const z = zz - zd/2 - 1 + j;
      if(x>=zx-zw/2-1 && x<=zx+zw/2+1 && z>=zz-zd/2-1 && z<=zz+zd+1){
        vadd(x, zTop-0.3, z, 'stone');
      }
    }
  }

  // rake lines (parallel grooves) — slightly depressed voxels of different shade
  for(let k=0;k<12;k++){
    const offset = k * 1.6;
    for(let i=0;i<zw;i+=0.5){
      const x = zx - zw/2 + i;
      const z = zz + offset;
      if(z>zz-zd/2 && z<zz+zd/2){
        vadd(x, zTop-0.4, z, 'stoneDk');
      }
    }
  }
  for(let k=0;k<8;k++){
    const offset = k * 1.8 + 0.7;
    for(let i=0;i<zw;i+=0.5){
      const x = zx - zw/2 + i;
      const z = zz - offset;
      if(z>zz-zd/2 && z<zz+zd/2){
        vadd(x, zTop-0.4, z, 'stoneDk');
      }
    }
  }
}

// ─── pools and waterfall ────────────────────────────────────
const koi = [];
const rippleMeshes = [];

function buildPools(){
  // Top pool (rocky spring basin) at (-28, -38), elevation ~9.5
  const tpx = -28, tpz = -38, tpy = 9.0;
  const tpSize = 10;
  // water surface
  vaddB(tpx-tpSize/2, tpy+0.1, tpz-tpSize/2, 'pond', tpSize, 0.2, tpSize);
  vaddB(tpx-tpSize/2, tpy+0.2, tpz-tpSize/2, 'pondDk', tpSize, 0.1, tpSize);
  // rocky basin edge
  for(let i=0;i<tpSize+4;i+=1)for(let j=0;j<tpSize+4;j+=1){
    const x = tpx - tpSize/2 - 2 + i;
    const z = tpz - tpSize/2 - 2 + j;
    const d = Math.sqrt((x-tpx)**2+(z-tpz)**2);
    if(d > tpSize/2-1 && d < tpSize/2+2){
      const h = tpy + 0.3 + (d-(tpSize/2-1))*0.3;
      vadd(x, h-0.5, z, 'stoneDk');
      if(hash2(i*7,j*11)>0.6) vadd(x, h-0.5, z, 'stone');
    }
  }
  // spring bubbles (small white voxels)
  for(let i=0;i<8;i++){
    const bx = tpx + (hash2(i*3+1, i*7+2)-0.5)*tpSize*0.6;
    const bz = tpz + (hash2(i*5+3, i*11+1)-0.5)*tpSize*0.6;
    vadd(bx, tpy+0.4, bz, 'ice');
  }

  // Middle pool (koi pond) at (18, 8), elevation ~5.0
  const mpx = 18, mpz = 8, mpy = 4.8;
  const mpsz = 14;
  // water surface
  vaddB(mpx-mpsz/2, mpy+0.1, mpz-mpsz/2, 'pond', mpsz, 0.25, mpsz);
  vaddB(mpx-mpsz/2, mpy+0.25, mpz-mpsz/2, 'pondDk', mpsz, 0.15, mpsz);
  // planted bank (right side)
  for(let i=0;i<6;i++){
    const bx = mpx + mpsz/2 + 1 + i*0.8;
    for(let j=0;j<4;j++){
      const bz = mpz - mpsz/2 + 2 + j*2;
      vadd(bx, mpy+0.3, bz, 'moss');
      vadd(bx+0.3, mpy+0.5, bz, 'leafLt');
      vadd(bx-0.3, mpy+0.5, bz+0.2, 'leaf');
    }
  }
  // left bank
  for(let i=0;i<5;i++){
    const bx = mpx - mpsz/2 - 1 - i*0.8;
    for(let j=0;j<4;j++){
      const bz = mpz - mpsz/2 + 3 + j*2;
      vadd(bx, mpy+0.3, bz, 'moss');
      vadd(bx+0.2, mpy+0.5, bz+0.1, 'leaf');
    }
  }
  // koi fish (6 animated)
  for(let i=0;i<6;i++){
    const kx = mpx + (hash2(i*3+1, i*7+2)-0.5)*mpsz*0.6;
    const kz = mpz + (hash2(i*5+3, i*11+1)-0.5)*mpsz*0.6;
    koi.push({
      x:kx, z:kz, y:mpy+0.15,
      vx:(hash2(i*3,i*7)-0.5)*0.3,
      vz:(hash2(i*5,i*11)-0.5)*0.3,
      phase:Math.random()*Math.PI*2,
      color: i%3===0?'sakuraLt':(i%3===1?'sakura':'vermillion'),
      size: 0.5+Math.random()*0.2
    });
  }
  // ripples (visual)
  for(let i=0;i<5;i++){
    rippleMeshes.push({
      x:mpx + (hash2(i*3,i*7)-0.5)*mpsz*0.5,
      z:mpz + (hash2(i*5,i*11)-0.5)*mpsz*0.5,
      phase:Math.random()*Math.PI*2,
      speed:0.5+Math.random()*0.3,
      radius:0.3
    });
  }

  // Lower pool (reeds + stepping stones) at (8, 48), elevation ~2.0
  const lpx = 8, lpz = 48, lpy = 1.8;
  const lpsz = 12;
  // water
  vaddB(lpx-lpsz/2, lpy+0.1, lpz-lpsz/2, 'water', lpsz, 0.2, lpsz);
  vaddB(lpx-lpsz/2, lpy+0.2, lpz-lpsz/2, 'waterSh', lpsz, 0.1, lpsz);
  // reeds around edge
  for(let i=0;i<20;i++){
    const rx = lpx + (hash2(i*3+1, i*7+2)-0.5)*lpsz*0.9;
    const rz = lpz + (hash2(i*5+3, i*11+1)-0.5)*lpsz*0.9;
    const d = Math.sqrt((rx-lpx)**2+(rz-lpz)**2);
    if(d > lpsz/2-1.5 && d < lpsz/2+1){
      const h = 0.8 + hash2(i*13,i*17)*0.6;
      vadd(rx, lpy+h-0.5, rz, 'reeds');
      vadd(rx, lpy+h-0.3, rz, 'reeds');
      vadd(rx+(hash2(i*5,i*7)-0.5)*0.2, lpy+h-0.1, rz+(hash2(i*3,i*11)-0.5)*0.2, 'reeds');
    }
  }
  // stepping stones
  for(let i=0;i<6;i++){
    const sx = lpx - lpsz/2 + 2 + i*1.8 + (hash2(i*3,i*7)-0.5)*0.3;
    const sz = lpz - lpsz/2 + 2 + (i%3)*2.5 + (hash2(i*5,i*11)-0.5)*0.3;
    vaddB(sx-0.3, lpy+0.3, sz-0.3, 'stone', 0.6, 0.2, 0.6);
    vaddB(sx-0.25, lpy+0.35, sz-0.25, 'stoneDk', 0.5, 0.1, 0.5);
  }

  // Streams connecting pools
  // top to middle: stream from (-22, -30) to (14, 4)
  const stream1 = [{x:-22,z:-30},{x:-18,z:-24},{x:-14,z:-18},{x:-10,z:-12},{x:-6,z:-6},{x:-2,z:0},{x:2,z:6},{x:6,z:10},{x:10,z:14},{x:14,z:18}];
  for(let i=0;i<stream1.length-1;i++){
    const a = stream1[i], b = stream1[i+1];
    const steps = 8;
    for(let s=0;s<steps;s++){
      const t = s/steps;
      const sx = a.x + (b.x-a.x)*t;
      const sz = a.z + (b.z-a.z)*t;
      // get height at this point, place water voxel slightly below
      const h = islandHeight(sx, sz);
      const wy = Math.max(0.5, h - 0.3);
      vadd(sx, wy+0.1, sz, 'pond');
    }
  }
  // middle to lower: stream from (14, 20) to (6, 45)
  const stream2 = [{x:14,z:20},{x:12,z:24},{x:10,z:28},{x:8,z:32},{x:7,z:36},{x:6,z:40},{x:6,z:44}];
  for(let i=0;i<stream2.length-1;i++){
    const a = stream2[i], b = stream2[i+1];
    const steps = 7;
    for(let s=0;s<steps;s++){
      const t = s/steps;
      const sx = a.x + (b.x-a.x)*t;
      const sz = a.z + (b.z-a.z)*t;
      const h = islandHeight(sx, sz);
      const wy = Math.max(0.5, h - 0.3);
      vadd(sx, wy+0.1, sz, 'pond');
    }
  }

  // Waterfall: from lower pool outlet over cliff
  // outlet at (6, 44), water goes over cliff at z < -45
  const wfStart = {x:6, z:44};
  const wfEnd = {x:6, z:-48};
  const wfSteps = 30;
  for(let s=0;s<wfSteps;s++){
    const t = s/wfSteps;
    const sx = wfStart.x + (wfEnd.x-wfStart.x)*t;
    const sz = wfStart.z + (wfEnd.z-wfStart.z)*t;
    const h = islandHeight(sx, sz);
    const wy = Math.max(0.3, h - 0.2);
    // white water at drops (where height changes sharply)
    const nextH = islandHeight(sx, sz - 0.5);
    const isDrop = (h - nextH) > 1.5;
    vadd(sx, wy+0.1, sz, isDrop ? 'ice' : 'water');
    if(isDrop && s%3===0){
      vadd(sx+(hash2(s*3,s*7)-0.5)*0.4, wy+0.5, sz+(hash2(s*5,s*11)-0.5)*0.4, 'ice');
    }
  }
  // mist at waterfall base
  for(let i=0;i<12;i++){
    const mx = wfEnd.x + (hash2(i*3+1,i*7+2)-0.5)*3;
    const mz = wfEnd.z + 2 + (hash2(i*5+3,i*11+1)-0.5)*2;
    vadd(mx, 0.5+hash2(i*13,i*17)*1.0, mz, 'ice');
  }
}

// ─── bridge ─────────────────────────────────────────────────
function buildBridge(){
  // arched wooden bridge over middle pond
  // from (8, 2) to (28, 14)
  const bx1 = 8, bz1 = 2, bx2 = 28, bz2 = 14;
  const span = Math.sqrt((bx2-bx1)**2+(bz2-bz1)**2);
  const segments = 16;
  const archHeight = 1.8;

  for(let i=0;i<=segments;i++){
    const t = i/segments;
    const px = bx1 + (bx2-bx1)*t;
    const pz = bz1 + (bz2-bz1)*t;
    const baseH = islandHeight(px, pz);
    const arch = Math.sin(t*Math.PI) * archHeight;
    const y = baseH + 0.3 + arch;

    // deck planks
    const plankW = 0.5, plankD = 0.15;
    const ang = Math.atan2(bx2-bx1, bz2-bz1);
    const perpX = -Math.sin(ang), perpZ = Math.cos(ang);
    for(let side=-1;side<=1;side+=2){
      const ox = side*perpX*0.4;
      const oz = side*perpZ*0.4;
      vaddB(px-ox-plankW/2, y, pz-oz-plankD/2, 'wood', plankW, 0.12, plankD);
    }
    // center plank
    vaddB(px-0.2, y+0.05, pz-0.07, 'woodDk', 0.4, 0.1, 0.14);

    // support beam under arch
    if(i%2===0){
      vaddB(px-0.15, y-0.15, pz-0.15, 'woodDk', 0.3, 0.3, 0.3);
    }
  }

  // railings
  for(let i=0;i<=segments;i+=2){
    const t = i/segments;
    const px = bx1 + (bx2-bx1)*t;
    const pz = bz1 + (bz2-bz1)*t;
    const baseH = islandHeight(px, pz);
    const arch = Math.sin(t*Math.PI) * archHeight;
    const y = baseH + 0.3 + arch;
    const ang = Math.atan2(bx2-bx1, bz2-bz1);
    const perpX = -Math.sin(ang), perpZ = Math.cos(ang);
    // posts
    for(let side=-1;side<=1;side+=2){
      const ox = side*perpX*0.5;
      const oz = side*perpZ*0.5;
      vaddB(px+ox-0.06, y+0.1, pz+oz-0.06, 'wood', 0.12, 0.6, 0.12);
      vaddB(px+ox-0.04, y+0.5, pz+oz-0.04, 'wood', 0.08, 0.15, 0.08);
    }
    // rail bars
    for(let side=-1;side<=1;side+=2){
      const ox = side*perpX*0.5;
      const oz = side*perpZ*0.5;
      if(i<segments){
        const nx = bx1 + (bx2-bx1)*((i+2)/segments);
        const nz = bz1 + (bz2-bz1)*((i+2)/segments);
        const nBaseH = islandHeight(nx, nz);
        const nArch = Math.sin((i+2)/segments*Math.PI) * archHeight;
        const ny = nBaseH + 0.3 + nArch;
        const dx = nx-px, dz = nz-pz;
        const len = Math.sqrt(dx*dx+dz*dz);
        if(len>0){
          vaddB(px+ox, y+0.45, pz+oz, 'wood', len, 0.06, 0.06);
        }
      }
    }
  }

  // bridge supports (visible underwater)
  for(let i=2;i<segments;i+=4){
    const t = i/segments;
    const px = bx1 + (bx2-bx1)*t;
    const pz = bz1 + (bz2-bz1)*t;
    const baseH = islandHeight(px, pz);
    vaddB(px-0.2, baseH-0.2, pz-0.2, 'woodDk', 0.4, 0.4, 0.4);
  }
}

// ─── ornamental trees ───────────────────────────────────────
const treeData = []; // for wind animation and petals

function buildTrees(){
  // 3 sakura, 2 pine, 2 maple, 1 willow
  const trees = [
    {type:'sakura', x:5, z:-18, s:1.0, col:'sakura'},
    {type:'sakura', x:-22, z:-10, s:1.1, col:'sakura'},
    {type:'sakura', x:28, z:-8, s:0.9, col:'sakuraLt'},
    {type:'pine', x:-28, z:12, s:1.2, col:'leafDk'},
    {type:'pine', x:32, z:18, s:1.0, col:'leaf'},
    {type:'maple', x:-8, z:28, s:1.0, col:'sakuraDk'},
    {type:'maple', x:34, z:-14, s:0.9, col:'sakura'},
    {type:'willow', x:2, z:38, s:1.1, col:'leafLt'},
  ];

  for(const t of trees){
    const h = 4 + t.s*2;
    const trunkH = t.type==='willow'?3:t.type==='pine'?3.5:2.5;
    const trunkW = 0.3;

    // trunk
    vaddB(t.x-trunkW/2, 0.5, t.z-trunkW/2, 'bark', trunkW, trunkH, trunkW);
    // trunk taper
    vaddB(t.x-trunkW/2+0.1, 0.5+trunkH*0.5, t.z-trunkW/2+0.1, 'bark', trunkW*0.6, trunkH*0.3, trunkW*0.6);

    treeData.push({x:t.x, z:t.z, type:t.type, col:t.col, h:h, trunkH:trunkH, phase:Math.random()*Math.PI*2, sway:0.03+t.s*0.02});

    if(t.type==='sakura'){
      // spreading canopy
      const r = 2.0 * t.s;
      for(let i=0;i<25;i++){
        const ang = Math.random()*Math.PI*2;
        const rad = Math.random()*r;
        const cx = t.x + Math.cos(ang)*rad;
        const cz = t.z + Math.sin(ang)*rad;
        const cy = 0.5 + trunkH + 0.5 + Math.random()*1.5*(1-rad/r);
        const col = i%3===0?'sakuraLt':(i%3===1?'sakura':'sakuraDk');
        vaddB(cx-0.3, cy-0.2, cz-0.3, col, 0.6, 0.3, 0.6);
        // flower clusters
        if(Math.random()>0.5){
          vaddB(cx-0.2, cy+0.1, cz-0.2, 'flower', 0.3, 0.2, 0.3);
        }
      }
    } else if(t.type==='pine'){
      // conical canopy
      const r = 1.0 * t.s;
      for(let i=0;i<30;i++){
        const ang = Math.random()*Math.PI*2;
        const rad = Math.random()*r*(1 - Math.random()*0.3);
        const cx = t.x + Math.cos(ang)*rad;
        const cz = t.z + Math.sin(ang)*rad;
        const cy = 0.5 + trunkH + 1.5*(1-rad/r);
        const col = i%2===0?'leafDk':'leaf';
        vaddB(cx-0.2, cy-0.15, cz-0.2, col, 0.4, 0.2, 0.4);
        // needles
        if(Math.random()>0.6){
          const ang2 = ang + 0.3;
          vaddB(cx+Math.cos(ang2)*0.2, cy+0.1, cz+Math.sin(ang2)*0.2, 'leafLt', 0.15, 0.1, 0.15);
        }
      }
    } else if(t.type==='maple'){
      // rounded canopy, smaller
      const r = 1.2 * t.s;
      for(let i=0;i<20;i++){
        const ang = Math.random()*Math.PI*2;
        const rad = Math.random()*r;
        const cx = t.x + Math.cos(ang)*rad;
        const cz = t.z + Math.sin(ang)*rad;
        const cy = 0.5 + trunkH + 1.0*(1-rad/r);
        const col = i%3===0?'sakuraDk':(i%3===1?'sakura':'sakuraLt');
        vaddB(cx-0.25, cy-0.15, cz-0.25, col, 0.5, 0.2, 0.5);
      }
    } else if(t.type==='willow'){
      // weeping canopy — long trailing branches
      const r = 1.8 * t.s;
      for(let i=0;i<20;i++){
        const ang = Math.random()*Math.PI*2;
        const rad = Math.random()*r*0.5;
        const cx = t.x + Math.cos(ang)*rad;
        const cz = t.z + Math.sin(ang)*rad;
        const cy = 0.5 + trunkH;
        // drooping branches
        for(let d=0;d<3;d++){
          const dropX = cx + Math.cos(ang*2+d)*0.3*(d+1);
          const dropZ = cz + Math.sin(ang*2+d)*0.3*(d+1);
          const dropY = cy - d*0.5;
          vaddB(dropX-0.15, dropY-0.05, dropZ-0.15, 'leafLt', 0.3, 0.15, 0.3);
          vaddB(dropX-0.1, dropY+0.05, dropZ-0.1, 'leaf', 0.2, 0.1, 0.2);
        }
      }
    }
  }
}

// ─── day/night cycle ────────────────────────────────────────
let timeOfDay = 0.35; // 0-1, 0=midnight, 0.5=noon, 1=midnight
let cyclePaused = false;
let cycleSpeed = 1/90; // 90 seconds per cycle

function updateLighting(t){
  // t: 0-1, 0=midnight, 0.25=dawn, 0.5=noon, 0.75=dusk, 1=midnight
  const angle = t * Math.PI * 2 - Math.PI/2; // -PI/2 at t=0 (midnight), PI/2 at t=0.5 (noon)
  const sunX = Math.cos(angle) * 70;
  const sunY = Math.sin(angle) * 70 + 10;
  const sunZ = Math.sin(angle*0.7) * 50;

  sunLight.position.set(sunX, Math.max(2, sunY), sunZ);
  sunSphere.position.copy(sunLight.position);

  // sun color / intensity
  const dayFactor = Math.max(0, Math.sin(angle));
  const sunIntensity = dayFactor * 1.8 + 0.05;
  sunLight.intensity = sunIntensity;
  const warm = Math.max(0, Math.min(1, (dayFactor-0.1)*5));
  const cool = 1 - warm;
  sunLight.color.setRGB(
    1.0 * warm + 0.6 * cool,
    0.9 * warm + 0.7 * cool,
    0.7 * warm + 0.9 * cool
  );

  // hemi
  const skyColor = new THREE.Color();
  const groundColor = new THREE.Color();
  if(dayFactor > 0.3){
    skyColor.setRGB(0.53, 0.73, 0.87);
    groundColor.setRGB(0.15, 0.12, 0.08);
  } else if(dayFactor > 0.1){
    const f = (dayFactor-0.1)/0.2;
    skyColor.setRGB(0.53*f + 0.2*f + 0.05*(1-f), 0.73*f + 0.15*f + 0.05*(1-f), 0.87*f + 0.1*f + 0.1*(1-f));
    groundColor.setRGB(0.15, 0.12, 0.08);
  } else {
    skyColor.setRGB(0.05, 0.05, 0.12);
    groundColor.setRGB(0.02, 0.02, 0.04);
  }
  hemiLight.color.copy(skyColor);
  hemiLight.groundColor.copy(groundColor);
  hemiLight.intensity = 0.3 + dayFactor*0.5;

  // moon
  const moonPhase = Math.sin(angle + Math.PI);
  moonSphere.position.set(-sunX*0.5, 30 - sunY*0.3, -sunZ*0.5);
  moonSphere.material.opacity = Math.max(0, Math.min(0.7, -moonPhase*0.7));

  // sky/fog color
  const fogColor = new THREE.Color();
  fogColor.lerpColors(
    new THREE.Color(0x0a0a18),
    new THREE.Color(0x1a1a2e),
    dayFactor
  );
  scene.fog.color.copy(fogColor);

  // lantern lights
  const lanternOn = dayFactor < 0.45; // turn on at dusk
  for(const ll of lanternLights){
    const targetOn = ll.on && lanternOn;
    const targetIntensity = targetOn ? ll.baseIntensity : 0;
    // smooth transition
    ll.light.intensity += (targetIntensity - ll.light.intensity) * 0.05;
    // flicker when on
    if(targetOn){
      const flicker = 0.95 + Math.sin(ll.phase + performance.now()*0.003)*0.03 + Math.sin(ll.phase*2 + performance.now()*0.005)*0.02;
      ll.light.intensity *= flicker;
    }
    // emissive on lantern voxels
    const emissiveIntensity = targetOn ? 0.4 : 0.05;
    MAT.lantern.emissiveIntensity += (emissiveIntensity - MAT.lantern.emissiveIntensity) * 0.05;
    MAT.lantern.emissive.setRGB(1, 0.7, 0.5);
  }

  // exposure
  renderer.toneMappingExposure = 0.6 + dayFactor*0.6;

  // update HUD time label
  const todLabels = ['midnight','dawn','day','dusk','midnight'];
  const todIdx = Math.floor(t * 4) % 4;
  document.getElementById('todLabel').textContent = todLabels[todIdx];
}

// ─── path ───────────────────────────────────────────────────
function buildPath(){
  // stone path from torii (12, 52) winding to pagoda (-12, -32)
  const pathPoints = [
    {x:12, z:52}, {x:12, z:48}, {x:14, z:44}, {x:16, z:40},
    {x:18, z:36}, {x:18, z:32}, {x:20, z:28}, {x:18, z:24},
    {x:16, z:20}, {x:14, z:16}, {x:12, z:12}, {x:10, z:8},
    {x:8, z:4}, {x:6, z:0}, {x:4, z:-4}, {x:2, z:-8},
    {x:0, z:-12}, {x:-2, z:-16}, {x:-4, z:-20}, {x:-6, z:-24},
    {x:-8, z:-28}, {x:-10, z:-32}, {x:-12, z:-32}
  ];
  for(let i=0;i<pathPoints.length-1;i++){
    const a = pathPoints[i], b = pathPoints[i+1];
    const dist = Math.sqrt((b.x-a.x)**2+(b.z-a.z)**2);
    const steps = Math.floor(dist * 2);
    for(let s=0;s<=steps;s++){
      const t = s/steps;
      const px = a.x + (b.x-a.x)*t;
      const pz = a.z + (b.z-a.z)*t;
      const h = islandHeight(px, pz);
      // paving stone
      const stoneSize = 0.7 + Math.random()*0.15;
      const rot = Math.random()*Math.PI*0.5;
      const ox = (Math.random()-0.5)*0.2;
      const oz = (Math.random()-0.5)*0.2;
      vaddB(px-ox-stoneSize/2, h-0.1, pz-oz-stoneSize/2, 'stone', stoneSize, 0.25, stoneSize);
      // mossy joints
      if(Math.random()>0.6){
        vadd(px+ (Math.random()-0.5)*0.3, h-0.1, pz+ (Math.random()-0.5)*0.3, 'moss');
      }
    }
  }
  // path into bamboo forest
  const forestPath = [
    {x:-12, z:-32}, {x:-14, z:-28}, {x:-16, z:-24}, {x:-18, z:-20},
    {x:-20, z:-16}, {x:-22, z:-12}, {x:-24, z:-8}, {x:-26, z:-4},
    {x:-28, z:0}, {x:-30, z:4}, {x:-32, z:8}, {x:-34, z:12},
    {x:-36, z:16}, {x:-38, z:20}
  ];
  for(let i=0;i<forestPath.length-1;i++){
    const a = forestPath[i], b = forestPath[i+1];
    const dist = Math.sqrt((b.x-a.x)**2+(b.z-a.z)**2);
    const steps = Math.floor(dist * 1.5);
    for(let s=0;s<=steps;s++){
      const t = s/steps;
      const px = a.x + (b.x-a.x)*t;
      const pz = a.z + (b.z-a.z)*t;
      const h = islandHeight(px, pz);
      const stoneSize = 0.6 + Math.random()*0.15;
      vaddB(px-stoneSize/2, h-0.1, pz-stoneSize/2, 'stoneDk', stoneSize, 0.2, stoneSize);
    }
  }
  // viewing path along zen garden edge
  const zenPath = [
    {x:22, z:-9}, {x:24, z:-7}, {x:26, z:-5}, {x:28, z:-3},
    {x:30, z:-1}, {x:32, z:1}, {x:34, z:3}
  ];
  for(let i=0;i<zenPath.length-1;i++){
    const a = zenPath[i], b = zenPath[i+1];
    const dist = Math.sqrt((b.x-a.x)**2+(b.z-a.z)**2);
    const steps = Math.floor(dist * 2);
    for(let s=0;s<=steps;s++){
      const t = s/steps;
      const px = a.x + (b.x-a.x)*t;
      const pz = a.z + (b.z-a.z)*t;
      const h = islandHeight(px, pz);
      vaddB(px-0.3, h-0.1, pz-0.3, 'stone', 0.6, 0.2, 0.6);
    }
  }
}

// ─── camera intro ───────────────────────────────────────────
let introPhase = 0; // 0=intro, 1=controls active
let introTime = 0;
const introStart = new THREE.Vector3(18, 26, 58);
const introEnd = new THREE.Vector3(55, 48, 78);
const introTargetStart = new THREE.Vector3(12, 6, 50);
const introTargetEnd = new THREE.Vector3(0, 6, -4);
let introActive = true;

function updateIntro(delta){
  if(!introActive) return;
  introTime += delta;
  const dur = 2.5;
  const t = Math.min(1, introTime/dur);
  // smoothstep
  const st = t*t*(3-2*t);
  camera.position.lerpVectors(introStart, introEnd, st);
  controls.target.lerpVectors(introTargetStart, introTargetEnd, st);
  camera.lookAt(controls.target);
  if(t >= 1){
    introActive = false;
    controls.autoRotate = true;
  }
}

// ─── interactions ───────────────────────────────────────────
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();

renderer.domElement.addEventListener('click', (e) => {
  pointer.x = (e.clientX/window.innerWidth)*2 - 1;
  pointer.y = -(e.clientY/window.innerHeight)*2 + 1;
  raycaster.setFromCamera(pointer, camera);

  // check lanterns
  const clickTargets = lanterns.map(l=>l.clickBox);
  const hits = raycaster.intersectObjects(clickTargets);
  if(hits.length){
    const idx = hits[0].object.userData.lanternIndex;
    if(idx!==undefined){
      const ll = lanternLights[idx];
      ll.on = !ll.on;
      // visual feedback
      const lant = lanterns[idx];
      if(ll.on){
        MAT.lantern.emissiveIntensity = 0.4;
      } else {
        MAT.lantern.emissiveIntensity = 0.05;
      }
    }
    return;
  }

  // check pagoda floors
  for(const pf of pagodaFloors){
    // check if click is near this floor's door
    const doorWorldX = pf.doorX;
    const doorWorldZ = pf.doorZ;
    const doorWorldY = 11 + 3 + pf.floor*(4.5+2.8) + 2;
    // approximate check
    const camDir = new THREE.Vector3();
    camera.getWorldDirection(camDir);
    // simple distance check from camera ray to door
    const planeNormal = camDir.clone();
    const planePoint = new THREE.Vector3(doorWorldX, doorWorldY, doorWorldZ);
    const denom = planeNormal.dot(camDir);
    if(Math.abs(denom)>0.01){
      const t2 = planeNormal.dot(planePoint.clone().sub(camera.position)) / denom;
      const intersectPt = camera.position.clone().add(camDir.clone().multiplyScalar(t2));
      const dist = intersectPt.distanceTo(planePoint);
      if(dist < 2.5){
        pf.open = !pf.open;
        pf.targetX = pf.open ? 1.2 : 0;
      }
    }
  }
});

// ─── animation loop ─────────────────────────────────────────
const clock = new THREE.Clock();

function animate(){
  const delta = Math.min(clock.getDelta(), 0.05);
  const elapsed = clock.elapsedTime;

  // day/night cycle
  if(!cyclePaused && !introActive){
    timeOfDay += delta * cycleSpeed;
    if(timeOfDay > 1) timeOfDay -= 1;
    todSlider.value = timeOfDay;
  }
  updateLighting(timeOfDay);
  todEl.textContent = timeOfDay.toFixed(2);

  // camera intro
  updateIntro(delta);

  // controls
  if(!introActive) controls.update();

  // pagoda door animation
  for(const pf of pagodaFloors){
    pf.currentX += (pf.targetX - pf.currentX) * Math.min(1, delta*4);
    const dx = pf.currentX;
    const dw = pf.dw, dh = pf.dh;
    const doorX = pf.doorX, doorZ = pf.doorZ;
    const baseY = 11 + 3 + pf.floor*(4.5+2.8);
    const dummy = new THREE.Object3D();
    let idx = 0;
    for(let iy=0;iy<dh;iy+=0.4){
      for(let ix=-dw/2;ix<=dw/2;ix+=0.4){
        const x = doorX+ix+dx;
        const y = baseY+0.5+iy;
        dummy.position.set(x, y, doorZ+0.075);
        dummy.updateMatrix();
        pf.mesh.setMatrixAt(idx++, dummy.matrix);
        dummy.position.set(x, y, doorZ-0.075);
        dummy.updateMatrix();
        pf.mesh.setMatrixAt(idx++, dummy.matrix);
      }
    }
    pf.mesh.instanceMatrix.needsUpdate = true;
  }

  // bird animation
  for(const b of birds){
    b.phase += delta * b.speed;
    const ang = b.phase;
    const cx = b.x + Math.cos(ang)*b.radius*0.1;
    const cz = b.z + Math.sin(ang*0.7)*b.radius*0.1;
    const cy = b.y + Math.sin(ang*1.3)*b.heightAmp;
    b.body.position.set(cx, cy, cz);
    b.body.rotation.y = ang*0.5;
    b.body.rotation.z = Math.sin(b.wingPhase + elapsed*3)*0.2;
    b.wingPhase += delta*2;
  }

  // koi animation
  for(const k of koi){
    k.x += k.vx * delta;
    k.z += k.vz * delta;
    k.phase += delta * 2;
    // bounce
    k.y = 4.8 + 0.1 + Math.sin(k.phase)*0.05;
    // boundary
    if(Math.abs(k.x-18) > 6 || Math.abs(k.z-8) > 6){
      k.vx *= -1;
      k.vz *= -1;
    }
    // random direction change
    if(Math.random() > 0.995){
      k.vx += (Math.random()-0.5)*0.2;
      k.vz += (Math.random()-0.5)*0.2;
    }
  }

  // ripple animation
  for(const r of rippleMeshes){
    r.phase += delta * r.speed;
    r.radius = 0.3 + Math.sin(r.phase)*0.15;
  }

  // petal animation
  if(petalSystem.mesh){
    const dummy = new THREE.Object3D();
    const pMat = petalSystem.mesh.material;
    for(let i=0;i<petalSystem.count;i++){
      const p = petalSystem.particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.z += p.vz;
      p.rot += p.rotSpeed;
      // reset if below ground
      const h = islandHeight(p.x, p.z);
      if(p.y < h){
        // reset to a tree
        const tree = treeData.filter(t=>t.type==='sakura')[Math.floor(Math.random()*3)];
        const ang = Math.random()*Math.PI*2;
        const rad = 0.5 + Math.random()*3;
        p.x = tree.x + Math.cos(ang)*rad;
        p.z = tree.z + Math.sin(ang)*rad;
        p.y = islandHeight(p.x, p.z) + 2 + Math.random()*2;
        p.vx = (Math.random()-0.5)*0.03;
        p.vy = -0.02 - Math.random()*0.025;
        p.vz = (Math.random()-0.5)*0.03;
      }
      dummy.position.set(p.x, p.y, p.z);
      dummy.rotation.set(0, p.rot, 0);
      dummy.scale.set(p.size*5, p.size*5, p.size*5);
      dummy.updateMatrix();
      petalSystem.mesh.setMatrixAt(i, dummy.matrix);
    }
    petalSystem.mesh.instanceMatrix.needsUpdate = true;
  }

  // bamboo wind
  // (skews the bamboo stalks slightly — done via instanced mesh rotation)
  // For simplicity, we update bamboo stalk positions slightly
  // Actually, let's skip per-frame bamboo updates for performance

  // tree wind (slight rotation of tree canopies)
  for(const t of treeData){
    const sway = Math.sin(elapsed*1.5 + t.phase) * t.sway;
    // trees are static voxel groups, can't easily animate
    // This is acceptable — wind is subtle
  }

  // fps
  frameCount++;
  fpsTime += delta;
  if(fpsTime >= 0.5){
    currentFps = Math.round(frameCount / fpsTime);
    frameCount = 0;
    fpsTime = 0;
    fpsEl.textContent = currentFps;
  }

  // bloom intensity varies with time
  bloom.strength = 0.15 + (1 - Math.max(0, Math.sin(timeOfDay*Math.PI*2 - Math.PI/2)))*0.15;

  // render
  composer.render();

  requestAnimationFrame(animate);
}
