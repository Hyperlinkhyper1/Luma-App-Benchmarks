<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

/* ============ RENDERER / SCENE ============ */
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.08;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xbfe3e0, 300, 1500);

const camera = new THREE.PerspectiveCamera(68, innerWidth/innerHeight, 0.1, 6000);
camera.position.set(300, 160, 320);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.05).texture;

/* ============ SHIP DIMENSIONS / PROFILE ============ */
const L = 280, HALF = L/2, BEAM = 17; // half-beam 17
const DEPTH_BASE = 16;

function tOf(z){ return (z + HALF) / L; }
function hullHWat(z){
  const t = tOf(z);
  let f = 1;
  if (t < 0.25) f = Math.pow(Math.max(t,0.001)/0.25, 0.62);
  else if (t > 0.82) f = 1 - 0.42*Math.pow((t-0.82)/0.18, 1.55);
  f *= 0.97 + 0.03*Math.sin(Math.PI*Math.min(1, Math.max(0,(t-0.15)/0.7)));
  return Math.max(BEAM*f, 0.45);
}
function deck7HW(z){
  let f = 1;
  if (z < -100) f = Math.max(0.4, 1 - (-100 - z)/14);
  else if (z > 96) f = Math.max(0.55, 1 - (z - 96)/12);
  return 15.3 * f;
}
function deckBEH(z){ // structural blockers
  let f = 1;
  if (z < -88) f = Math.max(0.3, 1 - (-88 - z)/15);
  else if (z > 82) f = Math.max(0.3, 1 - (z - 82)/13);
  return 13.0 * f;
}
function upperBEH(z){
  let f = 1;
  if (z < -76) f = Math.max(0.35, 1 - (-76 - z)/16);
  else if (z > 70) f = Math.max(0.3, 1 - (z - 70)/12);
  return 11.9 * f;
}

/* ============ MATERIALS ============ */
const matWhite = new THREE.MeshStandardMaterial({color:0xf2f4ef, roughness:0.5, metalness:0.12, side:THREE.DoubleSide});
const matWhiteSmooth = new THREE.MeshStandardMaterial({color:0xf5f7f4, roughness:0.55, metalness:0.05, side:THREE.DoubleSide});
const matSteel = new THREE.MeshStandardMaterial({color:0xb9c0c6, roughness:0.35, metalness:0.85});
const matGlass = new THREE.MeshStandardMaterial({color:0x18242c, roughness:0.12, metalness:0.9, side:THREE.DoubleSide, emissive:0xffb45c, emissiveIntensity:0});
const matTeal = new THREE.MeshStandardMaterial({color:0x135a5e, roughness:0.45, metalness:0.25, side:THREE.DoubleSide});
const matOrange = new THREE.MeshStandardMaterial({color:0xe8721c, roughness:0.5, metalness:0.15});

/* ============ TEXTURES (canvas) ============ */
function makeDeckTexture(){
  const c = document.createElement('canvas'); c.width = c.height = 256;
  const g = c.getContext('2d');
  g.fillStyle = '#d3cec1'; g.fillRect(0,0,256,256);
  for (let i=0;i<256;i++){ for(let j=0;j<256;j++){ const n=Math.random()*10-5; g.fillStyle=`rgba(${200+n},${195+n},${180+n},0.6)`; g.fillRect(j,i,1,1);} }
  g.strokeStyle = 'rgba(120,110,95,0.35)'; g.lineWidth = 2;
  for (let y=0;y<=256;y+=16){ g.beginPath(); g.moveTo(0,y); g.lineTo(256,y); g.stroke(); }
  g.strokeStyle = 'rgba(120,110,95,0.22)'; g.lineWidth = 1;
  for (let x=0;x<=256;x+=64){ g.beginPath(); g.moveTo(x,0); g.lineTo(x,256); g.stroke(); }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(0.09,0.09); t.anisotropy = 8;
  return t;
}
function makeFlagTexture(){
  const c = document.createElement('canvas'); c.width = 128; c.height = 64;
  const g = c.getContext('2d');
  g.fillStyle = '#ffffff'; g.fillRect(0,0,128,64);
  g.fillStyle = '#135a5e'; g.fillRect(0,0,128,18); g.fillRect(0,46,128,18);
  g.fillStyle = '#4fd1c5'; g.beginPath(); g.arc(64,32,13,0,Math.PI*2); g.fill();
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4; return t;
}
function makeStreakTexture(){
  const c = document.createElement('canvas'); c.width = 16; c.height = 64;
  const g = c.getContext('2d');
  const gr = g.createLinearGradient(0,0,0,64);
  gr.addColorStop(0,'rgba(255,255,255,0)'); gr.addColorStop(0.5,'rgba(255,255,255,.9)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle = gr; g.fillRect(6,0,4,64);
  return new THREE.CanvasTexture(c);
}
function makeGlowSprite(){
  const c = document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d');
  const gr=g.createRadialGradient(32,32,0,32,32,32);
  gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.4,'rgba(255,255,255,.4)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
function makeWakeTexture(){
  const c=document.createElement('canvas'); c.width=128; c.height=256;
  const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,256);
  gr.addColorStop(0,'rgba(255,255,255,.85)'); gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr; g.fillRect(0,0,128,256);
  // noise streaks
  g.globalCompositeOperation='destination-out';
  for(let i=0;i<300;i++){ const x=Math.random()*128,y=Math.random()*256; g.fillStyle='rgba(0,0,0,.5)'; g.fillRect(x,y,2+Math.random()*4,10+Math.random()*22); }
  return new THREE.CanvasTexture(c);
}

const deckTexture = makeDeckTexture();
const flagTexture = makeFlagTexture();
const streakTexture = makeStreakTexture();
const glowTexture = makeGlowSprite();
const wakeTexture = makeWakeTexture();

/* ============ SHIP GROUP ============ */
const shipGroup = new THREE.Group();
scene.add(shipGroup);

function footprintShape(hwFn, zMin, zMax, step = 5){
  const shape = new THREE.Shape();
  const zs = [];
  for (let z = zMin; z <= zMax + 0.001; z += step) zs.push(z);
  if (zs[zs.length-1] !== zMax) zs.push(zMax);
  shape.moveTo(-hwFn(zMin), zMin);
  for (let i = 1; i < zs.length; i++) shape.lineTo(-hwFn(zs[i]), zs[i]);
  for (let i = zs.length-1; i >= 0; i--) shape.lineTo(hwFn(zs[i]), zs[i]);
  shape.closePath();
  return shape;
}

/* ---- Hull: lofted organic cross-sections with painted bands ---- */
function buildHull(){
  const N = 110, M = 30;
  const pos = [], col = [], idx = [];
  const cRed = new THREE.Color(0x541713), cStripe = new THREE.Color(0x11161d), cWhite = new THREE.Color(0xeef1ec);
  for (let i = 0; i <= N; i++){
    const t = i / N;
    const z = -HALF + L*t;
    const hw = Math.max(0.4, hullHWat(z));
    const depth = Math.max(12.2, 16*(0.42 + 0.58*Math.sin(Math.PI*Math.min(1, 0.12 + 0.88*t))));
    const bowRise = t < 0.22 ? 2.8*Math.pow((0.22 - t)/0.22, 2) : 0;
    const sternRise = t > 0.80 ? 2.0*Math.pow((t - 0.80)/0.20, 2) : 0;
    const deckY = 9 + bowRise + sternRise;
    for (let j = 0; j <= M; j++){
      const u = -1 + 2*j/M;
      const y = deckY - depth*Math.sqrt(Math.max(0, 1 - u*u));
      const x = u * hw;
      pos.push(x, y, z);
      const c = y < 0.6 ? cRed : (y < 2.8 ? cStripe : cWhite);
      col.push(c.r, c.g, c.b);
    }
  }
  for (let i = 0; i < N; i++){
    for (let j = 0; j < M; j++){
      const a = (i*(M+1) + j), b = (i*(M+1) + j + 1), c = ((i+1)*(M+1) + j), d = ((i+1)*(M+1) + j + 1);
      idx.push(a, c, b, b, c, d);
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
  g.setIndex(idx);
  g.computeVertexNormals();
  const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({vertexColors:true, roughness:0.5, metalness:0.18, side:THREE.DoubleSide}));
  m.castShadow = true; m.receiveShadow = true;
  shipGroup.add(m);

  // deck plate (main deck walking surface)
  const shape = footprintShape(z => hullHWat(z)*0.985, -134, 136, 5);
  const floorGeo = new THREE.ShapeGeometry(shape);
  floorGeo.rotateX(Math.PI/2);
  const floor = new THREE.Mesh(floorGeo, new THREE.MeshStandardMaterial({map:deckTexture, color:0xffffff, roughness:0.85, metalness:0.05, side:THREE.DoubleSide}));
  floor.rotation.x = 0; floor.position.y = 9.04;
  floor.receiveShadow = true;
  shipGroup.add(floor);

  // teal trim + teal stripe at deck edge
  const trimShape = footprintShape(z => hullHWat(z) + 0.14, -131, 132, 5);
  const trimGeo = new THREE.ExtrudeGeometry(trimShape, {depth: 0.38, bevelEnabled:false});
  trimGeo.rotateX(Math.PI/2);
  const trim = new THREE.Mesh(trimGeo, matTeal);
  trim.position.y = 9.42; trim.castShadow = true;
  shipGroup.add(trim);

  // portholes
  const phGeo = new THREE.CircleGeometry(0.32, 12);
  const phMat = new THREE.MeshStandardMaterial({color:0x1c2630, roughness:0.25, metalness:0.7});
  const phPos = [];
  for (let z = -124; z <= 130; z += 7.5){
    for (const side of [-1, 1]){
      const t = tOf(z);
      const hw = hullHWat(z);
      const depth = Math.max(12.2, 16*(0.42 + 0.58*Math.sin(Math.PI*Math.min(1, 0.12 + 0.88*t))));
      const u = Math.sqrt(Math.max(0, 1 - Math.pow((9 - 6.15)/depth, 2)));
      const x = side * hw * u * 1.004;
      phPos.push([x, 6.15, z, side]);
    }
  }
  const portholes = new THREE.InstancedMesh(phGeo, phMat, phPos.length);
  const mtx = new THREE.Matrix4();
  phPos.forEach((p, i) => {
    const ry = p[3] > 0 ? Math.PI/2 : -Math.PI/2;
    mtx.makeRotationY(ry).setPosition(p[0], p[1], p[2]);
    portholes.setMatrixAt(i, mtx);
  });
  portholes.instanceMatrix.needsUpdate = true;
  shipGroup.add(portholes);
}

/* ---- Decks ---- */
function makeDeckBlock(floorY, height, hwFn, zMin, zMax, opts = {}){
  const grp = new THREE.Group();
  const shape = footprintShape(hwFn, zMin, zMax, 6);
  const slabGeo = new THREE.ExtrudeGeometry(shape, {depth: height, bevelEnabled: true, bevelThickness: 0.28, bevelSize: 0.28, bevelSegments: 2});
  slabGeo.rotateX(Math.PI/2);
  const slab = new THREE.Mesh(slabGeo, matWhite);
  slab.position.y = floorY + height + 0.28;
  slab.castShadow = true; slab.receiveShadow = true;
  grp.add(slab);
  if (opts.glass){
    const gShape = footprintShape(z => Math.max(0.5, hwFn(z) - 0.45), zMin + 2, zMax - 2, 6);
    const gGeo = new THREE.ExtrudeGeometry(gShape, {depth: 1.15, bevelEnabled: false});
    gGeo.rotateX(Math.PI/2);
    const glass = new THREE.Mesh(gGeo, matGlass);
    glass.position.y = floorY + 1.5 + 1.15;
    grp.add(glass);
  }
  if (opts.cap !== false){
    const capGeo = new THREE.ShapeGeometry(footprintShape(hwFn, zMin, zMax, 6));
    capGeo.rotateX(Math.PI/2);
    const cap = new THREE.Mesh(capGeo, matWhiteSmooth);
    cap.position.y = floorY + height + 0.35;
    cap.receiveShadow = true;
    grp.add(cap);
  }
  shipGroup.add(grp);
  return grp;
}

function addRailing(floorY, hwFn, zMin, zMax){
  // posts
  const postPos = [];
  for (let z = zMin; z <= zMax; z += 3.8){
    const hw = hwFn(z);
    if (hw < 1.5) continue;
    postPos.push([-(hw-0.28), z], [hw-0.28, z]);
  }
  const postGeo = new THREE.BoxGeometry(0.09, 1.02, 0.09);
  const postMat = new THREE.MeshStandardMaterial({color:0xd7dde2, roughness:0.35, metalness:0.75});
  const posts = new THREE.InstancedMesh(postGeo, postMat, postPos.length);
  const m4 = new THREE.Matrix4();
  postPos.forEach((p, i) => { m4.makeTranslation(p[0], floorY + 0.51, p[1]); posts.setMatrixAt(i, m4); });
  posts.instanceMatrix.needsUpdate = true;
  posts.castShadow = true;
  shipGroup.add(posts);
  // handrails
  for (const side of [-1, 1]){
    const pts = [];
    for (let z = zMin; z <= zMax; z += 5){
      const hw = hwFn(z);
      if (hw < 1.2) continue;
      pts.push(new THREE.Vector3(side*(hw - 0.28), floorY + 1.05, z));
    }
    if (pts.length < 2) continue;
    const curve = new THREE.CatmullRomCurve3(pts);
    const tube = new THREE.Mesh(new THREE.TubeGeometry(curve, 160, 0.055, 6), postMat);
    tube.castShadow = true;
    shipGroup.add(tube);
  }
}

function makeLifeboat(){
  const g = new THREE.Group();
  const hull = new THREE.Mesh(new THREE.CapsuleGeometry(1.05, 8.4, 6, 14), matOrange);
  hull.rotation.x = Math.PI/2;
  hull.castShadow = true;
  g.add(hull);
  const canopy = new THREE.Mesh(new THREE.BoxGeometry(1.5, 0.3, 7.6), new THREE.MeshStandardMaterial({color:0xf3efe6, roughness:0.5}));
  canopy.position.y = 0.85; g.add(canopy);
  const davitMat = new THREE.MeshStandardMaterial({color:0x3a4148, roughness:0.5, metalness:0.6});
  for (const dz of [-3.9, 3.9]){
    const d = new THREE.Mesh(new THREE.BoxGeometry(0.22, 1.7, 0.45), davitMat);
    d.position.set(0, 0.75, dz); g.add(d);
  }
  return g;
}

const floorYMain = 9.05, floorYDeck7 = 27.6;

function buildShip(){
  buildHull();

  // decks 1..6 (structural)
  for (let i = 0; i < 6; i++){
    const floor = 9.12 + i*3.08;
    makeDeckBlock(floor, 2.95, z => deckBEH(z), -90, 84, {glass:true});
  }
  // teal accent stripe along midships
  const stripeShape = footprintShape(z => deckBEH(z) + 0.14, -80, 80, 8);
  const stripeGeo = new THREE.ExtrudeGeometry(stripeShape, {depth: 0.55, bevelEnabled: false});
  stripeGeo.rotateX(Math.PI/2);
  const stripe = new THREE.Mesh(stripeGeo, matTeal);
  stripe.position.y = 21.4; stripe.castShadow = true;
  shipGroup.add(stripe);

  // deck 7 (open lifeboat deck)
  const shape7 = footprintShape(z => deck7HW(z), -112, 106, 5);
  const floorGeo7 = new THREE.ShapeGeometry(shape7); floorGeo7.rotateX(Math.PI/2);
  const floor7 = new THREE.Mesh(floorGeo7, new THREE.MeshStandardMaterial({map:deckTexture, roughness:0.85, metalness:0.05, side:THREE.DoubleSide}));
  floor7.position.y = floorYDeck7 + 0.02; floor7.receiveShadow = true;
  shipGroup.add(floor7);
  // deck 7 trim
  const trim7Shape = footprintShape(z => deck7HW(z) + 0.12, -111, 105, 5);
  const trim7Geo = new THREE.ExtrudeGeometry(trim7Shape, {depth: 0.42, bevelEnabled:false});
  trim7Geo.rotateX(Math.PI/2);
  const trim7 = new THREE.Mesh(trim7Geo, matTeal);
  trim7.position.y = floorYDeck7 + 0.42 + 0.02;
  trim7.castShadow = true;
  shipGroup.add(trim7);
  addRailing(floorYDeck7, z => deck7HW(z), -110, 104);

  // lifeboats along deck 7 (both sides)
  const boatZs = [-92, -80, -68, -40, -16, 6, 24, 44, 60];
  for (const z of boatZs){
    for (const side of [-1, 1]){
      const b = makeLifeboat();
      const hw = deck7HW(z);
      b.position.set(side*(hw + 0.62), floorYDeck7 + 1.18, z);
      shipGroup.add(b);
    }
  }

  // decks 8..12
  for (let i = 0; i < 5; i++){
    const floor = 30.72 + i*3.08;
    makeDeckBlock(floor, 2.75, z => upperBEH(z), -84, 78, {glass:true});
  }

  // funnel

/* ============ UPDATE LOOP ============ */
const fwd = new THREE.Vector3(), right = new THREE.Vector3(), tmpV = new THREE.Vector3();

function stepPlayer(dt){
  const speed = (keys['ShiftLeft'] || keys['ShiftRight']) ? 7.6 : 4.3;
  const f = (keys['KeyW'] || keys['ArrowUp'] ? 1 : 0) - (keys['KeyS'] || keys['ArrowDown'] ? 1 : 0);
  const r = (keys['KeyD'] || keys['ArrowRight'] ? 1 : 0) - (keys['KeyA'] || keys['ArrowLeft'] ? 1 : 0);
  fwd.set(-Math.sin(player.yaw), 0, -Math.cos(player.yaw));
  right.set(Math.cos(player.yaw), 0, -Math.sin(player.yaw));
  const dx = (fwd.x*f + right.x*r), dz = (fwd.z*f + right.z*r);
  const len = Math.hypot(dx, dz) || 1;
  const dspX = dx/len*speed*(f||r ? 1 : 0), dspZ = dz/len*speed*(f||r ? 1 : 0);
  const k = Math.min(1, dt*7.5);
  player.vx += (dspX - player.vx)*k;
  player.vz += (dspZ - player.vz)*k;
  player.x += player.vx*dt;
  player.z += player.vz*dt;
  if (Math.abs(player.vx)+Math.abs(player.vz) > 0.4) player.walkCycle += dt*(4.4 + Math.abs(player.vx)*0.8);

  // keep on the decks
  if (player.y > F_DECK7 - 2.5){ // deck 7 level
    const hw = deck7HW(player.z);
    const zMin = -112, zMax = 106;
    if (player.z < zMin + 2 || player.z > zMax - 2 || Math.abs(player.x) > hw - 0.5){
      player.z = Math.max(zMin+2, Math.min(zMax-2, player.z));
      player.x = Math.max(-hw+0.55, Math.min(hw-0.55, player.x));
    }
    player.z = Math.max(-112, Math.min(106, player.z));
    player.x = Math.max(-hw+0.55, Math.min(hw-0.55, player.x));
    // upper superstructure blocker
    const bh = upperBEH(player.z) + 0.35;
    if (Math.abs(player.x) < bh && player.z > -84 && player.z < 78){
      const side = player.x >= 0 ? 1 : -1;
      player.x = side * bh;
    }
  } else { // main deck level
    const hw = hullHWat(player.z);
    player.z = Math.max(-130, Math.min(134, player.z));
    player.x = Math.max(-hw+0.55, Math.min(hw-0.55, player.x));
    const bh = deckBEH(player.z) + 0.35;
    if (Math.abs(player.x) < bh && player.z > -90 && player.z < 84){
      const side = player.x >= 0 ? 1 : -1;
      player.x = side * bh;
    }
  }

  // vertical
  player.y -= 19*dt;
  const inMain = player.z > -134 && player.z < 136 && Math.abs(player.x) < hullHWat(player.z) - 0.2;
  const inDeck7 = player.z > -112 && player.z < 106 && Math.abs(player.x) < deck7HW(player.z) - 0.2;
  let best = null;
  if (player.y > F_DECK7 - 3 && inDeck7) best = F_DECK7;
  if (inMain){ const m = Math.max(F_MAIN, best === null ? F_MAIN : F_MAIN); best = Math.max(best === null ? F_MAIN : best, F_MAIN); }
  if (best === null){ best = null; }
  if (best !== null){
    if (player.y <= best + 0.01){ player.y = best; player.grounded = true; }
    else if (player.y < best + 0.5){ player.y = best; player.grounded = true; }
    else player.grounded = false;
  } else player.grounded = false;

  if (player.y < -3) spawnPlayer(player.spawn);

  // zone label
  const isDeck7 = player.y > F_DECK7 - 1;
  zoneName.textContent = isDeck7 ? 'Deck 7 · Lifeboats' : 'Main Deck';
  zoneSub.textContent = isDeck7 ? 'Open promenade over the wake' : 'Exterior promenade';
}

function updateEnv(t, dt){
  dayTime = (dayTime + dt/180) % 1;
  const elev = -Math.cos(2*Math.PI*dayTime);
  const sunAz = 2*Math.PI*dayTime + Math.PI*0.6;
  const el = Math.asin(Math.max(-1, Math.min(1, elev)));
  const sunDir = tmpV.set(Math.cos(sunAz)*Math.cos(el), Math.sin(el), Math.sin(sunAz)*Math.cos(el)).clone();
  const dayMix = THREE.MathUtils.clamp((elev + 0.06)/0.41, 0, 1);
  const duskAmt = THREE.MathUtils.clamp(1 - Math.abs(elev)/0.3, 0, 1);

  const zenith = new THREE.Color(0x040714).lerp(new THREE.Color(0x1c57a1), dayMix);
  const horizon = new THREE.Color(0x0a1220).lerp(new THREE.Color(0xbfe3e0), dayMix);
  horizon.lerp(new THREE.Color(0xff8a3c), duskAmt*0.7);
  zenith.lerp(new THREE.Color(0x2c2450), duskAmt*0.35);
  const fogC = horizon.clone().lerp(zenith, 0.25);

  skyUniforms.uZenith.value.copy(zenith);
  skyUniforms.uHorizon.value.copy(horizon);
  skyUniforms.uSunDir.value.copy(sunDir);
  skyUniforms.uSunColor.value.copy(new THREE.Color(0xff7a3c).lerp(new THREE.Color(0xfff4dc), THREE.MathUtils.clamp(elev*1.6, 0, 1)));
  skyUniforms.uSunGlow.value = Math.max(0, elev);

  scene.fog.color.copy(fogC);
  renderer.setClearColor(fogC);

  sunLight.position.copy(sunDir).multiplyScalar(600);
  sunLight.castShadow = elev > 0.01;
  sunLight.intensity = Math.max(0, elev)*2.7*(1 - rainI*0.55);
  sunLight.color.copy(new THREE.Color(0xff8a45).lerp(new THREE.Color(0xfff4dc), THREE.MathUtils.clamp(elev*1.6, 0, 1)));

  const moonElev = Math.max(0, -elev);
  moonLight.position.copy(sunDir).multiplyScalar(-600);
  moonLight.intensity = moonElev*0.32;
  moonLight.color.set(0x9db8e8);

  hemiLight.intensity = 0.16 + dayMix*0.85 + flash*1.5;
  hemiLight.color.set(0x1a2540).lerp(new THREE.Color(0x9fc9e8), dayMix);
  hemiLight.groundColor.set(0x0a0d14).lerp(new THREE.Color(0x5a6b63), dayMix);

  sunMesh.position.copy(sunDir).multiplyScalar(1500);
  sunMesh.visible = elev > -0.14;
  sunMesh.scale.setScalar(1 + Math.max(0, elev)*0.1);
  sunMesh.material.color.copy(new THREE.Color(0xff8a45).lerp(new THREE.Color(0xfff0b8), THREE.MathUtils.clamp(elev*1.8, 0, 1)));
  moonMesh.position.copy(sunDir).multiplyScalar(-1500);
  moonMesh.visible = -elev > 0.05;

  matGlass.emissiveIntensity = (1 - dayMix)*1.35;
  starsMat.opacity = (1 - dayMix)*0.95;
  cloudMat.opacity = 0.34 + rainI*0.45;
  cloudMat.color.set(0xffffff).lerp(new THREE.Color(0x8d94a3), rainI*0.85);

  flash = Math.max(0, flash - dt*4.2);
  skyUniforms.uFlash.value = flash*1.1;

  // weather cycle
  weatherTimer -= dt;
  if (weatherTimer <= 0){
    weatherTimer = 14 + Math.random()*14;
    const r = Math.random();
    rainTarget = r < 0.45 ? 0.02 + Math.random()*0.12 : (r < 0.75 ? 0.18 + Math.random()*0.3 : 0.45 + Math.random()*0.45);
  }
  rainI += (rainTarget - rainI)*Math.min(1, dt*0.35);
  if (rainI > 0.5 && Math.random() < dt*0.4) flash = 1;

  // time-of-day UI
  const hh = Math.floor(dayTime*24), mm = Math.floor((dayTime*24 - hh)*60);
  timeTxt.textContent = String(hh).padStart(2,'0') + ':' + String(mm).padStart(2,'0');
  weatherTxt.textContent = weatherLabel();
  const isNight = dayMix < 0.35;
  sunDot.style.background = isNight ? '#c9d8f0' : (duskAmt > 0.3 ? '#ffb15c' : '#ffd166');
  sunDot.style.boxShadow = `0 0 8px ${isNight ? '#c9d8f0' : '#ffd166'}`;
}

function updateWater(t){
  const p = waterPos;
  for (let i = 0; i < p.length/3; i++){
    const x = waterBase[i*3], z = waterBase[i*3+2];
    p[i*3+1] =
      Math.sin(0.045*x + t*0.95)*0.34 +
      Math.sin(0.075*z + t*1.32)*0.24 +
      Math.sin(0.038*(x+z) + t*0.72)*0.3;
  }
  waterGeo.attributes.position.needsUpdate = true;
  waterGeo.computeVertexNormals();
}

function updateRain(dt, t){
  if (rainI < 0.06){ rain.visible = false; return; }
  rain.visible = true;
  rainMat.opacity = rainI*0.75;
  const windX = Math.sin(t*0.12)*2.2 + 1.5 + rainI*4.0;
  const p = rainPos;
  for (let i = 0; i < RAIN_N; i++){
    p[i*3] += windX*dt;
    p[i*3+1] -= rainSpeed[i]*dt;
    if (p[i*3+1] < 0){
      p[i*3+1] = 120 + Math.random()*30;
      p[i*3] = (Math.random()-0.5)*380;
      p[i*3+2] = (Math.random()-0.5)*380;
    }
    if (p[i*3] > 200) p[i*3] -= 400;
  }
  rainGeo.attributes.position.needsUpdate = true;
}

function waveFlags(t){
  for (const flag of [flagBow, flagStern]){
    const base = flag.userData.base, w = flag.userData.w;
    const posAttr = flag.geometry.attributes.position;
    for (let i = 0; i < posAttr.count; i++){
      const bx = base[i*3], by = base[i*3+1];
      const rel = (bx)/w;
      posAttr.setZ(i, Math.sin(t*6.5 + bx*2.4)*0.16*rel);
      posAttr.setY(i, by + Math.sin(t*4 + bx*2.0)*0.05*rel);
    }
    posAttr.needsUpdate = true;
    flag.geometry.computeVertexNormals();
  }
  if (radarBar) radarBar.rotation.y = t*1.5;
}

/* ============ MAIN LOOP ============ */
let ready = false;

function animate(){
  const dt = Math.min(0.05, clock.getDelta());
  const t = clock.elapsedTime;

  // ship motion
  shipGroup.position.y = Math.sin(t*0.5)*0.16;
  shipGroup.rotation.z = Math.sin(t*0.42+0.6)*0.009;
  shipGroup.rotation.x = Math.sin(t*0.33)*0.006;
  shipGroup.rotation.y = Math.sin(t*0.05)*0.004;

  updateEnv(t, dt);
  updateWater(t);
  updateRain(dt, t);
  waveFlags(t);

  // clouds drift
  const windX = Math.sin(t*0.12)*2.2 + 1.5;
  for (const c of clouds){
    c.obj.position.x += c.speed*dt*(0.4 + rainI);
    if (c.obj.position.x > 700) c.obj.position.x = -700;
  }

  if (mode === 'walk') stepPlayer(dt);
  else { controls.update(); }
  applyCamera();

  wakeMat.opacity = 0.4 + Math.sin(t*0.7)*0.1;

  renderer.render(scene, camera);

  if (!ready){ ready = true; setTimeout(() => { const l = document.getElementById('loader'); l.style.opacity = 0; setTimeout(() => l.remove(), 900); }, 350); }
}
renderer.setAnimationLoop(animate);

/* ============ RESIZE ============ */
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
