function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

const sandTex=(()=>{const s=mulberry(7),N=512,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');

  const t=Math.max(0,Math.min(255,Math.round(v+h*3.4))+(s()<0.01?14:0));d[i*4]=d[i*4+1]=d[i*4+2]=t;}

const shapes={};

.title{position:fixed;top:16px;left:20px;z-index:10;pointer-events:none}
.title h1{font-family:Georgia,serif;font-size:19px;letter-spacing:.30em;font-weight:400;color:#efe3c8;text-shadow:0 2px 12px rgba(0,0,0,.85)}
.title .sub{font-size:8.5px;letter-spacing:.24em;color:#c99b57;margin-top:5px}
.hud{position:fixed;top:14px;right:16px;z-index:10;display:flex;flex-direction:column;gap:5px;align-items:flex-end;width:180px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:4px;width:100%}
.btns button{text-align:left;padding-left:9px}
button{font:500 10px/1 ui-sans-serif,system-ui,sans-serif;letter-spacing:.08em;padding:7px 8px;color:#e8dcc6;background:rgba(24,22,18,.62);border:1px solid rgba(190,155,95,.38);border-radius:4px;cursor:pointer;transition:.15s}
button:hover{background:rgba(78,64,40,.75);border-color:rgba(214,178,108,.8);color:#fff3d8}
button.on{background:linear-gradient(180deg,#7d6434,#4a3a20);border-color:#c9a764;color:#fff4d6}
#caption{position:fixed;top:18px;left:50%;transform:translateX(-50%);z-index:10;pointer-events:none;font-family:Georgia,serif;font-size:13px;letter-spacing:.28em;color:#f0e2c0;text-shadow:0 2px 14px rgba(0,0,0,1);opacity:0;transition:opacity .3s}
.ctrlbar{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:10;display:flex;align-items:center;gap:13px;background:rgba(22,20,16,.7);border:1px solid rgba(190,155,95,.28);border-radius:5px;padding:7px 13px;backdrop-filter:blur(10px);font-size:9.5px;letter-spacing:.1em;white-space:nowrap}
.ctrlbar label{display:flex;align-items:center;gap:6px;color:#d9cbaa}
input[type=range]{-webkit-appearance:none;width:76px;height:3px;background:rgba(190,155,95,.45);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;border-radius:50%;background:#d9bd84;cursor:pointer}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#d9bd84;cursor:pointer}
.hud2{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.hint{position:fixed;bottom:16px;left:20px;z-index:10;font-size:9px;letter-spacing:.12em;color:rgba(232,220,198,.5);line-height:1.7;pointer-events:none}
#labels{position:fixed;inset:0;pointer-events:none;z-index:6;overflow:hidden}
.lab{position:absolute;transform:translate(-50%,-130%);font-size:9px;letter-spacing:.14em;color:#ffe9b8;background:rgba(12,10,6,.86);border:1px solid rgba(214,178,108,.6);padding:3px 7px;border-radius:3px;white-space:nowrap}
#flash{position:fixed;inset:0;z-index:5;pointer-events:none;background:radial-gradient(ellipse at 62% 42%,#fff8dc,transparent 62%);opacity:0;transition:opacity .45s}
@media(max-width:820px){.hud{width:150px}.ctrlbar{gap:7px;padding:6px 8px;font-size:8.5px;bottom:60px}input[type=range]{width:54px}.hint{display:none}}

<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

const err=document.createElement('div');
err.style.cssText='position:fixed;inset:0;display:none;place-items:center;background:#0d0c0a;color:#f0e2c0;font-family:Georgia,serif;font-size:17px;letter-spacing:.18em;z-index:99;text-align:center;padding:40px';
document.body.appendChild(err);
let renderer;
try{renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});}
catch(e){err.style.display='grid';err.textContent='WEBGL UNAVAILABLE — USE A MODERN BROWSER';throw e;}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.02;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xd9b679,0.0075);
const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,900);
camera.position.set(0,9,17);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=0.07;controls.minDistance=5;controls.maxDistance=70;
controls.maxPolarAngle=Math.PI*0.57;controls.target.set(0,2.6,0);

const hemi=new THREE.HemisphereLight(0xffe6c0,0x5d4f34,1.15);scene.add(hemi);
const sun=new THREE.DirectionalLight(0xffd9a0,2.4);sun.position.set(16,22,12);sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-20;sun.shadow.camera.right=20;
sun.shadow.camera.top=20;sun.shadow.camera.bottom=-20;sun.shadow.camera.near=1;sun.shadow.camera.far=70;
sun.shadow.bias=-0.0014;sun.shadow.normalBias=0.02;scene.add(sun);
const rim=new THREE.DirectionalLight(0xadc8ea,1.1);rim.position.set(-14,12,-14);scene.add(rim);
const back=new THREE.DirectionalLight(0xffb070,0.7);back.position.set(-2,5,-18);scene.add(back);

/* ============ procedural environment ============ */
function makeRoom(){
  const g=new THREE.Group();
  const sky=new THREE.Mesh(new THREE.SphereGeometry(60,20,12),new THREE.MeshBasicMaterial({side:THREE.BackSide,color:0x33291c}));
  sky.rotation.y=0.4;g.add(sky);
  const grd=new THREE.CanvasTexture((()=>{const c=document.createElement('canvas');c.width=16;c.height=256;const x=c.getContext('2d');
    const l=x.createLinearGradient(0,0,0,256);l.addColorStop(0,'#1c1710');l.addColorStop(.45,'#7c5f3a');l.addColorStop(.75,'#e2b274');l.addColorStop(1,'#f9e0b4');
    x.fillStyle=l;x.fillRect(0,0,16,256);const t=new THREE.CanvasTexture(c);t.mapping=THREE.EquirectangularReflectionMapping;t.colorSpace=THREE.SRGBColorSpace;return t})());
  const bg=new THREE.Mesh(new THREE.SphereGeometry(60,16,10),new THREE.MeshBasicMaterial({map:grd,side:THREE.BackSide}));bg.rotation.y=0.4;scene.background=bg;
  const key=new THREE.Mesh(new THREE.SphereGeometry(2.6,12,8),new THREE.MeshBasicMaterial({color:0xfff6e0}));
  key.position.set(10,20,16);g.add(key);
  const floor=new THREE.Mesh(new THREE.PlaneGeometry(400,400),new THREE.MeshStandardMaterial({color:0x8a6b3f,roughness:0.95}));
  floor.rotation.x=-Math.PI/2;floor.position.y=-26;floor.receiveShadow=true;scene.add(floor);
  return g;
}
const rt=new (THREE.PMREMGenerator)(renderer).fromScene(makeRoom(),0.05);
scene.environment=rt.texture;

/* ============ textures ============ */
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function tex(c){const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.colorSpace=THREE.SRGBColorSpace;return t}

const sandTex=tex((()=>{const s=mulberry(7),N=256,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');
  const gr=g.createLinearGradient(0,0,0,N);gr.addColorStop(0,'#8d6a33');gr.addColorStop(.5,'#c8a05d');gr.addColorStop(1,'#e5c489');g.fillStyle=gr;g.fillRect(0,0,N,N);
  const img=g.getImageData(0,0,N,N),d=img.data;
  for(let i=0;i<N*N;i++){const x=i%N,y=(i/N)|0;const v=(s()-0.5)*44+Math.sin(x*.06)*Math.sin(y*.05)*26+Math.sin((x+y)*.16)*16;const t2=Math.max(0,Math.min(255,150+v));d[i]=d[i+1]=d[i+2]=t2;d[i+3]=255;}
  g.putImageData(img,0,0);for(let i=0;i<2600;i++){const x=s()*N,y=s()*N,r=.5+s()*2.2;g.fillStyle=`rgba(255,225,175,${.03+s()*.05})`;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
  return c})());sandTex.repeat=70,70;

const gritTex=tex((()=>{const N=256,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d');
  g.fillStyle='#5c544a';g.fillRect(0,0,N,N);const s=mulberry(3),img=g.createImageData(N,N),d=img.data;
  for(let i=0;i<N*N;i++){const v=88+(s()-0.5)*70;d[i*4]=d[i*4+1]=d[i*4+2]=v;d[i*4+3]=255;}
  g.putImageData(img,0,0);for(let i=0;i<900;i++){const x=s()*N,y=s()*N,r=.6+s()*2.4;g.fillStyle=`rgba(240,235,220,${.05+s()*.14})`;g.beginPath();g.arc(x,y,r,0,7);g.fill();
    g.strokeStyle='rgba(30,28,26,.18)';g.beginPath();g.moveTo(x,y);g.lineTo(x+(s()-0.5)*9,y+(s()-0.5)*9);g.stroke();}
  return c})());gritTex.repeat=3,3;

function sandMap(){return sandTex;}
const MAT={};
MAT.bronze=new THREE.MeshStandardMaterial({color:0xa5692f,metalness:.78,roughness:.34,clearcoat:.35,clearcoatRoughness:.25});
MAT.polished=new THREE.MeshStandardMaterial({color:0xd8c9a8,metalness:.82,roughness:.18,clearcoat:.8,clearcoatRoughness:.12});
MAT.engrave=new THREE.MeshStandardMaterial({color:0x3a332b,metalness:.6,roughness:.55});
MAT.pearl=new THREE.MeshStandardMaterial({color:0xefe0c8,metalness:.35,roughness:.22,clearcoat:.9,clearcoatRoughness:.12});
MAT.hibachi=new THREE.MeshStandardMaterial({color:0x3d454b,metalness:.72,roughness:.3,clearcoat:.5,clearcoatRoughness:.25});
MAT.rust=new THREE.MeshStandardMaterial({color:0x6e4430,metalness:.35,roughness:.55});
MAT.wood=new THREE.MeshStandardMaterial({color:0x241a11,roughness:.55,metalness:.08});
MAT.grip=new THREE.MeshStandardMaterial({color:0x3b3227,roughness:.6,metalness:.12});
MAT.dark=new THREE.MeshStandardMaterial({color:0x2b2722,roughness:.5,metalness:.5});

/* ============ GEOMETRY HELPERS ============ */
function shapeEl(w,h){const s=new THREE.Shape();s.moveTo(-w/2,-h/2);s.lineTo(w/2,-h/2);s.lineTo(w/2,h/2);s.lineTo(-w/2,h/2);return s;}
function shapeRound(w,h,r){const s=new THREE.Shape();s.moveTo(-w/2+r,-h/2);s.lineTo(w/2-r,-h/2);s.quadraticCurveTo(w/2,-h/2,w/2,-h/2+r);s.lineTo(w/2,h/2-r);s.quadraticCurveTo(w/2,h/2,w/2-r,h/2);s.lineTo(-w/2+r,h/2);s.quadraticCurveTo(-w/2,h/2,-w/2,h/2-r);s.lineTo(-w/2,-h/2+r);s.quadraticCurveTo(-w/2,-h/2,-w/2+r,-h/2);return s;}
function shapeH(w,h){const s=new THREE.Shape();s.moveTo(-w/2,-h/2);s.lineTo(w/2,-h/2);s.lineTo(w/2,h/2);s.lineTo(-w/2,h/2);return s;}
function shapeLens(r){const s=new THREE.Shape();s.moveTo(-r,-1.9);s.quadraticCurveTo(r,-1.9,r,0);s.quadraticCurveTo(r,1.9,-r,1.9);s.quadraticCurveTo(-r,1.9,-r,-1.9);return s;}
function shapeBolt(){const s=new THREE.Shape();s.moveTo(-.7,3.2);s.lineTo(.7,3.2);s.lineTo(.25,.4);s.lineTo(1.45,.4);s.lineTo(-.3,-3.4);s.lineTo(-.5,-.7);s.lineTo(-1.5,-.7);return s;}
function shapeDragon(){const s=new THREE.Shape();s.moveTo(-1.4,-2.2);s.bezierCurveTo(-1,0,-1.7,.5,-2.1,1.6);s.bezierCurveTo(-2.5,2.7,-2.8,4.2,-2,.5);s.bezierCurveTo(-1.2,6.2,-1.1,4.5,.15,4.3);s.bezierCurveTo(1.3,4.1,1.1,2.9,2.1,2.5);s.bezierCurveTo(1.5,.5,1.5,-1.1,.55,-2.1);s.bezierCurveTo(0,-2.9,-.5,-2.7,-.75,-1.3);return s;}
function shapeWave(){const s=new THREE.Shape();s.moveTo(-6.4,0);s.bezierCurveTo(-5.2,-2.4,-3.2,2.6,-2,.0);s.bezierCurveTo(-.8,-2.6,.9,2.6,2.2,0);s.bezierCurveTo(3.5,-2.4,5.4,2.6,6.4,0);return s;}
function shapeGrid(n){const s=new THREE.Shape();const w=n*.5,h=n*.32;for(let i=0;i<w;i+=w/n)for(let j=0;j<h;j+=h/n){const x=-w/2+i+h*.5,y=-h/2+j+h*.5;
  const c=new THREE.Path();c.moveTo(x-.1,y-.1);c.lineTo(x+.1,y-.1);c.lineTo(x+.1,y+.1);c.lineTo(x-.1,y+.1);c.lineTo(x-.1,y-.1);s.holes.push(c);}return s;}

function exGeo(shape,depth,bev=0.02,bevS=3,seg=10){const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:bev>0,bevelThickness:bev,bevelSize:bev,bevelSegments:bevS,curveSegments:seg,steps:1});g.center();return g;}
/* flat profile: shape XY -> world XZ, thickness along Y */
function flat(shape,depth,bev=0.02,bevS=3,seg=8){
  const g=new THREE.ExtrudeGeometry(shape,{depth,bevelEnabled:bev>0,bevelThickness:bev,bevelSize:bev,bevelSegments:bevS,curveSegments:seg,steps:1});
  g.rotateY(-Math.PI/2);g.translate(0,0,-depth/2);return g;
}
function cyl(r,h,seg=20){const g=new THREE.CylinderGeometry(r,r,h,seg);g.rotateX(Math.PI/2);return g;}
function lathePts(pts,seg=24){return new THREE.LatheGeometry(pts.map(p=>new THREE.Vector2(p[0],p[1])),seg);}

/* ============ TEXTURES ============ */
function bladeMap(kind){
  const N=512,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d'),s=mulberry(kind===1?11:22);
  g.fillStyle='#8f8b86';g.fillRect(0,0,N,N);
  const img=g.createImageData(N,N),d=img.data;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=(y*N+x)*4;
    const v=Math.min(235,168+Math.sin(x*.05)*14+(s()-0.5)*26+(kind===2?Math.sin(y*.02)*18:0));
    d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;}
  g.putImageData(img,0,0);
  const t=tex(c);t.repeat=3,3;
  return {t,s};
}
function handleMap(kind){
  const N=256,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d'),s=mulberry(44);
  g.fillStyle='#1b1510';g.fillRect(0,0,N,N);
  const img=g.createImageData(N,N),d=img.data;
  for(let y=0;y<N;y++)for(let x=0;x<N;x++){const i=(y*N+x)*4;
    const v=44+Math.sin(x*.055)*14+Math.sin(y*.06)*16+(s()-0.5)*26+(kind===3?Math.sin(x*.14)*20:0)+(kind===4?Math.sin((x+y)*.1)*18:0);
    d[i]=v*0.94;d[i+1]=v*.85;d[i+2]=v*.66;d[i+3]=255;}
  g.putImageData(img,0,0);
  if(kind===3){for(let i=0;i<80;i++){g.strokeStyle=`rgba(190,150,90,${.06+i*.002})`;g.lineWidth=1.4;g.beginPath();const y0=i*4+14;g.moveTo(-5,y0);for(let k=0;k<=8;k++)g.lineTo(k*36,y0+Math.sin(k*.65+i)*11);g.stroke();}}
  else if(kind===4){g.strokeStyle='rgba(190,150,90,.10)';g.lineWidth=1;for(let i=0;i<18;i++){g.beginPath();g.moveTo(i*15,0);g.lineTo(i*15+30,N);g.stroke();g.beginPath();g.moveTo(i*15+30,0);g.lineTo(i*15,N);g.stroke();}}
  const t=tex(c);t.repeat=8,4;return t;
}
const T={};
T.brass=tex((()=>{const N=128,c=document.createElement('canvas');c.width=c.height=N;const g=c.getContext('2d'),s=mulberry(9);g.fillStyle='#0e0b08';g.fillRect(0,0,N,N);
  for(let i=0;i<2500;i++){const x=s()*N,y=s()*N,r=1+s()*13;g.fillStyle=`rgba(255,${180+s()*50|0},${60+s()*70|0},${.03+s()*.11})`;g.beginPath();g.arc(x,y,r,0,7);g.fill();}
  g.strokeStyle='rgba(255,230,170,.75)';g.lineWidth=2;g.beginPath();g.moveTo(N*.2,N*.8);g.lineTo(N*.26,N*.44);g.lineTo(N*.1,N*.48);g.lineTo(N*.3,N*.16);g.lineTo(N*.36,N*.64);g.lineTo(N*.42,N*.62);g.lineTo(N*.38,N*.12);g.stroke();return c})());T.brass.repeat=3,2;

/* ============ KNIFE ============ */
const knife=new THREE.Group();scene.add(knife);
const parts={};   /* name -> {mesh, baseY} for exploded view */

const bladeG=new THREE.Group(), tangL=new THREE.Group(), tangR=new THREE.Group(), handles=new THREE.Group();
const latches=new THREE.Group();
knifeblades: bladeG.add(tangL,tangR);
bladeG.rotation.z=0.0;
scene.add(bladeG);

/* --- tangs (each is half of the blade: base + edge profile) --- */
function buildTang(sgn){
  const g=new THREE.Group();
  const root=new THREE.Group();
  root.position.set(0,0,0);
  const shape=shapeLens(1.05);
  const main=new THREE.Mesh(flat(shape,0.115,.012,3,10),MAT.polished);
  main.userData.label='Blade — hamon';
  root.add(main);
  const edge=new THREE.Mesh(flat(shape,0.055,.01,2,8),MAT.hibachi);
  edge.scale.z=.72;edge.position.z=-.30;
  edge.userData.label='Blade edge — bevel';
  root.add(edge);
  /* edge highlight strip */
  const strip=new THREE.Mesh(flat(shape,0.01,.004,2,8),MAT.pearl);
  strip.scale.z=.94;strip.position.z=-.46;strip.rotation.z=.02;
  strip.userData.label='Grind line';
  root.add(strip);
  /* tang slot between tangs */
  const slot=new THREE.Mesh(flat(shapeLens(.34),.02,.005,1,8),MAT.dark);
  slot.scale.z=.9;slot.userData.label='Pivot tang slot';
  root.add(slot);
  /* kicker near base */
  const kick=new THREE.Mesh(flat(shapeEl(.30,.22),.05,.008,2,8),MAT.polished);
  kick.position.set(0,.10,-.52);kick.userData.label='Kicker — edge stop';
  root.add(kick);
  /* head peen / ricasso */
  const ric=new THREE.Mesh(flat(shapeRound(.62,.42,.2),.14,.012,2,8),MAT.polished);
  ric.position.set(0,-.02,-.62);ric.userData.label='Ricasso';
  root.add(ric);
  /* groove lines */
  for(let i=0;i<4;i++){const gl=new THREE.Mesh(flat(shapeEl(.55,.03),.004,.002,1,6),MAT.dark);gl.position.set(0,.09,-.72-i*.06);gl.rotation.z=.04;root.add(gl);}
  /* maker mark: emblem + name */
  const mk=new THREE.Mesh(flat(bolt?shapeBolt():shapeBolt(),.006,.002,1,8),MAT.engrave);
  mk.scale.setScalar(.55);mk.position.set(0,.075,.62);root.add(mk);mk.userData.label='Stormforge emblem';
  const nm=new THREE.Mesh(flat(shapeBolt(),.006,.002,1,8),MAT.engrave);
  nm.scale.setScalar(.5);nm.position.set(0,-.07,.86);root.add(nm);nm.userData.label='Zephyr-7';
  root.userData.label='Blade tang';
  root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;parts[o.userData.label||'Blade tang']={mesh:o,baseY:0};}});
  return root;
}
/* make two tangs that share a plane offset in Y */
const tangM=buildTang(1);
const tangN=buildTang(-1);
tangM.position.y=0.0;
tangN.position.y=-0.135;
tangM.scale.y=1.0;tangN.scale.y=1.0;
tangM.position.z=0;tangN.position.z=0;
/* fold tangs: rotate around Y pivot, opposite directions */
function setFold(f){
  tangL.rotation.y=-f*Math.PI*0.5;
  tangR.rotation.y=f*Math.PI*0.5;
}
setFold(0);

/* --- handles --- */
const handleBodyShape=shapeRound(1.05,.62,.26);
function buildHandle(ySide,mat,tex){

/* ============ MOVES (keyframe driven) ============ */
/* pose params: fold [0..1] (0 closed,1 open), latch [0..1] closed, t (time), spin vector, pos, quat, hand lift */
const pose={fold:0,latch:0,spin:new THREE.Vector3(),pos:new THREE.Vector3(),quat:new THREE.Quaternion(),lift:new THREE.Vector3(),r:0};
const target={fold:0,latch:0,spin:new THREE.Vector3(),pos:new THREE.Vector3(),quat:new THREE.Quaternion(),lift:new THREE.Vector3(),r:0};
function setT(k,v){target[k]=v;}
function tfold(u){return easeOut(Math.min(1,Math.max(0,u)));}
function baseState(){
  pose.fold=0;pose.latch=1;pose.spin.set(0,0,0);pose.pos.set(0,0,0);pose.quat.identity();pose.lift.set(0,0,0);
  target.fold=0;target.latch=1;target.spin.set(0,0,0);target.pos.set(0,0,0);target.quat.identity();target.lift.set(0,0,0);
}

/* ---- MOVES ---- */
function mvOpen(u){
  /* latch release, drop safe handle, swing bite round, catch */
  const a=Math.min(1,u*4);
  pose.latch=1-u*2;
  target.fold=tfold(Math.min(1,u/0.82));
  target.pos.set(0,-1.4+1.8*Math.sin(u*Math.PI)*1.0,0);
  target.quat.setFromEuler(new THREE.Euler(0.12,0.9,0.06));
  target.r=0;
  target.lift.set(0,0,0);
}
function mvClose(u){
  target.fold=tfold(1-u);
  target.latch=Math.min(1,u*2);
  pose.quat.setFromEuler(new THREE.Euler(-0.10,-0.9,-0.06));
  target.quat.setFromEuler(new THREE.Euler(0.12,0.9,0.06));
  target.pos.set(0,0,0);
}
function mvChaplin(u){
  /* flip over hand, handles swap sides */
  const flip=easeInOut(Math.min(1,u*0.9));
  target.fold=tfold(0.5+0.5*Math.sin(u*Math.PI*2));
  target.r=Math.PI;
  pose.quat.setFromEuler(new THREE.Euler(0.12,0.9,0.06));
  target.quat.setFromEuler(new THREE.Euler(0.12,0.9+Math.PI,0.06));
  target.pos.set(0,-1.2+1.2*Math.sin(u*Math.PI),0);
  pose.lift.set(0,1.2,0);
}
function mvRollover(u){
  /* roll over back of hand, side to side */
  const a=Math.sin(u*Math.PI);
  target.fold=tfold(0.55+0.45*a);
  target.quat.setFromEuler(new THREE.Euler(0.12+0.5*a,0.9,0.06));
  target.r=-a*Math.PI*0.9;
  target.pos.set(0,-1.6+1.0*a,0);
}
function mvFan(u){
  /* handle spins round index finger */
  target.fold=tfold(0.8+0.2*Math.sin(u*Math.PI*8));
  target.r=-u*Math.PI*2.6;
  target.quat.setFromEuler(new THREE.Euler(0.12,0.9,0.06));
  target.pos.set(0,-1.4,0);
}
function mvHelix(u){
  target.fold=tfold(0.5+0.5*Math.sin(u*Math.PI*6));
  target.r=u*Math.PI*2.4;
  target.quat.setFromEuler(new THREE.Euler(0.12+Math.sin(u*6)*0.25,0.9,0.06));
  target.pos.set(0,-1.4,0);
}
function mvAerial(u){
  /* toss, full turn, handles open mid-air */
  const p=u<0.22?u/0.22:u>0.78?(1-u)/0.22:0;
  const up=Math.sin(u*Math.PI);
  target.fold=tfold(0.5+0.5*Math.sin(u*Math.PI*4));
  target.r=u*Math.PI*2.4;
  target.spin.set(0,0,1);
  target.quat.setFromEuler(new THREE.Euler(0.12,0.9,0.06));
  target.pos.set(0,-1.4+up*3.0,up*1.6);
  target.r=-u*Math.PI*1.4;
  target.spin.set(up*3,0,up*1.5);
}
function mvBrew(u){
  /* signature: "Storm Brew" — a molten arc: open, whip, latch into a shoulder-lock spin, reopen */
  const s=u;
  const t1=Math.min(1,s/0.30),t2=Math.min(1,Math.max(0,(s-0.30)/0.20)),t3=Math.min(1,Math.max(0,(s-0.50)/0.30)),t4=Math.min(1,Math.max(0,(s-0.80)/0.20));
  const f1=tfold(t1);
  const f2=1;
  const f3=tf1=tfold(0.55+0.45*Math.sin((s-0.50)*Math.PI*2));
  const f4=tf4=tfold(0.5+0.5*Math.sin(s*Math.PI*3));
  target.fold=Math.max(f1,f3);
  target.fold=Math.max(f1,Math.max(f3,f4));
  target.r=-s*Math.PI*2.6+Math.sin(s*Math.PI*3)*0.9;
  target.quat.setFromEuler(new THREE.Euler(0.12,0.9+Math.sin(s*Math.PI*3)*0.6,0.06));
  target.pos.set(0,-1.4+Math.sin(s*Math.PI*2)*1.4,Math.sin(s*Math.PI)*2.0);
  target.latch=Math.min(1,s*2);
  target.spin.set(Math.sin(s*Math.PI*3)*2,0,Math.sin(s*Math.PI)*1.5);
  target.r=-s*Math.PI*2.6+Math.sin(s*Math.PI*3)*0.9;

function tf1(){return 0;}
function tf4(){return 0;}
function mvCombo(u){
  /* blends a sequence: open → chaplin → fan → helix → aerial → close */
  const segs=[[0,0.18],[0.18,0.34],[0.34,0.48],[0.48,0.66],[0.66,0.84],[0.84,1.0]];
  let best=0;
  for(let i=0;i<segs.length-1;i++){
    if(u>=segs[i][0]&&u<=segs[i][1]){best=i;break;}
  }
  best=Math.min(4,best);
  const sub=(u-segs[best][0])/(segs[best][1]-segs[best][0]);
  const fm=[0.15,0.45,0.75,0.55,0.9][best];
  const moves=[[mvOpen],[mvChaplin],[mvFan],[mvHelix],[mvAerial],[mvClose]];
  const cl=moves[best];
  /* blend by using each transform's parameter at local sub */
  const f=[0.55,0.5,0.8,0.55,0.9,0.1][best];
  target.fold=cl[0](sub);
  target.r=cl[0]?0:0;
  target.quat.setFromEuler(new THREE.Euler(0.12,0.9,0.06));
  target.pos.set(0,-1.4,0);
  target.latch=1-sub*2;
  const idx=[0,3,4,5,6,7][best];
  setCaption(MOVES[idx].n);
  if(u>0.985){setCaption(MOVES[idx].n);setCur(0);}
}

/* ---- sequencer ---- */
let seqTimer=0,seqIdx=0,seqPlaying=false;
function startSeq(kind){
  seqPlaying=true;seqIdx=0;seqTimer=0;
  if(kind==='combo'){order=[0,1,2,3,4,5,6,7];}
  else if(kind==='free'){order=[];}
  setCaption(kind==='combo'?'COMBO SEQUENCE':'FREESTYLE');
}
function updateSeq(dt){
  if(!seqPlaying)return;
  seqTimer+=dt;
  if(seqTimer>2.6){
    seqTimer=0;
    let next;
    if(order.length===0){do{next=Math.floor(Math.random()*8);}while(next===seqIdx);order=[seqIdx,next];}
    next=order[seqIdx%order.length];
    seqIdx++;
    seqPlaying=false;seqIdx=0;seqTimer=0;
    playMove(next);
    setTimeout(()=>{if(!seqPlaying)startSeq('free');},2400);
  }
}

/* ---- play a move ---- */
let moveT=0,moveDur=1,moveFn=null;
function playMove(i){
  setCur(i);
  setCaption(MOVES[i].n);
  moveT=0;moveDur=MOVES[i].d;
  moveFn=MOVES[i].k==='open'?mvOpen:MOVES[i].k==='close'?mvClose:MOVES[i].k==='chaplin'?mvChaplin:MOVES[i].k==='rollover'?mvRollover:MOVES[i].k==='fan'?mvFan:MOVES[i].k==='helix'?mvHelix:MOVES[i].k==='aerial'?mvAerial:MOVES[i].k==='brew'?mvBrew:mvCombo;
  /* snap audio */
  if(i===0)clickOpen();
  else if(i===1)clickClose();
  else if(i>=2&&i<=7)thud(.7);
}
function updateMove(u){
  target.fold=0;target.latch=1;target.spin.set(0,0,0);target.pos.set(0,0,0);target.quat.identity();target.lift.set(0,0,0);
  if(moveFn)mvFn(u);
}

/* ============ APPLY POSE ============ */
let explode=0,explodeTarget=0;
function applyPose(){
  const f=pose.fold, L=pose.latch;
  const a=f*f*(3-2*f);
  hingeL.rotation.z=-a*Math.PI*0.52;
  hingeR.rotation.z=+a*Math.PI*0.52;
  handleHingeA.rotation.z=-(0.10+a*1.18);
  handleHingeB.rotation.z=+(0.10+a*1.18);
  latG.rotation.z=(1-L)*Math.PI*0.42;
  latG.rotation.y=(1-L)*0.5;
  /* tilt the whole knife */
  knife.rotation.x=pose.quat.x*0+0.12;
  knife.rotation.z=pose.quat.z;
  knife.rotation.y=pose.quat.y;
  knife.position.copy(pose.pos).add(pose.lift);
  knife.rotation.x+=pose.lift.x*0;
  /* spin */
  if(pose.spin.lengthSq()>0.001){
    knife.rotateOnWorldAxis(new THREE.Vector3(pose.spin.x,pose.spin.y,pose.spin.z).normalize(),pose.spin.length()*0.016);
  }
  /* explode */
  const e=explode;
  tangL0.position.y=0.085+e*0.55;
  tangR0.position.y=-0.085-e*0.55;
  hingeHA.position.y=-0.185-e*1.1;
  hingeHB.position.y=0.185+e*1.1;
  latchG.position.y=(1-L)*0.32+e*0.9;
  pinA.position.y=-0.205-e*0.75;pinB.position.y=0.205+e*0.75;
  colL.position.y=0.245+e*0.95;colR.position.y=-0.245-e*0.95;
  hwG.position.y=e*0.55;
  /* labels */
  document.querySelectorAll('.lab').forEach(o=>o.style.opacity=0);
  if(explode>0.5){
    const lbls=[['Blade hamon',tangL0],['Blade bevel',tangR0],['Handle machined',hingeHA],['Handle G10',hingeHB],['Zen pin',pinA],['Zen pin cap',pinB],['Latch',latG],['Collar',colL]];
    lbls.forEach(([n,obj])=>{
      const v=new THREE.Vector3();obj.getWorldPosition(v);
      v.project(camera);
      if(Math.abs(v.x)<1.2&&Math.abs(v.y)<1.2){
        const el=document.createElement('div');el.className='lab';el.textContent=n;
        el.style.left=((v.x*.5+.5)*innerWidth)+'px';el.style.top=((-v.y*.5+.5)*innerHeight)+'px';
        document.getElementById('labels').appendChild(el);
      }
    });
  }
}

  ptr.set((e.clientX/innerWidth)*2-1,-(e.clientY/innerHeight)*2+1);

  const p=new THREE.Vector3();
  /* ray-plane intersect on the plane through the pivot, normal = knife forward */
  const n=new THREE.Vector3(0,0,1).applyQuaternion(knife.quaternion);
  const o=new THREE.Vector3();knife.getWorldPosition(o);
  const denom=new THREE.Vector3().copy(n).dot(new THREE.Vector3(0,0,1));
  const d=(o.dot(new THREE.Vector3(0,0,1))-0.0)/1;
  ray.ray.intersectPlane(new THREE.Plane(n,o.clone().add(new THREE.Vector3(0,0,-2.2))),p);
  const a=Math.atan2(p.z-(o.z),p.x-o.x);
  let dd=a+Math.PI/2;
  dd=((dd%(Math.PI*2))%(Math.PI*2)+Math.PI*2)%(Math.PI*2);
  if(dragging==='A')pose.fold=Math.min(1,Math.max(0,0.15+dd/Math.PI*1.15));
  else pose.fold=Math.min(1,Math.max(0,0.85-dd/Math.PI*1.15));
  pose.latch=Math.min(1,Math.abs(dd-Math.PI/2)/1.4);
  dragStart=dd;
});

/* ============ MAIN LOOP ============ */
const clock=new THREE.Clock();
let tAcc=0,lastFrame=performance.now();
let flashT=0;
let hudHover=null;

function loop(){
  requestAnimationFrame(loop);
  const now=performance.now();
  let dt=Math.min(0.05,(now-lastFrame)/1000);lastFrame=now;
  if(slow)dt*=0.25;
  tAcc+=dt;
  const dtm=dt*speed;
  /* idle camera drift */
  if(current<0&&!explodeTarget&&!seqPlaying){
    controls.target.y=2.6+Math.sin(tAcc*.35)*0.12;
  }
  /* sequencer */
  updateSeq(dtm);
  /* move */
  if(moveFn&&moveT<moveDur){
    moveT+=dtm;
    updateMove(Math.min(1,moveT/moveDur));
    if(moveT>=moveDur){if(MOVES[current].k==='close')setCur(-1);}
  }
  if(seqPlaying)moveT+=dtm;
  /* blend pose */
  const k=1-Math.exp(-dtm*7.5);
  pose.fold+=(target.fold-pose.fold)*k;
  pose.latch+=(target.latch-pose.latch)*k;
  pose.spin.lerp(target.spin,1-Math.exp(-dtm*3));
  pose.pos.lerp(target.pos,1-Math.exp(-dtm*7));
  pose.quat.slerp(target.quat,1-Math.exp(-dtm*7));
  pose.lift.lerp(target.lift,1-Math.exp(-dtm*7));
  pose.r+= (target.r-pose.r)*k;
  /* read pose into effectors */
  applyPose();
  /* rotor / pinch */
  bladeG.rotation.z=pose.r;
  /* hands follow the handles */
  if(current!==-1||explode<0.1){
    handA.position.set(0,pose.lift.y,pose.lift.z);
    handB.position.set(0,pose.lift.y+0.5,pose.lift.z);
    handA.quaternion.copy(knife.quaternion).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0,-0.3,0)));
    handB.quaternion.copy(knife.quaternion).multiply(new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0.3,0)));
  }
  /* trail */
  if(trailOn){
    tipVec.set(0,0,3.2).applyQuaternion(knife.quaternion).add(knife.position);
    trailPts.push(tipVec.clone());
    if(trailPts.length>MAXT)trailPts.shift();
    for(let i=0;i<trailPts.length;i++){
      trailPos[i*3]=trailPts[i].x;trailPos[i*3+1]=trailPts[i].y;trailPos[i*3+2]=trailPts[i].z;
      const a=i/trailPts.length;
      trailCol[i*3]=1*a;trailCol[i*3+1]=.82*a;trailCol[i*3+2]=.5*a;
    }
    for(let i=trailPts.length;i<MAXT;i++){trailPos[i*3]=0;trailPos[i*3+1]=-999;trailPos[i*3+2]=0;trailCol[i*3]=0;trailCol[i*3+1]=0;trailCol[i*3+2]=0;}
    trailGeo.setDrawRange(0,trailPts.length);
    trailGeo.attributes.position.needsUpdate=true;
    trailGeo.attributes.color.needsUpdate=true;
  }else{trailLine.visible=false;}
  trailLine.visible=trailOn;
  /* drift sand */
  const pa=drift.geometry.attributes.position.array;
  for(let i=0;i<NP;i++){
    pa[i*3]+=Math.sin(tAcc*.7+driftSeed[i])*.05+dtm*.12;
    pa[i*3+1]+=Math.cos(tAcc*.5+driftSeed[i]*2)*.02;
    if(pa[i*3]>60)pa[i*3]=-60;
    if(pa[i*3+1]>12)pa[i*3+1]=1.5;
  }
  drift.geometry.attributes.position.needsUpdate=true;
  /* flash */
  if(flashT>0){flashT-=dt;document.getElementById('flash').style.opacity=Math.max(0,flashT*.5);}
  /* explode lerp */
  explode+=(explodeTarget-explode)*(1-Math.exp(-dt*5));
  /* hands hide during explode */
  handA.visible=handB.visible=explode<0.5;
  /* cameras */
  controls.update();
  renderer.render(scene,camera);
  if(hoverIdx>=0){
    const el=document.createElement('div');el.className='lab';
    const obj=labelParts[hoverIdx];const v=new THREE.Vector3();obj.getWorldPosition(v);v.project(camera);
    el.textContent=labelNames[hoverIdx];
    el.style.left=((v.x*.5+.5)*innerWidth)+'px';el.style.top=((-v.y*.5+.5)*innerHeight)+'px';
    document.getElementById('labels').appendChild(el);
  }
}

  document.querySelectorAll('.lab').forEach(o=>o.remove());
});

/* booting visuals */
(function boot(){
  knife.rotation.set(0.1,0.9,0.06);
  knife.position.set(0,0,0);
  bladeG.rotation.z=0;
  applyPose();
  /* animate reveal */
  let rt2=0;
  const iv=setInterval(()=>{
    rt2+=0.05;
    const f=Math.min(1,rt2/2.4);
    applyPose();
    knife.position.y=(1-f)*3.2;
    knife.rotation.z=(1-f)*0.15;
    if(f>=1){clearInterval(iv);}
  },16);
})();
setInterval(()=>{if(!explodeTarget&&current<0&&!seqPlaying&&Math.random()<0.008){flashT=1;}},2000);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
});
renderer.domElement.addEventListener('wheel',()=>{}, {passive:true});

requestAnimationFrame(loop);
</script>
</body></html>
