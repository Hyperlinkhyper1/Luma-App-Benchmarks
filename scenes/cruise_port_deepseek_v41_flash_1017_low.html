<script type="importmap">

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { Sky } from 'three/addons/objects/Sky.js';

// ==================== WEBGL CHECK ====================
const APP = document.getElementById('app');
const testCanvas = document.createElement('canvas');
const testGL = testCanvas.getContext('webgl2') || testCanvas.getContext('webgl');
if (!testGL) {
  document.getElementById('loader').innerHTML = '<div style="color:#f88;padding:40px;text-align:center">⚠ WebGL is not available.<br><br>This scene requires WebGL support.</div>';
  throw new Error('WebGL unavailable');
}

// ==================== SCENE ====================
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xb8c4cc, 0.00022);

const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 14000);
camera.position.set(180, 90, 240);

const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance', logarithmicDepthBuffer: false });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.outputColorSpace = THREE.SRGBColorSpace;
APP.appendChild(renderer.domElement);

// ==================== SKY ====================
const sky = new Sky();
sky.scale.setScalar(12000);
scene.add(sky);
const skyU = sky.material.uniforms;
skyU.turbidity.value = 5.5;
skyU.rayleigh.value = 2.2;
skyU.mieCoefficient.value = 0.005;
skyU.mieDirectionalG.value = 0.78;

// ==================== LIGHTING ====================
const sun = new THREE.DirectionalLight(0xffeedd, 3);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -350;
sun.shadow.camera.right = 350;
sun.shadow.camera.top = 350;
sun.shadow.camera.bottom = -350;
sun.shadow.camera.near = 100;
sun.shadow.camera.far = 1600;
sun.shadow.bias = -0.0004;
sun.shadow.normalBias = 0.5;
scene.add(sun);
scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xa8c0d8, 0x4a4030, 0.55);
scene.add(hemi);

// ==================== WATER SHADER ====================
const waterUniforms = {
  uTime: { value: 0 },
  uSunDir: { value: new THREE.Vector3(0.4, 0.8, 0.3) },
  uSunColor: { value: new THREE.Color(0xffddaa) },
  uSkyColor: { value: new THREE.Color(0x92b8d0) },
  uDeepColor: { value: new THREE.Color(0x0e2a3a) },
  uFogColor: { value: new THREE.Color(0xb8c4cc) },
  uFogDensity: { value: 0.00022 }
};

const waterShader = new THREE.ShaderMaterial({
  uniforms: waterUniforms,
  vertexShader: `
    uniform float uTime;
    varying vec3 vWorldPos;
    void main() {
      vec3 pos = position;
      float wave = sin(pos.x * 0.05 + uTime * 1.1) * 0.55;
      wave += sin(pos.y * 0.08 + uTime * 1.4) * 0.32;
      wave += sin((pos.x + pos.y) * 0.03 + uTime * 0.85) * 0.7;
      pos.z += wave;
      vec4 wp = modelMatrix * vec4(pos, 1.0);
      vWorldPos = wp.xyz;
      gl_Position = projectionMatrix * viewMatrix * wp;
    }
  `,
  fragmentShader: `
    uniform float uTime;
    uniform vec3 uSunDir, uSunColor, uSkyColor, uDeepColor, uFogColor;
    uniform float uFogDensity;
    varying vec3 vWorldPos;
    void main() {
      vec3 viewDir = normalize(cameraPosition - vWorldPos);
      float rx = sin(vWorldPos.x * 0.4 + uTime * 2.0) * 0.08;
      float rz = sin(vWorldPos.z * 0.4 + uTime * 1.6) * 0.08;
      rx += sin(vWorldPos.x * 0.15 + vWorldPos.z * 0.1 + uTime * 1.3) * 0.05;
      rz += cos(vWorldPos.x * 0.12 - vWorldPos.z * 0.18 + uTime * 1.1) * 0.05;
      vec3 N = normalize(vec3(rx, 1.0, rz));
      float fresnel = pow(1.0 - max(dot(N, viewDir), 0.0), 4.0);
      fresnel = 0.05 + 0.95 * fresnel;
      vec3 col = mix(uDeepColor, uSkyColor, fresnel);
      vec3 H = normalize(uSunDir + viewDir);
      float spec = pow(max(dot(N, H), 0.0), 240.0);
      col += uSunColor * spec * 3.2;
      float sparkle = pow(max(0.0, N.x * 0.7 + N.y * 0.5 - N.z * 0.5), 40.0);
      col += uSunColor * sparkle * 0.15;
      float dist = length(cameraPosition - vWorldPos);
      float fogFactor = 1.0 - exp(-uFogDensity * uFogDensity * dist * dist);
      col = mix(col, uFogColor, fogFactor);
      gl_FragColor = vec4(col, 1.0);
    }
  `
});

const waterGeo = new THREE.PlaneGeometry(10000, 10000, 220, 220);
const water = new THREE.Mesh(waterGeo, waterShader);
water.rotation.x = -Math.PI / 2;
water.position.y = 0;
scene.add(water);

// Reflection hint — dark strip below water
const reflPlane = new THREE.Mesh(
  new THREE.PlaneGeometry(400, 400),
  new THREE.MeshBasicMaterial({ color: 0x000000, transparent: true, opacity: 0.15 })
);
reflPlane.rotation.x = -Math.PI / 2;
reflPlane.position.set(0, 0.3, -100);
reflPlane.renderOrder = 1;
scene.add(reflPlane);

// ==================== HELPERS ====================
function makeMesh(geo, mat, pos, rot) {
  const m = new THREE.Mesh(geo, mat);
  if (pos) m.position.set(pos[0], pos[1], pos[2]);
  if (rot) m.rotation.set(rot[0], rot[1], rot[2]);
  return m;
}

function makeBox(w, h, d, mat, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
  m.position.set(x, y, z);
  return m;
}

function makeNameTexture(text) {
  const c = document.createElement('canvas');
  c.width = 1024; c.height = 256;
  const ctx = c.getContext('2d');
  ctx.fillStyle = 'rgba(0,0,0,0)';
  ctx.fillRect(0, 0, 1024, 256);
  ctx.fillStyle = '#0a1a2a';
  ctx.font = 'bold 160px Georgia, serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 512, 130);
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

// ==================== CRUISE SHIP — OCEAN STAR ====================
const ship = new THREE.Group();
ship.position.set(0, 0, 0);
scene.add(ship);

// --- Hull geometry (custom lofted) ---
function buildHullGeometry() {
  const N = 60, L = 300, halfL = L / 2, W = 19;
  const getWidth = (t) => {
    if (t < 0.08) return W * Math.pow(t / 0.08, 0.55);
    if (t > 0.92) { const s = (t - 0.92) / 0.08; return W * (1 - 0.3 * s * s); }
    return W;
  };
  const nSide = 6, nBottom = 4;
  const sectionPoints = (w) => {
    const pts = [];
    for (let i = 0; i <= nSide; i++) {
      const f = i / nSide;
      const y = 18 * (1 - f) + (-2) * f;
      const z = w * (1 - 0.05 * f);
      pts.push([y, z]);
    }
    for (let i = 1; i <= nBottom; i++) {
      const f = i / nBottom;
      const y = -2 - 7 * f;
      const z = w * 0.95 * (1 - f * f);
      pts.push([y, z]);
    }
    for (let i = nBottom - 1; i >= 1; i--) {
      const f = i / nBottom;
      const y = -2 - 7 * f;
      const z = -w * 0.95 * (1 - f * f);
      pts.push([y, z]);
    }
    for (let i = 1; i <= nSide; i++) {
      const f = (nSide - i) / nSide;
      const y = 18 * (1 - f) + (-2) * f;
      const z = -w * (1 - 0.05 * f);
      pts.push([y, z]);
    }
    return pts;
  };
  const verts = [], indices = [], sections = [];
  for (let i = 0; i <= N; i++) {
    const t = i / N;
    const x = -halfL + t * L;
    let w = getWidth(t);
    if (w < 0.1) w = 0.1;
    const pts = sectionPoints(w);
    const startIdx = verts.length / 3;
    for (const [y, z] of pts) verts.push(x, y, z);
    sections.push({ startIdx, count: pts.length });
  }
  for (let i = 0; i < N; i++) {
    const s0 = sections[i], s1 = sections[i + 1];
    for (let j = 0; j < s0.count - 1; j++) {
      const a = s0.startIdx + j, b = s0.startIdx + j + 1;
      const c = s1.startIdx + j, d = s1.startIdx + j + 1;
      indices.push(a, c, b);
      indices.push(b, c, d);
    }
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(verts, 3));
  geo.setIndex(indices);
  geo.computeVertexNormals();

  // Vertex colors for hull bands
  const colors = [];
  for (let i = 0; i < verts.length; i += 3) {
    const y = verts[i + 1];
    let r, g, b;
    if (y < 0.4) { r = 0.42; g = 0.06; b = 0.12; }
    else if (y < 2.4) { r = 0.05; g = 0.09; b = 0.18; }
    else { r = 0.94; g = 0.94; b = 0.93; }
    colors.push(r, g, b);
  }
  geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
  return geo;
}

const hullMat = new THREE.MeshStandardMaterial({ vertexColors: true, roughness: 0.55, metalness: 0.15 });
const hull = new THREE.Mesh(buildHullGeometry(), hullMat);
hull.castShadow = true;
hull.receiveShadow = true;
ship.add(hull);

// Bulbous bow
const bulbGeo = new THREE.SphereGeometry(4.5, 16, 12);
bulbGeo.scale(2.5, 0.8, 1);
const bulbMat = new THREE.MeshStandardMaterial({ color: 0xc01828, roughness: 0.6 });
const bulb = new THREE.Mesh(bulbGeo, bulbMat);
bulb.position.set(-145, -3.5, 0);
ship.add(bulb);

// --- Superstructure ---
const whiteMat = new THREE.MeshStandardMaterial({ color: 0xf7f7f5, roughness: 0.5 });
const glassMat = new THREE.MeshStandardMaterial({ color: 0x1a2a3a, roughness: 0.1, metalness: 0.85 });
const deckMat = new THREE.MeshStandardMaterial({ color: 0x4a5560, roughness: 0.8 });
const darkMat = new THREE.MeshStandardMaterial({ color: 0x1a1f28, roughness: 0.6 });

// Main block
const super1 = makeBox(280, 32, 32, whiteMat, 0, 34, 0);
super1.castShadow = true;
super1.receiveShadow = true;
ship.add(super1);

// Upper deck house
const super2 = makeBox(260, 8, 28, whiteMat, 0, 54, 0);
super2.castShadow = true;
ship.add(super2);

// Top deck (pool area)
const topDeck = makeBox(255, 1.5, 26, deckMat, 0, 58.5, 0);
ship.add(topDeck);

// --- Balcony panels (instanced) ---
const balconyGeo = new THREE.PlaneGeometry(2.7, 2.5);
const balconyMat = new THREE.MeshStandardMaterial({
  color: 0x2a3c50, roughness: 0.15, metalness: 0.7,
  transparent: true, opacity: 0.75, side: THREE.DoubleSide
});

const NUM_DECKS = 10;
const FIRST_DECK_Y = 22;
const DECK_SPACING = 3;
const BAL_PER_SIDE = 42;
const BAL_SPACING = 6.5;

const balInstance = new THREE.InstancedMesh(balconyGeo, balconyMat, NUM_DECKS * BAL_PER_SIDE * 2);
const dummy = new THREE.Object3D();
let balIdx = 0;
for (let d = 0; d < NUM_DECKS; d++) {
  const y = FIRST_DECK_Y + d * DECK_SPACING;
  for (let i = 0; i < BAL_PER_SIDE; i++) {
    const x = -130 + i * BAL_SPACING;
    dummy.position.set(x, y, 16.2);
    dummy.rotation.set(0, 0, 0);
    dummy.updateMatrix();
    balInstance.setMatrixAt(balIdx++, dummy.matrix);
    dummy.position.set(x, y, -16.2);
    dummy.rotation.set(0, Math.PI, 0);
    dummy.updateMatrix();
    balInstance.setMatrixAt(balIdx++, dummy.matrix);
  }
}
balInstance.instanceMatrix.needsUpdate = true;
ship.add(balInstance);

// Balcony railings — thin continuous bars per deck
const railMat = new THREE.MeshStandardMaterial({ color: 0xdcdcd8, roughness: 0.5, metalness: 0.3 });
for (let d = 0; d < NUM_DECKS; d++) {
  const y = FIRST_DECK_Y + d * DECK_SPACING - 1.25;
  const rail1 = makeBox(272, 0.15, 0.15, railMat, 0, y, 16.6);
  const rail2 = makeBox(272, 0.15, 0.15, railMat, 0, y, -16.6);
  ship.add(rail1);
  ship.add(rail2);
}

// Balcony dividing walls (vertical accents)
for (let d = 0; d < NUM_DECKS; d++) {
  const y = FIRST_DECK_Y + d * DECK_SPACING;
  for (let i = 0; i < BAL_PER_SIDE; i += 4) {
    const x = -130 + i * BAL_SPACING;
    const w1 = makeBox(0.15, 2.5, 0.5, railMat, x, y, 16.4);
    const w2 = makeBox(0.15, 2.5, 0.5, railMat, x, y, -16.4);
    ship.add(w1); ship.add(w2);
  }
}

// --- Lifeboats (instanced) ---
const lbGeo = new THREE.CapsuleGeometry(1.6, 8, 3, 8);
lbGeo.rotateZ(Math.PI / 2);
const lbMat = new THREE.MeshStandardMaterial({ color: 0xff6a1a, roughness: 0.55 });
const lbWhiteMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
const lbInst = new THREE.InstancedMesh(lbGeo, lbMat, 20);
let lbIdx = 0;
for (let i = 0; i < 10; i++) {
  const x = -120 + i * 26;
  dummy.position.set(x, 14, 19.5);
  dummy.rotation.set(0, 0, 0);
  dummy.scale.set(1, 1, 1);
  dummy.updateMatrix();
  lbInst.setMatrixAt(lbIdx++, dummy.matrix);
  dummy.position.set(x, 14, -19.5);
  dummy.updateMatrix();
  lbInst.setMatrixAt(lbIdx++, dummy.matrix);
}
lbInst.instanceMatrix.needsUpdate = true;
lbInst.castShadow = true;
ship.add(lbInst);

// Davits (poles above lifeboats)
for (let i = 0; i < 10; i++) {
  const x = -120 + i * 26;
  for (const z of [19.5, -19.5]) {
    const pole = makeBox(0.3, 3, 0.3, whiteMat, x - 3, 16.5, z);
    ship.add(pole);
    const pole2 = makeBox(0.3, 3, 0.3, whiteMat, x + 3, 16.5, z);
    ship.add(pole2);
    const cross = makeBox(6.5, 0.2, 0.2, whiteMat, x, 17.9, z);
    ship.add(cross);
  }
}

// --- Bridge with wings ---
const bridgeGeo = new THREE.BoxGeometry(22, 5, 36);
const bridge = new THREE.Mesh(bridgeGeo, glassMat);
bridge.position.set(-125, 44, 0);
ship.add(bridge);

// Bridge wings extend to sides
const wingGeo = new THREE.BoxGeometry(8, 3, 8);
const wingL = new THREE.Mesh(wingGeo, whiteMat);
wingL.position.set(-125, 44, 21);
ship.add(wingL);
const wingR = wingL.clone();
wingR.position.z = -21;
ship.add(wingR);

// Bridge window strip
const bridgeWin = makeBox(22, 2.5, 0.2, glassMat, -125, 44, 18.1);
ship.add(bridgeWin);
const bridgeWin2 = makeBox(22, 2.5, 0.2, glassMat, -125, 44, -18.1);
ship.add(bridgeWin2);
const bridgeWinF = makeBox(0.2, 2.5, 36, glassMat, -114.1, 44, 0);
ship.add(bridgeWinF);

// --- Radar mast ---
const mastGeo = new THREE.CylinderGeometry(0.4, 0.8, 14, 8);
const mastMat = new THREE.MeshStandardMaterial({ color: 0xe8e8e8, roughness: 0.4 });
const mast = new THREE.Mesh(mastGeo, mastMat);
mast.position.set(-125, 58, 0);
ship.add(mast);
const crossbar1 = makeBox(4, 0.3, 0.3, mastMat, -125, 62, 0);
ship.add(crossbar1);
const crossbar2 = makeBox(0.3, 0.3, 4, mastMat, -125, 64, 0);
ship.add(crossbar2);
// Radar dish
const dishGeo = new THREE.SphereGeometry(1.2, 16, 8, 0, Math.PI * 2, 0, Math.PI / 2);
const dish = new THREE.Mesh(dishGeo, new THREE.MeshStandardMaterial({ color: 0xffffff, side: THREE.DoubleSide }));
dish.position.set(-125, 66, 0);
dish.rotation.x = Math.PI;
ship.add(dish);

// --- Funnels ---
const funnelMat1 = new THREE.MeshStandardMaterial({ color: 0x0e2540, roughness: 0.5 });
const funnelMat2 = new THREE.MeshStandardMaterial({ color: 0xc02a2a, roughness: 0.5 });
function makeFunnel(x) {
  const g = new THREE.CylinderGeometry(3, 3.5, 15, 20);
  g.scale(2.2, 1, 1);
  const f = new THREE.Mesh(g, funnelMat1);
  f.position.set(x, 66, 0);
  f.castShadow = true;
  ship.add(f);
  // Red band
  const band = new THREE.Mesh(new THREE.CylinderGeometry(3.05, 3.1, 2, 20), funnelMat2);
  band.position.set(x, 71, 0);
  band.geometry.scale(2.2, 1, 1);
  ship.add(band);
  // Cap
  const cap = new THREE.Mesh(new THREE.CylinderGeometry(2.8, 2.8, 0.6, 20), darkMat);
  cap.position.set(x, 73.5, 0);
  cap.geometry.scale(2.2, 1, 1);
  ship.add(cap);
}
makeFunnel(40);
makeFunnel(80);

// --- Pool on top deck ---
const poolGeo = new THREE.BoxGeometry(24, 1, 12);
const poolMat = new THREE.MeshStandardMaterial({ color: 0x2a9bd4, roughness: 0.15, metalness: 0.3, emissive: 0x1a3a50, emissiveIntensity: 0.3 });
const pool = new THREE.Mesh(poolGeo, poolMat);
pool.position.set(0, 59.3, 0);
ship.add(pool);

// Splash of lighter water
const poolTop = makeBox(23, 0.1, 11, new THREE.MeshStandardMaterial({ color: 0x4dc0e8, roughness: 0.1, metalness: 0.5 }), 0, 59.85, 0);

function makeMooringLine(from, to) {
  const mid = from.clone().lerp(to, 0.5);
  mid.y = Math.max(from.y, to.y) - 2;

function makeBridgeTower(zPos) {

  for (const [x, z] of [[-8, -8], [8, -8], [-8, 8], [8, 8]]) {

    towerG.add(beam);
    const beam2 = makeBox(3, 3, 20, bridgeRedMat, 0, y, 0);
    towerG.add(beam2);
  }
  // Top cross
  const topBeam = makeBox(24, 4, 4, bridgeDarkMat, 0, 190, 0);
  towerG.add(topBeam);
  return towerG;
}

  const curve = new THREE.CatmullRomCurve3(points);

  return new THREE.Mesh(geo, bridgeRedMat);
}

// ==================== LIGHTING UPDATES / TIME ====================
let currentTime = 17.6; // 5:36pm golden hour
let timePlaying = false;
let dayFactor = 1;
let goldenFactor = 1;

function updateTimeOfDay(hour) {
  // Sun position calculation
  const t = (hour - 6) / 12; // 0 at sunrise, 1 at sunset
  const theta = t * Math.PI;
  const elev = Math.sin(theta); // 0 to 1 to 0 (over day)
  const azim = Math.cos(theta); // 1 to -1

  // Sun direction (also used by sky)
  const sunY = Math.max(-0.2, elev);
  const sunDir = new THREE.Vector3(azim * 0.7, sunY, -0.3).normalize();
  
  sun.position.copy(sunDir).multiplyScalar(1500);
  sun.position.add(new THREE.Vector3(0, 0, 0));
  sun.target.position.set(0, 0, 0);

  // Day factor
  dayFactor = Math.max(0, Math.min(1, (elev + 0.1) / 0.3));
  goldenFactor = Math.max(0, 1 - Math.abs(hour - 8) / 2.5) * (elev > 0 ? 1 : 0) + Math.max(0, 1 - Math.abs(hour - 18.5) / 2) * (elev > -0.05 ? 1 : 0);
  goldenFactor = Math.min(1, goldenFactor);

  // Sky
  skyU.sunPosition.value.copy(sunDir);
  skyU.turbidity.value = 4 + (1 - goldenFactor) * 6;
  skyU.rayleigh.value = 1.5 + goldenFactor * 2.5;

  // Sun color & intensity
  const sunIntensity = Math.max(0, 2.5 * Math.min(1, elev + 0.15));
  sun.intensity = sunIntensity;
  const sunColorWarm = new THREE.Color(0xff6633);
  const sunColorDay = new THREE.Color(0xfff4e0);
  sun.color.copy(sunColorDay).lerp(sunColorWarm, goldenFactor);

  // Ambient
  const ambientDay = 0.55;
  const ambientNight = 0.12;
  hemi.intensity = ambientNight + (ambientDay - ambientNight) * dayFactor;
  hemi.color.setHSL(0.58, 0.25, 0.4 + 0.25 * dayFactor);
  hemi.groundColor.setHSL(0.1, 0.15, 0.1 + 0.15 * dayFactor);

  // Fog color
  const fogDay = new THREE.Color(0xb8c4cc);
  const fogSunset = new THREE.Color(0xe8b070);
  const fogNight = new THREE.Color(0x0a1420);
  const fogCol = new THREE.Color();
  if (dayFactor > 0.5) {
    fogCol.copy(fogSunset).lerp(fogDay, (dayFactor - 0.5) * 2);
  } else {
    fogCol.copy(fogNight).lerp(fogSunset, dayFactor * 2);
  }
  scene.fog.color.copy(fogCol);
  scene.fog.density = 0.00022 + (1 - dayFactor) * 0.00005;

  // Water uniforms
  waterUniforms.uSunDir.value.copy(sunDir);
  waterUniforms.uSunColor.value.copy(sun.color).multiplyScalar(sunIntensity * 0.5);
  waterUniforms.uSkyColor.value.copy(fogCol).multiplyScalar(0.8 + 0.2 * dayFactor);
  waterUniforms.uDeepColor.value.copy(new THREE.Color(0x0e2a3a)).lerp(new THREE.Color(0x050e18), 1 - dayFactor);
  waterUniforms.uFogColor.value.copy(fogCol);
  waterUniforms.uFogDensity.value = scene.fog.density;

  // Emissive night
  const night = 1 - dayFactor;
  balInstance.material.emissive = new THREE.Color(0xffeeaa);
  balInstance.material.emissiveIntensity = night * 0.35;
  
  // Deck lights
  deckLights.material.color.setHSL(0.1, 0.5, 0.5 + night * 0.5);
  deckLights.scale.setScalar(1 + night * 0.5);

  // Ship interior glow at night
  hullMat.emissive = new THREE.Color(0x1a1a20);
  hullMat.emissiveIntensity = night * 0.05;

  // Pool glows at night
  poolMat.emissiveIntensity = 0.3 + night * 0.7;

  // Update slider display if changed externally
  const hh = Math.floor(hour);
  const mm = Math.floor((hour - hh) * 60);
  document.getElementById('timeLabel').textContent = `${String(hh).padStart(2,'0')}:${String(mm).padStart(2,'0')}`;
}

function updateWalk(dt) {
  if (!walkMode) return;
  const fwd = new THREE.Vector3();
  camera.getWorldDirection(fwd);
  fwd.y = 0; fwd.normalize();
  const right = fwd.clone().cross(new THREE.Vector3(0, 1, 0)).normalize();
  const speed = 15;
  if (keys['KeyW'] || keys['ArrowUp']) camera.position.addScaledVector(fwd, speed * dt);
  if (keys['KeyS'] || keys['ArrowDown']) camera.position.addScaledVector(fwd, -speed * dt);
  if (keys['KeyD'] || keys['ArrowRight']) camera.position.addScaledVector(right, speed * dt);
  if (keys['KeyA'] || keys['ArrowLeft']) camera.position.addScaledVector(right, -speed * dt);
  // Clamp to quay
  camera.position.x = Math.max(-260, Math.min(280, camera.position.x));
  camera.position.z = Math.max(20, Math.min(90, camera.position.z));
  camera.position.y = 6;
}

// ==================== HORN / AUDIO ====================
let audioCtx = null;
function playHorn() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    const now = audioCtx.currentTime;
    const master = audioCtx.createGain();
    master.gain.setValueAtTime(0, now);
    master.gain.linearRampToValueAtTime(0.35, now + 0.15);
    master.gain.setValueAtTime(0.35, now + 1.6);
    master.gain.linearRampToValueAtTime(0, now + 2.2);
    master.connect(audioCtx.destination);

    // Ship horn - low fundamental with harmonics
    const freqs = [55, 82.5, 110, 165];
    const stops = [0, 0.2, 2.0, 2.2];
    freqs.forEach((f, i) => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(f, now);
      osc.frequency.linearRampToValueAtTime(f * 1.02, now + 2.2);
      const g = audioCtx.createGain();
      g.gain.setValueAtTime(0.3 / freqs.length, now);
      // filter
      const filter = audioCtx.createBiquadFilter();
      filter.type = 'lowpass';
      filter.frequency.setValueAtTime(600, now);
      filter.frequency.linearRampToValueAtTime(400, now + 2.2);
      osc.connect(filter);
      filter.connect(g);
      g.connect(master);
      osc.start(now);
      osc.stop(now + 2.3);
    });
  } catch (e) {
    console.warn('Horn audio failed', e);
  }
}

document.getElementById('soundBtn').addEventListener('click', playHorn);

      const f = departure.t / 4;
      gangway1.children.forEach(c => c.rotation.x = -0.15 - f * 1.5);
      gangway2.children.forEach(c => c.rotation.x = -0.15 - f * 1.5);
    }
    // Phase 2: 4-8s - mooring lines release
    else if (departure.t < 8) {
      const f = (departure.t - 4) / 4;
      moorings.children.forEach(c => c.scale.setScalar(1 - f * 0.9));
    }
    // Phase 3: 8-40s - ship moves out, turns, and sails west
    else if (departure.t < 42) {
      const f = Math.min(1, (departure.t - 8) / 34);
      const easeF = f * f * (3 - 2 * f);
      // Move away from quay (negative z) and west (negative x)
      ship.position.z = -easeF * 100;
      ship.position.x = -easeF * 500;
      ship.rotation.y = easeF * 0.25; // slight turn
      // Update camera to follow if in dock mode
      if (cameraAnim && cameraAnim.followShip === false) {
        orbitControls.target.x = ship.position.x * 0.5;
        orbitControls.target.z = ship.position.z * 0.5;
      }
    }
    // Phase 4: ship away
    else if (departure.t >= 42) {
      departure.state = 'sailing';
      document.getElementById('hintText').textContent = 'Ocean Star is sailing west toward the 25 de Abril bridge';
    }
  } else if (departure.state === 'sailing') {
    // Continue sailing
    ship.position.x -= dt * 30;
    ship.position.z -= dt * 3;
    ship.rotation.y += dt * 0.005;
    if (ship.position.x < -1500) {
      departure.state = 'away';
    }
  } else if (departure.state === 'returning') {
    departure.t += dt;
    const total = 42;
    const f = Math.min(1, departure.t / total);
    const easeF = f * f * (3 - 2 * f);
    // Animate back to dock
    ship.position.z = -100 * (1 - easeF);
    ship.position.x = -500 * (1 - easeF);
    ship.rotation.y = 0.25 * (1 - easeF);
    // Gangways and moorings come back after t=35
    if (departure.t > 30) {
      const g = Math.min(1, (departure.t - 30) / 12);
      gangway1.children.forEach(c => c.rotation.x = -0.15 - (1 - g) * 1.5);
      gangway2.children.forEach(c => c.rotation.x = -0.15 - (1 - g) * 1.5);
      moorings.children.forEach(c => c.scale.setScalar(0.1 + g * 0.9));
    }
    if (departure.t >= total) {
      departure.state = 'docked';
      ship.position.set(0, 0, 0);
      ship.rotation.y = 0;
      gangway1.children.forEach(c => c.rotation.x = -0.15);
      gangway2.children.forEach(c => c.rotation.x = -0.15);
      moorings.children.forEach(c => c.scale.setScalar(1));
      document.getElementById('hintText').textContent = 'Ocean Star is docked at Lisbon';
    }
  }
}

// ==================== PEOPLE / BOATS / GULLS ANIMATION ====================
function updatePeople(dt) {
  const t = performance.now() * 0.001;
  for (let i = 0; i < peopleData.length; i++) {
    const p = peopleData[i];
    if (!p.onQuay) continue;
    // Move towards target
    const dx = p.targetX - p.x;
    const dz = p.targetZ - p.z;
    const dist = Math.sqrt(dx * dx + dz * dz);
    if (dist < 0.5) {
      p.targetX = -80 + Math.random() * 260;
      p.targetZ = 25 + Math.random() * 45;
    } else {
      p.x += (dx / dist) * p.speed * dt;
      p.z += (dz / dist) * p.speed * dt;
    }
    dummy.position.set(p.x, p.y + Math.sin(t * 5 + i) * 0.05, p.z);
    dummy.rotation.set(0, Math.atan2(dx, dz), 0);
    dummy.updateMatrix();
    peopleInst.setMatrixAt(i, dummy.matrix);
  }
  peopleInst.instanceMatrix.needsUpdate = true;
}

function updateBoats(dt, t) {
  boats.forEach(b => {
    if (b.ferryPath) {
      b.t += dt * 0.05;
      const tt = b.t;
      b.mesh.position.x = -400 + Math.sin(tt) * 250;
      b.mesh.position.z = -250 + Math.cos(tt) * 80;
      b.mesh.rotation.y = Math.atan2(Math.cos(tt) * 250, -Math.sin(tt) * 80);
    } else if (b.sail) {
      b.circleT += dt * 0.15;
      b.mesh.position.x = b.basePos.x + Math.cos(b.circleT) * b.circleRadius;
      b.mesh.position.z = b.basePos.z + Math.sin(b.circleT) * b.circleRadius;
      b.mesh.rotation.y = -b.circleT;
    } else {
      b.mesh.position.y = Math.sin(t * 0.8 + b.phase) * 0.3;
      b.mesh.rotation.z = Math.sin(t * 0.6 + b.phase) * 0.03;
    }
  });
}

function updateGulls(t) {
  gulls.forEach(g => {
    const d = g.userData;
    d.ang += d.speed * 0.016;
    g.position.x = Math.cos(d.ang) * d.r;
    g.position.z = Math.sin(d.ang) * d.r;
    g.position.y = d.y + Math.sin(t * 2 + d.phase) * 3;
    g.lookAt(g.position.x + Math.cos(d.ang - Math.PI / 2), g.position.y, g.position.z + Math.sin(d.ang - Math.PI / 2));
    // Wing flap via rotation
    g.rotation.z = Math.sin(t * 8 + d.phase) * 0.3;
  });
}

// ==================== UI EVENTS ====================
document.getElementById('hideUI').addEventListener('click', () => {
  const ui = document.getElementById('ui');
  const btn = document.getElementById('hideUI');
  ui.classList.toggle('hidden');
  btn.classList.toggle('shifted');
  btn.textContent = ui.classList.contains('hidden') ? '▶ Show' : '◀ Hide';
});

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
});

// ==================== ANIMATE LOOP ====================
const clock = new THREE.Clock();
let elapsed = 0;

function animate() {
  requestAnimationFrame(animate);
  const dt = Math.min(0.05, clock.getDelta());
  elapsed += dt;

  // Time of day
  if (timePlaying) {
    currentTime += dt * 0.1; // 1 hr per 10 sec
    if (currentTime >= 24) currentTime -= 24;
    timeSlider.value = currentTime;
    updateTimeOfDay(currentTime);
  }

  // Walk mode
  updateWalk(dt);

  // Camera animation
  if (cameraAnim) {
    cameraAnim.t += dt;
    const f = Math.min(1, cameraAnim.t / cameraAnim.duration);
    const easeF = f * f * (3 - 2 * f);
    camera.position.lerpVectors(cameraAnim.fromPos, cameraAnim.toPos, easeF);
    orbitControls.target.lerpVectors(cameraAnim.fromTarget, cameraAnim.toTarget, easeF);
    if (cameraAnim.followShip) {
      // Follow ship position for deck preset
      camera.position.x = ship.position.x + cameraAnim.toPos.x;
      camera.position.z = ship.position.z + cameraAnim.toPos.z;
    }
    if (f >= 1) cameraAnim = null;
  }

  // Update ship departure
  updateDeparture(dt);

  // Water
  waterUniforms.uTime.value = elapsed;

  // People, boats, gulls
  updatePeople(dt);
  updateBoats(dt, elapsed);
  updateGulls(elapsed);

  // Tram animation - gently climbing/descending street
  const tramT = elapsed * 0.1;
  tramGroup.position.x = tramGroup.userData.basePos.x + Math.sin(tramT) * 8;
  tramGroup.position.z = tramGroup.userData.basePos.z + Math.cos(tramT) * 8;

  // Forklift moving
  forklift.position.x = forkliftBase.x + Math.sin(elapsed * 0.3) * 15;
  forklift.position.z = forkliftBase.z + Math.cos(elapsed * 0.25) * 6;
  forklift.rotation.y = Math.sin(elapsed * 0.3) * 0.8;

  // Orbit controls update
  if (!walkMode) orbitControls.update();

  // Ship lights effect (fog pulse at night)
  if (dayFactor < 0.3) {
    deckLights.material.color.setHSL(0.1, 0.6, 0.5 + Math.sin(elapsed * 3) * 0.1);
  }

  renderer.render(scene, camera);
}

// ==================== INIT ====================
updateTimeOfDay(currentTime);
animate();

// Hide loader once first frame is rendered
setTimeout(() => {
  const loader = document.getElementById('loader');
  loader.style.opacity = '0';
  setTimeout(() => loader.remove(), 700);
}, 150);

</script>
