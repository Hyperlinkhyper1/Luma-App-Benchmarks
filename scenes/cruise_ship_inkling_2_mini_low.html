<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MSC Virtuosa — Deck Walk</title>
<style>
  html,body{margin:0;padding:0;overflow:hidden;background:#000;font-family:'Segoe UI',Arial,sans-serif;}
  #app{position:fixed;inset:0;}
  #hud{position:fixed;top:14px;left:14px;color:#fff;z-index:10;pointer-events:none;text-shadow:0 1px 6px rgba(0,0,0,.7);}
  #hud h1{font-size:20px;letter-spacing:4px;margin:0;font-weight:300;}
  #hud h1 b{font-weight:600;color:#ffd27a;}
  #hud p{font-size:11px;letter-spacing:2px;margin:4px 0 0;opacity:.8;text-transform:uppercase;}
  #panel{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:10px;z-index:10;}
  button{pointer-events:auto;background:rgba(10,18,30,.55);color:#e8eef6;border:1px solid rgba(255,255,255,.25);
    padding:9px 16px;border-radius:20px;font-size:11px;letter-spacing:2px;text-transform:uppercase;cursor:pointer;
    backdrop-filter:blur(8px);transition:all .2s;}
  button:hover{background:rgba(255,210,122,.25);border-color:#ffd27a;color:#ffd27a;}
  button.active{background:#ffd27a;color:#1a2230;border-color:#ffd27a;}
  #clock{position:fixed;top:14px;right:16px;color:#fff;z-index:10;text-align:right;text-shadow:0 1px 6px rgba(0,0,0,.7);pointer-events:none;}
  #clock div:first-child{font-size:24px;letter-spacing:3px;font-weight:300;}
  #clock div:last-child{font-size:10px;letter-spacing:2px;opacity:.75;text-transform:uppercase;}
  #crosshair{position:fixed;top:50%;left:50%;width:6px;height:6px;margin:-3px;border-radius:50%;
    background:rgba(255,255,255,.85);z-index:9;display:none;box-shadow:0 0 6px rgba(0,0,0,.8);}
  #hint{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);color:#fff;z-index:9;font-size:11px;letter-spacing:2px;
    text-transform:uppercase;opacity:.85;text-shadow:0 1px 4px rgba(0,0,0,.8);pointer-events:none;text-align:center;}
</style>
</head>
<body>
<div id="app"></div>
<div id="hud"><h1>MSC <b>VIRTUOSA</b></h1><p>Deck 7 Promenade &amp; Sun Deck — Interactive</p></div>
<div id="clock"><div id="timeText">08:00</div><div id="weatherText">Clear Sky</div></div>
<div id="crosshair"></div>
<div id="hint">Click to walk — WASD move · Mouse look · 1 = Deck 7 · 2 = Sun Deck · Shift = brisk pace</div>
<div id="panel">
  <button id="btnWalk" class="active">Walk</button>
  <button id="btnRain">Rain</button>
  <button id="btnTime">Time ×1</button>
  <button id="btnReset">Overview</button>
</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>

<script type="module">
import * as THREE from 'three';
import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';

// ---------- Renderer / Scene ----------
const app = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x9db8cc, 300, 2200);

const camera = new THREE.PerspectiveCamera(66, innerWidth/innerHeight, 0.1, 6000);
camera.position.set(0, 60, 260);

// ---------- Lights ----------
const sun = new THREE.DirectionalLight(0xfff2dd, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -160; sun.shadow.camera.right = 160;
sun.shadow.camera.top = 160; sun.shadow.camera.bottom = -160;
sun.shadow.camera.far = 900;
sun.shadow.bias = -0.0006;
scene.add(sun);
scene.add(sun.target);

const hemi = new THREE.HemisphereLight(0xbcd6ee, 0x2a3a4a, 0.9);
scene.add(hemi);
const amb = new THREE.AmbientLight(0xffffff, 0.12);
scene.add(amb);

// ---------- Sky dome ----------
const skyUniforms = {
  topColor: { value: new THREE.Color(0x3a6ea8) },
  midColor: { value: new THREE.Color(0x87a8c8) },
  bottomColor: { value: new THREE.Color(0xd8e2ea) },
  sunDir: { value: new THREE.Vector3(0,1,0) },
  sunColor: { value: new THREE.Color(0xfff0c0) },
  sunIntensity: { value: 1.0 }
};
const sky = new THREE.Mesh(
  new THREE.SphereGeometry(3800, 32, 20),
  new THREE.ShaderMaterial({
    side: THREE.BackSide, depthWrite:false, fog:false,
    uniforms: skyUniforms,
    vertexShader:`varying vec3 vDir; void main(){ vDir = normalize(position); gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`
      uniform vec3 topColor, midColor, bottomColor, sunDir, sunColor;
      uniform float sunIntensity;
      varying vec3 vDir;
      void main(){
        float h = clamp(vDir.y, -0.2, 1.0);
        vec3 c = mix(bottomColor, midColor, smoothstep(-0.1, 0.25, h));
        c = mix(c, topColor, smoothstep(0.2, 0.85, h));
        float s = max(dot(normalize(vDir), normalize(sunDir)), 0.0);
        c += sunColor * (pow(s, 220.0)*1.4 + pow(s, 8.0)*0.22) * sunIntensity;
        gl_FragColor = vec4(c, 1.0);
      }`
  })
);
scene.add(sky);

// Sun & moon billboards
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(60, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xfff3c4, fog:false }));
scene.add(sunMesh);
const moonMesh = new THREE.Mesh(new THREE.SphereGeometry(30, 16, 16),
  new THREE.MeshBasicMaterial({ color: 0xe8ecf4, fog:false }));
scene.add(moonMesh);

// Stars
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for (let i=0;i<1200;i++){
  const t = Math.random()*Math.PI*2, p = Math.acos(Math.random()*0.95);
  const r = 3400;
  starPos.push(r*Math.sin(p)*Math.cos(t), r*Math.cos(p)+80, r*Math.sin(p)*Math.sin(t));
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos,3));
const starMat = new THREE.PointsMaterial({ color:0xffffff, size:7, sizeAttenuation:false, transparent:true, opacity:0, fog:false });
scene.add(new THREE.Points(starGeo, starMat));

// ---------- Ocean ----------
const OCEAN_SEG = 160, OCEAN_SIZE = 4500;
const oceanGeo = new THREE.PlaneGeometry(OCEAN_SIZE, OCEAN_SIZE, OCEAN_SEG, OCEAN_SEG);
oceanGeo.rotateX(-Math.PI/2);
const oceanMat = new THREE.MeshPhongMaterial({
  color: 0x155a7a, specular: 0x99ccee, shininess: 90,
  transparent:true, opacity:0.96, flatShading:false
});
const ocean = new THREE.Mesh(oceanGeo, oceanMat);
ocean.position.y = -6;
scene.add(ocean);
const oceanBase = oceanGeo.attributes.position.array.slice();

// ---------- Ship ----------
const ship = new THREE.Group();
scene.add(ship);

const L = 190, BEAM = 32, HULL_DEPTH = 11;

// Hull via rings (organic organic-ish sheer line)
function beamProfile(t){ // t in [0,1] stern->bow
  const bow = Math.pow(Math.max(0,1-t),0); // placeholder
  const u = Math.abs(t-0.42)/0.58;
  let w = Math.sqrt(Math.max(0.02, 1 - u*u));
  w *= (t>0.72) ? Math.pow(Math.max(0.06,(1-t)/(1-0.72)),0.45) : 1;   // bow taper
  w *= (t<0.14) ? Math.pow(0.55 + 0.45*(t/0.14), 0.8) : 1;             // rounded stern
  return BEAM*0.5*w;
}
function ringSection(x, t){
  const half = beamProfile(t);
  const sheer = 1 + 0.22*Math.pow(Math.abs(t-0.45)/0.55, 2.4); // raised bow/stern sheer
  const top = 6.4 * sheer;
  const depth = HULL_DEPTH * (t<0.12 ? (0.55+0.45*t/0.12) : Math.pow(Math.max(0.15, Math.sin(Math.min(1,t)*Math.PI*0.62+0.25)),0.5)*1.35 + 0.15);
  return { half, top, depth };
}
const RINGS = 90, SECTION = 26;
const hullPos = [], hullIdx = [];
for (let i=0;i<=RINGS;i++){
  const t = i/RINGS;
  const x = -L/2 + t*L;
  const { half, top, depth } = ringSection(x,t);
  for (let j=0;j<=SECTION;j++){
    const s = j/SECTION;           // 0 = keel center, 1 = starboard deck edge
    const ang = s * Math.PI*0.5;   // quarter circle-ish
    const z = Math.sin(ang)*half;
    // round at bottom, flatter near deck
    const y = top - (top+depth)*Math.pow(Math.cos(ang),0.62);
    hullPos.push(x, y, z, x, y, -z); // both sides: even index starboard, odd port (duplicate per j)
    // Actually push ordered ring: port->keel->starboard
  }
}
// Rebuild cleanly: ordered ring port deck -> keel -> starboard deck
hullPos.length = 0;
const ringStride = SECTION+1;
const ringPointCount = ringStride*2;
for (let i=0;i<=RINGS;i++){
  const t = i/RINGS;
  const x = -L/2 + t*L;
  const { half, top, depth } = ringSection(x,t);
  for (let j=0;j<=SECTION;j++){
    const s = j/SECTION;             // 0 port deck → 1 starboard deck
    const ang = (s-0.5)*Math.PI;     // -90..90
    const z = Math.sin(ang)*half;
    const y = top - (top+depth)*Math.pow(Math.cos(ang), 0.62);
    hullPos.push(x,y,z);
  }
}
for (let i=0;i<RINGS;i++){
  for (let j=0;j<SECTION;j++){
    const a = i*ringStride+j, b = (i+1)*ringStride+j;
    hullIdx.push(a,b,a+1, b,b+1,a+1);
  }
}
const hullGeo = new THREE.BufferGeometry();
hullGeo.setAttribute('position', new THREE.Float32BufferAttribute(hullPos,3));
hullGeo.setIndex(hullIdx);
hullGeo.computeVertexNormals();
const hullMat = new THREE.MeshStandardMaterial({ color:0xf4f6f8, roughness:0.42, metalness:0.18, side:THREE.DoubleSide });
const hull = new THREE.Mesh(hullGeo, hullMat);
hull.castShadow = true; hull.receiveShadow = true;
ship.add(hull);

// Red boot stripe / waterline
const stripeGeo = new THREE.BufferGeometry();
const stripePos = [];
for (let i=0;i<=RINGS;i++){
  const t = i/RINGS;
  const x = -L/2 + t*L;
  const { half } = ringSection(x,t);
  stripePos.push(x, -1.4, half*0.985,  x, -2.6, half*0.82);
}
// Build simple band both sides
stripePos.length = 0;
const bandIdx = [];
for (let i=0;i<=RINGS;i++){
  const t = i/RINGS;
  const x = -L/2 + t*L;
  const { half, top, depth } = ringSection(x,t);
  const h = half*0.995;
  stripePos.push(x,-1.2, h,  x,-2.8, h*0.88,  x,-1.2,-h,  x,-2.8,-h*0.88);
}
for (let i=0;i<RINGS;i++){
  for (let k=0;k<4;k+=2){
    const a = i*4+k, b=(i+1)*4+k;
    // two triangles per segment pair (port: k=0..1, stbd: k=2..3)
  }
}
for (let i=0;i<RINGS;i++){
  const a=i*4, b=(i+1)*4;
  // starboard side band
  bandIdx.push(a,b,a+1, b,b+1,a+1);
  // port side band
  bandIdx.push(a+2,a+3,b+2, b+2,a+3,b+3);
}
stripeGeo.setAttribute('position', new THREE.Float32BufferAttribute(stripePos,3));
stripeGeo.setIndex(bandIdx);
stripeGeo.computeVertexNormals();
const stripe = new THREE.Mesh(stripeGeo, new THREE.MeshStandardMaterial({ color:0xc02828, roughness:0.5, side:THREE.DoubleSide }));
ship.add(stripe);

// Deck plan helper: rounded-rectangle extrusion
function roundedRect(w, h, r){
  const s = new THREE.Shape();
  const x=-w/2, y=-h/2;
  s.moveTo(x+r,y);
  s.lineTo(x+w-r,y); s.absarc(x+w-r,y+r,r,-Math.PI/2,0);
  s.lineTo(x+w,y+h-r); s.absarc(x+w-r,y+h-r,r,0,Math.PI/2);
  s.lineTo(x+r,y+h); s.absarc(x+r,y+h-r,r,Math.PI/2,Math.PI);
  s.lineTo(x,y+r); s.absarc(x+r,y+r,r,Math.PI,Math.PI*1.5);
  return s;
}
function deckSlab(w, len, r, h, mat){
  const shape = roundedRect(w, len, r);
  const geo = new THREE.ExtrudeGeometry(shape, { depth:h, bevelEnabled:true, bevelThickness:0.5, bevelSize:0.5, bevelSegments:2, curveSegments:12 });
  geo.rotateX(-Math.PI/2); // now height along y
  geo.translate(0,0,0);
  const mesh = new THREE.Mesh(geo, mat);
  mesh.castShadow = true; mesh.receiveShadow = true;
  return mesh;
}

const hullDeckMat = new THREE.MeshStandardMaterial({ color:0xe8ecef, roughness:0.55, metalness:0.1 });
const deckWhite = new THREE.MeshStandardMaterial({ color:0xf7fafb, roughness:0.5, metalness:0.12 });
const deckPaint = new THREE.MeshStandardMaterial({ color:0x274b63, roughness:0.5, metalness:0.2 });
const deckTopMat = new THREE.MeshStandardMaterial({ color:0x3f6d8c, roughness:0.75 }); // teal deck floor

// Water deck
const deck0 = deckSlab(BEAM*1.02, L*0.985, 12, 2.2, hullDeckMat);
deck0.position.y = 6.2;
ship.add(deck0);

// Stacked accommodation decks (organic set-backs)
const deckStack = [];
const deckParams = [];
const N_DECKS = 14;
for (let i=0;i<N_DECKS;i++){
  const t = i/(N_DECKS-1);
  const w = BEAM*(0.94 - 0.026*i);
  const len = L*(0.88 - 0.045*i) * (1 - 0.16*Math.max(0,t-0.55)); // shorter up high, bow recess
  const xOff = -L*0.02*t; // shift aft
  const y = 8.4 + i*2.55;
  const h = 2.35;
  deckParams.push({ y, w, len, xOff, h, t });
}
deckParams.forEach((p,i)=>{
  const m = deckSlab(p.w, p.len, Math.min(10,p.w*0.22), p.h, i%2===0 ? deckWhite : deckPaint);
  m.position.set(p.xOff, p.y, 0);
  ship.add(m);
  deckStack.push(m);
});

// Deck 7 specifics (index 6) — promenade with railings + lifeboats
const DECK7_Y = deckParams[6].y + deckParams[6].h*0.5;
// floor strip (walkable promenade ring)
const walkFloor = new THREE.Mesh(new THREE.BoxGeometry(L*0.62, 0.25, BEAM*0.88), deckTopMat);
walkFloor.position.set(-L*0.03, DECK7_Y+0.12, 0);
walkFloor.receiveShadow = true;
ship.add(walkFloor);

// Railings around deck 7
function railing(x,y,z,len,axis){ // axis 'x' or 'z'
  const g = new THREE.Group();
  const postMat = new THREE.MeshStandardMaterial({ color:0xdfe6ea, roughness:0.4, metalness:0.6 });
  const railMat = new THREE.MeshStandardMaterial({ color:0xf2f5f7, roughness:0.35, metalness:0.7 });
  const railY = 1.15;
  const rail = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,len,8), railMat);
  rail.rotation.z = axis==='x' ? Math.PI/2 : 0;
  rail.rotation.x = axis==='z' ? Math.PI/2 : 0;
  rail.position.y = railY;
  g.add(rail);
  const mid = rail.clone(); mid.position.y = 0.62; mid.scale.setScalar(0.6); g.add(mid);
  const n = Math.floor(len/3.2);
  for (let i=0;i<=n;i++){
    const p = new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,railY,6), postMat);
    const off = -len/2 + (len/n)*i;
    p.position.set(axis==='x'?off:0, railY/2, axis==='z'?off:0);
    g.add(p);
  }
  g.position.set(x,y,z);
  return g;
}
const W7 = BEAM*0.44, X7 = L*0.30, X7o = -L*0.03;
ship.add(railing(X7o, DECK7_Y+0.1,  W7, 2*X7, 'x'));
ship.add(railing(X7o, DECK7_Y+0.1, -W7, 2*X7, 'x'));
// prow & stern ends
ship.add(railing(X7o+X7, DECK7_Y+0.1, 0, 2*W7, 'z'));
ship.add(railing(X7o-X7, DECK7_Y+0.1, 0, 2*W7, 'z'));

// Lifeboats along deck 7 edges
const boatMat = new THREE.MeshStandardMaterial({ color:0xff6a1a, roughness:0.45, metalness:0.1 });
const boatTopMat = new THREE.MeshStandardMaterial({ color:0xf3f5f6, roughness:0.5 });
const darkMetal = new THREE.MeshStandardMaterial({ color:0x3a4148, roughness:0.5, metalness:0.7 });
const boatGroup = new THREE.Group();
const boatPositions = [];
for (let i=0;i<7;i++){
  const x = -L*0.30 + i*(L*0.115);
  boatPositions.push(x, x); // both sides conceptually
}
for (const side of [-1,1]){
  for (let i=0;i<7;i++){
    const x = -L*0.30 + i*(L*0.115);
    const boat = new THREE.Group();
    const hullB = new THREE.Mesh(new THREE.CapsuleGeometry(1.05, 4.2, 6, 12), boatMat);
    hullB.rotation.x = Math.PI/2; // length along z? we want length along x
    hullB.rotation.set(0, Math.PI/2, 0);
    hullB.scale.set(1, 0.72, 1);
    hullB.castShadow = true;
    boat.add(hullB);
    const top = new THREE.Mesh(new THREE.CapsuleGeometry(0.92, 3.4, 4, 10), boatTopMat);
    top.rotation.y = Math.PI/2;
    top.scale.set(1,0.55,1);
    top.position.y = 0.62;
    boat.add(top);
    // davit arms
    for (const dx of [-2.1, 2.1]){
      const arm = new THREE.Mesh(new THREE.BoxGeometry(0.28, 2.6, 0.28), darkMetal);
      arm.position.set(dx, 1.9, side*-0.4);
      arm.rotation.x = side*0.5;
      boat.add(arm);
    }
    boat.position.set(x, DECK7_Y+1.35, side*(W7-1.3));
    boatGroup.add(boat);
  }
}
ship.add(boatGroup);

// Top sun deck
const top = deckParams[N_DECKS-1];
const sunDeckY = top.y + top.h*0.5 + 0.3;
const sunFloor = new THREE.Mesh(new THREE.BoxGeometry(L*0.5, 0.28, BEAM*0.62), deckTopMat);
sunFloor.position.set(-L*0.08, sunDeckY+0.14, 0);
sunFloor.receiveShadow = true;
ship.add(sunFloor);
ship.add(railing(-L*0.08, sunDeckY+0.1,  BEAM*0.31, L*0.5, 'x'));
ship.add(railing(-L*0.08, sunDeckY+0.1, -BEAM*0.31, L*0.5, 'x'));
// pool
const poolMat = new THREE.MeshStandardMaterial({ color:0x37c8e0, roughness:0.1, metalness:0.1, emissive:0x0a4a5a, emissiveIntensity:0.35 });
const pool = new THREE.Mesh(new THREE.BoxGeometry(16, 0.7, 8), poolMat);
pool.position.set(-L*0.08, sunDeckY+0.55, 0);
ship.add(pool);
// lounge chairs
const chairMat = new THREE.MeshStandardMaterial({ color:0xf2ede2, roughness:0.7 });
for (let i=0;i<8;i++){
  for (const side of [-1,1]){
    const chair = new THREE.Mesh(new THREE.BoxGeometry(0.7,0.35,1.8), chairMat);
    chair.position.set(-L*0.08 + (i%4-1.5)*3.4, sunDeckY+0.45, side*(4.5+Math.floor(i/4)*1.6));
    chair.castShadow = true;
    ship.add(chair);
  }
}
// bar / canopy
const canopy = new THREE.Mesh(new THREE.BoxGeometry(10, 0.35, 9), new THREE.MeshStandardMaterial({ color:0xf7f4ec, roughness:0.6 }));
canopy.position.set(-L*0.08, sunDeckY+2.6, 0);
ship.add(canopy);
for (const [dx,dz] of [[-4.5,-4],[-4.5,4],[4.5,-4],[4.5,4]]){
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.12,0.12,2.6,8), darkMetal);
  post.position.set(-L*0.08+dx, sunDeckY+1.3, dz);
  ship.add(post);
}

// Windows (rows along deck sides)
const winMat = new THREE.MeshStandardMaterial({ color:0x0e1c28, emissive:0xffd47a, emissiveIntensity:0.0, roughness:0.3, metalness:0.4 });
const winGeo = new THREE.BoxGeometry(0.9, 0.62, 0.22);
const winCount = N_DECKS*2*46;
const windows = new THREE.InstancedMesh(winGeo, winMat, winCount);
const dummy = new THREE.Object3D();
let wi = 0;
deckParams.forEach((p)=>{
  const rows = Math.floor(p.len/3.4);
  for (const side of [-1,1]){
    for (let i=0;i<rows;i++){
      const x = p.xOff - p.len/2 + 6 + i*(p.len-12)/(rows-1);
      dummy.position.set(x, p.y + p.h*0.55, side*(p.w/2 + 0.06));
      dummy.rotation.set(0, side>0?0:Math.PI, 0);
      dummy.updateMatrix();
      windows.setMatrixAt(wi++, dummy.matrix);
    }
  }
});
windows.count = wi;
ship.add(windows);

// Funnel / spire
const funnelGroup = new THREE.Group();
const funnel = new THREE.Mesh(new THREE.CylinderGeometry(4.6, 5.4, 9, 20), new THREE.MeshStandardMaterial({ color:0xf2f4f6, roughness:0.4 }));
funnel.position.y = 4.5; funnel.castShadow = true;
funnelGroup.add(funnel);
const funnelStripe = new THREE.Mesh(new THREE.CylinderGeometry(4.75, 4.9, 2.2, 20), new THREE.MeshStandardMaterial({ color:0x0f4c81, roughness:0.5 }));
funnelStripe.position.y = 7.2;
funnelGroup.add(funnelStripe);
const funnelCap = new THREE.Mesh(new THREE.CylinderGeometry(3.2,4.6,1.6,20), new THREE.MeshStandardMaterial({ color:0x1a2a3a, roughness:0.6 }));
funnelCap.position.y = 9.6;
funnelGroup.add(funnelCap);
const funnelPos = deckParams[N_DECKS-3];
funnelGroup.position.set(funnelPos.xOff - L*0.14, funnelPos.y + funnelPos.h*0.5 + 0.4, 0);
ship.add(funnelGroup);

// Bridge & mast
const bridge = new THREE.Mesh(new THREE.BoxGeometry(7, 3.2, BEAM*0.52), deckWhite);
const bridgeDeck = deckParams[N_DECKS-1];
bridge.position.set(bridgeDeck.xOff + L*0.36, bridgeDeck.y + 1.4, 0);
bridge.castShadow = true;
ship.add(bridge);
const bridgeGlass = new THREE.Mesh(new THREE.BoxGeometry(6.4, 1.1, BEAM*0.47), new THREE.MeshStandardMaterial({ color:0x0a1a26, roughness:0.15, metalness:0.6, emissive:0x2a5a7a, emissiveIntensity:0.2 }));
bridgeGlass.position.set(bridgeDeck.xOff + L*0.36 + 0.35, bridgeDeck.y + 2.1, 0);
ship.add(bridgeGlass);
const mast = new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.5,13,10), darkMetal);
mast.position.set(bridgeDeck.xOff + L*0.33, bridgeDeck.y + 5.6, 0);
ship.add(mast);
const radar = new THREE.Mesh(new THREE.BoxGeometry(3.6,0.35,1.1), new THREE.MeshStandardMaterial({ color:0xe8ecef, roughness:0.4 }));
radar.position.set(bridgeDeck.xOff + L*0.33, bridgeDeck.y + 7.6, 0);
ship.add(radar);
const dome = new THREE.Mesh(new THREE.SphereGeometry(1.6,14,10), deckWhite);
dome.position.set(funnelPos.xOff + L*0.05, funnelPos.y + 2.2, 0);
ship.add(dome);

// Bow flare
const bowBulwark = new THREE.Mesh(new THREE.BoxGeometry(14, 2.6, BEAM*0.6), hullDeckMat);
bowBulwark.position.set(L/2 - 4, 8.1, 0);
ship.add(bowBulwark);

// Radar animation var
let radarSpin = 0;

// ---------- Clouds ----------
const cloudMat = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:1, transparent:true, opacity:0.82, flatShading:true });
const clouds = new THREE.Group();
for (let i=0;i<16;i++){
  const c = new THREE.Group();
  const n = 3 + Math.floor(Math.random()*4);
  for (let j=0;j<n;j++){
    const s = new THREE.Mesh(new THREE.IcosahedronGeometry(18 + Math.random()*26, 1), cloudMat);
    s.position.set((Math.random()-0.5)*70, (Math.random()-0.5)*10, (Math.random()-0.5)*36);
    s.scale.y = 0.42;
    c.add(s);
  }
  c.position.set((Math.random()-0.5)*2600, 260 + Math.random()*260, (Math.random()-0.5)*2600);
  clouds.add(c);
}
scene.add(clouds);

// ---------- Rain ----------
const RAIN_N = 2600;
const rainGeo = new THREE.BufferGeometry();
const rainPos = new Float32Array(RAIN_N*3);
const rainSpeed = new Float32Array(RAIN_N);
for (let i=0;i<RAIN_N;i++){
  rainPos[i*3] = (Math.random()-0.5)*420;
  rainPos[i*3+1] = Math.random()*180;
  rainPos[i*3+2] = (Math.random()-0.5)*300;
  rainSpeed[i] = 60 + Math.random()*40;
}
rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos,3));
const rainMat = new THREE.PointsMaterial({ color:0xbfd4e6, size:0.9, transparent:true, opacity:0.55, fog:false });
const rain = new THREE.Points(rainGeo, rainMat);
rain.visible = false;
scene.add(rain);

// ---------- Controls ----------
const controls = new PointerLockControls(camera, renderer.domElement);
let walking = false, mode = 'deck7';
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code==='Digit1') setMode('deck7');
  if (e.code==='Digit2') setMode('sun');
});
addEventListener('keyup', e => keys[e.code] = false);

function placeAt(modeStr){
  if (modeStr==='deck7'){
    camera.position.set(-L*0.03, DECK7_Y + 1.75, W7*0.62);
  } else {
    camera.position.set(-L*0.08, sunDeckY + 1.75, 0);
  }
  camera.rotation.set(0,0,0);
}
function setMode(m){
  mode = m;
  placeAt(m);
  if (!controls.isLocked){ controls.lock(); }
  walking = true;
}
placeAt('deck7');

const btnWalk = document.getElementById('btnWalk');
const btnReset = document.getElementById('btnReset');
const btnRain = document.getElementById('btnRain');
const btnTime = document.getElementById('btnTime');

btnWalk.addEventListener('click', ()=>{
  if (controls.isLocked){ controls.unlock(); walking=false; btnWalk.classList.remove('active'); }
  else { controls.lock(); walking=true; btnWalk.classList.add('active'); }
});
btnReset.addEventListener('click', ()=>{
  controls.unlock(); walking=false; btnWalk.classList.remove('active');
  camera.position.set(0, 58, 265);
  camera.lookAt(0, 22, 0);
});
let rainOn = false;
btnRain.addEventListener('click', ()=>{
  rainOn = !rainOn;
  rain.visible = rainOn;
  btnRain.classList.toggle('active', rainOn);
});
let timeScale = 1;
btnTime.addEventListener('click', ()=>{
  timeScale = timeScale===1 ? 12 : 1;
  btnTime.textContent = 'Time ×' + timeScale;
  btnTime.classList.toggle('active', timeScale>1);
});
renderer.domElement.addEventListener('click', ()=>{
  if (!controls.isLocked){ controls.lock(); walking=true; btnWalk.classList.add('active'); }
});
controls.addEventListener('lock', ()=>{ walking=true; document.getElementById('crosshair').style.display='block'; btnWalk.classList.add('active'); });
controls.addEventListener('unlock', ()=>{ walking=false; document.getElementById('crosshair').style.display='none'; btnWalk.classList.remove('active'); });

// ---------- Day/Night ----------
let dayTime = 0.32; // 0..1 (0=midnight, 0.5=noon)
const clockEl = document.getElementById('timeText');
const weatherEl = document.getElementById('weatherText');

const skyTopDay = new THREE.Color(0x2f6db3), skyMidDay = new THREE.Color(0x8fb4d6), skyBotDay = new THREE.Color(0xe4ecf2);
const skyTopNight = new THREE.Color(0x050a18), skyMidNight = new THREE.Color(0x0e1830), skyBotNight = new THREE.Color(0x1a2440);
const sunColDay = new THREE.Color(0xfff2dd), sunColNight = new THREE.Color(0x9db4ff);
const oceanDay = new THREE.Color(0x155a7a), oceanNight = new THREE.Color(0x081826);
const fogDay = new THREE.Color(0x9db8cc), fogNight = new THREE.Color(0x0a1420);
const rainTop = new THREE.Color(0x4a5a6a), rainBot = new THREE.Color(0x78879a);

function updateEnvironment(dt){
  dayTime += dt * 0.00085 * timeScale;
  if (dayTime >= 1) dayTime -= 1;
  const ang = dayTime * Math.PI * 2 - Math.PI/2; // sun path
  const sunEl = Math.sin(ang); // -1..1
  const sunAz = Math.cos(ang);
  const dir = new THREE.Vector3(sunAz, sunEl, 0.28).normalize();

  // sun mesh & light
  sunMesh.position.copy(dir).multiplyScalar(3300);
  sunMesh.material.color.set(0xfff3c4);
  sunMesh.material.opacity = 1; sunMesh.visible = sunEl > -0.18;
  sun.position.copy(dir).multiplyScalar(300);
  sun.target.position.set(0,0,0);

  moonMesh.position.copy(dir).multiplyScalar(-3300); // opposite
  moonMesh.visible = sunEl < 0.15;

  const dayness = THREE.MathUtils.clamp((sunEl+0.12)/0.55, 0, 1); // 0 night → 1 day
  const duskFactor = Math.max(0, 1 - Math.abs(sunEl)*3.2); // golden hour

  sun.intensity = 2.6 * dayness + duskFactor*0.5;
  sun.color.copy(sunColNight).lerp(sunColDay, dayness);
  if (duskFactor > 0.2) sun.color.lerp(new THREE.Color(0xff9a4a), duskFactor*0.6);

  hemi.intensity = 0.22 + 0.85*dayness;
  hemi.color.set(0x1a2a44).lerp(new THREE.Color(0xbcd6ee), dayness);
  hemi.groundColor.set(0x060a12).lerp(new THREE.Color(0x2a3a4a), dayness);

  // sky
  const top = skyTopNight.clone().lerp(skyTopDay, dayness);
  const mid = skyMidNight.clone().lerp(skyMidDay, dayness);
  const bot = skyBotNight.clone().lerp(skyBotDay, dayness);
  if (duskFactor > 0){
    mid.lerp(new THREE.Color(0xff9a58), duskFactor*0.55);
    bot.lerp(new THREE.Color(0xffc07a), duskFactor*0.6);
  }
  if (rainOn){ top.lerp(rainTop, 0.7); mid.lerp(rainBot, 0.7); bot.lerp(rainBot, 0.6); }
  skyUniforms.topColor.value.copy(top);
  skyUniforms.midColor.value.copy(mid);
  skyUniforms.bottomColor.value.copy(bot);
  skyUniforms.sunDir.value.copy(dir);
  skyUniforms.sunIntensity.value = rainOn ? 0.25 : 1.0 * dayness + duskFactor*0.35;
  skyUniforms.sunColor.value.set(0xfff0c0);

  starMat.opacity = (1-dayness) * (rainOn ? 0.15 : 0.9);

  oceanMat.color.copy(oceanNight).lerp(oceanDay, dayness);
  if (rainOn) oceanMat.color.multiplyScalar(0.65);
  oceanMat.shininess = rainOn ? 30 : 90;

  scene.fog.color.copy(fogNight).lerp(fogDay, dayness);
  if (rainOn) scene.fog.color.lerp(new THREE.Color(0x4a5a6a), 0.65);
  scene.fog.near = rainOn ? 80 : 300;
  scene.fog.far = rainOn ? 1100 : 2200;

  // windows glow at night
  winMat.emissiveIntensity = (1-dayness) * 1.15;
  // bridge glass
  bridgeGlass.material.emissiveIntensity = 0.2 + (1-dayness)*1.1;
  poolMat.emissiveIntensity = 0.35 + (1-dayness)*0.8;

  // clock
  const hrs = (dayTime*24 + 12) % 24; // shift so 0.32 ≈ 08:00ish
  const hh = Math.floor(hrs), mm = Math.floor((hrs-hh)*60);
  clockEl.textContent = String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  weatherEl.textContent = rainOn ? 'Heavy Rain' : (dayness>0.5 ? 'Clear Sky' : (dayness>0.15 ? 'Golden Hour' : 'Night'));
}

// ---------- Animate ----------
const clock = new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // ship gentle motion
  ship.rotation.z = Math.sin(t*0.45)*0.008;
  ship.rotation.x = Math.sin(t*0.32+1.2)*0.006;
  ship.position.y = Math.sin(t*0.4)*0.5;

  // ocean waves
  const pos = oceanGeo.attributes.position;
  for (let i=0;i<pos.count;i++){
    const x = oceanBase[i*3], z = oceanBase[i*3+2];
    pos.setY(i,
      Math.sin(x*0.028 + t*0.9)*1.5 +
      Math.cos(z*0.022 + t*0.7)*1.2 +
      Math.sin((x+z)*0.014 + t*0.55)*1.8);
  }
  pos.needsUpdate = true;
  oceanGeo.computeVertexNormals();

  // radar
  radarSpin += dt*2.4;
  radar.rotation.y = radarSpin;

  // clouds drift
  clouds.children.forEach((c,i)=>{ c.position.x += dt*(2.2 + i*0.15); if (c.position.x > 1500) c.position.x = -1500; });
  cloudMat.opacity = rainOn ? 0.55 : 0.82;
  cloudMat.color.set(rainOn ? 0x5a6a7a : 0xffffff);

  // rain
  if (rainOn){
    const rp = rainGeo.attributes.position.array;
    for (let i=0;i<RAIN_N;i++){
      rp[i*3+1] -= rainSpeed[i]*dt;
      if (rp[i*3+1] < -6){
        rp[i*3+1] = 150 + Math.random()*40;
        rp[i*3] = (Math.random()-0.5)*420 + ship.position.x;
        rp[i*3+2] = (Math.random()-0.5)*300;
      }
    }
    rainGeo.attributes.position.needsUpdate = true;
  }

  updateEnvironment(dt);

  // walking
  if (walking && controls.isLocked){
    const speed = keys.ShiftLeft || keys.ShiftRight ? 9 : 4.6;
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir); dir.y = 0; dir.normalize();
    const right = new THREE.Vector3().crossVectors(dir, new THREE.Vector3(0,1,0)).normalize();
    const move = new THREE.Vector3();
    if (keys.KeyW) move.add(dir);
    if (keys.KeyS) move.sub(dir);
    if (keys.KeyD) move.add(right);
    if (keys.KeyA) move.sub(right);
    move.normalize().multiplyScalar(speed*dt);
    camera.position.add(move);

    if (mode==='deck7'){
      const y = DECK7_Y + 1.75;
      camera.position.y = y;
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, X7o - X7 + 1.5, X7o + X7 - 1.5);
      // walkway: keep |z| between inner and outer rails, or on the stern/prow ends
      const inner = BEAM*0.30, outer = W7 - 1.0;
      if (Math.abs(camera.position.z) < inner){
        // on end zones allowed; else push out to nearest side
        const onEnd = Math.abs(camera.position.x - X7o) > (X7 - 8);
        if (!onEnd){
          camera.position.z = (camera.position.z >= 0 ? 1 : -1) * inner;
        }
      }
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -outer, outer);
    } else {
      camera.position.y = sunDeckY + 1.75;
      camera.position.x = THREE.MathUtils.clamp(camera.position.x, -L*0.08 - L*0.25 + 1.5, -L*0.08 + L*0.25 - 1.5);
      camera.position.z = THREE.MathUtils.clamp(camera.position.z, -BEAM*0.31 + 1.2, BEAM*0.31 - 1.2);
    }
  }

  renderer.render(scene, camera);
}
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// Hide hint once walking
setTimeout(()=>{ document.getElementById('hint').style.opacity = 0.55; }, 8000);
</script>
</body>
</html>
