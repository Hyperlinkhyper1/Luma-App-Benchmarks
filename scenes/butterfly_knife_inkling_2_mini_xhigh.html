<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const app = document.getElementById('app');
let renderer;
try{
  renderer = new THREE.WebGLRenderer({antialias:true});
  if(!renderer.getContext()) throw new Error('no ctx');
}catch(e){
  document.getElementById('banner').innerHTML = '<h2>WEBGL UNAVAILABLE</h2><p style="color:#b9ad97;letter-spacing:2px">This benchmark needs a WebGL-capable browser.</p>';
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.15;
app.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x07080d);
scene.fog = new THREE.FogExp2(0x07080d, 0.016);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 300);
camera.position.set(18,12,20);

const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,2.1,0);
controls.enableDamping = true;
controls.dampingFactor = 0.06;
controls.maxPolarAngle = Math.PI*0.52;
controls.minDistance = 3.5; controls.maxDistance = 40;

/* ---------- lights ---------- */
const spot = new THREE.SpotLight(0xfff2df, 0, 40, Math.PI/5.4, 0.45, 1.6);
spot.position.set(0,14,3); spot.target.position.set(0,2,0);
spot.castShadow = true; spot.shadow.mapSize.set(2048,2048); spot.shadow.bias = -0.0005; spot.shadow.camera.near=6; spot.shadow.camera.far=30;
scene.add(spot, spot.target);
const key = new THREE.DirectionalLight(0xffffff, 1.5); key.position.set(-7,9,6); key.castShadow=true; key.shadow.mapSize.set(1024,1024); key.shadow.bias=-0.0008; scene.add(key);
const rim = new THREE.DirectionalLight(0x7fb2ff, 2.2); rim.position.set(6,4,-8); scene.add(rim);
scene.add(new THREE.AmbientLight(0x2a2540, 1.4));

/* ---------- canvas texture helper ---------- */
function ctex(w,h,fn){ const c=document.createElement('canvas'); c.width=w; c.height=h; const g=c.getContext('2d'); fn(g,w,h); const t=new THREE.CanvasTexture(c); t.colorSpace=THREE.SRGBColorSpace; t.anisotropy=4; return t; }

const brushedTex = ctex(256,256,(g,w,h)=>{ for(let i=0;i<3000;i++){ g.fillStyle=`rgba(${180+Math.random()*60|0},${180+Math.random()*60|0},${190+Math.random()*55|0},0.06)`; g.fillRect(Math.random()*w,Math.random()*h,Math.random()*60,1);} });
brushedTex.wrapS=brushedTex.wrapT=THREE.RepeatWrapping;

/* ---------- stage ---------- */
const stage = new THREE.Group(); scene.add(stage);
const floor = new THREE.Mesh(new THREE.CircleGeometry(60,64), new THREE.MeshStandardMaterial({color:0x0d0f18,roughness:0.85,metalness:0.3}));
floor.rotation.x=-Math.PI/2; floor.receiveShadow=true; stage.add(floor);
const plinthMat = new THREE.MeshPhysicalMaterial({color:0x1b1e2b,roughness:0.32,metalness:0.55,clearcoat:0.6,clearcoatRoughness:0.25});
const plinth = new THREE.Mesh(new THREE.BoxGeometry(6.4,1.7,6.4), plinthMat); plinth.position.y=0.85; plinth.castShadow=plinth.receiveShadow=true; stage.add(plinth);
const trim = new THREE.Mesh(new THREE.BoxGeometry(6.6,0.14,6.6), new THREE.MeshPhysicalMaterial({color:0xc8a06a,roughness:0.25,metalness:1,clearcoat:0.5})); trim.position.y=1.72; trim.castShadow=true; stage.add(trim);
const emblemMatCache = {};
function emblemTex(col){ if(emblemMatCache[col]) return emblemMatCache[col];
  const t = ctex(256,160,(g,w,h)=>{ g.clearRect(0,0,w,h); g.strokeStyle=col; g.fillStyle=col; g.lineWidth=7; g.lineCap='round';
    g.beginPath(); g.arc(88,72,42,Math.PI*0.42,Math.PI*1.58); g.arc(112,66,36,Math.PI*1.55,Math.PI*0.45,true); g.fill();
    g.beginPath(); g.moveTo(168,44); g.lineTo(176,72); g.lineTo(204,80); g.lineTo(176,88); g.lineTo(168,116); g.lineTo(160,88); g.lineTo(132,80); g.lineTo(160,72); g.closePath(); g.fill();
    g.font='600 26px Georgia'; g.textAlign='center'; g.fillText('CELESTIA',128,146); });
  emblemMatCache[col]=t; return t; }
const placardTex = ctex(512,256,(g,w,h)=>{ g.fillStyle='#15161f'; g.fillRect(0,0,w,h); g.strokeStyle='#c8a06a'; g.lineWidth=5; g.strokeRect(10,10,w-20,h-20);
  g.fillStyle='#e2a284'; g.font='600 30px Georgia'; g.textAlign='center'; g.fillText('ASTRALIS',w/2,72);
  g.fillStyle='#9d937f'; g.font='17px Georgia'; g.fillText('C E L E S T I A   F O R G E',w/2,102);
  g.fillStyle='#cfc5b0'; g.font='15px Georgia'; g.fillText('Ceramic · Rose gold · Tanto blade · Washer pivots',w/2,150);
  g.fillStyle='#8d8672'; g.font='14px Georgia'; g.fillText('Space edition  ·  23.4 cm  ·  86 g  ·  “Carry the stars.”',w/2,180); });
const placard = new THREE.Mesh(new THREE.BoxGeometry(3.6,1.75,0.12), new THREE.MeshStandardMaterial({map:placardTex,roughness:0.5,metalness:0.3}));
placard.position.set(0,2.32,2.72); placard.rotation.x=-0.42; placard.castShadow=true; stage.add(placard);
const post = new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.1,0.6,12), new THREE.MeshStandardMaterial({color:0x3a3d4e,roughness:0.4,metalness:0.8})); post.position.set(0,1.95,2.66); stage.add(post);

/* space decor */
const stars = (()=>{ const n=420, pos=new Float32Array(n*3); for(let i=0;i<n;i++){ const r=55+Math.random()*60, th=Math.random()*Math.PI*2, ph=Math.acos(2*Math.random()-1); pos[i*3]=r*Math.sin(ph)*Math.cos(th); pos[i*3+1]=Math.abs(r*Math.cos(ph))*0.9-5; pos[i*3+2]=r*Math.sin(ph)*Math.sin(th);} const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3)); const m=new THREE.PointsMaterial({color:0xcdd8ff,size:0.42,transparent:true,opacity:0.85,sizeAttenuation:true}); const p=new THREE.Points(g,m); scene.add(p); return p; })();
const ringMat = new THREE.MeshBasicMaterial({color:0x3f6f8e,transparent:true,opacity:0.55});
function orbitRing(r,ty,rx,c){ const m=new THREE.Mesh(new THREE.TorusGeometry(r,0.035,8,120), new THREE.MeshBasicMaterial({color:c,transparent:true,opacity:0.5})); m.rotation.set(rx,0,0); m.position.set(0,ty,0); stage.add(m); return m; }
const orbits=[orbitRing(9.5,2.5,Math.PI/2.6,0x5fd9ff),orbitRing(12.5,2.5,Math.PI/2.15,0xff9a68)]; orbits[0].rotation.z=0.35; orbits[1].rotation.z=-0.28;
function planetTex(c1,c2){ return ctex(128,128,(g,w,h)=>{ const gr=g.createRadialGradient(w*0.38,h*0.36,6,w/2,h/2,w*0.62); gr.addColorStop(0,c1); gr.addColorStop(1,c2); g.fillStyle=gr; g.fillRect(0,0,w,h); for(let i=0;i<28;i++){ g.fillStyle='rgba(0,0,0,0.18)'; g.beginPath(); g.arc(Math.random()*w,Math.random()*h,2+Math.random()*7,0,7); g.fill(); } }); }
const p1 = new THREE.Mesh(new THREE.SphereGeometry(2.3,32,32), new THREE.MeshStandardMaterial({map:planetTex('#e9b8b0','#5a2b33'),roughness:0.9})); p1.position.set(-13.5,4.5,-7); scene.add(p1);
const p2 = new THREE.Mesh(new THREE.SphereGeometry(1.1,32,32), new THREE.MeshStandardMaterial({map:planetTex('#9fd8e8','#12344a'),roughness:0.85})); p2.position.set(13,6.4,-9); scene.add(p2);
const p2ring = new THREE.Mesh(new THREE.TorusGeometry(2.0,0.1,8,80), new THREE.MeshBasicMaterial({color:0x9fd8e8,transparent:true,opacity:0.45})); p2ring.position.copy(p2.position); p2ring.rotation.x=1.2; scene.add(p2ring);
const comet = new THREE.Group(); const head = new THREE.Mesh(new THREE.SphereGeometry(0.42,16,16), new THREE.MeshBasicMaterial({color:0xeaf6ff})); comet.add(head);
const tail = new THREE.Mesh(new THREE.ConeGeometry(0.5,5.5,12,1,true), new THREE.MeshBasicMaterial({color:0x9fd8ff,transparent:true,opacity:0.28,side:THREE.DoubleSide,blending:THREE.AdditiveBlending,depthWrite:false})); tail.position.y=-2.9; comet.add(tail); comet.rotation.z=2.25; comet.position.set(8,11,-10); scene.add(comet);
const cometOrbit = new THREE.Mesh(new THREE.TorusGeometry(11,0.02,6,160), new THREE.MeshBasicMaterial({color:0x86c8e8,transparent:true,opacity:0.22})); cometOrbit.position.set(0,10,0); cometOrbit.rotation.x=Math.PI/2.25; cometOrbit.rotation.z=0.3; scene.add(cometOrbit);

/* ---------- materials ---------- */
const COLOURWAYS = [
 {name:'Solstice', ceramic:'#f3efe8', ceramicRough:0.18, rose:'#d99a77', roseRough:0.22, blade:'#c9ccd3', bladeRough:0.42, emblem:'#e2a284', iridescence:0},
 {name:'Obsidian', ceramic:'#1c1d26', ceramicRough:0.3, rose:'#d4af6a', roseRough:0.2, blade:'#3a3f4b', bladeRough:0.35, emblem:'#d4af6a', iridescence:0.15},
 {name:'Aurora', ceramic:'#14555f', ceramicRough:0.24, rose:'#e9b8a4', roseRough:0.2, blade:'#d7dbe0', bladeRough:0.3, emblem:'#7fe0cf', iridescence:0.85}
];
let cw = COLOURWAYS[0];
function mats(){ 
  return {
    ceramic: new THREE.MeshPhysicalMaterial({color:cw.ceramic,roughness:cw.ceramicRough,metalness:0.05,clearcoat:1,clearcoatRoughness:0.12,iridescence:cw.iridescence,iridescenceIOR:1.4}),
    rose: new THREE.MeshPhysicalMaterial({color:cw.rose,roughness:cw.roseRough,metalness:1,clearcoat:0.4,clearcoatRoughness:0.2}),
    blade: new THREE.MeshPhysicalMaterial({color:cw.blade,roughness:cw.bladeRough,metalness:0.95,clearcoat:0.7,clearcoatRoughness:0.18,map:brushedTex}),
    dark: new THREE.MeshStandardMaterial({color:0x12131c,roughness:0.6,metalness:0.4})
  };
}

/* ---------- knife build ---------- */
function bladeShape(){ const s=new THREE.Shape();
  s.moveTo(-3.4,-0.78); s.lineTo(-0.2,-1.0); s.lineTo(0.35,-1.02); s.lineTo(0.55,-1.58); s.lineTo(1.62,-1.5); s.lineTo(2.05,-1.0); s.lineTo(6.6,-1.05); s.lineTo(7.95,-0.78); s.lineTo(9.6,0.78); s.lineTo(0.2,0.95); s.lineTo(-3.4,0.8); s.closePath(); return s; }
function handleShape(){ const s=new THREE.Shape();
  s.moveTo(-0.72,1.02); s.lineTo(-7.15,0.98); s.quadraticCurveTo(-8.35,0.86,-8.35,0); s.quadraticCurveTo(-8.35,-0.86,-7.15,-1.02); s.lineTo(-0.72,-1.0); s.closePath(); return s; }

let knife, parts={}, knifeMats;
function buildKnife(){
  knifeMats = mats();
  if(knife){ scene.remove(knife); knife.traverse(o=>{ if(o.geometry) o.geometry.dispose(); }); }
  knife = new THREE.Group(); parts={};
  /* blade */
  const bladeGeo = new THREE.ExtrudeGeometry(bladeShape(),{depth:0.42,bevelEnabled:true,bevelThickness:0.13,bevelSize:0.11,bevelSegments:2,curveSegments:6});
  bladeGeo.translate(0,0,-0.21);
  const blade = new THREE.Mesh(bladeGeo, knifeMats.blade); blade.castShadow=blade.receiveShadow=true; blade.userData.label='Tanto blade'; knife.add(blade); parts.blade=blade;
  /* grind line */
  const grind = new THREE.Mesh(new THREE.PlaneGeometry(6.4,0.14), new THREE.MeshStandardMaterial({color:0x8a8f99,roughness:0.3,metalness:1}));
  grind.position.set(2.1,-1.02,0.315); grind.rotation.x=-0.03; knife.add(grind);
  /* emblem decal */
  const emb = new THREE.Mesh(new THREE.PlaneGeometry(4.3,2.6), new THREE.MeshBasicMaterial({map:emblemTex(cw.emblem),transparent:true,toneMapped:false,opacity:0.96}));
  emb.position.set(4.0,0.02,0.365); knife.add(emb); 
  /* handles */
  const hGeo = new THREE.ExtrudeGeometry(handleShape(),{depth:0.86,bevelEnabled:true,bevelThickness:0.14,bevelSize:0.13,bevelSegments:3,curveSegments:10});
  hGeo.translate(0,0,-0.43);
  const h2Geo = hGeo.clone();
  function makeHandle(isBite){
    const g = new THREE.Group(); g.position.set(-0.45,0, isBite?0.62:-0.62);
    const body = new THREE.Mesh(isBite?hGeo:h2Geo, knifeMats.ceramic); body.castShadow=body.receiveShadow=true; body.userData.label = isBite?'Bite handle (ceramic)':'Safe handle (ceramic)';
    g.add(body);
    const chanLen = 5.4;
    const chan = new THREE.Mesh(new THREE.CapsuleGeometry(0.34,chanLen,6,12), knifeMats.dark);
    chan.rotation.z=Math.PI/2; chan.position.set(-4.4,0.02, isBite?0.42:-0.42); chan.userData.label=isBite?'Bite channel':'Safe channel'; g.add(chan);
    const cap = new THREE.Mesh(new THREE.BoxGeometry(0.5,1.9,1.1), knifeMats.rose); cap.position.set(-7.85,0,0); cap.castShadow=true; cap.userData.label='Rose-gold pommel cap'; g.add(cap);
    const liner = new THREE.Mesh(new THREE.BoxGeometry(6.0,0.1,0.24), knifeMats.rose); liner.position.set(-4.1,0.92, isBite?0.5:-0.5); g.add(liner);
    knife.add(g); return g;
  }
  parts.bite = makeHandle(true); parts.safe = makeHandle(false);
  /* pivot hardware */
  function hardware(isBite){ const g = new THREE.Group();
    const zc = isBite?0.62:-0.62; const side = isBite?1:-1;
    const w1 = new THREE.Mesh(new THREE.CylinderGeometry(0.46,0.46,0.1,24), knifeMats.rose); w1.rotation.x=Math.PI/2; w1.position.set(0,0,zc+side*0.52); w1.userData.label='Washer';
    const w2 = w1.clone(); w2.position.z = zc-side*0.52; w2.userData.label='Washer';
    const screw = new THREE.Mesh(new THREE.CylinderGeometry(0.26,0.26,0.16,20), knifeMats.rose); screw.rotation.x=Math.PI/2; screw.position.set(0,0,zc+side*0.66); screw.userData.label='Pivot screw';
    const bush = new THREE.Mesh(new THREE.CylinderGeometry(0.2,0.2,0.9,16), knifeMats.dark); bush.rotation.x=Math.PI/2; bush.position.set(0,0,zc);
    g.add(w1,w2,screw,bush); g.position.set(-0.45,0,0); knife.add(g); return g;
  }
  parts.biteHW = hardware(true); parts.safeHW = hardware(false);
  /* zen pins */
  parts.zen = new THREE.Group();
  for(const y of [0.86]){ const pin = new THREE.Mesh(new THREE.CylinderGeometry(0.14,0.14,2.05,12), knifeMats.rose); pin.rotation.x=Math.PI/2; pin.position.set(-0.45,y,0); pin.userData.label='Zen pin · stops open / closed'; parts.zen.add(pin); }
  knife.add(parts.zen);

      if(u<1||move.stepIdx<m.steps.length){}
      if(!move.heldPoint){ move.heldPoint = new THREE.Vector3(-3.2,0,0.62); move.anchorWorld=state.pos.clone().add(state.quat.clone().invert?new THREE.Vector3():new THREE.Vector3());
        move.anchorWorld = state.pos.clone(); /* fallback set below */ }
      state.pos.copy(move.anchorWorld).add( state.quat.clone().invert().multiplyScalar(0) );
      /* held anchor: pos = anchorWorld - quat * heldPoint */
      if(!move.anchorCaptured){
        /* capture anchor properly now */
        const heldLocal=new THREE.Vector3(-3.2,0,0.62);
        const world = heldLocal.clone().applyQuaternion(state.quat).add(state.pos);
        move.anchorWorld = world; move.anchorCaptured=true; move.heldPoint=heldLocal;
        state.pos.copy(world).sub(heldLocal.clone().applyQuaternion(state.quat));
      }
      const heldWorld = move.heldPoint.clone().applyQuaternion(state.quat);
      state.pos.copy(move.anchorWorld).sub(heldWorld).add(state.offset);
      if(u>=1){
        move.stepIdx++;
        if(move.stepIdx>=m.steps.length){
          if(move.combo||move.freestyle){ move.holdT=0.28; }
          else { move.holdT=m.endHold||0.4; move.from=currentPose(); }
          /* hold */
        } else { loadStepNext(m); }
      }
    }
  }
  /* apply */
  if(!draggingHandles && !move.running && !state.heldOn){}
  if(!draggingHandles) applyPose();
  /* clack detection */
  {
    const bVel=(state.bite-(move._pb??state.bite))/Math.max(rawDt,0.001), sVel=(state.safe-(move._ps??state.safe))/Math.max(rawDt,0.001);
    move._pb=state.bite; move._ps=state.safe; currentAngleVel.bite=bVel; currentAngleVel.safe=sVel;
    const pins={'bite':[-0.06,0.55],'safe':[0.10,0.80]};
    for(const n of ['bite','safe']){ const ang=n==='bite'?state.bite:state.safe; const vel=n==='bite'?bVel:sVel;
      for(const pin of pins[n]){ if(Math.abs(ang-pin)<0.05 && Math.abs(vel)>1.4){ clack(Math.abs(vel)); break; } } }
    const lVel=Math.abs(state.latch-(move._pl??state.latch))/Math.max(rawDt,0.001); move._pl=state.latch;
    if(Math.abs(state.latch-1)<0.09&&lVel>0.6){ latchClick(true); } else if(state.latch<0.1&&lVel>0.6){ latchClick(false); }
    /* ring */
    if(m&&Math.abs(currentAngleVel.bite)>6 && !move.ringFired){ ring(Math.min(1,Math.abs(currentAngleVel.bite)/9)); move.ringFired=true; }
    if(Math.abs(currentAngleVel.bite)<2) move.ringFired=false;
    setWhoosh(Math.abs(bVel)+Math.abs(sVel));
    if((Math.abs(bVel)>1.2||Math.abs(sVel)>1.2)&&Math.random()<0.12) rattleTick(Math.abs(bVel)+Math.abs(sVel));
  }
  /* camera ease */
  controls.update();
  /* explode lerp */
  const ex=explodeT; explodeT += (explodeTarget-explodeT)*Math.min(1,rawDt*5); applyExplode(explodeT);
  /* trail */
  if(trailOn|| (move.running&&move.move&&MOVE_KEYS.includes(move.move.lastKey||'')&&move.move.name==='ECLIPSE SPIN')){
    const tipLocal = new THREE.Vector3(9.6,0.6,0); tipHistory.unshift(knife.localToWorld(tipLocal.clone())); if(tipHistory.length>TRAIL_N) tipHistory.pop();
  } else { if(tipHistory.length){ tipHistory.shift(); if(tipHistory.length===0) trailVisible=false; } }
  updateTrail();
  /* idle spin + bob */
  if(!move.running&&!draggingHandles&&!reveal.active&&!camTween){ idleYaw += rawDt*0.28; state.quat.slerp(showcaseQuat(idleYaw),Math.min(1,rawDt*3)); state.pos.y += (SHOWCASE_POS.y + Math.sin(clock.elapsedTime*0.8)*0.035 - state.pos.y)*Math.min(1,rawDt*4); }
  /* stage */
  orbits[0].rotation.z += rawDt*0.12; orbits[1].rotation.z -= rawDt*0.08; comet.position.x += Math.sin(clock.elapsedTime*0.07)*0.0015; comet.rotation.z += rawDt*0.05;
  /* render */
  renderer.render(scene,camera);
  requestAnimationFrame(tick);
}

function finishMove(){ move.running=false; move.heldPoint=null; move.anchorCaptured=false; trail.visible=trailOn; if(!trailOn){ tipHistory.length=0; updateTrail(); } }
function startReturnToShowcase(){
  /* simple return step: animate quat/pos/angles to showcase */
  move.running=true; move.combo=false; move.freestyle=false; move.move={name:'SHOWCASE', steps:[{d:0.85, pose:ep(null,[-Math.PI/2,idleYaw,0],-0.06,0.10,0)}], endHold:0, return:true};
  move.from=currentPose(); move.stepIdx=0; move.stepT=0; move.overridePos=true;
}

function applyPose(){
  knife.position.copy(state.pos);
  knife.quaternion.copy(state.quat);
  parts.bite.rotation.z=state.bite; parts.safe.rotation.z=state.safe;
  parts.latch.rotation.z=state.latch*1.95;
}

function updateTrail(){
  if(!trailOn&&!(move.running&&move.move&&move.move.name==='ECLIPSE SPIN')){ trail.visible=false; return; }
  if(tipHistory.length<2){ trail.visible=false; return; }
  trail.visible=true;
  const camDir = new THREE.Vector3(); camera.getWorldDirection(camDir);
  for(let i=0;i<TRAIL_N;i++){
    const p = tipHistory[Math.min(i,tipHistory.length-1)];
    const q = tipHistory[Math.min(i+1,tipHistory.length-1)];
    const tangent = q.clone().sub(p).normalize(); if(tangent.lengthSq()<0.01) tangent.set(1,0,0);
    let normal = new THREE.Vector3().crossVectors(tangent,camDir); if(normal.lengthSq()<0.01) normal.set(0,1,0); normal.normalize();
    const w = 0.16*(1-i/TRAIL_N);
    const o = normal.multiplyScalar(w);
    const j=0.4*(1-i/TRAIL_N)*(1-i/TRAIL_N);
    trailPos[i*6+0]=p.x+o.x; trailPos[i*6+1]=p.y+o.y; trailPos[i*6+2]=p.z+o.z;
    trailPos[i*6+3]=p.x-o.x; trailPos[i*6+4]=p.y-o.y; trailPos[i*6+5]=p.z-o.z;
    trailCol[i*6+0]=0.62*j; trailCol[i*6+1]=0.85*j; trailCol[i*6+2]=1.0*j;
    trailCol[i*6+3]=0.62*j; trailCol[i*6+4]=0.85*j; trailCol[i*6+5]=1.0*j;
  }
  trailGeo.attributes.position.needsUpdate=true; trailGeo.attributes.color.needsUpdate=true;
}
/* ---------- reveal ---------- */
const reveal = {active:true,t:0,lis:false};
let revealT=0;
function updateReveal(raw){
  if(!reveal.active) return;
  revealT+=raw;
  const u=revealT;
  spot.intensity = Math.min(140, u*70);
  key.intensity = Math.min(1.5, u*0.8);
  if(u>0.55&&!reveal.lis){ reveal.lis=true; tweenCamera(camPresets.HERO,2.2); document.body.classList.add('revealing'); }
  if(u>1.35&&!reveal.opened){ reveal.opened=true; startMoveFromReveal(); }
  if(u>2.35&&!reveal.named){ reveal.named=true; document.getElementById('reveal-name').classList.add('on'); }
  if(u>4.6){ reveal.active=false; document.getElementById('reveal-name').classList.add('on'); }
}
function startMoveFromReveal(){ // open knife during reveal
  const m=MOVES.OPEN; move.running=true; move.move=m; move.combo=false; move.freestyle=false; move.comboIndex=0; move.stepIdx=0; move.stepT=0; move.from=currentPose(); move.holdT=0.7; move.ringFired=false; move.heldPoint=new THREE.Vector3(-3.2,0,0.62); move.anchorWorld=knife.localToWorld(new THREE.Vector3(-3.2,0,0.62)); move.anchorCaptured=true; }

/* ---------- loop plumbing & UI finish ---------- */
const speedSlider=document.getElementById('speed'); const speedVal=document.getElementById('speedVal');
speedSlider.addEventListener('input',()=>{ speedFactor=parseFloat(speedSlider.value); speedVal.textContent=speedFactor.toFixed(2)+'×'; });
document.getElementById('slowBtn').onclick=function(){ slowMo=!slowMo; this.classList.toggle('active',slowMo); };
document.getElementById('trailBtn').onclick=function(){ trailOn=!trailOn; this.classList.toggle('active',trailOn); trail.visible=trailOn; if(!trailOn){ tipHistory.length=0; trail.visible=false; } };
document.getElementById('muteBtn').onclick=function(){ muted=!muted; this.textContent=muted?'Muted':'Sound On'; if(master) master.gain.value=muted?0:vol; };
document.getElementById('vol').addEventListener('input',e=>{ vol=parseFloat(e.target.value); if(master) master.gain.value=muted?0:vol; });
document.addEventListener('pointerdown',()=>initAudio(),{once:false});
document.getElementById('hideBtn').onclick=function(){ const ui=document.getElementById('ui'); ui.classList.toggle('hidden'); this.textContent=ui.classList.contains('hidden')?'SHOW UI':'HIDE UI'; };
window.addEventListener('resize',()=>{ camera.aspect=innerWidth/innerHeight; camera.updateProjectionMatrix(); renderer.setSize(innerWidth,innerHeight); });

/* finish move → showcase */
const origFinish = finishMove;
finishMove = function(){ move.running=false; move.heldPoint=null; move.anchorCaptured=false; trail.visible=trailOn; if(!trailOn){ tipHistory.length=0; updateTrail(); } startReturnToShowcaseSafe(); };
function startReturnToShowcaseSafe(){ setTimeout(()=>{ if(!move.running) startReturnToShowcase(); }, 50); }
move.running=false;

/* hide banner */
setTimeout(()=>{ const b=document.getElementById('banner'); b.style.opacity='0'; setTimeout(()=>b.remove(),700); }, 650);

tick();
</script>
