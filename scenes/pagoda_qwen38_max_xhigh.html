<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>

<title>Voxel Garden — Spring Festival at the Five-Story Pagoda</title>
<style>
  :root{ --verm:#C73E1D; --gold:#E8B86D; --ink:#0d1322; }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#0a0e18; }
  body{ font-family:"Avenir Next","Segoe UI","Helvetica Neue",Arial,sans-serif; -webkit-font-smoothing:antialiased; }
  canvas{ display:block; }
  #vignette{ position:fixed; inset:0; pointer-events:none; z-index:2;
    background:radial-gradient(ellipse at 50% 42%, transparent 52%, rgba(5,8,16,.38) 100%); }
  .panel{ position:fixed; z-index:5; color:#f2ead8; user-select:none; }
  #hud{ top:18px; left:18px; display:flex; gap:14px; align-items:flex-start;
    background:linear-gradient(165deg, rgba(16,22,40,.85), rgba(9,12,24,.78));
    border:1px solid rgba(232,184,109,.30); border-left:3px solid var(--verm);
    padding:14px 20px 14px 14px; border-radius:3px;
    box-shadow:0 10px 40px rgba(0,0,0,.45); backdrop-filter:blur(8px); }
  #sunDisc{ width:30px; height:30px; margin-top:5px; border-radius:50%;
    background:radial-gradient(circle at 38% 34%, #ff8a5c, var(--verm) 68%);
    box-shadow:0 0 18px rgba(199,62,29,.55); flex:none; }
  #hud h1{ font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",Georgia,serif;
    font-weight:600; font-size:23px; letter-spacing:.42em; color:#f6ead2; line-height:1.05; }
  #hud .jp{ font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    font-size:10.5px; letter-spacing:.34em; color:var(--gold); margin-top:5px; opacity:.92; }
  #stats{ font-size:12.5px; letter-spacing:.08em; color:rgba(238,228,206,.92); margin-top:9px; }
  #stats b{ color:var(--gold); font-weight:600; }
  #hint{ font-size:10.5px; letter-spacing:.10em; color:rgba(238,228,206,.55); margin-top:4px; }
  #seal{ align-self:flex-start; margin-left:6px; background:var(--verm); color:#ffe9d8;
    font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif;
    writing-mode:vertical-rl; font-size:15px; letter-spacing:.18em;
    padding:9px 5px; border-radius:2px; transform:rotate(2deg);
    box-shadow:inset 0 0 0 1px rgba(255,235,210,.35), 0 3px 10px rgba(0,0,0,.4); }
  #clockbar{ left:50%; bottom:20px; transform:translateX(-50%);
    display:flex; align-items:center; gap:13px;
    background:linear-gradient(165deg, rgba(16,22,40,.85), rgba(9,12,24,.78));
    border:1px solid rgba(232,184,109,.28); padding:11px 18px; border-radius:3px;
    box-shadow:0 10px 40px rgba(0,0,0,.45); backdrop-filter:blur(8px); }
  #tIcon{ width:18px; height:18px; border-radius:50%; flex:none; transition:box-shadow .5s, background .5s; }
  input[type=range]{ -webkit-appearance:none; appearance:none; width:min(320px,36vw); height:4px; border-radius:2px;
    background:linear-gradient(90deg,#141b3a 0%,#e8945a 26%,#ffe9b8 50%,#e08a52 74%,#141b3a 100%); outline:none; cursor:pointer; }
  input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%;
    background:var(--verm); border:2px solid var(--gold); box-shadow:0 0 10px rgba(199,62,29,.7); cursor:pointer; }
  input[type=range]::-moz-range-thumb{ width:14px; height:14px; border-radius:50%;
    background:var(--verm); border:2px solid var(--gold); box-shadow:0 0 10px rgba(199,62,29,.7); cursor:pointer; }
  #tLabel{ font-size:12px; letter-spacing:.14em; color:var(--gold); min-width:104px; font-variant-numeric:tabular-nums; }
  #pauseBtn{ font:inherit; font-size:11.5px; letter-spacing:.14em; color:#f2ead8; background:transparent;
    border:1px solid rgba(232,184,109,.55); border-radius:2px; padding:6px 13px; cursor:pointer; transition:background .2s,color .2s; }
  #pauseBtn:hover{ background:var(--gold); color:var(--ink); }
  #fade{ position:fixed; inset:0; z-index:9; background:#0a0e18; display:flex; align-items:center; justify-content:center;
    transition:opacity 1.1s ease; pointer-events:none; }
  #fade span{ font-family:"Hiragino Mincho ProN","Yu Mincho","Noto Serif JP",serif; color:var(--gold);
    letter-spacing:.6em; font-size:15px; opacity:.85; }
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}

<body>
<div id="vignette"></div>
<div id="hud" class="panel">
  <div id="sunDisc"></div>
  <div>
    <h1>VOXEL GARDEN</h1>
    <div class="jp">春祭 ─ 五重の塔</div>
    <div id="stats"><b id="vox">…</b> voxels&nbsp;·&nbsp;<b id="fpsEl">…</b> FPS</div>
    <div id="hint">Click lanterns · Click pagoda floors to open doors</div>
  </div>
  <div id="seal">五重塔</div>
</div>
<div id="clockbar" class="panel">
  <div id="tIcon"></div>
  <input id="tSlider" type="range" min="0" max="1" step="0.0005" value="0.29"/>
  <div id="tLabel">— Spring Day —</div>
  <button id="pauseBtn">PAUSE</button>
</div>
<div id="fade"><span>五 重 塔</span></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================== RENDERER ============================== */
const V = 0.5; // voxel size
const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbfe3ef, 0.005);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.5, 600);
camera.position.set(18.5, 13, 24.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 10.5, 0);
controls.enableDamping = true; controls.dampingFactor = 0.06;
controls.enablePan = false;
controls.minDistance = 8; controls.maxDistance = 85;
controls.maxPolarAngle = Math.PI * 0.62;
controls.autoRotateSpeed = 0.45;
controls.update();

/* ============================== MATERIALS ============================== */
const P = {
  VERM:0xC73E1D, VERM_D:0x8E2911, GOLD:0xE8B86D, TEAK:0x4A2C1A,
  JADE:0x2D6A4F, JADE_L:0x40916C, SAK1:0xFFB7C5, SAK2:0xFF8FAB, SAK3:0xFFFFE===0?0:0xFFE5EC,
  STONE:0x9AA0A6, STONE_D:0x787E86, STONE_L:0xB9BEC4, POND:0x7ED6DF, MOSS:0x606C38,
  GRASS:0x6E8B3D, PINE:0x1E5B3F, MAPLE1:0xD95D39, MAPLE2:0xE8945A, WILLOW:0x87A96B,
  BAMBOO:0x9DBF6E, TRUNK:0x6B4A32, PLASTER:0xF1E8D8, PAPER:0xFFDFA8, INK:0x23272E,
  KOI_O:0xFF7F50, KOI_W:0xF4F1EA
};
function std(c, r=0.92, m=0.04){ return new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m }); }
const MATS = {};
for (const k in P) MATS[k] = std(P[k]);
MATS.GOLD.metalness = 0.68; MATS.GOLD.roughness = 0.32;
MATS.POND = new THREE.MeshStandardMaterial({ color:P.POND, roughness:0.15, metalness:0.05, transparent:true, opacity:0.78 });
MATS.WATERFALL = new THREE.MeshStandardMaterial({ color:0xBDEFF5, roughness:0.3, transparent:true, opacity:0.85 });
MATS.PAPER.emissive = new THREE.Color(0xFFB25E); MATS.PAPER.emissiveIntensity = 0.15;
const PETAL_MAT = new THREE.MeshStandardMaterial({ color:0xffffff, roughness:0.85, side:THREE.DoubleSide });

/* ============================== VOXEL BANK ============================== */
const VQ = new THREE.Vector3(), VS = new THREE.Vector3(), VZ = new THREE.Quaternion();
const bank = {}; let totalVoxels = 0;
function bankOf(mat){ return bank[mat] || (bank[mat] = []); }
function add(mat, x, y, z, sx=1, sy=1, sz=1, ry=0, ao=1){
  bankOf(mat).push(x, y, z, sx, sy, sz, ry, ao); totalVoxels++;
}
function addBox(mat, x0,y0,z0, x1,y1,z1, jitter=0, aoBase=1){
  for (let x=x0; x<=x1; x++) for (let y=y0; y<=y1; y++) for (let z=z0; z<=z1; z++){
    add(mat, x, y, z, 1,1,1, 0, aoBase*(1 - jitter*Math.random()));
  }
}
function pick(a){ return a[(Math.random()*a.length)|0]; }
function sr(seed){ let s=seed; return ()=>{ s=(s*16807)%2147483647; return s/2147483647; }; }
const R1 = sr(11), R2 = sr(77), R3 = sr(4242);

/* ============================== ISLAND SHAPE ============================== */
function smoothmin(a,b,k){ const h=Math.max(0, k-Math.abs(a-b))/k; return Math.min(a,b)-h*h*k*0.25; }
function islandR(th){
  return 25.5 + 2.2*Math.sin(3*th+1.7) + 1.6*Math.sin(7*th+0.4) + 0.9*Math.sin(11*th+2.2);
}
function insideIsland(x,z,pad=0){
  const th = Math.atan2(z,x), r = Math.hypot(x,z);
  return r < islandR(th) - pad;
}
function groundH(x,z){
  const d = Math.hypot(x,z);
  let h = 1.4 + 1.1*Math.sin(x*0.082+1.0)*Math.sin(z*0.075+2.0) + 0.5*Math.sin(x*0.16+z*0.13);
  h += THREE.MathUtils.smoothstep(d, 24, 31) * 1.7;            // gentle rim
  h -= 3.3 * Math.exp(-(((x-12)**2)/34 + ((z-9)**2)/28));     // pond basin
  h += 2.4 * Math.exp(-((x*x+z*z)/170));                       // pagoda mound
  return h;
}
function gtop(x,z){ return Math.max(0, Math.round(groundH(x,z)/V)); }

/* ============================== TERRAIN ============================== */
{
  for (let x=-32; x<32; x++) for (let z=-32; z<32; z++){
    const wx = x*V, wz = z*V;
    if (!insideIsland(wx+V*0.35, wz+V*0.35, 0.2)) continue;
    const j = gtop(x,z);
    const near = gtop(x+1,z)+gtop(x-1,z)+gtop(x,z+1)+gtop(x,z-1);
    const topMat = (j*4 < near-1) ? MATS.STONE_D : (R1()<0.14 ? MATS.MOSS : MATS.GRASS);
    add(topMat, x, j, z, 1,1,1, 0, 0.93+R1()*0.07);
    if (j>=1) add(MATS.STONE_D, x, j-1, z, 1,1,1, 0, 0.72+R1()*0.1);
    if (j>=3 && R1()<0.3) add(MATS.STONE_D, x, j-2, z, 1,1,1, 0, 0.55);
  }
  // rugged inverted-cone underside
  for (let L=0; L<30; L++){
    const f = L/29;
    const shrink = 1.0 - 0.66*Math.pow(f,0.82) - 0.3*Math.pow(f,3.2);
    const jY = Math.round((1 - 1.25 - L*0.96)/V);
    for (let i=0; i<150; i++){
      const th = (i/150)*Math.PI*2 + f*0.35;
      const jit = 0.92 + 0.16*Math.sin(th*5+L*0.8) + (R2()-0.5)*0.12;
      const r = islandR(th)*shrink*jit - 0.4;
      if (r<0.4) continue;
      const x = Math.round(Math.cos(th)*r/V), z = Math.round(Math.sin(th)*r/V);
      if (L>6 || R2()<0.45) add(MATS.STONE_D, x, jY, z, 1,1,1, 0, 0.5+0.3*(1-f)+R2()*0.15);
      else add(MATS.GRASS, x, jY, z, 1,1,1, 0, 0.55);
    }
  }
}

/* ============================== PATH ============================== */
const pathPts = [];
{
  const ctrl = [[0,27],[4,23],[-3,18],[5,13],[3.5,9.6],[0.6,8.2],[0,4.6]];
  for (let s=0; s<ctrl.length-1; s++){
    const [ax,az]=ctrl[s], [bx,bz]=ctrl[s+1], steps=26;
    for (let i=0;i<steps;i++){ const u=i/steps; pathPts.push([ax+(bx-ax)*u, az+(bz-az)*u]); }
  }
  for (const [px,pz] of pathPts){
    const j = gtop(Math.round(px/V), Math.round(pz/V));
    const ix = Math.round(px/V), iz = Math.round(pz/V);
    addBox(MATS.STONE, ix-1, j, iz, ix+1, j, iz+1);
    if (R3()<0.25) add(MATS.MOSS, ix+(R3()<0.5?1:-1), j, iz+(R3()<0.5?1:-1));
  }
}

/* ============================== POND ============================== */
{
  const cx=12, cz=9, rx=4.4, rz=3.6;
  for (let x=-32;x<32;x++) for (let z=-32;z<32;z++){
    const wx=x*V, wz=z*V;
    if (((wx-cx)/rx)**2 + ((wz-cz)/rz)**2 > 1.02) continue;
    const j = gtop(x,z);
    addBox(MATS.STONE_D, x, j-2, z, x, j-1, z); // basin floor
  }
}
const waterList = [];
{
  const cx=12, cz=9, rx=4.2, rz=3.4;
  const jw = Math.round(0.35/V);
  for (let x=-32;x<32;x++) for (let z=-32;z<32;z++){
    const wx=x*V, wz=z*V;
    if (((wx-cx)/rx)**2 + ((wz-cz)/rz)**2 > 1) continue;
    add(P.MOND||MATS.POND===undefined?MATS.POND:MATS.POND, 0,0,0) && 0; // no-op guard
    bankOf(MATS.POND).push(x, jw, z, 1, 0.7, 1, 0, 1); totalVoxels++;
    waterList.push(bankOf(MATS.POND).length - 8);
  }
}
const WATER_Y = Math.round(0.35/V);

/* ============================== BRIDGE (arched, vermillion) ============================== */
{
  const xs = 4.1;
  for (let k=0;k<=14;k++){
    const u = k/14, z = 11.9 - 3.8*u;
    const y = 1.15 + 1.5*Math.sin(Math.PI*u);
    const jx = Math.round(xs/V), jz = Math.round(z/V), jy = Math.round(y/V);
    addBox(MATS.TEAK, jx-2, jy, jz, jx+2, jy, jz);
    if (k%2===0){
      addBox(MATS.VERM, jx-2, jy+1, jz, jx-2, jy+2, jz);
      addBox(MATS.VERM, jx+2, jy+1, jz, jx+2, jy+2, jz);
      if (k%4===0){ add(MATS.GOLD, jx-2, jy+3, jz); add(MATS.GOLD, jx+2, jy+3, jz); }
    }
    if (k>0 && k<14 && k%2===1){
      addBox(MATS.VERM, jx-2, jy+3, jz, jx-2, jy+3, jz);
      addBox(MATS.VERM, jx+2, jy+3, jz, jx+2, jy+3, jz);
    }
  }
}

/* ============================== TORII ============================== */
{
  const x=-1, z=28.2, j = gtop(Math.round(x/V), Math.round(z/V));
  const ix = Math.round(x/V), iz = Math.round(z/V);
  addBox(MATS.STONE_D, ix-7, j+1, iz-1, ix-6, j+1, iz+1);
  addBox(MATS.STONE_D, ix+6, j+1, iz-1, ix+7, j+1, iz+1);
  addBox(MATS.VERM, ix-7, j+2, iz, ix-7, j+15, iz);
  addBox(MATS.VERM, ix+7, j+2, iz, ix+7, j+15, iz);
  addBox(MATS.VERM_D, ix-7, j+15, iz, ix-7, j+15, iz);
  addBox(MATS.VERM_D, ix+7, j+15, iz, ix+7, j+15, iz);
  addBox(MATS.VERM, ix-10, j+17, iz, ix+10, j+18, iz);   // kasagi
  addBox(MATS.GOLD,  ix-10, j+16, iz, ix+10, j+16, iz);   // gold underline
  addBox(MATS.VERM, ix-8, j+12, iz, ix+8, j+12, iz);      // nuki
  addBox(MATS.VERM, ix, j+13, iz, ix, j+15, iz);          // gakuzuka
  add(MATS.GOLD, ix, j+19, iz);
}

/* ============================== BAMBOO FENCE ============================== */
function fenceRun(x0,z0,x1,z1){
  const n = Math.max(1, Math.round(Math.hypot(x1-x0,z1-z0)/0.8));
  const ang = Math.atan2(x1-x0, z1-z0);
  for (let i=0;i<=n;i++){
    const u=i/n, x=x0+(x1-x0)*u, z=z0+(z1-z0)*u;
    const ix=Math.round(x/V), iz=Math.round(z/V);
    const j=gtop(ix,iz);
    add(MATS.BAMBOO, ix, j+1, iz, 0.5, 2.6, 0.5, ang, 0.95);
    if (i%4===0 && i>0) add(MATS.TEAK, ix, j+3, iz, 0.7,0.7,0.7, 0, 0.9);
  }
  const mx=(x0+x1)/2, mz=(z0+z1)/2;
  for (const hy of [1.9, 3.1]){
    const len=Math.hypot(x1-x0,z1-z0)/V;
    const j=Math.round((groundH(mx,mz))/V)+Math.round(hy/V);
    add(MATS.BAMBOO, Math.round(mx/V), j, Math.round(mz/V), len, 0.35, 0.35, ang, 0.95);
  }
}
fenceRun(-3.4,26.4, 2.6,24.2); fenceRun(3.4,26.4, -2.2,23.6);
fenceRun(-4.6,16.8, 1.2,13.4); fenceRun(6.4,15.2, 7.4,10.8);

/* ============================== LANTERNS (4, clickable) ============================== */
const lanterns = [];
const lanternPos = [[2.9,24.6],[-4.7,19.6],[5.8,10.2],[-3.6,5.6]];
const flameBank = [];
for (let li=0; li<4; li++){
  const [lx,lz] = lanternPos[li];
  const ix=Math.round(lx/V), iz=Math.round(lz/V);
  const j = gtop(ix,iz);
  addBox(MATS.STONE_D, ix-1, j+1, iz-1, ix+1, j+1, iz+1);
  add(MATS.STONE, ix, j+2, iz);
  addBox(MATS.STONE, ix-1, j+3, iz-1, ix+1, j+3, iz+1);
  // flame box (emissive paper)
  const fb = bankOf(MATS.PAPER);
  for (let dx=0;dx<=0;dx++) for (let dy=4;dy<=5;dy++) for (let dz=0;dz<=0;dz++){
    fb.push(ix, j+dy, iz, 0.8,1,0.8, 0, 1); totalVoxels++;
  }
  flameBank.push({ matRef:MATS.PAPER, startIdx:fb.length-8 });
  addBox(MATS.STONE_D, ix-1, j+6, iz-1, ix+1, j+6, iz+1);
  add(MATS.STONE, ix, j+7, iz);
  add(MATS.GOLD, ix, j+8, iz, 0.6,0.6,0.6);
  const pl = new THREE.PointLight(0xFFA552, 0, 10, 2);
  pl.position.set(lx, j*V + 2.4, lz);
  scene.add(pl);
  const pick = new THREE.Mesh(new THREE.BoxGeometry(1.7, 3.6, 1.7),
    new THREE.MeshBasicMaterial({ colorWrite:false, depthWrite:false }));
  pick.position.set(lx, j*V + 1.8, lz); pick.userData.lantern = li; scene.add(pick);
  lanterns.push({ light:pl, userOn:null, pick, phase:Math.random()*10 });
}
const interiorLight = new THREE.PointLight(0xFFB066, 0, 22, 2);
interiorLight.position.set(0, 6, 0); scene.add(interiorLight);

/* ============================== JIZO ×2 ============================== */
function jizo(x,z,ry){
  const ix=Math.round(x/V), iz=Math.round(z/V), j=gtop(ix,iz);
  addBox(MATS.STONE_D, ix-1, j+1, iz-1, ix+1, j+1, iz+1);
  const g = new THREE.Group(); g.position.set(x, (j+2)*V, z); g.rotation.y = ry;
  const parts = [
    [MATS.STONE, 0,0.25,0, 0.55,0.5,0.45],
    [MATS.STONE, 0,0.85,0, 0.42,0.72,0.4],
    [MATS.STONE, 0,1.45,0, 0.4,0.4,0.4],
    [MATS.VERM, 0,1.68,0, 0.5,0.18,0.5],
    [MATS.VERM, 0,1.05,0.18, 0.5,0.2,0.18],
  ];
  for (const [m,px,py,pz,sx,sy,sz] of parts){
    const mesh = new THREE.Mesh(new THREE.BoxGeometry(sx,sy,sz), m);
    mesh.position.set(px,py,pz); mesh.castShadow = true; g.add(mesh);
  }
  scene.add(g);
}
jizo(-2.4, 6.4, 0.5); jizo(2.4, 6.4, -0.5);

/* ============================== FLOWERS ×40 ============================== */
{
  const colors = [MATS.SAK2, MATS.GOLD, MATS.SAK3, MATS.VERM];
  let placed = 0, guard = 0;
  while (placed < 40 && guard++ < 800){
    const th = R3()*Math.PI*2, r = 6 + R3()*17;
    const x = Math.cos(th)*r, z = Math.sin(th)*r;
    if (!insideIsland(x,z,2)) continue;
    if (Math.hypot(x,z) < 5) continue;
    if (Math.hypot(x-12,z-9) < 5.4) continue;
    if (Math.abs(x) < 2.4 && z > 3 && z < 29) continue;
    const ix=Math.round(x/V), iz=Math.round(z/V), j=gtop(ix,iz);
    add(MATS.JADE_L, ix, j+1, iz, 0.3,1,0.3);
    add(pick(colors), ix, j+2, iz, 0.65,0.5,0.65, R3()*3, 1);
    placed++;
  }
}

/* ============================== ROCKS ============================== */
function rockCluster(x,z,n){
  for (let i=0;i<n;i++){
    const rx=x+(R3()-0.5)*2, rz=z+(R3()-0.5)*2;

  }
}

const trees = [];
function makeTree(kind, x, z, scale=1, seed=1){
  const g = new THREE.Group();
  g.position.set(x, groundH(x,z), z);
  g.scale.setScalar(scale);
  const rnd = sr(seed*97+13);
  const trunkH = kind==='willow' ? 5.5 : (kind==='pine' ? 4 : 3.5);
  const trunk = new THREE.Mesh(new THREE.BoxGeometry(0.5, trunkH, 0.5),
    kind==='sakura' ? std(0x5A3A28,0.95) : MATS.TRUNK);
  trunk.position.y = trunkH/2; trunk.castShadow = true; g.add(trunk);
  const crown = new THREE.Group(); crown.position.y = trunkH; g.add(crown);
  function blob(mat, cx,cy,cz, r){
    const geo = new THREE.BoxGeometry(V,V,V);
    const count = Math.ceil(r*r*r*4.5);
    const im = new THREE.InstancedMesh(geo, mat, count);
    let n=0; const m = new THREE.Matrix4();
    for (let i=0;i<count*3 && n<count;i++){
      const px=(rnd()*2-1)*r, py=(rnd()*2-1)*r*0.8, pz=(rnd()*2-1)*r;
      if (px*px+py*py*1.4+pz*pz > r*r) continue;
      const s = 0.8+rnd()*0.5;
      m.compose(new THREE.Vector3(cx+px,cy+py,cz+pz), VZ, new THREE.Vector3(s,s,s));
      im.setMatrixAt(n++, m);
    }
    im.count = n; im.castShadow = true; crown.add(im);
    return im;
  }
  if (kind==='sakura'){
    blob(MATS.SAK1, 0, 1.0, 0, 2.6); blob(MATS.SAK2, 1.4, 0.5, 0.9, 1.7);
    blob(MATS.SAK3, -1.3, 0.7, -0.8, 1.8); blob(MATS.SAK1, 0.3, 2.0, -0.6, 1.5);
  } else if (kind==='pine'){
    const mats=[MATS.PINE, MATS.JADE];
    for (let i=0;i<4;i++){
      blob(mats[i%2], (rnd()-0.5)*1.2, 0.6+i*1.15, (rnd()-0.5)*1.2, 2.3-i*0.45);
    }
  } else if (kind==='maple'){
    blob(std(P.MAPLE1,0.9), 0, 1.0, 0, 2.4); blob(std(P.MAPLE2,0.9), 1.2, 0.4, 0.8, 1.6);
    blob(std(P.MAPLE1,0.9), -1.1, 1.6, -0.5, 1.5);
  } else { // willow
    blob(MATS.WILLOW, 0, 0.8, 0, 2.2);
    const strands = 14;
    for (let i=0;i<strands;i++){
      const a=(i/strands)*Math.PI*2, rr=1.6+rnd()*0.9;
      const sx=Math.cos(a)*rr, sz=Math.sin(a)*rr, len=3+rnd()*3;
      const geo=new THREE.BoxGeometry(0.28,0.55,0.28);
      const im=new THREE.InstancedMesh(geo, MATS.WILLOW, Math.ceil(len/0.5));
      const m=new THREE.Matrix4(); let n=0;
      for (let yy=0.4; yy>-len; yy-=0.5){
        const sway=( -yy/len )*0.5;
        m.setPosition(sx*(1+sway*0.4), 0.5+yy, sz*(1+sway*0.4));
        im.setMatrixAt(n++, m);
      }
      im.count=n; im.castShadow=true; crown.add(im);
    }
  }
  scene.add(g);
  trees.push({ node:g, crown, phase:rnd()*10, kind });
  return g;
}

const satellites = [];
function makeSatellite(size, x, y, z, seed, deco){
  const g = new THREE.Group(); g.position.set(x,y,z);
  const rnd = sr(seed);
  const tempBank = {};
  const tAdd = (mat,px,py,pz,ao)=>{ (tempBank[mat]||(tempBank[mat]=[])).push(px,py,pz,ao); };
  for (let ix=-size; ix<=size; ix++) for (let iz=-size; iz<=size; iz++){
    const px=ix*V, pz=iz*V, d=Math.hypot(px,pz);
    if (d > size*V*(0.9+0.15*Math.sin(Math.atan2(pz,px)*3+seed))) continue;
    tAdd(MATS.GRASS, px, 0, pz, 0.95);
    tAdd(MATS.STONE_D, px, -V, pz, 0.7);
    if (d < size*V*0.7) tAdd(MATS.STONE_D, px, -2*V, pz, 0.5);
  }
  for (let L=0; L<size*1.4; L++){
    const f=L/(size*1.4), r=size*V*(1-f)*(0.85+0.2*rnd());
    const jj=-3*V - L*0.85;
    for (let i=0;i<14;i++){
      const a=(i/14)*Math.PI*2+f;
      tAdd(MATS.STONE_D, Math.cos(a)*r, jj, Math.sin(a)*r, 0.45+0.2*(1-f));
    }
  }
  const geo = new THREE.BoxGeometry(V,V,V);
  for (const mat in tempBank){
    const arr = tempBank[mat]; const n = arr.length/4;
    const im = new THREE.InstancedMesh(geo, mat, n);
    const m = new THREE.Matrix4(); const col = new THREE.Color();
    for (let i=0;i<n;i++){
      m.setPosition(arr[i*4], arr[i*4+1], arr[i*4+2]);
      im.setMatrixAt(i, m);
      const a = arr[i*4+3]; col.setRGB(a,a,a); im.setColorAt(i, col);
    }
    im.castShadow = true; im.receiveShadow = true; g.add(im);
    totalVoxels += n;
  }
  if (deco==='sakura'){
    const t=new THREE.Mesh(new THREE.BoxGeometry(0.35,1.6,0.35), MATS.TRUNK);
    t.position.y=0.8+0.25; t.castShadow=true; g.add(t);
    const b=new THREE.Mesh(new THREE.BoxGeometry(1.9,1.4,1.9), MATS.SAK1);
    b.position.y=2.2; b.castShadow=true; g.add(b);
  } else if (deco==='lantern'){
    const s=new THREE.Mesh(new THREE.BoxGeometry(0.6,1.1,0.6), MATS.STONE);
    s.position.y=0.8; s.castShadow=true; g.add(s);
    const f=new THREE.Mesh(new THREE.BoxGeometry(0.5,0.5,0.5), MATS.PAPER);
    f.position.y=1.6; g.add(f);
  } else if (deco==='pine'){
    const t=new THREE.Mesh(new THREE.BoxGeometry(0.3,1.3,0.3), MATS.TRUNK);
    t.position.y=0.9; t.castShadow=true; g.add(t);
    const b=new THREE.Mesh(new THREE.BoxGeometry(1.6,1.0,1.6), MATS.PINE);
    b.position.y=1.9; b.castShadow=true; g.add(b);
  }
  scene.add(g);
  satellites.push({ node:g, baseY:y, phase:seed*1.7, speed:0.25+seed*0.07 });
}

    rx:1.3+rnd()*2.2, rz:1.1+rnd()*1.9, sp:(0.3+rnd()*0.35)*(rnd()<0.5?1:-1), ph:rnd()*10 };
}
for (let i=0;i<6;i++) kois.push(makeKoi(i%3!==2, i+2));

/* ============================== BIRDS ×5 ============================== */
const birds = [];
const birdMat = std(0x39404E, 0.8);
for (let i=0;i<5;i++){
  const g = new THREE.Group();
  const body = new THREE.Mesh(new THREE.BoxGeometry(0.28,0.24,0.7), birdMat); g.add(body);
  const head = new THREE.Mesh(new THREE.BoxGeometry(0.2,0.2,0.22), birdMat); head.position.set(0,0.06,0.42); g.add(head);
  const wl = new THREE.Group(); wl.position.set(0.14,0.05,0);
  const wlm = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.05,0.34), birdMat); wlm.position.x=0.45; wl.add(wlm); g.add(wl);
  const wr = new THREE.Group(); wr.position.set(-0.14,0.05,0);
  const wrm = new THREE.Mesh(new THREE.BoxGeometry(0.9,0.05,0.34), birdMat); wrm.position.x=-0.45; wr.add(wrm); g.add(wr);
  scene.add(g);
  birds.push({ node:g, wl, wr, R:20+i*4.5, h:21+i*2.6, sp:0.22+Math.random()*0.14,
    ph:Math.random()*10, flap:5+Math.random()*3 });
}

/* ============================== DAY / NIGHT ============================== */
const SKY_KEYS = [
  [0.00, 0x0B1026, 0x1B2440, 0x0D1226, 0x0B0E1A, 0.06],
  [0.07, 0x2B3A66, 0xE08A5A, 0x4A3A55, 0x3A2E33, 0.55],
  [0.13, 0x4A86C8, 0xFFC98A, 0x8A6A6A, 0x55453A, 1.05],
  [0.25, 0x2F6FB4, 0xBFE3EF, 0x9FB8C8, 0x5E6E52, 1.32],
  [0.50, 0x3579C0, 0xC8EAF4, 0xA2C0CE, 0x607052, 1.36],
  [0.62, 0x3A6FB0, 0xF2C98C, 0x9A8A80, 0x5A4E40, 1.15],
  [0.70, 0x3A4A7E, 0xF08A52, 0x6A4A60, 0x453434, 0.70],
  [0.78, 0x16204A, 0x3A3A66, 0x2A2A44, 0x1A1A2A, 0.12],
  [0.86, 0x0B1026, 0x1B2440, 0x0D1226, 0x0B0E1A, 0.06],
  [1.00, 0x0B1026, 0x1B2440, 0x0D1226, 0x0B0E1A, 0.06],
];
const _c1=new THREE.Color(), _c2=new THREE.Color();
function interpHex(keys, idx, t){
  let a=keys[0], b=keys[keys.length-1];
  for (let i=0;i<keys.length-1;i++) if (t>=keys[i][0] && t<=keys[i+1][0]){ a=keys[i]; b=keys[i+1]; break; }
  const u=(t-a[0])/Math.max(1e-5,(b[0]-a[0]));
  _c1.setHex(a[idx]); _c2.setHex(b[idx]);
  return _c1.lerp(_c2,u).getHex();
}
function interpNum(keys, idx, t){
  let a=keys[0], b=keys[keys.length-1];
  for (let i=0;i<keys.length-1;i++) if (t>=keys[i][0] && t<=keys[i+1][0]){ a=keys[i]; b=keys[i+1]; break; }
  const u=(t-a[0])/Math.max(1e-5,(b[0]-a[0]));
  return a[idx]+(b[idx]-a[idx])*u;
}
const sunDir = new THREE.Vector3();
function applyDaylight(t){
  const ang = t*Math.PI*2 - Math.PI/2;
  sunDir.set(Math.cos(ang)*0.94, Math.sin(ang), 0.34).normalize();
  const elev = sunDir.y;
  const day = THREE.MathUtils.clamp(elev*1.6+0.12, 0, 1);
  const dusk = Math.exp(-Math.pow((Math.abs(elev)-0.06)/0.09, 2));
  sun.position.copy(sunDir).multiplyScalar(90);
  sun.color.setHex(0xffe9c4).lerp(new THREE.Color(0xff8a4a), THREE.MathUtils.clamp(dusk*1.1+Math.max(0,0.3-elev), 0, 1));
  sun.intensity = THREE.MathUtils.clamp(Math.max(0,elev)*1.8, 0, 1.35);
  sunBall.position.copy(sunDir).multiplyScalar(235);
  sunBall.visible = elev > -0.12;
  moonBall.position.copy(sunBall.position).multiplyScalar(-1); moonBall.position.y = Math.abs(moonBall.position.y);
  moonBall.visible = elev < 0.1;
  const zen = interpHex(SKY_KEYS,1,t), hor = interpHex(SKY_KEYS,2,t);
  skyMat.uniforms.uZenith.value.setHex(zen);
  skyMat.uniforms.uHorizon.value.setHex(hor);
  _c1.setHex(hor).lerp(new THREE.Color(0xffa46a), dusk*0.5);
  scene.fog.color.copy(_c1);
  scene.fog.density = 0.0045 + (1-day)*0.0038;
  renderer.setClearColor(_c1);
  scene.children.forEach(()=>{});
  hemi.color.setHex(interpHex(SKY_KEYS,3,t));
  hemi.groundColor.setHex(interpHex(SKY_KEYS,4,t));
  hemi.intensity = 0.22 + day*0.55;
  stars.material.opacity = THREE.MathUtils.clamp((0.08-elev)*3, 0, 0.9);
  interiorLight.intensity = (1-day)*22;
  return { day, night:1-day };
}
const hemi = scene.children.find(c=>c.isHemisphereLight);

/* ============================== STATE & HUD ============================== */
let dayT = 0.29, paused = false, nightOn = false;
const slider = document.getElementById('tSlider');
const pauseBtn = document.getElementById('pauseBtn');
const tLabel = document.getElementById('tLabel');
const tIcon = document.getElementById('tIcon');
function phaseName(t){
  const h=(t*24+6)%24;
  if (h<5) return 'Night'; if (h<8) return 'Sunrise'; if (h<16.5) return 'Spring Day';
  if (h<19.5) return 'Sunset'; return 'Festival Night';
}
function refreshClock(){
  const h=Math.floor((dayT*24+6)%24), m=Math.floor((((dayT*24+6)%24)-h)*60);
  tLabel.textContent = `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')} — ${phaseName(dayT)} —`;
  slider.value = dayT;
  const day = sunDir.y;
  if (day>0.05){ tIcon.style.background='radial-gradient(circle at 38% 34%, #fff0c0, #E8B86D 70%)'; tIcon.style.boxShadow='0 0 12px rgba(232,184,109,.8)'; }
  else { tIcon.style.background='radial-gradient(circle at 62% 34%, #f2f6ff, #9aa8c8 75%)'; tIcon.style.boxShadow='0 0 10px rgba(180,200,255,.6)'; }
}
slider.addEventListener('input', ()=>{ dayT = parseFloat(slider.value); });
pauseBtn.addEventListener('click', ()=>{ paused=!paused; pauseBtn.textContent = paused?'PLAY':'PAUSE'; });

const voxEl = document.getElementById('vox');
const fpsEl = document.getElementById('fpsEl');
voxEl.textContent = Math.round(totalVoxels/1000)+'k';

window.__VOXEL__ = { voxelCount: totalVoxels, fps: 60, pagodaFloors: 5, timeOfDay: dayT };

/* ============================== INTERACTION ============================== */
const raycaster = new THREE.Raycaster();
const pointer = new THREE.Vector2();
let downX=0, downY=0, downT=0, lastInteract=performance.now();
renderer.domElement.addEventListener('pointerdown', e=>{ downX=e.clientX; downY=e.clientY; downT=performance.now(); lastInteract=downT; });
renderer.domElement.addEventListener('pointermove', ()=>{ lastInteract=performance.now(); });
renderer.domElement.addEventListener('wheel', ()=>{ lastInteract=performance.now(); }, {passive:true});
renderer.domElement.addEventListener('pointerup', e=>{
  lastInteract=performance.now();
  if (Math.hypot(e.clientX-downX, e.clientY-downY) > 6 || performance.now()-downT > 600) return;
  pointer.set((e.clientX/innerWidth)*2-1, -(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(pointer, camera);
  const hits = raycaster.intersectObjects([...lanterns.map(l=>l.pick), ...pagodaPicks], false);
  if (!hits.length) return;
  const u = hits[0].object.userData;
  if (u.lantern !== undefined){
    const L = lanterns[u.lantern];
    const onNow = L.light.intensity > 0.1;
    L.userOn = !onNow;
  } else if (u.floor !== undefined){
    doorState[u.floor].target = doorState[u.floor].target ? 0 : 1;
  }
});

/* ============================== INTRO ============================== */
const introFrom = new THREE.Vector3(-1.5, 4.2, 33.5);
const introTo = new THREE.Vector3(18.5, 13, 24.5);
const lookFrom = new THREE.Vector3(0, 13, 0);
const lookTo = new THREE.Vector3(0, 10.5, 0);
let introT = 0; const INTRO_DUR = 2.6;
controls.enabled = false;
camera.position.copy(introFrom); camera.lookAt(lookFrom);
setTimeout(()=>{ const f=document.getElementById('fade'); f.style.opacity='0'; setTimeout(()=>f.remove(),1200); }, 300);

/* ============================== MAIN LOOP ============================== */
const clock = new THREE.Clock();
let fpsAcc=0, fpsN=0, fpsTimer=0, fpsVal=60;
const m4 = new THREE.Matrix4();
const qTmp = new THREE.Quaternion(), eTmp = new THREE.Euler();

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const et = clock.elapsedTime;

  if (!paused) dayT = (dayT + dt/90) % 1;
  window.__VOXEL__.timeOfDay = dayT;
  const dl = applyDaylight(dayT);

  // lanterns: dusk auto-on + flicker + user toggles
  nightOn = dl.night > 0.45;
  for (let i=0;i<4;i++){
    const L = lanterns[i];
    const want = (L.userOn !== null) ? L.userOn : nightOn;
    const target = want ? 13 + Math.sin(et*12+L.phase)*1.4 + Math.sin(et*31+L.phase*2)*0.9 : 0;
    L.light.intensity += (target - L.light.intensity) * Math.min(1, dt*6);
  }
  MATS.PAPER.emissiveIntensity = 0.15 + (nightOn?2.2:0) + Math.sin(et*13)*0.12*(nightOn?1:0);

  // doors
  for (const d of doorState){
    d.f += (d.target - d.f) * Math.min(1, dt*3.2);
    const off = 1.35 * d.f;
    for (const p of d.panels) p.node.position.x = p.x0 + p.side*off;
  }

  // petals
  for (let i=0;i<PET_N;i++){
    const p = pet[i];
    p.y -= p.vy*dt;
    p.x += (Math.sin(et*1.3+p.ph)*0.9 + 0.45)*dt;
    p.z += Math.cos(et*1.1+p.ph*1.3)*0.7*dt;
    if (p.y < -6 || Math.hypot(p.x,p.z) > 46){
      const src = pick([[-9.8,21.2],[-14.2,7.8],[9.6,-7.4]]);
      p.x = src[0]+(Math.random()-0.5)*5; p.z = src[1]+(Math.random()-0.5)*5;
      p.y = 4+Math.random()*10;
    }
    eTmp.set(et*p.spin+p.ph, et*p.spin*0.7, p.ph);
    qTmp.setFromEuler(eTmp);
    m4.compose(new THREE.Vector3(p.x,p.y,p.z), qTmp, new THREE.Vector3(1,1,1));
    petals.setMatrixAt(i, m4);
  }
  petals.instanceMatrix.needsUpdate = true;

  // waterfall
  const wEdge = window.__wfEdge;
  for (let i=0;i<WF_N;i++){
    const p = wfP[i];
    p.y -= p.sp*dt;
    if (p.y < -16){ p.y = 1.2+Math.random(); p.x = wEdge.x+(Math.random()-0.5)*1.6; p.z = wEdge.z+(Math.random()-0.5)*1.2; p.sp=4.5+Math.random()*3; }
    const sc = p.mist ? 0.5+Math.random()*0.6 : 1;
    m4.compose(new THREE.Vector3(p.x+Math.sin(et*3+i)*0.06, p.y, p.z), VZ, new THREE.Vector3(sc, p.mist?0.6:1.2, sc));
    wf.setMatrixAt(i, m4);
  }
  wf.instanceMatrix.needsUpdate = true;

  // pond ripples
  scene.traverse(o=>{});
  for (const im of scene.children){
    if (im.isInstancedMesh && im.userData.water){
      for (let i=0;i<waterList.length;i++){
        im.getMatrixAt(i, m4);
        const e = m4.elements;
        const ph = e[12]*0.7 + e[14]*0.9;
        e[13] = WATER_Y*V + Math.sin(et*2.2+ph)*0.055;
        e[5] = 0.7 + Math.sin(et*2.2+ph)*0.08;
        im.setMatrixAt(i, m4);
      }
      im.instanceMatrix.needsUpdate = true;
      break;
    }
  }

  // koi
  for (const k of kois){
    const a = et*k.sp + k.ph;
    const x = k.cx + Math.cos(a)*k.rx, z = k.cz + Math.sin(a)*k.rz;
    const dx = -Math.sin(a)*k.rx*Math.sign(k.sp), dz = Math.cos(a)*k.rz*Math.sign(k.sp);
    k.node.position.set(x, 0.28+Math.sin(et*2+k.ph)*0.05, z);
    k.node.rotation.y = Math.atan2(dx,dz);
    k.tail.rotation.y = Math.sin(et*7+k.ph)*0.5;
  }

  // birds
  for (const b of birds){
    const a = et*b.sp + b.ph;
    const x=Math.cos(a)*b.R, z=Math.sin(a)*b.R, y=b.h+Math.sin(et*0.7+b.ph)*1.2;
    b.node.position.set(x,y,z);
    b.node.rotation.y = Math.atan2(-Math.sin(a), Math.cos(a)) + Math.PI/2;
    const fl = Math.sin(et*b.flap+b.ph)*0.9;
    b.wl.rotation.z = fl; b.wr.rotation.z = -fl;
  }

  // tree wind + satellite bob
  for (const t of trees){
    t.node.rotation.z = Math.sin(et*0.8+t.phase)*0.018;
    t.crown.rotation.x = Math.sin(et*1.1+t.phase)*0.02;
  }
  for (const s of satellites) s.node.position.y = s.baseY + Math.sin(et*s.speed+s.phase)*0.8;

  // stars slow spin
  stars.rotation.y = et*0.004;

  // intro / controls
  if (introT < INTRO_DUR){
    introT += dt;
    let u = THREE.MathUtils.clamp(introT/INTRO_DUR, 0, 1);
    u = u*u*(3-2*u);
    camera.position.lerpVectors(introFrom, introTo, u);
    const lk = new THREE.Vector3().lerpVectors(lookFrom, lookTo, u);
    camera.lookAt(lk);
    if (introT >= INTRO_DUR){ controls.enabled = true; controls.target.copy(lookTo); controls.update(); lastInteract = performance.now(); }
  } else {
    controls.autoRotate = (performance.now() - lastInteract) > 5000;
    controls.update();
  }

  // fps + hud
  fpsAcc += dt; fpsN++; fpsTimer += dt;
  if (fpsTimer > 0.5){
    fpsVal = Math.round(fpsN/fpsAcc);
    fpsEl.textContent = fpsVal;
    window.__VOXEL__.fps = fpsVal;
    window.__VOXEL__.voxelCount = totalVoxels;
    refreshClock();
    fpsAcc = 0; fpsN = 0; fpsTimer = 0;
  }

  renderer.render(scene, camera);
}
refreshClock();
animate();

addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
});
</script>
</body>
