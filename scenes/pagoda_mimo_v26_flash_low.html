<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Garden Above the Clouds</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#BFD9EA}
#app{position:fixed;inset:0}
canvas{display:block}
#title{position:fixed;top:24px;left:32px;color:#fff;text-shadow:0 2px 16px rgba(15,25,45,.6);pointer-events:none;z-index:5}
#title h1{font:400 40px/1.1 Georgia,'Times New Roman',serif;letter-spacing:.05em}
#title p{font:12.5px/1.4 system-ui,-apple-system,sans-serif;opacity:.82;margin-top:7px;letter-spacing:.03em}
#bar{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);display:flex;gap:5px;align-items:center;
padding:7px 10px;background:rgba(255,255,255,.17);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
border:1px solid rgba(255,255,255,.34);border-radius:999px;box-shadow:0 10px 34px rgba(15,25,45,.3);
font:12.5px system-ui,-apple-system,sans-serif;color:#fff;z-index:6;white-space:nowrap}
.pill{padding:7px 13px;border-radius:999px;border:none;background:transparent;color:#fff;cursor:pointer;letter-spacing:.03em;font:inherit}
.pill:hover{background:rgba(255,255,255,.22)}
.pill.on{background:#fff;color:#2E8B7E;font-weight:600;box-shadow:0 2px 10px rgba(0,0,0,.2)}
.seg{display:flex;gap:2px;padding:2px;background:rgba(255,255,255,.15);border-radius:999px}
.sep{width:1px;height:20px;background:rgba(255,255,255,.3);margin:0 3px}
select.pill{-webkit-appearance:none;appearance:none;background:rgba(255,255,255,.17);padding-right:26px;
background-image:linear-gradient(45deg,transparent 50%,#fff 50%),linear-gradient(135deg,#fff 50%,transparent 50%);
background-position:calc(100% - 15px) 13px,calc(100% - 10px) 13px;background-size:5px 5px,5px 5px;background-repeat:no-repeat}
select.pill option{color:#1a1a1a}
#more{position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(10px);width:262px;padding:14px 16px;
background:rgba(18,28,48,.6);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.22);border-radius:16px;
color:#fff;font:12px system-ui,-apple-system,sans-serif;opacity:0;pointer-events:none;transition:.25s;z-index:7}
#more.open{opacity:1;pointer-events:auto;transform:translateX(-50%) translateY(0)}
#more label{display:flex;justify-content:space-between;margin:4px 0 6px;opacity:.85}
#more input[type=range]{width:100%;accent-color:#7ED6DF}
.row{display:flex;justify-content:space-between;align-items:center;margin-top:11px}
#stats{margin-top:13px;padding-top:10px;border-top:1px solid rgba(255,255,255,.2);opacity:.72;font-size:11.5px;letter-spacing:.04em}
</style>
</head>
<body>
<div id="app"></div>
<div id="title"><h1>Garden Above the Clouds</h1><p>Drag to look around, scroll to zoom, right-drag to move</p></div>
<div id="bar">
<select id="view" class="pill"><option>Overview</option><option>Torii</option><option>Bridge</option><option>Pagoda</option><option>Waterfall</option></select>
<div class="sep"></div>
<div class="seg" id="season"><button class="pill" data-s="Spring">Spring</button><button class="pill on" data-s="Summer">Summer</button><button class="pill" data-s="Autumn">Autumn</button><button class="pill" data-s="Winter">Winter</button></div>
<div class="seg" id="tod"><button class="pill" data-t="0">Dawn</button><button class="pill on" data-t=".25">Day</button><button class="pill" data-t=".5">Sunset</button><button class="pill" data-t=".75">Night</button></div>
<div class="sep"></div>
<button class="pill" id="moreBtn">More</button>
</div>
<div id="more">
<label>Time of day <span id="todLbl">11:00</span></label>
<input type="range" id="todSlider" min="0" max="1" step="0.002" value="0.25">
<div class="row"><span>Cycle (90 s)</span><button class="pill" id="pauseBtn">Running</button></div>
<div class="row"><span>Auto-rotate</span><button class="pill on" id="rotBtn">On</button></div>
<div id="stats">— voxels | — FPS</div>
</div>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>
<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';

/* ================= core setup ================= */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
app.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0xDCE4EE,0.0030);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,2400);
camera.position.set(0,-24,360);
const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.06;
controls.minDistance=38;controls.maxDistance=520;
controls.maxPolarAngle=Math.PI*0.575;
controls.target.set(0,10,0);
controls.autoRotateSpeed=.45;

const sun=new THREE.DirectionalLight(0xffffff,2.2);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
const sc=sun.shadow.camera;sc.left=-118;sc.right=118;sc.top=118;sc.bottom=-118;sc.near=1;sc.far=520;
sun.shadow.bias=-.0011;sun.shadow.normalBias=.65;
sun.target.position.set(0,14,0);scene.add(sun,sun.target);
const hemi=new THREE.HemisphereLight(0xBFD9EA,0xC9A88A,1.1);scene.add(hemi);

/* sky sphere with vertex gradient (tone mapped + managed) */
const skyGeo=new THREE.SphereGeometry(950,32,20);
const skyCol=new Float32Array(skyGeo.attributes.position.count*3);
skyGeo.setAttribute('color',new THREE.BufferAttribute(skyCol,3));
const skyYs=new Float32Array(skyGeo.attributes.position.count);
{const p=skyGeo.attributes.position;for(let i=0;i<p.count;i++)skyYs[i]=Math.min(1,Math.max(0,p.getY(i)/950*1.5+.22));}
const sky=new THREE.Mesh(skyGeo,new THREE.MeshBasicMaterial({vertexColors:true,side:THREE.BackSide,fog:false,depthWrite:false,depthTest:false}));
sky.renderOrder=-1000;scene.add(sky);

/* stars + moon */
const starN=900,starPos=new Float32Array(starN*3);
for(let i=0;i<starN;i++){const u=Math.random()*6.283,v=Math.acos(Math.random()*.9);
starPos[i*3]=Math.sin(v)*Math.cos(u)*880;starPos[i*3+1]=Math.abs(Math.cos(v))*880;starPos[i*3+2]=Math.sin(v)*Math.sin(u)*880;}
const starGeo=new THREE.BufferGeometry();starGeo.setAttribute('position',new THREE.BufferAttribute(starPos,3));
const starMat=new THREE.PointsMaterial({color:0xffffff,size:4,sizeAttenuation:false,transparent:true,opacity:0,depthWrite:false,fog:false});
const stars=new THREE.Points(starGeo,starMat);stars.renderOrder=-900;scene.add(stars);
const moon=new THREE.Mesh(new THREE.SphereGeometry(26,18,14),new THREE.MeshBasicMaterial({color:0xE9F0FA,transparent:true,opacity:0,fog:false,depthWrite:false}));
moon.renderOrder=-899;scene.add(moon);

/* ================= helpers ================= */
const R=(a,b)=>a+Math.random()*(b+1e-9);
const RI=(a,b)=>Math.floor(a+Math.random()*(b-a+1e-9));
const H=s=>parseInt(s.slice(1),16);
function hsh(x,z){const n=Math.sin(x*127.1+z*311.7)*43758.5453;return n-Math.floor(n);}
function vn(x,z){const xi=Math.floor(x),zi=Math.floor(z),xf=x-xi,zf=z-zi,a=hsh(xi,zi),b=hsh(xi+1,zi),c=hsh(xi,zi+1),d=hsh(xi+1,zi+1),u=xf*xf*(3-2*xf),v=zf*zf*(3-2*zf);
return a*(1-u)*(1-v)+b*u*(1-v)+c*(1-u)*v+d*u*v;}
function fbm(x,z){return vn(x,z)*.5+vn(x*2.1+5,z*2.1-3)*.3+vn(x*4.7-9,z*4.7+7)*.2;}
function shade(c,f){const r=Math.min(255,Math.max(0,Math.round(((c>>16)&255)*f))),g=Math.min(255,Math.max(0,Math.round(((c>>8)&255)*f))),b=Math.min(255,Math.max(0,Math.round((c&255)*f)));return (r<<16)|(g<<8)|b;}
const _C=new THREE.Color();
function lin(hex,a,i){_C.setHex(hex);a[i]=_C.r;a[i+1]=_C.g;a[i+2]=_C.b;}

/* ================= voxel core ================= */
const VM=new Map();
const K=(x,y,z)=>(x+512)+(y+512)*1024+(z+512)*1048576;
function S(x,y,z,c,cat=0){x=Math.round(x);y=Math.round(y);z=Math.round(z);VM.set(K(x,y,z),(c&0xFFFFFF)|(cat<<24));}
function box(x0,x1,y0,y1,z0,z1,c,cat=0){for(let x=x0;x<=x1;x++)for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)S(x,y,z,c,cat);}
function blob(cx,cy,cz,rx,ry,rz,c,cat){
 cx=Math.round(cx);cy=Math.round(cy);cz=Math.round(cz);
 rx=Math.max(1,Math.round(rx));ry=Math.max(1,Math.round(ry));rz=Math.max(1,Math.round(rz));
 for(let x=-rx;x<=rx;x++)for(let y=-ry;y<=ry;y++)for(let z=-rz;z<=rz;z++){
  const d=x*x/(rx*rx)+y*y/(ry*ry)+z*z/(rz*rz);
  if(d<1+(vn((cx+x)*.6+cy,(cz+z)*.6)-.5)*.75)S(cx+x,cy+y,cz+z,c,cat);}}

const VERM=H('#C73E1D'),VERM2=H('#A8321A'),TEAL=H('#2E8B7E'),TEAL2=H('#3FA796'),GOLD=H('#E8B86D'),
TEAK=H('#4A2C1A'),WHT=H('#F4F6FA'),STONE=H('#9AA0A6'),STONE2=H('#7A6E62'),MOSS=H('#606C38'),
GLOWC=H('#FFC978'),WATERC=H('#7ED6DF');
const STRATC=[H('#7A6E62'),H('#8A7A6A'),H('#6E6358'),H('#948575'),H('#5F564E')];

/* ================= terrain ================= */
const GX0=-92,GX1=92,GZ0=-76,GZ1=76,GW=GX1-GX0+1,GD=GZ1-GZ0+1;
const TOP=new Int16Array(GW*GD),BOT=new Int16Array(GW*GD);
const gi=(x,z)=>(x-GX0)+(z-GZ0)*GW;
const gok=(x,z)=>x>=GX0&&x<=GX1&&z>=GZ0&&z<=GZ1;
function mask(x,z){return 1-Math.hypot(x/82,z/66)+.17*(fbm(x*.035+3,z*.035+7)-.5)*2;}
const RECTS=[[44,66,4,24,9],[4,34,-14,6,14],[-36,-4,-24,8,26],[-6,34,-46,-24,14],[42,62,-36,-18,10]];
function terrain(){
 for(let z=GZ0;z<=GZ1;z++)for(let x=GX0;x<=GX1;x++){
  const i=gi(x,z),m=mask(x,z);TOP[i]=-9999;BOT[i]=0;
  if(m<.015)continue;
  let h=(6+9*fbm(x*.03,z*.03))*Math.min(1,.35+1.5*m);
  const dp=Math.hypot(x+20,z+8);if(dp<34)h=Math.max(h,25+(34-dp)*.08);
  const dc=Math.hypot(x+54,z+30);if(dc<25)h=Math.max(h,20+(25-dc)*1.05);
  TOP[i]=Math.round(h);
  const rn=Math.min(1,Math.max(0,1-m));
  BOT[i]=Math.round(-3-72*Math.pow(1-rn,1.6));
 }
 for(const r of RECTS)for(let x=r[0];x<=r[1];x++)for(let z=r[2];z<=r[3];z++){if(!gok(x,z))continue;const i=gi(x,z);if(TOP[i]<-9000)continue;TOP[i]=r[4];}
 // stairs : arrival(9) <-> courtyard(14)
 for(let x=34;x<=44;x++)for(let z=0;z<=10;z++){if(!gok(x,z))continue;const i=gi(x,z);if(TOP[i]<-9000)continue;TOP[i]=14-Math.floor((x-34)/2);}
 // stairs : courtyard(14) <-> terrace(26)
 for(let x=-4;x<=6;x++)for(let z=-6;z<=4;z++){if(!gok(x,z))continue;const i=gi(x,z);if(TOP[i]<-9000)continue;TOP[i]=14+Math.floor((6-x)*1.2);}
 // pond
 const px=26,pz=26,PR=15;
 for(let z=pz-PR-3;z<=pz+PR+3;z++)for(let x=px-PR-3;x<=px+PR+3;x++){
  if(!gok(x,z))continue;const i=gi(x,z);if(TOP[i]<-9000)continue;
  const d=Math.hypot(x-px,z-pz);
  if(d<PR){TOP[i]=5;BOT[i]=Math.min(BOT[i],1);}
  else if(d<PR+2)TOP[i]=Math.max(TOP[i],11);}
 stream([52,-30],30,[-70,-31],8,2);
 stream([26,26],10,[53,47],8,2);
 for(let i=0;i<GW*GD;i++){if(TOP[i]>-9000&&BOT[i]>TOP[i]-3)BOT[i]=TOP[i]-3;}
}
function rimPt(ax,az){let last=20;for(let r=20;r<130;r++){if(mask(ax*r,az*r)>.015)last=r;}return [Math.round(ax*last),Math.round(az*last)];}
const WATERC cells=[];
function stream(p0,y0,p1,y1,w){
 const n=Math.max(Math.abs(p1[0]-p0[0]),Math.abs(p1[1]-p0[1]));
 const dxs=(p1[0]-p0[0])/n,dzs=(p1[1]-p0[1])/n;
 for(let k=0;k<=n;k++){const x=Math.round(p0[0]+(p1[0]-p0[0])*k/n),z=Math.round(p0[1]+(p1[1]-p0[1])*k/n);
  const y=Math.round(y0+(y1-y0)*k/n);
  for(let o=-w;o<=w;o++){const cx=Math.round(x-dzs*o),cz=Math.round(z+dxs*o);
   if(!gok(cx,cz))continue;const i=gi(cx,cz);if(TOP[i]<-9000)continue;
   TOP[i]=y-1;WATERC.push([cx,y,cz],[cx,y+1,cz]);
   S(cx,y-1,cz,shade(STONE,.85+.3*hsh(cx,cz)),0);}}
}
function emitTerrain(){
 for(let z=GZ0;z<=GZ1;z++)for(let x=GX0;x<=GX1;x++){
  const i=gi(x,z),t=TOP[i];if(t<-9000)continue;const b=BOT[i];
  const n0=gok(x+1,z)?gi(x+1,z):-1,n1=gok(x-1,z)?gi(x-1,z):-1,n2=gok(x,z+1)?gi(x,z+1):-1,n3=gok(x,z-1)?gi(x,z-1):-1;
  for(let y=b;y<=t;y++){
   let vis=(y===t||y===b);
   if(!vis){const ns=[n0,n1,n2,n3];
    for(let k=0;k<4;k++){const j=ns[k];if(j<0||TOP[j]<-9000||y>TOP[j]||y<BOT[j]){vis=true;break;}}}
   if(!vis)continue;
   let c,cat=0;
   if(y===t){c=H('#40916C');cat=4;}
   else if(y>t-3)c=shade(H('#6B4A2F'),.85+.3*hsh(x,z));
   else c=STRATC[(Math.floor((y+300)/6)+Math.floor(hsh(x,z)*3))%5];
   S(x,y,z,shade(c,.9+.2*hsh(x+y,z-y)),cat);
  }}
 // pond water
 for(let z=11;z<=41;z++)for(let x=11;x<=41;x++){if(!gok(x,z))continue;const i=gi(x,z);
  if(TOP[i]!==5)continue;for(let y=6;y<=10;y++)S(x,y,z,shade(WATERC,.9+.25*hsh(x+y,z)),5);}
 for(const w of WATERC)S(w[0],w[1],w[2],shade(WATERC,.9+.3*hsh(w[0],w[1])),5);
}

/* ================= trees & planting ================= */
function treeAt(x,gy,z,typ,s){
 const th=Math.round(R(8,13)*s);
 const trunk=typ==='pine'?H('#4A2C1A'):H('#5A3A22');
 const rw=s>1.4?2:1;
 for(let k=0;k<th;k++){const yy=gy+1+k,ox=Math.round(Math.sin(k*.11)),oz=Math.round(Math.cos(k*.13)*.6);
  for(let a=0;a<rw;a++)for(let b=0;b<rw;b++)S(x+ox+a,yy,z+oz+b,shade(trunk,.85+.3*hsh(k,a*3)),0);}
 const ty=gy+th,cx=x+Math.round(Math.sin(th*.11)),cz=z+Math.round(Math.cos(th*.13)*.6);
 const nb=typ==='pine'?0:5;
 for(let b=0;b<nb;b++){const a=R(0,6.28),L=Math.round(R(3,6)*s);
  for(let k=1;k<=L;k++){const bx=cx+Math.round(Math.cos(a)*k),bz=cz+Math.round(Math.sin(a)*k),by=ty+1+Math.round(k*.4);
   S(bx,by,bz,trunk,0);if(k>2&&Math.random()<.5)S(bx,by+1,bz,trunk,0);}}
 if(typ==='pine'){for(let l=0;l<6;l++){const r=(5.5-l)*s*.95;if(r<1)break;blob(cx,ty-4+l*2.5,cz,r,1.5*s,r,0,2);}}
 else if(typ==='willow'){
  blob(cx,ty+3,cz,5.5*s,3.2*s,5.5*s,0,1);
  for(let b=0;b<18;b++){const a=R(0,6.28),rr=R(3,5.5)*s,bx=cx+Math.round(Math.cos(a)*rr),bz=cz+Math.round(Math.sin(a)*rr),L=Math.round(R(4,9)*s);
   for(let k=0;k<L;k++)S(bx,ty+3-k,bz,0,1);}
 } else {
  const cat=typ==='sakura'?3:1,n=typ==='sakura'?5:4;
  for(let b=0;b<n;b++){const a=R(0,6.28),rr=R(0,2.6)*s;
   blob(cx+Math.round(Math.cos(a)*rr),ty+1+Math.round(R(-1,3)*s),cz+Math.round(Math.sin(a)*rr),R(3,4.4)*s,R(2.4,3.4)*s,R(3,4.4)*s,0,cat);}
 }}
function tree(x,z,typ,s){if(!gok(x,z))return;const i=gi(x,z);if(TOP[i]<-9000)return;treeAt(x,TOP[i],z,typ,s);}
function shrub(x,z,s=1){if(!gok(x,z))return;const i=gi(x,z);if(TOP[i]<-9000)return;
 blob(x,TOP[i]+2,z,R(2,3.4)*s,R(1.6,2.4)*s,R(2,3.4)*s,0,1);}
function flowers(x,z,n){for(let k=0;k<n;k++){const px=x+RI(-4,4),pz=z+RI(-4,4);if(!gok(px,pz))continue;
 const i=gi(px,pz);if(TOP[i]<-9000)continue;const g=TOP[i],h=RI(1,3);
 for(let i2=0;i2<h;i2++)S(px,g+1+i2,pz,0,1);
 S(px,g+h+1,pz,0,3);if(Math.random()<.5)S(px+1,g+h+1,pz,0,3);}}
function free(x,z){
 if(!gok(x,z))return false;const i=gi(x,z);if(TOP[i]<-9000||mask(x,z)<.14)return false;
 if(Math.hypot(x-26,z-26)<19)return false;
 for(const r of RECTS)if(x>=r[0]-2&&x<=r[1]+2&&z>=r[2]-2&&z<=r[3]+2)return false;
 if(Math.hypot(x+54,z+30)<21)return false;
 return true;}
function plant(){
 const types=['maple','sakura','broadleaf','pine','maple','broadleaf','sakura','willow'];
 let placed=0;
 for(let t=0;t<420&&placed<17;t++){const x=R(-78,78),z=R(-62,62);if(!free(x,z))continue;placed++;
  tree(Math.round(x),Math.round(z),types[placed%types.length],R(.8,1.25));}
 [[6,40,'willow',1.4],[44,32,'sakura',1.2],[16,6,'sakura',1.1],[-2,-50,'maple',1.2],[-34,-44,'maple',1.15],
  [30,-16,'broadleaf',1.1],[-12,16,'pine',1.05],[52,10,'maple',1],[-50,10,'sakura',1.05],[36,42,'broadleaf',1]].forEach(a=>{if(free(a[0],a[1]))tree(a[0],a[1],a[2],a[3]);});
 [[-50,-24],[-58,-36],[-46,-38],[-56,-20]].forEach(p=>tree(p[0],p[1],'pine',R(.8,1.1)));
 for(let t=0;t<40;t++){const x=R(-78,78),z=R(-62,62);if(free(Math.round(x),Math.round(z)))shrub(Math.round(x),Math.round(z),R(.8,1.3));}
 for(let t=0;t<26;t++){const x=R(-72,72),z=R(-58,58);if(free(Math.round(x),Math.round(z)))flowers(Math.round(x),Math.round(z),RI(3,8));}
 for(let t=0;t<1400;t++){const x=RI(-78,78),z=RI(-62,62);if(!free(x,z))continue;const i=gi(x,z);
  if(Math.random()<.5)S(x,TOP[i]+1,z,0,1);else S(x,TOP[i]+1,z,0,4);}
 // rim overflow: shrubs, flowers, hanging vines
 for(let a=0;a<6.283;a+=.12){let r=30;for(let rr=30;rr<125;rr++){if(mask(Math.cos(a)*rr,Math.sin(a)*rr)>.05)r=rr;}
  const x=Math.round(Math.cos(a)*r),z=Math.round(Math.sin(a)*r);if(!gok(x,z))continue;const i=gi(x,z);if(TOP[i]<-9000)continue;
  const g=TOP[i],k=Math.random();
  if(k<.5){const L=RI(3,10);for(let q=0;q<L;q++)S(x,g-q,z,0,1);}
  else if(k<.75)blob(x,g+2,z,R(2,3),R(1.5,2.2),R(2,3),0,1);
  else flowers(x,z,3);}
 // bamboo grove
 for(let k=0;k<26;k++){const x=-52+RI(-9,9),z=32+RI(-8,8);if(!gok(x,z))continue;const i=gi(x,z);if(TOP[i]<-9000)continue;

  Ptmp.set(p.x,p.y,p.z);Mtmp.compose(Ptmp,Qtmp,Stmp);pt.setMatrixAt(i,Mtmp);}
 pt.instanceMatrix.needsUpdate=true;
 // lantern lights
 for(let i=0;i<lantLights.length;i++){
  const fl=.86+.14*Math.sin(t*7+i*2.1)+.06*Math.sin(t*17+i);
  lantLights[i].intensity=nightF*8*fl*(lanternOn[i]?1:0);}
 // camera constraints
 if(!flying){controls.autoRotate=autoOn&&performance.now()-lastInput>3500;}
 controls.update();
 if(camera.position.y<-30)camera.position.y=-30;
 renderer.render(scene,camera);
 // stats
 fCnt++;fAcc+=dt;fT+=dt;
 if(fT>.5){fps=Math.round(fCnt/fAcc);fCnt=0;fAcc=0;fT=0;
  document.getElementById('stats').textContent=(visibleCount/1000).toFixed(0)+'k voxels | '+fps+' FPS';
  slider.value=viewT;
  window.__VOXEL__.fps=fps;window.__VOXEL__.voxelCount=visibleCount;
  window.__VOXEL__.timeOfDay=viewT;window.__VOXEL__.season=season;}
}
applyTime(viewT);nearestPhase();
window.__VOXEL__={voxelCount:visibleCount,fps:0,pagodaFloors:5,timeOfDay:.25,season};
tick();
</script>
