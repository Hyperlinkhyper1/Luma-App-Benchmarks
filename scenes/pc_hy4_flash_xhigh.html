<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Apex Vortex - 3D PC</title>
  <style>
    :root {
      --accent: #00e5ff;
    }
    body {
      margin: 0;
      overflow: hidden;
      background-color: #050505;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      color: #eee;
      user-select: none;
    }
    #hud {
      position: fixed;
      bottom: 25px;
      right: 25px;
      width: 280px;
      background: rgba(15, 15, 15, 0.75);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.02);
      z-index: 100;
      position: relative;
    }
    #hud::after {
      content: "";
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.1) 2px, rgba(0,0,0,0.1) 4px);
      pointer-events: none;
      border-radius: 12px;
    }
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      font-weight: 600;
      letter-spacing: 1px;
      font-size: 14px;
    }
    .header .version {
      font-size: 10px;
      color: #888;
      font-family: monospace;
    }
    .divider {
      height: 1px;
      background: rgba(255,255,255,0.1);
      margin: 15px 0;
    }
    .control-row {
      display: flex;
      align-items: center;
      gap: 15px;
    }
    .btn-power {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      border: 2px solid #444;
      background: #111;
      color: #888;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      outline: none;
      flex-shrink: 0;
    }
    .btn-power:hover { border-color: #666; color: #ccc; }
    .btn-power.active {
      border-color: var(--accent);
      color: var(--accent);
      box-shadow: 0 0 15px rgba(0,0,0,0), 0 0 15px var(--accent);
      background: rgba(255,255,255,0.05);
    }
    .status-label {
      font-size: 10px;
      color: #888;
      margin-bottom: 3px;
    }
    .status-value {
      font-family: monospace;
      font-size: 16px;
      font-weight: bold;
    }
    .status-value.offline { color: #ff4444; }
    .status-value.booting { color: #ffaa00; }
    .status-value.online { color: var(--accent); text-shadow: 0 0 8px var(--accent); }

    .control-group { margin-bottom: 15px; }
    .label-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #aaa;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .label-row span {
      font-family: monospace;
      color: var(--accent);
    }

    input[type="color"] {
      width: 100%;
      height: 30px;
      border: 1px solid rgba(255,255,255,0.2);
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      padding: 2px;
    }
    input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
    input[type="color"]::-webkit-color-swatch { border: none; border-radius: 4px; }

    input[type="range"] {
      width: 100%;
      -webkit-appearance: none;
      background: transparent;
    }
    input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 4px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 14px;
      width: 14px;
      border-radius: 50%;
      background: var(--accent);
      margin-top: -5px;
      cursor: pointer;
      box-shadow: 0 0 10px var(--accent);
    }

    .btn-group { display: flex; gap: 10px; }
    .btn-profile {
      flex: 1;
      padding: 8px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: #888;
      border-radius: 6px;
      cursor: pointer;
      font-size: 11px;
      font-weight: bold;
      transition: all 0.2s;
    }
    .btn-profile:hover { background: rgba(255,255,255,0.05); color: #ccc; }
    .btn-profile.active {
      border-color: var(--accent);
      color: var(--accent);
      background: rgba(255,255,255,0.02);
    }

    .monitor .mon-row {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      color: #888;
      margin-bottom: 6px;
      font-family: monospace;
    }
    .monitor .val { color: #ddd; }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>

  <div id="hud">
    <div class="header">
      <span class="title">APEX VORTEX // CTRL</span>
      <span class="version">v2.4.0</span>
    </div>
    <div class="divider"></div>
    
    <div class="control-row">
      <button id="powerBtn" class="btn-power">
        <svg viewBox="0 0 24 24" width="24" height="24" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path><line x1="12" y1="2" x2="12" y2="12"></line></svg>
      </button>
      <div class="status-container">
        <div class="status-label">SYSTEM STATUS</div>
        <div id="sysStatus" class="status-value offline">OFFLINE</div>
      </div>
    </div>

    <div class="divider"></div>

    <div class="control-group">
      <div class="label-row"><label>Lighting Color</label><span id="rgbHex">#00E5FF</span></div>
      <input type="color" id="rgbPicker" value="#00e5ff">
    </div>

    <div class="control-group">
      <div class="label-row"><label>Fan Curve</label><span id="fanVal">50%</span></div>
      <input type="range" id="fanSlider" min="10" max="100" value="50">
    </div>

    <div class="control-group">
      <div class="label-row"><label>Profile</label></div>
      <div class="btn-group">
        <button class="btn-profile active" data-mode="silent">SILENT</button>
        <button class="btn-profile" data-mode="turbo">TURBO</button>
      </div>
    </div>

    <div class="divider"></div>

    <div class="monitor">
      <div class="mon-row"><span>CPU TEMP</span><span id="cpuTemp" class="val">-- °C</span></div>
      <div class="mon-row"><span>GPU TEMP</span><span id="gpuTemp" class="val">-- °C</span></div>
      <div class="mon-row"><span>FAN SPEED</span><span id="fanRpm" class="val">0 RPM</span></div>
      <div class="mon-row"><span>POST CODE</span><span id="postCode" class="val">--</span></div>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
    import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
    import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
    import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

    // --- State ---
    const state = {
      powered: false,
      bootProgress: 0,
      fanSpeedTarget: 0.5,
      fanSpeedCurrent: 0,
      rgbColor: '#00e5ff',
      mode: 'silent',
      time: 0,
      cpuTemp: 25,
      gpuTemp: 25
    };

    // --- Scene Setup ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050505, 0.02);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(-8, 6, 10);

    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 0.6, 0.4, 0.85);
    composer.addPass(bloomPass);
    composer.addPass(new OutputPass());

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.target.set(0, 2.5, 0);
    controls.maxDistance = 20;
    controls.minDistance = 5;
    controls.maxPolarAngle = Math.PI / 2 - 0.05;

    // --- Lights ---
    scene.add(new THREE.HemisphereLight(0x88aaff, 0x080808, 0.4));

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.5);
    dirLight.position.set(-5, 10, 8);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    dirLight.shadow.camera.left = -5;
    dirLight.shadow.camera.right = 5;
    dirLight.shadow.camera.top = 5;
    dirLight.shadow.camera.bottom = -5;
    scene.add(dirLight);

    const fillLight = new THREE.DirectionalLight(0xaaccff, 0.5);
    fillLight.position.set(5, 5, -5);
    scene.add(fillLight);

    // --- Materials ---
    const mats = {
      caseMetal: new THREE.MeshStandardMaterial({ color: 0x151515, roughness: 0.3, metalness: 0.8 }),
      blackPlastic: new THREE.MeshStandardMaterial({ color: 0x0a0a0a, roughness: 0.6 }),
      aluminum: new THREE.MeshStandardMaterial({ color: 0xaaaaaa, roughness: 0.2, metalness: 0.9 }),
      pcb: new THREE.MeshStandardMaterial({ color: 0x0a1a0a, roughness: 0.8 }),
      tube: new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 0.9 }),
      glass: new THREE.MeshPhysicalMaterial({ color: 0x111111, transmission: 0.9, opacity: 1, transparent: true, roughness: 0.1, metalness: 0.1, ior: 1.5, thickness: 0.1, side: THREE.DoubleSide }),
      rgbBase: new THREE.MeshStandardMaterial({ color: 0x000000, emissive: new THREE.Color(state.rgbColor), emissiveIntensity: 0 })
    };

    // --- Helpers & Collections ---
    const pcGroup = new THREE.Group();
    scene.add(pcGroup);

    const fans = [];
    const rgbElements = [];
    const pointLights = [];
    const flowSpheres = [];
    let coolingCurve;

    function addRGB(mesh, delay = 0) {
      mesh.material = mats.rgbBase.clone();
      rgbElements.push({ mesh, delay });
    }

    function addRGBLight(x, y, z) {
      const light = new THREE.PointLight(state.rgbColor, 0, 5);
      light.position.set(x, y, z);
      pcGroup.add(light);
      pointLights.push(light);
    }

    function createGrillTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, 128, 128);
      ctx.strokeStyle = '#333333';
      ctx.lineWidth = 2;
      for (let i = 0; i < 128; i += 8) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i, 128); ctx.stroke();
        ctx.beginPath(); ctx.moveTo(0, i); ctx.lineTo(128, i); ctx.stroke();
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(4, 4);
      return tex;
    }

    // --- Build PC ---
    const W = 3.2, H = 5.5, D = 4.8;
    const halfW = W / 2, halfD = D / 2;
    const frameMat = mats.aluminum;

    function addFramePiece(w, h, d, x, y, z) {
      const m = new THREE.Mesh(new RoundedBoxGeometry(w, h, d, 2, 0.02), frameMat);
      m.position.set(x, y, z);
      pcGroup.add(m);
    }

    // Frame
    addFramePiece(0.1, H, 0.1, -halfW, H/2, -halfD);
    addFramePiece(0.1, H, 0.1, halfW, H/2, -halfD);
    addFramePiece(0.1, H, 0.1, -halfW, H/2, halfD);
    addFramePiece(0.1, H, 0.1, halfW, H/2, halfD);
    addFramePiece(W, 0.1, 0.1, 0, 0.05, -halfD);
    addFramePiece(W, 0.1, 0.1, 0, 0.05, halfD);
    addFramePiece(W, 0.1, 0.1, 0, H-0.05, -halfD);
    addFramePiece(W, 0.1, 0.1, 0, H-0.05, halfD);
    addFramePiece(0.1, 0.1, D, -halfW, 0.05, 0);
    addFramePiece(0.1, 0.1, D, halfW, 0.05, 0);
    addFramePiece(0.1, 0.1, D, -halfW, H-0.05, 0);
    addFramePiece(0.1, 0.1, D, halfW, H-0.05, 0);

    // Panels
    const glassL = new THREE.Mesh(new THREE.PlaneGeometry(D-0.1, H-0.1), mats.glass);
    glassL.rotation.y = -Math.PI/2;
    glassL.position.set(-halfW, H/2, 0);
    glassL.castShadow = false;
    pcGroup.add(glassL);

    const glassF = new THREE.Mesh(new THREE.PlaneGeometry(W-0.1, H-0.1), mats.glass);
    glassF.position.set(0, H/2, halfD);
    glassF.castShadow = false;
    pcGroup.add(glassF);

    const metalR = new THREE.Mesh(new THREE.PlaneGeometry(D-0.1, H-0.1), mats.caseMetal);
    metalR.rotation.y = Math.PI/2;
    metalR.position.set(halfW, H/2, 0);
    pcGroup.add(metalR);

    const metalB = new THREE.Mesh(new THREE.PlaneGeometry(W-0.1, H-0.1), mats.caseMetal);
    metalB.position.set(0, H/2, -halfD);
    pcGroup.add(metalB);

    // Grills & Branding
    const grillMat = new THREE.MeshStandardMaterial({ map: createGrillTexture(), transparent: true, opacity: 0.8, side: THREE.DoubleSide, roughness: 0.5, metalness: 0.8 });
    const topGrill = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 4.6), grillMat);
    topGrill.rotation.x = -Math.PI/2;
    topGrill.position.y = H - 0.05;
    pcGroup.add(topGrill);
    
    const frontGrill = new THREE.Mesh(new THREE.PlaneGeometry(3.0, 5.2), grillMat);
    frontGrill.position.z = halfD + 0.01;
    pcGroup.add(frontGrill);

    // Motherboard
    const mb = new THREE.Mesh(new RoundedBoxGeometry(0.05, 2.4, 3.0, 2, 0.02), mats.pcb);
    mb.position.set(halfW - 0.1, 3.0, -0.5);
    pcGroup.add(mb);

    const vrm = new THREE.Mesh(new RoundedBoxGeometry(0.15, 0.4, 2.0, 2, 0.02), mats.aluminum);
    vrm.position.set(halfW - 0.2, 4.0, -0.5);
    pcGroup.add(vrm);

    // CPU Block
    const cpuBlock = new THREE.Mesh(new RoundedBoxGeometry(0.4, 0.8, 0.8, 4, 0.05), mats.blackPlastic);
    cpuBlock.position.set(halfW - 0.4, 3.4, -1.1);
    pcGroup.add(cpuBlock);
    const cpuTop = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.6), mats.rgbBase.clone());
    cpuTop.rotation.y = -Math.PI/2;
    cpuTop.position.set(halfW - 0.61, 3.4, -1.1);
    pcGroup.add(cpuTop);
    addRGB(cpuTop, 0.1);

    // RAM
    for (let i = 0; i < 4; i++) {
      const ram = new THREE.Mesh(new THREE.BoxGeometry(0.1, 1.1, 0.06), mats.blackPlastic);
      ram.position.set(halfW - 0.2, 4.3, 0.2 + i * 0.12);
      pcGroup.add(ram);
      const ramTop = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.15, 0.07), mats.rgbBase.clone());
      ramTop.position.set(halfW - 0.2, 4.85, 0.2 + i * 0.12);
      pcGroup.add(ramTop);
      addRGB(ramTop, 0.3 + i*0.05);
    }

    // Vertical GPU Mount
    const gpuGroup = new THREE.Group();
    gpuGroup.position.set(-0.2, 2.5, 0);
    pcGroup.add(gpuGroup);

    const gpuBody = new THREE.Mesh(new RoundedBoxGeometry(0.6, 2.8, 1.6, 4, 0.05), mats.blackPlastic);
    gpuGroup.add(gpuBody);
    const gpuPlate = new THREE.Mesh(new RoundedBoxGeometry(0.1, 2.7, 1.5, 2, 0.02), mats.aluminum);
    gpuPlate.position.x = -0.35;
    gpuGroup.add(gpuPlate);

    const logoShape = new THREE.Shape();
    logoShape.moveTo(0, 0.5); logoShape.lineTo(0.4, 0); logoShape.lineTo(0, -0.5); logoShape.lineTo(-0.4, 0); logoShape.lineTo(0, 0.5);
    const logoGeo = new THREE.ShapeGeometry(logoShape);
    const gpuLogo = new THREE.Mesh(logoGeo, mats.rgbBase.clone());
    gpuLogo.rotation.y = -Math.PI/2;
    gpuLogo.position.set(-0.41, 0, 0);
    gpuGroup.add(gpuLogo);
    addRGB(gpuLogo, 0.5);

    // Fans
    function createFan(size = 1.2, isIntake = true) {
      const group = new THREE.Group();
      const f1 = new THREE.Mesh(new RoundedBoxGeometry(size, 0.1, 0.1, 2, 0.02), mats.blackPlastic);
      f1.position.y = size/2;
      const f2 = f1.clone(); f2.position.y = -size/2;
      const f3 = new THREE.Mesh(new RoundedBoxGeometry(0.1, size, 0.1, 2, 0.02), mats.blackPlastic);
      f3.position.x = size/2;
      const f4 = f3.clone(); f4.position.x = -size/2;
      group.add(f1, f2, f3, f4);

      const impeller = new THREE.Group();
      const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.15, 0.15, 0.12, 16), mats.blackPlastic);
      hub.rotation.x = Math.PI/2;
      impeller.add(hub);

      const bladeGeo = new RoundedBoxGeometry(0.35, 0.02, 0.12, 2, 0.02);
      for (let i = 0; i < 7; i++) {
        const blade = new THREE.Mesh(bladeGeo, mats.blackPlastic);
        blade.position.set(0.2, 0, 0);
        blade.rotation.z = 0.4;
        const pivot = new THREE.Group();
        pivot.rotation.z = (i / 7) * Math.PI * 2;
        pivot.add(blade);
        impeller.add(pivot);
      }
      group.add(impeller);

      const ring = new THREE.Mesh(new THREE.TorusGeometry(size/2 - 0.1, 0.025, 8, 32), mats.rgbBase.clone());
      group.add(ring);
      addRGB(ring, Math.random() * 0.6);

      fans.push({ impeller, axis: 'z', dir: isIntake ? 1 : -1 });
      return group;
    }

    // Front Fans
    [1.2, 2.6, 4.0].forEach(y => {
      const fan = createFan(1.2, true);
      fan.position.set(0, y, halfD - 0.25);
      pcGroup.add(fan);
    });

    // Top Fans
    [-0.8, 0.8].forEach(x => {
      const fan = createFan(1.2, false);
      fan.rotation.x = -Math.PI/2;
      fan.position.set(x, H - 0.25, -1.0);
      pcGroup.add(fan);
    });

    // GPU Fans
    const gf1 = createFan(1.0, true);
    gf1.rotation.y = -Math.PI/2;
    gf1.position.set(-0.32, 0.6, 0);
    gpuGroup.add(gf1);
    const gf2 = createFan(1.0, true);
    gf2.rotation.y = -Math.PI/2;
    gf2.position.set(-0.32, -0.6, 0);
    gpuGroup.add(gf2);

    // PSU Shroud
    const shroud = new THREE.Mesh(new RoundedBoxGeometry(2.8, 0.8, 2.0, 4, 0.05), mats.caseMetal);
    shroud.position.set(0, 0.5, -1.0);
    pcGroup.add(shroud);
    const psuLogo = new THREE.Mesh(new THREE.PlaneGeometry(0.8, 0.2), mats.rgbBase.clone());
    psuLogo.rotation.y = -Math.PI/2;
    psuLogo.position.set(-1.41, 0.5, -1.0);
    pcGroup.add(psuLogo);
    addRGB(psuLogo, 0.7);

    // RGB Strips on Frame
    function addRGBStrip(w, h, d, x, y, z, delay) {
      const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mats.rgbBase.clone());
      m.position.set(x, y, z);
      pcGroup.add(m);
      addRGB(m, delay);
    }
    addRGBStrip(0.05, H-0.3, 0.05, -halfW+0.05, H/2, halfD-0.05, 0.8);
    addRGBStrip(0.05, H-0.3, 0.05, halfW-0.05, H/2, halfD-0.05, 0.8);
    addRGBStrip(W-0.3, 0.05, 0.05, 0, H-0.1, halfD-0.05, 0.8);

    // Coolant Loop
    const curvePoints = [
      new THREE.Vector3(1.0, 1.0, 1.5),
      new THREE.Vector3(1.0, 2.5, 1.5),
      new THREE.Vector3(1.0, 3.4, -1.1),
      new THREE.Vector3(0.0, 4.8, -1.0),
      new THREE.Vector3(-1.2, 3.5, -2.0),
      new THREE.Vector3(-1.2, 2.0, 1.8),
      new THREE.Vector3(0.0, 1.0, 1.5)
    ];
    coolingCurve = new THREE.CatmullRomCurve3(curvePoints, true, 'catmullrom', 0.5);
    const tubeGeo = new THREE.TubeGeometry(coolingCurve, 100, 0.07, 8, true);
    const tubeMesh = new THREE.Mesh(tubeGeo, mats.tube);
    pcGroup.add(tubeMesh);

    for (let i = 0; i < 4; i++) {
      const sMat = new THREE.MeshStandardMaterial({ color: 0x000000, emissive: new THREE.Color(state.rgbColor), emissiveIntensity: 2 });
      const sph = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), sMat);
      pcGroup.add(sph);
      flowSpheres.push(sph);
    }

    // Reservoir
    const res = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 1.5, 32), mats.glass);
    res.position.set(1.0, 1.75, 1.5);
    res.castShadow = false;
    pcGroup.add(res);
    const resLiquid = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.27, 1.4, 32), new THREE.MeshStandardMaterial({ color: 0x000000, emissive: new THREE.Color(state.rgbColor), emissiveIntensity: 0.5, transparent: true, opacity: 0.8 }));
    resLiquid.position.set(1.0, 1.75, 1.5);
    pcGroup.add(resLiquid);
    addRGB(resLiquid, 0.2);

    // Ambient RGB Lights
    addRGBLight(0, 3, 1.5);
    addRGBLight(0, 4, -1.0);
    addRGBLight(0, 2, 0);

    // Floor
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(50, 50), new THREE.MeshStandardMaterial({ color: 0x0a0a0c, roughness: 0.8 }));
    floor.rotation.x = -Math.PI/2;
    floor.receiveShadow = true;
    scene.add(floor);

    // Enable Shadows
    pcGroup.traverse(child => {
      if (child.isMesh && child.material !== mats.glass) {
        child.castShadow = true;
        child.receiveShadow = true;
      }
    });

    // --- Interactivity ---
    const powerBtn = document.getElementById('powerBtn');
    powerBtn.addEventListener('click', () => {
      state.powered = !state.powered;
      powerBtn.classList.toggle('active', state.powered);
    });

    const rgbPicker = document.getElementById('rgbPicker');
    const rgbHex = document.getElementById('rgbHex');
    rgbPicker.addEventListener('input', (e) => {
      state.rgbColor = e.target.value;
      document.documentElement.style.setProperty('--accent', state.rgbColor);
      rgbHex.innerText = state.rgbColor.toUpperCase();
    });

    const fanSlider = document.getElementById('fanSlider');
    const fanVal = document.getElementById('fanVal');
    fanSlider.addEventListener('input', (e) => {
      state.fanSpeedTarget = e.target.value / 100;
      fanVal.innerText = e.target.value + '%';
    });

    const profileBtns = document.querySelectorAll('.btn-profile');
    profileBtns.forEach(btn => {
      btn.addEventListener('click', (e) => {
        profileBtns.forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        state.mode = e.target.dataset.mode;
      });
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });

    // HUD Elements
    const elSysStatus = document.getElementById('sysStatus');
    const elCpuTemp = document.getElementById('cpuTemp');
    const elGpuTemp = document.getElementById('gpuTemp');
    const elFanRpm = document.getElementById('fanRpm');
    const elPostCode = document.getElementById('postCode');

    function updateHUD() {
      if (!state.powered && state.bootProgress < 0.1) {
        elSysStatus.innerText = 'OFFLINE';
        elSysStatus.className = 'status-value offline';
        elCpuTemp.innerText = '-- °C';
        elGpuTemp.innerText = '-- °C';
        elFanRpm.innerText = '0 RPM';
        elPostCode.innerText = '--';
        return;
      }

      if (state.bootProgress < 1) {
        elSysStatus.innerText = 'BOOTING...';
        elSysStatus.className = 'status-value booting';
        elPostCode.innerText = '00';
      } else {
        elSysStatus.innerText = 'ONLINE';
        elSysStatus.className = 'status-value online';
        elPostCode.innerText = 'FF';
      }

      const targetCpu = 35 + state.fanSpeedCurrent * 20 + Math.random() * 2;
      const targetGpu = 45 + state.fanSpeedCurrent * 25 + Math.random() * 2;
      state.cpuTemp += (targetCpu - state.cpuTemp) * 0.1;
      state.gpuTemp += (targetGpu - state.gpuTemp) * 0.1;

      elCpuTemp.innerText = Math.round(state.cpuTemp) + ' °C';
      elGpuTemp.innerText = Math.round(state.gpuTemp) + ' °C';
      elFanRpm.innerText = Math.round(state.fanSpeedCurrent * 2000) + ' RPM';
    }

    // --- Animation Loop ---
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(), 0.1);
      state.time += dt;

      // Boot logic
      if (state.powered) {
        state.bootProgress = Math.min(1, state.bootProgress + dt * 0.4);
      } else {
        state.bootProgress = Math.max(0, state.bootProgress - dt * 1.5);
      }

      // Fan logic
      const targetFan = state.powered ? state.fanSpeedTarget * (state.mode === 'turbo' ? 1.5 : 1.0) : 0;
      state.fanSpeedCurrent += (targetFan - state.fanSpeedCurrent) * dt * 2;
      
      fans.forEach(f => {
        f.impeller.rotation[f.axis] += state.fanSpeedCurrent * dt * 30 * f.dir;
      });

      // RGB logic
      const rgbColor = new THREE.Color(state.rgbColor);
      
      rgbElements.forEach(el => {
        el.mesh.material.emissive.copy(rgbColor);
        let localIntensity = Math.max(0, Math.min(1, (state.bootProgress - el.delay) * 5)) * 2.0 * (state.mode === 'turbo' ? 1.5 : 1.0);
        if (state.mode === 'turbo' && state.powered) {
          localIntensity += Math.sin(state.time * 10) * 0.3 * localIntensity;
        }
        el.mesh.material.emissiveIntensity = localIntensity;
      });

      let baseLightIntensity = state.bootProgress * 3 * (state.mode === 'turbo' ? 1.5 : 1.0);
      if (state.mode === 'turbo' && state.powered) {
        baseLightIntensity += Math.sin(state.time * 10) * 0.5 * state.bootProgress;
      }

      pointLights.forEach(l => {
        l.color.copy(rgbColor);
        l.intensity = Math.max(0, baseLightIntensity);
      });

      // Flow logic
      flowSpheres.forEach((sphere, i) => {
        let t = (state.time * state.fanSpeedCurrent * 0.05 + i * 0.25) % 1;
        sphere.position.copy(coolingCurve.getPointAt(t));
        sphere.material.emissive.copy(rgbColor);
        sphere.material.emissiveIntensity = state.bootProgress * 3;
        sphere.visible = state.bootProgress > 0.1;
      });

      updateHUD();
      controls.update();
      composer.render();
    }
    
    animate();
  </script>
</body>
</html>
