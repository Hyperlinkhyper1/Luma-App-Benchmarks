<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="color-scheme" content="dark"/>
<title>NOCT // MONOLITH M-9 — Interactive Showcase</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/chakra-petch@5/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/chakra-petch@5/500.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/chakra-petch@5/700.css">
<style>
:root{--acc:#25e0d0;--panel:rgba(13,15,18,.84);--line:rgba(255,255,255,.09);--tx:#e8ebef;--mut:#8b93a0}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#08090c;color:var(--tx);font-family:'Chakra Petch',ui-monospace,'Cascadia Mono',Consolas,monospace;user-select:none;-webkit-user-select:none}
#stage{position:fixed;inset:0}
#stage canvas{display:block}
#brand{position:fixed;top:16px;left:20px;pointer-events:none;z-index:15}
#brand .b1{font-size:15px;font-weight:700;letter-spacing:.24em;color:#f2f4f7}
#brand .b1 span{color:var(--acc);margin:0 7px;font-weight:400}
#brand .b2{margin-top:5px;font-size:9.5px;letter-spacing:.18em;color:#78808c}
#toast{position:fixed;top:18px;left:50%;transform:translateX(-50%) translateY(-8px);background:var(--panel);border:1px solid var(--line);padding:7px 14px;font-size:10px;letter-spacing:.16em;border-radius:8px;opacity:0;transition:.35s;pointer-events:none;z-index:40;backdrop-filter:blur(10px)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#tip{position:fixed;pointer-events:none;background:var(--panel);border:1px solid var(--line);border-left:2px solid var(--acc);padding:6px 10px;font-size:10px;letter-spacing:.08em;border-radius:6px;opacity:0;transition:opacity .15s;z-index:30;max-width:250px;backdrop-filter:blur(10px)}
#tip b{display:block;font-size:11px;letter-spacing:.14em;color:#fff}
#tip i{color:var(--mut);font-style:normal;font-size:9px;letter-spacing:.12em}
#card{position:fixed;left:20px;bottom:20px;width:302px;background:var(--panel);border:1px solid var(--line);border-top:2px solid var(--acc);border-radius:12px;padding:14px 16px;backdrop-filter:blur(12px);z-index:20;transition:.3s}
#card.hide{opacity:0;transform:translateY(12px);pointer-events:none}
#cardX{position:absolute;top:8px;right:10px;background:none;border:none;color:var(--mut);font-size:16px;line-height:1;cursor:pointer}
#cardX:hover{color:#fff}
.cName{font-size:14px;font-weight:700;letter-spacing:.13em;padding-right:16px}
.cSub{font-size:9.5px;letter-spacing:.2em;color:var(--acc);margin:4px 0 8px}
.cDesc{font-size:11px;line-height:1.55;color:#b9c0ca}
#hud{position:fixed;right:14px;bottom:14px;width:302px;background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(14px);z-index:25;overflow:hidden}
#hudHead{display:flex;align-items:center;gap:9px;padding:10px 14px;border-bottom:1px solid var(--line)}
#hudHead .ttl{font-size:11px;font-weight:700;letter-spacing:.28em;flex:1}
.dot{width:8px;height:8px;border-radius:50%;background:#4a4f57;transition:.4s;flex:none}
.dot.boot{background:#e2a63c;box-shadow:0 0 8px #e2a63c}
.dot.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
.dot.down{background:#d05a4e;box-shadow:0 0 8px #d05a4e}
#hudMin{background:none;border:none;color:var(--mut);cursor:pointer;padding:2px;display:grid;place-items:center}
#hudMin svg{transition:.3s}
#hud.min #hudMin svg{transform:rotate(180deg)}
#hud.min #hudBody{display:none}
#hudBody{max-height:calc(100vh - 200px);overflow-y:auto;scrollbar-width:thin;scrollbar-color:#2b3038 transparent}
#hudBody::-webkit-scrollbar{width:6px}
#hudBody::-webkit-scrollbar-thumb{background:#2b3038;border-radius:3px}
.powerRow{display:flex;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);align-items:center}
.pbtn{width:56px;height:56px;flex:none;border-radius:50%;border:1px solid #3a4048;background:#16181d;color:#99a1ac;cursor:pointer;display:grid;place-items:center;transition:.2s;box-shadow:inset 0 1px 0 rgba(255,255,255,.06)}
.pbtn:hover{border-color:#59616c;color:#dfe4ea}
.pbtn:active{transform:scale(.93)}
.pbtn.on{color:var(--acc);border-color:var(--acc);box-shadow:0 0 16px -4px var(--acc),inset 0 0 12px -7px var(--acc)}
.pcol{flex:1;min-width:0}
.state{font-size:12px;font-weight:700;letter-spacing:.2em}
.uptime{font-size:9px;letter-spacing:.18em;color:var(--mut);margin-top:2px}
.log{margin-top:6px;font-size:8.5px;line-height:1.5;color:#69727e;letter-spacing:.04em;max-height:46px;overflow:hidden}
.log div:last-child{color:var(--acc)}
.sec{padding:10px 14px;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:none}
.secT{font-size:8.5px;letter-spacing:.3em;color:var(--mut);margin-bottom:8px}
.chips{display:flex;gap:5px;margin-bottom:7px;flex-wrap:wrap}
.chip{flex:1;min-width:0;padding:5px 2px;background:none;border:1px solid #2b3038;color:#98a0ac;font-family:inherit;font-size:8.5px;letter-spacing:.1em;border-radius:6px;cursor:pointer;transition:.15s;white-space:nowrap;text-align:center}
.chip:hover{border-color:#4a525d;color:#dfe4ea}
.chip.on{border-color:var(--acc);color:#fff;background:rgba(255,255,255,.06)}
.sl{display:flex;align-items:center;gap:8px;margin:7px 0}
.sl span{font-size:8.5px;letter-spacing:.18em;color:var(--mut);width:30px;flex:none}
.sl b{font-size:9px;color:var(--tx);width:54px;text-align:right;font-weight:500;flex:none}
input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;border-radius:3px;background:#2b3038;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:#e8ebef;border:2px solid #0d0f12;box-shadow:0 0 0 1px #3a4048;cursor:pointer}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;background:#e8ebef;border:2px solid #0d0f12}
#hueR{background:linear-gradient(90deg,#f33,#ff0,#3f3,#0ff,#33f,#f3f,#f33)}
.sw{display:flex;gap:6px;margin-top:8px}
.sw button{width:17px;height:17px;border-radius:50%;border:1px solid rgba(255,255,255,.2);cursor:pointer;padding:0}
.sw button.on{box-shadow:0 0 0 2px #0d0f12,0 0 0 3px #fff}
.wbtn{width:100%;padding:7px;background:none;border:1px solid #3a4048;color:#c6ccd4;font-family:inherit;font-size:9.5px;letter-spacing:.22em;border-radius:7px;cursor:pointer;transition:.15s}
.wbtn:hover{border-color:#5a626d;color:#fff}
.wbtn.on{border-color:#e2a63c;color:#e2a63c;background:rgba(226,166,60,.08)}
.bar{display:flex;align-items:center;gap:8px;margin:6px 0}
.bar span{font-size:8.5px;letter-spacing:.18em;color:var(--mut);width:26px;flex:none}
.track{flex:1;height:5px;background:#22262c;border-radius:3px;overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--acc);border-radius:3px;transition:width .3s}
.track i.hot{background:#d05a4e}
.bar b{font-size:9px;width:44px;text-align:right;font-weight:500;flex:none}
@media(max-width:820px){#brand .b2{display:none}#hud{width:min(302px,calc(100vw - 20px))}}
</style>
</head>
<body>
<div id="stage"></div>

<header id="brand">
  <div class="b1">NOCT<span>//</span>MONOLITH M-9</div>

      <label class="sl"><span>SAT</span><input type="range" id="satR" min="0" max="100" value="100"></label>

        <button class="chip" data-c="top">TOP</button>
        <button class="chip" data-c="gpu">GPU</button>
      </div>
      <div class="chips" style="margin-bottom:0">
        <button class="chip on" id="tglGlass">PANELS</button>
        <button class="chip" id="tglSpin">SPIN</button>
        <button class="chip" id="tglSnd">SOUND</button>
      </div>
    </div>
  </div>
</aside>

<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {RoomEnvironment} from 'three/addons/environments/RoomEnvironment.js';
import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';
import {RenderPass} from 'three/addons/postprocessing/RenderPass.js';
import {UnrealBloomPass} from 'three/addons/postprocessing/UnrealBloomPass.js';
import {OutputPass} from 'three/addons/postprocessing/OutputPass.js';

/* ============================ small helpers ============================ */
const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const easeIO=k=>k<.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;

const toastEl=$('toast');let toastT=null;
function toast(msg){toastEl.textContent=msg;toastEl.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>toastEl.classList.remove('show'),2000);}
function pushLog(txt){
  const b=$('logBox'),d=document.createElement('div');
  d.textContent='['+st.tMode.toFixed(1)+'s] '+txt;b.appendChild(d);
  while(b.children.length>4)b.removeChild(b.firstChild);
}

/* ============================ renderer / scene ============================ */
const stage=$('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;
stage.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x08090c);
scene.fog=new THREE.Fog(0x08090c,14,32);

const camera=new THREE.PerspectiveCamera(40,innerWidth/innerHeight,0.1,120);
camera.position.set(5.4,3.4,7.6);

const controls=new OrbitControls(camera,renderer.domElement);
controls.target.set(0.15,2.45,0);
controls.enableDamping=true;controls.dampingFactor=0.08;
controls.minDistance=2.4;controls.maxDistance=18;
controls.maxPolarAngle=1.53;controls.autoRotateSpeed=0.9;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(renderer),0.04).texture;
pmrem.dispose();

const composer=new EffectComposer(renderer);
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth,innerHeight),0.55,0.6,1.0);
composer.addPass(bloom);
composer.addPass(new OutputPass());

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setPixelRatio(Math.min(devicePixelRatio,2));
  renderer.setSize(innerWidth,innerHeight);
  composer.setSize(innerWidth,innerHeight);
});

/* ============================ procedural textures ============================ */
function cnv(w,h,draw){
  const c=document.createElement('canvas');c.width=w;c.height=h;
  draw(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;
  return t;
}
// perforated vent (used as alpha map: white = metal, black = hole)
const holeTex=cnv(128,128,(g)=>{
  g.fillStyle='#fff';g.fillRect(0,0,128,128);g.fillStyle='#000';
  for(let y=0;y<4;y++)for(let x=0;x<4;x++){g.beginPath();g.arc(x*32+16+(y%2)*16-((y%2)*16>16?32:0),y*32+16,11,0,7);g.fill();}
});
holeTex.wrapS=holeTex.wrapT=THREE.RepeatWrapping;holeTex.repeat.set(5,8);
// motherboard PCB
const pcbTex=cnv(512,640,(g,w,h)=>{
  g.fillStyle='#111714';g.fillRect(0,0,w,h);
  g.strokeStyle='rgba(74,116,96,.28)';g.lineWidth=2;
  for(let i=0;i<46;i++){g.beginPath();let x=Math.random()*w,y=Math.random()*h;g.moveTo(x,y);
    for(let s=0;s<4;s++){x+=(Math.random()-0.5)*140;y+=(Math.random()-0.5)*140;g.lineTo(x,y);}g.stroke();}
  g.fillStyle='rgba(150,190,170,.35)';
  for(let i=0;i<220;i++){g.beginPath();g.arc(Math.random()*w,Math.random()*h,1.6,0,7);g.fill();}
  g.strokeStyle='rgba(210,220,215,.4)';g.lineWidth=2;g.strokeRect(12,12,w-24,h-24);
  g.fillStyle='rgba(220,228,224,.75)';g.font='700 22px monospace';
  g.fillText('NOCT NB-9 · X850-DUO',26,42);g.font='500 14px monospace';
  g.fillText('16+2 POWER STAGE · PCIE 5.0',26,64);
});
// emissive name plates (map + emissiveMap share the canvas)
const gpuPlateTex=cnv(1024,144,(g,w,h)=>{
  g.fillStyle='#0a0b0e';g.fillRect(0,0,w,h);
  g.fillStyle='#262b31';g.fillRect(0,h-8,w,4);
  g.font='700 86px "Chakra Petch",monospace';g.fillStyle='#e6e9ee';g.textAlign='right';g.fillText('VELA-9',996,100);
  g.font='500 28px "Chakra Petch",monospace';g.fillStyle='#a9b1bb';g.textAlign='left';
  g.fillText('NOCT // GDDR7 · 24GB · TRIPLE FLOW',28,96);
});
const chipsetTex=cnv(256,96,(g,w,h)=>{
  g.fillStyle='#0a0b0e';g.fillRect(0,0,w,h);
  g.font='700 52px "Chakra Petch",monospace';g.fillStyle='#dfe3e8';g.textAlign='center';
  g.fillText('NOCT',128,62);
});
const psuTex=cnv(512,256,(g,w,h)=>{
  g.fillStyle='#141518';g.fillRect(0,0,w,h);
  g.strokeStyle='#c9a24a';g.lineWidth=4;g.strokeRect(10,10,w-20,h-20);
  g.fillStyle='#e8e4d8';g.font='700 78px "Chakra Petch",monospace';g.textAlign='center';g.fillText('NOCT',256,110);
  g.font='500 26px "Chakra Petch",monospace';g.fillStyle='#c9a24a';
  g.fillText('VOLTAGE 1000G · TITANIUM',256,168);g.fillStyle='#7d8590';
  g.fillText('FULLY MODULAR · 12V-2x6',256,206);
});
const badgeTex=cnv(512,96,(g,w,h)=>{
  g.fillStyle='#101215';g.fillRect(0,0,w,h);
  g.fillStyle='#b9bec6';g.font='700 44px "Chakra Petch",monospace';g.textAlign='center';
  g.fillText('MONOLITH M-9',256,60);
  g.fillStyle='#4a5058';g.fillRect(156,74,200,3);
});
const glowTex=cnv(256,256,(g,w,h)=>{
  const r=g.createRadialGradient(128,128,4,128,128,128);
  r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(0.4,'rgba(255,255,255,.35)');r.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=r;g.fillRect(0,0,w,h);
});
// live OLED
const oC=document.createElement('canvas');oC.width=256;oC.height=144;
const octx=oC.getContext('2d');
const oTex=new THREE.CanvasTexture(oC);oTex.colorSpace=THREE.SRGBColorSpace;

/* ============================ materials ============================ */
function std(color,o={}){
  const m=new THREE.MeshStandardMaterial({color,metalness:o.mt??0.25,roughness:o.rg??0.7,
    map:o.map||null,envMapIntensity:o.ei??0.6});
  if(o.alphaMap){m.alphaMap=o.alphaMap;m.alphaTest=o.alphaTest??0.4;m.side=THREE.DoubleSide;}
  return m;
}
function emat(base,rg){
  return new THREE.MeshStandardMaterial({color:base,roughness:rg??0.5,metalness:0.15,
    emissive:0xffffff,emissiveIntensity:0,side:THREE.DoubleSide});
}
const M={
  alu:std(0x2b2e33,{mt:.85,rg:.38,ei:.9}),
  aluD:std(0x1b1d21,{mt:.8,rg:.52,ei:.7}),
  matte:std(0x101114,{mt:.2,rg:.85,ei:.4}),
  inner:std(0x141518,{mt:.45,rg:.7,ei:.5}),
  hub:std(0x33383f,{mt:.9,rg:.28,ei:.9}),
  blade:std(0x191c20,{mt:.4,rg:.5,ei:.6}),
  fanFrame:std(0x17191c,{mt:.5,rg:.6,ei:.6}),
  hsink:std(0x3a3f46,{mt:.9,rg:.42,ei:.8}),
  steel:std(0x9aa1a8,{mt:.95,rg:.3,ei:1}),
  rubber:std(0x17181b,{mt:.1,rg:.85,ei:.4}),
  gold:std(0xc9a24a,{mt:1,rg:.35,ei:1}),
  pcb:std(0xffffff,{map:pcbTex,mt:.35,rg:.58,ei:.5}),
  vent:std(0x191c20,{mt:.7,rg:.55,ei:.7,alphaMap:holeTex,alphaTest:.4}),
  glass:new THREE.MeshPhysicalMaterial({color:0x101418,metalness:0,roughness:0.06,transparent:true,opacity:0.16,envMapIntensity:1.8,side:THREE.DoubleSide,depthWrite:false}),
  glassS:new THREE.MeshPhysicalMaterial({color:0x0b0e10,metalness:0,roughness:0.09,transparent:true,opacity:0.5,envMapIntensity:1.5,side:THREE.DoubleSide,depthWrite:false}),
};

/* ============================ geometry helpers ============================ */
function roundedRect(w,h,r){
  const s=new THREE.Shape(),x=-w/2,y=-h/2;
  s.moveTo(x+r,y);s.lineTo(x+w-r,y);s.quadraticCurveTo(x+w,y,x+w,y+r);
  s.lineTo(x+w,y+h-r);s.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  s.lineTo(x+r,y+h);s.quadraticCurveTo(x,y+h,x,y+h-r);
  s.lineTo(x,y+r);s.quadraticCurveTo(x,y,x+r,y);
  return s;
}
function circHole(cx,cy,r){const p=new THREE.Path();p.absarc(cx,cy,r,0,Math.PI*2,true);return p;}
function box(w,h,d,mat,x,y,z,parent){
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}
function cyl(rt,rb,h,mat,x,y,z,parent,seg=22){
  const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),mat);
  m.position.set(x,y,z);m.castShadow=true;m.receiveShadow=true;parent.add(m);return m;
}

/* ============================ fan factory ============================ */
const bladeGeo=(()=>{ // shared blade shape (unit scale, scaled per fan)
  const s=new THREE.Shape();
  s.moveTo(0.05,0.03);s.quadraticCurveTo(0.35,0.02,0.62,0.28);

function makeFan(r,o={}){
  const g=new THREE.Group();

  if(o.frame!==false){

    const fg=new THREE.ExtrudeGeometry(sh,{depth:0.16,bevelEnabled:false});fg.translate(0,0,-0.08);
    const fm=new THREE.Mesh(fg,M.fanFrame);fm.castShadow=true;g.add(fm);
  }
  const disc=new THREE.Mesh(new THREE.RingGeometry(r*0.3,r+0.005,44),em);
  disc.position.z=o.frame===false?-0.03:-0.05;g.add(disc);
  const ring=new THREE.Mesh(new THREE.TorusGeometry(r+0.03,0.018,10,48),em);
  ring.position.z=o.frame===false?0.025:0.085;g.add(ring);
  const rot=new THREE.Group();
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(r*0.3,r*0.3,0.13,20),M.hub);
  hub.rotation.x=Math.PI/2;hub.castShadow=true;rot.add(hub);
  const k=(r-0.03)/0.68;
  for(let i=0;i<7;i++){
    const p=new THREE.Group();p.rotation.z=i/7*Math.PI*2;
    const b=new THREE.Mesh(bladeGeo,M.blade);b.scale.setScalar(k);
    b.position.x=r*0.18;b.rotation.x=0.6;b.castShadow=true;p.add(b);rot.add(p);
  }
  const dot=new THREE.Mesh(new THREE.CircleGeometry(r*0.055,10),em);
  dot.position.set(r*0.13,0,o.frame===false?0.035:0.072);rot.add(dot);
  g.add(rot);
  return {g,rot,mat:em};
}

const sys={fanUser:0.55,load:0.16,stress:false,cpuT:29,gpuT:27,
  rgb:{h:178,s:1,b:0.85},rgbMode:'static'};
const BOOT_SCRIPT=[
  [0.05,'12V RAIL OK · EPS SENSE OK'],
  [0.55,'NOCT UEFI v2.4.1 — POST'],
  [1.2,'CPU KRYO-16 · 16C/32T DETECTED'],

function setMode(m){
  st.mode=m;st.tMode=0;st.bootIdx=0;st.dLog=0;

function powerToggle(){

  else if(st.mode==='boot'){setMode('down');pushLog('BOOT ABORTED');blip(300,120);}

}
function stepState(dt){
  st.tMode+=dt;
  if(st.mode==='boot'){
    while(st.bootIdx<BOOT_SCRIPT.length&&st.tMode>=BOOT_SCRIPT[st.bootIdx][0]){pushLog(BOOT_SCRIPT[st.bootIdx][1]);st.bootIdx++;}
    if(st.tMode>=4.6){setMode('on');pushLog('SYSTEM ONLINE — RGB SYNC ACTIVE');toast('System online');}
  }else if(st.mode==='down'){
    if(!st.dLog&&st.tMode>0.1){st.dLog=1;pushLog('SHUTDOWN SIGNAL RECEIVED');}
    if(st.tMode>2.6){setMode('off');pushLog('STANDBY — 12V TRACE ACTIVE');}

}

/* ============================ fans / coolant / temps ============================ */
function stepFans(dt){
  let target=0;
  if(st.mode==='boot')target=Math.min(0.5,Math.max(0,(st.tMode-0.5)*0.7))+(st.tMode>3.4?Math.min(0.5,(st.tMode-3.4)*0.6):0);
  else if(st.mode==='on')target=Math.max(0.25,sys.fanUser,sys.stress?1:0);
  const rate=target>st.fan?0.9:0.45;
  st.fan+=(target-st.fan)*Math.min(1,dt*rate);
  const wob=(st.mode==='boot'&&st.tMode<2.5)?1+0.5*Math.exp(-st.tMode)*Math.sin(st.tMode*25):1;
  for(const f of allFans)f.rot.rotation.z+=dt*st.fan*f.spd*wob;
  const p=st.mode==='off'?0:(4+st.fan*10);
  impCPU.rotation.x+=dt*p;impRes.rotation.y+=dt*p*0.8;
}
function stepCool(dt){
  const run=st.mode!=='off';
  for(const b of bubbles){
    const u=b.userData;
    if(run){u.off=(u.off+dt*(0.25+st.fan*0.5))%2.05;
      b.position.set(-0.95+Math.cos(u.a)*u.r,0.95+u.off,-1.3+Math.sin(u.a)*u.r+2.6-2.6+1.3);
      b.position.z=1.3+Math.sin(u.a)*u.r;b.material.opacity=0.35;
    }else b.material.opacity=Math.max(0,b.material.opacity-dt);
  }
}
function stepTemps(dt){
  const lT=(st.mode==='on'&&sys.stress)?0.95:(st.mode==='on'?0.16:0.03);
  sys.load+=(lT-sys.load)*Math.min(1,dt*(sys.stress?0.35:0.5));
  const wob=Math.sin(T*0.8)*1.2+Math.sin(T*2.3)*0.5;
  const cT=29+sys.load*50-st.fan*9+wob,gT=27+sys.load*57-st.fan*10+wob;
  sys.cpuT+=(cT-sys.cpuT)*Math.min(1,dt*2);sys.gpuT+=(gT-sys.gpuT)*Math.min(1,dt*2);
}

/* ============================ RGB engine ============================ */
const cTmp=new THREE.Color(),cCss=new THREE.Color();
let T=0,accHex='#25e0d0';
function frac(h){return h-Math.floor(h);}
function updateRGB(t){
  const whiteMix=st.mode==='boot'?clamp((st.tMode-3.3)/1.2,0,1):1;
  for(const el of rgbEls){
    let lv=0;
    if(st.mode==='on')lv=1;
    else if(st.mode==='boot')lv=clamp((st.tMode-el.at)/0.45,0,1);
    else if(st.mode==='down'){
      lv=1-clamp((st.tMode-0.25)/0.85,0,1);
      if(st.tMode<0.9)lv*=0.45+0.55*Math.abs(Math.sin(t*42+el.ph*9));
    }
    if(lv<=0.003){el.mat.emissiveIntensity=0;continue;}
    let h=sys.rgb.h/360;
    if(sys.rgbMode==='wave')h+=el.ph*0.1+t*0.035;
    else if(sys.rgbMode==='rainbow')h+=t*0.07;
    let it=el.base*sys.rgb.b*lv;
    if(sys.rgbMode==='breathe')it*=0.4+0.6*(0.5+0.5*Math.sin(t*1.9-el.ph*2.6));
    if(sys.stress&&st.mode==='on')it*=0.88+0.24*Math.sin(t*9-el.ph*3);
    el.mat.emissive.setHSL(frac(h),sys.rgb.s*whiteMix,0.55);
    el.mat.emissiveIntensity=it;
  }
  let h=sys.rgb.h/360+(sys.rgbMode==='rainbow'?t*0.07:0);
  cTmp.setHSL(frac(h),sys.rgb.s*whiteMix,0.5);
  let gl=st.mode==='on'?1:st.mode==='boot'?clamp((st.tMode-1.2)/1.4,0,1):st.mode==='down'?1-clamp(st.tMode/1.2,0,1):0;
  if(st.mode==='down'&&st.tMode<0.9)gl*=0.5+0.5*Math.abs(Math.sin(t*42));
  glowPlane.material.color.copy(cTmp);
  glowPlane.material.opacity=0.5*gl*sys.rgb.b;
  stageRing.material.color.copy(cTmp).multiplyScalar(0.22+gl*0.85);
  [lightA,lightB,lightC,lightD].forEach((L,i)=>{L.color.copy(cTmp);L.intensity=[10,8,4.5,6][i]*gl*sys.rgb.b;});
  cCss.copy(cTmp);cCss.offsetHSL(0,0,0.12);
  accHex='#'+cCss.getHexString();
}

let camT=null,glassT=0,panelsClosed=true;
function flyTo(p,t,dur=1.25){
  camT={k:0,dur,p0:camera.position.clone(),p1:V3(p[0],p[1],p[2]),
    t0:controls.target.clone(),t1:V3(t[0],t[1],t[2])};
}
controls.addEventListener('start',()=>{camT=null;});
const VIEWS={
  glass:{p:[7.2,3.1,3.4],t:[0.2,2.5,0.1]},
  chamber:{p:[-6.2,2.7,3.6],t:[-0.8,2.1,0.4]},

function stepCam(dt){
  if(camT){
    camT.k+=dt;const k=easeIO(clamp(camT.k/camT.dur,0,1));

/* ============================ sound (procedural, optional) ============================ */
let AC=null,anGain=null,anFilt=null,soundOn=false;
function audioInit(){
  if(AC)return;
  try{
    AC=new (window.AudioContext||window.webkitAudioContext)();
    const len=2*AC.sampleRate,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    let l=0;for(let i=0;i<len;i++){l=l*0.96+(Math.random()*2-1)*0.045;d[i]=l*3.2;}
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    anFilt=AC.createBiquadFilter();anFilt.type='lowpass';anFilt.frequency.value=260;anFilt.Q.value=0.7;
    anGain=AC.createGain();anGain.gain.value=0;
    src.connect(anFilt);anFilt.connect(anGain);anGain.connect(AC.destination);src.start();
  }catch(e){AC=null;}
}
function blip(f0,f1,dur=0.1,vol=0.1){
  if(!AC||!soundOn)return;
  try{
    const o=AC.createOscillator(),g=AC.createGain();
    o.type='triangle';o.frequency.setValueAtTime(f0,AC.currentTime);
    o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),AC.currentTime+dur);
    g.gain.setValueAtTime(vol,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);
    o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+dur+0.02);
  }catch(e){}
}
function stepAudio(){
  if(!anGain)return;
  const t=(soundOn&&st.fan>0.02)?0.035+st.fan*0.085:0;
  anGain.gain.value+=(t-anGain.gain.value)*0.08;
  anFilt.frequency.value=200+st.fan*750;
}

  $('cpuBar').style.width=cT===null?'0%':clamp((cT-25)/95,0,1)*100+'%';
  $('gpuBar').style.width=gT===null?'0%':clamp((gT-25)/95,0,1)*100+'%';
  $('cpuBar').classList.toggle('hot',cT!==null&&cT>85);
  $('gpuBar').classList.toggle('hot',gT!==null&&gT>85);
}

/* ============================ 3D picking + part inspector ============================ */
const raycaster=new THREE.Raycaster();
const ndc=new THREE.Vector2();
const tip=$('tip'),card=$('card');
let downPos=null,lastPickT=0;
renderer.domElement.addEventListener('pointermove',e=>{
  if(e.buttons!==0){tip.style.opacity=0;return;}
  const now=performance.now();if(now-lastPickT<60)return;lastPickT=now;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const hits=raycaster.intersectObjects(pickRoots,true);
  let pk=null;
  for(const h of hits){let o=h.object;while(o&&!o.userData.pick)o=o.parent;if(o){pk=o.userData.pick;break;}}
  if(pk){
    tip.innerHTML='<b>'+pk.name+'</b><i>'+(pk.power?'click to toggle power':'click to inspect')+'</i>';
    tip.style.left=Math.min(innerWidth-260,e.clientX+16)+'px';
    tip.style.top=Math.min(innerHeight-70,e.clientY+14)+'px';
    tip.style.opacity=1;renderer.domElement.style.cursor='pointer';
  }else{tip.style.opacity=0;renderer.domElement.style.cursor='';}
});
renderer.domElement.addEventListener('pointerleave',()=>{tip.style.opacity=0;});
renderer.domElement.addEventListener('pointerdown',e=>{downPos=[e.clientX,e.clientY];});
renderer.domElement.addEventListener('pointerup',e=>{
  if(!downPos)return;
  const moved=Math.hypot(e.clientX-downPos[0],e.clientY-downPos[1]);downPos=null;
  if(moved>6)return;
  ndc.set(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1);
  raycaster.setFromCamera(ndc,camera);
  const hits=raycaster.intersectObjects(pickRoots,true);
  for(const h of hits){
    let o=h.object;while(o&&!o.userData.pick)o=o.parent;
    if(!o)continue;
    const pk=o.userData.pick;
    if(pk.power){powerToggle();return;}
    if(pk.cam)flyTo(pk.cam.p,pk.cam.t);
    $('cName').textContent=pk.name;
    $('cSub').textContent=pk.sub;
    $('cDesc').textContent=pk.desc;
    card.classList.remove('hide');
    tip.style.opacity=0;
    return;
  }
});
$('cardX').addEventListener('click',()=>card.classList.add('hide'));
addEventListener('keydown',e=>{if(e.key==='Escape')card.classList.add('hide');});

/* ============================ main loop ============================ */
const clock=new THREE.Clock();
let oledAcc=0,hudAcc=0;
function loop(){
  requestAnimationFrame(loop);
  const dt=Math.min(clock.getDelta(),0.05);T+=dt;
  stepState(dt);stepFans(dt);stepCool(dt);stepTemps(dt);
  updateRGB(T);
  stdMat.emissiveIntensity=st.mode==='off'?(Math.sin(T*3.5)>0?1.4:0.08):1.2;
  oledAcc+=dt;if(oledAcc>0.07){drawOLED();oledAcc=0;}
  hudAcc+=dt;if(hudAcc>0.15){refreshHUD();hudAcc=0;}
  stepCam(dt);stepPanels(dt);stepAudio();
  controls.update();
  composer.render();
}
paintSliders();hudState();refreshHUD();loop();
// autoboot so the showcase opens alive — the power button always stays in control
setTimeout(()=>{if(st.mode==='off'){toast('Showcase autoboot — press POWER anytime');powerToggle();}},1100);
</script>
