<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smoother=(t)=>t*t*(3-2*t);

function keysAt(pts,s){
  if(s<=pts[0][0])return pts[0][1];
  const n=pts.length;
  if(s>=pts[n-1][0])return pts[n-1][1];
  for(let i=0;i<n-1;i++){if(s<=pts[i+1][0]){const a=pts[i],b=pts[i+1];return lerp(a[1],b[1],smoother((s-a[0])/(b[0]-a[0])))}}
}
const L=4.5, HALFW=1.02, GROUND=0;
const S0=0, S1=1;

const WPT=[[0.00,0.06],[0.03,0.34],[0.09,0.58],[0.16,0.70],[0.26,0.80],[0.40,0.83],[0.52,0.82],[0.66,0.78],[0.78,0.72],[0.90,0.58],[1.00,0.14]];
const HPT=[[0.00,0.08],[0.03,0.18],[0.10,0.26],[0.20,0.315],[0.35,0.35],[0.50,0.36],[0.64,0.35],[0.76,0.31],[0.88,0.24],[1.00,0.07]];
const YPT=[[0.00,0.50],[0.05,0.63],[0.15,0.70],[0.35,0.735],[0.55,0.745],[0.70,0.735],[0.82,0.71],[0.94,0.65],[1.00,0.55]];
const wAt=s=>keysAt(WPT,clamp(s,0,1));
const hAt=s=>keysAt(HPT,clamp(s,0,1));
const yAt=s=>keysAt(YPT,clamp(s,0,1));
const SX=s=>(s-0.5)*L;

function bodyProfile(u,v,wid=1,hgt=1){
  const s=clamp(u,0,1);
  const w=wAt(s)*wid, h=hAt(s)*hgt, y=yAt(s)*hgt;
  const ang=v;
  return V(SX(s), y+h*Math.cos(ang), w*Math.sin(ang));
}

function loft(Ns,Nv,f,closed=true,scale=1,wid=1,hgt=1){
  const pos=[],uv=[],idx=[];
  for(let i=0;i<=Ns;i++){
    const u=i/Ns;
    for(let j=0;j<Nv;j++){
      const v=j/Nv*Math.PI*2;
      const p=f(u,v,scale,wid,hgt);
      pos.push(p.x,p.y,p.z);
      uv.push(u*4, v/Math.PI*2);
    }
  }
  for(let i=0;i<Ns;i++)for(let j=0;j<Nv;j++){
    const a=i*Nv+j, b=i*Nv+(j+1)%Nv, c=(i+1)*Nv+j, d=(i+1)*Nv+(j+1)%Nv;
    idx.push(a,c,b, b,c,d);
  }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

function windowShape(w,h,curve=1.0){
  const s=new THREE.Shape();
  const n=16;
  for(let i=0;i<n;i++){const a=-Math.PI/2+(Math.PI)*(i/(n-1)); const x=Math.cos(a)*w, y=Math.sin(a)*h*curve; i?s.lineTo(x,y):s.moveTo(x,y);}
  s.closePath(); return s;
}

const canvasPaint=document.createElement('canvas');canvasPaint.width=canvasPaint.height=512;
const cpx=canvasPaint.getContext('2d');
cpx.clearRect(0,0,512,512);
function weave(o){cpx.strokeStyle=o;for(let i=0;i<600;i++){const x=Math.random()*512,y=Math.random()*512;const a=Math.random()<.5?0:Math.PI/2;cpx.strokeStyle=`rgba(0,0,0,${Math.random()*.12})`;cpx.beginPath();cpx.moveTo(x,y);cpx.lineTo(x+Math.cos(a)*10,y+Math.sin(a)*10);cpx.stroke();}}
weave('rgba(255,255,255,.05)');
const texWeave=new THREE.CanvasTexture(canvasPaint);
texWeave.wrapS=texWeave.wrapT=THREE.RepeatWrapping;texWeave.repeat.set(14,8);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05070a);
scene.fog=new THREE.FogExp2(0x05070a,0.016);

const renderer=new THREE.WebGLRenderer({canvas:document.getElementById('glc'),antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
let envOK=true;
try{const pm=new THREE.PMREMGenerator(renderer);pm.compileEquirectangularShader();const rt=pm.fromScene(new RoomEnvironment(),0.02);scene.environment=rt.texture;scene.environmentIntensity=0.85;}catch(e){envOK=false;}

const camera=new THREE.PerspectiveCamera(42,innerWidth,innerHeight,0.5);
camera.position.set(4,2.2,5.5);

const ctrl=new OrbitControls(camera,renderer.domElement);
ctrl.target.set(0,0.75,0);ctrl.enableDamping=true;ctrl.dampingFactor=0.06;ctrl.maxPolarAngle=Math.PI*0.495;ctrl.minDistance=1.5;ctrl.maxDistance=30;

const world=new THREE.Group();scene.add(world);
const car=new THREE.Group();world.add(car);
const moveG=new THREE.Group();car.add(moveG);
const rotateG=new THREE.Group();moveG.add(rotateG);

// ---------------- material library ----------------
const paint=new THREE.MeshPhysicalMaterial({color:0xd81f2a,metalness:0.9,roughness:0.18,clearcoat:1,clearcoatRoughness:0.05,envMapIntensity:1.15,side:THREE.DoubleSide});
const PAINTS=[
 {n:'Crimson',c:0xd81f2a,m:1,r:0.18},
 {n:'Ember',c:0xff4d1c,m:1,r:0.2},
 {n:'Sapphire',c:0x1240c8,m:1,r:0.18},
 {n:'Verdigris',c:0x0f8f7f,m:1,r:0.22},
 {n:'Ivory',c:0xf0ece2,m:1,r:0.12},
 {n:'Matte Graphite',c:0x2b2f36,m:0.2,r:0.82},
 {n:'Liquid Gold',c:0xc9a227,m:1,r:0.14}
];
const RIMMAT={
 silver:new THREE.MeshPhysicalMaterial({color:0xdadee6,metalness:1,roughness:0.22,envMapIntensity:1.3}),
 black:new THREE.MeshPhysicalMaterial({color:0x121418,metalness:0.6,roughness:0.5,envMapIntensity:0.8}),
 bronze:new THREE.MeshPhysicalMaterial({color:0x9c6b34,metalness:1,roughness:0.28,envMapIntensity:1.1})
};
const CALMAT={
 red:new THREE.MeshStandardMaterial({color:0xc4262a,metalness:0.6,roughness:0.35}),
 yellow:new THREE.MeshStandardMaterial({color:0xd8b13a,metalness:0.6,roughness:0.3}),
 blue:new THREE.MeshStandardMaterial({color:0x1f56c4,metalness:0.6,roughness:0.3})
};
const tireM=new THREE.MeshPhysicalMaterial({color:0x0b0c0e,metalness:0.0,roughness:0.92,clearcoat:0.4,clearcoatRoughness:0.5});
const sideM=new THREE.MeshPhysicalMaterial({color:0x111316,roughness:0.75});
const glassM=new THREE.MeshPhysicalMaterial({color:0x0a1420,metalness:0.3,roughness:0.06,clearcoat:1,clearcoatRoughness:0.05,transparent:true,opacity:0.62,envMapIntensity:1.4,side:THREE.DoubleSide});
const glassDx=new THREE.MeshPhysicalMaterial({color:0x182838,roughness:0.08,metalness:0.2,clearcoat:1,clearcoatRoughness:0.02,side:THREE.DoubleSide});
const chromeM=new THREE.MeshPhysicalMaterial({color:0xf0f3f6,metalness:1,roughness:0.08,envMapIntensity:1.5});
const carbonM=new THREE.MeshStandardMaterial({color:0x0c0e11,metalness:0.4,roughness:0.55,map:texWeave,envMapIntensity:0.7});
const rubberM=new THREE.MeshStandardMaterial({color:0x0a0b0c,roughness:0.95});
const metalM=new THREE.MeshStandardMaterial({color:0x8a919c,metalness:0.9,roughness:0.35});
const leadM=new THREE.MeshStandardMaterial({color:0x5a6472,metalness:0.7,roughness:0.6});
const carb2=new THREE.MeshStandardMaterial({color:0x11141a,metalness:0.2,roughness:0.5,map:texWeave});
const diffM=new THREE.MeshStandardMaterial({color:0x1a1e24,metalness:0.6,roughness:0.5,map:texWeave});

const bodyMat=[];
// shadows
renderer.shadowMap.enabled=true;

// ---------------- car body ----------------
const bodyGeo=loft(56,32,(u,v)=>bodyProfile(u,v,1,1));
const body=new THREE.Mesh(bodyGeo,paint);body.castShadow=true;body.receiveShadow=true;rotateG.add(body);
bodyMat.push(body);

// lower splitter
const splitter=new THREE.Mesh(loft(20,8,(u,v)=>{const s=clamp(u,0,1);const w=wAt(s)*0.94;const y=yAt(s)-hAt(s);return V(SX(s),y-0.06,v>Math.PI?w*0.5:w*0.52);},false,1,0.95,1),paint);splitter.castShadow=true;rotateG.add(splitter);

// ---------------- nose cone front and rear ---
const nose=new THREE.Mesh(loft(24,20,(u,v)=>{const s=clamp(u,0,1);const w=wAt(s)*1.02;const y=yAt(s);const hh=hAt(s);const ang=v;return V(SX(s),y+hh*Math.cos(ang),w*Math.sin(ang));},true),paint);nose.castShadow=true;rotateG.add(nose);

// ---------------- canopy ----------------
function canopyMat(){return new THREE.MeshPhysicalMaterial({color:0x1b2836,roughness:0.05,metalness:0.15,clearcoat:1,clearcoatRoughness:0.03,transparent:true,opacity:0.55,envMapIntensity:1.5,side:THREE.DoubleSide});}
const canopyPts=[[0.28,0.745,0.26,-0.44],[0.38,0.748,0.30,0.10],[0.50,0.752,0.32,0.60],[0.62,0.748,0.31,0.55],[0.74,0.742,0.26,0.12],[0.80,0.738,0.22,-0.60]];
const glassGeos=[];
canopyPts.forEach((p,i)=>{});
// build glass canopy as loft top half
function glassLoft(){
  const N=40, M=16; const pos=[],uv=[],idx=[];
  for(let i=0;i<=N;i++){const u=i/N;const p=canopyPts[Math.min(canopyPts.length-1,Math.max(0,Math.round(u*(canopyPts.length-1))))]||canopyPts[canopyPts.length-1];
    const s=p[0],y=p[1],w=p[2],up=p[3];
    for(let j=0;j<=M;j++){const a=-Math.PI/2+u*0; const th=-Math.PI/2+Math.PI*(j/M); 
      const xx=SX(s)+w*Math.cos(th)*0+0; 
      pos.push(SX(s)+w*Math.cos(th), y+up*Math.sin(th), w*Math.sin(th));uv.push(u*3, j/M);
    }}
  return pos;
}
// simpler: build canopy manually with proper arcs
const canGeo=new THREE.BufferGeometry();
{
  const N=44,M=18,pos=[],idx=[],uv=[];
  const prof=canopyPts;
  for(let i=0;i<=N;i++){
    const u=i/N; const seg=Math.min(prof.length-1,Math.max(0,u*(prof.length-1)));
    const i0=Math.floor(seg),i1=Math.min(prof.length-1,i0+1); const t=seg-i0; const p0=prof[i0],p1=prof[i1];
    const s=lerp(p0[0],p1[0],t),y=lerp(p0[1],p1[1],t),w=lerp(p0[2],p1[2],t),up=lerp(p0[3],p1[3],t);
    for(let j=0;j<=M;j++){
      const th=-Math.PI/2+Math.PI*(j/M);
      pos.push(SX(s)+w*Math.cos(th), y+up*Math.sin(th)+Math.sin(Math.PI*u)*0, w*Math.sin(th));
      uv.push(u*3,j/M);
    }
  }
  for(let i=0;i<N;i++)for(let j=0;j<M;j++){const a=i*(M+1)+j,b=a+M+1;idx.push(a,b,a+1,b,b+1,a+1);}
  canGeo.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));
  canGeo.setIndex(idx);canGeo.computeVertexNormals();
}
const canopy=new THREE.Mesh(canGeo,canopyMat());canopy.castShadow=true;rotateG.add(canopy);
bodyMat.push(canopy);

// front splitter lip
const lip=new THREE.Mesh(loft(12,6,(u,v)=>{const s=clamp(u,0,1);const w=wAt(s)*0.92;return V(SX(s),0.24-Math.abs(Math.sin(v))*0.06,w*Math.sin(v)*0.97);},false),paint);rotateG.add(lip);

// ---------------- interior ----------------
const interior=new THREE.Group();rotateG.add(interior);
function seat(){
  const g=new THREE.Group();
  const shell=new THREE.Mesh(loft(16,14,(u,v)=>{
    const s=clamp(u,0,1);
    const w=0.19, up=0.42+0.14*Math.sin(Math.PI*(u<0.5?u:1-u));
    return V((u-0.5)*1.0,0.12+up*Math.sin(v)*0+0, w*Math.sin(v));
  },true),carInterior);g.add(shell);
  return g;
}
// seats simpler: sculpted blocks using lathe-ish ellipsoids
const carInterior=new THREE.MeshPhysicalMaterial({color:0x14181d,roughness:0.7,metalness:0.2});
const leatherM=new THREE.MeshPhysicalMaterial({color:0x2a2e36,roughness:0.55,metalness:0.15});
function mkSeat(x,z,rot,lean){
  const g=new THREE.Group();g.position.set(x,0,z);g.rotation.y=rot;
  const base=new THREE.Mesh(new THREE.SphereGeometry(1,24,16,0,Math.PI*2,0,Math.PI*0.55),leatherM);
  base.scale.set(0.17,0.20,0.30);base.position.y=0.30;g.add(base);
  const back=new THREE.Mesh(new THREE.SphereGeometry(1,24,16,0,Math.PI*2,0,Math.PI*0.6),leatherM);
  back.scale.set(0.17,0.24,0.18);back.position.set(0,0.56,-0.20);back.rotation.z=lean;g.add(back);
  const head=new THREE.Mesh(new THREE.SphereGeometry(0.10,16,12),leatherM);head.position.set(0,0.92,-0.32);g.add(head);
  g.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});
  rotateG.add(g);
}
mkSeat(-0.48,0.0,0.0,0.10);
mkSeat(0.05,0.0,0.0,-0.10);
// steering wheel
const wheelGrp=new THREE.Group();wheelGrp.position.set(0.12,0.88,0.12);wheelGrp.rotation.x=-0.55;rotateG.add(wheelGrp);
{
  const rim=new THREE.Mesh(new THREE.TorusGeometry(0.18,0.022,10,32),leatherM);rim.rotation.x=Math.PI/2;wheelGrp.add(rim);
  const hub=new THREE.Mesh(new THREE.CylinderGeometry(0.045,0.045,0.07,16),leatherM);hub.rotation.x=Math.PI/2;wheelGrp.add(hub);
  for(let i=0;i<3;i++){const b=new THREE.Mesh(new THREE.BoxGeometry(0.04,0.34,0.02),leatherM);b.position.y=0;wheelGrp.add(b);}
}
// dashboard + cluster
const dash=new THREE.Mesh(new THREE.BoxGeometry(1.16,0.16,0.10),carInterior);dash.position.set(0.05,0.90,-0.02);dash.rotation.x=0.02;rotateG.add(dash);
const dashTop=new THREE.Mesh(new THREE.BoxGeometry(1.0,0.05,0.12),leatherM);dashTop.position.set(0.05,0.995,-0.01);rotateG.add(dashTop);
const cluster=new THREE.Mesh(new THREE.PlaneGeometry(0.52,0.14),glassDx);cluster.position.set(-0.05,0.925,0.045);cluster.rotation.x=-0.05;rotateG.add(cluster);

let audio=null;
function initAudio(){
  if(audio)return;
  try{
    const ctx=new (window.AudioContext||window.webkitAudioContext)();
    const master=ctx.createGain();master.gain.value=0.0;master.connect(ctx.destination);
    const filt=ctx.createBiquadFilter();filt.type='lowpass';filt.frequency.value=2400;filt.Q.value=0.6;filt.connect(master);
    const osc=ctx.createOscillator();osc.type='sawtooth';osc.frequency.value=60;osc.detune.value=-4;osc.connect(filt);
    const osc2=ctx.createOscillator();osc2.type='sine';osc2.frequency.value=120;osc2.connect(filt);
    const noiseBuf=ctx.createBuffer(1,ctx.sampleRate*0.5,ctx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
    const noise=ctx.createBufferSource();noise.buffer=noiseBuf;noise.loop=true;
    const nf=ctx.createBiquadFilter();nf.type='highpass';nf.frequency.value=500;
    const ng=ctx.createGain();ng.gain.value=0;noise.connect(nf);nf.connect(ng);ng.connect(master);noise.start();
    osc.start();osc2.start();
    audio={ctx,master,osc,osc2,nf,ng,noise,gearCut:0};
  }catch(e){audio=null;}
}

  pointer.y=-((event.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const parts=[...xrayGroup.children];
  const hits=raycaster.intersectObjects(parts,true);
  if(hits.length){const obj=hits[0].object;let o=obj;while(o&&!o.userData.label)o=o.parent;if(o)showLabel(o);}
  else lblEl.style.display='none';
}

// loop
let prev=performance.now(),dt=0,elapsed=0,lastT=0;
let driveMode=false, frontDoor=null;
let doorFL,doorFR,doorRL,doorRR;
let wingPivotG=wingPivot;
let calGlow=null;

function animate(){
  requestAnimationFrame(animate);
  const now=performance.now();dt=Math.min(0.05,(now-prev)/1000);prev=now;elapsed+=dt;
  if(state.driving&&sim)simUpdate(dt);
  else if(driveMode===false&&state.driving===false&&sim&&sim.running!==false){/* idle */}

  // doors animation
  const td=state.doors?1:0;
  doorFL.rotation.z=-Math.PI/2*td*0.98;
  doorFR.rotation.z=Math.PI/2*td*0.98;
  doorRL.rotation.z=-Math.PI/2*td*0.98;
  doorRR.rotation.z=Math.PI/2*td*0.98;

  // wing
  if(state.driving&&sim){
    const tg=simSpeed>120?1:(simSpeed<80?0:0.4);
    wingAngle=lerp(wingAngle,tg,1-Math.exp(-2.5*dt));
  }else wingAngle=lerp(wingAngle,0,1-Math.exp(-3*dt));
  wingPivot.rotation.z=-wingAngle*0.85;

  // showroom turntable
  if(state.mode==='showroom'&&!state.driving&&!state.xray){
    rotateG.rotation.y+=dt*0.10;
    ctrl.target.set(0,0.75,0);
    ctrl.update();
    if(elapsed>2.4)revealPhase=Math.min(1,revealPhase+dt*0.35);
  }
  // lights reveal
  const rl=lerp(0,1,Math.min(1,Math.max(0,(elapsed-0.6)*0.55)));
  fillLight.intensity=1.1*rl;rimLight.intensity=1.8*rl+40*rl;keyLight.intensity=2.4*rl;

  // headlights
  headlightMat.color.setHex(state.headlights?0xffffff:0x33383f);
  const lm2=lerp(0,state.headlights?1:0,1);
  const isDrl=state.headlights;
  drlMat.color.setHex(isDrl?0xffffff:0x1a1f26);
  for(const t of tailLights){t.material.color.setHex(state.headlights?0xff2222:0x2a0505);}
  for(const a of ambers){a.material.color.setHex(0x4a2a00);}
  // use HDR toggle
  if(state.headlights){tailLights[0].material.color.setHex(0xff2222);}

  // brake lights via pointer
  // xray
  if(state.xray){
    bodyMat.forEach(m=>{m.material.opacity=0.22;m.material.transparent=true;m.material.depthWrite=false;});
    xrayGroup.visible=true;
  }else{
    bodyMat.forEach(m=>{m.material.opacity=1;m.material.transparent=false;m.material.depthWrite=true;});
    xrayGroup.visible=false;
  }

  // sim integration / visual
  if(state.driving&&sim){
    moveG.position.copy(sim.pos);
    rotateG.rotation.y=sim.yaw;
    const pr=Math.sin(sim.pitch),pc=Math.cos(sim.pitch);
    const rr=Math.sin(sim.roll),rc=Math.cos(sim.roll);
    moveG.rotation.x=sim.pitch;
    moveG.rotation.z=0;
    moveG.rotation.order='YXZ';
    const pb=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,sim.yaw,0));
    // apply roll/pitch as child
    moveG.quaternion.copy(pb);
    const px=Math.sin(sim.pitch)*Math.cos(sim.roll)*0+sim.roll;
    moveG.rotateZ(sim.roll);
    moveG.rotateX(sim.pitch);
    // wheels spin
    const spin=simSpeed/(2*Math.PI*0.355);
    const wheelSpins=[frontL,frontR,rearL,rearR];
    wheelSpins.forEach((w,i)=>{
      w.rotation.y=w.userData.spin? w.userData.spin*dt*6 : 0;
    });
  } else {
    // idle bob
    rotateG.position.y=Math.sin(elapsed*0.9)*0.006;
  }

  // labels
  hoverCheck();

  // camera
  if(state.mode==='drive'){
    if(state.driving){
      const sp=Math.hypot(sim.vel.x,sim.vel.y);
      const chase=new THREE.Vector3(-Math.sin(sim.yaw)*(3.6+sp*0.012),1.4+sp*0.004,Math.cos(sim.yaw)*(3.6+sp*0.012)).add(sim.pos);
      chase.y=sim.pos.y+1.1;
      camera.position.lerp(chase,1-Math.exp(-5*dt));
      camera.lookAt(sim.pos.x+Math.cos(sim.yaw)*sp*0.02,sim.pos.y+0.7,sim.pos.z+Math.sin(sim.yaw)*sp*0.02);
      // minimap
      drawMinimap();
    }
  } else {
    ctrl.update();
  }

  // HUD
  if(state.driving&&sim){
    document.getElementById('statusPill').innerHTML='<b>'+Math.round(simSpeed)+'</b> km/h &nbsp; G'+(sim.gear)+' &nbsp; '+Math.round(sim.rpm)+' rpm';
    document.getElementById('lapPill').textContent='LAP '+(sim.bestLap?sim.bestLap.toFixed(2):'—');
    document.getElementById('hov').style.display='none';
    document.getElementById('lm').classList.add('show');
  }
  document.getElementById('hideBtn').textContent=uiHidden?'Show UI':'Hide UI';

  renderer.render(scene,camera);
}

// create doors as separate panels
function makeDoor(s0,s1,x,hingeY,flip){
  const g=new THREE.Group();
  const geo=loft(18,16,(u,v)=>{
    const s=lerp(s0,s1,u);
    const w=wAt(s)*1.016, y=yAt(s), h=hAt(s), ang=v;
    return V(SX(s), y+h*Math.cos(ang)+0.012, w*Math.sin(ang)+0.02);
  },true);
  const m=new THREE.Mesh(geo,paint);m.castShadow=true;m.receiveShadow=true;
  g.add(m);
  // handle
  const h=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.02,0.05),chromeM);
  h.position.set((s0+s1)/2*L,0.80,0.56);g.add(h);
  rotateG.add(g);
  g.rotation.y=0;
  // pivot at front edge
  g.position.set(SX(s0),hingY,x*0.02);
  g.rotation.y=flip;
  return g;
}

// minimap & readout
function drawMinimap(){
  const s=Math.min(lm.width/400,lm.height/400);
  lm.width=400;lm.height=240;
  const c=lctx;c.clearRect(0,0,400,240);
  c.save();c.translate(200,120);c.rotate(-sim.yaw);
  c.strokeStyle='rgba(200,230,255,.55)';c.lineWidth=2;
  c.beginPath();
  for(let i=0;i<=160;i++){const u=i/160;const p=trackCurve.getPointAt(u);const x=p.x*7.5+200;const y=p.z*7.5+120;i?c.lineTo(x,y):c.moveTo(x,y);}
  c.stroke();
  c.fillStyle='rgba(216,255,62,.9)';c.beginPath();c.arc(200,120,5,0,7);c.fill();c.restore();
}

// HUD canvases for speed/tach
const satW=240,satH=240;satC.width=satW;satC.height=satH;satC.style.left='calc(100% - 270px)';satC.style.bottom='14px';satC.style.width='240px';satC.style.height='240px';

  c.beginPath();c.arc(0,0,96,-Math.PI*0.75,Math.PI*1.75);c.stroke();
  c.strokeStyle='rgba(255,70,60,.9)';c.lineWidth=8;

  const a0=-Math.PI*0.75+ (rpm/7600)*Math.PI*2.5;

}

// keydown
window.addEventListener('keydown',(e)=>{
  if(e.code==='KeyH'){uiHidden=!uiHidden;uiEl.classList.toggle('hidden',uiHidden);}
  if(e.code==='KeyM')toggleMute();
  if(state.mode==='drive'){
    if(e.code==='KeyW'||e.code==='ArrowUp'){sim.throttle=1;sim.brake=0;}
    if(e.code==='KeyS'||e.code==='ArrowDown'){sim.brake=1;sim.throttle=0;}
    if(e.code==='KeyA'||e.code==='ArrowLeft')sim.steer=1;
    if(e.code==='KeyD'||e.code==='ArrowRight')sim.steer=-1;
    if(e.code==='Space'){sim.handbrake=true;}
    if(e.code==='KeyQ'){if(!state.auto){sim.gear=Math.max(0,sim.gear-1);}}
    if(e.code==='KeyE'){if(!state.auto){sim.gear=Math.min(5,sim.gear+1);}}
    if(e.code==='KeyR')resetSim();
    if(e.code==='KeyC'){state.driving=true;enterDrive();}
  }
  if(e.code==='Space')e.preventDefault();
});
window.addEventListener('keyup',(e)=>{
  if(state.mode==='drive'){
    if(e.code==='KeyW'||e.code==='ArrowUp'){sim.throttle=Math.max(sim.throttle,0.15);}
    if(e.code==='KeyS'||e.code==='ArrowDown')sim.brake=0;
    if(e.code==='KeyA'||e.code==='ArrowLeft')sim.steer=Math.max(sim.steer,-1+0.15);
    if(e.code==='KeyD'||e.code==='ArrowRight')sim.steer=Math.min(sim.steer,1-0.15);
    if(e.code==='Space')sim.handbrake=false;
  }
});
