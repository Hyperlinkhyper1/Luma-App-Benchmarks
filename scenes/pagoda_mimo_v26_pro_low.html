function buildIsland(){

  const h=islandTop(x,z);if(h<0)continue;

   let m=2,s=0;

}
function buildCrag(){

}

const TODP=[

 {sun:[.86,.16,-.52],sc:0xff9c5c,si:2.25,st:0x5c5aa8,sb:0xffab77,fg:0xe2a68e,hs:0xc2b6dd,hg:0xb08a72,cl:0xffc49c,ex:1.06,nt:.16},
 {sun:[-.5,.52,.72],sc:0x9fb6ff,si:.52,st:0x0b1738,sb:0x27406e,fg:0x1e3257,hs:0x2c4272,hg:0x1a2038,cl:0x33507f,ex:.95,nt:1}
];

const sunColor=new THREE.Color(),skyT=new THREE.Color(),skyB=new THREE.Color(),fogC=new THREE.Color(),hsC=new THREE.Color(),hgC=new THREE.Color(),clC=new THREE.Color(),sunDir=new THREE.Vector3();
const skyPos=skyGeo.attributes.position;

function applyTime(){
 const t=timeVal*4,i0=Math.floor(t)%4,f=t-Math.floor(t),a=TODP[i0],b=TODP[(i0+1)%4];
 const L=(x,y)=>x+(y-x)*f;
 sunColor.lerpColors(a.scc,b.scc,f);
 skyT.lerpColors(a.stc,b.stc,f);skyB.lerpColors(a.sbc,b.sbc,f);
 fogC.lerpColors(a.fgc,b.fgc,f);hsC.lerpColors(a.hsc,b.hsc,f);hgC.lerpColors(a.hgc,b.hgc,f);
 clC.lerpColors(a.clc,b.clc,f);
 sunDir.set(a.sun[0],a.sun[1],a.sun[2]).lerp(new THREE.Vector3(b.sun[0],b.sun[1],b.sun[2]),f).normalize();
 const night=L(a.nt,b.nt);
 sun.color.copy(sunColor);sun.intensity=L(a.si,b.si);
 sun.position.copy(sunDir).multiplyScalar(330);
 sun.target.position.set(0,45,0);
 hemi.color.copy(hsC);hemi.groundColor.copy(hgC);hemi.intensity=L(.95,.55);
 scene.fog.color.copy(fogC);
 renderer.toneMappingExposure=L(a.ex,b.ex);
 cloudMat.color.copy(clC);
 for(let i=0;i<skyPos.count;i++){
  const y=skyPos.getY(i)/1000;
  const k=Math.max(0,Math.min(1,(y+0.22)/0.62));
  skyCol[i*3]=skyB.r+(skyT.r-skyB.r)*k;
  skyCol[i*3+1]=skyB.g+(skyT.g-skyB.g)*k;
  skyCol[i*3+2]=skyB.b+(skyT.b-skyB.b)*k;
 }
 skyGeo.attributes.color.needsUpdate=true;
 sunDisc.position.copy(sunDir).multiplyScalar(880);
 sunDisc.material.color.copy(sunColor);
 sunDisc.visible=night<0.62;
 moon.position.copy(sunDir).multiplyScalar(-860);
 moon.visible=night>0.35;
 starMat.opacity=Math.max(0,night*1.05-0.12);
 matGlow.color.setScalar(0.55+1.75*night);
 for(let i=0;i<lanternLights.length;i++){
  const fl=0.86+0.14*Math.sin(t*13.7+i*2.1)+0.06*Math.sin(t*31+i);
  lanternLights[i].intensity=(lanternLights[i].userData.off?0:1)*(2.2+42*night)*fl;
 }
 window.__VOXEL__.timeOfDay=timeVal;
}

let season='summer',seasonK=1;
function computeTargets(){
 CHG.length=0;
 for(let i=0;i<n;i++){
  const t=PT[i],s=PS[i];
  let r=BR[i],g=BG[i],b=BB[i];
  if(t>=0){const c=hx(LF[season][t]);r=c[0];g=c[1];b=c[2];if(s&&season==='winter'){r=r*.22+.78;g=g*.22+.81;b=b*.22+.88;}}
  else if(t===-1){const c=hx(GRN[season]);r=c[0];g=c[1];b=c[2];}
  else if(s&&season==='winter'){r=.9;g=.93;b=.99;}
  TR[i]=r;TG[i]=g;TB[i]=b;
  if(Math.abs(r-CR[i])>0.0025||Math.abs(g-CG[i])>0.0025||Math.abs(b-CB[i])>0.0025)CHG.push(i);
 }
 seasonK=0;
}
function setSeason(s){
 if(s===season)return;
 season=s;computeTargets();
 window.__VOXEL__.season=s;
 pMat.color.setHex(s==='spring'?0xffb7c5:s==='autumn'?0xe08a3c:s==='winter'?0xffffff:0xdfe8b0);
 pMat.size=s==='winter'?2.2:1.7;
 pMat.opacity=s==='summer'?0.35:0.85;
}
computeTargets();seasonK=1;

const VIEWS={
 overview:[[96,88,122],[0,52,0]],
 torii:[[30,62,138],[3,52,46]],
 bridge:[[74,64,98],[21,46,25]],
 pagoda:[[48,118,62],[0,102,-8]],
 waterfall:[[126,54,110],[38,16,28]],

};

 const v=VIEWS[name];if(!v)return;
 fly={p0:camera.position.clone(),t0:controls.target.clone(),p1:new THREE.Vector3(v[0][0],v[0][1],v[0][2]),t1:new THREE.Vector3(v[1][0],v[1][1],v[1][2]),k:0};
 controls.enabled=true;

let introT=0,introDone=false;
const introFrom=new THREE.Vector3(210,-2,320),introTo=new THREE.Vector3(96,88,122),introT0=new THREE.Vector3(0,30,0),introT1=new THREE.Vector3(0,52,0);

let timeVal=0.25,cycleOn=true,lastInteract=0;

const clock=new THREE.Clock();
let elapsed=0,fpsAcc=0,fpsN=0,fpsVal=60;
const m4=new THREE.Matrix4(),col=new THREE.Color();
const statsEl=document.getElementById('stats');

function animate(){
 requestAnimationFrame(animate);
 const dt=Math.min(clock.getDelta(),0.06);
 elapsed+=dt;uTime.value=elapsed;

 if(cycleOn)timeVal=(timeVal+dt/90)%1;
 document.getElementById('todSlider').value=timeVal;
 applyTime();

 if(seasonK<1){
  seasonK=Math.min(1,seasonK+dt*1.15);
  const k=Math.min(1,dt*3.2);
  for(let q=0;q<CHG.length;q++){
   const i=CHG[q];
   CR[i]+=(TR[i]-CR[i])*k;CG[i]+=(TG[i]-CG[i])*k;CB[i]+=(TB[i]-CB[i])*k;
   col.setRGB(CR[i],CG[i],CB[i]);
   meshes[MI[i]].setColorAt(LI[i],col);
  }
  for(let kk=0;kk<4;kk++)if(meshes[kk].instanceColor)meshes[kk].instanceColor.needsUpdate=true;
 }

 cloudGroup.rotation.y+=dt*0.0055;

 for(let i=0;i<fallData.length;i++){
  const d=fallData[i],F=FALLS[d.f];
  const span=F.top-F.bot;
  const y=F.top-((elapsed*F.sp*0.28+d.ph*span)%span);
  const x=F.x+Math.sin(d.i*2.7+elapsed*1.4)*F.w;
  const z=F.z+Math.cos(d.i*1.9+elapsed*1.1)*F.w;
  const s=0.75+0.5*Math.abs(Math.sin(d.i*3.1));
  m4.makeScale(s,2.6,s);m4.setPosition(x,y,z);
  fallMesh.setMatrixAt(i,m4);
  col.setRGB(0.82,0.93,1);fallMesh.setColorAt(i,col);
 }
 fallMesh.instanceMatrix.needsUpdate=true;
 if(fallMesh.instanceColor)fallMesh.instanceColor.needsUpdate=true;

 for(let i=0;i<mistBase.length;i++){
  const b=mistBase[i];
  mistPos[i*3]=b.x+Math.sin(elapsed*0.4+b.ph)*5;
  mistPos[i*3+1]=b.y+((elapsed*3+b.ph*9)%16);
  mistPos[i*3+2]=b.z+Math.cos(elapsed*0.35+b.ph)*5;
 }
 mistGeo.attributes.position.needsUpdate=true;

 for(let i=0;i<koi.length;i++){
  const k=koi[i];
  k.a+=dt*k.sp;
  k.g.position.set(21+Math.cos(k.a)*k.r,42.4+Math.sin(elapsed*1.2+i)*0.25,25+Math.sin(k.a*1.15)*k.r*0.82);
  k.g.rotation.y=-k.a*1.15+Math.PI/2;
 }
 for(let i=0;i<cranes.length;i++){
  const c=cranes[i];
  c.a+=dt*c.sp;
  c.g.position.set(Math.cos(c.a)*c.r,c.y+Math.sin(elapsed*0.5+i)*3,Math.sin(c.a)*c.r);
  c.g.rotation.y=-c.a+Math.PI/2;
  const f=Math.sin(elapsed*3.2+c.fl)*0.55;
  c.w1.rotation.x=f;c.w2.rotation.x=-f;
 }
 const pa=pGeo.attributes.position.array;
 for(let i=0;i<PN;i++){
  pa[i*3+1]-=pVel[i]*dt*(season==='winter'?1.1:0.75);
  pa[i*3]+=Math.sin(elapsed*0.7+pSw[i])*dt*2.4;
  pa[i*3+2]+=Math.cos(elapsed*0.55+pSw[i])*dt*1.9;
  if(pa[i*3+1]<-34){pa[i*3+1]=135;pa[i*3]=rnd(-120,120);pa[i*3+2]=rnd(-110,110);}
 }
 pGeo.attributes.position.needsUpdate=true;

 for(let i=0;i<ripples.length;i++){
  const r=ripples[i],k=(elapsed*0.32+r.ph)%1;
  r.m.scale.setScalar(1.2+k*7);
  r.m.material.opacity=(1-k)*0.42;
 }

 for(const d of doorGroups){
  d.open+=(d.target-d.open)*Math.min(1,dt*2.6);
  d.g.rotation.y=d.base+d.open*1.25;
 }

 if(!introDone){
  introT=Math.min(1,introT+dt/2.5);
  const e=introT<0.5?4*introT*introT*introT:1-Math.pow(-2*introT+2,3)/2;
  camera.position.lerpVectors(introFrom,introTo,e);
  controls.target.lerpVectors(introT0,introT1,e);
  if(introT>=1){introDone=true;controls.enabled=true;}
 }else if(fly){
  fly.k=Math.min(1,fly.k+dt/1.7);
  const e=fly.k<0.5?4*fly.k*fly.k*fly.k:1-Math.pow(-2*fly.k+2,3)/2;
  camera.position.lerpVectors(fly.p0,fly.p1,e);
  controls.target.lerpVectors(fly.t0,fly.t1,e);
  if(fly.k>=1)fly=null;
 }
 controls.target.y=Math.max(6,Math.min(132,controls.target.y));
 controls.update();
 if(camera.position.y<-8)camera.position.y=-8;
 if(!introDone)controls.enabled=false;

 if(performance.now()-lastInteract>9000)controls.autoRotate=rotOn;
 else controls.autoRotate=false;

 renderer.render(scene,camera);

 fpsAcc+=dt;fpsN++;
 if(fpsAcc>0.5){
  fpsVal=Math.round(fpsN/fpsAcc);fpsAcc=0;fpsN=0;
  window.__VOXEL__.fps=fpsVal;
  window.__VOXEL__.voxelCount=n;
  statsEl.textContent=n.toLocaleString()+' voxels · '+fpsVal+' FPS';
 }
}

const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let down=null;
renderer.domElement.addEventListener('pointerdown',e=>{down={x:e.clientX,y:e.clientY};lastInteract=performance.now();});

renderer.domElement.addEventListener('pointerup',e=>{

 if(!down)return;

 ndc.x=(e.clientX/innerWidth)*2-1;ndc.y=-(e.clientY/innerHeight)*2+1;

  const d=hits[0].object.userData;
  if(d.type==='lantern'){
   if(d.light){d.light.userData.off=!d.light.userData.off;}
   else{const l=new THREE.PointLight(0xffb066,0,52,2);l.position.set(d.x,d.y,d.z);scene.add(l);d.light=l;lanternLights.push(l);}
  }else if(d.type==='floor'){
   const base=d.s*4;
   for(let i=base;i<base+4;i++){doorGroups[i].target=doorGroups[i].target>0.5?0:1;}
  }
 }
 down=null;
});
