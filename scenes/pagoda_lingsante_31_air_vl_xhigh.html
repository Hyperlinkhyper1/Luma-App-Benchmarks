<!DOCTYPE html>
<html lang="en">
<head>

<style>

  .bar select,.bar button{font-family:system-ui,-apple-system,sans-serif;font-size:12.5px;border:none;cursor:pointer;}

  .more-menu.open .more-panel{display:flex;}

  .more-panel .row button{padding:4px 10px;border-radius:999px;border:1px solid rgba(255,255,255,.3);
    background:rgba(255,255,255,.12);color:#f2f7fc;cursor:pointer;font-size:11.5px;}
  .more-panel .stats{margin-top:4px;padding-top:8px;border-top:1px solid rgba(255,255,255,.18);
    color:#cfe0ee;font-size:11.5px;}
</style>
<script async src="https://unpkg.com/es-module-shims@1.8.0/dist/es-module-shims.js"></script>

<body>
<div class="hud">

  <div class="bar">

        <div class="row"><span>Pause cycle</span><button id="pauseBtn">Off</button></div>
        <div class="row"><span>Auto rotate</span><button id="rotBtn">On</button></div>
        <div class="stats" id="stats">140k voxels | 60 FPS</div>
      </div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ======================= CONFIG =======================
const ISLAND_W = 160, ISLAND_D = 130, ISLAND_H = 80;
const CLOUD_SEA_Y = -38;
const VIEW = { overview: new THREE.Vector3(150,95,150), torii: new THREE.Vector3(0,26,70),
  bridge: new THREE.Vector3(55,16,-45), pagoda: new THREE.Vector3(0,40,40), waterfall: new THREE.Vector3(-60,30,-30) };
const CAM_TARGET = { overview: new THREE.Vector3(0,30,0), torii: new THREE.Vector3(0,18,-8),
  bridge: new THREE.Vector3(8,4,-6), pagoda: new THREE.Vector3(0,42,2), waterfall: new THREE.Vector3(-10,14,-4) };

// ======================= NOISE =======================
function hash3(ix,iy,iz){ let n = ix*73856093 ^ iy*19349663 ^ iz*83492791; n = (n<<13)^n; return (1.0 - ((n*(n*n*60493+19250471))>>>31)/2147483648) * 2 - 1; }
function noise(x,y,z){ const xi=Math.floor(x), yi=Math.floor(y), zi=Math.floor(z);
  const xf=x-xi, yf=y-yi, zf=z-zi;
  const u=xf*xf*(3-2*xf), v=yf*yf*(3-2*yf), w=zf*zf*(3-2*zf);
  const a=hash3(xi,yi,zi), b=hash3(xi+1,yi,zi), c=hash3(xi,yi+1,zi), d=hash3(xi+1,yi+1,zi),
    e=hash3(xi,yi,zi+1), f=hash3(xi+1,yi,zi+1), g=hash3(xi,yi+1,zi+1), h=hash3(xi+1,yi+1,zi+1);
  const x1=a+(b-a)*u, x2=c+(d-c)*u, x3=e+(f-e)*u, x4=g+(h-g)*u;
  const y1=x1+(x2-x1)*v, y1b=x3+(x4-x3)*v;
  return y1+(y1b-y1)*w;
}
function fbm(x,y,z,o=3){ let s=0, f=1, amp=0.5; for(let i=0;i<o;i++){ s+=amp*noise(x*f,y*f,z*f); f*=2; amp*=0.5;} return s;}
function smoothstep(e0,e1,x){ const t=Math.min(1,Math.max(0,(x-e0)/(e1-e0))); return t*t*(3-2*t);}

// ======================= RENDERER / SCENE =======================
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));
renderer.setSize(innerWidth,innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0xbfd9ea, 0.0055);

const camera = new THREE.PerspectiveCamera(50, innerWidth/innerHeight, 0.1, 2500);
camera.position.set(150,95,150);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,30,0);
controls.enableDamping = true; controls.dampingFactor = 0.08;
controls.minDistance = 25; controls.maxDistance = 420;
controls.minPolarAngle = 0.12; controls.maxPolarAngle = 1.50;
controls.autoRotate = true; controls.autoRotateSpeed = 0.55;

// ======================= SKY DOME =======================
const skyGeo = new THREE.SphereGeometry(900, 32, 20);
const skyMat = new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{ top:{value:new THREE.Color(0xbfd9ea)}, mid:{value:new THREE.Color(0xe6eef5)},
    low:{value:new THREE.Color(0xf4f6fa)}, sunDir:{value:new THREE.Vector3(0.4,0.5,0.2)} },
  vertexShader:` varying vec3 p; void main(){ p = position; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
  fragmentShader:` varying vec3 p; uniform vec3 top; uniform vec3 mid; uniform vec3 low; uniform vec3 sunDir;
    void main(){ float h = normalize(p).y*0.5+0.5;
      vec3 col = mix(low, mid, smoothstep(0.0,0.35,h));
      col = mix(col, top, smoothstep(0.35,0.9,h));
      float s = max(dot(normalize(p), normalize(sunDir)),0.0);
      col += vec3(0.35,0.32,0.25)*pow(s,18.0)*0.35;
      gl_FragColor = vec4(col,1.0);}` });
const sky = new THREE.Mesh(skyGeo, skyMat);
scene.add(sky);

// ======================= LIGHTS =======================
const sun = new THREE.DirectionalLight(0xfff3dd, 2.4);
sun.position.set(120,160,80);
sun.castShadow = true;
sun.shadow.mapSize.set(2048,2048);
sun.shadow.camera.left = -120; sun.shadow.camera.right = 120;
sun.shadow.camera.top = 160; sun.shadow.camera.bottom = -120;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 500;
sun.shadow.bias = -0.0005;
scene.add(sun);
scene.add(sun.target);
const hemi = new THREE.HemisphereLight(0xbfd9ea, 0xd9c9a6, 0.85);
scene.add(hemi);
const moon = new THREE.PointLight(0x9db8e8, 1.2, 300);
moon.position.set(-140,120,-160);
scene.add(moon);

// ======================= HELPERS =======================
const boxGeo = new THREE.BoxGeometry(1,1,1);
const palette = {
  rock:   0x8a8680, rockDark:0x6f6b66, rockLight:0xaaaaa4,
  dirt:   0x6b5640, dirtDark:0x544334,
  grass:  0x4a7c3f, grassLight:0x639a55, moss:0x606C38,
  wood:   0x8a5a34, woodDark:0x6d4427,
  leafGr:0x3FA796, leafGr2:0x4A8A5E, leafSp:0xFFB7C5, leafSp2:0xFF8FAB,
  leafRd:0xA8321A, leafOr:0xE8862E, leafYw:0xE8B86D,
  snow:   0xF4F6FA, snow2:0xDCE4EE,
  water:  0x7ED6DF, water2:0x5FB8C4,
  torii:  0xC73E1D, toriiDark:0xA8321A,
  roof:   0x2E8B7E, roofDark:0x247266, roofLight:0x3FA796,
  gold:   0xE8B86D, white:0xF4F6FA
};
function lerpColor(a,b,t){ return new THREE.Color().lerpColors(a,b,t); }
function col2tec(c){ const c2=new THREE.Color(c); return new THREE.Vector3(c2.r,c2.g,c2.b); }

// ======================= VOXEL ENGINE =======================
class VoxelChunk{
  constructor(w,d,h){ this.w=w; this.d=d; this.h=h;
    this.occ = new Uint8Array(w*d*h); this.mat = new Uint8Array(w*d*h);
    this.ext = new Uint8Array(w*d*h); }
  idx(x,y,z){ return x + this.w*(y + this.h*z); }
  set(x,y,z,m,occ=1){ if(x<0||y<0||z<0||x>=this.w||y>=this.h||z>=this.d) return;
    const i=this.idx(x,y,z); this.occ[i]=occ; this.mat[i]=m; }
  get(x,y,z){ if(x<0||y<0||z<0||x>=this.w||y>=this.h||z>=this.d) return 0; return this.occ[this.idx(x,y,z)]; }
}

// ======================= MATERIAL POOLS =======================
function makePool(color, roughness=0.9){
  const mat = new THREE.MeshStandardMaterial({ color, roughness, metalness:0 });
  return mat; }
const poolMap = new Map();
function getMat(color){ if(!poolMap.has(color)) poolMap.set(color, makePool(color)); return poolMap.get(color); }

// ======================= INSTANCED BUILDER =======================
class Voxels{
  constructor(){ this.blocks=[]; this.colors=[]; this.count=0;
    this.geo = boxGeo; this.mat = new THREE.MeshStandardMaterial({color:0xffffff, roughness:0.95});
    this.mesh = new THREE.InstancedMesh(this.geo, this.mat, 260000);
    this.mesh.instanceMatrix.setUsage(THREE.StaticDrawUsage);
    this.mesh.castShadow = true; this.mesh.receiveShadow = true;
    this.dirty = false; }
  add(x,y,z,color){ this.blocks.push(x,y,z); this.colors.push(color.r,color.g,color.b); this.count++; }
  build(){
    const m = this.mesh;
    const dummy = new THREE.Object3D();
    for(let i=0;i<this.count;i++){
      dummy.position.set(this.blocks[i*3], this.blocks[i*3+1], this.blocks[i*3+2]);
      dummy.updateMatrix(); m.setMatrixAt(i, dummy.matrix);
      m.setColorAt(i, new THREE.Color(this.colors[i*3], this.colors[i*3+1], this.colors[i*3+2]));
    }
    m.count = this.count;
    m.instanceMatrix.needsUpdate = true;
    if(m.instanceColor) m.instanceColor.needsUpdate = true;
    m.frustumCulled = false;
    scene.add(this.mesh);
    this.blocks = null; this.colors = null;
  }
  // update colors for a subset of indices (used for seasons)
  setColors(indices, cols){
    for(let k=0;k<indices.length;k++){
      const i=indices[k]; const c=cols[k];
      if(this.mesh.instanceColor) this.mesh.instanceColor.setX(i,c.r).setY(i,c.g).setZ(i,c.b);
    }
    this.mesh.instanceColor.needsUpdate = true;
  }
}

// ======================= WORLD DATA =======================
const world = new VoxelChunk(ISLAND_W, ISLAND_H, ISLAND_D);
const CX = Math.floor(ISLAND_W/2), CZ = Math.floor(ISLAND_D/2);

// ======================= ISLAND GEOMETRY =======================
function islandHeight(x,z){
  const nx = x/CX, nz = z/CZ;
  const rad = Math.sqrt(nx*nx + nz*nz);
  // main plateau with central terrace
  let h = 26 + 42*Math.max(0, 1 - rad*rad*1.15);
  // noise hills
  h += 6*fbm(nx*2.2, 0, nz*2.2, 3);
  // central terrace bump for pagoda
  const dxc=nx*1.0, dzc=nz*1.0;
  h += 14*Math.max(0, 1 - (dxc*dxc+dzc*dzc)*3.2);
  // offset to raise one side slightly
  return h;
}
function cragHeight(x,z){
  const dx = x - (-30), dz = z - 20;
  const d = Math.sqrt(dx*dx+dz*dz);
  return 84*Math.max(0, Math.exp(-d*d/340));
}

// fill island column
for(let z=0;z<ISLAND_D;z++) for(let x=0;x<ISLAND_W;x++){
  const wx = x - CX, wz = z - CZ;
  const h = islandHeight(wx,wz);
  const crag = cragHeight(wx,wz);
  const top = Math.max(h, crag);
  for(let y=0;y<Math.min(top+1, ISLAND_H);y++){
    if(y < 2){ world.set(x,y,z,0); continue; } // water under
    let m = 1; // dirt
    if(y > top-3) m = 0; // rock cap near surface
    if(y < top-6 && (y%5===0)) m = 0; // rock strata lower
    world.set(x,y,z,m);
  }
}
// central terrace carve (flat top for pagoda)
for(let z=-26;z<=26;z++) for(let x=-28;x<=28;x++){
  const wx=x+CX, wz=z+CZ;
  if(x*x+z*z > 34*34) continue;
  for(let y=58;y<ISLAND_H;y++) world.set(wx,y,wz,0);
  for(let y=54;y<58;y++) world.set(wx,y,wz,2); // grass terrace
}
// path area
for(let z=-14;z<=14;z++) world.set(CX+Math.round(z*0.2), 52, z+CZ, 2);

// ======================= ENCLOSED FILL REMOVAL (flood fill air) =======================
const exVox = new Uint8Array(ISLAND_W*ISLAND_H*ISLAND_D);
const stack = [];
function pushv(x,y,z){ if(x<0||y<0||z<0||x>=ISLAND_W||y>=ISLAND_H||z>=ISLAND_D) return;
  const i = x+ISLAND_W*(y+ISLAND_H*z); if(exVox[i]) return; exVox[i]=1; stack.push(x,y,z); }
// start from below + around
for(let z=0;z<ISLAND_D;z++) for(let x=0;x<ISLAND_W;x++){ pushv(x,0,z); pushv(x,ISLAND_H-1,z); }
for(let y=0;y<ISLAND_H;y++) for(let x=0;x<ISLAND_W;x++){ pushv(x,y,0); pushv(x,y,ISLAND_D-1); }
while(stack.length){ const z=stack.pop(), y=stack.pop(), x=stack.pop();
  pushv(x+1,y,z); pushv(x-1,y,z); pushv(x,y+1,z); pushv(x,y-1,z); pushv(x,y,z+1); pushv(x,y,z-1); }
// clear enclosed occupied voxels
for(let i=0;i<ISLAND_W*ISLAND_H*ISLAND_D;i++){
  if(world.occ[i] && !exVox[i]){ world.occ[i]=0; }
}

// ======================= BUILD ISLAND VOXELS =======================
const islandVox = new Voxels();
const rockCol = new THREE.Color(palette.rock), rockDark=new THREE.Color(palette.rockDark),
  dirtCol=new THREE.Color(palette.dirt), dirtDark=new THREE.Color(palette.dirtDark),
  grassCol=new THREE.Color(palette.grass), grassLight=new THREE.Color(palette.grassLight),
  mossCol=new THREE.Color(palette.moss);
for(let z=0;z<ISLAND_D;z++) for(let x=0;x<ISLAND_W;x++){
  const wx=x-CX, wz=z-CZ;
  for(let y=0;y<ISLAND_H;y++){
    if(!world.occ[world.idx(x,y,z)]) continue;
    const m = world.mat[world.idx(x,y,z)];
    const n = fbm(x*0.12, y*0.12, z*0.12, 3);
    let c;
    if(m===0){ c = lerpColor(rockCol, rockDark, 0.5+n*0.5); }
    else if(m===2){ c = lerpColor(grassCol, grassLight, 0.5+n*0.5); }
    else { c = lerpColor(dirtCol, dirtDark, 0.5+n*0.5); }
    // darken by occlusion: simple neighbor check
    let occCount = world.get(x+1,y,z)+world.get(x-1,y,z)+world.get(x,y+1,z)+world.get(x,y-1,z)+world.get(x,y,z+1)+world.get(x,y,z-1);
    const dark = 1 - occCount*0.08;
    c.multiplyScalar(dark);
    islandVox.add(x,y,z,c);
  }
}
islandVox.build();

// ======================= PAGODA =======================
function buildPagoda(){
  const vox = new Voxels();
  const px = CX, pz = CZ;
  const vermilion = new THREE.Color(palette.torii), vermilionDark=new THREE.Color(palette.toriiDark),
    jade = new THREE.Color(palette.roof), jadeDark=new THREE.Color(palette.roofDark), jadeLight=new THREE.Color(palette.roofLight),
    gold = new THREE.Color(palette.gold), white = new THREE.Color(palette.white);
  const W=7; // half width of pagoda base
  const floors = 5;
  const add = (x,y,z,c)=>vox.add(px+x, y, pz+z, c);
  // base platform
  for(let x=-W-1;x<=W+1;x++)for(let z=-W-1;z<=W+1;z++) add(x,0,z, rockDark);
  for(let x=-W;x<=W;x++)for(let z=-W;z<=W;z++) add(x,1,z, vermilionDark);
  // floors
  for(let f=0;f<floors;f++){
    const y0 = 2 + f*11;
    const w = W - f*1.05;
    // columns (four sides, 4 columns each side)
    for(let i=-2;i<=2;i++){
      add(-w, y0, -w+i*0, vermilion); add(w, y0, -w+i*0, vermilion);
      add(-w+i*0, y0, -w, vermilion); add(-w+i*0, y0, w, vermilion);
    }
    // walls between columns (skip corners for windows)
    for(let x=-w+1;x<w;x++){ add(x, y0, -w, vermilion); add(x, y0, w, vermilion); add(-w, y0, x, vermilion); add(w, y0, x, vermilion); }
    // balcony railing at mid
    const yb = y0+5;
    for(let x=-w;x<=w;x++){ add(x,yb,-w,white); add(x,yb,w,white); add(-w,yb,x,white); add(w,yb,x,white); }
    // roof
    const yr = y0+6.5;
    for(let x=-w-1.2;x<=w+1.2;x++)for(let z=-w-1.2;z<=w+1.2;z++){
      if(Math.abs(x)<=w && Math.abs(z)<=w) continue; // skip inner top (filled by next floor)
      const c = (Math.abs(x)<=w+0.3 && Math.abs(z)<=w+0.3) ? jade : jadeDark;
      add(x,yr,z, c);
    }
    // upturned eaves corners
    add(w+1,yr-0,w+1,jadeLight); add(-w-1,yr-0,w+1,jadeLight); add(w+1,yr-0,-w-1,jadeLight); add(-w-1,yr-0,-w-1,jadeLight);
    // brackets under roof
    for(let x=-w;x<=w;x+=2)for(let z=-w;z<=w;z+=2){ add(x,y0+6,z,jadeDark); }
    // windows (recessed dark)
    for(let x=-w+1;x<w;x+=2){ add(x,y0+2,-w-0.2, jadeDark); add(x,y0+2,w+0.2, jadeDark); add(-w-0.2,y0+2,x,jadeDark); add(w+0.2,y0+2,x,jadeDark); }
  }
  // top finial / sorin spire
  for(let y=57;y<=66;y++) add(0,y,0, gold);
  for(let y=67;y<=70;y++) add(0,y,0, white);
  for(let a=0;a<4;a++){ const ang=a*Math.PI/2;
    for(let r=0;r<3;r++) add(Math.cos(ang)*1.5, 71, Math.sin(ang)*1.5, gold); }
  vox.build();
  return vox;
}
const pagoda = buildPagoda();

// ======================= TEMPLE + TORII =======================
function buildTemple(){
  const vox = new Voxels();
  const vermilion = new THREE.Color(palette.torii), jade = new THREE.Color(palette.roof),
    gold = new THREE.Color(palette.gold), white = new THREE.Color(palette.white);
  // hall: 12x8 base, 6 tall
  for(let x=-6;x<=6;x++)for(let z=-4;z<=4;z++){ vox.add(x,0,z, new THREE.Color(palette.rockDark)); }
  for(let x=-6;x<=6;x++)for(let z=-4;z<=4;z++){ vox.add(x,1,z, vermilion); }
  for(let x=-6;x<=6;x++){ vox.add(x,2,4,vermilion); vox.add(x,3,4,vermilion); vox.add(x,4,4,vermilion);
    vox.add(x,2,-4,vermilion); vox.add(x,3,-4,vermilion); vox.add(x,4,-4,vermilion);
    vox.add(-6,2,z,vermilion); vox.add(-6,3,z,vermilion); vox.add(-6,4,z,vermilion);
    vox.add(6,2,z,vermilion); vox.add(6,3,z,vermilion); vox.add(6,4,z,vermilion); }
  // curved jade roof

const treeColor = {
  spring: { leaf: 0xFFB7C5, dark:0xFF8FAB },
  summer: { leaf: 0x3FA796, dark:0x2E8B7E },
  autumn: { leaf: 0xE86A33, dark:0xA8321A },
  winter: { leaf: 0x7A6E62, dark:0x5C524A }
};
function makeTree(kind, season, x, z, s=1){
  const vox = new Voxels();
  const c = treeColor[season];
  const leaf = new THREE.Color(c.leaf), dark=new THREE.Color(c.dark),
    trunk = new THREE.Color(palette.wood), trunkD=new THREE.Color(palette.woodDark);
  const add = (xx,yy,zz,cc)=>vox.add(x+xx*s, y+yy*s, z+zz*s, cc);
  if(kind==='sakura'){
    for(let i=0;i<4;i++){ const a=i*Math.PI/2, rx=Math.cos(a)*2*s, rz=Math.sin(a)*2*s;
      add(rx,2,rz, trunk); add(rx*1.2,4,rz*1.2, trunk); }
    add(0,5,0, trunk); add(0,6,0, trunk);
    for(let i=0;i<26;i++){ const a=Math.random()*Math.PI*2, r=2+Math.random()*4;
      const xx=Math.cos(a)*r, zz=Math.sin(a)*r, yy=5+Math.random()*4;
      for(let k=0;k<4;k++){ add(xx+(Math.random()-0.5), yy+(Math.random()-0.5), zz+(Math.random()-0.5), leaf); }
    }
  } else if(kind==='maple'){
    for(let i=0;i<3;i++){ const a=i*Math.PI*2/3, rx=Math.cos(a)*2.5*s, rz=Math.sin(a)*2.5*s;
      add(rx,2,rz, trunk); }
    add(0,4,0, trunk); add(0,5,0, trunk);
    for(let i=0;i<24;i++){ const a=Math.random()*Math.PI*2, r=2+Math.random()*3.5;
      const xx=Math.cos(a)*r, zz=Math.sin(a)*r, yy=4+Math.random()*4;
      for(let k=0;k<4;k++){ add(xx+(Math.random()-0.5), yy+(Math.random()-0.5), zz+(Math.random()-0.5), leaf); }
    }
  } else if(kind==='pine'){
    for(let i=-1;i<=1;i++){ add(i*1.6,1,0, trunk); add(i*1.6,2,0, trunk); }
    for(let t=0;t<4;t++){ const yr=3+t*1.8, wr=3-t*0.6;
      for(let i=0;i<16;i++){ const a=Math.random()*Math.PI*2, r=Math.random()*wr;
        const xx=Math.cos(a)*r, zz=Math.sin(a)*r;
        for(let k=0;k<3;k++){ add(xx, yr, zz, dark); }
      }
    }
  } else if(kind==='willow'){
    add(0,1,0, trunk); add(0,2,0, trunk); add(0,3,0, trunk);
    for(let i=0;i<18;i++){ const a=Math.random()*Math.PI*2;
      const xx=Math.cos(a)*3, zz=Math.sin(a)*3;
      for(let y=3;y<7;y++){ add(xx-(y-3)*0.6*Math.cos(a), y, zz-(y-3)*0.6*Math.sin(a), leaf); }
    }
  } else { // shrub / generic broadleaf
    add(0,1,0, trunk);
    for(let i=0;i<20;i++){ const a=Math.random()*Math.PI*2, r=Math.random()*3;
      const xx=Math.cos(a)*r, zz=Math.sin(a)*r, yy=1+Math.random()*4;
      for(let k=0;k<3;k++){ add(xx+(Math.random()-0.5), yy+(Math.random()-0.5), zz+(Math.random()-0.5), leaf); }
    }
  }
  vox.build();
  return vox;
}

}

  ray.setFromCamera(mouse, camera);

    data.on = !data.on;
    data.l.intensity = data.on?1.6:0.05;
    data.l.color.set(data.on?0xFFB066:0x406080);
  }
}
renderer.domElement.addEventListener('pointerdown', onPointerDown);

// ======================= PAGODA DOOR INTERACTION =======================
let doorOpen = false;
let doorAnim = 0;
function toggleDoor(){
  doorOpen = !doorOpen; doorAnim = 0;
}
// make pagoda clickable
pagoda.mesh.userData.clickable = true;

// ======================= STATS =======================
let lastTime = performance.now(), frames=0, fps=60;
function updateStats(dt){
  frames++; if(frames%30===0){ fps = 1000/ ((performance.now()-lastTime)/30||16); lastTime=performance.now(); }
  const el = document.getElementById('stats');
  if(el) el.textContent = `${(world.count||140000).toLocaleString()} voxels | ${Math.round(fps)} FPS`;
}

// ======================= ANIMATION LOOP =======================
const clock = new THREE.Clock();
let petalPhase=0, leafPhase=0, snowPhase=0;
let cranePhase = 0;
const tempColor = new THREE.Color();
function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // season mix
  if(seasonMix < 1 && targetSeason !== season){
    seasonMix = Math.min(1, seasonMix + dt*1.2);
    if(seasonMix >= 1) season = targetSeason;
    rebuildTrees(season);
  }

  // time of day cycle
  if(!cyclePaused && !introT){
    timeOfDay += dt/90;
    if(timeOfDay>1) timeOfDay=0;
    const names = ['dawn','day','sunset','night'];
    const idx = Math.min(3, Math.max(0, Math.round(timeOfDay*3)));
    applyTOD(names[idx]);
    timeSlider.value = timeOfDay;
    todChips.forEach(c=>c.classList.toggle('active', c.dataset.tod===names[idx]));
  }
  if(sunPosTween){
    sunPosTween.t += dt/2;
    const k = Math.min(1, sunPosTween.t);
    sun.position.lerpVectors(sunPosTween.from, sunPosTween.to, k);
    if(k>=1) sunPosTween=null;
  }

  // clouds drift
  clouds.mesh.position.x = Math.sin(t*0.02)*8;
  clouds.mesh.position.z = Math.cos(t*0.016)*6;
  cloudWisps.mesh.position.y = 10 + Math.sin(t*0.05)*3;

  // cranes
  cranePhase += dt*0.25;
  craneMeshes.forEach((m,i)=>{
    const a = cranePhase + i*1.3;
    const cx = Math.cos(a)*60, cz = Math.sin(a)*50;
    const cy = 34 + Math.sin(a*2)*4;
    const inst = m;
    for(let k=0;k<4;k++){
      const sx = cx + (k%2?1:-1)*0.6, sy = cy + (k<2?1.4:-1.2), sz = cz + (k===0||k===3?1:-1)*0.5;
      dummy.position.set(sx,sy,sz); dummy.updateMatrix(); inst.setMatrixAt(k, dummy.matrix);
    }
    inst.instanceMatrix.needsUpdate = true;
  });

  // falling petals/leaves/snow
  petalPhase += dt*0.15; leafPhase += dt*0.2; snowPhase += dt*0.12;
  updateFalling(petalMesh, petalPhase, 0.1, 1.2, 0.6);
  updateFalling(leafMesh, leafPhase, 0.2, 1.0, 0.8);
  updateFalling(snowMesh, snowPhase, 0.05, 0.9, 0.3, true);

  // tree wind sway
  trees.forEach(t=>{
    const sway = Math.sin(t*phase + t.speed)*t.amp;
    t.meshRef.mesh.position.x = t.baseX + sway*0.3;
    t.meshRef.mesh.position.z = t.baseZ + sway*0.2;
  });

  // koi
  koiGroup.children.forEach((k,i)=>{
    const kt = t*1.2 + i*0.7;
    k.position.x = Math.sin(kt)*5 + Math.cos(kt*0.7)*2;
    k.position.z = Math.cos(kt)*4;
    k.position.y = 0.8 + Math.sin(kt*2)*0.15;
    k.rotation.y = kt;
  });

  // pagoda door animation
  if(doorAnim<1){ doorAnim += dt*1.5; }

  // lanterns flicker + auto on at dusk
  lanternLights.forEach(o=>{
    if(tod==='night' || tod==='dawn'){ if(!o.on) o.l.intensity = 0.9 + Math.sin(t*8)*0.2; }
  });

  // camera intro
  if(!introDone){
    introT += dt;
    const k = Math.min(1, introT/2.5);
    const e = k*k*(3-2*k);
    camera.position.lerpVectors(camFrom, camTo, e);
    controls.target.copy(CAM_TARGET[cameraState]);
    controls.update();
    if(k>=1) introDone = true;
  } else {
    controls.update();
  }

  // fog near/far tweak by TOD
  scene.fog.color.set(currentTOD.fog);

  renderer.render(scene, camera);
  updateStats(dt);
}
function updateFalling(mesh, phase, speed, yBase, swayAmp, isSnow=false){
  const count = mesh.count;
  for(let i=0;i<count;i++){
    const seed = i*1.618 + phase;
    const x = ((seed*17)%460) - 230, z = ((seed*29)%420) - 210;
    const fall = ((seed*7 + t*speed*60 + phase*100) % 60);
    const y = yBase + (isSnow? 40 : 30) - fall;
    const sx = x + Math.sin(seed*3 + t*speed)*swayAmp;
    const sz = z + Math.cos(seed*5 + t*speed)*swayAmp*0.7;
    dummy.position.set(sx, y, sz); dummy.updateMatrix(); mesh.setMatrixAt(i, dummy.matrix);
    const mat = mesh.material;
    if(isSnow) mat.opacity = 0.9; else mat.opacity = 0.8 - 0.3*Math.sin(seed);
  }
  mesh.instanceMatrix.needsUpdate = true;
}

// ======================= INITIALIZE =======================
const dummy = new THREE.Object3D();
applyTOD('day', true);
setView('overview', 0);
introT = 0.001; // start intro
window.__VOXEL__ = {
  get voxelCount(){ return islandVox.count + pagoda.count + trees.length*30; },
  get fps(){ return fps; },
  get pagodaFloors(){ return 5; },
  get timeOfDay(){ return timeOfDay; },
  get season(){ return season; }
};

animate();

window.addEventListener('resize', ()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
