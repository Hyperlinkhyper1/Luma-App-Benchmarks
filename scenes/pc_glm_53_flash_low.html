<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS Showcase One — Interactive 3D Build</title>
<style>
  :root{--acc:#00e5ff}
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#08090c}
  body{font-family:ui-monospace,"SF Mono","Cascadia Code",Menlo,Consolas,monospace;color:#c9ced8;-webkit-font-smoothing:antialiased}
  #gl{position:fixed;inset:0;display:block;cursor:grab}
  #gl.drag{cursor:grabbing}

  #brand{position:fixed;top:18px;left:22px;z-index:5;pointer-events:none;user-select:none}
  #brand h1{font-size:13px;font-weight:700;letter-spacing:.3em;color:#e3e7ef}
  #brand h1 i{font-style:normal;color:var(--acc);transition:color .3s}
  #brand p{margin-top:7px;font-size:10px;line-height:1.75;letter-spacing:.06em;color:#585f6b}
  #brand p b{color:#8f97a3;font-weight:600}

  #tip{position:fixed;z-index:20;pointer-events:none;background:rgba(10,12,16,.92);border:1px solid var(--acc);
    color:#e8ecf3;font-size:10.5px;letter-spacing:.08em;padding:6px 10px;border-radius:7px;opacity:0;
    transform:translateY(4px);transition:opacity .18s,transform .18s;white-space:nowrap}
  #tip.show{opacity:1;transform:none}

  #hud{position:fixed;right:16px;bottom:16px;z-index:10;width:278px;max-height:calc(100vh - 32px);
    display:flex;flex-direction:column;background:rgba(12,14,18,.84);border:1px solid rgba(255,255,255,.09);
    border-radius:14px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
    box-shadow:0 18px 50px rgba(0,0,0,.55);overflow:hidden;user-select:none}
  .hd{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid rgba(255,255,255,.07);flex:none}
  .hd .ttl{font-size:10.5px;letter-spacing:.22em;color:#aeb6c2;font-weight:700;flex:1}
  .mini{font-size:9px;color:#565e6b;letter-spacing:.08em}
  .icobtn{width:26px;height:26px;border-radius:8px;border:1px solid transparent;background:transparent;color:#6d7580;
    display:flex;align-items:center;justify-content:center;cursor:pointer;transition:.15s}
  .icobtn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
  .icobtn:hover{color:#e6eaf1;border-color:rgba(255,255,255,.14)}
  .icobtn.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}
  .icobtn.col svg{transition:transform .25s}
  .icobtn.col.closed svg{transform:rotate(180deg)}
  #hudBody{overflow-y:auto;overscroll-behavior:contain}
  #hudBody.off{display:none}
  #hudBody::-webkit-scrollbar{width:6px}
  #hudBody::-webkit-scrollbar-thumb{background:rgba(255,255,255,.12);border-radius:3px}
  .sec{padding:11px 14px;border-bottom:1px solid rgba(255,255,255,.06)}
  .sec:last-child{border-bottom:0}
  .lab{font-size:9px;letter-spacing:.22em;color:#5d6572;margin-bottom:9px}

  .pwrRow{display:flex;align-items:center;gap:12px}
  .pwr{width:46px;height:46px;flex:none;border-radius:50%;border:1px solid rgba(255,255,255,.18);
    background:radial-gradient(circle at 35% 30%,#1d2129,#101318 70%);color:#8a93a0;cursor:pointer;
    display:flex;align-items:center;justify-content:center;transition:.25s}
  .pwr svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:2}
  .pwr:hover{color:#e8ecf3;border-color:rgba(255,255,255,.4)}
  .pwr:active{transform:scale(.93)}
  .pwr.on{color:var(--acc);border-color:var(--acc);box-shadow:0 0 16px -2px var(--acc),inset 0 0 10px -6px var(--acc)}
  .pwrInfo{flex:1;min-width:0}
  .st{display:flex;align-items:center;gap:7px;font-size:11px;letter-spacing:.14em;color:#dfe4ec;font-weight:700}
  .dot{width:8px;height:8px;border-radius:50%;background:#565e6b;flex:none;transition:background .3s}
  .dot.boot{background:#ffb02e;animation:pul .9s infinite}
  .dot.on{background:var(--acc);box-shadow:0 0 8px var(--acc)}
  @keyframes pul{50%{opacity:.3}}
  .tele{margin-top:5px;font-size:9.5px;letter-spacing:.05em;color:#6f7885;white-space:nowrap;overflow:hidden}

  .wheelRow{display:flex;gap:12px;align-items:center}
  .wheelWrap{position:relative;width:96px;height:96px;flex:none}
  #wheel{width:96px;height:96px;display:block;cursor:crosshair}
  #wheelDot{position:absolute;width:12px;height:12px;border-radius:50%;border:2px solid #fff;
    box-shadow:0 0 6px rgba(0,0,0,.7);pointer-events:none;transform:translate(-50%,-50%);left:50%;top:50%}
  .wheelSide{flex:1;min-width:0}
  .swRow{display:flex;gap:5px;flex-wrap:wrap}
  .swd{width:15px;height:15px;border-radius:50%;border:1px solid rgba(255,255,255,.25);cursor:pointer;padding:0;transition:.12s}
  .swd:hover{transform:scale(1.18)}
  .hexRow{display:flex;align-items:center;gap:7px;margin:9px 0 3px;font-size:10px;color:#9aa2af;letter-spacing:.08em}
  #swatch{width:14px;height:14px;border-radius:4px;background:var(--acc);border:1px solid rgba(255,255,255,.25)}

  .chips{display:flex;gap:6px;margin-top:10px}
  .chip{flex:1;padding:7px 0;font-family:inherit;font-size:9.5px;letter-spacing:.14em;color:#8a93a0;background:#14171d;
    border:1px solid rgba(255,255,255,.07);border-radius:8px;cursor:pointer;transition:.15s}
  .chip:hover{color:#e8ecf3;border-color:rgba(255,255,255,.18)}
  .chip.on{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 55%,transparent);
    background:color-mix(in srgb,var(--acc) 10%,#14171d)}

  .sld{display:flex;align-items:center;gap:8px;padding:5px 0}
  .sldL{font-size:9px;letter-spacing:.16em;color:#5d6572;width:34px;flex:none}
  .sldV{font-size:9.5px;color:#9aa2af;width:46px;text-align:right;flex:none}
  input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:16px;background:transparent;cursor:pointer}
  input[type=range]::-webkit-slider-runnable-track{height:3px;border-radius:2px;background:var(--trk,#23272e)}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;margin-top:-4.5px;
    border-radius:50%;background:#0d0f13;border:2px solid var(--acc)}
  input[type=range]::-moz-range-track{height:3px;border-radius:2px;background:#23272e}
  input[type=range]::-moz-range-progress{height:3px;border-radius:2px;background:var(--acc)}
  input[type=range]::-moz-range-thumb{width:10px;height:10px;border-radius:50%;background:#0d0f13;border:2px solid var(--acc)}

  .togRow{display:flex;align-items:center;justify-content:space-between;font-size:10px;letter-spacing:.12em;color:#9aa2af;padding:7px 0 2px}
  .sw{position:relative;width:34px;height:18px;flex:none;cursor:pointer}
  .sw input{display:none}
  .sw i{position:absolute;inset:0;border-radius:20px;background:#23272e;border:1px solid rgba(255,255,255,.09);transition:.18s}
  .sw i:after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#6b7480;transition:.18s}
  .sw input:checked+i{background:color-mix(in srgb,var(--acc) 30%,#1a1d23);border-color:var(--acc)}
  .sw input:checked+i:after{left:18px;background:var(--acc)}

  @media(max-width:640px){#brand{display:none}#hud{left:12px;right:12px;width:auto}}
</style>
<script type="importmap">
{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
}}
</script>
</head>
<body>
<canvas id="gl"></canvas>

<div id="brand">
  <h1>NEXUS <i>▪</i> SHOWCASE ONE</h1>
  <p><b>drag</b> orbit &nbsp;·&nbsp; <b>scroll</b> zoom &nbsp;·&nbsp; <b>space</b> power<br><b>click parts</b> to inspect hardware</p>
</div>
<div id="tip"></div>

<div id="hud">
  <div class="hd">
    <span class="ttl">NEXUS CONTROL</span>
    <span class="mini" id="fps">-- fps</span>
    <button class="icobtn" id="sndBtn" title="Sound">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 0 1 0 7"/></svg>
    </button>
    <button class="icobtn col" id="colBtn" title="Collapse">
      <svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg>
    </button>
  </div>
  <div id="hudBody">
    <div class="sec">
      <div class="pwrRow">
        <button id="pwrBtn" class="pwr" title="Power (Space)">
          <svg viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.2 6.6a8 8 0 1 0 11.6 0"/></svg>
        </button>
        <div class="pwrInfo">
          <div class="st"><span id="stDot" class="dot"></span><span id="stTxt">STANDBY</span></div>
          <div class="tele" id="tele">CPU --° · GPU --° · ---- RPM</div>
        </div>
      </div>
    </div>

    <div class="sec">
      <div class="lab">LIGHTING</div>
      <div class="wheelRow">
        <div class="wheelWrap" id="wheelWrap">
          <canvas id="wheel" width="132" height="132"></canvas>
          <div id="wheelDot"></div>
        </div>
        <div class="wheelSide">
          <div class="swRow" id="swRow"></div>
          <div class="hexRow"><span id="swatch"></span><span id="hex">#00E5FF</span></div>
          <div class="sld"><span class="sldL">BRI</span><input id="bri" type="range" min="12" max="100" value="100"><span class="sldV" id="briV">100%</span></div>
        </div>
      </div>
      <div class="chips" id="fxChips">
        <button class="chip on" data-fx="static">STATIC</button>
        <button class="chip" data-fx="wave">WAVE</button>
        <button class="chip" data-fx="pulse">PULSE</button>
      </div>
    </div>

    <div class="sec">
      <div class="lab">SYSTEM</div>
      <div class="sld"><span class="sldL">FAN</span><input id="fan" type="range" min="15" max="100" value="55"><span class="sldV" id="fanV">--</span></div>
      <div class="sld"><span class="sldL">ROOM</span><input id="amb" type="range" min="10" max="100" value="85"><span class="sldV" id="ambV">85%</span></div>
      <div class="togRow"><span>TURBO LOAD TEST</span><label class="sw"><input id="turbo" type="checkbox"><i></i></label></div>
    </div>

    <div class="sec">
      <div class="lab">VIEW</div>
      <div class="chips" id="camChips">
        <button class="chip on" data-cam="hero">HERO</button>
        <button class="chip" data-cam="front">FRONT</button>
        <button class="chip" data-cam="side">SIDE</button>
        <button class="chip" data-cam="top">TOP</button>
      </div>
      <div class="togRow"><span>EXPLODED VIEW</span><label class="sw"><input id="explode" type="checkbox"><i></i></label></div>
      <div class="togRow"><span>NEON BLOOM</span><label class="sw"><input id="bloomT" type="checkbox" checked><i></i></label></div>
    </div>
  </div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';

/* ---------- basics ---------- */
const $=id=>document.getElementById(id);
const hud=$('hud'), tip=$('tip');
let W=innerWidth, H=innerHeight;
const canvas=$('gl');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(W,H);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.1;

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x08090c);
scene.fog=new THREE.Fog(0x08090c,130,300);

const camera=new THREE.PerspectiveCamera(45,W/H,0.1,600);
camera.position.set(-36,33,64);

const controls=new OrbitControls(camera,canvas);
controls.target.set(0,25,0);
controls.enableDamping=true;
controls.dampingFactor=0.08;
controls.minDistance=28; controls.maxDistance=170;
controls.maxPolarAngle=1.52;

const pmrem=new THREE.PMREMGenerator(renderer);
scene.environment=pmrem.fromScene(new RoomEnvironment(renderer),0.04).texture;
pmrem.dispose();

const composer=new EffectComposer(renderer);
composer.setPixelRatio(Math.min(devicePixelRatio,2));
composer.addPass(new RenderPass(scene,camera));
const bloomPass=new UnrealBloomPass(new THREE.Vector2(W,H),0.5,0.45,0.9);
composer.addPass(bloomPass);
composer.addPass(new OutputPass());

/* ---------- lights ---------- */
const hemi=new THREE.HemisphereLight(0x93a4b8,0x14161a,0.5); scene.add(hemi);
const key=new THREE.DirectionalLight(0xffffff,2.1);
key.position.set(38,62,30); key.castShadow=true;
key.shadow.mapSize.set(2048,2048);
key.shadow.camera.left=-75; key.shadow.camera.right=75;
key.shadow.camera.top=75; key.shadow.camera.bottom=-75;
key.shadow.camera.near=5; key.shadow.camera.far=220;
key.shadow.bias=-0.0006;
scene.add(key);
const rim=new THREE.DirectionalLight(0xcfd8e6,0.7); rim.position.set(-45,28,-38); scene.add(rim);
const pInt=new THREE.PointLight(0x00e5ff,0,42,2); pInt.position.set(0,26,-2); scene.add(pInt);
const uLight=new THREE.PointLight(0x00e5ff,0,20,2); uLight.position.set(0,1.8,0); scene.add(uLight);

/* ---------- helpers ---------- */
const V3=(x,y,z)=>new THREE.Vector3(x,y,z);
const ss=THREE.MathUtils.smoothstep;
const ease=x=>x*x*(3-2*x);
function bx(w,h,d,m,x=0,y=0,z=0){const ms=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);ms.position.set(x,y,z);return ms;}
function cyl(r,h,m,seg=24){const ms=new THREE.Mesh(new THREE.CylinderGeometry(r,r,h,seg),m);return ms;}
function tor(R,t,m){return new THREE.Mesh(new THREE.TorusGeometry(R,t,12,48),m);}
function hsv(h,s,v){h=((h%1)+1)%1;const i=Math.floor(h*6),f=h*6-i,p=v*(1-s),q=v*(1-f*s),t=v*(1-(1-f)*s);
  switch(i%6){case 0:return[v,t,p];case 1:return[q,v,p];case 2:return[p,v,t];case 3:return[p,q,v];case 4:return[t,p,v];default:return[v,p,q];}}
function makeTex(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'),w,h);
  const t=new THREE.CanvasTexture(c);t.colorSpace=THREE.SRGBColorSpace;t.anisotropy=8;return t;}

/* ---------- materials ---------- */
const MAT={
  gun:new THREE.MeshStandardMaterial({color:0x2b2f37,metalness:0.85,roughness:0.38}),
  frame:new THREE.MeshStandardMaterial({color:0x12141a,metalness:0.55,roughness:0.5}),
  dark:new THREE.MeshStandardMaterial({color:0x0c0e12,metalness:0.3,roughness:0.8}),
  matte:new THREE.MeshStandardMaterial({color:0x0a0b0e,metalness:0.2,roughness:0.9}),
  pcb:new THREE.MeshStandardMaterial({color:0x101116,metalness:0.1,roughness:0.6}),
  brushed:new THREE.MeshStandardMaterial({color:0x1a1e26,metalness:0.9,roughness:0.32}),
  blade:new THREE.MeshStandardMaterial({color:0x14161b,metalness:0.4,roughness:0.55}),
  gpuS:new THREE.MeshStandardMaterial({color:0x14171d,metalness:0.75,roughness:0.45}),
  glass:new THREE.MeshPhysicalMaterial({color:0x5b6a78,metalness:0,roughness:0.06,transparent:true,opacity:0.13,
    envMapIntensity:1.6,side:THREE.DoubleSide,depthWrite:false}),
  cable:new THREE.MeshStandardMaterial({color:0x15171b,metalness:0.2,roughness:0.95,transparent:true,opacity:1}),
};
const tubeMat=new THREE.MeshStandardMaterial({color:0x0a0b0e,roughness:0.85,metalness:0.1,transparent:true,opacity:0.62});
const standbyMat=new THREE.MeshBasicMaterial({color:0x000000});
const usbR=new THREE.MeshStandardMaterial({color:0x8a2a2a,roughness:0.6});
const usbB=new THREE.MeshStandardMaterial({color:0x2a4a8a,roughness:0.6});
const usbG=new THREE.MeshStandardMaterial({color:0x2a7a3a,roughness:0.6});

/* ---------- RGB registry ---------- */
const rgbItems=[];
function reg(m,em,phase){const it={m,em,phase,k:0,basic:!!m.isMeshBasicMaterial};rgbItems.push(it);return it;}
function glowMat(em=2,basic=false){
  const m=basic?new THREE.MeshBasicMaterial({color:0x000000})
    :new THREE.MeshStandardMaterial({color:0x0a0a0c,roughness:0.5,metalness:0.4,emissive:0x000000});
  return reg(m,em,0);
}

/* ---------- generated textures ---------- */
const gpuTex=makeTex(1024,128,g=>{
  g.fillStyle='#fff';g.textBaseline='middle';
  g.font='700 64px ui-monospace,Menlo,Consolas,monospace';g.fillText('NEXUS',40,66);
  g.fillRect(300,40,3,48);
  g.font='600 42px ui-monospace,Menlo,Consolas,monospace';g.fillText('RTX-X',336,68);
  g.font='500 32px ui-monospace,Menlo,Consolas,monospace';g.textAlign='right';g.fillText('32GB GDDR7 · 3-SLOT',990,68);
});
const mbTex=makeTex(256,96,g=>{
  g.fillStyle='#fff';g.textBaseline='middle';
  g.font='700 44px ui-monospace,Menlo,Consolas,monospace';g.fillText('NEXUS',20,36);
  g.font='500 18px ui-monospace,Menlo,Consolas,monospace';g.fillStyle='#9aa2ad';g.fillText('X870E CREATOR',22,74);
});
const ssdTex=makeTex(256,64,g=>{
  g.fillStyle='#14161a';g.fillRect(0,0,256,64);
  g.strokeStyle='#2a2e36';g.lineWidth=4;g.strokeRect(2,2,252,60);
  g.fillStyle='#9aa2ad';g.font='600 24px ui-monospace,Menlo,Consolas,monospace';g.textBaseline='middle';
  g.fillText('NEXUS NVMe · 2TB',16,34);
});
const bpTex=makeTex(512,128,g=>{
  g.fillStyle='#7d8590';g.font='700 52px ui-monospace,Menlo,Consolas,monospace';g.textBaseline='middle';
  g.fillText('NEXUS RTX-X',30,66);
});
const badgeTex=makeTex(512,96,g=>{
  g.fillStyle='#fff';g.font='600 38px ui-monospace,Menlo,Consolas,monospace';g.textBaseline='middle';
  g.fillText('NEXUS ▪ SHOWCASE ONE',10,50);
});
const radTex=makeTex(64,64,g=>{
  g.fillStyle='#0e1013';g.fillRect(0,0,64,64);
  g.fillStyle='#07080a';for(let x=0;x<64;x+=16)g.fillRect(x,0,6,64);
});
radTex.wrapS=radTex.wrapT=THREE.RepeatWrapping;radTex.repeat.set(10,1);
const radMat=new THREE.MeshStandardMaterial({map:radTex,metalness:0.5,roughness:0.6});
const glowTex=makeTex(256,256,g=>{
  const gr=g.createRadialGradient(128,128,10,128,128,128);
  gr.addColorStop(0,'rgba(255,255,255,1)');gr.addColorStop(1,'rgba(255,255,255,0)');
  g.fillStyle=gr;g.fillRect(0,0,256,256);
});
const oledCv=document.createElement('canvas');oledCv.width=256;oledCv.height=112;
const octx=oledCv.getContext('2d');
const oledTex=new THREE.CanvasTexture(oledCv);oledTex.colorSpace=THREE.SRGBColorSpace;

/* ---------- floor ---------- */
const floor=new THREE.Mesh(new THREE.CircleGeometry(170,64),
  new THREE.MeshStandardMaterial({color:0x0c0d11,roughness:0.5,metalness:0.25,envMapIntensity:0.5}));
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const stageRing=new THREE.Mesh(new THREE.RingGeometry(30,30.55,96),
  new THREE.MeshBasicMaterial({color:0x1c2026}));
stageRing.rotation.x=-Math.PI/2;stageRing.position.y=0.02;scene.add(stageRing);
const glowPlane=new THREE.Mesh(new THREE.PlaneGeometry(46,46),
  new THREE.MeshBasicMaterial({map:glowTex,transparent:true,opacity:0,blending:THREE.AdditiveBlending,depthWrite:false,fog:false}));
glowPlane.rotation.x=-Math.PI/2;glowPlane.position.y=0.05;scene.add(glowPlane);

/* ---------- case groups / explode table ---------- */
const caseRoot=new THREE.Group();scene.add(caseRoot);
const expl=[];
function ex(g,x,y,z){g.userData.off=V3(x,y,z);g.userData.e=0;expl.push(g);return g;}
const gBase=new THREE.Group(), gFrame=new THREE.Group(), gShroud=new THREE.Group(), gMB=new THREE.Group();
const gBack=ex(new THREE.Group(),0,0,-10), gGlassL=ex(new THREE.Group(),-17,0,0),
  gGlassF=ex(new THREE.Group(),0,0,13), gTop=ex(new THREE.Group(),0,13,0),
  gRad=ex(new THREE.Group(),0,21,0), gFanF=ex(new THREE.Group(),0,0,10),
  gFanR=ex(new THREE.Group(),0,9,-9), gRAM=ex(new THREE.Group(),-9,0,0),
  gGPU=ex(new THREE.Group(),-16,3,2);
[gBase,gFrame,gShroud,gMB,gBack,gGlassL,gGlassF,gTop,gRad,gFanF,gFanR,gRAM,gGPU].forEach(g=>caseRoot.add(g));

/* ---------- fan builder ---------- */
const rotors=[];
function makeFan(R,phase,opts={}){
  const g=new THREE.Group(), bare=!!opts.bare;
  const d=0.64*R,S=2.3*R,t=0.34*R;
  if(!bare){
    g.add(bx(S,d,t,MAT.frame,0,0,S/2-t/2));
    g.add(bx(S,d,t,MAT.frame,0,0,-(S/2-t/2)));
    g.add(bx(t,d,S-2*t,MAT.frame,S/2-t/2,0,0));
    g.add(bx(t,d,S-2*t,MAT.frame,-(S/2-t/2),0,0));
    for(const sx of[-1,1])for(const sz of[-1,1]){
      const c=cyl(0.1*R,d+0.14,MAT.gun);c.position.set(sx*(S/2-t/2),0,sz*(S/2-t/2));g.add(c);
    }
  }
  const rotor=new THREE.Group();
  rotor.add(cyl(0.36*R,0.34*R,MAT.dark));
  const hrIt=glowMat(1.8);hrIt.phase=phase;
  const hr=tor(0.2*R,0.035*R,hrIt.m);hr.rotation.x=Math.PI/2;hr.position.y=0.19*R;rotor.add(hr);
  for(let i=0;i<7;i++){
    const h=new THREE.Group();
    const bl=new THREE.Mesh(new THREE.BoxGeometry(0.6*R,0.055*R,0.4*R),MAT.blade);
    bl.position.x=0.63*R;bl.rotation.x=0.5;h.add(bl);
    h.rotation.y=i*Math.PI*2/7;rotor.add(h);
  }
  rotor.rotation.y=Math.random()*6.28;
  g.add(rotor);
  const ringIt=glowMat(bare?2.0:2.4);ringIt.phase=phase;
  const ring=tor(bare?0.98*R:0.92*R,bare?0.06*R:0.075*R,ringIt.m);
  ring.rotation.x=Math.PI/2;ring.position.y=bare?0.06:(d/2+0.03);
  g.add(ring);
  rotors.push({rot:rotor,mult:opts.mult||1});
  return {g,rotor,ringIt,hrIt};
}

const sys={on:false,u:0,onT:0,posted:false,gpuOn:false,gpuT:0};
const lighting={hue:0.516,sat:1,val:1,fx:'static'};
let fanPct=0.55,ambPct=0.85,turbo=false,explodeOn=false;
let exE=0,fanVel=0,spinE=0,master=0;
let kPump=0,kGPU=0,kUnder=0,kStrip=0,kLogo=0;
const kRam=[0,0,0,0],kFF=[0,0,0],kFT=[0,0,0];let kFR=0;
const TE={cpu:21,gpu:20,load:0,rpm:0};
let lastHex='',tG=0;

function setPower(v){
  sys.on=v;
  if(v){sys.onT=0;sys.posted=false;}
  $('pwrBtn').classList.toggle('on',v);
  clickSnd();
}

function updateBoot(dt){
  if(sys.on){
    sys.u=Math.min(1,sys.u+dt/5.2);sys.onT+=dt;
    if(!sys.posted&&sys.u>0.8){sys.posted=true;chime();}
  }else sys.u=Math.max(0,sys.u-dt/2.2);
  const u=sys.u;
  spinE=ss(u,0.06,0.5);
  master=ss(u,0.3,0.75);
  kPump=ss(u,0.1,0.32);
  for(let i=0;i<4;i++){
    const a=0.3+i*0.05,b=0.42+i*0.05;
    kRam[i]=ss(u,a,b)*(u>b?1+1.3*Math.max(0,1-(u-b)*10):1);
  }
  for(let i=0;i<3;i++){kFF[i]=ss(u,0.42+i*0.05,0.56+i*0.05);kFT[i]=ss(u,0.5+i*0.04,0.62+i*0.04);}
  kFR=ss(u,0.55,0.68);
  kStrip=ss(u,0.48,0.64);
  if(u>=0.6&&!sys.gpuOn){sys.gpuOn=true;sys.gpuT=0;}
  if(u<0.55)sys.gpuOn=false;
  if(sys.gpuOn)sys.gpuT+=dt;
  const flick=sys.gpuT<1.1?((Math.sin(sys.gpuT*43)+Math.sin(sys.gpuT*29+1.7))>0.9?1:0.15):1;
  kGPU=ss(u,0.6,0.74)*flick;
  kUnder=ss(u,0.62,0.8);
  kLogo=ss(u,0.66,0.84);
  // telemetry
  const on=sys.on&&u>0.75;
  TE.cpu+=((on?(turbo?77:37):21)-TE.cpu)*Math.min(1,dt*0.5);
  TE.gpu+=((on?(turbo?73:34):20)-TE.gpu)*Math.min(1,dt*0.5);
  TE.load+=((on?(turbo?0.95:0.06):0)-TE.load)*Math.min(1,dt*0.5);
  TE.rpm=Math.round((500+fanPct*1480+(turbo?360:0))*(0.12+0.88*spinE));
  // item intensities
  fanF.forEach((f,i)=>{f.ringIt.k=kFF[i];f.hrIt.k=kFF[i];});
  fanT.forEach((f,i)=>{f.ringIt.k=kFT[i];f.hrIt.k=kFT[i];});
  fanRe.ringIt.k=kFR;fanRe.hrIt.k=kFR;
  ramIts.forEach((it,i)=>it.k=kRam[i]);
  pumpRingIt.k=pumpDotIt.k=kPump;bubIt.k=kPump*1.3;
  gpuIt.k=kGPU;gpuLineIt.k=kGPU*0.85;gpuRingIt.k=kGPU*0.9;
  stripIt.k=kStrip;underIt.k=kUnder;logoIt.k=kLogo*0.9;badgeIt.k=kStrip*0.8;
  btnIt.k=master*0.9;
  ssdIt.k=(sys.on&&u>0.72)?((Math.sin(tG*9.3)+Math.sin(tG*23.7)>0.3)?1:0.06):0;
  standbyMat.color.setRGB(sys.on?0:(0.3+0.3*Math.sin(tG*2.2)),0.04,0.04);
}

/* ---------- lighting update ---------- */
const C1=new THREE.Color(),C2=new THREE.Color();
function colAt(phase,out,vOverride){
  let h=lighting.hue,s=lighting.sat,v=vOverride!==undefined?vOverride:lighting.val;
  if(lighting.fx==='wave'){h=(lighting.hue+phase*0.11+tG*0.045)%1;s=1;}
  else if(lighting.fx==='pulse')v*=0.42+0.58*(0.5+0.5*Math.sin(tG*2.1-phase*1.8));
  const c=hsv(h,s,v);
  out.setRGB(c[0],c[1],c[2],THREE.SRGBColorSpace);
  return out;
}
function updateRGB(){
  for(const it of rgbItems){
    colAt(it.phase,C1);
    const a=it.em*it.k;
    if(it.basic)it.m.color.copy(C1).multiplyScalar(a);
    else{it.m.emissive.copy(C1);it.m.emissiveIntensity=a;}
  }
  colAt(0.5,C2,1);
  pInt.color.copy(C2);pInt.intensity=75*master*(0.35+0.65*lighting.val);
  uLight.color.copy(C2);uLight.intensity=48*kUnder*(0.3+0.7*lighting.val);
  glowPlane.material.color.copy(C2);
  glowPlane.material.opacity=0.5*kUnder*(0.25+0.75*lighting.val);
  const hexc='#'+C2.getHexString().toUpperCase();
  if(hexc!==lastHex){
    lastHex=hexc;
    hud.style.setProperty('--acc',hexc);
    $('hex').textContent=hexc;$('swatch').style.background=hexc;
  }
}

/* ---------- fans / tubes / explode ---------- */
function updateFans(dt){
  const tv=spinE*(0.55+fanPct*1.5)*(turbo?1.2:1);
  fanVel+=(tv-fanVel)*Math.min(1,dt*1.4);
  for(const f of rotors)f.rot.rotation.y+=fanVel*f.mult*dt;
}
function updateTubes(dt){
  const vis=bubIt.k>0.15&&exE<0.3;
  for(const b of bubbles){
    b.m.visible=vis;
    if(vis)b.m.position.copy(b.c.getPoint((tG*b.s+b.o)%1));
  }
}
function updateExplode(dt){
  exE+=((explodeOn?1:0)-exE)*Math.min(1,dt*2.2);
  MAT.cable.opacity=1-0.85*exE;
  tubeMat.opacity=0.62*(1-0.78*exE);
  expl.forEach((g,i)=>{
    g.userData.e+=(exE-g.userData.e)*Math.min(1,dt*(2.4+(i%4)*0.55));
    const k=ease(g.userData.e);
    g.position.copy(g.userData.off).multiplyScalar(k);
  });
}

/* ---------- camera presets ---------- */
let camTw=null;
const CAMS={hero:[-36,33,64],front:[0,27,68],side:[-64,30,4],top:[-8,76,32]};
function goCam(name){
  camTw={p0:camera.position.clone(),p1:V3(...CAMS[name]),
    t0:controls.target.clone(),t1:V3(0,25,0),k:0};
}
controls.addEventListener('start',()=>{camTw=null;canvas.classList.add('drag');});
controls.addEventListener('end',()=>canvas.classList.remove('drag'));
function updateCam(dt){
  if(!camTw)return;
  camTw.k+=dt/0.95;
  const e=ease(Math.min(1,camTw.k));
  camera.position.lerpVectors(camTw.p0,camTw.p1,e);
  controls.target.lerpVectors(camTw.t0,camTw.t1,e);
  if(camTw.k>=1)camTw=null;
}

/* ---------- audio (synthesized) ---------- */
const snd={on:false,ac:null,gain:null,filt:null};
function audioInit(){
  if(snd.ac)return;
  const A=window.AudioContext||window.webkitAudioContext;if(!A)return;
  const ac=snd.ac=new A();
  const len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);
  let last=0;
  for(let i=0;i<len;i++){last=(last+0.02*(Math.random()*2-1))/1.02;d[i]=last*3.2;}
  const src=ac.createBufferSource();src.buffer=buf;src.loop=true;
  const f=ac.createBiquadFilter();f.type='lowpass';f.frequency.value=300;f.Q.value=0.7;
  const g=ac.createGain();g.gain.value=0;
  src.connect(f);f.connect(g);g.connect(ac.destination);src.start();
  snd.filt=f;snd.gain=g;
}
function tone(fr,dur,vol,type='sine',when=0){
  if(!snd.on||!snd.ac)return;
  const t0=snd.ac.currentTime+when,o=snd.ac.createOscillator(),g=snd.ac.createGain();
  o.type=type;o.frequency.value=fr;
  g.gain.setValueAtTime(0,t0);
  g.gain.linearRampToValueAtTime(vol,t0+0.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(snd.ac.destination);o.start(t0);o.stop(t0+dur+0.05);
}
function chime(){tone(523.25,0.5,0.06);tone(659.25,0.5,0.05,'sine',0.09);tone(783.99,0.75,0.055,'sine',0.18);}
function clickSnd(){tone(1700,0.035,0.03,'square');tone(700,0.05,0.028,'square',0.015);}
function audioFrame(dt){
  if(!snd.ac)return;
  const tgt=snd.on?(0.012+0.05*(fanVel/2.3)):0;
  snd.gain.gain.value+=(tgt-snd.gain.gain.value)*Math.min(1,dt*3);
  snd.filt.frequency.value=240+fanVel*260+fanPct*380;
}

/* ---------- OLED display ---------- */
const MONO='ui-monospace,Menlo,Consolas,monospace';
function drawOLED(){
  const g=octx;g.fillStyle='#03060a';g.fillRect(0,0,256,112);
  const acc=lastHex||'#00E5FF';
  if(sys.u<=0.02){
    g.fillStyle='rgba(255,70,70,.75)';g.beginPath();g.arc(14,18,3.4,0,7);g.fill();
    g.fillStyle='#39414c';g.font='600 13px '+MONO;g.fillText('STANDBY',26,23);
  }else if(sys.u<0.75){
    g.fillStyle=acc;g.font='700 17px '+MONO;g.fillText('NEXUS UEFI v2.4.1',12,30);
    g.fillStyle='#6b7480';g.font='12px '+MONO;g.fillText('initializing hardware ...',12,56);
    g.fillStyle='#1b2027';g.fillRect(12,74,232,10);
    g.fillStyle=acc;g.fillRect(12,74,232*ss(sys.u,0.15,0.7),10);
  }else if(sys.u<1){
    g.fillStyle=acc;g.font='700 17px '+MONO;g.fillText('POST OK — READY',12,32);
    g.fillStyle='#6b7480';g.font='12px '+MONO;
    g.fillText('X870E · 64GB DDR5 · RTX-X 32GB',12,58);
    g.fillText('booting OS ...',12,82);
  }else{
    g.fillStyle=acc;g.font='700 19px '+MONO;
    g.fillText('GPU '+Math.round(TE.gpu)+'°C',12,32);
    g.fillStyle='#8b93a0';g.font='600 13px '+MONO;g.fillText(TE.rpm+' RPM',150,32);
    g.fillStyle='#525b66';g.font='11px '+MONO;g.fillText('LOAD',12,56);
    g.fillStyle='#1b2027';g.fillRect(52,48,180,9);
    g.fillStyle=turbo?'#ff5533':acc;g.fillRect(52,48,180*TE.load,9);
    g.fillStyle='#525b66';g.fillText('UPTIME '+fmtU(sys.onT),12,96);
  }
  oledTex.needsUpdate=true;
}
function fmtU(s){const m=Math.floor(s/60),x=Math.floor(s%60);return String(m).padStart(2,'0')+':'+String(x).padStart(2,'0');}

/* ---------- HUD: color wheel ---------- */
const wheelCv=$('wheel'),wheelWrap=$('wheelWrap'),wheelDot=$('wheelDot');
(function drawWheel(){
  const g=wheelCv.getContext('2d'),s=132,R=66;
  const img=g.createImageData(s,s);
  for(let y=0;y<s;y++)for(let x=0;x<s;x++){
    const dx=x-R+0.5,dy=y-R+0.5,d=Math.hypot(dx,dy),i=(y*s+x)*4;
    if(d>R-2){img.data[i+3]=0;continue;}
    const hue=(Math.atan2(dy,dx)/(Math.PI*2)+1.5)%1;
    const sat=Math.min(d/60.5,1);
    const c=hsv(hue,sat,1);
    img.data[i]=c[0]*255;img.data[i+1]=c[1]*255;img.data[i+2]=c[2]*255;
    img.data[i+3]=d>0.92*R?(1-(d-0.92*R)/(R*0.08))*255:255;
  }
  g.putImageData(img,0,0);
})();
function updateWheelUI(){
  const th=(lighting.hue-1.5)*Math.PI*2,rr=Math.min(lighting.sat,1)*44;
  wheelDot.style.left=(48+Math.cos(th)*rr)+'px';
  wheelDot.style.top=(48+Math.sin(th)*rr)+'px';
}
let wheelDrag=false;
function wheelPick(e){
  const r=wheelWrap.getBoundingClientRect();
  const x=e.clientX-r.left-r.width/2,y=e.clientY-r.top-r.height/2;
  lighting.hue=(Math.atan2(y,x)/(Math.PI*2)+1.5)%1;
  lighting.sat=Math.min(Math.hypot(x,y)/44,1);
  updateWheelUI();
}
wheelCv.addEventListener('pointerdown',e=>{wheelDrag=true;wheelCv.setPointerCapture(e.pointerId);wheelPick(e);});
wheelCv.addEventListener('pointermove',e=>{if(wheelDrag)wheelPick(e);});
addEventListener('pointerup',()=>wheelDrag=false);

// presets (precomputed h/s)
[['#00E5FF',0.516,1],['#FF2D4E',0.974,0.82],['#FF8A00',0.09,1],['#2BFF88',0.406,0.83],
 ['#2F7DFF',0.604,0.82],['#FF2FD6',0.866,0.82],['#EEF2FF',0.58,0.06]].forEach(([hex,h,s])=>{
  const b=document.createElement('button');b.className='swd';b.title=hex;
  const c=hsv(h,s,1);b.style.background=`rgb(${c.map(x=>Math.round(x*255)).join(',')})`;
  b.onclick=()=>{lighting.hue=h;lighting.sat=s;updateWheelUI();clickSnd();};
  $('swRow').appendChild(b);
});
updateWheelUI();

/* ---------- HUD wiring ---------- */
function paintRange(el){
  const p=(el.value-el.min)/(el.max-el.min)*100;
  el.style.setProperty('--trk',`linear-gradient(90deg,var(--acc) ${p}%,#23272e ${p}%)`);
}
document.querySelectorAll('input[type=range]').forEach(paintRange);

$('pwrBtn').onclick=()=>setPower(!sys.on);
addEventListener('keydown',e=>{
  if(e.code==='Space'&&!/INPUT|BUTTON|TEXTAREA/.test(e.target.tagName)){e.preventDefault();setPower(!sys.on);}
});
$('bri').oninput=e=>{lighting.val=e.target.value/100;$('briV').textContent=e.target.value+'%';paintRange(e.target);};
$('fan').oninput=e=>{fanPct=e.target.value/100;paintRange(e.target);clickSnd();};
$('amb').oninput=e=>{ambPct=e.target.value/100;$('ambV').textContent=e.target.value+'%';paintRange(e.target);};
$('turbo').onchange=e=>{turbo=e.target.checked;clickSnd();};
$('explode').onchange=e=>{explodeOn=e.target.checked;clickSnd();};
$('bloomT').onchange=e=>{bloomPass.enabled=e.target.checked;clickSnd();};
$('fxChips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  lighting.fx=b.dataset.fx;
  $('fxChips').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
  clickSnd();
});
$('camChips').querySelectorAll('.chip').forEach(b=>b.onclick=()=>{
  goCam(b.dataset.cam);
  $('camChips').querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',x===b));
  clickSnd();
});
$('sndBtn').onclick=()=>{
  snd.on=!snd.on;
  if(snd.on){audioInit();if(snd.ac&&snd.ac.state==='suspended')snd.ac.resume();}
  $('sndBtn').classList.toggle('on',snd.on);
};
$('colBtn').onclick=()=>{
  $('hudBody').classList.toggle('off');
  $('colBtn').classList.toggle('closed');
};

/* ---------- picking / labels ---------- */
const ray=new THREE.Raycaster(),ndc=new THREE.Vector2();
let downP=null,tipTimer=null;
function labelAt(e){
  ndc.set(e.clientX/W*2-1,-(e.clientY/H)*2+1);
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(caseRoot.children,true);
  for(const hh of hits){
    let o=hh.object;
    while(o&&!o.userData.label)o=o.parent;
    if(o)return o.userData.label;
  }
  return null;
}
canvas.addEventListener('pointerdown',e=>{downP=[e.clientX,e.clientY];});
canvas.addEventListener('pointerup',e=>{
  if(!downP)return;
  const moved=Math.hypot(e.clientX-downP[0],e.clientY-downP[1]);downP=null;
  if(moved>7)return;
  const lab=labelAt(e);
  if(lab){
    tip.textContent=lab;
    tip.style.left=Math.min(e.clientX+14,W-230)+'px';
    tip.style.top=(e.clientY+12)+'px';
    tip.classList.add('show');
    clearTimeout(tipTimer);tipTimer=setTimeout(()=>tip.classList.remove('show'),2200);
  }else tip.classList.remove('show');
});
let lastHover=0;
canvas.addEventListener('pointermove',e=>{
  const now=performance.now();
  if(now-lastHover<90||downP)return;
  lastHover=now;
  canvas.style.cursor=labelAt(e)?'pointer':'grab';
});

/* ---------- HUD text updates ---------- */
let hudAcc=0,oledAcc=0,fpsE=60,fpsAcc=0;
function statusInfo(){
  if(sys.on)return sys.u<1?['BOOTING','boot']:['ONLINE · '+fmtU(sys.onT),'on'];
  return sys.u>0.02?['SHUTDOWN','boot']:['STANDBY','idle'];
}
function hudFrame(dt){
  fpsE=fpsE*0.92+(dt>0?1/dt:60)*0.08;
  fpsAcc+=dt;
  if(fpsAcc>0.5){fpsAcc=0;$('fps').textContent=Math.round(fpsE)+' fps';}
  hudAcc+=dt;
  if(hudAcc>0.3){
    hudAcc=0;
    const [txt,cls]=statusInfo();
    $('stTxt').textContent=txt;
    $('stDot').className='dot '+cls;
    $('tele').textContent='CPU '+Math.round(TE.cpu)+'° · GPU '+Math.round(TE.gpu)+'° · '+TE.rpm+' RPM';
    $('fanV').textContent=TE.rpm+' rpm';
  }
  oledAcc+=dt;
  if(oledAcc>0.3){oledAcc=0;drawOLED();}
}

/* ---------- resize ---------- */
addEventListener('resize',()=>{
  W=innerWidth;H=innerHeight;
  camera.aspect=W/H;camera.updateProjectionMatrix();
  renderer.setSize(W,H);composer.setSize(W,H);
});

/* ---------- main loop ---------- */
const clock=new THREE.Clock();
renderer.setAnimationLoop(()=>{
  const dt=Math.min(clock.getDelta(),0.05);
  tG+=dt;
  updateBoot(dt);
  updateFans(dt);
  updateRGB();
  updateTubes(dt);
  updateExplode(dt);
  // room dimmer
  hemi.intensity=0.55*ambPct;key.intensity=2.1*ambPct;rim.intensity=0.7*ambPct;
  updateCam(dt);
  controls.update();
  audioFrame(dt);
  hudFrame(dt);
  composer.render();
});

// self-ignite shortly after load so the build shows itself off
setTimeout(()=>{if(!sys.on)setPower(true);},1000);
</script>
