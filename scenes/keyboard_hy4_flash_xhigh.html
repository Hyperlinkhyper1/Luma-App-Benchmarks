<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Interactive 3D Mechanical Keyboard</title>
<style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background-color: #151515;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: #ffffff;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #ui {
    position: absolute;
    top: 20px;
    left: 20px;
    z-index: 10;
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  button {
    background: rgba(30, 30, 30, 0.6);
    border: 1px solid rgba(255, 255, 255, 0.15);
    color: #fff;
    padding: 10px 18px;
    border-radius: 8px;
    cursor: pointer;
    backdrop-filter: blur(8px);
    font-size: 14px;
    font-weight: 500;
    transition: all 0.2s ease;
    outline: none;
  }
  button:hover {
    background: rgba(60, 60, 60, 0.8);
    border-color: rgba(255, 255, 255, 0.3);
  }
  button:active {
    transform: translateY(1px);
  }
  #audioHint {
    position: absolute;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(0, 0, 0, 0.75);
    color: #eee;
    padding: 12px 24px;
    border-radius: 30px;
    font-size: 14px;
    pointer-events: none;
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(4px);
    transition: opacity 0.5s ease;
  }
</style>
<script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
</script>
</head>
<body>

<div id="ui">
  <button id="replayBtn">Replay Assembly</button>
  <button id="muteBtn">Mute: OFF</button>
</div>
<div id="audioHint">Click anywhere or press a key to enable sound</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// --- Scene Setup ---
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x151515);

const camera = new THREE.PerspectiveCamera(40, window.innerWidth / window.innerHeight, 1, 1000);
camera.position.set(0, 14, 20);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.05;
controls.minDistance = 10;
controls.maxDistance = 35;
controls.maxPolarAngle = Math.PI / 2 - 0.05;
controls.target.set(0, 0, 0);

// --- Lighting ---
const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
scene.add(ambientLight);

const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
dirLight.position.set(10, 25, 10);
dirLight.castShadow = true;
dirLight.shadow.mapSize.width = 2048;
dirLight.shadow.mapSize.height = 2048;
dirLight.shadow.camera.left = -15;
dirLight.shadow.camera.right = 15;
dirLight.shadow.camera.top = 15;
dirLight.shadow.camera.bottom = -15;
dirLight.shadow.bias = -0.001;
scene.add(dirLight);

const fillLight = new THREE.DirectionalLight(0xaaccff, 0.8);
fillLight.position.set(-10, 10, -10);
scene.add(fillLight);

// --- Floor ---
const floorGeo = new THREE.PlaneGeometry(100, 100);
const floorMat = new THREE.ShadowMaterial({ opacity: 0.6 });
const floor = new THREE.Mesh(floorGeo, floorMat);
floor.rotation.x = -Math.PI / 2;
floor.position.y = -0.6;
floor.receiveShadow = true;
scene.add(floor);

// --- Materials ---
const matCase = new THREE.MeshStandardMaterial({ color: 0x2c3e50, roughness: 0.4, metalness: 0.6 });
const matPcb = new THREE.MeshStandardMaterial({ color: 0x1a3626, roughness: 0.8, metalness: 0.1 });
const matFoam = new THREE.MeshStandardMaterial({ color: 0x222222, roughness: 1.0, metalness: 0.0 });
const matPlate = new THREE.MeshStandardMaterial({ color: 0xb0bec5, roughness: 0.3, metalness: 0.9 });
const matSwitchBottom = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.6 });
const matSwitchTop = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.85, roughness: 0.4 });
const matStem = new THREE.MeshStandardMaterial({ color: 0xf1c40f, roughness: 0.5 });

const matCapBase = new THREE.MeshStandardMaterial({ color: 0xecf0f1, roughness: 0.6 });
const matCapAccent = new THREE.MeshStandardMaterial({ color: 0xe74c3c, roughness: 0.6 });

// --- Case Construction ---
const caseGroup = new THREE.Group();
const base = new THREE.Mesh(new THREE.BoxGeometry(15.4, 0.6, 5.4), matCase);
base.position.set(0, -0.3, 0);
base.receiveShadow = true;
base.castShadow = true;
caseGroup.add(base);

const wallH = 0.8;
const wallY = 0.4;
const wallL = new THREE.Mesh(new THREE.BoxGeometry(0.2, wallH, 5.4), matCase);
wallL.position.set(-7.6, wallY, 0); wallL.castShadow = true; wallL.receiveShadow = true; caseGroup.add(wallL);
const wallR = new THREE.Mesh(new THREE.BoxGeometry(0.2, wallH, 5.4), matCase);
wallR.position.set(7.6, wallY, 0); wallR.castShadow = true; wallR.receiveShadow = true; caseGroup.add(wallR);
const wallF = new THREE.Mesh(new THREE.BoxGeometry(15.2, wallH, 0.2), matCase);
wallF.position.set(0, wallY, -2.6); wallF.castShadow = true; wallF.receiveShadow = true; caseGroup.add(wallF);
const wallB = new THREE.Mesh(new THREE.BoxGeometry(15.2, wallH, 0.2), matCase);
wallB.position.set(0, wallY, 2.6); wallB.castShadow = true; wallB.receiveShadow = true; caseGroup.add(wallB);
scene.add(caseGroup);

// --- Internal Layers ---
const pcbMesh = new THREE.Mesh(new THREE.BoxGeometry(15.0, 0.1, 5.0), matPcb);
const foamMesh = new THREE.Mesh(new THREE.BoxGeometry(15.0, 0.2, 5.0), matFoam);
const plateMesh = new THREE.Mesh(new THREE.BoxGeometry(15.0, 0.1, 5.0), matPlate);
[pcbMesh, foamMesh, plateMesh].forEach(m => { m.castShadow = true; m.receiveShadow = true; scene.add(m); });

// --- Key Data Definition ---
const layout = [
  [['Escape','Esc',1,'mod'], ['Digit1','1',1,'normal'], ['Digit2','2',1,'normal'], ['Digit3','3',1,'normal'], ['Digit4','4',1,'normal'], ['Digit5','5',1,'normal'], ['Digit6','6',1,'normal'], ['Digit7','7',1,'normal'], ['Digit8','8',1,'normal'], ['Digit9','9',1,'normal'], ['Digit0','0',1,'normal'], ['Minus','-',1,'normal'], ['Equal','=',1,'normal'], ['Backspace','Backspace',2,'backspace']],
  [['Tab','Tab',1.5,'mod'], ['KeyQ','Q',1,'normal'], ['KeyW','W',1,'normal'], ['KeyE','E',1,'normal'], ['KeyR','R',1,'normal'], ['KeyT','T',1,'normal'], ['KeyY','Y',1,'normal'], ['KeyU','U',1,'normal'], ['KeyI','I',1,'normal'], ['KeyO','O',1,'normal'], ['KeyP','P',1,'normal'], ['BracketLeft','[',1,'normal'], ['BracketRight',']',1,'normal'], ['Backslash','\\',1.5,'normal']],
  [['CapsLock','Caps',1.75,'mod'], ['KeyA','A',1,'normal'], ['KeyS','S',1,'normal'], ['KeyD','D',1,'normal'], ['KeyF','F',1,'normal'], ['KeyG','G',1,'normal'], ['KeyH','H',1,'normal'], ['KeyJ','J',1,'normal'], ['KeyK','K',1,'normal'], ['KeyL','L',1,'normal'], ['Semicolon',';',1,'normal'], ['Quote',"'",1,'normal'], ['Enter','Enter',2.25,'enter']],
  [['ShiftLeft','Shift',2.25,'mod'], ['KeyZ','Z',1,'normal'], ['KeyX','X',1,'normal'], ['KeyC','C',1,'normal'], ['KeyV','V',1,'normal'], ['KeyB','B',1,'normal'], ['KeyN','N',1,'normal'], ['KeyM','M',1,'normal'], ['Comma',',',1,'normal'], ['Period','.',1,'normal'], ['Slash','/',1,'normal'], ['ShiftRight','Shift',2.75,'mod']],
  [['ControlLeft','Ctrl',1.25,'mod'], ['MetaLeft','Win',1.25,'mod'], ['AltLeft','Alt',1.25,'mod'], ['Space','',6.25,'space'], ['AltRight','Alt',1.25,'mod'], ['Fn','Fn',1.25,'mod'], ['ContextMenu','Menu',1.25,'mod'], ['ControlRight','Ctrl',1.25,'mod']]
];

const keys = [];
for (let r = 0; r < layout.length; r++) {
  let x = -7.5;
  const z = -2 + r;
  for (let c = 0; c < layout[r].length; c++) {
    const k = layout[r][c];
    const w = k[2];
    keys.push({ code: k[0], label: k[1], w: w, type: k[3], x: x + w/2, z: z });
    x += w;
  }
}

// --- Mesh Construction & Animation Setup ---
const animations = [];
const raycastMeshes = [];
const keyMap = {};

function addAnim(mesh, startPos, endPos, startRot, startTime, duration) {
  animations.push({ mesh, startPos, endPos, startRot, startTime, duration });
}

function makeTextTexture(text, textColor) {
  const canvas = document.createElement('canvas');
  canvas.width = 128; canvas.height = 128;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = textColor;
  let fontSize = 38;
  if (text.length > 4) fontSize = 24;
  else if (text.length > 2) fontSize = 28;
  ctx.font = `bold ${fontSize}px sans-serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(text, 64, 64);
  const tex = new THREE.CanvasTexture(canvas);
  tex.anisotropy = 16;
  return tex;
}

const capGeo = new THREE.CylinderGeometry(0.68, 0.6, 0.5, 4, 1);
const swBottomGeo = new THREE.BoxGeometry(0.6, 0.4, 0.6);
const swTopGeo = new THREE.BoxGeometry(0.5, 0.2, 0.5);
const stemGeo = new THREE.BoxGeometry(0.2, 0.3, 0.2);

keys.forEach(k => {
  // Switch
  const switchGroup = new THREE.Group();
  const swBottom = new THREE.Mesh(swBottomGeo, matSwitchBottom);
  swBottom.position.y = 0.60; swBottom.castShadow = true;
  const swTop = new THREE.Mesh(swTopGeo, matSwitchTop);
  swTop.position.y = 0.90; swTop.castShadow = true;
  const stemGroup = new THREE.Group();
  stemGroup.position.y = 1.15;
  const stem = new THREE.Mesh(stemGeo, matStem);
  stem.castShadow = true;
  stemGroup.add(stem);
  switchGroup.add(swBottom, swTop, stemGroup);
  scene.add(switchGroup);

  // Keycap
  const kGroup = new THREE.Group();
  const capMeshGroup = new THREE.Group();
  capMeshGroup.position.y = 1.55;
  
  const isAccent = ['mod', 'enter', 'backspace'].includes(k.type) || k.code === 'Escape';
  const capMat = isAccent ? matCapAccent : matCapBase;
  const cap = new THREE.Mesh(capGeo, capMat);
  cap.rotation.y = Math.PI / 4;
  cap.scale.x = k.w;
  cap.castShadow = true;
  cap.receiveShadow = true;
  capMeshGroup.add(cap);

  if (k.label) {
    const textColor = isAccent ? 'rgba(255,255,255,0.9)' : 'rgba(0,0,0,0.85)';
    const tex = makeTextTexture(k.label, textColor);
    const planeMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(0.65, 0.65), planeMat);
    plane.rotation.x = -Math.PI / 2;
    plane.position.y = 0.26;
    capMeshGroup.add(plane);
  }

  kGroup.add(capMeshGroup);
  scene.add(kGroup);

  k.switchGroup = switchGroup;
  k.keycapMesh = kGroup;
  k.capMeshGroup = capMeshGroup;
  k.stemGroup = stemGroup;
  k.isPressed = false;

  cap.userData = { keyData: k };
  raycastMeshes.push(cap);
  keyMap[k.code] = k;
});

// --- Exploded View Animation ---
const t0 = 800;
addAnim(pcbMesh, new THREE.Vector3(0, 20, 0), new THREE.Vector3(0, 0.05, 0), new THREE.Euler(0,0,0), t0, 1000);
addAnim(foamMesh, new THREE.Vector3(10, 20, 10), new THREE.Vector3(0, 0.20, 0), new THREE.Euler(0,0,0), t0 + 1000, 1000);
addAnim(plateMesh, new THREE.Vector3(-10, 20, -10), new THREE.Vector3(0, 0.35, 0), new THREE.Euler(0,0,0), t0 + 2000, 1000);

const sortedKeys = [...keys].sort((a,b) => a.x - b.x);
const switchStart = t0 + 3000;
const stagger = 40;

sortedKeys.forEach((k, i) => {
  const sPos = new THREE.Vector3(k.x + (Math.random()-0.5)*6, 25 + Math.random()*10, k.z + (Math.random()-0.5)*6);
  const sRot = new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
  addAnim(k.switchGroup, sPos, new THREE.Vector3(k.x, 0, k.z), sRot, switchStart + i * stagger, 600);
});

const keycapStart = switchStart + sortedKeys.length * stagger + 200;
sortedKeys.forEach((k, i) => {
  const sPos = new THREE.Vector3(k.x + (Math.random()-0.5)*6, 35 + Math.random()*10, k.z + (Math.random()-0.5)*6);
  const sRot = new THREE.Euler(Math.random()*Math.PI, Math.random()*Math.PI, Math.random()*Math.PI);
  addAnim(k.keycapMesh, sPos, new THREE.Vector3(k.x, 0, k.z), sRot, keycapStart + i * stagger, 600);
});

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
let animStartTime = performance.now();
let isAssembled = false;

function updateAssembly(time) {
  if (reduceMotion) {
    if (!isAssembled) {
      animations.forEach(a => { a.mesh.position.copy(a.endPos); a.mesh.rotation.set(0,0,0); });
      isAssembled = true;
    }
    return;
  }
  let allDone = true;
  animations.forEach(a => {
    let p = (time - a.startTime) / a.duration;
    if (p < 1) allDone = false;
    p = Math.max(0, Math.min(1, p));
    const eased = 1 - Math.pow(1 - p, 3); // easeOutCubic
    a.mesh.position.lerpVectors(a.startPos, a.endPos, eased);
    a.mesh.rotation.set(
      a.startRot.x * (1-eased),
      a.startRot.y * (1-eased),
      a.startRot.z * (1-eased)
    );
  });
  if (allDone) isAssembled = true;
}
updateAssembly(0); // Init positions

// --- Audio System ---
let audioCtx;
let muted = false;
let audioInitialized = false;
const hint = document.getElementById('audioHint');
const muteBtn = document.getElementById('muteBtn');

function initAudio() {
  if (audioInitialized) return;
  const AudioContext = window.AudioContext || window.webkitAudioContext;
  if (AudioContext) {
    audioCtx = new AudioContext();
    audioInitialized = true;
    hint.style.opacity = '0';
    setTimeout(() => hint.style.display = 'none', 500);
  }
}

window.addEventListener('pointerdown', initAudio, { once: true });
window.addEventListener('keydown', initAudio, { once: true });

muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.textContent = `Mute: ${muted ? 'ON' : 'OFF'}`;
  if (!muted) initAudio();
});

function playSound(type) {
  if (muted || !audioInitialized) return;
  if (audioCtx.state === 'suspended') audioCtx.resume();

  const dur = 0.1;
  const bufferSize = audioCtx.sampleRate * dur;
  const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) data[i] = Math.random() * 2 - 1;
  
  const noise = audioCtx.createBufferSource();
  noise.buffer = buffer;
  const noiseFilter = audioCtx.createBiquadFilter();
  noiseFilter.type = 'highpass';
  const noiseEnv = audioCtx.createGain();
  
  const osc = audioCtx.createOscillator();
  osc.type = 'sine';
  const gain = audioCtx.createGain();

  let baseFreq = 200, decay = 0.05, noiseFreq = 5000, vol = 0.5;
  switch(type) {
    case 'space': baseFreq = 60; decay = 0.15; noiseFreq = 1000; vol = 0.9; break;
    case 'enter': baseFreq = 120; decay = 0.12; noiseFreq = 2000; vol = 0.7; break;
    case 'backspace': baseFreq = 150; decay = 0.08; noiseFreq = 3000; vol = 0.6; break;
    case 'mod': baseFreq = 180; decay = 0.06; noiseFreq = 4000; vol = 0.5; break;
    default: baseFreq = 200; decay = 0.05; noiseFreq = 5000; vol = 0.4; break;
  }

  noiseFilter.frequency.value = noiseFreq;
  noiseEnv.gain.setValueAtTime(vol * 0.5, audioCtx.currentTime);
  noiseEnv.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + dur);

  osc.frequency.setValueAtTime(baseFreq, audioCtx.currentTime);
  osc.frequency.exponentialRampToValueAtTime(baseFreq / 2, audioCtx.currentTime + decay);
  gain.gain.setValueAtTime(vol, audioCtx.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + decay);

  noise.connect(noiseFilter).connect(noiseEnv).connect(audioCtx.destination);
  osc.connect(gain).connect(audioCtx.destination);

  noise.start(); osc.start();
  noise.stop(audioCtx.currentTime + dur);
  osc.stop(audioCtx.currentTime + decay);
}

// --- Interaction ---
function pressKey(kData) {
  if (kData.isPressed) return;
  kData.isPressed = true;
  kData.capMeshGroup.position.y = 1.55 - 0.15;
  kData.stemGroup.position.y = 1.15 - 0.1;
  playSound(kData.type);
}
function releaseKey(kData) {
  if (!kData.isPressed) return;
  kData.isPressed = false;
  kData.capMeshGroup.position.y = 1.55;
  kData.stemGroup.position.y = 1.15;
}

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
let mouseDownKey = null;

window.addEventListener('pointerdown', (e) => {
  if (!isAssembled) return;
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObjects(raycastMeshes);
  if (intersects.length > 0) {
    const kData = intersects[0].object.userData.keyData;
    pressKey(kData);
    mouseDownKey = kData;
  }
});
window.addEventListener('pointerup', () => {
  if (mouseDownKey) { releaseKey(mouseDownKey); mouseDownKey = null; }
});
window.addEventListener('pointerleave', () => {
  if (mouseDownKey) { releaseKey(mouseDownKey); mouseDownKey = null; }
});

window.addEventListener('keydown', (e) => {
  const kData = keyMap[e.code];
  if (kData) {
    if (['Space', 'Tab', 'Backspace'].includes(e.code)) e.preventDefault();
    if (e.repeat) return;
    pressKey(kData);
  }
});
window.addEventListener('keyup', (e) => {
  const kData = keyMap[e.code];
  if (kData && !e.repeat) releaseKey(kData);
});

document.getElementById('replayBtn').addEventListener('click', () => {
  isAssembled = false;
  animStartTime = performance.now();
  keys.forEach(k => {
    k.isPressed = false;
    k.capMeshGroup.position.y = 1.55;
    k.stemGroup.position.y = 1.15;
  });
  updateAssembly(0);
});

// --- Resize & Loop ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

function animate() {
  requestAnimationFrame(animate);
  const elapsed = performance.now() - animStartTime;
  updateAssembly(elapsed);
  controls.update();
  renderer.render(scene, camera);
}
animate();

</script>
</body>
</html>
