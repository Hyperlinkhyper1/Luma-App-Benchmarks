<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>World Timeline</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#070b17;color:#e9f1ff;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}
#wrap{position:fixed;inset:0;display:flex;flex-direction:column;isolation:isolate}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
#art{display:block;width:100%;height:100%;background:radial-gradient(ellipse at 50% 42%,#162847,#060a16 70%)}
#ui{position:relative;z-index:4;padding:7px 14px 10px;background:linear-gradient(#050a16b8,#03060cef);backdrop-filter:blur(6px);user-select:none}
#head{display:flex;align-items:center;gap:8px;margin-bottom:7px;min-height:28px}
button{background:#182d4a;border:1px solid #365378;color:#e8f0ff;border-radius:999px;padding:5px 12px;font:600 12px system-ui;cursor:pointer}
button:hover{background:#254667}
button:focus-visible{outline:2px solid #88c9ff}
#speed{background:#12213a;padding-right:9px}
#title{font-size:14px;font-weight:700;letter-spacing:.3px;margin:0 7px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#date{font:650 13px system-ui;color:#a9daff;white-space:nowrap}
#bar{position:relative;height:48px;touch-action:none;cursor:pointer;border:1px solid #3a506c;border-radius:8px;overflow:hidden;background:#0b1325}
#bands,#ticks,#headLine,#playhead{position:absolute;inset:0;pointer-events:none}
.band{position:absolute;top:0;height:22px;background:var(--c);opacity:.72;border-right:1px solid #ffffff26;display:flex;align-items:flex-start;padding:3px 5px;font-size:9px;font-weight:700;color:#e9f5ff;white-space:nowrap;overflow:hidden;text-shadow:0 1px 3px #000}
.scale{position:absolute;top:27px;font:9px system-ui;color:#7b92b3;letter-spacing:.2px}
.tick{position:absolute;top:0;height:31px;width:0;border-left:1px solid #cfe6ff48}
#playhead{width:2px;height:42px;background:#f4f8ff;box-shadow:0 0 9px #9bd0ff;z-index:2;transform:translateX(-1px);left:0}
#cap{position:absolute;left:0;right:0;bottom:0;padding:14px 18px 16px;display:flex;justify-content:center;align-items:flex-end;pointer-events:none;background:linear-gradient(transparent,#02061185);transition:opacity .35s}
#capbox{max-width:min(850px,78vw);text-align:center;text-shadow:0 2px 10px #000,0 1px 3px #000}
#capbox h1{font:800 clamp(22px,4.2vw,42px) system-ui;letter-spacing:-.7px;line-height:1.05;margin-bottom:5px}
#capbox p{font:clamp(11px,1.7vw,17px) system-ui;line-height:1.35;color:#d6e7fa}
#hint{position:absolute;top:12px;right:15px;color:#92aac6;font-size:10px;pointer-events:none;opacity:.75}
#hint kbd{border:1px solid #455e7f;border-radius:4px;padding:0 4px;background:#0e1826}
@media(max-width:700px){#head{flex-wrap:wrap;gap:4px}#title{font-size:11px;flex:1;min-width:100px}#speed{font-size:10px}#capbox{max-width:86vw}.scale{display:none}}
</style>
</head>
<body>
<div id="wrap">
 <div id="stage">
  <svg id="art" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid meet" aria-label="Animated illustrated history of the world">
   <defs>
    <linearGradient id="bgSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#080c19"/><stop offset="1" stop-color="#192c4b"/></linearGradient>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop id="s0" offset="0" stop-color="#1b1421"/><stop id="s1" offset=".55" stop-color="#7d3b22"/><stop id="s2" offset="1" stop-color="#dc8547"/></linearGradient>
    <radialGradient id="sunGlow"><stop stop-color="#ffdf86" stop-opacity=".7"/><stop offset=".35" stop-color="#ffb45e" stop-opacity=".22"/><stop offset="1" stop-color="#ff9d41" stop-opacity="0"/></radialGradient>
    <radialGradient id="magma" cx=".38" cy=".32" r=".75"><stop stop-color="#ffd66c"/><stop offset=".3" stop-color="#ff8a2c"/><stop offset=".65" stop-color="#d9451f"/><stop offset="1" stop-color="#60141b"/></radialGradient>
    <radialGradient id="ocean" cx=".35" cy=".25" r=".8"><stop stop-color="#4dafce"/><stop offset=".5" stop-color="#1b6e9b"/><stop offset="1" stop-color="#09254b"/></radialGradient>
    <linearGradient id="land" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#6d9851"/><stop offset="1" stop-color="#294e37"/></linearGradient>
    <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#d8b66f"/><stop offset="1" stop-color="#946d45"/></linearGradient>
    <linearGradient id="stone" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#b6b1a5"/><stop offset="1" stop-color="#5c6572"/></linearGradient>
    <linearGradient id="ice" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#e6f5ff"/><stop offset="1" stop-color="#8bbed9"/></linearGradient>
    <linearGradient id="night" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#040b1b"/><stop offset="1" stop-color="#16243f"/></linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="tiny"><feGaussianBlur stdDeviation="1.5"/></filter>
    <pattern id="dots" width="40" height="40" patternUnits="userSpaceOnUse"><circle cx="4" cy="5" r="1.1" fill="#b3d4f2" opacity=".7"/></pattern>
    <clipPath id="landClip"><ellipse cx="800" cy="620" rx="680" ry="285"/></clipPath>
    <clipPath id="globeClip"><circle cx="800" cy="500" r="282"/></clipPath>
   </defs>
   <g id="world">
    <rect x="0" y="0" width="1600" height="1000" fill="url(#bgSky)"/>
    <g id="stars" fill="#d9ecff"></g>
    <rect id="skyRect" x="0" y="0" width="1600" height="1000" fill="url(#sky)" opacity="0"/>
    <g id="sunGroup" transform="translate(1190 210)">
     <circle r="190" fill="url(#sunGlow)"/>
     <circle r="49" fill="#ffda7b" opacity=".85"/>
    </g>
    <g id="distant" opacity=".7"></g>
    <g id="ground" transform="translate(0 0)">
     <path d="M-60 725 C160 690 310 705 470 680 C660 646 800 700 970 669 C1170 635 1350 679 1660 655 L1660 1050 L-60 1050Z" fill="#173b34"/>
     <path d="M-60 754 C180 729 350 770 540 731 C760 688 920 748 1120 714 C1310 683 1490 732 1660 706 L1660 1050 L-60 1050Z" fill="#315a44"/>
     <path d="M-60 808 C160 768 385 815 575 775 C800 728 1030 794 1210 752 C1370 719 1550 770 1660 758 L1660 1050 L-60 1050Z" fill="#4a7048"/>
    </g>
    <g id="farContours" fill="none" stroke="#a5d5d4" stroke-width="2" opacity=".35"></g>
    <g id="globe" transform="translate(800 500)">
     <circle r="282" fill="url(#magma)"/>
     <g id="globeDetails" clip-path="url(#globeClip)">
      <g id="globeCracks" stroke="#ffdf80" stroke-width="5" fill="none" opacity=".8" filter="url(#glow)"></g>
      <g id="continents"></g>
      <g id="iceCap" opacity="0">
       <path d="M-310 -80 C-240 -198 -90 -275 70 -267 C190 -257 294 -151 299 -27 C215 -87 190 -151 119 -167 C7 -198 -51 -112 -122 -105 C-207 -107 -240 -56 -310 -80Z" fill="url(#ice)"/>
       <path d="M-305 150 C-226 79 -114 62 -29 96 C53 132 115 86 198 96 C255 104 295 142 310 190 L310 310 L-310 310Z" fill="url(#ice)"/>
      </g>
      <g id="globeRays" stroke="#ffd08a" stroke-width="2" opacity=".2"></g>
     </g>
     <circle r="282" fill="none" stroke="#b2e7ff" stroke-opacity=".4" stroke-width="2"/>
     <g id="moon" transform="translate(380 -150)">
      <circle r="60" fill="#aeb8c7"/><circle cx="-20" cy="-12" r="13" fill="#8b95a4"/><circle cx="20" cy="17" r="18" fill="#8f99a7"/><circle cx="12" cy="-31" r="8" fill="#909aaa"/>
     </g>
    </g>
    <g id="flying" fill="none" stroke="#ffd289" stroke-width="7" opacity="0"></g>
    <g id="groundLife"></g>
    <g id="particles"></g>
    <g id="bigText" opacity="0"></g>
   </g>
  </svg>
  <div id="cap"><div id="capbox"><h1 id="ctitle"></h1><p id="ccaption"></p></div></div>
  <div id="hint"><kbd>Space</kbd> play · <kbd>←</kbd><kbd>→</kbd> chapters · drag timeline</div>
 </div>
 <div id="ui">
  <div id="head">
   <button id="play" aria-label="Play or pause">Pause</button>
   <button id="speed" aria-label="Playback speed">1×</button>
   <button id="restart" aria-label="Restart animation">Restart</button>
   <div id="title">Formation of the Earth</div>
   <div id="date">4.54 billion years ago</div>
  </div>
  <div id="bar" role="slider" tabindex="0" aria-label="History timeline" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
   <div id="bands"></div><div id="ticks"></div><div id="playhead"></div>
  </div>
 </div>
</div>
<script>
(()=>{
'use strict';
const $=id=>document.getElementById(id),NS='http://www.w3.org/2000/svg';
const svg=$('art'),el=(n,a={},p=null)=>{let e=document.createElementNS(NS,n);for(let k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e};
const chapters=[
{at:4.54e9,title:'Formation of the Earth',date:'About 4.54 billion years ago',cap:'Dust and rock in the early Solar System collide and clump together, forming our young planet. About 4.5 billion years ago, a Mars-sized body called Theia strikes Earth, and the debris thrown into orbit becomes the Moon.',type:'space'},
{at:4.3e9,title:'The Hadean Earth',date:'About 4.3 billion years ago',cap:'For hundreds of millions of years, the young world is a churning, molten furnace. As the crust cools, water vapour condenses into the first oceans, ending the Hadean.',type:'hadean'},
{at:3.6e9,title:'The First Life',date:'About 3.7–3.5 billion years ago',cap:'Microbial mats build layered domes called stromatolites in shallow seas. Simple microbes begin the long story of life on Earth.',type:'life'},
{at:2.4e9,title:'The Great Oxidation Event',date:'About 2.4 billion years ago',cap:'Cyanobacteria release oxygen as waste, transforming the atmosphere and oceans. Iron in seawater rusts, and the sky slowly begins to change colour.',type:'oxygen'},
{at:720e6,title:'Snowball Earth',date:'About 720–635 million years ago',cap:'Ice sheets advance toward the tropics, and much of the planet freezes over. Volcanoes slowly build up carbon dioxide until the ice melts.',type:'snow'},
{at:538e6,title:'The Cambrian Explosion',date:'About 538 million years ago',cap:'In a geologically short interval, animals evolve shells, eyes, and legs. Trilobites, early fish, and strange predators fill the Cambrian seas.',type:'cambrian'},
{at:470e6,title:'Life Moves onto Land',date:'Roughly 470–375 million years ago',cap:'Tiny plants creep along wet shores, then ferns and trees create the first forests. Arthropods and eventually four-limbed animals follow them ashore.',type:'land'},
{at:252e6,title:'Pangaea and the Dinosaurs',date:'About 252–66 million years ago',cap:'The continents merge into Pangaea, then begin to drift apart. Dinosaurs dominate the land for about 165 million years.',type:'dino'},
{at:66e6,title:'The Asteroid Impact',date:'About 66 million years ago',cap:'A huge asteroid strikes near the Yucatán Peninsula. Fires, dust, and darkness follow; non-avian dinosaurs vanish.',type:'impact'},
{at:66e6-1,title:'The Rise of Mammals',date:'About 66–3 million years ago',cap:'With the dinosaurs gone, small mammals diversify into many ecological roles. Grasses spread, and primates begin to emerge.',type:'mammal'},
{at:3e5,title:'Homo sapiens',date:'About 300,000 years ago',cap:'Anatomically modern humans evolve in Africa. Knowledge, language, art, and cooperation carry them across the world.',type:'human'},
{at:-10000,title:'Farming Begins',date:'About 10,000 BCE',cap:'People in the Fertile Crescent and elsewhere begin cultivating crops and domesticating animals. Permanent villages replace many nomadic lives.',type:'farm'},
{at:-2560,title:'Early Civilisations',date:'About 2560 BCE (Great Pyramid of Giza)',cap:'Cities, writing, and organised states flourish in Mesopotamia and Egypt. Around 2560 BCE, Egyptian builders complete the Great Pyramid.',type:'egypt'},
{at:-500,title:'The Classical World',date:'About 500 BCE–400 CE',cap:'Greek city-states and later Rome shape politics, philosophy, and engineering, while Han China flourishes to the east. Trade networks link distant societies.',type:'classical'},
{at:800,title:'The Medieval World',date:'About 500–1500 CE',cap:'Agriculture and trade expand through the Byzantine, Islamic, European, and Asian worlds. Cities, universities, and long-distance routes connect growing populations.',type:'medieval'},
{at:1450,title:'Print and Exploration',date:'About 1450–1600 CE',cap:'Movable-type printing accelerates the spread of ideas. In 1492, Columbus crosses the Atlantic, beginning a new era of global exploration and exchange.',type:'explore'},
{at:1760,title:'The Industrial Revolution',date:'From about 1760 CE',cap:'Steam power, factories, and railways transform production and transport. Cities grow rapidly as fossil fuels power industry.',type:'industrial'},
{at:1903,title:'The Twentieth Century',date:'1903–1969 CE',cap:'Powered flight begins at Kitty Hawk in 1903. Two world wars reshape the globe, and in 1969 humans walk on the Moon.',type:'modern'},
{at:2026,title:'The Digital Age',date:'About 1970 CE–today',cap:'Computers, the internet, and smartphones connect billions of people. Scientific and technological change continues to reshape the planet and its life.',type:'digital'}
];
const segs=[['Hadean',4.6e9,4e9,'#5b2f2c'],['Archean',4e9,2.5e9,'#71432f'],['Proterozoic',2.5e9,5.38e8,'#35594d'],['Paleozoic',5.38e8,2.52e8,'#385c78'],['Mesozoic',2.52e8,6.6e7,'#50633f'],['Cenozoic',6.6e7,-10000,'#65513c'],['Human history',-10000,2050,'#704e65']];
const posMap=(y,start)=>{
 if(y>=start)return (1-y)/(1-start)*.68;
 const t=(start-y)/start;
 return .68+(1-.68)*Math.min(1,Math.pow(t,.22));
};
const bound=[4.6e9,4e9,2.5e9,5.38e8,2.52e8,6.6e7,-10000,2050];
const bounds=bound.map(b=>posMap(b,b===2050?-10000:4.6e9));
const T={};
function inv(v){for(let i=0;i<bounds.length-1;i++)if(v>=bounds[i])return bound[i]*Math.pow(bound[i+1]/bound[i],(v-bounds[i])/(bounds[i+1]-bounds[i]));return bound[bound.length-1]}
const fmtTime=y=>{y=Math.round(y);if(y<-100000)return (y/-1e9).toFixed(2).replace(/\.00$/,'')+' billion years ago';if(y<-1e6)return (y/-1e6).toFixed(1).replace(/\.0$/,'')+' million years ago';if(y<-10000)return Math.round(y/1000)+',000 years ago';if(y<0)return Math.round(-y)+' BCE';return y+' CE'};
let progress=0,playing=true,last=0,dur=185,scrubbing=false,speed=1;
const capTitle=$('ctitle'),capCaption=$('ccaption');
function chIndex(y){let i=0;for(let k=0;k<chapters.length;k++)if(y<=chapters[k].at)i=k;return Math.min(chapters.length-1,i)}
function updateUI(){
 const v=posMap(progress,dur),idx=chIndex(inv(v));
 $('playhead').style.left=(v*100)+'%';$('bar').setAttribute('aria-valuenow',Math.round(v*100));
 capTitle.textContent=chapters[idx].title;capCaption.textContent=chapters[idx].cap;
 $('date').textContent=idx<10?fmtTime(chapters[idx].at):chapters[idx].date;
 if(idx!==T.lastIdx){T.lastIdx=idx;$('title').textContent=chapters[idx].title;renderArt(idx,v)}
}
segs.forEach((s,i)=>{const a=posMap(s[1],4.6e9),b=posMap(s[2],4.6e9),d=document.createElement('div');d.className='band';d.style.cssText=`left:${a*100}%;width:${(b-a)*100}%;--c:${s[3]}`;d.textContent=s[0];$('bands').append(d)});
[4.54e9,2.4e9,5.38e8,2.52e8,66e6,-10000,-2560,1450,1760,1903,1969,2026].forEach(y=>{const x=posMap(y,4.6e9),d=document.createElement('div');d.className='tick';d.style.left=x*100+'%';d.title=fmtTime(y);$('ticks').append(d)});
[0,1].forEach((v,i)=>{const d=document.createElement('div');d.className='scale';d.style.left=(v?51:0)+'%';d.textContent=v?'linear CE years →':'piecewise deep time (log scale within eras)';$('bar').append(d)});
$('playhead').title='Drag to scrub';
$('playhead').style.pointerEvents='auto';$('playhead').style.width='16px';$('playhead').style.marginLeft='-8px';$('playhead').style.background='transparent';$('playhead').style.boxShadow='none';$('playhead').style.borderLeft='2px solid white';
function seek(x){let v=x*$('bar').getBoundingClientRect().width;progress=inv(v/(1));T.lastIdx=-1;updateUI()}
function setPlaying(v){playing=v;$('play').textContent=v?'Pause':'Play';if(v)last=performance.now()}
$('play').onclick=()=>setPlaying(!playing);
$('restart').onclick=()=>{progress=0;T.lastIdx=-1;setPlaying(true);last=performance.now();updateUI()};
$('speed').onclick=()=>{speed=speed===.5?1:speed===1?2:.5;$('speed').textContent=speed+'×'};
function jump(i){i=Math.max(0,Math.min(chapters.length-1,i));let y=chapters[i].at;progress=y>=2050?-10000:posMap(y,4.6e9)*dur;if(y>=2050)progress=.98*dur;T.lastIdx=-1;updateUI()}
$('bar').addEventListener('pointerdown',e=>{scrubbing=true;$('bar').setPointerCapture(e.pointerId);seek(e.clientX);e.preventDefault()});
$('bar').addEventListener('pointermove',e=>{if(scrubbing)seek(e.clientX)});
$('bar').addEventListener('pointerup',()=>{scrubbing=false});
$('bar').addEventListener('keydown',e=>{if(e.key==='Home')jump(0);if(e.key==='End')jump(chapters.length-1)});
window.addEventListener('keydown',e=>{if(e.code==='Space'){e.preventDefault();setPlaying(!playing)}else if(e.key==='ArrowRight'){e.preventDefault();jump(chIndex(inv(posMap(progress,dur)))+1)}else if(e.key==='ArrowLeft'){e.preventDefault();jump(chIndex(inv(posMap(progress,dur)))-1)}});

/* Procedural sky: 95 stars, some constellations */
for(let i=0;i<110;i++){let x=40+Math.random()*1520,y=35+Math.random()*570,r=.6+Math.random()*1.7;el('circle',{cx:x,cy:y,r,fill:i%7===0?'#ffe5a8':'#dcecff',opacity:.3+Math.random()*.65},$('stars'))}
for(let i=0;i<9;i++){let x=100+i*180,y=310+Math.random()*180;let p=el('path',{d:`M${x} 0 Q${x+20} -40 ${x+40} 0 Q${x+20} -16 ${x} 0Z`},$('distant'));p.setAttribute('transform','translate(0 '+y+')');p.setAttribute('fill','#16344e');p.setAttribute('opacity','.45')}
for(let i=0;i<20;i++){let a=i/20*Math.PI*2;el('path',{d:`M${Math.cos(a)*300} ${Math.sin(a)*300}L${Math.cos(a)*360} ${Math.sin(a)*360}`},$('globeRays'))}
for(let i=0;i<15;i++){let d='';for(let j=0;j<8;j++){let x=(j%2)*800+Math.random()*260-130,y=260+Math.random()*240;d+=(j?'L':'M')+x+' '+y+' ';}el('path',{d,stroke:'#ffbe5f','stroke-width':2+Math.random()*3,opacity:.2+Math.random()*.5},$('globeCracks'))}
const conts=[
'M-270 -155 L-105 -230 L43 -148 L20 -38 L-80 -22 L-115 58 L-191 12Z',
'M-33 -100 L70 -215 L221 -150 L192 -52 L121 13 L56 69 L-18 26Z',
'M170 4 L257 -27 L297 70 L220 182 L140 238 L107 161 L130 68Z',
'M-245 89 L-202 152 L-154 172 L-125 128 L-161 70Z',
'M25 118 L81 101 L97 165 L62 215 L8 188Z',
'M203 -180 L235 -203 L261 -164 L249 -130 L217 -128Z'
];
let conPaths=[];
conts.forEach((d,i)=>{let p=el('path',{d,fill:i===2?'#758b45':'#527444',stroke:'#9db780','stroke-width':2,opacity:i===2?.7:.95},$('continents'));conPaths.push(p)});
/* Life / landscape elements */
const groundLife=$('groundLife'),particles=$('particles'),flying=$('flying');
const tuft=(x,y,s,col='#2e593b')=>el('path',{d:`M${x} ${y}q${-8*s} ${-20*s} ${-1*s} ${-32*s}q${8*s} ${-8*s} ${12*s} ${2*s}q${3*s} ${12*s} ${-11*s} ${30*s}`,fill:col,opacity:.8},groundLife);
function tree(x,y,s=1,col='#294e37'){let g=el('g',{transform:`translate(${x} ${y}) scale(${s})`},groundLife);el('rect',{x:-4,y:-62,width:8,height:62,fill:'#5a3b29'},g);el('path',{d:'M0 -105 C-30 -92 -42 -67 -26 -57 C-13 -50 -8 -36 0 -38 C13 -47 20 -40 30 -54 C44 -67 23 -92 0 -105Z',fill:col},g);return g}
function pine(x,y,s=1){let g=el('g',{transform:`translate(${x} ${y}) scale(${s})`},groundLife);el('rect',{x:-3,y:-40,width:6,height:40,fill:'#5e412e'},g);el('path',{d:'M0 -105 L28 -52 L-28 -52Z M0 -77 L34 -25 L-34 -25Z',fill:'#24483c'},g);return g}
function mountain(x,y,s=1){return el('path',{d:`M${x-80*s} ${y} L${x} ${y-150*s} L${x+85*s} ${y}Z`,fill:'#596978',stroke:'#c3d4d6','stroke-width':2},groundLife)}
function person(x,y,s=1,col='#edc49d'){let g=el('g',{transform:`translate(${x} ${y}) scale(${s})`},groundLife);el('circle',{cy:-50,r:7,fill:col},g);el('path',{d:'M-5 -40 L-9 -5 M5 -40 L8 -5 M0 -40 L0 -8',stroke:'#293d4c','stroke-width':7,'stroke-linecap':'round'},g);return g}
function beast(x,y,s=1,col='#4e513d',long=true){let g=el('g',{transform:`translate(${x} ${y}) scale(${s})`},groundLife);el('path',{d:long?'M-35 -22 Q-10 -47 20 -35 Q40 -28 51 -45 L61 -30 Q43 -18 26 -17 L30 0 L18 0 L12 -12 L-15 -12 L-23 0 L-36 0Z':'M-30 -22 Q0 -49 33 -31 L38 0 L25 0 L18 -18 L-15 -16 L-22 0 L-35 0Z',fill:col},g);return g}
function dino(x,y,s=1,c='#617b50'){let g=el('g',{transform:`translate(${x} ${y}) scale(${s})`},groundLife);el('path',{d:'M-68 -25 Q-38 -39 -3 -42 Q32 -45 49 -84 L68 -93 L72 -82 L59 -68 Q54 -28 30 -16 L28 2 L15 2 L10 -14 L-22 -13 L-28 2 L-41 2 L-38 -17 Q-53 -18 -68 -25Z',fill:c},g);return g}
function bird(x,y,s=1){let g=el('g',{transform:`translate(${x} ${y}) scale(${s})`},flying);el('path',{d:'M0 0 Q-15 -13 -27 -2 M0 0 Q15 -13 27 -2',stroke:'#20344a','stroke-width':3,fill:'none'},g);return g}

let lastAnim=0;
function frame(now){
 let dt=Math.min(.08,(now-last)/1000||0);last=now;
 if(playing&&!scrubbing){progress+=dt*speed;if(progress>dur)progress-=dur;}
 updateUI();
 if(progress===0&&playing)updateUI();
 tickParticles(dt);
 if(!scrubbing){const t=now/1000;let globe=$('globe');if(globe.style.display!=='none'){globe.setAttribute('transform',`translate(800 ${500+Math.sin(t*.35)*3})`);$('moon').setAttribute('transform',`translate(${380+Math.sin(t*.18)*12} ${-150+Math.cos(t*.23)*8}) rotate(${t*1.2})`)}
 else{let p=flying; if(flying.getAttribute('opacity')!=='0'){for(let i=0;i<p.children.length;i++){let c=p.children[i];if(c.tagName==='g'){let x=0;c.setAttribute('transform',`translate(${x} ${Math.sin(t*2+i)*5})`);}}}}
 }
 requestAnimationFrame(frame);
}

})();
