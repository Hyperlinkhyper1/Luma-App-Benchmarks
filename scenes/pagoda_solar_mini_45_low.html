<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Voxel Garden — Spring Festival at the Five-Story Pagoda</title>
<style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#0b0f10;}
  canvas{display:block;}
  #hud{
    position:fixed;left:16px;top:14px;color:#f6efe4;font-family:Georgia,'Times New Roman',serif;
    font-size:13px;letter-spacing:0.08em;user-select:none;pointer-events:none;
    text-shadow:0 1px 6px rgba(0,0,0,0.8);line-height:1.5;
  }
  #hud h1{font-size:15px;letter-spacing:0.22em;margin:0 0 4px 0;font-weight:400;color:#ffe9cf;}
  #hud .sub{font-size:11px;letter-spacing:0.1em;color:#cfc3b0;}
  #hud .foot{font-size:10.5px;letter-spacing:0.12em;color:#a99d89;margin-top:5px;}
  #ui{
    position:fixed;right:16px;top:14px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;
    font-family:Georgia,serif;color:#f6efe4;font-size:11px;letter-spacing:0.1em;user-select:none;
  }
  #ui .row{display:flex;align-items:center;gap:8px;background:rgba(10,12,12,0.55);border:1px solid rgba(230,210,180,0.22);
    border-radius:6px;padding:6px 10px;backdrop-filter:blur(4px);}
  #ui input[type=range]{width:130px;accent-color:#e8b86d;cursor:pointer;}
  #ui button{
    background:transparent;color:#ffe9cf;border:1px solid rgba(230,210,180,0.35);border-radius:4px;
    font-family:inherit;font-size:10.5px;letter-spacing:0.12em;padding:4px 10px;cursor:pointer;
  }
  #ui button:hover{background:rgba(232,184,109,0.18);border-color:#e8b86d;}
</style>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}
</script>
</head>
<body>
<div id="hud">
  <h1>VOXEL GARDEN</h1>
  <div class="sub" id="stat">— voxels | — FPS</div>
  <div class="foot">Click lanterns · Click pagoda floors</div>
</div>
<div id="ui">
  <div class="row"><span>DAY</span><input id="time" type="range" min="0" max="90" step="0.1" value="6"><button id="pause">PAUSE</button></div>
</div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ============================================================
   CONSTANTS
   ============================================================ */
const CX = 72, CZ = 64;              // island footprint half-extents (144 x 128 cells)
const CELL = 1;
const FLOOR_Y = 0;                  // top of the outermost ground layer
const GRID_FLOOR_Y = -1;            // top of one layer below ground

// material buckets  key -> { c:color, m:roughness, metal }
const MATS = {
  vermillion:  { c:0xC73E1D, m:0.55, metal:0.15 },
  vermillionD: { c:0x9A2C12, m:0.55, metal:0.15 },
  gold:        { c:0xE8B86D, m:0.35, metal:0.75 },
  goldD:       { c:0xB8863A, m:0.40, metal:0.6 },
  teak:        { c:0x4A2C1A, m:0.9 },
  teakD:       { c:0x33200F, m:0.9 },
  teakL:       { c:0x5E3B23, m:0.88 },
  jade:        { c:0x2D6A4F, m:0.5,  metal:0.15 },
  jadeL:       { c:0x40916C, m:0.45, metal:0.15 },
  jadeD:       { c:0x1F4D38, m:0.5,  metal:0.15 },
  sakura:      { c:0xFFB7C5, m:0.85 },
  sakuraP:     { c:0xFF8FAB, m:0.85 },
  sakuraL:     { c:0xFFE5EC, m:0.85 },
  stone:       { c:0x9AA0A6, m:0.92 },
  stoneD:      { c:0x7C8288, m:0.92 },
  stoneL:      { c:0xB4B9BD, m:0.92 },
  water:       { c:0x7ED6DF, m:0.15, metal:0.2 },
  waterD:      { c:0x6FC0CE, m:0.15, metal:0.2 },
  moss:        { c:0x606C38, m:0.95 },
  mossD:       { c:0x454E28, m:0.95 },
  bamboo:      { c:0x6B8E23, m:0.9 },
  bambooD:     { c:0x4F6B18, m:0.9 },
  bambooL:     { c:0x8A9F3C, m:0.85 },
  leaf:        { c:0x4A7A3A, m:0.9 },
  leafD:       { c:0x33552A, m:0.9 },
  leafL:       { c:0x6FA049, m:0.9 },
  blossom:     { c:0xFF8FAB, m:0.85 },
  blossomL:    { c:0xFFE5EC, m:0.85 },
  maple:       { c:0xC7521F, m:0.9 },
  mapleD:      { c:0x96300F, m:0.9 },
  willow:      { c:0x8FBC5A, m:0.9 },
  petal:       { c:0xFFC9D6, m:0.9 },
  koiOrange:   { c:0xE8703A, m:0.35, metal:0.2 },
  koiWhite:    { c:0xF2EEE6, m:0.35, metal:0.2 },
  koiPink:     { c:0xF7A0B5, m:0.35, metal:0.2 },
  koiYellow:   { c:0xF2D06A, m:0.35, metal:0.2 },
  lantern:     { c:0xFF9A3C, m:0.4,  metal:0.5 },
  glass:       { c:0x241A12, m:0.8 },
  skyglass:    { c:0xCFE8EF, m:0.2, metal:0.1 },
  eye:         { c:0x2A2016, m:0.8 },
  snow:        { c:0xF4F6F7, m:0.9 }
};

const keys = Object.keys(MATS);
const matList = keys.map(k => MATS[k]);

const renderer = new THREE.WebGLRenderer({ antialias:true, powerPreference:'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9fc4cc, 0.0026);

const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.5, 900);
camera.position.set(-150, 95, -205);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 8, -6);
controls.enableDamping = true;
controls.dampingFactor = 0.055;
controls.minDistance = 40;
controls.maxDistance = 520;
controls.maxPolarAngle = Math.PI * 0.492;
controls.enablePan = true;
controls.panSpeed = 0.6;

/* ---------- lights ---------- */
const hemi = new THREE.HemisphereLight(0xcfe6ee, 0x3a3327, 0.9);
scene.add(hemi);

const sun = new THREE.DirectionalLight(0xfff0d0, 2.2);
sun.position.set(-120, 150, -170);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -190;
sun.shadow.camera.right = 190;
sun.shadow.camera.top = 190;
sun.shadow.camera.bottom = -190;
sun.shadow.camera.near = 20;
sun.shadow.camera.far = 700;
sun.shadow.bias = -0.0016;
sun.shadow.normalBias = 0.35;
scene.add(sun);
scene.add(sun.target);

/* ============================================================
   VOXEL BUCKET
   ============================================================ */
const BoxGeo = new THREE.BoxGeometry(1, 1, 1);

const occupied = new Set();
function getV(x, y, z) { return occupied.has(`${x},${y},${z}`) ? 1 : 0; }

const INSTANCE_CAP = 30000;
const buckets = [];
for (let i = 0; i < keys.length; i++) {
  const m = MATS[keys[i]];
  const mat = new THREE.MeshStandardMaterial({
    color: m.c, roughness: m.m, metalness: m.metal || 0
  });
  const mesh = new THREE.InstancedMesh(BoxGeo, mat, INSTANCE_CAP);
  mesh.count = 0;
  mesh.frustumCulled = false;
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add(mesh);
  buckets.push({ mesh, key: keys[i], count: 0, cap: INSTANCE_CAP });
}

const dummy = new THREE.Object3D();

function addVoxel(x, y, z, matKey, seed) {
  if (getV(x, y, z)) return;
  const mi = keys.indexOf(matKey);
  if (mi < 0) return;
  const b = buckets[mi];
  if (b.count >= b.cap) return;
  occupied.add(`${x},${y},${z}`);
  dummy.position.set(x + 0.5, y + 0.5, z + 0.5);
  dummy.updateMatrix();
  b.mesh.setMatrixAt(b.count, dummy.matrix);
  b.count++;
}

function finalizeBuckets() {
  let total = 0;
  for (const b of buckets) {
    if (b.count === 0) continue;
    b.mesh.count = b.count;
    b.mesh.instanceMatrix.needsUpdate = true;
    total += b.count;
  }
  return total;
}

/* ============================================================
   SCENE CONTENT
   ============================================================ */
function leafBall(cx, cy, cz, r, key) {
  for (let dx = -r; dx <= r; dx++)
    for (let dy = -r; dy <= r; dy++)
      for (let dz = -r; dz <= r; dz++)
        if (dx * dx + dy * dy + dz * dz <= r * r * 1.2)
          addVoxel(cx + dx, cy + dy, cz + dz, key, 0);
}

function trunk(x, y, z, h, key) {
  for (let i = 1; i <= h; i++) addVoxel(x, y + i, z, key, 0);
}

function tree(x, z, type) {
  const y = 0;
  if (type === 'sakura') { trunk(x, y, z, 3, 'teakD'); leafBall(x, 5, z, 2, 'sakura'); leafBall(x, 6, z, 1, 'sakuraL'); }
  else if (type === 'maple') { trunk(x, y, z, 4, 'bamboo'); leafBall(x, 6, z, 2, 'maple'); leafBall(x, 7, z, 1, 'mapleD'); }
  else if (type === 'willow') { trunk(x, y, z, 4, 'teak'); leafBall(x, 6, z, 2, 'willow'); leafBall(x, 7, z, 1, 'leafD'); for (let i = 1; i <= 3; i++) addVoxel(x, 6 - i, z, 'leafD', 0); }
  else { trunk(x, y, z, 6, 'bamboo'); leafBall(x, 8, z, 1, 'bambooL'); }
}

function lantern(x, z) {
  addVoxel(x, 1, z, 'teak', 0);
  addVoxel(x, 2, z, 'teakD', 0);
  addVoxel(x, 3, z, 'lantern', 0);
  addVoxel(x - 1, 3, z, 'glass', 0);
  addVoxel(x + 1, 3, z, 'glass', 0);
  addVoxel(x, 3, z - 1, 'glass', 0);
  addVoxel(x, 3, z + 1, 'glass', 0);
}

function pagoda(cx, cy, cz) {
  for (let s = 0; s < 5; s++) {
    const size = 9 - s * 2;
    const h = size / 2 | 0;
    const y = s * 3;
    for (let dy = 0; dy < 3; dy++)
      for (let dx = -h; dx <= h; dx++)
        for (let dz = -h; dz <= h; dz++)
          addVoxel(cx + dx, cy + y + dy, cz + dz, (dx === -h || dx === h || dz === -h || dz === h) ? 'vermillion' : 'vermillionD', 0);
    const r2 = size + 2;
    const h2 = r2 / 2 | 0;
    for (let dx = -h2; dx <= h2; dx++)
      for (let dz = -h2; dz <= h2; dz++)
        addVoxel(cx + dx, cy + y + 3, cz + dz, (Math.abs(dx) === h2 || Math.abs(dz) === h2) ? 'gold' : 'goldD', 0);
  }
  for (let y = 15; y < 19; y++) addVoxel(cx, cy + y, cz, 'gold', 0);
  addVoxel(cx, cy + 19, cz, 'jade', 0);
}

const POND = 14, PONDZ = -26;
for (let x = -POND; x <= POND; x++)
  for (let z = -POND; z <= POND; z++)
    if (x * x + (z - PONDZ) * (z - PONDZ) <= POND * POND) {
      addVoxel(x, 0, z, 'water', 0);
      addVoxel(x, -1, z, 'waterD', 0);
    }

for (let x = -CX; x <= CX; x++)
  for (let z = -CZ; z <= CZ; z++) {
    if (getV(x, 0, z)) continue;
    const edge = (Math.abs(x) === CX || Math.abs(z) === CZ);
    addVoxel(x, 0, z, edge ? 'stone' : 'moss', 0);
    addVoxel(x, -1, z, 'stone', 0);
  }

pagoda(0, 0, -6);

for (let a = 0; a < Math.PI * 2; a += 0.7)
  lantern(Math.round(10 * Math.cos(a)), Math.round(-6 + 10 * Math.sin(a)));
for (let x = -20; x <= 20; x += 4) lantern(x, -40);

const TREES = [
  [-58, -44, 'sakura'], [56, -38, 'sakura'], [-48, 44, 'sakura'], [50, 48, 'sakura'],
  [-62, -10, 'maple'], [66, -16, 'maple'], [-58, 30, 'maple'], [62, 36, 'maple'],
  [-70, -28, 'willow'], [68, 20, 'willow'], [-64, 0, 'willow']
];
for (const t of TREES) tree(t[0], t[1], t[2]);

function grove(gx, gz) {
  for (let i = 0; i < 9; i++) {
    const dx = ((i * 37) % 7) - 3;
    const dz = ((i * 91) % 7) - 3;
    tree(gx + dx, gz + dz, 'bamboo');
  }
}
grove(-40, -30); grove(42, -32); grove(-42, 34); grove(38, 38);

const totalVoxels = finalizeBuckets();

/* ============================================================
   TIME OF DAY
   ============================================================ */
let timeVal = 6;
function applyTime() {
  const a = (timeVal / 90) * Math.PI;
  const strength = Math.max(0.15, Math.sin(a));
  sun.position.set(170 * Math.cos(a), Math.max(8, 150 * Math.sin(a)), -170 * Math.sin(a));
  sun.intensity = 2.2 * strength;
  hemi.intensity = 0.9 * (0.35 + 0.65 * strength);
  scene.fog.color.copy(new THREE.Color(0x141c20)).lerp(new THREE.Color(0x9fc4cc), strength);
  renderer.setClearColor(scene.fog.color);
}
applyTime();

/* ============================================================
   INTERACTION
   ============================================================ */
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const highlight = new THREE.Mesh(new THREE.BoxGeometry(1.1, 1.1, 1.1), new THREE.MeshBasicMaterial({ color: 0xffea00 }));
highlight.visible = false;
scene.add(highlight);

window.addEventListener('pointerdown', (event) => {
  mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const hits = raycaster.intersectObjects(buckets.map((b) => b.mesh));
  if (hits.length) {
    const p = hits[0].point;
    highlight.position.set(Math.floor(p.x) + 0.5, Math.floor(p.y) + 0.5, Math.floor(p.z) + 0.5);
    highlight.visible = true;
  } else {
    highlight.visible = false;
  }
});

/* ============================================================
   UI
   ============================================================ */
const uiTime = document.getElementById('time');
const btnPause = document.getElementById('pause');
const stat = document.getElementById('stat');
let paused = false;
btnPause.addEventListener('click', () => {
  paused = !paused;
  btnPause.textContent = paused ? 'RESUME' : 'PAUSE';
});
uiTime.addEventListener('input', () => { timeVal = parseFloat(uiTime.value, 10); applyTime(); });

/* ============================================================
   RESIZE
   ============================================================ */
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

/* ============================================================
   RENDER LOOP
   ============================================================ */
const clock = new THREE.Clock();
let frames = 0, last = performance.now();

function animate() {
  requestAnimationFrame(animate);
  if (!paused) {
    timeVal = (timeVal + 0.08) % 90;
    uiTime.value = timeVal.toFixed(1);
    applyTime();
  }
  controls.update();
  renderer.render(scene, camera);
  frames++;
  const now = performance.now();
  if (now - last >= 1000) {
    stat.textContent = `${totalVoxels} voxels | ${frames} FPS`;
    frames = 0;
    last = now;
  }
}
animate();
</script>
</body>
</html>
